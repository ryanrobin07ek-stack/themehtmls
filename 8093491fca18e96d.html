      /* Base Typography & Luxury Design Tokens */
      :root {
        --bg-ivory: var(--theme-aura-color-01);
        --surface-cream: var(--theme-aura-color-02);
        --border-soft: var(--theme-aura-color-03);
        --accent-lime: var(--theme-aura-color-04);
        --text-onyx: var(--theme-aura-color-05);
        --text-muted: var(--theme-aura-color-06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-ivory);
        color: var(--text-onyx);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      h1, h2, h3, .font-editorial {
        font-family: 'Playfair Display', Georgia, serif;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--theme-aura-color-01);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--theme-aura-color-07);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--theme-aura-color-08);
      }

      /* Hide horizontal scroll indicators where appropriate */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Swatch and Active Indicators */
      .swatch-ring {
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .swatch-ring.active {
        box-shadow: 0 0 0 2px var(--theme-aura-color-01), 0 0 0 4px var(--theme-aura-color-05);
      }

      /* Image fallback styling */
      .img-fallback {
        background: linear-gradient(135deg, var(--theme-aura-color-02) 0%, var(--theme-aura-color-09) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Highlight pill token */
      .pill-highlight {
        background-color: var(--accent-lime);
        color: var(--theme-aura-color-05);
        padding: 0.12em 0.55em;
        border-radius: 9999px;
        display: inline-block;
        font-style: italic;
        font-weight: 500;
        line-height: 1.1;
      }

      /* Glass blur surfaces */
      .glass-panel {
        background: var(--theme-aura-color-10);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .glass-dark {
        background: var(--theme-aura-color-11);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      /* Subtle image zoom on card hover */
      .card-zoom:hover .card-img {
        transform: scale(1.04);
      }
      .card-img {
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Smooth route animation container */
      #view-container {
        min-height: 70vh;
      }

      /* Tabular figures for pricing alignment */
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
    </style>

    <script>
      /* =========================================================================

       * ========================================================================= */
      const APP_CONFIG = /*__ESHOP_DATA_auraAppConfig__*/{"BRAND_NAME":"","STORE_CURRENCY":"KES","KES_TO_USD":1,"FREE_SHIPPING_THRESHOLD_KES":0,"DEFAULT_SHIPPING_FEE_KES":0,"SUPPORT_PHONE":"","SUPPORT_EMAIL":"","DEFAULT_TAX_RATE":0};

      // State stores
      let currentCurrency = localStorage.getItem('aura_currency') || 'KES';
      let cart = JSON.parse(localStorage.getItem('aura_cart') || '[]');
      let wishlist = JSON.parse(localStorage.getItem('aura_wishlist') || '[]');
      let appliedDiscount = JSON.parse(localStorage.getItem('aura_discount') || 'null');
      let customerOrders = JSON.parse(localStorage.getItem('aura_orders') || '[]');
      let customerAccount = JSON.parse(localStorage.getItem('aura_account') || JSON.stringify({
        isLoggedIn: false,
        name: "Lilian Wangari",
        email: "lilian.wangari@example.co.ke",
        phone: "+254 712 345 678",
        savedAddresses: [
          { label: "Home", street: "Mimosa Court, Apt 4B", city: "Nairobi - Kilimani", notes: "Gate code 408" },
          { label: "Office", street: "The Oval, 5th Floor", city: "Nairobi - Westlands", notes: "Leave at front reception" }
        ]
      }));

      /* =========================================================================
       * 2. COMPLETE COSMETICS CATALOGUE (Structured, Varied, Multi-Category)
       * ========================================================================= */
      const CATALOGUE = /*__ESHOP_DATA_auraCatalogue__*/[{"id":"skeleton-1","name":"","brand":"","category":"skeleton-category","subcategory":"","priceKES":0,"originalPriceKES":null,"rating":0,"reviewsCount":0,"isPopular":true,"isBestseller":true,"badge":"","image":"","volume":"","finish":"","coverage":"","skinType":"","description":"","benefits":[],"ingredients":"","howToUse":"","shades":[]},{"id":"skeleton-2","name":"","brand":"","category":"skeleton-category","subcategory":"","priceKES":0,"originalPriceKES":null,"rating":0,"reviewsCount":0,"isPopular":true,"isBestseller":true,"badge":"","image":"","volume":"","finish":"","coverage":"","skinType":"","description":"","benefits":[],"ingredients":"","howToUse":"","shades":[]},{"id":"skeleton-3","name":"","brand":"","category":"skeleton-category","subcategory":"","priceKES":0,"originalPriceKES":null,"rating":0,"reviewsCount":0,"isPopular":true,"isBestseller":true,"badge":"","image":"","volume":"","finish":"","coverage":"","skinType":"","description":"","benefits":[],"ingredients":"","howToUse":"","shades":[]},{"id":"skeleton-4","name":"","brand":"","category":"skeleton-category","subcategory":"","priceKES":0,"originalPriceKES":null,"rating":0,"reviewsCount":0,"isPopular":true,"isBestseller":true,"badge":"","image":"","volume":"","finish":"","coverage":"","skinType":"","description":"","benefits":[],"ingredients":"","howToUse":"","shades":[]}];

      /* =========================================================================
       * 3. CATEGORIES & BRANDS REGISTRY
       * ========================================================================= */
      const CATEGORIES = /*__ESHOP_DATA_auraCategories__*/[{"id":"all","name":"","count":4,"description":""},{"id":"skeleton-category","name":"","count":4,"description":""}];

      const BRANDS_LIST = /*__ESHOP_DATA_auraBrands__*/[{"id":"skeleton-brand","name":"","country":"","tagline":"","description":""}];

      /* =========================================================================
       * 4. UTILITIES & FORMATTING
       * ========================================================================= */
      function formatPrice(priceKES) {
        if (currentCurrency === 'USD') {
          const usd = (priceKES * APP_CONFIG.KES_TO_USD).toFixed(2);
          return `$${usd}`;
        }
        return `KSh ${Number(priceKES).toLocaleString('en-KE')}`;
      }

      function toggleCurrency() {
        currentCurrency = currentCurrency === 'KES' ? 'USD' : 'KES';
        localStorage.setItem('aura_currency', currentCurrency);
        const label = document.getElementById('currency-label');
        if (label) label.textContent = currentCurrency === 'KES' ? 'KES (KSh)' : 'USD ($)';
        renderCurrentRoute();
        renderCartUI();
        showToast(`Currency set to ${currentCurrency}`);
      }

      function showToast(message, isAccent = true) {
        const toast = document.getElementById('toast-notification');
        const msgEl = document.getElementById('toast-message');
        const iconEl = document.getElementById('toast-icon');
        if (!toast || !msgEl) return;
        msgEl.textContent = message;
        iconEl.textContent = isAccent ? '✦' : '✓';
        toast.classList.remove('translate-y-24', 'opacity-0');
        setTimeout(() => {
          toast.classList.add('translate-y-24', 'opacity-0');
        }, 2600);
      }

      function saveCart() {
        localStorage.setItem('aura_cart', JSON.stringify(cart));
        renderCartUI();
      }

      function saveWishlist() {
        localStorage.setItem('aura_wishlist', JSON.stringify(wishlist));
        updateWishlistBadge();
      }

      function updateWishlistBadge() {
        const count = wishlist.length;
        const b1 = document.getElementById('wishlist-badge');
        const b2 = document.getElementById('mobile-wishlist-count');
        [b1, b2].forEach(b => {
          if (!b) return;
          if (count > 0) {
            b.textContent = count;
            b.classList.remove('hidden');
          } else {
            b.classList.add('hidden');
          }
        });
      }

      function toggleWishlist(productId) {
        const idx = wishlist.indexOf(productId);
        const prod = CATALOGUE.find(p => p.id === productId);
        if (idx > -1) {
          wishlist.splice(idx, 1);
          showToast(`Removed from wishlist`, false);
        } else {
          wishlist.push(productId);
          showToast(`Saved to your wishlist: ${prod ? prod.name.slice(0, 24) + '...' : ''}`);
        }
        saveWishlist();
        // Re-render heart buttons
        document.querySelectorAll(`.wishlist-btn-${productId}`).forEach(btn => {
          btn.classList.toggle('text-[#D96843]', wishlist.includes(productId));
          btn.classList.toggle('fill-[#D96843]', wishlist.includes(productId));
        });
        if (window.location.hash.startsWith('#wishlist')) {
          renderWishlistView();
        }
      }

      function addToCart(productId, selectedShadeName = null, qty = 1, openDrawer = true) {
        const product = CATALOGUE.find(p => p.id === productId);
        if (!product) return;

        const shade = selectedShadeName || (product.shades ? product.shades[0].name : null);
        const existingIndex = cart.findIndex(item => item.id === productId && item.shade === shade);

        if (existingIndex > -1) {
          cart[existingIndex].qty += qty;
        } else {
          cart.push({
            id: product.id,
            name: product.name,
            brand: product.brand,
            priceKES: product.priceKES,
            image: product.image,
            shade: shade,
            qty: qty
          });
        }

        saveCart();
        showToast(`Added to bag: ${product.name.slice(0, 22)}...`);
        if (openDrawer) {
          openCartDrawer();
        }
      }

      function updateCartQty(index, newQty) {
        if (newQty <= 0) {
          cart.splice(index, 1);
        } else {
          cart[index].qty = newQty;
        }
        saveCart();
      }

      function removeCartItem(index) {
        cart.splice(index, 1);
        saveCart();
      }

      function applyPromoCode() {
        const input = document.getElementById('cart-promo-input');
        const feedback = document.getElementById('promo-feedback');
        if (!input || !feedback) return;
        const code = input.value.trim().toUpperCase();

        if (code === 'GLOW10') {
          appliedDiscount = { code: 'GLOW10', percent: 10, label: '10% New Radiance Discount' };
          feedback.textContent = '✓ GLOW10 Applied: 10% off your entire ritual!';
          feedback.className = 'text-[11px] mt-1 font-medium text-emerald-600 block';
        } else if (code === 'FREESHIP') {
          appliedDiscount = { code: 'FREESHIP', freeShipping: true, label: 'Complimentary Express Shipping' };
          feedback.textContent = '✓ FREESHIP Applied: Free shipping on this order!';
          feedback.className = 'text-[11px] mt-1 font-medium text-emerald-600 block';
        } else {
          feedback.textContent = 'Invalid promo code. Try GLOW10 or FREESHIP';
          feedback.className = 'text-[11px] mt-1 font-medium text-[#D96843] block';
          appliedDiscount = null;
        }
        localStorage.setItem('aura_discount', JSON.stringify(appliedDiscount));
        renderCartUI();
      }

      /* =========================================================================
       * 5. DRAWER & MODAL CONTROLLERS
       * ========================================================================= */
      function openCartDrawer() {
        const drawer = document.getElementById('cart-drawer');
        const backdrop = document.getElementById('cart-drawer-backdrop');
        if (!drawer || !backdrop) return;
        renderCartUI();
        backdrop.classList.remove('hidden');
        setTimeout(() => {
          backdrop.classList.remove('opacity-0');
          drawer.classList.remove('translate-x-full');
        }, 10);
      }

      function closeCartDrawer() {
        const drawer = document.getElementById('cart-drawer');
        const backdrop = document.getElementById('cart-drawer-backdrop');
        if (!drawer || !backdrop) return;
        drawer.classList.add('translate-x-full');
        backdrop.classList.add('opacity-0');
        setTimeout(() => {
          backdrop.classList.add('hidden');
        }, 300);
      }

      function openSearchModal() {
        const modal = document.getElementById('search-modal');
        if (!modal) return;
        modal.classList.remove('hidden');
        document.getElementById('global-search-input')?.focus();
      }

      function closeSearchModal() {
        const modal = document.getElementById('search-modal');
        if (!modal) return;
        modal.classList.add('hidden');
      }

      function fillSearch(term) {
        const input = document.getElementById('global-search-input');
        if (!input) return;
        input.value = term;
        handleLiveSearch(term);
      }

      function handleLiveSearch(query) {
        const container = document.getElementById('search-results-container');
        if (!container) return;
        const q = query.trim().toLowerCase();

        if (q.length < 2) {
          container.innerHTML = `<p class="text-xs text-[#999084] text-center py-6"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>`;
          return;
        }

        const matches = CATALOGUE.filter(p => 
          p.name.toLowerCase().includes(q) ||
          p.brand.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          p.description.toLowerCase().includes(q) ||
          (p.ingredients && p.ingredients.toLowerCase().includes(q))
        );

        if (matches.length === 0) {
          container.innerHTML = `
            <div class="text-center py-8 space-y-2">
              <p class="text-sm font-semibold text-[#141210]">No formulas found matching "${query}"</p>
              <p class="text-xs text-[#999084]"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
              <a href="#shop" onclick="closeSearchModal()" class="inline-block mt-3 px-4 py-2 bg-[#141210] text-[#FAF8F5] rounded-full text-xs font-medium"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="space-y-3">
            <p class="text-xs font-bold uppercase tracking-wider text-[#999084]">${matches.length} Results Found</p>
            ${matches.map(p => `
              <div class="flex items-center justify-between gap-4 py-2 hover:bg-[#F5EFEB] rounded-xl px-2 transition-colors">
                <a href="#product/${p.id}" onclick="closeSearchModal()" class="flex items-center gap-3 flex-1 min-w-0">
                  <img src="${p.image}" alt="${p.name}" class="w-12 h-12 object-cover rounded-lg bg-[#EFE7DE] shrink-0" onerror="this.src='https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=150&q=80'" />
                  <div class="truncate">
                    <p class="text-[11px] uppercase tracking-wider text-[#999084] font-semibold">${p.brand}</p>
                    <p class="text-sm font-medium text-[#141210] truncate">${p.name}</p>
                    <p class="text-xs font-bold text-[#141210] tabular-nums">${formatPrice(p.priceKES)}</p>

        if (headerCount) headerCount.textContent = totalItems;
        if (mobileCount) mobileCount.textContent = totalItems;
        if (drawerCount) drawerCount.textContent = `${totalItems} ${totalItems === 1 ? 'item' : 'items'}`;

        const itemsContainer = document.getElementById('cart-items-container');
        if (!itemsContainer) return;

        if (cart.length === 0) {
          itemsContainer.innerHTML = `
            <div class="text-center py-16 space-y-4">
              <div class="w-16 h-16 bg-[#F5EFEB] rounded-full flex items-center justify-center mx-auto text-[#999084]">

              </div>

              <p class="text-xs text-[#999084] max-w-xs mx-auto"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>

            </div>
          `;
          updateCartTotals(0, 0);
          lucide.createIcons();
          return;
        }

        itemsContainer.innerHTML = cart.map((item, index) => `
          <div class="flex items-center gap-3.5 bg-white p-3 rounded-2xl border border-[#EAE3D6] shadow-sm">
            <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded-xl bg-[#F5EFEB] shrink-0" />

              <p class="text-xs font-bold text-[#141210] mt-1 tabular-nums">${formatPrice(item.priceKES)}</p>
            </div>
            <div class="flex flex-col items-end justify-between self-stretch shrink-0">
              <button onclick="removeCartItem(${index})" aria-label="Remove item" class="text-[#999084] hover:text-[#D96843] p-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
              <div class="flex items-center border border-[#EAE3D6] rounded-full overflow-hidden bg-[#FAF8F5]">
                <button onclick="updateCartQty(${index}, ${item.qty - 1})" class="px-2 py-0.5 text-xs text-[#5E574E] hover:bg-[#EAE3D6] font-bold"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></button>
                <span class="px-2 text-xs font-semibold text-[#141210] tabular-nums">${item.qty}</span>
                <button onclick="updateCartQty(${index}, ${item.qty + 1})" class="px-2 py-0.5 text-xs text-[#5E574E] hover:bg-[#EAE3D6] font-bold"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></button>
              </div>
            </div>
          </div>
        `).join('');

        const subtotal = cart.reduce((acc, item) => acc + (item.priceKES * item.qty), 0);
        let discount = 0;
        if (appliedDiscount && appliedDiscount.percent) {
          discount = subtotal * (appliedDiscount.percent / 100);
        }
        updateCartTotals(subtotal, discount);
        lucide.createIcons();
      }

      function updateCartTotals(subtotal, discount) {
        const subtotalEl = document.getElementById('cart-subtotal');
        const discountRow = document.getElementById('cart-discount-row');
        const discountEl = document.getElementById('cart-discount');
        const shippingEl = document.getElementById('cart-shipping');
        const totalEl = document.getElementById('cart-total');

        const progressBar = document.getElementById('shipping-progress-bar');
        const progressPercent = document.getElementById('shipping-progress-percent');
        const progressText = document.getElementById('shipping-progress-text');

        if (subtotalEl) subtotalEl.textContent = formatPrice(subtotal);

        if (discount > 0) {
          if (discountRow) discountRow.classList.remove('hidden');
          if (discountEl) discountEl.textContent = `-${formatPrice(discount)}`;
        } else {
          if (discountRow) discountRow.classList.add('hidden');
        }

        // Free shipping calculation
        const threshold = APP_CONFIG.FREE_SHIPPING_THRESHOLD_KES;
        const pct = Math.min(100, Math.round((subtotal / threshold) * 100));
        if (progressBar) progressBar.style.width = `${pct}%`;
        if (progressPercent) progressPercent.textContent = `${pct}%`;

        let shippingCost = subtotal >= threshold || (appliedDiscount && appliedDiscount.freeShipping) ? 0 : (subtotal > 0 ? APP_CONFIG.DEFAULT_SHIPPING_FEE_KES : 0);
        if (shippingEl) {
          shippingEl.textContent = shippingCost === 0 ? (subtotal > 0 ? "Free (Nairobi Metro)" : "KSh 0") : formatPrice(shippingCost);
          if (shippingCost === 0 && subtotal > 0) shippingEl.className = "font-bold text-emerald-700";
        }

        if (progressText) {
          if (subtotal >= threshold) {
            progressText.textContent = "✓ You've unlocked Complimentary Nairobi Delivery!";
          } else {
            const diff = threshold - subtotal;
            progressText.textContent = `Add ${formatPrice(diff)} more for Free Nairobi Delivery`;
          }
        }

        const grandTotal = Math.max(0, subtotal - discount + shippingCost);
        if (totalEl) totalEl.textContent = formatPrice(grandTotal);
      }

              <!-- Injected by filter logic -->
            </div>
          </div>
        `;

        renderFilteredShopProducts();
      }

      function setFilterCategory(catId) {
        currentFilterCategory = catId;
        renderShopView();
      }

      function setFilterBrand(brandName) {
        currentFilterBrand = brandName;
        renderFilteredShopProducts();
      }

      function setSortOption(sortOpt) {
        currentSortOption = sortOpt;
        renderFilteredShopProducts();
      }

      function renderFilteredShopProducts() {
        const grid = document.getElementById('shop-products-grid');
        if (!grid) return;

        let list = [...CATALOGUE];

        if (currentFilterCategory !== 'all') {
          list = list.filter(p => p.category === currentFilterCategory);
        }

        if (currentFilterBrand !== 'all') {
          list = list.filter(p => p.brand.toLowerCase() === currentFilterBrand.toLowerCase());
        }

        // Sorting logic
        if (currentSortOption === 'price-asc') {
          list.sort((a, b) => a.priceKES - b.priceKES);
        } else if (currentSortOption === 'price-desc') {
          list.sort((a, b) => b.priceKES - a.priceKES);
        } else if (currentSortOption === 'rating') {
          list.sort((a, b) => b.rating - a.rating);
        }

        if (list.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full py-16 text-center space-y-3">
              <p class="font-editorial text-2xl font-bold text-[#141210]"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:81%"></span></p>

      function initiatePaymentFlow(total) {
        const btn = document.getElementById('pay-confirm-btn');
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = `<span class="animate-spin mr-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span> Initiating ${selectedPaymentMethod.toUpperCase()} Session...`;
        }

        const name = document.getElementById('checkout-name')?.value || "Guest Client";
        const email = document.getElementById('checkout-email')?.value || "client@example.com";
        const phone = document.getElementById('checkout-phone')?.value || "+254 700 000 000";
        const city = document.getElementById('checkout-city')?.value || "Nairobi";
        const address = document.getElementById('checkout-address')?.value || "Nairobi";

        // Generate authentic Kenyan simulated order
        const orderId = 'AL-' + Math.floor(100000 + Math.random() * 900000);
        const mpesaRef = 'MPESA-' + Math.random().toString(36).substring(2, 10).toUpperCase();

        setTimeout(() => {
          const newOrder = {
            id: orderId,
            date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
            totalKES: total,
            currency: currentCurrency,
            paymentMethod: selectedPaymentMethod,
            paymentReference: selectedPaymentMethod === 'mpesa' ? mpesaRef : ('PAYSTACK-REF-' + orderId),
            customer: { name, email, phone, city, address },
            items: [...cart],
            status: "Order Confirmed — Preparing Botanical Shipment"
          };

          customerOrders.unshift(newOrder);
          localStorage.setItem('aura_orders', JSON.stringify(customerOrders));

          // Clear cart
          cart = [];
          localStorage.setItem('aura_cart', '[]');
          renderCartUI();

          window.location.hash = `#order-success/${orderId}`;
        }, 1800);
      }

      /* =========================================================================
       * 8. GSAP ANIMATIONS & MOTION CONTROLLER
       * ========================================================================= */
      function initGSAPAnimations() {
        // Accessibility check: do not animate if user prefers reduced motion
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          return;
        }

        if (typeof gsap === 'undefined') return;

        // Animate hero headline and tags smoothly on entrance
        const heroHeading = document.querySelector('h1');
        if (heroHeading) {
          gsap.fromTo(heroHeading, 
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }
          );
        }

        // Animate cards on route entry
        const cards = document.querySelectorAll('.card-zoom');
        if (cards.length > 0) {
          gsap.fromTo(cards,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, stagger: 0.05, ease: "power2.out" }
          );
        }
      }
