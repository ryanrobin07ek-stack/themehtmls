  <!-- Schema.org Structured Data -->
  

  <style>
    :root {
      --bg-dark: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01);
      --bg-surface: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-02);
      --bg-surface-elevated: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-03);
      --bg-parchment: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-04);
      --bg-parchment-card: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
      --gold-primary: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-06);
      --gold-light: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-07);
      --gold-dark: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-08);
      --terracotta: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-09);
      --burgundy: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-10);
      --text-light: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-11);
      --text-muted: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-12);
      --text-dark: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-13);
      --text-dark-muted: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-14);
      --border-subtle: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-15);
      --border-light-subtle: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-16);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-brand: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Space Mono', monospace;
      --ease-lux: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.6;
      background: radial-gradient(circle at 50% 0%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-17) 0%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01) 70%);
    }

    /* Selection */
    ::selection {
      background: var(--gold-primary);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-18);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-primary);
    }

    /* Typography */
    .font-display { font-family: var(--font-display); }
    .font-brand { font-family: var(--font-brand); }
    .font-body { font-family: var(--font-body); }
    .font-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Custom Cursor (Desktop only) */
    @media (hover: hover) and (pointer: fine) {
      .cursor-dot {
        position: fixed;
        top: 0;
        left: 0;
        width: 8px;
        height: 8px;
        background: var(--gold-primary);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: transform 0.1s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
      }
      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        width: 38px;
        height: 38px;
        border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-19);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: transform 0.18s var(--ease-lux), width 0.3s ease, height 0.3s ease, border-color 0.3s ease;
      }
      .cursor-active .cursor-ring {
        width: 64px;
        height: 64px;
        border-color: var(--gold-light);
        background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-20);
      }
      .cursor-active .cursor-dot {
        transform: translate(-50%, -50%) scale(1.6);
      }
    }

    @media (hover: none) or (pointer: coarse) {
      .cursor-dot, .cursor-ring { display: none !important; }
    }

    /* Navigation styling */
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: all 0.4s var(--ease-lux);
      border-bottom: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-21);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-22);
    }
    .nav-header.scrolled {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-23);
      border-bottom-color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-24);
      box-shadow: 0 10px 30px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-25);
    }
    .nav-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .brand-wordmark {
      font-family: var(--font-brand);
      font-size: 1.45rem;
      letter-spacing: 0.28em;
      color: var(--gold-primary);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      text-transform: uppercase;
    }
    .brand-wordmark span {
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
      font-weight: 300;
      letter-spacing: 0.22em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }
    .nav-link {
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-26);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      transition: color 0.25s ease;
      position: relative;
      white-space: nowrap;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--gold-primary);
      transition: width 0.3s var(--ease-lux);
    }
    .nav-link:hover {
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
    }
    .nav-link:hover::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 0.75rem 1.6rem;
      font-family: var(--font-body);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.3s var(--ease-lux);
      border: 1px solid transparent;
      outline: none;
    }
    .btn:focus-visible {
      box-shadow: 0 0 0 3px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-27);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-28) 0%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-06) 50%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-29) 100%);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01);
      box-shadow: 0 4px 18px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-24);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-30);
      filter: brightness(1.08);
    }

    .btn-outline-gold {
      background: transparent;
      border-color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-19);
      color: var(--gold-light);
    }
    .btn-outline-gold:hover {
      border-color: var(--gold-primary);
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-31);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
      transform: translateY(-2px);
    }

    .btn-ghost {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-32);
      border-color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-33);
      color: var(--text-light);
    }
    .btn-ghost:hover {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-34);
      border-color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-35);
    }

    .btn-sm {
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }

    /* Cart Badge & Counter */
    .cart-btn {
      position: relative;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-36);
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-24);
      color: var(--gold-light);
      padding: 0.55rem 0.9rem;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .cart-count {
      background: var(--gold-primary);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Mobile Navigation Drawer */
    .mobile-nav-toggle {
      display: none;
      background: transparent;
      border: none;
      color: var(--gold-primary);
      cursor: pointer;
      padding: 0.4rem;
    }
    @media (max-width: 992px) {
      .nav-links { display: none; }
      .mobile-nav-toggle { display: block; }
      .nav-container { padding: 0.8rem 1.2rem; }
    }

    .mobile-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 85%;
      max-width: 400px;
      height: 100vh;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-37);
      border-left: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-15);
      z-index: 1000;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: right 0.45s var(--ease-lux);
      overflow-y: auto;
    }
    .mobile-drawer.open {
      right: 0;
      box-shadow: -10px 0 50px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-38);
    }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-39);
      backdrop-filter: blur(4px);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Section Architecture — Breaking the rectangle */
    .section-wrapper {
      position: relative;
      padding: 6.5rem 2rem;
      max-width: 1440px;
      margin: 0 auto;
    }
    .section-full {
      position: relative;
      padding: 6.5rem 0;
      width: 100%;
    }

    .diagonal-divider-top {
      clip-path: polygon(0 4vw, 100% 0, 100% 100%, 0 100%);
    }
    .diagonal-divider-bottom {
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 4vw), 0 100%);
    }

    .arch-frame {
      border-radius: 260px 260px 16px 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-40);
      box-shadow: 0 20px 60px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-41);
    }
    .oval-mask {
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      overflow: hidden;
    }

    /* Hero Section */
    .hero-section {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8rem 2rem 5rem 2rem;
    }
    .hero-bg-container {
      position: absolute;
      inset: -5%;
      width: 110%;
      height: 110%;
      z-index: 1;
      overflow: hidden;
    }
    .hero-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.68) contrast(1.08);
      transform: scale(1.08);
      will-change: transform;
    }
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-42) 0%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-43) 75%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01) 100%),
                  linear-gradient(180deg, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-44) 0%, transparent 40%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-45) 90%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01) 100%);
      z-index: 2;
    }
    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      width: 100%;
      text-align: center;
      margin-top: 2rem;
    }

    .hero-eyebrow {
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 1rem;
    }
    .hero-eyebrow::before, .hero-eyebrow::after {
      content: '';
      width: 36px;
      height: 1px;
      background: var(--gold-primary);
      opacity: 0.6;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 6.5vw, 6.2rem);
      line-height: 1.05;
      font-weight: 400;
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
      margin-bottom: 1.8rem;
      text-wrap: balance;
      letter-spacing: -0.015em;
    }
    .hero-title em {
      font-style: italic;
      color: var(--gold-light);
      font-weight: 400;
    }

    .hero-subtitle {
      font-size: clamp(1rem, 1.8vw, 1.22rem);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-46);
      max-width: 680px;
      margin: 0 auto 3rem auto;
      font-weight: 300;
      line-height: 1.7;
    }

    /* Asymmetric Hero Booking Bar */
    .hero-booking-bar {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-47);
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-40);
      border-radius: 8px;
      padding: 1.25rem 1.8rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-48);
      display: grid;
      grid-template-columns: 1.3fr 1fr 1fr 1fr auto;
      gap: 1.2rem;
      align-items: center;
      text-align: left;
      margin: 0 auto;
      max-width: 1100px;
      position: relative;
    }
    @media (max-width: 1024px) {
      .hero-booking-bar {
        grid-template-columns: 1fr 1fr;
        padding: 1.5rem;
      }
      .hero-booking-bar .book-action {
        grid-column: span 2;
      }
    }
    @media (max-width: 640px) {
      .hero-booking-bar {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .hero-booking-bar .book-action {
        grid-column: span 1;
      }
    }

    .booking-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .booking-label {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-primary);
      font-weight: 600;
    }
    .booking-input, .booking-select {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-32);
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-15);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
      padding: 0.65rem 0.85rem;
      border-radius: 4px;
      font-size: 0.88rem;
      font-family: var(--font-body);
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
      width: 100%;
    }
    .booking-input:focus, .booking-select:focus {
      border-color: var(--gold-primary);
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-49);
    }
    .booking-select option {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-02);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
    }

    /* Locations Grid & Tabs */
    .location-card-editorial {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-15);
      background: var(--bg-surface);
      transition: transform 0.4s var(--ease-lux), box-shadow 0.4s var(--ease-lux);
      display: flex;
      flex-direction: column;
    }
    .location-card-editorial:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 50px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-25);
      border-color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-27);
    }
    .location-card-img-wrap {
      position: relative;
      height: 380px;
      overflow: hidden;
    }
    .location-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s var(--ease-lux);
    }
    .location-card-editorial:hover .location-card-img {
      transform: scale(1.06);
    }
    .location-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-45) 100%);
    }
    .location-tag {
      position: absolute;
      top: 1.2rem;
      left: 1.2rem;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-50);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      color: var(--gold-light);
      padding: 0.35rem 0.8rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 3px;
    }
    .location-content {
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    /* Asymmetric Storytelling / Editorial Split */
    .story-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 4.5rem;
      align-items: center;
    }
    @media (max-width: 992px) {
      .story-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
    }
    .image-composition {
      position: relative;
    }
    .image-primary {
      width: 88%;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-24);
      box-shadow: 0 20px 50px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-25);
    }
    .image-secondary-floating {
      position: absolute;
      bottom: -12%;
      right: 0;
      width: 48%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--bg-dark);
      box-shadow: 0 25px 50px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-39);
    }

    /* Menu / Culinary System */
    .menu-tabs {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      overflow-x: auto;
      padding-bottom: 0.75rem;
      margin-bottom: 2.5rem;
      scrollbar-width: none;
    }
    .menu-tabs::-webkit-scrollbar { display: none; }

    .menu-tab-btn {
      padding: 0.65rem 1.4rem;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-51);
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-15);
      color: var(--text-muted);
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .menu-tab-btn.active {
      background: var(--gold-primary);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01);
      font-weight: 700;
      border-color: var(--gold-primary);
      box-shadow: 0 4px 14px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-24);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 2rem;
    }
    @media (max-width: 640px) {
      .menu-grid { grid-template-columns: 1fr; }
    }

    .menu-item-card {
      background: var(--bg-surface);
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-52);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s var(--ease-lux), border-color 0.3s ease;
    }
    .menu-item-card:hover {
      transform: translateY(-4px);
      border-color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-30);
    }
    .menu-item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.4rem;
    }
    .menu-item-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
    }
    .menu-item-price {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      color: var(--gold-light);
      font-weight: 700;
      white-space: nowrap;
    }
    .menu-item-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    .menu-item-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.74rem;
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-53);
      border-top: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-36);
      padding-top: 0.85rem;
    }

    /* Modal Framework */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-54);
      backdrop-filter: blur(16px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-lux);
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-window {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-55);
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-56);
      border-radius: 10px;
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2.5rem;
      position: relative;
      box-shadow: 0 30px 80px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-57);
      transform: translateY(20px) scale(0.98);
      transition: transform 0.4s var(--ease-lux);
    }
    .modal-backdrop.active .modal-window {
      transform: translateY(0) scale(1);
    }
    .modal-close {
      position: absolute;
      top: 1.4rem;
      right: 1.4rem;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-58);
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-34);
      color: var(--text-light);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s ease;
    }
    .modal-close:hover {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-15);
      color: var(--gold-light);
    }

    /* Cart Slide-Over Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      max-width: 460px;
      height: 100vh;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-59);
      border-left: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-40);
      z-index: 2100;
      padding: 2rem 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: right 0.45s var(--ease-lux);
      box-shadow: -15px 0 60px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-57);
    }
    .cart-drawer.open {
      right: 0;
    }

    .cart-items-scroll {
      flex-grow: 1;
      overflow-y: auto;
      margin: 1.5rem 0;
      padding-right: 0.5rem;
    }
    .cart-item-row {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-21);
    }

    /* Live Tracking Bar */
    .tracking-step {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      position: relative;
      padding-bottom: 1.4rem;
    }
    .tracking-step:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 14px;
      top: 30px;
      bottom: 0;
      width: 2px;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-15);
    }
    .tracking-step.done::after {
      background: var(--gold-primary);
    }
    .tracking-bullet {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-32);
      border: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-40);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      z-index: 2;
    }
    .tracking-step.active .tracking-bullet {
      background: var(--gold-primary);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01);
      box-shadow: 0 0 15px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-60);
    }
    .tracking-step.done .tracking-bullet {
      background: var(--gold-dark);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
    }

    /* Mobile Sticky Bottom Bar */
    .mobile-bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 90;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-61);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-24);
      padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom, 0px)) 1rem;
      justify-content: space-around;
      align-items: center;
    }
    @media (max-width: 768px) {
      .mobile-bottom-bar { display: flex; }
      body { padding-bottom: 70px; }
    }
    .mobile-bar-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .mobile-bar-btn.active, .mobile-bar-btn:hover {
      color: var(--gold-light);
    }

    /* Preloader */
    .preloader {
      position: fixed;
      inset: 0;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-01);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.8s var(--ease-lux), visibility 0.8s;
    }
    .preloader.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .preloader-emblem {
      font-family: var(--font-brand);
      font-size: 2.5rem;
      color: var(--gold-primary);
      letter-spacing: 0.3em;
      position: relative;
    }
    .preloader-line {
      width: 140px;
      height: 1px;
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-40);
      position: relative;
      overflow: hidden;
    }
    .preloader-line::after {
      content: '';
      position: absolute;
      left: -100%;
      top: 0;
      width: 100%;
      height: 100%;
      background: var(--gold-light);
      animation: loadSlide 1.5s infinite var(--ease-lux);
    }
    @keyframes loadSlide {
      0% { left: -100%; }
      50% { left: 0%; }
      100% { left: 100%; }
    }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      top: 5.5rem;
      right: 1.5rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      pointer-events: none;
    }
    .toast {
      background: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-62);
      border: 1px solid var(--gold-primary);
      color: var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-05);
      padding: 0.85rem 1.4rem;
      border-radius: 6px;
      box-shadow: 0 10px 30px var(--theme-aurelia-grand-luxury-hotels-stays-culinary-destinations-color-41);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      pointer-events: auto;
      transform: translateX(120%);
      transition: transform 0.35s var(--ease-lux);
    }
    .toast.show {
      transform: translateX(0);
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

      // Check if GSAP is loaded
      if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
        console.warn("GSAP/ScrollTrigger CDN unavailable; standard graceful CSS flow active.");
        return;
      }

      // Check reduced motion
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced) return;

      gsap.registerPlugin(ScrollTrigger);

      // 1. Hero Background Parallax Scaling
      gsap.to('#heroBgImg', {
        yPercent: 20,
        scale: 1.15,
        ease: 'none',
        scrollTrigger: {
          trigger: '#heroSection',
          start: 'top top',
          end: 'bottom top',
          scrub: true
        }
      });

        duration: 1.2,
        ease: 'power3.out',

        y: -30,
        ease: 'none',

          trigger: '#philosophy',
          start: 'top bottom',
          end: 'bottom top',
          scrub: 1
        }
      });

        y: 60,
        opacity: 0,
        stagger: 0.2,
        duration: 1,
        ease: 'power2.out',
        scrollTrigger: {
          trigger: '#destinations',
          start: 'top 70%'
        }
      });
    }

    // --- 5. CUSTOM CURSOR TREATMENT ---
    function initCustomCursor() {
      const dot = document.getElementById('cursorDot');
      const ring = document.getElementById('cursorRing');
      if (!dot || !ring) return;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
        ring.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
      }, { passive: true });

      // Interactive hover cues
      const interactiveEls = document.querySelectorAll('button, a, input, select, .menu-item-card, .location-card-editorial');
      interactiveEls.forEach(el => {
        el.addEventListener('mouseenter', () => document.body.classList.add('cursor-active'));
        el.addEventListener('mouseleave', () => document.body.classList.remove('cursor-active'));
      });
    }

      const target = document.getElementById(id);
      if (target) {

        window.scrollTo({ top: targetPos, behavior: 'smooth' });
      }
    }

    function advanceSimulatedKitchenStatus() {
      let current = AppState.liveOrderTracking.step;
      if (current < 6) {
        current++;
        AppState.liveOrderTracking.step = current;

        for (let i = 1; i <= 6; i++) {
          const stepEl = document.getElementById(`tstep${i}`);
          if (!stepEl) continue;
          stepEl.className = 'tracking-step';
          if (i < current) {
            stepEl.classList.add('done');
            stepEl.querySelector('.tracking-bullet').textContent = '✓';
          } else if (i === current) {
            stepEl.classList.add('active');
            stepEl.querySelector('.tracking-bullet').textContent = `${i}`;
          } else {
            stepEl.querySelector('.tracking-bullet').textContent = `${i}`;
          }
        }

        if (current === 6) {
          showToast("Order Delivered! Butler has arrived at your suite.");
        } else {
          showToast(`Order Status Updated: Step ${current} of 6`);
        }
      } else {
        showToast("Order is already completed and delivered.");
      }
    }

    function advanceBookingToStep3() {
      const name = document.getElementById('guestFullName').value.trim();
      const email = document.getElementById('guestEmail').value.trim();
      const phone = document.getElementById('guestPhone').value.trim();

      if (!name || !email) {
        showToast("Please complete your Full Name and Email Address.");
        return;
      }

      AppState.bookingDraft.guest = {
        name,
        email,
        phone,
        notes: document.getElementById('guestSpecialNotes').value.trim()
      };

      AppState.bookingDraft.addons = {
        transfer: document.getElementById('addonTransfer').checked,
        champagne: document.getElementById('addonChampagne').checked,
        credit: document.getElementById('addonCredit').checked
      };

      // Calculate nights
      const inDate = new Date(AppState.bookingDraft.checkIn);
      const outDate = new Date(AppState.bookingDraft.checkOut);
      const diffTime = Math.max(1, outDate - inDate);
      const nights = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));

      const roomPrice = AppState.bookingDraft.room.price * nights;
      let addonPrice = 0;
      if (AppState.bookingDraft.addons.transfer) addonPrice += 480;
      if (AppState.bookingDraft.addons.champagne) addonPrice += 390;
      if (AppState.bookingDraft.addons.credit) addonPrice += (200 * nights);

      const subtotal = roomPrice + addonPrice;
      const taxes = Math.round(subtotal * 0.15);
      const grandTotal = subtotal + taxes;

      // Populate summary
      document.getElementById('summarySuiteName').textContent = `${AppState.bookingDraft.room.name} (${AURELIA_LOCATIONS[AppState.bookingDraft.propertyId].name})`;
      document.getElementById('summaryDates').textContent = `${AppState.bookingDraft.checkIn} to ${AppState.bookingDraft.checkOut} (${nights} Nights)`;
      document.getElementById('summaryGuests').textContent = `${AppState.bookingDraft.guests} Guests`;
      document.getElementById('summaryBaseRate').textContent = `€${roomPrice.toLocaleString()}`;
      document.getElementById('summaryAddons').textContent = `€${addonPrice.toLocaleString()}`;
      document.getElementById('summaryTaxes').textContent = `€${taxes.toLocaleString()}`;
      document.getElementById('summaryTotal').textContent = `€${grandTotal.toLocaleString()}`;

      document.getElementById('bookingStep1').style.display = 'none';
      document.getElementById('bookingStep2').style.display = 'none';
      document.getElementById('bookingStep3').style.display = 'block';
      document.getElementById('bookingStepNum').textContent = '3';
      document.getElementById('bookingStepTitle').textContent = 'Review Itinerary & Guarantee Payment';
    }

    function executeRoomBookingPayment() {
      const payMethod = document.querySelector('input[name="payMethod"]:checked').value;
      const btn = document.getElementById('btnConfirmPay');
      btn.disabled = true;
      btn.textContent = "Authorizing Guarantee...";

      // Generate verified reference code
      const refCode = `AUR-RES-2026-${Math.floor(1000 + Math.random() * 9000)}`;

      if (payMethod === 'paystack' && typeof PaystackPop !== 'undefined') {
        // Attempt Paystack popup flow
        try {
          const handler = PaystackPop.setup({
            key: 'pk_test_aurelia_hospitality_sandbox_key', // Configurable public key
            email: AppState.bookingDraft.guest.email,
            amount: 50000, // Pre-authorization test amount in kobo/cents
            currency: 'NGN', // Paystack standard demo
            ref: refCode,
            callback: function(response) {
              completeReservationSuccess(refCode);
            },
            onClose: function() {
              btn.disabled = false;
              btn.textContent = "Confirm Reservation & Guarantee";
              showToast("Payment window closed. You may select Sandbox Guarantee.");
            }
          });
          handler.openIframe();
          return;
        } catch (e) {
          console.warn("Paystack live popup requires merchant public key. Falling back to VIP Sandbox Guarantee.", e);
        }
      }

      // VIP Sandbox Guarantee Flow
      setTimeout(() => {
        completeReservationSuccess(refCode);
      }, 1000);
    }

    // --- 14. BACKEND INTEGRATION CONTRACT & POLICIES MODALS ---
    function openBackendContractModal() {
      document.getElementById('backendContractModal').classList.add('active');
    }

    function closeBackendContractModal() {
      document.getElementById('backendContractModal').classList.remove('active');
    }

    function openTermsModal(type) {
      const modal = document.getElementById('termsModal');
      const title = document.getElementById('termsModalTitle');
      const body = document.getElementById('termsModalBody');

      if (type === 'cancellation') {
        title.textContent = 'Cancellation & Refund Guarantee';
        body.innerHTML = `
          <p><strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:86%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p><br>
          <p><strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p><br>
          <p><strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:86%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
        `;
      } else if (type === 'privacy') {
        title.textContent = 'Privacy, Confidentiality & GDPR';
        body.innerHTML = `
          <p><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p><br>
          <p><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
        `;
      } else {
        title.textContent = 'Terms of Hospitality';
        body.innerHTML = `
          <p><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
        `;
      }

      modal.classList.add('active');
    }

    function closeTermsModal() {
      document.getElementById('termsModal').classList.remove('active');
    }

    function openSuiteDetailModal(suiteKey) {
      selectPropertyAndBook('cotedazur');
    }

    function filterSuites(cat) {
      const cards = document.querySelectorAll('#suitesGrid .menu-item-card');
      cards.forEach(card => {
        if (cat === 'all' || card.dataset.category === cat) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
      showToast(`Filtered: ${cat.toUpperCase()} Suites`);
    }

    // --- 15. TOAST NOTIFICATION UTILITY ---
    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `
        <span style="color: var(--gold-primary);"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span>
        <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }
  </script>
