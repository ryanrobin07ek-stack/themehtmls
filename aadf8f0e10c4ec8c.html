<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Heenzy - Reimagined Comfort Footwear</title>
  <meta name="description" content="Heenzy: Everyday style upgrade. Engineered cushioning, court classics, marathon racers, and handcrafted footwear." />
  <meta property="og:title" content="Heenzy - Reimagined Comfort Footwear" />
  <meta property="og:description" content="Heenzy: Everyday style upgrade. Engineered cushioning, court classics, marathon racers, and handcrafted footwear." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0B0B0B" />
  <meta name="color-scheme" content="only light" />
  <meta name="supported-color-schemes" content="light" />
  <style>

    /* RESET & MOBILE VIEWPORT */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    a, button, input, select, textarea, label, [onclick] { touch-action: manipulation; }
    
    :root {
      color-scheme: only light;
      --ff-brand: #0B0B0B;
      --ff-bg: #FFFFFF;
      --ff-surface: #F4F4F6;
      --ff-card-bg: #FFFFFF;
      --ff-text: #0B0B0B;
      --ff-muted: #6B7280;
      --ff-accent: #DFFF00;
      --ff-border: #E5E7EB;
      --ff-hero-bg: #0B0B0B;
      --ff-hero-text: #FFFFFF;
      --ff-btn-bg: #DFFF00;
      --ff-btn-text: #0B0B0B;
      --ff-card-radius: 22px;
      --ff-card-border: 1px solid #E5E7EB;
      --ff-card-padding: 16px;
      --ff-heading-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ff-body-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ff-heading-weight: 900;
      --ff-heading-transform: uppercase;
      --ff-letter-spacing: -0.04em;
      --ff-safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    
    html {
      max-width: 100%;
      overflow-x: clip;
      background-color: #E5E7EB;
    }
    body {
      background-color: #E5E7EB;
      color: var(--ff-text);
      font-family: var(--ff-body-font);
      line-height: 1.5;
      font-size: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 100%;
      overflow-x: hidden;
      overflow-x: clip;
    }
    
    /* Phone Centered Column Constraint (Max width 480px, optimized for 390px) */
    #app-container {
      width: 100%;
      max-width: 480px;
      background-color: var(--ff-bg);
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.16);
      padding-bottom: calc(90px + var(--ff-safe-bottom));
      overflow-x: clip;
      min-width: 0;
    }
    
    a { color: inherit; text-decoration: none; touch-action: manipulation; }
    button { color: inherit; font-family: inherit; cursor: pointer; border: none; background: none; touch-action: manipulation; }
    input, select, textarea { font-family: inherit; font-size: 16px; }
    
    /* TOP ANNOUNCEMENT TICKER */
    .promo-ticker {
      background-color: var(--ff-brand);
      color: var(--ff-accent);
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 7px 12px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* STORE HEADER */
    .store-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--ff-bg);
      border-bottom: 1px solid var(--ff-border);
      padding: 10px 14px 6px;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 10px;
      margin-bottom: 8px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: var(--ff-heading-weight);
      letter-spacing: var(--ff-letter-spacing);
      text-transform: uppercase;
      color: var(--ff-brand);
      line-height: 1;
    }
    .search-pill-wrap {
      flex: 1 1 100%;
      order: 3;
      display: flex;
      align-items: center;
      background-color: var(--ff-surface);
      border-radius: 9999px;
      padding: 3px 6px 3px 14px;
      border: 1px solid var(--ff-border);
      transition: border-color 0.2s, background-color 0.2s;
    }
    .search-pill-wrap:focus-within {
      border-color: var(--ff-brand);
      background-color: #FFFFFF;
    }
    .search-pill-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      color: var(--ff-text);
      min-width: 0;
      width: 100%;
    }
    .search-pill-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: var(--ff-brand);
      color: var(--ff-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--ff-text);
      background: var(--ff-surface);
      border: 1px solid var(--ff-border);
    }
    .badge-count {
      position: absolute;
      top: -2px;
      right: -2px;
      background-color: var(--ff-brand);
      color: var(--ff-accent);
      font-size: 10px;
      font-weight: 900;
      min-width: 17px;
      height: 17px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 1px solid var(--ff-bg);
    }
    
    /* SUB NAV HORIZONTAL BAR */
    .sub-nav {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 6px 0 6px;
      border-top: 1px solid var(--ff-surface);
    }
    .sub-nav::-webkit-scrollbar { display: none; }
    .sub-nav-link {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--ff-muted);
      white-space: nowrap;
      position: relative;
      padding: 2px 0;
    }
    .sub-nav-link.active, .sub-nav-link:hover {
      color: var(--ff-brand);
    }
    .sub-nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--ff-brand);
      border-radius: 2px;
    }

    /* 1. HERO SECTION (Heenzy Dark Reimagined Comfort Display) */
    .hero-heenzy-section {
      background: var(--ff-hero-bg);
      color: var(--ff-hero-text);
      padding: 28px 18px 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .hero-top-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .hero-pill-tag {
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    .hero-price-chip {
      background: var(--ff-accent);
      color: var(--ff-brand);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.04em;
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .hero-stacked-headline {
      font-size: 44px;
      line-height: 0.95;
      font-weight: var(--ff-heading-weight);
      letter-spacing: var(--ff-letter-spacing);
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero-stacked-headline .accent-word {
      color: var(--ff-accent);
      display: block;
    }
    .hero-showcase-art {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 8px 0 16px;
    }
    .hero-showcase-art svg {
      max-width: 100%;
      max-height: 100%;
      filter: drop-shadow(0 14px 24px rgba(0,0,0,0.45));
    }
    .hero-bottom-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
    }
    .hero-body-subtext {
      font-size: 12px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.75);
      max-width: 58%;
    }
    .btn-pill-accent {
      background-color: var(--ff-accent);
      color: var(--ff-brand);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 12px 22px;
      border-radius: 9999px;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      transition: transform 0.15s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-pill-accent:active { transform: scale(0.97); }

    /* 2. LIFESTYLE MOSAIC SECTION */
    .lifestyle-mosaic-section {
      padding: 26px 16px;
      background: var(--ff-bg);
      border-bottom: 1px solid var(--ff-border);
    }
    .mosaic-header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .mosaic-title-box h2 {
      font-size: 26px;
      line-height: 1;
      font-weight: var(--ff-heading-weight);
      letter-spacing: var(--ff-letter-spacing);
      text-transform: uppercase;
    }
    .mosaic-title-box h2 .accent-word {
      color: var(--ff-brand);
      text-decoration: underline;
      text-decoration-color: var(--ff-accent);
      text-underline-offset: 4px;
    }
    .mosaic-grid-quad {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .mosaic-tile {
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      color: #FFFFFF;
      transition: transform 0.2s;
    }
    .mosaic-tile:active { transform: scale(0.98); }
    .mosaic-tile-art {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.35;
      padding: 10px;
    }
    .mosaic-tile-art svg { width: 100%; height: 100%; }
    .mosaic-tile-content { position: relative; z-index: 2; }
    .mosaic-tile-title { font-size: 13px; font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase; }
    .mosaic-tile-sub { font-size: 10px; font-weight: 700; opacity: 0.85; text-transform: uppercase; }

    /* 3. FILTER GRID SECTION ("Your Everyday Style Upgrade") */
    .filter-grid-section {
      padding: 26px 16px;
      background: var(--ff-surface);
      border-bottom: 1px solid var(--ff-border);
    }
    .filter-pills-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 12px 0 16px;
    }
    .filter-pills-scroll::-webkit-scrollbar { display: none; }
    .filter-pill-item {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 9999px;
      background-color: #FFFFFF;
      color: var(--ff-text);
      white-space: nowrap;
      border: 1px solid var(--ff-border);
      transition: all 0.2s;
    }
    .filter-pill-item.active {
      background-color: var(--ff-accent);
      color: var(--ff-brand);
      border-color: var(--ff-brand);
    }

    /* PRODUCT CARDS */
    .product-grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .product-grid-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 380px) {
      .product-grid-3col { grid-template-columns: repeat(2, 1fr); }
    }
    .product-card {
      background-color: var(--ff-card-bg);
      border-radius: var(--ff-card-radius);
      border: var(--ff-card-border);
      padding: var(--ff-card-padding);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .product-card:active { transform: scale(0.98); }
    .card-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      min-height: 22px;
    }
    .card-brand-tag {
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ff-muted);
    }
    .card-wish-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: var(--ff-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ff-muted);
      border: 1px solid var(--ff-border);
    }
    .card-wish-btn.active { color: #DC2626; border-color: #DC2626; background: #FEF2F2; }
    .card-img-wrap {
      width: 100%;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 10px;
      position: relative;
    }
    .card-img-wrap svg {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.1));
    }
    .card-info-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
    }
    .card-name {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--ff-text);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-price {
      font-size: 12px;
      font-weight: 900;
      color: var(--ff-text);
      white-space: nowrap;
    }
    .card-quick-add {
      margin-top: auto;
      width: 100%;
      background-color: var(--ff-accent);
      color: var(--ff-brand);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 8px 10px;
      border-radius: 9999px;
      text-align: center;
      border: 1px solid var(--ff-brand);
      transition: background-color 0.2s;
    }
    .card-quick-add:active { background-color: #FFFFFF; }

    /* 4. FEATURED PRODUCT SPOTLIGHT STRIP */
    .featured-strip-section {
      padding: 26px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--ff-border);
    }
    .featured-spotlight-card {
      background: var(--ff-surface);
      border-radius: 24px;
      border: 1px solid var(--ff-border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .spotlight-art-box {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border-radius: 18px;
      border: 1px solid var(--ff-border);
      padding: 12px;
    }
    .spotlight-art-box svg { max-width: 100%; max-height: 100%; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.18)); }
    .spotlight-details h3 { font-size: 20px; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; margin-bottom: 4px; }
    .spotlight-price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .spotlight-price { font-size: 22px; font-weight: 900; color: var(--ff-brand); }
    .spotlight-rating { font-size: 11px; font-weight: 800; color: var(--ff-muted); }
    .spotlight-swatches { display: flex; gap: 8px; margin-bottom: 12px; }
    .spotlight-swatch-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #FFFFFF; outline: 1px solid var(--ff-border); cursor: pointer; }

    /* 5. TESTIMONIALS SECTION ("Every Pair Tells A Story") */
    .testimonials-section {
      padding: 26px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--ff-border);
    }
    .testimonials-cards-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    .testimonial-card {
      background: var(--ff-surface);
      border: 1px solid var(--ff-border);
      border-radius: 18px;
      padding: 16px;
    }
    .testimonial-text {
      font-size: 12.5px;
      line-height: 1.5;
      color: #374151;
      margin-bottom: 10px;
      font-style: italic;
    }
    .testimonial-author-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .author-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ff-brand);
      color: var(--ff-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
    }
    .author-name { font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .author-loc { font-size: 9.5px; color: var(--ff-muted); }

    /* 6. BANNER WIDE ("ELEVATE" Full-Bleed Deep Blue Block) */
    .banner-wide-section {
      padding: 38px 20px;
      background: #132F5B;
      color: #FFFFFF;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .banner-wide-huge-title {
      font-size: 54px;
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      color: #FFFFFF;
    }
    .banner-wide-sub {
      font-size: 12px;
      line-height: 1.45;
      max-width: 85%;
      color: #93C5FD;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* 7. COLLAGE CTA ("Your Next Level Kicks Just Dropped") */
    .collage-cta-section {
      padding: 26px 16px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--ff-border);
    }
    .collage-stack-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .collage-card-item {
      background: var(--ff-surface);
      border-radius: 16px;
      border: 1px solid var(--ff-border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .collage-card-item svg { width: 100%; height: 80px; }

    /* 8. GIANT ACCENT FOOTER BLOCK (Heenzy Yellow Brand Wordmark) */
    .giant-footer-block {
      background-color: var(--ff-accent);
      color: var(--ff-brand);
      padding: 32px 18px 20px;
      position: relative;
      overflow: hidden;
      border-top: 2px solid var(--ff-brand);
    }
    .footer-huge-brand-wordmark {
      font-size: 72px;
      line-height: 0.85;
      font-weight: 900;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: var(--ff-brand);
    }
    .footer-step-headline {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .footer-link-grid-columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0 24px;
      border-top: 1px solid rgba(11, 11, 11, 0.2);
      padding-top: 16px;
    }
    .footer-sub-col-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .footer-sub-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .footer-sub-links a {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: rgba(11, 11, 11, 0.75);
    }
    .footer-sub-links a:hover { color: var(--ff-brand); }
    .footer-copyright-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(11, 11, 11, 0.2);
      padding-top: 14px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* FIXED BOTTOM NAVIGATION BAR */
    .fixed-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: calc(58px + var(--ff-safe-bottom));
      padding-bottom: var(--ff-safe-bottom);
      background-color: var(--ff-brand);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 50;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
    }
    .nav-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      width: 20%;

      const parts = path.split('.').filter(Boolean);

      for (let i = 0; i < parts.length - 1; i++) {

      curr[last] = val;

          else if (l.type === 'whatsapp') href = 'https://wa.me/' + val.replace(/[^\d]/g, '');
          else if (l.type === 'page') href = val.startsWith('/') ? val : '/' + val;

        wa.href = 'https://wa.me/' + num + '?text=' + msg;

    // CART COMPUTATIONS
    function computeCart() {
      let subtotal = 0;
      let count = 0;
      for (const item of cart) {
        subtotal += item.price * item.quantity;
        count += item.quantity;
      }
      const threshold = site.freeShippingThreshold || 5000;
      const flatRate = site.shippingFlatRate || 350;
      const shipping = subtotal >= threshold || cart.length === 0 ? 0 : flatRate;
      const tax = Math.round(subtotal * (site.taxRate || 0.16));
      const total = subtotal + shipping + tax;

      const cartBadge = document.getElementById('cart-badge');
      if (cartBadge) {
        cartBadge.textContent = count;
        cartBadge.style.display = count > 0 ? 'flex' : 'none';
      }
      const wishBadge = document.getElementById('wishlist-badge');
      if (wishBadge) {
        wishBadge.textContent = savedIds.size;
        wishBadge.style.display = savedIds.size > 0 ? 'flex' : 'none';
      }
      return { subtotal, shipping, tax, total, count };
    }

      const navEl = document.getElementById('sub-nav-bar');
      if (!navEl) return;
      const items = (site.navigation || []).filter(n => n.enabled);

      navEl.innerHTML = items.map(item => {
        const isActive = currentPath === item.route;
        return '<a href="' + item.route + '" class="sub-nav-link ' + (isActive ? 'active' : '') + '">' + escapeHtml(item.label) + '</a>';
      }).join('');
    }

    // BROWSE PAGE
    function renderBrowsePage(params = {}) {
      const main = document.getElementById('main-content');
      const query = params.query || '';
      const selectedCategory = params.category || 'all';
      const selectedBrand = params.brand || 'all';
      const selectedBadge = params.badge || '';
      const sortBy = params.sort || 'newest';

      let filtered = site.products.filter(p => {
        if (p.status !== 'published') return false;
        if (query) {
          const q = query.toLowerCase();
          const match = p.name.toLowerCase().includes(q) ||
                        p.brand.toLowerCase().includes(q) ||
                        p.category.toLowerCase().includes(q) ||
                        p.description.toLowerCase().includes(q);
          if (!match) return false;
        }
        if (selectedCategory !== 'all') {
          if (p.category.toLowerCase() !== selectedCategory.toLowerCase()) {
            const hasSub = (p.subcategories || []).some(s => s.toLowerCase() === selectedCategory.toLowerCase());
            if (!hasSub) return false;
          }
        }
        if (selectedBrand !== 'all') {
          if (p.brand.toLowerCase() !== selectedBrand.toLowerCase()) return false;
        }
        if (selectedBadge) {
          if (p.badge !== selectedBadge) return false;
        }
        return true;
      });

      // Sort
      filtered.sort((a, b) => {
        if (sortBy === 'price-asc') return a.price - b.price;
        if (sortBy === 'price-desc') return b.price - a.price;
        if (sortBy === 'name-asc') return a.name.localeCompare(b.name);
        return (b.createdDate || '').localeCompare(a.createdDate || '');
      });

      let html = '<div style="display:flex;align-items:center;gap:8px;padding:12px 16px;background:#FFFFFF;border-bottom:1px solid var(--ff-border);">' +

    // DUAL-MODE ROUTING ENGINE (Clean Paths on HTTP/HTTPS + Hash Fallback on file:)
    function isFileProtocol() {
      return window.location.protocol === 'file:';
    }

    function getCurrentPath() {
      if (isFileProtocol()) {
        const hash = window.location.hash.replace(/^#/, '');
        return hash ? (hash.startsWith('/') ? hash : '/' + hash) : '/';
      }
      return window.location.pathname || '/';
    }

    function handleRoute(targetUrl) {
      window.scrollTo(0, 0);
      let pathname = '';
      let searchParams = {};

      if (isFileProtocol()) {
        const raw = targetUrl || window.location.hash.replace(/^#/, '') || '/';
        const qIdx = raw.indexOf('?');
        if (qIdx >= 0) {
          pathname = raw.substring(0, qIdx);
          const qs = new URLSearchParams(raw.substring(qIdx));
          searchParams = Object.fromEntries(qs.entries());
        } else {
          pathname = raw;
        }
      } else {
        const url = new URL(targetUrl || window.location.href, window.location.origin);
        pathname = url.pathname;
        searchParams = Object.fromEntries(url.searchParams.entries());
      }

      if (pathname === '' || pathname === '/') pathname = '/';

      if (APP_MODE === 'studio' && !pathname.startsWith('/studio')) pathname = '/studio';
      if (APP_MODE === 'store' && pathname.startsWith('/studio')) {
        if (isFileProtocol()) { window.location.href = 'studio.html'; return; }
        else { window.location.replace('/studio.html'); return; }
      }

      document.querySelectorAll('.nav-tab-item').forEach(el => {
        el.classList.remove('active');
        if (pathname === '/' && el.dataset.nav === 'home') el.classList.add('active');
        else if (pathname.startsWith('/browse') && el.dataset.nav === 'browse') el.classList.add('active');
        else if (pathname.startsWith('/saved') && el.dataset.nav === 'saved') el.classList.add('active');
        else if (pathname.startsWith('/cart') && el.dataset.nav === 'cart') el.classList.add('active');
        else if (pathname.startsWith('/account') && el.dataset.nav === 'account') el.classList.add('active');
      });

      renderSubNav();
      document.documentElement.classList.toggle('studio-mode', pathname.startsWith('/studio'));

      if (pathname === '/') renderHomePage();
      else if (pathname === '/browse' || pathname === '/products') renderBrowsePage(searchParams);
      else if (pathname.startsWith('/category/')) {
        const catSlug = pathname.replace('/category/', '').split('/')[0];
        renderBrowsePage({ ...searchParams, category: catSlug });
      }
      else if (pathname.startsWith('/brand/')) {
        const brandSlug = pathname.replace('/brand/', '').split('/')[0];
        renderBrowsePage({ ...searchParams, brand: brandSlug });
      }
      else if (pathname.startsWith('/product/')) {
        const prodSlug = pathname.replace('/product/', '').split('/')[0];
        renderProductDetailPage(prodSlug);
      }
      else if (pathname === '/cart') renderCartPage();
      else if (pathname === '/checkout') renderCheckoutPage();
      else if (pathname === '/saved') renderSavedPage();
      else if (pathname === '/account' || pathname === '/orders') renderAccountPage();
      else if (pathname === '/location') renderLocationPage();
      else if (pathname.startsWith('/pages/')) {
        const pageSlug = pathname.replace('/pages/', '').split('/')[0];
        renderCustomPage(pageSlug);
      }
      else if (pathname.startsWith('/studio')) {
        const sub = pathname.replace(/^\/studio(\.html)?/, '').replace(/^\//, '') || 'dashboard';
        renderStudio(sub);
      }
      else {
        // Proper not-found screen
        const main = document.getElementById('main-content');
        main.innerHTML = '<div style="padding:64px 20px;text-align:center;">' +
          '<h2 style="font-size:26px;font-weight:900;text-transform:uppercase;margin-bottom:8px;">PAGE NOT FOUND</h2>' +
          '<p style="font-size:13px;color:var(--ff-muted);margin-bottom:20px;">The requested destination could not be resolved.</p>' +
          '<a href="/" class="btn-pill-white">RETURN TO HOME</a>' +
        '</div>';
      }
    }

    // STUDIO ACTIONS
    window.filterStudioProducts = function(q) {
      q = q.trim().toLowerCase();
      document.querySelectorAll('#studio-prod-list .studio-p-item').forEach(el => {
        el.style.display = !q || el.dataset.q.includes(q) ? 'flex' : 'none';
      });
    };

    window.adjustStock = function(prodId, size, delta) {
      const p = site.products.find(x => x.id === prodId);
      if (!p) return;
      const s = p.sizes.find(sz => sz.size === size);
      if (!s) return;
      s.stock = Math.max(0, s.stock + delta);
      scheduleSave();
      renderStudio('inventory');
    };

    window.bulkRestockLow = function() {
      pushUndoState();
      for (const p of site.products) {
        for (const s of p.sizes) {
          if (s.stock < 5) s.stock += 10;
        }
      }
      scheduleSave();
      showToast('Restocked all low inventory items');
      renderStudio('inventory');
    };

    window.moveSection = function(idx, delta) {
      const target = idx + delta;
      if (target < 0 || target >= site.sections.length) return;
      pushUndoState();
      const tmp = site.sections[idx];
      site.sections[idx] = site.sections[target];
      site.sections[target] = tmp;
      scheduleSave();
      renderStudio('sections');
    };

    window.toggleSection = function(idx) {
      pushUndoState();
      site.sections[idx].enabled = !site.sections[idx].enabled;
      scheduleSave();
      renderStudio('sections');
    };

    window.deleteSection = function(idx) {
      if (!confirm('Delete section?')) return;
      pushUndoState();
      site.sections.splice(idx, 1);
      scheduleSave();
      renderStudio('sections');
    };

    window.updateHero = function(key, val) {
      pushUndoState();
      const hero = site.sections.find(s => s.type === 'hero');
      if (hero) hero[key] = val;
      scheduleSave();
    };

    window.updateCardCols = function(n) {
      pushUndoState();
      site.cardLayoutSettings = site.cardLayoutSettings || {};
      site.cardLayoutSettings.columns = Number(n) || 0;
      applyThemeToDom();
      scheduleSave();
      renderStudio('card-layouts');
    };

    window.updateCardRadius = function(val) {
      pushUndoState();
      site.cardLayoutSettings.radius = val + 'px';
      document.getElementById('radius-val').textContent = val + 'px';
      applyThemeToDom();
      scheduleSave();
    };

    window.applyCardPreset = function(presetId) {
      pushUndoState();
      site.cardLayoutSettings.preset = presetId;
      applyThemeToDom();
      scheduleSave();
      showToast('Applied ' + presetId + ' layout');
    };

    window.applyTheme = function(themeId) {
      pushUndoState();
      site.activeThemeId = themeId;
      const th = site.themes.find(t => t.id === themeId);
      if (th && th.cardStyle) site.cardLayoutSettings = Object.assign(site.cardLayoutSettings || {}, th.cardStyle);
      applyThemeToDom();
      scheduleSave();
      renderStudio('themes');
    };

    window.deleteCategory = function(idx) {
      if (!confirm('Delete category?')) return;
      pushUndoState();
      site.categories.splice(idx, 1);
      scheduleSave();
      renderStudio('categories');
    };

    window.exportSiteJSON = function() {
      const blob = new Blob([JSON.stringify(site, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = CFG.backupFileName || 'heenzy_store_backup.json';
      a.click();
      URL.revokeObjectURL(url);
    };

    window.promptImportSiteJSON = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data && data.products) {
              pushUndoState();
              site = data;
              applyThemeToDom();
              scheduleSave();
              showToast('Site data imported successfully');
              renderStudio('dashboard');
            }
          } catch (err) { alert('Invalid JSON file'); }
        };
        reader.readAsText(file);
      };
      input.click();
    };

    window.resetStoreToDefaults = function() {
      if (!confirm('Reset all store data to original defaults?')) return;
      pushUndoState();
      site = JSON.parse(JSON.stringify(initialSiteData));
      cart = [];
      savedIds = new Set();
      orders = [];
      localStorage.clear();
      applyThemeToDom();
      scheduleSave();
      showToast('Store reset to defaults');
      renderStudio('dashboard');
    };

      renderStudio('sections');
    };

    window.editSection = function(idx) {
      const sec = site.sections[idx];
      if (!sec) return;
      if (sec.type === 'hero') { renderStudio('hero-editor'); return; }
      const overlay = document.getElementById('sheet-overlay');
      document.getElementById('sheet-title').textContent = 'EDIT ' + (sec.name || sec.type).toUpperCase();
      document.getElementById('sheet-content').innerHTML = '<div class="form-group"><label class="form-label">Section Title</label><input type="text" class="form-input" id="es-title" value="' + escapeHtml(sec.title || '') + '" /></div>' +
        '<div class="form-group"><label class="form-label">Subtitle</label><textarea class="form-textarea" rows="2" id="es-sub">' + escapeHtml(sec.subtitle || '') + '</textarea></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
          '<div class="form-group"><label class="form-label">CTA Label</label><input type="text" class="form-input" id="es-cta-txt" value="' + escapeHtml(sec.ctaText || '') + '" /></div>' +
          '<div class="form-group"><label class="form-label">CTA Route</label><input type="text" class="form-input" id="es-cta-rt" value="' + escapeHtml(sec.ctaRoute || '/browse') + '" /></div>' +
        '</div>';
      document.getElementById('sheet-footer').innerHTML = '<button class="btn-pill-outline" style="flex:1;" onclick="window.closeSheet()">CANCEL</button>' +
        '<button class="btn-pill-white" style="flex:1;" onclick="window.saveSectionEdit(' + idx + ')">SAVE CHANGES</button>';
      overlay.classList.add('open');
    };

    window.saveSectionEdit = function(idx) {
      pushUndoState();
      const sec = site.sections[idx];
      if (!sec) return;
      sec.title = document.getElementById('es-title').value;
      sec.subtitle = document.getElementById('es-sub').value;
      sec.ctaText = document.getElementById('es-cta-txt').value;
      sec.ctaRoute = document.getElementById('es-cta-rt').value;
      scheduleSave();
      window.closeSheet();
      showToast('Saved section');
      renderStudio('sections');
    };
  

    // MULTI-TAB STORAGE SYNCHRONIZATION
    window.addEventListener('storage', (e) => {
      if (APP_MODE !== 'store' || e.key !== CFG.storage.siteKey || !e.newValue) return;
      try {
        const d = JSON.parse(e.newValue);
        if (d && d.version) {
          site = d;
          applyThemeToDom();
          handleRoute(getCurrentPath());
        }
      } catch (err) {}
    });

    // INITIAL APP INITIALIZATION
    initDB().then(() => {
      loadState();
      applyThemeToDom();
      computeCart();
      handleRoute(getCurrentPath());
    });
  })();
  </script>
</body>
</html>
