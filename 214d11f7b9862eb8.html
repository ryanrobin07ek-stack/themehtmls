  <style>
    :root {
      --bg-canvas: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-01);
      --bg-surface: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-02);
      --border-subtle: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-03);
      --text-main: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-04);
      --text-muted: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-05);
      --accent-warm: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-06);
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Hotspot pin pulse */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .hotspot-glow::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 9999px;
      background: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-07);
      animation: pulse-ring 2.5s infinite cubic-bezier(0.25, 1, 0.5, 1);
      z-index: -1;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-08);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-09);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-10);
    }

    /* Hide scrollbar for clean horizontal product rails */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Glass and backdrop */
    .glass-nav {
      background: var(--theme-woodora-modern-furniture-luxury-home-interiors-kenya-color-11);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>

    function formatKES(num) {

    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      const msg = document.getElementById('toast-message');
      msg.textContent = message;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');

    // -------------------------------------------------------------
    // 5. CART OPERATIONS
    // -------------------------------------------------------------
    function addToCart(productId, selectedColor = null, quantity = 1) {
      const p = PRODUCTS.find(x => x.id === productId);
      if (!p) return;

      const chosenColor = selectedColor || (p.colors && p.colors[0] ? p.colors[0].name : 'Default');
      const existing = STATE.cart.find(item => item.id === productId && item.color === chosenColor);

      if (existing) {
        existing.quantity += quantity;
      } else {
        STATE.cart.push({
          id: p.id,
          name: p.name,
          price: p.price,
          image: p.image,
          color: chosenColor,
          sku: p.sku,
          quantity: quantity
        });
      }

      saveCart();
      showToast(`Added "${p.name}" to shopping bag`);
      openCartDrawer();
    }

    function addBundleToCart(comboId) {
      const combo = ROOM_COMBOS.find(c => c.id === comboId);
      if (!combo) return;

      STATE.cart.push({
        id: combo.id,
        name: combo.title + ' (Curated Bundle)',
        price: combo.price,
        image: combo.image,
        color: 'Curated Room Set',
        sku: 'BUNDLE-' + combo.id.toUpperCase(),
        quantity: 1,
        isBundle: true
      });

      saveCart();
      showToast(`Curated Bundle added! Saved ${formatKES(combo.savings)}`);
      openCartDrawer();
    }

    function updateCartItemQty(productId, color, delta) {
      const item = STATE.cart.find(x => x.id === productId && x.color === color);
      if (!item) return;

      item.quantity += delta;
      if (item.quantity <= 0) {
        STATE.cart = STATE.cart.filter(x => !(x.id === productId && x.color === color));
      }
      saveCart();
    }

    function removeCartItem(productId, color) {
      STATE.cart = STATE.cart.filter(x => !(x.id === productId && x.color === color));
      saveCart();
      showToast('Item removed from bag');
    }

    function toggleWishlist(productId) {
      const index = STATE.wishlist.indexOf(productId);
      const product = PRODUCTS.find(p => p.id === productId);
      if (index > -1) {
        STATE.wishlist.splice(index, 1);
        showToast(`Removed "${product ? product.name : ''}" from wishlist`);
      } else {
        STATE.wishlist.push(productId);
        showToast(`Saved to your Woodora Wishlist`);
      }
      saveWishlist();
      // Update any heart icons on visible cards
      document.querySelectorAll(`[data-wishlist-id="${productId}"]`).forEach(btn => {
        const isSaved = STATE.wishlist.includes(productId);
        btn.classList.toggle('text-rose-600', isSaved);
        btn.classList.toggle('fill-rose-600', isSaved);
      });
    }

    function updateCartUI() {
      const count = STATE.cart.reduce((sum, item) => sum + item.quantity, 0);
      const badge = document.getElementById('cart-badge');
      if (badge) badge.textContent = count;

      const drawerBadge = document.getElementById('drawer-item-count');
      if (drawerBadge) drawerBadge.textContent = `${count} ${count === 1 ? 'item' : 'items'}`;

      const rawSubtotal = STATE.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const discount = rawSubtotal * STATE.discountPercent;
      const subtotal = rawSubtotal - discount;

      const subtotalEl = document.getElementById('cart-subtotal');
      if (subtotalEl) subtotalEl.textContent = formatKES(subtotal);

      // Shipping threshold (Free for Nairobi if >= 75,000)
      const threshold = 75000;
      const shippingProgress = document.getElementById('shipping-progress-bar');
      const shippingAmountText = document.getElementById('shipping-threshold-amount');
      const shippingFeeEl = document.getElementById('cart-shipping-fee');

      if (rawSubtotal >= threshold) {
        if (shippingProgress) shippingProgress.style.width = '100%';
        if (shippingAmountText) shippingAmountText.innerHTML = '<span class="text-emerald-700 font-bold">You unlocked FREE White-Glove Nairobi Delivery!</span>';
        if (shippingFeeEl) shippingFeeEl.innerHTML = '<span class="text-emerald-700 font-semibold">FREE</span>';
      } else {
        const pct = Math.min(100, Math.round((rawSubtotal / threshold) * 100));

        if (shippingAmountText) shippingAmountText.textContent = `Add ${formatKES(needed)} for free delivery`;
        if (shippingFeeEl) shippingFeeEl.textContent = rawSubtotal > 0 ? "" : 'Calculated at checkout';
      }

      const shippingCost = (rawSubtotal > 0 && rawSubtotal < threshold) ? 3500 : 0;
      const grandTotal = subtotal + shippingCost;
      const grandTotalEl = document.getElementById('cart-grandtotal');
      if (grandTotalEl) grandTotalEl.textContent = formatKES(grandTotal);

    // Interactive category filter on homepage
    function setHomeCategoryFilter(cat, btn) {
      document.querySelectorAll('.home-cat-btn').forEach(b => {
        b.classList.remove('bg-[#18181B]', 'text-white');
        b.classList.add('bg-white', 'border', 'border-zinc-300', 'text-zinc-700');
      });
      btn.classList.remove('bg-white', 'border', 'border-zinc-300', 'text-zinc-700');
      btn.classList.add('bg-[#18181B]', 'text-white');

      const grid = document.getElementById('home-products-grid');
      let filtered = PRODUCTS;
      if (cat !== 'all') {
        filtered = PRODUCTS.filter(p => p.category === cat || p.room === cat);
      }
      grid.innerHTML = filtered.slice(0, 8).map(p => renderProductCard(p)).join('');
      lucide.createIcons();
    }

    // Combo slider functions
    function prevCombo() {
      STATE.activeComboIndex = (STATE.activeComboIndex - 1 + ROOM_COMBOS.length) % ROOM_COMBOS.length;
      updateComboDisplay();
    }
    function nextCombo() {
      STATE.activeComboIndex = (STATE.activeComboIndex + 1) % ROOM_COMBOS.length;
      updateComboDisplay();
    }
    function updateComboDisplay() {
      const combo = ROOM_COMBOS[STATE.activeComboIndex];
      const codeEl = document.getElementById('combo-code-display');
      const titleEl = document.getElementById('combo-title-display');
      const imgEl = document.getElementById('combo-image-display');
      if (codeEl) codeEl.textContent = combo.code;
      if (titleEl) titleEl.textContent = `CURATED COMBOS ${formatKES(combo.price)} ONLY`;
      if (imgEl) imgEl.src = combo.image;
    }

    function setFilterRoom(room) {
      const url = new URL(window.location);
      if (room === 'all') {
        url.hash = '#shop';
      } else {
        url.hash = `#shop?room=${room}`;
      }
      window.location = url.toString();
    }

    function onPriceSliderChange(val) {
      document.getElementById('price-slider-display').textContent = formatKES(val);
      applyShopFilters();
    }

    function resetShopFilters() {
      const slider = document.getElementById('price-slider');
      if (slider) {
        slider.value = 200000;
        document.getElementById('price-slider-display').textContent = formatKES(200000);
      }
      document.querySelectorAll('#material-checkboxes input').forEach(c => c.checked = false);
      const inStock = document.getElementById('instock-only');
      if (inStock) inStock.checked = false;
      const sortSel = document.getElementById('shop-sort-select');
      if (sortSel) sortSel.value = 'featured';
      window.location.hash = '#shop';
    }

    function applyShopFilters() {
      const hash = window.location.hash || '';
      const params = new URLSearchParams(hash.includes('?') ? hash.split('?')[1] : '');
      const room = params.get('room') || 'all';
      const cat = params.get('cat') || 'all';

      const maxPrice = Number(document.getElementById('price-slider')?.value || 200000);
      const sort = document.getElementById('shop-sort-select')?.value || 'featured';
      const instockOnly = document.getElementById('instock-only')?.checked || false;

      const checkedMaterials = Array.from(document.querySelectorAll('#material-checkboxes input:checked')).map(c => c.value.toLowerCase());

      let list = [...PRODUCTS];

      // Room filter
      if (room !== 'all') {
        list = list.filter(p => p.room === room);
      }

      // Cat filter
      if (cat !== 'all') {
        list = list.filter(p => p.category === cat);
      }

      // Max price
      list = list.filter(p => p.price <= maxPrice);

      // In stock
      if (instockOnly) {
        list = list.filter(p => p.inStock && p.stock > 0);
      }

      // Materials
      if (checkedMaterials.length > 0) {
        list = list.filter(p => {
          const matStr = (p.materials + ' ' + p.description).toLowerCase();
          return checkedMaterials.some(m => matStr.includes(m));
        });
      }

      // Sort
      if (sort === 'price-asc') {
        list.sort((a, b) => a.price - b.price);
      } else if (sort === 'price-desc') {
        list.sort((a, b) => b.price - a.price);
      } else if (sort === 'rating') {
        list.sort((a, b) => b.rating - a.rating);
      }

      // Render items
      const grid = document.getElementById('shop-catalog-grid');
      const empty = document.getElementById('shop-empty-state');
      const countEl = document.getElementById('shop-result-count');

      if (countEl) countEl.textContent = `Showing ${list.length} pieces`;

      if (list.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = list.map(p => renderProductCard(p)).join('');
      }

      lucide.createIcons();
    }

    function handlePlaceOrder(e) {
      e.preventDefault();

      const name = form.custName.value;
      const phone = form.custPhone.value;
      const method = form.paymentMethod.value;
      const orderRef = 'WOD-' + Math.floor(100000 + Math.random() * 900000);

      const btn = document.getElementById('place-order-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block animate-spin mr-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span> Initiating <span class="eshop-skeleton-bar" data-skeleton-text="" style="width:40%"></span>...`;

      setTimeout(() => {
        // Complete simulated order
        const orders = JSON.parse(localStorage.getItem('woodora_orders') || '[]');
        orders.unshift({
          orderRef: orderRef,
          date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
          items: [...STATE.cart],
          total: STATE.cart.reduce((s, x) => s + (x.price * x.quantity), 0),
          customer: { name, phone },
          status: 'Confirmed — White-Glove Dispatch Scheduled'
        });
        localStorage.setItem('woodora_orders', JSON.stringify(orders));

        // Clear bag
        STATE.cart = [];
        saveCart();

        // Render confirmation view
        renderOrderSuccessView(orderRef, name, phone, method);
      }, 2000);
    }

    // -------------------------------------------------------------
    // 9. CLIENT-SIDE ROUTER ENGINE
    // -------------------------------------------------------------
    function renderRoute() {
      const hash = window.location.hash || '';
      const [routePath, queryString] = hash.replace(/^#/, '').split('?');
      const params = new URLSearchParams(queryString || '');

      const root = document.getElementById('app-root');
      window.scrollTo({ top: 0, behavior: 'instant' });

      // Route mapping
      if (!routePath || routePath === '' || routePath === 'home') {
        root.innerHTML = renderHomeView();
        initGSAPAnimations();
      } else if (routePath === 'shop') {
        const cat = params.get('cat') || 'all';
        const room = params.get('room') || 'all';
        const sort = params.get('sort') || 'featured';
        root.innerHTML = renderShopView({ cat, room, sort });
        applyShopFilters();
      } else if (routePath === 'product') {
        const id = params.get('id') || PRODUCTS[0].id;
        root.innerHTML = renderProductDetailView(id);
      } else if (routePath === 'room-combos') {
        root.innerHTML = renderRoomCombosView();
      } else if (routePath === 'custom-orders') {
        root.innerHTML = renderCustomOrdersView();
      } else if (routePath === 'b2b-quotes') {
        root.innerHTML = renderB2BView();
      } else if (routePath === 'cart') {
        root.innerHTML = renderCartView();
      } else if (routePath === 'checkout') {
        root.innerHTML = renderCheckoutView();
      } else if (routePath === 'wishlist') {
        root.innerHTML = renderWishlistView();
      } else if (routePath === 'account') {
        root.innerHTML = renderAccountView();
      } else if (routePath === 'about') {
        root.innerHTML = renderAboutView();
      } else if (routePath === 'faq') {
        root.innerHTML = renderFaqView();
      } else {
        root.innerHTML = renderHomeView();
      }

      lucide.createIcons();
      updateCartUI();
      updateWishlistUI();
    }

    window.addEventListener('hashchange', renderRoute);

    // -------------------------------------------------------------
    // 10. GSAP & SCROLLTRIGGER INITIALIZATION
    // -------------------------------------------------------------
    function initGSAPAnimations() {
      if (typeof gsap === 'undefined') return;

      // Check prefers-reduced-motion
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      try {
        if (typeof ScrollTrigger !== 'undefined') {
          gsap.registerPlugin(ScrollTrigger);
        }

        // Hero title entrance
        gsap.from('#hero-heading', {
          y: 30,
          opacity: 0,
          duration: 0.9,
          ease: 'power3.out'
        });

        // Hotspots subtle floating pulse
        gsap.to('.hotspot-glow', {
          y: -4,
          duration: 1.8,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut',
          stagger: 0.2
        });

        // Product cards scroll reveal
        if (typeof ScrollTrigger !== 'undefined') {
          gsap.utils.toArray('.product-card').forEach((card, i) => {
            gsap.from(card, {
              scrollTrigger: {
                trigger: card,
                start: 'top 90%',
                toggleActions: 'play none none none'
              },
              y: 20,
              opacity: 0,
              duration: 0.6,
              delay: (i % 4) * 0.1,
              ease: 'power2.out'
            });
          });
        }
      } catch (err) {
        console.warn('GSAP initialization caught error:', err);
      }
    }

    // -------------------------------------------------------------
    // 11. SEARCH OVERLAY LOGIC
    // -------------------------------------------------------------
    function initSearch() {
      const searchModal = document.getElementById('search-modal');
      const searchContainer = document.getElementById('search-modal-container');
      const searchInput = document.getElementById('search-input');
      const openBtn = document.getElementById('open-search-btn');
      const closeBtn = document.getElementById('close-search-btn');
      const resultsList = document.getElementById('search-results-list');

      function openSearch() {
        searchModal.classList.remove('hidden');
        setTimeout(() => {
          searchModal.classList.remove('opacity-0');
          searchContainer.classList.remove('scale-95');
          searchInput.focus();
        }, 10);
      }

      function closeSearch() {
        searchModal.classList.add('opacity-0');
        searchContainer.classList.add('scale-95');
        setTimeout(() => {
          searchModal.classList.add('hidden');
          searchInput.value = '';
        }, 200);
      }

      openBtn.addEventListener('click', openSearch);
      closeBtn.addEventListener('click', closeSearch);

      // Search tags clicks
      document.querySelectorAll('.search-tag').forEach(tag => {
        tag.addEventListener('click', () => {
          const term = tag.getAttribute('data-term');
          searchInput.value = term;
          triggerSearch(term);
        });
      });

      searchInput.addEventListener('input', (e) => {
        triggerSearch(e.target.value);
      });

      function triggerSearch(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
          resultsList.innerHTML = `<p class="text-sm text-zinc-500 py-4 text-center"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>`;
          return;
        }

        const matches = PRODUCTS.filter(p => 
          p.name.toLowerCase().includes(q) ||
          p.materials.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          p.room.toLowerCase().includes(q) ||
          p.tags.some(t => t.includes(q))
        );

        if (matches.length === 0) {
          resultsList.innerHTML = `
            <div class="py-6 text-center text-zinc-500">
              <p class="text-sm"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
              <p class="text-xs text-zinc-400 mt-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
            </div>
          `;
          return;
        }

        resultsList.innerHTML = matches.map(p => `
          <a href="#product?id=${p.id}" onclick="document.getElementById('close-search-btn').click();" class="flex items-center gap-3 p-2 hover:bg-zinc-50 rounded-xl transition-colors group">
            <img class="w-12 h-12 rounded-lg object-cover bg-zinc-100 shrink-0 eshop-placeholder-media" />
            <div class="flex-1 min-w-0">
              <h5 class="text-sm font-semibold text-zinc-900 group-hover:text-amber-800 transition-colors truncate"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></h5>
              <p class="text-xs text-zinc-400 capitalize"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:95%"></span></p>
            </div>
            <span class="text-xs font-bold text-zinc-900 tabular-nums"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
          </a>
        `).join('');
      }

      // Escape key to dismiss
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeSearch();
          closeCartDrawer();
          const qv = document.getElementById('quickview-modal');
          if (qv && !qv.classList.contains('hidden')) {
            document.getElementById('close-quickview-btn').click();
          }
        }
      });
    }

    // -------------------------------------------------------------
    // 12. INITIALIZATION
    // -------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      // Cart drawer buttons
      document.getElementById('open-cart-btn')?.addEventListener('click', openCartDrawer);
      document.getElementById('close-cart-btn')?.addEventListener('click', closeCartDrawer);

      // Mobile drawer
      const mobileDrawer = document.getElementById('mobile-drawer');
      const mobilePanel = document.getElementById('mobile-drawer-panel');
      const mobileOpenBtn = document.getElementById('mobile-menu-btn');
      const mobileCloseBtn = document.getElementById('close-mobile-drawer');

      function openMobileDrawer() {
        mobileDrawer.classList.remove('hidden');
        setTimeout(() => {
          mobileDrawer.classList.remove('opacity-0');
          mobilePanel.classList.remove('translate-x-full');
        }, 10);
      }
      function closeMobileDrawer() {
        mobileDrawer.classList.add('opacity-0');
        mobilePanel.classList.add('translate-x-full');
        setTimeout(() => {
          mobileDrawer.classList.add('hidden');
        }, 300);
      }

      mobileOpenBtn?.addEventListener('click', openMobileDrawer);
      mobileCloseBtn?.addEventListener('click', closeMobileDrawer);
      document.querySelectorAll('.mobile-nav-link').forEach(link => {
        link.addEventListener('click', closeMobileDrawer);
      });

      // Quickview close
      document.getElementById('close-quickview-btn')?.addEventListener('click', () => {
        const modal = document.getElementById('quickview-modal');
        const content = document.getElementById('quickview-content');
        modal.classList.add('opacity-0');
        content.classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 300);
      });

      // Init search
      initSearch();

      // Initial route render
      renderRoute();
    });
  </script>
