    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],

            canvas: '#FDFBF7',
            surface: '#FFFFFF',
            'surface-subtle': '#F7F3EC',
            'surface-accent': '#EFE7DB',

            'obsidian-muted': '#57524C',
            'obsidian-light': '#8C857B',
            border: '#E8E1D5',
            'border-subtle': '#F0EAE0',
            terracotta: '#C25E2E',

            amber: '#D97E4A',
            sand: '#FAF6F0',

  <style>
    /* Base resets & typography */
    body {
      background-color: #FDFBF7;
      color: #181512;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, .font-editorial {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Custom smooth scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FDFBF7;
    }
    ::-webkit-scrollbar-thumb {
      background: #D8D0C3;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B8AF9F;
    }

    /* Shimmer placeholder */
    .shimmer-bg {
      background: linear-gradient(90deg, #F5EFEB 0%, #EDE5DC 50%, #F5EFEB 100%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid #C25E2E;
      outline-offset: 2px;
    }

    /* Image zoom overlay */
    .zoom-cursor {
      cursor: zoom-in;
    }

    /* Drawer backdrop */
    .drawer-backdrop {
      background: rgba(24, 21, 18, 0.45);
      backdrop-filter: blur(4px);
    }

    /* Hide scrollbar utility */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Touch target */
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
  </style>
<link rel="stylesheet" href="./eshop-mobile.css?v=3">
<style data-eshop-skeleton-styles="">.eshop-skeleton-bar{display:inline-block;max-width:100%;height:.72em;min-width:2.5em;border-radius:999px;background:#d1d5db;vertical-align:middle}.eshop-placeholder-media{background:linear-gradient(135deg,#d1d5db,#f3f4f6);object-fit:cover}</style></head>
<body class="min-h-screen flex flex-col bg-canvas text-obsidian selection:bg-amber/20 selection:text-terracotta">

  <!-- TOP ANNOUNCEMENT BAR -->
  <div id="announcement-bar" class="bg-obsidian text-canvas text-xs tracking-wider py-2 px-4 transition-all duration-300">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex-1 text-center font-medium text-[11px] sm:text-xs">
        <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></span>
        <span class="mx-2 hidden sm:inline text-canvas/40"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span>
        <span class="hidden sm:inline"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span><strong class="text-amber tracking-widest uppercase"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:19%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:78%"></span></span>
      </div>
      <button onclick="dismissAnnouncement()" class="text-canvas/60 hover:text-white p-1 ml-2 focus:outline-none">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- STICKY MAIN HEADER (Top Bar Contract: 3 zones, gap-8) -->

      <a href="#/" class="flex items-center gap-2 group whitespace-nowrap shrink-0">
        <span class="font-editorial text-2xl sm:text-3xl font-semibold tracking-tight text-obsidian group-hover:text-terracotta transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:14%"></span><span class="font-light italic text-obsidian-muted"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span></span>
        </span>
      </a>

      <!-- Zone 2: Clean single-line text navigation links -->
      <nav class="hidden lg:flex items-center gap-7 text-sm font-medium text-obsidian-muted">
        <a href="#/shop" class="hover:text-obsidian transition-colors whitespace-nowrap shrink-0 hover:underline underline-offset-8"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></a>
        <a href="#/shop/makeup" class="hover:text-obsidian transition-colors whitespace-nowrap shrink-0 hover:underline underline-offset-8"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:16%"></span></a>
        <a href="#/shop/skincare" class="hover:text-obsidian transition-colors whitespace-nowrap shrink-0 hover:underline underline-offset-8"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></a>
        <a href="#/shop/haircare" class="hover:text-obsidian transition-colors whitespace-nowrap shrink-0 hover:underline underline-offset-8"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></a>
        <a href="#/shop/fragrance" class="hover:text-obsidian transition-colors whitespace-nowrap shrink-0 hover:underline underline-offset-8"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span></a>
        <a href="#/shop/body" class="hover:text-obsidian transition-colors whitespace-nowrap shrink-0 hover:underline underline-offset-8"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span></a>
        <a href="#/brands" class="hover:text-obsidian transition-colors whitespace-nowrap shrink-0 hover:underline underline-offset-8"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:16%"></span></a>
        <a href="#/guides" class="hover:text-obsidian transition-colors whitespace-nowrap shrink-0 hover:underline underline-offset-8"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:35%"></span></a>
        <a href="#/offers" class="text-terracotta hover:text-terracotta-hover font-semibold whitespace-nowrap shrink-0"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:16%"></span></a>
      </nav>

      <!-- Zone 3: Primary Action & Commerce Utilities -->
      <div class="flex items-center gap-2 sm:gap-4 shrink-0">
        
        <!-- Search Trigger -->

        </button>

        <!-- Wishlist Link -->

          <span id="nav-wishlist-count" class="absolute top-1 right-1 w-4 h-4 bg-terracotta text-white rounded-full text-[10px] font-bold flex items-center justify-center hidden"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span>
        </a>

        <!-- Account Link -->
        <a href="#/account" class="p-2 text-obsidian hover:text-terracotta transition-colors touch-target rounded-full hover:bg-surface-subtle">

        </a>

        <!-- Cart Trigger Button -->
        <button onclick="toggleCartDrawer(true)" class="flex items-center gap-2 bg-obsidian text-canvas hover:bg-terracotta px-4 py-2.5 rounded-full text-xs font-semibold tracking-wider transition-colors duration-200">

          <span class="hidden md:inline"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span>
          <span id="nav-cart-count" class="bg-amber text-obsidian font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span>
        </button>

        <!-- Mobile Menu Toggle -->
        <button onclick="toggleMobileMenu(true)" class="lg:hidden p-2 text-obsidian hover:text-terracotta touch-target rounded-md">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>

      </div>
    </div>
  </header>

  <!-- MOBILE NAVIGATION DRAWER -->

      <div>

          <button onclick="toggleMobileMenu(false)" class="p-2 text-obsidian hover:text-terracotta">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <nav class="flex flex-col gap-4 py-6 text-base font-medium">
          <a href="#/shop" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></a>
          <a href="#/shop/makeup" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:54%"></span></a>

          <a href="#/shop/haircare" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:49%"></span></a>
          <a href="#/shop/fragrance" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></a>
          <a href="#/shop/body" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></a>
          <a href="#/shop/tools" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:59%"></span></a>
          <a href="#/brands" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:41%"></span></a>
          <a href="#/guides" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:76%"></span></a>
          <a href="#/offers" onclick="toggleMobileMenu(false)" class="text-terracotta font-semibold py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:70%"></span></a>
          <a href="#/wishlist" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:46%"></span></a>
          <a href="#/account" onclick="toggleMobileMenu(false)" class="text-obsidian hover:text-terracotta py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:68%"></span></a>
        </nav>

      <div class="pt-6 border-t border-border text-xs text-obsidian-muted space-y-2">

          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:49%"></span></span>

  <!-- QUICK SEARCH OVERLAY MODAL -->
  <div id="search-modal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true">
    <div onclick="closeSearchModal()" class="absolute inset-0 drawer-backdrop"></div>
    <div class="relative max-w-3xl mx-auto mt-16 sm:mt-24 bg-surface rounded-2xl shadow-2xl border border-border overflow-hidden mx-4">
      <div class="p-4 sm:p-6 border-b border-border flex items-center gap-4">
        <svg class="w-5 h-5 text-obsidian-muted shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="live-search-input" class="w-full text-base sm:text-lg bg-transparent focus:outline-none placeholder:text-obsidian-muted/60 text-obsidian" autocomplete="off" oninput="handleLiveSearch(this.value)" />
        <button onclick="closeSearchModal()" class="text-xs uppercase tracking-wider text-obsidian-muted hover:text-obsidian px-2 py-1 rounded bg-surface-subtle"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></button>
      </div>

      <!-- Quick suggestions / Recent searches -->
      <div id="search-results-container" class="max-h-[60vh] overflow-y-auto p-4 sm:p-6">
        <div class="mb-4">
          <p class="text-xs font-semibold uppercase tracking-wider text-obsidian-muted mb-3"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></p>
          <div class="flex flex-wrap gap-2">
            <button onclick="setSearchQuery('Lumina Serum')" class="text-xs px-3 py-1.5 bg-surface-subtle hover:bg-surface-accent rounded-full text-obsidian transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:59%"></span></button>
            <button onclick="setSearchQuery('Hydrating Lotion')" class="text-xs px-3 py-1.5 bg-surface-subtle hover:bg-surface-accent rounded-full text-obsidian transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:59%"></span></button>
            <button onclick="setSearchQuery('Mineral Veil Foundation')" class="text-xs px-3 py-1.5 bg-surface-subtle hover:bg-surface-accent rounded-full text-obsidian transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:62%"></span></button>
            <button onclick="setSearchQuery('Santal Sauvage')" class="text-xs px-3 py-1.5 bg-surface-subtle hover:bg-surface-accent rounded-full text-obsidian transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:59%"></span></button>
            <button onclick="setSearchQuery('Body Cream')" class="text-xs px-3 py-1.5 bg-surface-subtle hover:bg-surface-accent rounded-full text-obsidian transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:46%"></span></button>
          </div>
        </div>

        <div id="search-results-list" class="space-y-3">
          <!-- Dynamically injected results -->
        </div>
      </div>
    </div>
  </div>

  <!-- SLIDE-OVER SHOPPING BAG DRAWER -->
  <div id="cart-drawer" class="fixed inset-0 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
    <div onclick="toggleCartDrawer(false)" class="absolute inset-0 drawer-backdrop"></div>
    <div class="absolute inset-y-0 right-0 max-w-md w-full bg-canvas shadow-2xl p-6 flex flex-col justify-between transform translate-x-full transition-transform duration-300">
      
      <!-- Cart Header -->
      <div class="flex items-center justify-between pb-4 border-b border-border">
        <div class="flex items-center gap-2">
          <h2 class="font-editorial text-2xl font-semibold text-obsidian"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></h2>

        </div>
        <button onclick="toggleCartDrawer(false)" class="p-2 text-obsidian-muted hover:text-obsidian">

      </div>

      <div class="py-3 border-b border-border text-xs">
        <div class="flex justify-between font-medium mb-1.5">
          <span id="shipping-tracker-text"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></span>
          <span id="shipping-tracker-percentage"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span>
        </div>
        <div class="w-full h-1.5 bg-border rounded-full overflow-hidden">
          <div id="shipping-tracker-bar" class="h-full bg-terracotta transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- Cart Items Scroll Area -->
      <div id="cart-items-container" class="flex-1 overflow-y-auto py-4 space-y-4 no-scrollbar">
        <!-- Rendered dynamically -->
      </div>

      <!-- Cart Footer & Checkout Action -->
      <div class="pt-4 border-t border-border space-y-3">
        <!-- Coupon input -->
        <div class="flex gap-2">
          <input type="text" id="cart-promo-code" class="w-full text-xs px-3 py-2 border border-border rounded-lg bg-surface uppercase focus:outline-none focus:border-terracotta" />
          <button onclick="applyPromoCode()" class="text-xs font-semibold px-3 py-2 bg-surface-subtle hover:bg-surface-accent text-obsidian rounded-lg transition-colors whitespace-nowrap"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:14%"></span></button>
        </div>
        <div id="promo-code-feedback" class="text-[11px] text-terracotta hidden"></div>

        <div class="space-y-1.5 text-xs">
          <div class="flex justify-between text-obsidian-muted">
            <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></span>
            <span id="cart-subtotal" class="font-mono text-obsidian"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:14%"></span></span>
          </div>
          <div id="cart-discount-row" class="flex justify-between text-terracotta hidden">
            <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:54%"></span></span>
            <span id="cart-discount-amount" class="font-mono"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:19%"></span></span>
          </div>
          <div class="flex justify-between text-obsidian-muted">
            <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:49%"></span></span>
            <span id="cart-shipping-fee" class="font-mono text-obsidian"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:59%"></span></span>
          </div>
          <div class="flex justify-between text-sm font-semibold text-obsidian pt-2 border-t border-border">
            <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:14%"></span></span>
            <span id="cart-total-price" class="font-mono text-base"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:14%"></span></span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <a href="#/cart" onclick="toggleCartDrawer(false)" class="text-center py-2.5 px-4 text-xs font-semibold rounded-lg border border-border hover:bg-surface-subtle text-obsidian transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></a>
          <a href="#/checkout" onclick="toggleCartDrawer(false)" class="text-center py-2.5 px-4 text-xs font-semibold rounded-lg bg-obsidian hover:bg-terracotta text-white transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></a>
        </div>
        
        <p class="text-[11px] text-center text-obsidian-muted"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
      </div>

    </div>

    // Cart operations
    function addToCart(productId, selectedShade = null, selectedSize = null, quantity = 1) {
      const product = PRODUCTS_CATALOGUE.find(p => p.id === productId);
      if (!product) return;

      const itemKey = `${productId}_${selectedShade || 'default'}_${selectedSize || 'default'}`;
      const existingItem = store.cart.find(item => item.key === itemKey);

      let price = product.price;
      if (selectedSize && product.sizes && product.sizes.length > 0) {
        const matchedSize = product.sizes.find(s => s.label === selectedSize);
        if (matchedSize) price = matchedSize.price;
      }

      if (existingItem) {
        existingItem.quantity += quantity;
      } else {
        store.cart.push({
          key: itemKey,
          productId: product.id,
          name: product.name,
          brand: product.brand,
          image: product.image,
          price: price,
          shade: selectedShade,
          size: selectedSize || product.size,
          quantity: quantity
        });
      }

      saveCart();
      showToast(`Added ${product.name} to your bag`, 'success');
      toggleCartDrawer(true);
    }

    function updateCartItemQuantity(itemKey, delta) {
      const item = store.cart.find(i => i.key === itemKey);
      if (!item) return;

      item.quantity += delta;
      if (item.quantity <= 0) {
        store.cart = store.cart.filter(i => i.key !== itemKey);
      }
      saveCart();
    }

    function removeCartItem(itemKey) {
      store.cart = store.cart.filter(i => i.key !== itemKey);
      saveCart();
      showToast('Item removed from bag');
    }

    function toggleWishlist(productId) {
      const index = store.wishlist.indexOf(productId);
      const product = PRODUCTS_CATALOGUE.find(p => p.id === productId);
      if (index > -1) {
        store.wishlist.splice(index, 1);
        showToast(`Removed from wishlist`);
      } else {
        store.wishlist.push(productId);
        showToast(`Saved ${product ? product.name : ''} to wishlist`, 'success');
      }
      saveWishlist();
      
      // Update any heart icons on page
      document.querySelectorAll(`[data-wishlist-btn="${productId}"]`).forEach(btn => {
        const isSaved = store.wishlist.includes(productId);
        btn.classList.toggle('text-terracotta', isSaved);
        btn.classList.toggle('fill-current', isSaved);
      });
    }

    function applyPromoCode() {
      const input = document.getElementById('cart-promo-code');
      const feedback = document.getElementById('promo-code-feedback');
      if (!input || !feedback) return;

      const code = input.value.trim().toUpperCase();
      if (APP_CONFIG.promoCodes[code]) {
        store.discountCode = code;
        store.discountPercent = APP_CONFIG.promoCodes[code];
        localStorage.setItem('elura_discount_code', code);
        localStorage.setItem('elura_discount_percent', store.discountPercent);
        feedback.innerText = `Code applied! ${store.discountPercent * 100}% savings applied to subtotal.`;
        feedback.className = "text-[11px] text-emerald-600 block";
        updateCartUI();
        showToast(`Promo ${code} applied!`, 'success');
      } else {
        feedback.innerText = "Invalid promo code. Try ELURA10 for 10% off.";
        feedback.className = "text-[11px] text-terracotta block";
      }
    }

    function updateCartUI() {
      const count = store.cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = store.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const discount = subtotal * store.discountPercent;
      const total = subtotal - discount;

      // Update Nav badges
      const navCartCount = document.getElementById('nav-cart-count');
      if (navCartCount) navCartCount.innerText = count;

      const drawerCount = document.getElementById('cart-drawer-count');
      if (drawerCount) drawerCount.innerText = count;

      // Update Subtotal and Total in drawer
      const subtotalEl = document.getElementById('cart-subtotal');
      if (subtotalEl) subtotalEl.innerText = formatKES(subtotal);

      const discountRow = document.getElementById('cart-discount-row');
      const discountAmountEl = document.getElementById('cart-discount-amount');
      if (discountRow && discountAmountEl) {
        if (store.discountPercent > 0) {
          discountRow.classList.remove('hidden');
          discountAmountEl.innerText = `- ${formatKES(discount)}`;
        } else {
          discountRow.classList.add('hidden');
        }
      }

      const totalEl = document.getElementById('cart-total-price');
      if (totalEl) totalEl.innerText = formatKES(total);

      // Shipping progress bar
      const shippingBar = document.getElementById('shipping-tracker-bar');
      const shippingText = document.getElementById('shipping-tracker-text');
      const shippingPct = document.getElementById('shipping-tracker-percentage');
      if (shippingBar && shippingText && shippingPct) {
        const threshold = APP_CONFIG.freeShippingThreshold;
        const progress = Math.min(100, Math.round((subtotal / threshold) * 100));
        shippingBar.style.width = `${progress}%`;
        shippingPct.innerText = `${progress}%`;
        if (subtotal >= threshold) {
          shippingText.innerText = "You have unlocked Free Nairobi Delivery!";
        } else {
          shippingText.innerText = `Add ${formatKES(threshold - subtotal)} for Free Nairobi Delivery`;

    function closeSearchModal() {
      const modal = document.getElementById('search-modal');

    function handleLiveSearch(query) {
      const list = document.getElementById('search-results-list');
      if (!list) return;

      const trimmed = query.trim().toLowerCase();
      if (!trimmed) {
        list.innerHTML = '';
        return;
      }

      const matched = PRODUCTS_CATALOGUE.filter(p => 
        p.name.toLowerCase().includes(trimmed) ||
        p.brand.toLowerCase().includes(trimmed) ||
        p.category.toLowerCase().includes(trimmed) ||
        p.benefits.some(b => b.toLowerCase().includes(trimmed)) ||
        p.ingredients.toLowerCase().includes(trimmed)
      );

      if (matched.length === 0) {
        list.innerHTML = `
          <div class="text-center py-8 text-obsidian-muted">
            <p class="font-editorial text-lg text-obsidian">No botanical formulations found</p>
            <p class="text-xs mt-1">Try searching for "serum", "foundation", "cream", or "fragrance".</p>
          </div>
        `;
      } else {
        list.innerHTML = matched.slice(0, 6).map(p => `
          <a href="#/product/${p.id}" onclick="closeSearchModal()" class="flex items-center gap-3 p-2.5 rounded-xl hover:bg-surface-subtle transition-colors">
            <div class="w-12 h-14 rounded-lg overflow-hidden bg-surface-subtle shrink-0">
              <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='./src/assets/images/hero_product_pump_1791796869869.jpg';" />
            </div>
            <div class="flex-1 min-w-0">
              <p class="text-xs uppercase tracking-wider text-obsidian-light font-medium">${p.brand}</p>
              <p class="text-sm font-semibold text-obsidian truncate">${p.name}</p>
              <p class="text-xs font-mono text-terracotta font-medium">${formatKES(p.price)}</p>
            </div>
            <svg class="w-4 h-4 text-obsidian-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </a>
        `).join('');
      }
    }

    function setSearchQuery(text) {
      const input = document.getElementById('live-search-input');
      if (input) {
        input.value = text;
        handleLiveSearch(text);
      }
    }

    function openImageZoom(src) {
      const modal = document.getElementById('image-zoom-modal');

      if (modal && target) {

    function handleNewsletterSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('footer-newsletter-email');
      if (input && input.value) {
        showToast(`Thank you! 10% voucher code ELURA10 has been sent to ${input.value}`, 'success');
        input.value = '';
      }
    }

    // Keyboard shortcuts listener
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSearchModal();
        closeImageZoom();
        toggleCartDrawer(false);
        toggleMobileMenu(false);
        closeQuickViewModal();
      }
      if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {

    function togglePaymentInputs(method) {
      const box = document.getElementById('mpesa-details-box');
      if (box) {
        box.classList.toggle('hidden', method !== 'mpesa');

    }

    function handleCheckoutSubmission(e) {
      e.preventDefault();
      const method = document.querySelector('input[name="payment_method"]:checked')?.value || 'mpesa';
      
      if (method === 'mpesa') {
        const modal = document.getElementById('mpesa-simulation-modal');
        if (modal) {
          modal.classList.remove('hidden');
          // Timer simulation
          let countdown = 10;
          const timerEl = document.getElementById('stk-status-timer');
          const interval = setInterval(() => {
            countdown--;
            if (countdown <= 0) {
              clearInterval(interval);
              simulateConfirmMPesa();
            }
          }, 1000);
        }
      } else {
        // Paystack / Card direct processing simulation
        showToast('Processing Paystack transaction reference...', 'info');
        setTimeout(() => {
          simulateConfirmMPesa();
        }, 1500);
      }
    }

    function simulateConfirmMPesa() {
      const modal = document.getElementById('mpesa-simulation-modal');
      if (modal) modal.classList.add('hidden');

      const orderNumber = `ELR-2026-${Math.floor(10000 + Math.random() * 90000)}`;
      const subtotal = store.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const discount = subtotal * store.discountPercent;
      const isFreeShipping = subtotal >= APP_CONFIG.freeShippingThreshold;
      const shipping = isFreeShipping ? 0 : APP_CONFIG.standardShippingFee;
      const total = subtotal - discount + shipping;

      const orderRecord = {
        orderNumber: orderNumber,
        date: new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }),
        items: [...store.cart],
        subtotal: subtotal,
        discount: discount,
        shipping: shipping,
        total: total,
        paymentMethod: 'Lipa Na M-Pesa Online (Ref: QKJ' + Math.floor(100000 + Math.random() * 900000) + ')',
        status: 'Confirmed & Dispatched'
      };

      store.orders.unshift(orderRecord);
      localStorage.setItem('elura_orders', JSON.stringify(store.orders));

      // Clear Cart
      store.cart = [];
      saveCart();

      // Navigate to Order Success
      window.location.hash = `#/order-success?order=${orderNumber}`;
    }

    // VIEW: CUSTOMER CARE / CONTACT / DELIVERY / RETURNS

            <p class="text-xs sm:text-sm text-obsidian-muted mt-2">Élura Botaniques client care standards in Kenya.</p>

              </div>

              <div class="p-6 bg-surface rounded-2xl border border-border space-y-3">
                <h2 class="font-editorial text-2xl font-bold text-obsidian">Shade Match Guarantee</h2>

              <div class="p-6 bg-surface rounded-2xl border border-border space-y-3">
                <h2 class="font-editorial text-2xl font-bold text-obsidian">Return Conditions</h2>

    // --- 8. HASH ROUTER DISPATCHER ---
    function routeApp() {
      const hash = window.location.hash || '#/';
      const viewport = document.getElementById('app-viewport');
      if (!viewport) return;

      // Reset scroll position on route change
      window.scrollTo(0, 0);

      // Route Matching Logic
      if (hash === '#/' || hash === '#' || hash === '') {
        viewport.innerHTML = renderHomeView();
        document.title = "Élura Botaniques - Luxury Cosmetics & Skincare";
      } else if (hash.startsWith('#/product/')) {
        const id = hash.replace('#/product/', '').split('?')[0];
        viewport.innerHTML = renderProductDetailView(id);
        const prod = PRODUCTS_CATALOGUE.find(p => p.id === id);
        if (prod) document.title = `${prod.name} | Élura Botaniques`;
      } else if (hash.startsWith('#/shop')) {
        const parts = hash.replace('#/shop', '').split('/').filter(Boolean);
        const cat = parts[0] ? parts[0].split('?')[0] : 'all';
        const subcat = parts[1] ? parts[1].split('?')[0] : 'all';
        viewport.innerHTML = renderShopView(cat, subcat);
        document.title = "Shop Collection | Élura Botaniques";
      } else if (hash === '#/cart') {
        viewport.innerHTML = renderCartView();
        document.title = "Shopping Bag | Élura Botaniques";
      } else if (hash === '#/wishlist') {
        viewport.innerHTML = renderWishlistView();
        document.title = "Saved Wishlist | Élura Botaniques";
      } else if (hash === '#/checkout') {
        viewport.innerHTML = renderCheckoutView();
        document.title = "Checkout | Élura Botaniques";
      } else if (hash.startsWith('#/order-success')) {
        viewport.innerHTML = renderOrderSuccessView();
        document.title = "Order Verified | Élura Botaniques";
      } else if (hash === '#/account') {
        viewport.innerHTML = renderAccountView();
        document.title = "Customer Account | Élura Botaniques";
      } else if (hash.startsWith('#/brands/')) {
        const brandId = hash.replace('#/brands/', '').split('?')[0];
        viewport.innerHTML = renderBrandsView(brandId);
        document.title = "Brand Collection | Élura Botaniques";
      } else if (hash === '#/brands') {
        viewport.innerHTML = renderBrandsView();
        document.title = "Prestige Brand Directory | Élura Botaniques";
      } else if (hash === '#/guides') {
        viewport.innerHTML = renderGuidesView();
        document.title = "Beauty Guides & Masterclasses | Élura Botaniques";
      } else if (hash === '#/offers') {
        viewport.innerHTML = renderOffersView();
        document.title = "Offers & Gift Sets | Élura Botaniques";
      } else if (hash === '#/delivery') {
        viewport.innerHTML = renderStaticInfoView('delivery');
        document.title = "Delivery Terms | Élura Botaniques";
      } else if (hash === '#/returns') {
        viewport.innerHTML = renderStaticInfoView('returns');
        document.title = "Returns Policy | Élura Botaniques";
      } else if (hash === '#/contact') {
        viewport.innerHTML = renderStaticInfoView('contact');
        document.title = "Contact Concierge | Élura Botaniques";
      } else {
        // 404 View
        viewport.innerHTML = `
          <div class="max-w-xl mx-auto py-24 px-4 text-center">
            <h1 class="font-editorial text-5xl font-bold text-obsidian">Page Not Found</h1>
            <p class="text-xs text-obsidian-muted mt-2">The cosmetic formulation or page you are looking for has been relocated.</p>
            <a href="#/" class="mt-6 inline-block px-8 py-3 bg-obsidian text-canvas rounded-full text-xs font-semibold hover:bg-terracotta transition-colors">
              Return to Home
            </a>
          </div>
        `;
      }

      // Initialize GSAP reveals after mounting
      initMotion();
    }

    // PDP Interactive Helpers
    let pdpSelectedShade = '';
    let pdpSelectedSize = '';
    let pdpQuantity = 1;

    function selectPDPShade(name, hex) {
      pdpSelectedShade = name;
      const display = document.getElementById('pdp-selected-shade-name');
      if (display) display.innerText = name;
    }

    function selectPDPSize(label, price) {
      pdpSelectedSize = label;
      const priceDisplay = document.getElementById('pdp-price');
      if (priceDisplay) priceDisplay.innerText = formatKES(price);
    }

    function incrementPDPQty() {
      pdpQuantity++;
      const val = document.getElementById('pdp-quantity-val');
      if (val) val.innerText = pdpQuantity;
    }

    function decrementPDPQty() {
      if (pdpQuantity > 1) {
        pdpQuantity--;
        const val = document.getElementById('pdp-quantity-val');
        if (val) val.innerText = pdpQuantity;
      }
    }

    function executePDPAddToCart(productId) {
      const prod = PRODUCTS_CATALOGUE.find(p => p.id === productId);
      const shade = pdpSelectedShade || (prod?.shades?.[0]?.name) || null;
      const size = pdpSelectedSize || (prod?.size) || null;
      addToCart(productId, shade, size, pdpQuantity);
    }

    function executePDPBuyNow(productId) {
      executePDPAddToCart(productId);
      window.location.hash = '#/checkout';
    }

    // Filter change handlers
    function handleSortChange(sortVal) {
      store.filters.sort = sortVal;
      routeApp();
    }
    function handleBrandFilter(brandVal) {
      store.filters.brand = brandVal;
      routeApp();
    }
    function handlePriceFilter(val) {
      store.filters.priceMax = Number(val);
      const disp = document.getElementById('price-slider-display');
      if (disp) disp.innerText = formatKES(val);
      routeApp();
    }
    function resetFilters() {
      store.filters.brand = 'all';
      store.filters.priceMax = 15000;
      store.filters.sort = 'recommended';
      routeApp();
    }

    // --- 9. GSAP & SCROLLTRIGGER MOTION ORCHESTRATION ---
    function initMotion() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return; // Respect reduced motion
      }

      if (typeof gsap !== 'undefined') {
        try {
          gsap.from('#app-viewport h1, #app-viewport h2', {
            opacity: 0,
            y: 20,
            duration: 0.8,
            ease: "power2.out",
            stagger: 0.1
          });
        } catch (e) {
          // Graceful fallback if GSAP encounters error
        }
      }
    }

    // --- 10. APP BOOTSTRAP ---
    window.addEventListener('DOMContentLoaded', () => {
      // Initialize current year
      const yearEl = document.getElementById('current-year');
      if (yearEl) yearEl.innerText = new Date().getFullYear();

      // Initial Cart & Wishlist sync
      updateCartUI();
      updateWishlistUI();

      // Initial Route Dispatch
      routeApp();
    });

    window.addEventListener('hashchange', () => {
      routeApp();
    });
  </script>
