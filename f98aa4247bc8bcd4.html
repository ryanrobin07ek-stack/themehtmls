<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Ujenzi Hub - Building Materials, Stone & Hardware Supplies</title>
  <meta name="description" content="Direct quarry stone cladding, certified cement, high-tensile steel rebar, timber, roofing, and contractor building supplies in Kenya with site offloading." />
  <meta property="og:title" content="Ujenzi Hub - Building Materials, Stone & Hardware Supplies" />
  <meta property="og:description" content="Direct quarry stone cladding, certified cement, high-tensile steel rebar, timber, roofing, and contractor building supplies in Kenya with site offloading." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#132E3A" />
  <meta name="color-scheme" content="only light" />
  <style>

/* RESET & MOBILE CONSTRAINTS */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
a, button, input, select, textarea, label, [onclick] { touch-action: manipulation; }

:root {
  color-scheme: only light;
  --ff-brand: #132E3A;
  --ff-bg: #F4F7F9;
  --ff-surface: #FFFFFF;
  --ff-card-bg: #FFFFFF;
  --ff-text: #0F172A;
  --ff-muted: #64748B;
  --ff-accent: #2582A1;
  --ff-border: #D8E3EB;
  --ff-hero-bg: #CBE4F2;
  --ff-hero-text: #132E3A;
  --ff-btn-bg: #132E3A;
  --ff-btn-text: #FFFFFF;
  --ff-card-radius: 10px;
  --ff-card-border: 1px solid #D8E3EB;
  --ff-card-padding: 14px;
  --ff-heading-font: "Arial Narrow", "Roboto Condensed", "Helvetica Neue Condensed", Arial, sans-serif;
  --ff-body-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ff-heading-weight: 900;
  --ff-heading-transform: uppercase;
  --ff-letter-spacing: -0.03em;
  --ff-safe-bottom: env(safe-area-inset-bottom, 0px);
}

html {
  max-width: 100%;
  overflow-x: clip;
  background-color: #DDE3E8;
}

body {
  background-color: #DDE3E8;
  color: var(--ff-text);
  font-family: var(--ff-body-font);
  line-height: 1.5;
  font-size: 15px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 100%;
  overflow-x: hidden;
}

#app-container {
  width: 100%;
  max-width: 480px;
  background-color: var(--ff-surface);
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 35px rgba(19, 46, 58, 0.12);
  padding-bottom: calc(115px + var(--ff-safe-bottom));
  overflow-x: clip;
}

a { color: inherit; text-decoration: none; }
button { color: inherit; font-family: inherit; cursor: pointer; border: none; background: none; }
input, select, textarea { font-family: inherit; font-size: 16px; }

/* CONDENSED HEADINGS */
h1, h2, h3, h4, .brand-title, .section-title, .btn-action, .stat-value {
  font-family: var(--ff-heading-font);
  font-weight: var(--ff-heading-weight);
  text-transform: var(--ff-heading-transform);
  letter-spacing: var(--ff-letter-spacing);
  line-height: 1.1;
}

/* TOP ANNOUNCEMENT BAR */
.promo-ticker {
  background-color: var(--ff-brand);
  color: #FFFFFF;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 8px 12px;
  text-align: center;
}

/* HEADER */
.store-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background-color: #FFFFFF;
  border-bottom: 1px solid var(--ff-border);
  padding: 10px 14px 6px;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}
.brand-title {
  font-size: 21px;
  color: var(--ff-brand);
  white-space: nowrap;
}
.search-pill-wrap {
  display: flex;
  align-items: center;
  background-color: #F1F5F9;
  border-radius: 8px;
  padding: 4px 6px 4px 12px;
  border: 1px solid var(--ff-border);
  margin-bottom: 8px;
}
.search-pill-wrap:focus-within {
  border-color: var(--ff-brand);
  background-color: #FFFFFF;
}
.search-pill-input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  color: #0F172A;
  font-size: 15px;
}
.search-pill-btn {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background-color: var(--ff-brand);
  color: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
}
.search-pill-btn svg { width: 15px; height: 15px; }

.header-icons { display: flex; align-items: center; gap: 4px; }
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--ff-brand);
}
.icon-btn:active { background-color: #F1F5F9; }
.badge-count {
  position: absolute;
  top: 3px;
  right: 3px;
  background-color: #DC2626;
  color: #FFFFFF;
  font-size: 10px;
  font-weight: 900;
  min-width: 17px;
  height: 17px;
  border-radius: 9999px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* SUB-NAV HORIZONTAL CATEGORY MENU */
.sub-nav {
  display: flex;
  align-items: center;
  gap: 14px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 6px 0 8px;
  border-top: 1px solid #F1F5F9;
}
.sub-nav::-webkit-scrollbar { display: none; }
.sub-nav-link {
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ff-muted);
  white-space: nowrap;
  padding: 3px 0;
  position: relative;
}
.sub-nav-link.active, .sub-nav-link:hover { color: var(--ff-brand); }
.sub-nav-link.active::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 0;
  right: 0;
  height: 2.5px;
  background-color: var(--ff-accent);
  border-radius: 2px;
}

/* HERO SECTION (SKY BLUE, CONDENSED TITLE, STATIC ILLUSTRATION COLLAGE) */
.hero-banner {
  background-color: var(--ff-hero-bg);
  color: var(--ff-hero-text);
  padding: 24px 16px 20px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.section-tag-label {
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ff-accent);
  margin-bottom: 6px;
}
.hero-title {
  font-size: 30px;
  line-height: 1.05;
  margin-bottom: 10px;
  color: var(--ff-hero-text);
}
.hero-subtitle {
  font-size: 13px;
  line-height: 1.45;
  color: #334155;
  margin-bottom: 18px;
  max-width: 95%;
}
.hero-btn-row {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.btn-primary {
  background-color: var(--ff-brand);
  color: #FFFFFF;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 12px 18px;
  border-radius: 6px;
  text-align: center;
  box-shadow: 0 4px 12px rgba(19, 46, 58, 0.18);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-secondary {
  background-color: #FFFFFF;
  color: var(--ff-brand);
  border: 1.5px solid var(--ff-brand);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 12px 18px;
  border-radius: 6px;
  text-align: center;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-primary:active, .btn-secondary:active { transform: scale(0.98); }

/* HERO MATERIAL COLLAGE */
.hero-materials-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 6px;
}
.hero-material-card {
  background: #FFFFFF;
  border-radius: 8px;
  border: 1px solid #BED8E8;
  padding: 6px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(19, 46, 58, 0.06);
}
.hero-material-art {
  width: 100%;
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-material-name {
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  color: #1E293B;
  margin-top: 4px;
}

/* SECTION BLOCKS */
.section-block {
  padding: 24px 16px;
}
.section-header-wrap {
  text-align: left;
  margin-bottom: 16px;
}
.section-title {
  font-size: 22px;
  color: var(--ff-text);
  line-height: 1.15;
}
.section-desc {
  font-size: 12.5px;
  color: var(--ff-muted);
  margin-top: 4px;
}

/* 4 FEATURE CARDS */
.feature-grid-4 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.feature-box {
  background: #FFFFFF;
  border: 1px solid var(--ff-border);
  border-radius: 8px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.feature-icon-wrap {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background-color: #EBF4F9;
  color: var(--ff-accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.feature-icon-wrap svg { width: 18px; height: 18px; }
.feature-box-title {
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--ff-brand);
}
.feature-box-text {
  font-size: 11px;
  color: var(--ff-muted);
  line-height: 1.35;
}

/* PRODUCT CARD & GRID */
.product-grid-2col {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.product-card {
  background-color: var(--ff-surface);
  border-radius: var(--ff-card-radius);
  border: var(--ff-card-border);
  padding: var(--ff-card-padding);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: var(--ff-card-shadow, none);
}
.card-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
  min-height: 22px;
}
.card-brand-tag {
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--ff-muted);
}
.card-badge-pill {
  font-size: 8.5px;
  font-weight: 900;
  background: #DCFCE7;
  color: #15803D;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
}
.card-wish-btn {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background-color: #F8FAFC;
  border: 1px solid #E2E8F0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #94A3B8;
}
.card-wish-btn.active { color: #DC2626; border-color: #FECACA; background: #FEF2F2; }
.card-img-wrap {
  width: 100%;
  height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 4px 0 10px;
  background: #F8FAFC;
  border-radius: 6px;
  padding: 4px;
}
.card-img-wrap svg, .card-img-wrap img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.card-name {
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--ff-text);
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 4px;
}
.card-price-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 8px;
}
.card-price {
  font-size: 14px;
  font-weight: 900;
  color: var(--ff-brand);
}
.card-unit {
  font-size: 10.5px;
  color: var(--ff-muted);
}
.card-quick-add {
  margin-top: auto;
  width: 100%;
  background-color: var(--ff-brand);
  color: #FFFFFF;
  font-size: 10.5px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 8px 10px;
  border-radius: 6px;
  text-align: center;
}
.card-quote-link {
  display: block;
  font-size: 9.5px;
  font-weight: 800;
  text-align: center;
  color: var(--ff-accent);
  margin-top: 6px;
  text-transform: uppercase;
}

/* DARK TEAL SECTION (From Reference Image) */
.dark-teal-block {
  background-color: var(--ff-brand);
  color: #FFFFFF;
  padding: 28px 16px;
}
.dark-teal-block .section-tag-label { color: #7DD3FC; }
.dark-teal-block .section-title { color: #FFFFFF; margin-bottom: 8px; }
.dark-teal-block .section-desc { color: #CBD5E1; margin-bottom: 20px; }
.dark-tiles-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.dark-tile-card {
  background-color: #1C4454;
  border: 1px solid #2B576C;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.dark-tile-art {
  width: 100%;
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #132E3A;
  border-radius: 6px;
}
.dark-tile-name {
  font-size: 11.5px;
  font-weight: 900;
  text-transform: uppercase;
  color: #FFFFFF;
}
.dark-tile-count {
  font-size: 9.5px;
  font-weight: 800;
  color: #7DD3FC;
}

/* QUANTITY CALCULATOR WIDGET */
.calculator-container {
  background: #FFFFFF;
  border: 1.5px solid var(--ff-border);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 4px 16px rgba(19, 46, 58, 0.06);
}
.calc-nav-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-bottom: 14px;
}
.calc-tab-btn {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 6px;
  background: #F1F5F9;
  color: #475569;
  white-space: nowrap;
}
.calc-tab-btn.active {
  background: var(--ff-brand);
  color: #FFFFFF;
}
.calc-result-box {
  background: #EBF5FB;
  border: 1px solid #BAE6FD;
  border-radius: 8px;
  padding: 14px;
  margin: 14px 0;
}
.calc-stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 13px;
  margin-bottom: 6px;
}
.calc-stat-label { color: #334155; font-weight: 700; }
.calc-stat-val { font-size: 16px; font-weight: 900; color: var(--ff-brand); }

/* TESTIMONIALS */
.testimonial-card {
  background: #FFFFFF;
  border: 1px solid var(--ff-border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 12px;
}
.test-stars { color: #F59E0B; font-size: 13px; margin-bottom: 6px; }
.test-text { font-size: 12.5px; line-height: 1.5; color: #334155; margin-bottom: 10px; }
.test-author { font-size: 12px; font-weight: 900; text-transform: uppercase; color: var(--ff-brand); }
.test-role { font-size: 10.5px; color: var(--ff-muted); }

/* BRAND STRIP */
.brand-grid-4x4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.brand-strip-item {
  background: #FFFFFF;
  border: 1px solid var(--ff-border);
  border-radius: 6px;
  padding: 8px 4px;
  text-align: center;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  color: #334155;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* WIDE CTA BANNER */
.banner-wide-block {
  background: var(--ff-brand);
  color: #FFFFFF;
  padding: 24px 16px;
  text-align: center;
}
.banner-wide-title { font-size: 24px; color: #FFFFFF; margin-bottom: 6px; }
.banner-wide-sub { font-size: 12.5px; color: #CBD5E1; margin-bottom: 16px; max-width: 90%; margin-left: auto; margin-right: auto; }

/* GUIDES */
.guide-card {
  background: #FFFFFF;
  border: 1px solid var(--ff-border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.guide-meta { font-size: 10px; font-weight: 800; color: var(--ff-accent); text-transform: uppercase; }
.guide-card-title { font-size: 14px; font-weight: 900; text-transform: uppercase; color: var(--ff-brand); line-height: 1.25; }
.guide-card-excerpt { font-size: 12px; color: var(--ff-muted); line-height: 1.4; margin-top: 4px; }

/* FOOTER */
.store-footer {
  background-color: var(--ff-brand);
  color: #FFFFFF;
  padding: 32px 16px 20px;
}
.footer-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}
.footer-col-title {
  font-size: 11.5px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #7DD3FC;
  margin-bottom: 10px;
}
.footer-link-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.footer-link { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #CBD5E1; }
.footer-link:hover { color: #FFFFFF; }
.footer-watermark {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  text-align: center;
  color: #FFFFFF;
  opacity: 0.15;
  margin: 16px 0;
}
.footer-bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid #1E4454;
  padding-top: 14px;
  font-size: 10px;
  font-weight: 800;
  color: #94A3B8;
  text-transform: uppercase;
}

/* FIXED BOTTOM CUSTOMER BAR */
.fixed-bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: calc(56px + var(--ff-safe-bottom));
  padding-bottom: var(--ff-safe-bottom);
  background-color: #FFFFFF;
  border-top: 1.5px solid var(--ff-border);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 50;
  box-shadow: 0 -3px 12px rgba(19, 46, 58, 0.08);
}
.nav-tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: #64748B;
  font-size: 9.5px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  width: 20%;
  height: 100%;
}
.nav-tab-item.active { color: var(--ff-brand); }
.nav-tab-item svg { width: 19px; height: 19px; }

/* FLOATING BUTTONS */
.floating-whatsapp {
  position: fixed;
  bottom: calc(66px + var(--ff-safe-bottom));
  right: calc(50% - 228px);
  z-index: 45;
  background-color: #25D366;
  color: #FFFFFF;
  border-radius: 9999px;
  padding: 8px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 900;
  box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
}
@media (max-width: 480px) { .floating-whatsapp { right: 14px; } }
.floating-chatbot {
  position: fixed;
  bottom: calc(66px + var(--ff-safe-bottom));
  left: calc(50% - 228px);
  z-index: 45;
  background-color: var(--ff-brand);
  color: #FFFFFF;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(19, 46, 58, 0.3);
}
@media (max-width: 480px) { .floating-chatbot { left: 14px; } }

/* BOTTOM SHEET MODAL */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.6);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.bottom-sheet {
  background-color: #FFFFFF;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
}
.sheet-overlay.open .bottom-sheet { transform: translateY(0); }
.sheet-header {
  padding: 14px 16px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--ff-border);
}
.sheet-title { font-size: 16px; font-weight: 900; text-transform: uppercase; color: var(--ff-brand); }
.sheet-content { padding: 16px; overflow-y: auto; flex: 1; }
.sheet-footer { padding: 12px 16px; border-top: 1px solid var(--ff-border); display: flex; gap: 8px; }

/* FORMS */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #334155;
  margin-bottom: 5px;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  border: 1.5px solid #CBD5E1;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 15px;
  color: #0F172A;
  background-color: #FFFFFF;
  outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--ff-brand); }

/* BROWSE BAR */
.browse-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: #FFFFFF;
  border-bottom: 1px solid var(--ff-border);
}
.filter-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #F1F5F9;
  border: 1px solid #CBD5E1;
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 11.5px;
  font-weight: 800;
  color: #0F172A;
}

/* STUDIO SUITE */
html.studio-mode #promo-ticker,
html.studio-mode #main-header,
html.studio-mode #customer-bottom-nav,
html.studio-mode #main-footer,
html.studio-mode #floating-whatsapp,
html.studio-mode #floating-chatbot { display: none !important; }
html.studio-mode #app-container { padding-bottom: 24px; }

.studio-shell {
  background: #FFFFFF;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.studio-header {
  background-color: #132E3A;
  color: #FFFFFF;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.studio-nav-tabs {
  background-color: #1E4454;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px 6px;
}
.studio-tab-btn {
  color: #CBD5E1;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 8px 12px;
  white-space: nowrap;
  border-radius: 4px;
}
.studio-tab-btn.active { color: #FFFFFF; background-color: #27566B; }
.studio-body { padding: 16px; flex: 1; }
.studio-card-box {
  background: #F8FAFC;
  border: 1px solid var(--ff-border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
}

/* CARDS PER ROW ATTRIBUTE SUPPORT */
html[data-card-cols="1"] .product-grid-2col { grid-template-columns: 1fr; }
html[data-card-cols="3"] .product-grid-2col { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
html[data-card-cols="4"] .product-grid-2col { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
html[data-card-cols="3"] .product-card { padding: 8px; }
html[data-card-cols="3"] .card-img-wrap { height: 75px; }
html[data-card-cols="3"] .card-name { font-size: 10px; }
html[data-card-cols="3"] .card-price { font-size: 11px; }

/* SWATCH PILL */
.swatch-circle {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid #FFFFFF;
  outline: 2px solid transparent;
  cursor: pointer;
}
.swatch-circle.selected { outline-color: var(--ff-brand); transform: scale(1.1); }

  "guides": [
    {
      "id": "gd-001",
      "slug": "how-to-choose-the-right-cement-grade",
      "title": "How to Choose the Right Cement Grade: 32.5N vs 42.5R Explained",
      "date": "14 Oct 2026",
      "readTime": "5 min read",
      "author": "Eng. Peter Kariuki, PE",
      "excerpt": "Why pouring structural columns with 32.5 grade can compromise multi-storey spans, and when to specify rapid-hardening 42.5R.",
      "content": "<p>Selecting cement is the single most critical decision in structural concrete work. Cement bags sold across Kenya are classified primarily under KS EAS 18-1 standards into strength classes: 32.5N, 32.5R, 42.5N, and 42.5R.</p><h4>When to Use Grade 32.5N / 32.5R</h4><p>Grade 32.5 is formulated for non-structural masonry, boundary wall plastering, screeding, and low-load domestic floor slabs. It cures with lower heat of hydration, drastically reducing shrinkage cracks in large surface areas like perimeter rendering.</p><h4>When to Specify Grade 42.5N / 42.5R</h4><p>For reinforced structural members — foundations, ground beams, suspended slabs, and columns — 42.5R (such as Bamburi PowerMax or Simba 42.5) is mandatory. It attains early 2-day compressive strength exceeding 20 MPa, allowing contractors to strip formwork safely on schedule.</p>"
    },
    {
      "id": "gd-002",
      "slug": "how-to-calculate-floor-tile-coverage-and-wastage",
      "title": "How to Calculate Floor Tile Coverage & Cut Wastage",
      "date": "10 Oct 2026",
      "readTime": "4 min read",
      "author": "David Maina, Lead Fundi",
      "excerpt": "A practical guide to calculating total square meters, diagonal cuts, perimeter skirting, and factoring in 10-15% site breakage.",
      "content": "<p>Ordering exact square meters of tiles always leads to stalled projects. Diagonal laying patterns, door reveals, and pipe penetrations require off-cut wastage.</p><h4>The Standard Formula</h4><p><strong>Step 1:</strong> Calculate Net Room Area = Length (m) x Width (m).<br/><strong>Step 2:</strong> Add Skirting Area = Perimeter (m) x 0.1m height.<br/><strong>Step 3:</strong> Multiply by Wastage Factor: Add 10% for straight grid alignment, or 15% for 45-degree herringbone or diagonal layout.<br/><strong>Step 4:</strong> Divide total square meters by carton yield (e.g. 1.44 m² per box of 600x600 tiles) and round UP to the nearest carton.</p>"
    },
    {
      "id": "gd-003",
      "slug": "choosing-between-box-profile-and-corrugated-roofing",
      "title": "Box Profile vs Corrugated Roofing Sheets: Wind & Rain Performance",
      "date": "04 Oct 2026",
      "readTime": "6 min read",
      "author": "Architect Grace Wambui",
      "excerpt": "Deep rib structural rigidity versus traditional curved iron. Which gauge (Gauge 28 or Gauge 30) offers better value on tropical roofs?",
      "content": "<p>Roofing profile dictates not only visual aesthetics but also water evacuation velocity and rafter purlin spacing.</p><h4>Box Profile (Trapezoidal Ribs)</h4><p>With 28mm deep longitudinal ribs, box profile sheets resist wind uplift across wider purlin spacings (up to 900mm). The flat pan channels high rainwater volumes quickly into gutters without side-lapping leaks.</p><h4>Gauge Selection: 28 vs 30</h4><p>Gauge 28 (0.32mm nominal thickness) is recommended for permanent residential houses. It withstands walking traffic during tank maintenance without denting, unlike lightweight Gauge 30.</p>"
    },
    {
      "id": "gd-004",
      "slug": "waterproofing-substructure-foundations-in-black-cotton-soil",
      "title": "Waterproofing Substructure Foundations in Black Cotton Soil",
      "date": "28 Sep 2026",
      "readTime": "5 min read",
      "author": "Eng. Peter Kariuki, PE",
      "excerpt": "How damp-proof membranes (DPM), crystalline admixtures, and bitumen primer prevent capillary moisture from climbing ground walls.",
      "content": "<p>Black cotton soil in Nairobi, Athi River and Thika swells significantly during rainy seasons. Rising damp attacks plaster, weakens mortar, and creates fungal blooms.</p><h4>Layered Defense</h4><p>Always lay 1000-gauge polythene damp-proof membrane over blinding sand before casting the slab. Above ground beam level, install an embossed 500-micron DPC barrier under the first course of wall stone.</p>"
    },
    {
      "id": "gd-005",
      "slug": "deformed-rebar-diameters-and-bending-schedules",
      "title": "Guide to High-Tensile Deformed Rebar: D8, D10, D12 & D16",
      "date": "20 Sep 2026",
      "readTime": "4 min read",
      "author": "Ujenzi Technical Desk",
      "excerpt": "Understanding bar sizes, standard 12-meter lengths, hook allowances, and bar bending schedules for reinforced concrete.",
      "content": "<p>All Ujenzi Hub rebar conforms to Kenya Standard KS 573 / BS 4449 Grade 500C with high elongation ductility. Here is the standard reference:</p><ul><li><strong>D8 (8mm):</strong> Column stirrups (links) and beam rings.</li><li><strong>D10 (10mm):</strong> Solid slab bottom mesh and staircase reinforcement.</li><li><strong>D12 (12mm):</strong> Foundation raft grids, ground beams and standard columns.</li><li><strong>D16 (16mm):</strong> Heavy multi-storey columns and long transfer beams.</li></ul>"
    },
    {
      "id": "gd-006",
      "slug": "paint-primer-and-moisture-preparation-guide",
      "title": "Surface Preparation & Primers: How to Prevent Peeling Paint",
      "date": "12 Sep 2026",
      "readTime": "5 min read",
      "author": "Crown Technical Specialist",
      "excerpt": "Why fresh plaster must cure for 28 days before painting, and why alkali-resistant acrylic primer is mandatory.",
      "content": "<p>Over 80% of paint failures (peeling, flaking, efflorescence) stem from poor wall preparation rather than bad paint.</p><h4>Alkali Burning in Fresh Plaster</h4><p>Hydrated lime in wet cement plaster has a pH above 12. Applying finish emulsion directly destroys the binder resin. Allow 28 days drying, then apply one generous coat of Penetrating Alkali-Resistant Primer before topcoating.</p>"
    }
  ],

    // UTILITIES
    function formatCurrency(amount) {
      const sym = site.currencySymbol || 'KSh';
      return sym + ' ' + Math.round(amount || 0).toLocaleString();
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function showToast(msg) {
      const ex = document.getElementById('global-toast');
      if (ex) ex.remove();
      const toast = document.createElement('div');
      toast.id = 'global-toast';
      toast.textContent = msg;
      toast.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#132E3A; color:#FFFFFF; font-size:12px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; padding:10px 18px; border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:99999; pointer-events:none; transition:all 0.25s ease;';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2600);
    }
    window.showToast = showToast;

    // PERSISTENCE
    function pushUndoState() {
      undoStack.push(JSON.stringify(site));
      if (undoStack.length > 20) undoStack.shift();
      redoStack = [];
    }
    function scheduleSave() {
      if (saveTimeout) clearTimeout(saveTimeout);
      const st = document.getElementById('studio-save-status');
      if (st) st.textContent = 'Saving...';
      saveTimeout = setTimeout(flushSave, 400);
    }
    function flushSave() {
      try {
        localStorage.setItem(CFG.storage.siteKey, JSON.stringify(site));
        localStorage.setItem(CFG.storage.cartKey, JSON.stringify(cart));
        localStorage.setItem(CFG.storage.savedKey, JSON.stringify(Array.from(savedIds)));
        localStorage.setItem(CFG.storage.ordersKey, JSON.stringify(orders));
        localStorage.setItem(CFG.storage.quotesKey, JSON.stringify(quotes));
        const st = document.getElementById('studio-save-status');
        if (st) st.textContent = 'Saved';
      } catch (err) {
        console.warn('Storage save warning:', err);
      }
    }
    function loadSavedState() {
      try {
        const rev = String(initialSiteData.dataRevision || 1);
        const appRev = localStorage.getItem(CFG.storage.revisionKey);
        if (appRev !== rev) localStorage.setItem(CFG.storage.revisionKey, rev);
        const savedSite = appRev === rev ? localStorage.getItem(CFG.storage.siteKey) : null;
        if (savedSite) {
          const parsed = JSON.parse(savedSite);
          if (parsed && parsed.products && parsed.products.length > 0) site = parsed;
        }
        const savedCart = localStorage.getItem(CFG.storage.cartKey);
        if (savedCart) cart = JSON.parse(savedCart);
        const savedWish = localStorage.getItem(CFG.storage.savedKey);
        if (savedWish) savedIds = new Set(JSON.parse(savedWish));
        const savedOrders = localStorage.getItem(CFG.storage.ordersKey);
        if (savedOrders) orders = JSON.parse(savedOrders);
        const savedQuotes = localStorage.getItem(CFG.storage.quotesKey);
        if (savedQuotes) quotes = JSON.parse(savedQuotes);
      } catch (e) {
        console.warn('Load storage state error:', e);
      }
    }

    // THEME INJECTION
    function applyThemeToDom() {
      const activeTheme = site.themes.find(t => t.id === site.activeThemeId) || site.themes[0];
      const root = document.documentElement;
      if (activeTheme && activeTheme.colors) {
        const c = activeTheme.colors;
        root.style.setProperty('--ff-brand', c.brand || '#132E3A');
        root.style.setProperty('--ff-bg', c.background || '#F4F7F9');
        root.style.setProperty('--ff-surface', c.surface || '#FFFFFF');
        root.style.setProperty('--ff-card-bg', c.surfaceCard || '#FFFFFF');
        root.style.setProperty('--ff-text', c.textPrimary || '#0F172A');
        root.style.setProperty('--ff-muted', c.textMuted || '#64748B');
        root.style.setProperty('--ff-accent', c.accent || '#2582A1');
        root.style.setProperty('--ff-border', c.border || '#D8E3EB');
        root.style.setProperty('--ff-hero-bg', c.heroBg || '#CBE4F2');
        root.style.setProperty('--ff-hero-text', c.heroText || '#132E3A');
        root.style.setProperty('--ff-btn-bg', c.buttonBg || '#132E3A');
        root.style.setProperty('--ff-btn-text', c.buttonText || '#FFFFFF');
      }
      const ty = site.typography || (activeTheme && activeTheme.typography) || {};
      if (ty.headingFont) root.style.setProperty('--ff-heading-font', ty.headingFont);
      if (ty.bodyFont) root.style.setProperty('--ff-body-font', ty.bodyFont);
      if (ty.headingWeight) root.style.setProperty('--ff-heading-weight', ty.headingWeight);
      if (ty.headingTransform) root.style.setProperty('--ff-heading-transform', ty.headingTransform);
      if (ty.letterSpacing) root.style.setProperty('--ff-letter-spacing', ty.letterSpacing);

      const cl = site.cardLayoutSettings || {};
      root.style.setProperty('--ff-card-radius', cl.radius || '10px');
      root.style.setProperty('--ff-card-border', (cl.borderWidth || '1px') + ' ' + (cl.borderStyle || 'solid') + ' ' + (cl.borderColor || '#D8E3EB'));
      root.style.setProperty('--ff-card-padding', cl.padding || '14px');
      root.style.setProperty('--ff-card-shadow', cl.shadow || 'none');
      const cols = parseInt(cl.columns, 10);
      if (cols >= 1 && cols <= 4) root.dataset.cardCols = String(cols);
      else delete root.dataset.cardCols;

      // Update header and footer branding
      const headerTitle = document.getElementById('header-brand-title');
      if (headerTitle) headerTitle.textContent = site.name;
      const footerWatermark = document.getElementById('footer-huge-watermark');
      if (footerWatermark) footerWatermark.textContent = site.name;
      const promoEl = document.getElementById('promo-ticker');
      if (promoEl && site.promo) {
        promoEl.style.display = site.promo.enabled !== false ? 'block' : 'none';
        promoEl.textContent = site.promo.text || '';
        if (site.promo.bg) promoEl.style.backgroundColor = site.promo.bg;
        if (site.promo.color) promoEl.style.color = site.promo.color;
      }
      renderFooterColumns();
      computeCart();
    }

    // CART CALCULATIONS
    function computeCart() {
      let subtotal = 0;
      let count = 0;
      for (const item of cart) {
        subtotal += (item.price || 0) * (item.quantity || 1);
        count += (item.quantity || 1);
      }
      const zoneId = window.selectedDeliveryZoneId || (site.deliveryZones[0] ? site.deliveryZones[0].id : '');
      const currentZone = (site.deliveryZones || []).find(z => z.id === zoneId) || site.deliveryZones[0];
      const threshold = site.freeShippingThreshold || 50000;
      const shipping = subtotal >= threshold || cart.length === 0 ? 0 : (currentZone ? currentZone.fee : site.shippingFlatRate || 1500);
      const tax = Math.round(subtotal * (site.taxRate || 0.16));
      const total = subtotal + shipping + tax;

      const cartBadge = document.getElementById('cart-badge');
      if (cartBadge) {
        cartBadge.textContent = count;
        cartBadge.style.display = count > 0 ? 'flex' : 'none';
      }
      const wishBadge = document.getElementById('wishlist-badge');
      if (wishBadge) {
        wishBadge.textContent = savedIds.size;
        wishBadge.style.display = savedIds.size > 0 ? 'flex' : 'none';
      }
      return { subtotal, shipping, tax, total, count, currentZone };
    }

    // RENDER: PRODUCT CARD
    function renderProductCard(p) {
      if (!p) return '';
      const isSaved = savedIds.has(p.id);
      const activeColor = p.colors && p.colors[0] ? p.colors[0].hex : '#132E3A';
      const unitText = p.unit ? ' / ' + p.unit : '';
      const hasImage = p.image && !p.image.startsWith('art:');
      const imgHtml = hasImage
        ? '<img src="' + escapeHtml(p.image) + '" alt="' + escapeHtml(p.name) + '" loading="lazy" />'
        : window.materialSvg(p.category, activeColor);

      return `
        <div class="product-card" data-product-id="${p.id}">
          <div class="card-top-bar">
            <span class="card-brand-tag">${escapeHtml(p.brand)}</span>
            <button class="card-wish-btn ${isSaved ? 'active' : ''}" onclick="window.toggleWishlist('${p.id}', event)" aria-label="Save Material">
              ${isSaved ? ICONS.heartFilled : ICONS.heart}
            </button>
          </div>
          <a href="/product/${p.slug}" class="card-img-wrap">
            ${imgHtml}
          </a>
          <a href="/product/${p.slug}" class="card-name">${escapeHtml(p.name)}</a>
          <div class="card-price-row">
            <span class="card-price">${formatCurrency(p.price)}</span>
            <span class="card-unit">${escapeHtml(unitText)}</span>
          </div>
          <button class="card-quick-add" onclick="window.quickAddToCart('${p.id}')">QUICK ADD</button>
          <a href="/quote?prod=${encodeURIComponent(p.slug)}" class="card-quote-link">REQUEST BQ QUOTE</a>
        </div>
      `;

    // CALCULATOR RENDERER & INTERACTION
    window.renderCalculatorMarkup = function(calc) {
      if (!calc) return '';
      return `
        <div style="margin-bottom:10px;">
          <div style="font-size:13px; font-weight:900; color:var(--ff-brand); margin-bottom:4px;">${escapeHtml(calc.name)}</div>
          <div style="font-size:11.5px; color:#475569;">${escapeHtml(calc.description)}</div>
        </div>
        <div class="form-group">
          <label class="form-label">${escapeHtml(calc.inputLabel)} (${escapeHtml(calc.inputUnit)})</label>
          <input type="number" step="0.1" min="1" id="calc-input-val" class="form-input" value="35" oninput="window.runCalculatorComputation('${calc.id}')" />
        </div>
        <div class="form-group">
          <label class="form-label">Cut & Corner Wastage Buffer (%)</label>
          <select id="calc-wastage-val" class="form-select" onchange="window.runCalculatorComputation('${calc.id}')">
            <option value="5">5% (Simple Rectangular Layout)</option>
            <option value="10" selected>10% (Standard Perimeter Cuts)</option>
            <option value="15">15% (Diagonal / Complex Angles)</option>
          </select>
        </div>
        <div class="calc-result-box" id="calc-dynamic-result">
          <!-- Filled dynamically -->
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-primary" style="flex:1;" id="calc-add-cart-btn" onclick="window.addCalculatorYieldToCart('${calc.id}')">ADD CALCULATED QUANTITY TO CART</button>
        </div>
      `;
    };

    window.switchCalculator = function(calcId) {
      const calc = (site.calculators || []).find(c => c.id === calcId);
      if (!calc) return;
      document.querySelectorAll('#home-quantity-calc .calc-tab-btn').forEach(b => {
        b.classList.toggle('active', b.textContent === calc.name);
      });
      const v = document.getElementById('active-calc-view');
      if (v) {
        v.innerHTML = window.renderCalculatorMarkup(calc);
        window.runCalculatorComputation(calc.id);
      }
    };

    window.runCalculatorComputation = function(calcId) {
      const calc = (site.calculators || []).find(c => c.id === calcId) || (site.calculators || [])[0];
      const valInput = parseFloat(document.getElementById('calc-input-val')?.value) || 0;
      const wastage = parseFloat(document.getElementById('calc-wastage-val')?.value) || 10;
      const resultBox = document.getElementById('calc-dynamic-result');
      if (!resultBox) return;

      const grossArea = valInput * (1 + wastage / 100);
      let units = 0;
      let unitName = 'Cartons';
      let prod = site.products.find(p => p.slug === calc.productSlug) || site.products[0];

      if (calc.material === 'tiles') {
        const yieldBox = calc.perCartonSqm || 1.44;
        units = Math.ceil(grossArea / yieldBox);
        unitName = 'Boxes (1.44 m² each)';
      } else if (calc.material === 'paint') {
        const litres = (grossArea * 2) / (calc.coveragePerLitre || 12);
        units = Math.ceil(litres / 20);
        unitName = '20-Litre Buckets (' + Math.round(litres) + ' Litres Total)';
      } else if (calc.material === 'blocks') {
        units = Math.ceil(grossArea * (calc.blocksPerSqm || 12.5));
        unitName = 'Machine-Cut Stones (9x9)';
      } else if (calc.material === 'concrete') {
        units = Math.ceil(valInput * (calc.cementBagsPerCbm || 6.8));
        unitName = '50kg Cement Bags (+ Sand & Ballast)';
      } else if (calc.material === 'roofing') {
        units = Math.ceil(valInput / (calc.effectiveWidthMetres || 0.82));
        unitName = '3-Meter Roofing Sheets';
      }

      window.lastCalculatedQty = units;
      window.lastCalculatedProdId = prod ? prod.id : '';

      resultBox.innerHTML = `
        <div class="calc-stat-row">
          <span class="calc-stat-label">Net Surface Area:</span>
          <span>${valInput} ${calc.inputUnit}</span>
        </div>
        <div class="calc-stat-row">
          <span class="calc-stat-label">Wastage Buffer (${wastage}%):</span>
          <span>+${(grossArea - valInput).toFixed(1)} ${calc.inputUnit}</span>
        </div>
        <div class="calc-stat-row" style="border-top:1px solid #BAE6FD; padding-top:6px; margin-top:6px;">
          <span class="calc-stat-label" style="font-weight:900; color:var(--ff-brand);">RECOMMENDED QUANTITY:</span>
          <span class="calc-stat-val">${units} ${unitName}</span>
        </div>
        <div style="font-size:11px; color:#475569; margin-top:4px;">
          Matching Product: <strong>${prod ? escapeHtml(prod.name) : ''}</strong> &bull; ${prod ? formatCurrency(prod.price * units) : ''}
        </div>
      `;
    };

    window.addCalculatorYieldToCart = function(calcId) {
      const calc = (site.calculators || []).find(c => c.id === calcId);
      const prod = site.products.find(p => p.slug === calc.productSlug) || site.products[0];
      const qty = window.lastCalculatedQty || 10;
      if (!prod) return;

      const sizeObj = prod.sizes[0] || { size: 'Standard', price: prod.price, sku: prod.id };
      const color = prod.colors[0] || { name: 'Standard', hex: '#132E3A' };
      const ex = cart.find(c => c.productId === prod.id && c.size === sizeObj.size);
      if (ex) ex.quantity += qty;
      else {
        cart.push({
          id: 'item-' + Date.now(),
          productId: prod.id,
          name: prod.name,
          brand: prod.brand,
          colorName: color.name,
          colorHex: color.hex,
          size: sizeObj.size,
          sku: sizeObj.sku,
          price: sizeObj.price,
          quantity: qty
        });
      }
      scheduleSave();
      computeCart();
      showToast('Added ' + qty + ' units of ' + prod.name + ' to cart!');
    };

      const brand = params.brand || 'all';

                        p.brand.toLowerCase().includes(q) ||
                        p.category.toLowerCase().includes(q) ||

        if (brand !== 'all' && p.brand !== brand) return false;

      else if (sortBy === 'price-desc') filtered.sort((a,b) => b.price - a.price);

      } else if (subRoute === 'products') {
        subContent = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h3 style="font-size:14px; font-weight:900;">PRODUCT CATALOG (${site.products.length})</h3>
            <button class="btn-primary" style="font-size:11px; padding:6px 12px;" onclick="window.openNewProductModal()">+ NEW MATERIAL</button>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; max-height:480px; overflow-y:auto;">
            ${site.products.map(p => `
              <div style="background:#FFFFFF; border:1px solid #D8E3EB; border-radius:8px; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:12px; font-weight:900; color:var(--ff-brand);">${escapeHtml(p.name)}</div>
                  <div style="font-size:10.5px; color:#64748B;">${escapeHtml(p.brand)} &bull; ${formatCurrency(p.price)} &bull; ${p.category}</div>
                </div>
                <div style="display:flex; gap:4px;">
                  <button class="btn-secondary" style="font-size:10px; padding:4px 8px;" onclick="window.openEditProductModal('${p.id}')">EDIT</button>
                  <button class="btn-secondary" style="font-size:10px; padding:4px 8px; color:#DC2626;" onclick="window.deleteProduct('${p.id}')">DEL</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (subRoute === 'sections') {
        subContent = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h3 style="font-size:14px; font-weight:900;">HOMEPAGE SECTION BUILDER</h3>
            <button class="btn-primary" style="font-size:11px; padding:6px 12px;" onclick="window.openAddSectionModal()">+ ADD SECTION</button>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${site.sections.map((s, idx) => `
              <div style="background:#FFFFFF; border:1px solid #D8E3EB; border-radius:8px; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:12px; font-weight:900; color:var(--ff-brand);">${escapeHtml(s.name || s.title || s.type)}</div>
                  <div style="font-size:10px; color:#64748B;">Type: ${s.type} &bull; ${s.enabled ? 'Visible' : 'Hidden'}</div>
                </div>
                <div style="display:flex; gap:4px;">
                  <button class="btn-secondary" style="font-size:10px; padding:4px 6px;" onclick="window.moveSection(${idx}, -1)">&uarr;</button>
                  <button class="btn-secondary" style="font-size:10px; padding:4px 6px;" onclick="window.moveSection(${idx}, 1)">&darr;</button>
                  <button class="btn-secondary" style="font-size:10px; padding:4px 8px;" onclick="window.toggleSectionEnabled(${idx})">${s.enabled ? 'HIDE' : 'SHOW'}</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (subRoute === 'themes') {
        subContent = `
          <h3 style="font-size:14px; font-weight:900; margin-bottom:12px;">SELECT STORE THEME (10 THEMES)</h3>
          <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:20px;">
            ${site.themes.map(t => `
              <div style="background:#FFFFFF; border:1.5px solid ${t.id === site.activeThemeId ? 'var(--ff-brand)' : '#D8E3EB'}; border-radius:8px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <div style="font-size:12.5px; font-weight:900; color:var(--ff-brand);">${escapeHtml(t.name)}</div>
                  <div style="font-size:10.5px; color:#64748B;">${escapeHtml(t.description)}</div>
                </div>
                <button class="btn-primary" style="font-size:10px; padding:6px 12px;" onclick="window.applyTheme('${t.id}')">
                  ${t.id === site.activeThemeId ? 'ACTIVE' : 'APPLY'}
                </button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (subRoute === 'card-layouts') {
        subContent = `
          <div class="studio-card-box">
            <h3 style="font-size:14px; font-weight:900; margin-bottom:10px;">CARDS PER ROW</h3>
            <div style="display:flex; gap:6px;">
              ${[1, 2, 3, 4].map(n => `
                <button class="btn-secondary ${(site.cardLayoutSettings?.columns || 2) === n ? 'btn-primary' : ''}" style="flex:1; padding:10px 0;" onclick="window.updateCardColumns(${n})">
                  ${n} ${n === 1 ? 'Col' : 'Cols'}
                </button>
              `).join('')}
            </div>
          </div>
          <div class="studio-card-box">
            <h3 style="font-size:14px; font-weight:900; margin-bottom:10px;">CARD CORNER RADIUS: ${site.cardLayoutSettings?.radius || '10px'}</h3>
            <input type="range" min="0" max="24" value="${parseInt(site.cardLayoutSettings?.radius || '10')}" class="form-input" oninput="window.updateCardRadius(this.value)" />
          </div>
        `;
      } else if (subRoute === 'calculators') {
        subContent = `
          <h3 style="font-size:14px; font-weight:900; margin-bottom:10px;">SITE CALCULATOR DEFINITIONS</h3>
          ${(site.calculators || []).map((c, i) => `
            <div class="studio-card-box">
              <div class="form-group">
                <label class="form-label">Calculator Name</label>
                <input type="text" class="form-input" value="${escapeHtml(c.name)}" onchange="window.updateCalculatorField(${i}, 'name', this.value)" />
              </div>
              <div class="form-group">
                <label class="form-label">Input Label</label>
                <input type="text" class="form-input" value="${escapeHtml(c.inputLabel)}" onchange="window.updateCalculatorField(${i}, 'inputLabel', this.value)" />
              </div>
              <div class="form-group">
                <label class="form-label">Linked Product Slug</label>
                <input type="text" class="form-input" value="${escapeHtml(c.productSlug)}" onchange="window.updateCalculatorField(${i}, 'productSlug', this.value)" />
              </div>
            </div>
          `).join('')}
        `;
      } else if (subRoute === 'quotes') {
        subContent = `
          <h3 style="font-size:14px; font-weight:900; margin-bottom:10px;">INCOMING BQ QUOTES (${quotes.length})</h3>
          ${quotes.length === 0 ? '<div class="studio-card-box">No contractor quotes logged yet.</div>' : `
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${quotes.map(q => `
                <div class="studio-card-box">
                  <div style="display:flex; justify-content:space-between; font-weight:900; font-size:12px;">
                    <span>#${q.id} &bull; ${escapeHtml(q.name)}</span>
                    <span style="color:var(--ff-accent);">${q.status.toUpperCase()}</span>
                  </div>
                  <div style="font-size:11px; color:#64748B; margin:4px 0;">Phone: ${escapeHtml(q.phone)} &bull; Location: ${escapeHtml(q.location)}</div>
                  <p style="font-size:12px; color:#334155;">${escapeHtml(q.notes || 'No notes')}</p>
                </div>
              `).join('')}
            </div>
          `}
        `;
      } else if (subRoute === 'settings') {
        subContent = `
          <div class="studio-card-box">
            <h3 style="font-size:14px; font-weight:900; margin-bottom:12px;">BACKUP, EXPORT & RESTORE</h3>
            <div style="display:flex; gap:8px;">
              <button class="btn-primary" style="flex:1;" onclick="window.exportSiteJSON()">EXPORT SITE JSON</button>
              <button class="btn-secondary" style="flex:1;" onclick="window.promptImportSiteJSON()">IMPORT JSON</button>
            </div>
            <div style="margin-top:16px; padding-top:14px; border-top:1px solid #D8E3EB;">
              <button class="btn-secondary" style="border-color:#DC2626; color:#DC2626;" onclick="window.resetStoreToDefaults()">RESET ALL TO INITIAL DEFAULTS</button>
            </div>
          </div>
        `;
      } else {
        subContent = '<div class="studio-card-box">Dashboard panel ready. Select a tab above to edit.</div>';
      }

      main.innerHTML = `
        <div class="studio-shell">
          <div class="studio-header">
            <div style="font-weight:900; letter-spacing:0.04em;">UJENZI STUDIO ADMIN</div>
            <div style="display:flex; gap:8px; align-items:center;">
              <span id="studio-save-status" style="font-size:10px; color:#94A3B8;">Saved</span>
              <a href="/" class="btn-primary" style="font-size:10px; padding:4px 8px; background:#2582A1;">VIEW STORE</a>
            </div>
          </div>
          <div class="studio-nav-tabs">
            ${tabs.map(t => `
              <a href="/studio/${t.id}" class="studio-tab-btn ${subRoute === t.id ? 'active' : ''}">${t.label}</a>
            `).join('')}
          </div>
          <div class="studio-body">
            ${subContent}
          </div>
        </div>
      `;
    }

    // ROUTER
    function handleRoute(path) {
      window.scrollTo(0, 0);
      let pathname = path || window.location.pathname;
      if (pathname.includes('#')) pathname = pathname.split('#')[1] || '/';
      if (pathname.includes('?')) pathname = pathname.split('?')[0];

      if (APP_MODE === 'studio' && !pathname.startsWith('/studio')) pathname = '/studio/dashboard';
      if (APP_MODE === 'store' && pathname.startsWith('/studio')) {
        window.location.replace('/studio.html');
        return;
      }

      document.querySelectorAll('.nav-tab-item').forEach(el => {
        el.classList.remove('active');
        if (pathname === '/' && el.dataset.nav === 'home') el.classList.add('active');
        else if (pathname.startsWith('/browse') && el.dataset.nav === 'browse') el.classList.add('active');
        else if (pathname.startsWith('/saved') && el.dataset.nav === 'saved') el.classList.add('active');
        else if (pathname.startsWith('/cart') && el.dataset.nav === 'cart') el.classList.add('active');
        else if (pathname.startsWith('/account') && el.dataset.nav === 'account') el.classList.add('active');
      });

      renderSubNav();

      if (pathname === '/' || pathname === '') renderHomePage();
      else if (pathname === '/browse') renderBrowsePage();
      else if (pathname.startsWith('/category/')) {
        const parts = pathname.replace('/category/', '').split('/');
        renderCategoryPage(parts[0], parts[1]);
      } else if (pathname.startsWith('/brand/')) {
        renderBrandPage(pathname.replace('/brand/', ''));
      } else if (pathname.startsWith('/product/')) {
        renderProductDetailPage(pathname.replace('/product/', ''));
      } else if (pathname === '/quote') renderQuotePage();
      else if (pathname === '/guides') renderGuidesIndex();
      else if (pathname.startsWith('/guides/')) {
        renderGuidePostPage(pathname.replace('/guides/', ''));
      } else if (pathname === '/cart') renderCartPage();
      else if (pathname === '/checkout') renderCheckoutPage();
      else if (pathname === '/saved') renderSavedPage();
      else if (pathname === '/account' || pathname === '/orders') renderAccountPage();
      else if (pathname === '/location') renderLocationPage();
      else if (pathname.startsWith('/pages/')) {
        renderCustomPage(pathname.replace('/pages/', ''));
      } else if (pathname.startsWith('/studio')) {
        const sub = pathname.replace('/studio/', '').replace('/studio', '') || 'dashboard';
        renderStudio(sub);
      } else {
        renderHomePage();
      }
    }

    function navigate(url) {
      try {
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          history.pushState(null, '', url);
          handleRoute(url);
          return;
        }
      } catch (err) {}
      window.location.hash = url;
      handleRoute(url);
    }

    document.addEventListener('click', (e) => {
      const anchor = e.target.closest('a');
      if (!anchor) return;
      const href = anchor.getAttribute('href');
      if (href && href.startsWith('/') && !href.startsWith('//')) {
        e.preventDefault();
        navigate(href);
      }
    });

    window.addEventListener('popstate', () => handleRoute(window.location.pathname));
    window.addEventListener('hashchange', () => handleRoute(window.location.hash.replace('#', '')));

    // GLOBAL ACTIONS & EVENT HANDLERS
    window.toggleWishlist = function(id, e) {
      if (e) e.stopPropagation();
      if (savedIds.has(id)) savedIds.delete(id);
      else savedIds.add(id);
      scheduleSave();
      computeCart();
      const cur = window.location.pathname;
      if (cur === '/saved') renderSavedPage();
      else {
        const btn = document.querySelector('[data-product-id="' + id + '"] .card-wish-btn');
        if (btn) {
          const isSaved = savedIds.has(id);
          btn.classList.toggle('active', isSaved);
          btn.innerHTML = isSaved ? ICONS.heartFilled : ICONS.heart;
        }
      }
    };

    window.quickAddToCart = function(id) {
      const p = site.products.find(x => x.id === id);
      if (!p) return;
      const sizeObj = (p.sizes && p.sizes[0]) || { size: 'Standard', price: p.price, sku: p.id };
      const color = (p.colors && p.colors[0]) || { name: 'Standard', hex: '#132E3A' };
      const ex = cart.find(c => c.productId === p.id && c.size === sizeObj.size);
      if (ex) ex.quantity++;
      else {
        cart.push({
          id: 'item-' + Date.now(),
          productId: p.id,
          name: p.name,
          brand: p.brand,
          colorName: color.name,
          colorHex: color.hex,
          size: sizeObj.size,
          sku: sizeObj.sku,
          price: sizeObj.price,
          quantity: 1
        });
      }
      scheduleSave();
      computeCart();
      showToast('Added ' + p.name + ' to cart!');
    };

    window.selectProductColor = function(id, idx) {
      const p = site.products.find(x => x.id === id);
      if (!p || !p.colors[idx]) return;
      selectedColor[id] = p.colors[idx];
      const box = document.getElementById('pdp-art-box');
      if (box) box.innerHTML = window.materialSvg(p.category, p.colors[idx].hex);
      document.querySelectorAll('.swatch-circle').forEach((el, i) => el.classList.toggle('selected', i === idx));
    };

    window.selectProductSize = function(id, size) {
      selectedSize[id] = size;
      const p = site.products.find(x => x.id === id);
      if (!p) return;
      const sizeObj = (p.sizes || []).find(s => s.size === size);
      if (sizeObj) {
        const disp = document.getElementById('pdp-price-disp');
        if (disp) disp.textContent = formatCurrency(sizeObj.price);
      }
      renderProductDetailPage(p.slug);
    };

    window.addToCartFromPdp = function(id) {
      window.quickAddToCart(id);
    };

    window.buyNowFromPdp = function(id) {
      window.quickAddToCart(id);
      navigate('/cart');
    };

    window.updateCartQty = function(idx, delta) {
      if (!cart[idx]) return;
      cart[idx].quantity += delta;
      if (cart[idx].quantity <= 0) cart.splice(idx, 1);
      scheduleSave();
      renderCartPage();
    };

    window.removeCartItem = function(idx) {
      if (!cart[idx]) return;
      cart.splice(idx, 1);
      scheduleSave();
      renderCartPage();
    };

    window.selectDeliveryZone = function(zoneId) {
      window.selectedDeliveryZoneId = zoneId;
      renderCartPage();
    };

    window.filterHomepageGrid = function(cat, btn) {
      document.querySelectorAll('.calc-nav-tabs .calc-tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const grid = document.getElementById('homepage-product-grid');
      if (!grid) return;
      const prods = cat === 'all' ? site.products.slice(0, 12) : site.products.filter(p => p.category === cat);
      grid.innerHTML = prods.map(renderProductCard).join('');
    };

    window.orderOnWhatsApp = function(prodId) {
      const p = site.products.find(x => x.id === prodId);
      if (!p) return;
      const num = site.whatsappOrder?.number || '254700123456';
      const size = selectedSize[p.id] || (p.sizes[0] ? p.sizes[0].size : 'Standard');
      const text = `Hello Ujenzi Hub! I would like to order:
Material: ${p.name} (${p.brand})
Specification/Size: ${size}
Price: ${formatCurrency(p.price)}
Site Delivery Location:
Link: ${window.location.origin}/product/${p.slug}`;
      window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(text), '_blank');
    };

    window.handleQuoteFormSubmit = function(e) {
      e.preventDefault();
      const name = document.getElementById('bq-client-name').value;
      const phone = document.getElementById('bq-client-phone').value;
      const email = document.getElementById('bq-client-email').value;
      const location = document.getElementById('bq-site-location').value;
      const projectType = document.getElementById('bq-project-type').value;
      const notes = document.getElementById('bq-notes').value;
      const incCart = document.getElementById('include-cart-in-bq')?.checked;

      const quoteId = 'BQ-' + Math.floor(1000 + Math.random() * 9000);
      const itemsSummary = incCart ? cart.map(i => i.name + ' (' + i.quantity + ')').join(', ') : 'Custom BQ schedule';

      quotes.unshift({
        id: quoteId,
        name,
        phone,
        email,
        location,
        projectType,
        notes,
        status: 'received',
        date: new Date().toLocaleDateString('en-GB')
      });
      scheduleSave();

      const num = site.whatsappOrder?.number || '254700123456';
      const msg = `Hello Ujenzi Hub! I submitted a Bill of Quantities quote request:
Quote Ref: #${quoteId}
Contractor: ${name}
Location: ${location}
Project: ${projectType}
Details: ${notes}
Items: ${itemsSummary}`;

      window.open('https://wa.me/' + num + '?text=' + encodeURIComponent(msg), '_blank');
      navigate('/account');
      showToast('BQ Quote #' + quoteId + ' submitted!');
    };

    window.handleCheckoutSubmit = function(e) {
      e.preventDefault();
      const name = document.getElementById('co-name').value;
      const phone = document.getElementById('co-phone').value;
      const email = document.getElementById('co-email').value;
      const address = document.getElementById('co-address').value;
      const { total } = computeCart();

      const orderId = 'UH-' + Math.floor(10000 + Math.random() * 90000);
      orders.unshift({
        id: orderId,
        name,
        phone,
        email,
        address,
        total,
        status: 'dispatched',
        date: new Date().toLocaleDateString('en-GB'),
        items: [...cart]
      });
      cart = [];
      scheduleSave();
      computeCart();
      showToast('Order #' + orderId + ' placed successfully!');
      navigate('/account');
    };

    window.handleNewsletterSubmit = function(e) {
      e.preventDefault();
      const inp = document.getElementById('news-email');
      if (inp) {
        showToast('Subscribed to construction price alerts!');
        inp.value = '';
      }
    };

    // STUDIO ACTIONS
    window.applyTheme = function(id) {
      pushUndoState();
      site.activeThemeId = id;
      applyThemeToDom();
      scheduleSave();
      renderStudio('themes');
    };

    window.updateCardColumns = function(n) {
      pushUndoState();
      site.cardLayoutSettings = site.cardLayoutSettings || {};
      site.cardLayoutSettings.columns = n;
      applyThemeToDom();
      scheduleSave();
      renderStudio('card-layouts');
    };

    window.updateCardRadius = function(val) {
      pushUndoState();
      site.cardLayoutSettings = site.cardLayoutSettings || {};
      site.cardLayoutSettings.radius = val + 'px';
      applyThemeToDom();
      scheduleSave();
    };

    window.moveSection = function(idx, delta) {
      pushUndoState();
      const target = idx + delta;
      if (target < 0 || target >= site.sections.length) return;
      const tmp = site.sections[idx];
      site.sections[idx] = site.sections[target];
      site.sections[target] = tmp;
      scheduleSave();
      renderStudio('sections');
    };

    window.toggleSectionEnabled = function(idx) {
      pushUndoState();
      site.sections[idx].enabled = !site.sections[idx].enabled;
      scheduleSave();
      renderStudio('sections');
    };

    window.deleteProduct = function(id) {
      if (!confirm('Delete this material from catalog?')) return;
      pushUndoState();
      site.products = site.products.filter(p => p.id !== id);
      scheduleSave();
      renderStudio('products');
    };

    window.exportSiteJSON = function() {
      const blob = new Blob([JSON.stringify(site, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = CFG.backupFileName || 'ujenzi_hub_backup.json';
      a.click();
    };

    window.resetStoreToDefaults = function() {
      if (confirm('Reset all materials and themes to initial factory defaults?')) {
        localStorage.clear();
        site = JSON.parse(JSON.stringify(initialSiteData));
        cart = [];
        savedIds = new Set();
        orders = [];
        quotes = [];
        applyThemeToDom();
        scheduleSave();
        renderStudio('dashboard');
      }
    };

    // INITIALIZATION
    loadSavedState();
    applyThemeToDom();
    handleRoute(window.location.pathname + window.location.search);
  })();
  
  </script>
</body>
</html>
