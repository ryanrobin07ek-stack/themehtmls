  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* CSS Custom Properties - Savanna at Golden Hour */
    :root {
      --c-bg: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-01);
      --c-bg-alt: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-02);
      --c-surface: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-03);
      --c-surface-card: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-04);
      --c-surface-elevated: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-05);
      --c-surface-light: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-06);
      
      --c-amber: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-07);
      --c-amber-hover: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-08);
      --c-burnt-orange: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-09);
      --c-ochre: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-10);
      --c-terracotta: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-11);
      --c-acacia: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-12);
      --c-acacia-light: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-13);
      --c-sand: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-14);
      
      --c-text-primary: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-15);
      --c-text-secondary: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-16);
      --c-text-muted: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-17);
      --c-border: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-18);
      --c-border-subtle: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-19);
      --c-border-highlight: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-20);

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      
      --container-max: 1360px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 14px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Reset & Base Typography */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--c-bg);
      color: var(--c-text-primary);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--c-bg);
    }

    h1, h2, h3, h4, h5, .font-serif {
      font-family: var(--font-display);
      font-weight: 500;
      line-height: 1.15;
      color: var(--c-text-primary);
      text-wrap: balance;
    }

    p {
      color: var(--c-text-secondary);
      font-weight: 400;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
      transition: var(--transition);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Container Utility */
    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    @media (min-width: 768px) {
      .container {
        padding-left: 2.5rem;
        padding-right: 2.5rem;
      }
    }

    /* Navigation Bar */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transition: background-color 0.3s ease, border-color 0.3s ease, padding 0.3s ease;
      background: linear-gradient(180deg, var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-21) 0%, var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-22) 100%);
      padding: 1.25rem 0;
    }

    .site-header.scrolled {
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-23);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--c-border-subtle);
      padding: 0.85rem 0;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    /* Zone 1: Wordmark */
    .brand-logo {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--c-text-primary);
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-logo span.accent {
      color: var(--c-amber);
      font-style: italic;
    }

    /* Zone 2: Navigation Links */
    .nav-links {
      display: none;
      align-items: center;
      gap: 1.75rem;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    @media (min-width: 1024px) {
      .nav-links {
        display: flex;
      }
    }

    .nav-link {
      color: var(--c-text-secondary);
      position: relative;
      padding: 0.35rem 0;
      white-space: nowrap;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--c-text-primary);
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--c-amber);
    }

    .nav-dropdown {
      position: relative;
    }

    .nav-dropdown-menu {
      position: absolute;
      top: 100%;
      left: -1rem;
      margin-top: 0.5rem;
      background: var(--c-surface-card);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-md);
      padding: 0.75rem 0;
      min-width: 210px;
      box-shadow: 0 16px 36px var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-24);
      display: none;
      flex-direction: column;
      z-index: 101;
    }

    .nav-dropdown:hover .nav-dropdown-menu,
    .nav-dropdown:focus-within .nav-dropdown-menu {
      display: flex;
    }

    .nav-dropdown-item {
      padding: 0.5rem 1.25rem;
      color: var(--c-text-secondary);
      font-size: 0.85rem;
      transition: var(--transition);
      display: block;
    }

    .nav-dropdown-item:hover {
      color: var(--c-amber);
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-25);
    }

    /* Zone 3: CTA & Mobile Hamburger */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--c-burnt-orange);
      color: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-26);
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.65rem 1.35rem;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      transition: var(--transition);
      border: 1px solid var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-27);
    }

    .btn-primary:hover {
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-28);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-29);
    }

    .btn-secondary {
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-30);
      color: var(--c-text-primary);
      border: 1px solid var(--c-border);
      font-size: 0.86rem;
      font-weight: 500;
      padding: 0.65rem 1.35rem;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      transition: var(--transition);
    }

    .btn-secondary:hover {
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-31);
      border-color: var(--c-ochre);
      color: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-26);
    }

    .btn-outline {
      border: 1px solid var(--c-border);
      color: var(--c-sand);
      font-size: 0.86rem;
      font-weight: 500;
      padding: 0.55rem 1.15rem;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
    }

    .btn-outline:hover {
      border-color: var(--c-amber);
      color: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-26);
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-32);
    }

    .mobile-menu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--c-border);
      border-radius: var(--radius-sm);
      color: var(--c-text-primary);
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-33);
    }

    @media (min-width: 1024px) {
      .mobile-menu-btn {
        display: none;
      }
    }

    /* Mobile Drawer */
    .mobile-drawer {
      position: fixed;
      inset: 0;
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-34);
      z-index: 200;
      padding: 2rem;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      backdrop-filter: blur(16px);
    }

    .mobile-drawer.open {
      display: flex;
    }

    .mobile-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--c-border-subtle);
      padding-bottom: 1.25rem;
    }

    .mobile-drawer-links {
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      margin-bottom: 2.5rem;
    }

    .mobile-drawer-link {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--c-text-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-33);
    }

    .mobile-drawer-link:hover, .mobile-drawer-link.active {
      color: var(--c-amber);
    }

    /* Main Content Viewport */
    main#app-view {
      flex: 1;
      min-height: calc(100vh - 80px);
    }

    /* Hero Section */
    .hero-section {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 8rem 0 5rem 0;
      background-color: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-35);
      overflow: hidden;
    }

    .hero-media-wrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 42%;
      transform: scale(1.02);
      transition: transform 1.2s ease;
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, 
        var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-36) 0%, 
        var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-37) 40%, 
        var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-38) 80%, 
        var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-34) 100%
      );
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
      margin-top: auto;
      padding-bottom: 2rem;
    }

    .hero-kicker {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.88rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--c-amber);
      margin-bottom: 1.25rem;
    }

    .hero-headline {
      font-size: clamp(2.75rem, 6vw, 5.25rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-26);
      margin-bottom: 1.5rem;
      text-shadow: 0 4px 20px var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-24);
    }

    .hero-subhead {
      font-size: clamp(1.05rem, 1.8vw, 1.25rem);
      color: var(--c-sand);
      line-height: 1.6;
      max-width: 640px;
      margin-bottom: 2.25rem;
      text-shadow: 0 2px 10px var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-39);
    }

    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3.5rem;
    }

    .hero-vehicle-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-40);
      border: 1px solid var(--c-border);
      backdrop-filter: blur(8px);
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      color: var(--c-text-secondary);
    }

    .hero-vehicle-badge strong {
      color: var(--c-ochre);
      font-weight: 600;
    }

    /* Safari Quick Search Bar */
    .hero-booking-bar {
      position: relative;
      z-index: 3;
      margin-top: -3.5rem;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: 0 24px 48px var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-39);
    }

    .booking-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .booking-grid {
        grid-template-columns: repeat(2, 1fr) auto;
      }
    }

    @media (min-width: 1024px) {
      .booking-grid {
        grid-template-columns: repeat(4, 1fr) auto;
      }
    }

    .booking-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .booking-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--c-ochre);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .booking-input {
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-33);
      border: 1px solid var(--c-border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.85rem;
      color: var(--c-text-primary);
      font-size: 0.88rem;
      outline: none;
      transition: var(--transition);
      width: 100%;
    }

    .booking-input:focus {
      border-color: var(--c-amber);
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-41);
    }

    .booking-input option {
      background: var(--c-surface-card);
      color: var(--c-text-primary);
    }

    /* Sections Shared Styling */
    .section-padding {
      padding: 5.5rem 0;
    }

    .section-header {
      margin-bottom: 3.5rem;
    }

    .section-header.text-center {
      text-align: center;
      max-width: 780px;
      margin-left: auto;
      margin-right: auto;
    }

    .section-kicker {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--c-ochre);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: clamp(2rem, 3.8vw, 3.25rem);
      margin-bottom: 1rem;
    }

    .section-subtitle {
      font-size: 1.05rem;
      color: var(--c-text-secondary);
      max-width: 680px;
    }

    /* Horizontal Continuous Rail / Marquee */
    .marquee-container {
      overflow: hidden;
      position: relative;
      width: 100%;
      padding: 1.5rem 0;
    }

    .marquee-track {
      display: flex;
      gap: 1.75rem;
      width: max-content;
      will-change: transform;
    }

    .marquee-card {
      width: 340px;
      flex-shrink: 0;
      background: var(--c-surface);
      border: 1px solid var(--c-border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: var(--transition);
    }

    .marquee-card:hover {
      border-color: var(--c-border-highlight);
      transform: translateY(-4px);
    }

    .marquee-img-wrap {
      width: 100%;
      height: 200px;
      overflow: hidden;
      position: relative;
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-42);
    }

    .marquee-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .marquee-card:hover .marquee-img-wrap img {
      transform: scale(1.05);
    }

    .marquee-body {
      padding: 1.25rem;
    }

    .marquee-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--c-ochre);
      margin-bottom: 0.4rem;
    }

    .marquee-title {
      font-size: 1.35rem;
      margin-bottom: 0.5rem;
    }

    /* Grid Layouts for Safaris & Destinations */
    .safari-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .safari-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1100px) {
      .safari-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .safari-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }

    .safari-card:hover {
      border-color: var(--c-border-highlight);
      transform: translateY(-5px);
      box-shadow: 0 16px 36px var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-24);
    }

    .safari-card-media {
      position: relative;
      height: 240px;
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-43);
      overflow: hidden;
    }

    .safari-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .safari-card:hover .safari-card-media img {
      transform: scale(1.06);
    }

    .safari-card-duration {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--theme-olkeri-expeditions-luxury-kenya-safaris-color-21);
      border: 1px solid var(--c-border);
      backdrop-filter: blur(6px);
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--c-sand);
    }

    .safari-card-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .safari-meta-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8rem;
      color: var(--c-ochre);
      margin-bottom: 0.5rem;
    }

    .safari-card-title {
      font-size: 1.55rem;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    .safari-card-desc {
      font-size: 0.9rem;
      color: var(--c-text-secondary);
      margin-bottom: 1.5rem;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .safari-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--c-border-subtle);
      padding-top: 1.15rem;
      margin-top: auto;
    }

    // Active route parser
    function getRouteInfo() {
      const hash = window.location.hash.slice(1) || "home";
      const parts = hash.split("/");
      return {
        path: parts[0] || "home",
        param: parts[1] || null
      };
    }

    // Main Router Switch
    function renderRoute() {
      const { path, param } = getRouteInfo();
      const app = document.getElementById("app-view");
      
      // Cleanup any lingering ScrollTriggers
      if (window.ScrollTrigger) {
        ScrollTrigger.getAll().forEach(st => st.kill());
      }

      // Update Nav active classes
      document.querySelectorAll(".nav-link").forEach(link => {
        const routeAttr = link.getAttribute("data-route");
        if (routeAttr && routeAttr === path) {
          link.classList.add("active");
        } else {
          link.classList.remove("active");
        }
      });

      // Scroll to top
      window.scrollTo(0, 0);

      // Route Dispatcher
      switch(path) {
        case "home":
          app.innerHTML = renderHomeScreen();
          document.title = "Olkeri Expeditions - Luxury Kenya Safaris & Land Cruiser 78 Tours";
          initHomeAnimations();
          break;

        case "safaris":
          app.innerHTML = renderAllSafarisScreen();
          document.title = "Safari Packages | Olkeri Expeditions Kenya";
          break;

        case "safari-categories":
        case "private-safaris":
        case "group-safaris":
        case "family-safaris":
        case "honeymoon-safaris":

          document.title = "Kenyan Safari Destinations | Olkeri Expeditions";

          link: "#destination/samburu"
        },
        "lake-nakuru": {
          title: "Lake Nakuru National Park",
          region: "Rift Valley Circuit &middot; 3 hrs from Nairobi",
          desc: "Alkaline lake fringed by yellow fever trees, euphorbia forests, and an internationally guarded rhino sanctuary.",
          wildlife: "White and black rhinos, Rothschild's giraffes, flamingos",
          link: "#destination/lake-nakuru"
        },
        "tsavo": {
          title: "Tsavo East & West National Parks",
          region: "Southern Circuit &middot; 5 hrs from Nairobi",
          desc: "Vast wilderness of red dust elephants, Mzima Springs underwater viewing hide, and Shetani lava flows.",
          wildlife: "Tsavo red elephants, lions, lesser kudu, hippos, crocodiles",
          link: "#destination/tsavo"
        }
      };

      const selected = dataMap[destKey] || dataMap["maasai-mara"];
      if (titleEl) titleEl.textContent = selected.title;
      if (regionEl) regionEl.innerHTML = selected.region;
      if (descEl) descEl.textContent = selected.desc;
      if (wildlifeEl) wildlifeEl.textContent = selected.wildlife;
      if (linkEl) linkEl.href = selected.link;
    }

    // Custom Safari Planner Wizard Navigation
    function goToPlannerStep(stepNum) {
      for (let i = 1; i <= 4; i++) {
        const stepView = document.getElementById(`pStep${i}`);
        const stepInd = document.getElementById(`pStepInd${i}`);
        if (stepView) stepView.style.display = (i === stepNum) ? "block" : "none";
        if (stepInd) {
          if (i === stepNum) {
            stepInd.className = "planner-step-indicator active";
          } else if (i < stepNum) {
            stepInd.className = "planner-step-indicator completed";
          } else {
            stepInd.className = "planner-step-indicator";
          }
        }
      }

      if (stepNum === 4) {
        updatePlannerSummaryView();
      }
    }

    function togglePlannerDest(destId) {
      const idx = plannerState.destinations.indexOf(destId);
      if (idx > -1) {
        if (plannerState.destinations.length > 1) {
          plannerState.destinations.splice(idx, 1);
        } else {
          showToast("Please retain at least one destination!");
        }
      } else {
        plannerState.destinations.push(destId);
      }
      renderRoute();
    }

    function selectPlannerTier(tier) {
      plannerState.tier = tier;
      renderRoute();
      goToPlannerStep(2);
    }

    function selectPlannerVehicle(veh) {
      plannerState.vehicleChoice = veh;
      renderRoute();
      goToPlannerStep(2);
    }

    function updatePlannerDate(val) { plannerState.departureDate = val; }
    function updatePlannerDuration(val) { plannerState.durationDays = parseInt(val, 10); }
    function updatePlannerGuests(val) { plannerState.travelersCount = parseInt(val, 10); }
    function updatePlannerNotes(val) { plannerState.notes = val; }

    function updatePlannerSummaryView() {
      // Dynamic estimate calculation
      let basePerDay = 520;
      if (plannerState.tier === "luxury") basePerDay = 680;
      if (plannerState.tier === "photo") basePerDay = 750;
      if (plannerState.tier === "midrange") basePerDay = 450;

      // Group discount factor for private Land Cruiser sharing
      let groupFactor = 1.0;
      if (plannerState.travelersCount >= 4) groupFactor = 0.82;
      if (plannerState.travelersCount >= 6) groupFactor = 0.72;

      const totalEst = Math.round(basePerDay * plannerState.durationDays * groupFactor);
      plannerState.calculatedEstUSD = totalEst;

      const estEl = document.getElementById("plannerEstUSD");
      if (estEl) estEl.textContent = `$${totalEst.toLocaleString()} USD`;

      const destNames = plannerState.destinations.map(d => {
        const found = DESTINATIONS.find(x => x.id === d);
        return found ? found.name : d;
      }).join(", ");

      const destEl = document.getElementById("pReviewDests");
      if (destEl) destEl.textContent = destNames;

      const daysEl = document.getElementById("pReviewDays");
      if (daysEl) daysEl.textContent = `${plannerState.durationDays} Days`;

      const guestsEl = document.getElementById("pReviewGuests");
      if (guestsEl) guestsEl.textContent = `${plannerState.travelersCount} Travelers`;

      const tierEl = document.getElementById("pReviewTier");
      if (tierEl) tierEl.textContent = plannerState.tier.toUpperCase();
    }

    function initPlannerInteractions() {
      goToPlannerStep(1);
    }

    function submitCustomPlanner(e) {
      e.preventDefault();
      plannerState.guestName = document.getElementById("pGuestName").value;
      plannerState.guestEmail = document.getElementById("pGuestEmail").value;
      plannerState.guestPhone = document.getElementById("pGuestPhone").value;
      window.location.hash = "confirmation";
      showToast("Custom safari proposal generated!");
    }

    // Prefill from Package Card
    function prefillBookingFromPackage(pkgId) {
      window.location.hash = `enquiry/${pkgId}`;
    }

    function handleEnquirySubmit(e, pkgId) {
      e.preventDefault();
      window.location.hash = "summary";
      showToast("Enquiry saved. Proceeding to Summary...");
    }

    // Paystack Simulation
    function handlePaystackSimulation(e) {
      e.preventDefault();
      showToast("Connecting to Paystack Secure Checkout Simulator...");
      setTimeout(() => {
        window.location.hash = "confirmation";
        showToast("Simulated payment verified successfully!");
      }, 1200);
    }

    function handleContactSubmit(e) {
      e.preventDefault();
      showToast("Message sent to Nairobi operations desk! We will reply within 24 hours.");
      e.target.reset();
    }

    // Filtering Packages
    function filterSafariPackages(criteria) {
      const cards = document.querySelectorAll(".safari-card");
      cards.forEach(card => {
        const days = parseInt(card.getAttribute("data-days"), 10);
        let show = true;
        if (criteria === "3-4" && (days < 3 || days > 4)) show = false;
        if (criteria === "5-7" && (days < 5 || days > 7)) show = false;
        if (criteria === "8+" && days < 8) show = false;
        card.style.display = show ? "flex" : "none";
      });
    }

    // Gallery Filtering & Lightbox
    function initGalleryFilter() {
      // Default initial state
    }

    function filterGallery(category) {
      document.querySelectorAll(".gallery-filter-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");

      const items = document.querySelectorAll(".gallery-item");
      items.forEach(item => {
        const cat = item.getAttribute("data-cat");
        if (category === "all" || cat === category) {
          item.style.display = "block";
        } else {
          item.style.display = "none";
        }
      });
    }

    function openLightbox(src, title) {
      const modal = document.getElementById("lightboxModal");
      const img = document.getElementById("lightboxImg");
      const caption = document.getElementById("lightboxCaption");
      if (modal && img) {
        img.src = src;
        if (caption) caption.textContent = title;
        modal.classList.add("open");
      }
    }

    function closeLightbox() {
      const modal = document.getElementById("lightboxModal");
      if (modal) modal.classList.remove("open");
    }

    // FAQ Accordion
    function initFaqAccordion() {}
    function toggleFaq(index) {
      const item = document.getElementById(`faqItem${index}`);
      if (item) {
        item.classList.toggle("open");
      }
    }

    // Image Error Resilient Fallback (Zero Broken Images Policy)
    function handleImgError(imgElement, label) {
      imgElement.onerror = null;
      const parent = imgElement.parentElement;
      if (parent) {
        imgElement.style.display = "none";
        const fallback = document.createElement("div");
        fallback.className = "img-fallback";
        fallback.innerHTML = `
          ${ICONS.sun}
          <strong style="color:var(--c-sand); font-size:0.9rem; margin-top:0.35rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></strong>
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:78%"></span></span>
        `;
        parent.appendChild(fallback);
      }
    }

    // Toast Notification Utility
    function showToast(message) {
      const box = document.getElementById("toastBox");
      if (!box) return;
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `
        <span style="color:var(--c-amber);"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
        <span style="font-size:0.88rem; color:var(--c-text-primary);"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
      `;
      box.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(100%)";
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    /* =========================================================================
       6. GLOBAL INITIALIZATION & ROUTING HOOKS
       ========================================================================= */

    window.addEventListener("DOMContentLoaded", () => {
      // Setup mobile listeners
      const openBtn = document.getElementById("mobileMenuOpen");
      const closeBtn = document.getElementById("mobileMenuClose");
      if (openBtn) openBtn.addEventListener("click", openMobileMenu);
      if (closeBtn) closeBtn.addEventListener("click", closeMobileMenu);

      // Lightbox close listener
      const lbClose = document.getElementById("lightboxCloseBtn");
      const lbModal = document.getElementById("lightboxModal");
      if (lbClose) lbClose.addEventListener("click", closeLightbox);
      if (lbModal) {
        lbModal.addEventListener("click", (e) => {
          if (e.target === lbModal) closeLightbox();
        });
      }

      // Escape key handler
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeMobileMenu();
          closeLightbox();
        }
      });

      // Update current copyright year
      const yearEl = document.getElementById("currentYear");
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // Initial route render
      renderRoute();
    });

    // Hash change event router hook
    window.addEventListener("hashchange", renderRoute);
  </script>
