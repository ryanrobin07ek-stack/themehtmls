    <style>
      :root {
        --color-black: var(--theme-kicks-color-01);
        --color-charcoal: var(--theme-kicks-color-02);
        --color-white: var(--theme-kicks-color-03);
        --color-smoky: var(--theme-kicks-color-04);
        --color-grey-light: var(--theme-kicks-color-05);
        --color-grey-mid: var(--theme-kicks-color-06);
        --color-yellow: var(--theme-kicks-color-07);
        --color-yellow-hover: var(--theme-kicks-color-08);
        --color-blue: var(--theme-kicks-color-09);
        --font-display: 'Bebas Neue', sans-serif;
        --font-body: 'DM Sans', sans-serif;
        --font-heading: 'Plus Jakarta Sans', sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-body);
        color: var(--color-black);
        background-color: var(--color-white);
        line-height: 1.5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Typography Utilities */
      .font-display {
        font-family: var(--font-display);
        letter-spacing: 0.04em;
        line-height: 0.95;
      }
      .font-heading {
        font-family: var(--font-heading);
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Container */
      .container-max {
        max-width: 1440px;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
      @media (min-width: 768px) {
        .container-max {
          padding-left: 2.5rem;
          padding-right: 2.5rem;
        }
      }

      /* Reference visual identity: faded shoe edges and masks */
      .faded-backdrop {
        background: radial-gradient(circle at 60% 50%, var(--theme-kicks-color-10) 0%, var(--theme-kicks-color-11) 50%, var(--theme-kicks-color-03) 100%);
      }
      .shoe-gradient-bottom {
        mask-image: linear-gradient(to bottom, var(--theme-kicks-color-12) 82%, var(--theme-kicks-color-13) 100%);
        -webkit-mask-image: linear-gradient(to bottom, var(--theme-kicks-color-12) 82%, var(--theme-kicks-color-13) 100%);
      }
      .shoe-gradient-radial {
        mask-image: radial-gradient(ellipse at center, var(--theme-kicks-color-12) 65%, var(--theme-kicks-color-13) 100%);
        -webkit-mask-image: radial-gradient(ellipse at center, var(--theme-kicks-color-12) 65%, var(--theme-kicks-color-13) 100%);
      }

      /* Buttons & Chips */
      .btn-primary {
        background-color: var(--color-black);
        color: var(--color-white);
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.75rem 1.75rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
      }
      .btn-primary:hover {
        background-color: var(--theme-kicks-color-14);
        transform: translateY(-1px);
      }
      .btn-yellow {
        background-color: var(--color-yellow);
        color: var(--color-black);
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.75rem 1.75rem;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
      }
      .btn-yellow:hover {
        background-color: var(--color-yellow-hover);
      }
      .btn-outline {
        background-color: transparent;
        color: var(--color-black);
        border: 1px solid var(--color-black);
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 0.75rem 1.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
      }
      .btn-outline:hover {
        background-color: var(--color-black);
        color: var(--color-white);
      }

      /* Clean Navigation Tab Bar (Zero-pill, refined rectangular tabs) */
      .brand-tab-btn, .cat-tab-btn {
        padding: 0.5rem 1rem;
        font-family: var(--font-heading);
        font-size: 0.8125rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-grey-mid);
        border-bottom: 2px solid transparent;
        background: transparent;
        border-top: none;
        border-left: none;
        border-right: none;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s;
      }
      .brand-tab-btn:hover, .cat-tab-btn:hover {
        color: var(--color-black);
      }
      .brand-tab-btn.active, .cat-tab-btn.active {
        color: var(--color-black);
        border-bottom-color: var(--color-black);
      }

      /* Product Card styling */
      .product-card {
        background-color: var(--theme-kicks-color-03);
        position: relative;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--theme-kicks-color-10);
      }
      .product-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 32px var(--theme-kicks-color-15);
        border-color: var(--theme-kicks-color-16);
      }
      .card-media {
        background-color: var(--theme-kicks-color-17);
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card-media img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        filter: drop-shadow(0 10px 14px var(--theme-kicks-color-18));
      }
      .product-card:hover .card-media img {
        transform: scale(1.06) rotate(-2deg);
      }
      .wishlist-btn {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 50%;
        background: var(--theme-kicks-color-19);
        border: 1px solid var(--theme-kicks-color-20);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 5;
        transition: all 0.2s;
      }
      .wishlist-btn:hover {
        background: var(--theme-kicks-color-03);
        transform: scale(1.1);
      }
      .wishlist-btn.active svg {
        fill: var(--theme-kicks-color-21);
        stroke: var(--theme-kicks-color-21);
      }

      /* Subtle badge */
      .kicks-tag {
        font-family: var(--font-heading);
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 0.25rem 0.625rem;
      }
      .kicks-tag-yellow {
        background-color: var(--color-yellow);
        color: var(--color-black);
      }
      .kicks-tag-black {
        background-color: var(--color-black);
        color: var(--color-white);
      }
      .kicks-tag-blue {
        background-color: var(--color-blue);
        color: var(--color-white);
      }

      /* Sliders & Rails */
      .horizontal-rail {
        display: flex;
        gap: 1.25rem;
        overflow-x: auto;
        padding-bottom: 1rem;
        scrollbar-width: thin;
        scrollbar-color: var(--theme-kicks-color-22) transparent;
      }
      .horizontal-rail::-webkit-scrollbar {
        height: 5px;
      }
      .horizontal-rail::-webkit-scrollbar-thumb {
        background: var(--theme-kicks-color-22);
      }

      /* Overlay Drawers & Modals */
      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: var(--theme-kicks-color-23);
        backdrop-filter: blur(4px);
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .drawer-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 480px;
        background: var(--theme-kicks-color-03);
        z-index: 101;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
      }
      .drawer-overlay.active .drawer-panel {
        transform: translateX(0);
      }

      .modal-box {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -48%) scale(0.96);
        width: 92%;
        max-width: 900px;
        max-height: 90vh;
        background: var(--theme-kicks-color-03);
        z-index: 102;
        opacity: 0;
        pointer-events: none;
        overflow-y: auto;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-shadow: 0 25px 50px -12px var(--theme-kicks-color-24);
      }
      .modal-box.active {
        opacity: 1;
        pointer-events: auto;
        transform: translate(-50%, -50%) scale(1);
      }

      /* Size Buttons */
      .size-btn {
        height: 2.75rem;
        min-width: 2.75rem;
        border: 1px solid var(--theme-kicks-color-25);
        background: var(--theme-kicks-color-03);
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 0.8125rem;
        color: var(--color-black);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .size-btn:hover:not(:disabled) {
        border-color: var(--color-black);
      }
      .size-btn.active {
        background: var(--color-black);
        color: var(--color-white);
        border-color: var(--color-black);
      }
      .size-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        text-decoration: line-through;
        background: var(--theme-kicks-color-04);
      }

      /* Form controls */
      .input-field {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--theme-kicks-color-26);
        font-family: var(--font-body);
        font-size: 0.875rem;
        background: var(--theme-kicks-color-03);
        color: var(--color-black);
        outline: none;
        transition: border-color 0.2s;
      }
      .input-field:focus {
        border-color: var(--color-black);
      }

      /* Grid systems */
      .catalog-grid {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 1.5rem;
      }
      @media (min-width: 640px) {
        .catalog-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1024px) {
        .catalog-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 1280px) {
        .catalog-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Editorial Hero layout based on reference */
      .hero-section {
        background-color: var(--color-smoky);
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid var(--theme-kicks-color-27);
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1fr;
        align-items: center;
        min-height: calc(88vh - 80px);
      }
      @media (min-width: 1024px) {
        .hero-grid {
          grid-template-columns: 1.15fr 1fr;
        }
      }

      /* Accessibility & Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>

      function createProductCardHTML(p) {
        const isWish = state.wishlist.includes(p.id);
        const discountBadge = p.origPrice ? `<span class="kicks-tag kicks-tag-yellow"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:11%"></span></span>` : (p.isNew ? `<span class="kicks-tag kicks-tag-black"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></span>` : '');
        
        return `
          <div class="product-card" data-id="${p.id}">
            <div class="card-media" onclick="openProductDetail(${p.id})" style="cursor: pointer;">
              <button type="button" class="wishlist-btn ${isWish ? 'active' : ''}" onclick="toggleWishlistItem(event, ${p.id})" title="${isWish ? 'Remove from wishlist' : 'Save to wishlist'}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="${isWish ? '#E53E3E' : 'none'}" stroke="${isWish ? '#E53E3E' : '#111214'}" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
              </button>
              <div style="position: absolute; top: 0.75rem; left: 0.75rem; display: flex; gap: 0.25rem;">
                ${discountBadge}
              </div>
              <img src="${p.image}" alt="${p.name}" loading="lazy" />
            </div>

            <div style="padding: 1.25rem; display: flex; flex-direction: column; flex: 1; justify-content: space-between;">
              <div>
                <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.25rem;">
                  <span style="font-family: var(--font-heading); font-size: 0.6875rem; font-weight: 800; text-transform: uppercase; color: #858991; letter-spacing: 0.05em;">${p.brand} · ${p.category}</span>
                  ${p.inStock ? '<span style="font-size: 0.625rem; font-weight: 700; color: #059669; text-transform: uppercase;">In Stock</span>' : '<span style="font-size: 0.625rem; font-weight: 700; color: #DC2626; text-transform: uppercase;">Sold Out</span>'}
                </div>
                <h3 onclick="openProductDetail(${p.id})" style="font-family: var(--font-heading); font-size: 0.9375rem; font-weight: 700; color: #111214; margin-bottom: 0.5rem; line-height: 1.3; cursor: pointer;">
                  ${p.name}
                </h3>
              </div>

              <div style="margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #ECEEF2; display: flex; align-items: center; justify-content: space-between;">
                <div>
                  <div class="tabular-nums" style="font-family: var(--font-heading); font-size: 1rem; font-weight: 800; color: #111214;">
                    ${formatPrice(p.price)}
                  </div>
                  ${p.origPrice ? `<div class="tabular-nums" style="font-size: 0.75rem; color: #94A3B8; text-decoration: line-through;">${formatPrice(p.origPrice)}</div>` : ''}
                </div>
                <button type="button" onclick="openProductDetail(${p.id})" class="btn-primary" style="padding: 0.45rem 0.85rem; font-size: 0.75rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:27%"></span></button>
              </div>
            </div>
          </div>
        `;
      }

      function renderCatalog() {
        const grid = document.getElementById('catalog-grid');
        const emptyBox = document.getElementById('catalog-empty');
        const countLabel = document.getElementById('results-count-label');

        let filtered = PRODUCTS.filter(p => {
          // Category
          if (state.categoryFilter !== 'all' && p.category.toLowerCase() !== state.categoryFilter.toLowerCase()) {
            return false;
          }
          // Brand
          if (state.brandFilter !== 'all' && p.brand.toLowerCase() !== state.brandFilter.toLowerCase()) {
            return false;
          }
          // Size
          if (state.sizeFilter !== 'any') {
            const requestedSize = Number(state.sizeFilter);
            if (!p.stockBySize[requestedSize] || p.stockBySize[requestedSize] <= 0) {
              return false;
            }
          }
          // Price
          if (state.priceFilter === 'under-8k' && p.price >= 8000) return false;
          if (state.priceFilter === '8k-15k' && (p.price < 8000 || p.price > 15000)) return false;
          if (state.priceFilter === '15k-22k' && (p.price < 15000 || p.price > 22000)) return false;
          if (state.priceFilter === 'above-22k' && p.price <= 22000) return false;

          // Sale items
          if (state.saleOnly && !p.isSale) return false;
          // In stock
          if (state.inStockOnly && !p.inStock) return false;

          // Search query
          if (state.searchQuery.trim() !== '') {
            const q = state.searchQuery.toLowerCase();
            const matchName = p.name.toLowerCase().includes(q);
            const matchBrand = p.brand.toLowerCase().includes(q);
            const matchCat = p.category.toLowerCase().includes(q);
            const matchTag = p.tag.toLowerCase().includes(q);
            if (!matchName && !matchBrand && !matchCat && !matchTag) return false;
          }

          return true;
        });

        // Sorting
        if (state.sortBy === 'price-asc') {
          filtered.sort((a, b) => a.price - b.price);
        } else if (state.sortBy === 'price-desc') {
          filtered.sort((a, b) => b.price - a.price);
        } else if (state.sortBy === 'newest') {
          filtered.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));
        } else if (state.sortBy === 'name') {
          filtered.sort((a, b) => a.name.localeCompare(b.name));
        }

        countLabel.textContent = `Showing ${filtered.length} of ${PRODUCTS.length} Models`;

        if (filtered.length === 0) {
          grid.innerHTML = '';
          emptyBox.style.display = 'block';
        } else {
          emptyBox.style.display = 'none';
          grid.innerHTML = filtered.map(createProductCardHTML).join('');
        }

        renderActiveFilterChips();
      }

      function renderActiveFilterChips() {
        const container = document.getElementById('active-filter-indicators');
        let chips = [];

        if (state.categoryFilter !== 'all') {
          chips.push(`Category: ${state.categoryFilter}`);
        }
        if (state.brandFilter !== 'all') {
          chips.push(`Brand: ${state.brandFilter}`);
        }
        if (state.sizeFilter !== 'any') {
          chips.push(`Size: EU ${state.sizeFilter}`);
        }
        if (state.priceFilter !== 'all') {
          chips.push(`Budget Filter`);
        }
        if (state.saleOnly) {
          chips.push(`Sale Only`);
        }
        if (state.searchQuery.trim() !== '') {
          chips.push(`Query: "${state.searchQuery}"`);
        }

        if (chips.length > 0) {
          container.style.display = 'flex';
          container.innerHTML = `
            <span style="font-size: 0.6875rem; font-weight: 700; color: #858991; text-transform: uppercase;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:41%"></span></span>
            ${chips.map(c => `
              <span style="background: #E8EAEF; color: #111214; font-size: 0.6875rem; font-weight: 700; padding: 0.2rem 0.5rem; display: flex; align-items: center; gap: 0.35rem;">
                ${c}
              </span>
            `).join('')}
            <button onclick="resetAllFilters()" style="background: none; border: none; font-size: 0.6875rem; color: #DC2626; font-weight: 700; cursor: pointer; text-decoration: underline;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span></button>
          `;
        } else {
          container.style.display = 'none';
        }
      }

      function renderRails() {
        // Featured drops rail
        const drops = PRODUCTS.filter(p => p.isNew || p.tag === 'Grail').slice(0, 10);
        document.getElementById('drops-rail').innerHTML = drops.map(p => `
          <div style="min-width: 280px; max-width: 280px; flex-shrink: 0;">
            ${createProductCardHTML(p)}
          </div>
        `).join('');

        // Basketball rail
        const bball = PRODUCTS.filter(p => p.category === 'Basketball').slice(0, 8);
        document.getElementById('basketball-rail').innerHTML = bball.map(p => `
          <div style="min-width: 280px; max-width: 280px; flex-shrink: 0;">
            ${createProductCardHTML(p)}
          </div>
        `).join('');

        // Running rail
        const running = PRODUCTS.filter(p => p.category === 'Running').slice(0, 8);
        document.getElementById('running-rail').innerHTML = running.map(p => `
          <div style="min-width: 280px; max-width: 280px; flex-shrink: 0;">
            ${createProductCardHTML(p)}
          </div>
        `).join('');
      }

      function renderBrandSelector() {
        const rail = document.getElementById('brand-selector-rail');
        rail.innerHTML = `
          <button class="brand-tab-btn active" onclick="filterByBrand('all')"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:27%"></span></button>
          ${BRANDS_LIST.map(b => `
            <button class="brand-tab-btn" onclick="filterByBrand('${b}')">${b.toUpperCase()}</button>
          `).join('')}
        `;
      }

      /* --- 4. FILTER ACTIONS --- */
      function filterByCategory(cat) {
        state.categoryFilter = cat;
        // update tab styles
        document.querySelectorAll('.cat-tab-btn').forEach(btn => {
          if (btn.textContent.toLowerCase().includes(cat.toLowerCase()) || (cat === 'all' && btn.textContent.includes('All'))) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
        renderCatalog();
        const catalogEl = document.getElementById('catalog');
        if (catalogEl) catalogEl.scrollIntoView({ behavior: 'smooth' });
      }

      function filterByBrand(brand) {
        state.brandFilter = brand;
        const brandSelect = document.getElementById('filter-brand');
        if (brandSelect) brandSelect.value = brand;

        document.querySelectorAll('.brand-tab-btn').forEach(btn => {
          if (btn.textContent.trim().toLowerCase() === (brand === 'all' ? 'all brands' : brand.toLowerCase())) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        renderCatalog();
        const catalogEl = document.getElementById('catalog');
        if (catalogEl) catalogEl.scrollIntoView({ behavior: 'smooth' });
      }

      function filterByTag(tag) {
        state.searchQuery = tag;
        renderCatalog();
        document.getElementById('catalog').scrollIntoView({ behavior: 'smooth' });
      }

      function filterBySale() {
        state.saleOnly = true;
        document.getElementById('filter-sale-only').checked = true;
        renderCatalog();
        document.getElementById('catalog').scrollIntoView({ behavior: 'smooth' });
      }

      function toggleSizeFilter(size) {
        state.sizeFilter = size;
        document.querySelectorAll('.size-chip-btn').forEach(btn => {
          btn.classList.remove('active-size');
          if (String(size) === 'any' && btn.textContent === 'ANY') {
            btn.classList.add('active-size');
          } else if (btn.textContent === String(size)) {
            btn.classList.add('active-size');
          }
        });
        renderCatalog();
      }

      function applyFilters() {
        state.brandFilter = document.getElementById('filter-brand').value;
        state.priceFilter = document.getElementById('filter-price').value;
        state.saleOnly = document.getElementById('filter-sale-only').checked;
        state.inStockOnly = document.getElementById('filter-instock-only').checked;
        renderCatalog();
      }

      function applySort(val) {
        state.sortBy = val;
        renderCatalog();
      }

      function resetAllFilters() {
        state.categoryFilter = 'all';
        state.brandFilter = 'all';
        state.sizeFilter = 'any';
        state.priceFilter = 'all';
        state.saleOnly = false;
        state.inStockOnly = true;
        state.searchQuery = '';

        document.getElementById('filter-brand').value = 'all';
        document.getElementById('filter-price').value = 'all';
        document.getElementById('filter-sale-only').checked = false;
        document.getElementById('filter-instock-only').checked = true;

        document.querySelectorAll('.cat-tab-btn').forEach((b, i) => i === 0 ? b.classList.add('active') : b.classList.remove('active'));
        document.querySelectorAll('.brand-tab-btn').forEach((b, i) => i === 0 ? b.classList.add('active') : b.classList.remove('active'));
        document.querySelectorAll('.size-chip-btn').forEach(b => {
          b.classList.remove('active-size');
          if (b.textContent === 'ANY') b.classList.add('active-size');
        });

        renderCatalog();
      }

      function scrollRail(id, delta) {
        const el = document.getElementById(id);
        if (el) el.scrollBy({ left: delta, behavior: 'smooth' });
      }

      /* --- 5. PRODUCT DETAIL MODAL (PDP) --- */
      let currentPdpProduct = null;
      let selectedPdpSize = null;
      let selectedPdpColor = null;

      function openProductDetail(id) {
        const p = PRODUCTS.find(x => x.id === id);
        if (!p) return;
        currentPdpProduct = p;
        selectedPdpColor = p.colors[0];

        // Find first available size
        selectedPdpSize = null;
        for (let s of p.sizes) {
          if (p.stockBySize[s] && p.stockBySize[s] > 0) {
            selectedPdpSize = s;
            break;
          }
        }

        const container = document.getElementById('pdp-content-container');
        container.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr; gap: 2.5rem;" class="md-grid-2">
            <!-- Left: Gallery & Zoom Showcase -->
            <div style="background: #F6F7F9; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
              <span class="kicks-tag kicks-tag-black" style="position: absolute; top: 1rem; left: 1rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:62%"></span></span>
              <img id="pdp-main-image" src="${p.image}" alt="${p.name}" style="width: 100%; max-height: 380px; object-fit: contain; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.12));" />
              <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
                <span style="font-family: var(--font-heading); font-size: 0.6875rem; font-weight: 700; color: #64748B;">SKU: KV-${p.id.toString().padStart(4, '0')}</span>
                <span style="color: #CBD5E1;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></span>
                <span style="font-family: var(--font-heading); font-size: 0.6875rem; font-weight: 700; color: #059669;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:59%"></span></span>
              </div>
            </div>

            <!-- Right: Product Purchase Module -->
            <div style="display: flex; flex-direction: column; justify-content: space-between;">
              <div>
                <!-- Brand & Tag -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                  <span style="font-family: var(--font-heading); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #858991;">${p.brand} · ${p.category}</span>
                  ${p.isSale ? '<span class="kicks-tag kicks-tag-yellow">SPECIAL PRICE</span>' : ''}
                </div>

                <h2 class="font-display" style="font-size: clamp(2rem, 4vw, 2.75rem); color: #111214; line-height: 1; margin-bottom: 0.75rem;">
                  ${p.name}
                </h2>

                <!-- Price row -->
                <div style="display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.25rem;">
                  <span class="tabular-nums" style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; color: #111214;">
                    ${formatPrice(p.price)}
                  </span>
                  ${p.origPrice ? `<span class="tabular-nums" style="font-size: 1rem; color: #94A3B8; text-decoration: line-through;">${formatPrice(p.origPrice)}</span>` : ''}
                </div>

                <p style="font-size: 0.875rem; color: #475569; line-height: 1.6; margin-bottom: 1.5rem; border-bottom: 1px solid #ECEEF2; padding-bottom: 1.25rem;">
                  ${p.desc}
                </p>

                <!-- Color Selection -->
                <div style="margin-bottom: 1.25rem;">
                  <div style="font-family: var(--font-heading); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.5rem; color: #111214;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span><span id="pdp-selected-color-label" style="color: #64748B;">${selectedPdpColor}</span>
                  </div>
                  <div style="display: flex; gap: 0.5rem;">
                    ${p.colors.map((c, i) => `
                      <button type="button" onclick="selectPdpColor('${c}')" class="btn-outline" style="padding: 0.4rem 0.85rem; font-size: 0.75rem; ${i === 0 ? 'background: #111214; color: #FFF;' : ''}">
                        ${c}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Size Selection Module -->
                <div style="margin-bottom: 1.5rem;">
                  <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem;">
                    <div style="font-family: var(--font-heading); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #111214;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:65%"></span></div>
                    <button type="button" onclick="openSizeGuideModal()" style="background: none; border: none; font-family: var(--font-heading); font-size: 0.75rem; font-weight: 700; color: #355FE8; text-decoration: underline; cursor: pointer;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:59%"></span></button>
                  </div>

                  <div style="display: flex; gap: 0.35rem; flex-wrap: wrap;" id="pdp-size-buttons">
                    ${p.sizes.map(s => {
                      const stock = p.stockBySize[s] || 0;
                      const isSelected = s === selectedPdpSize;
                      const isDisabled = stock === 0;
                      return `
                        <button type="button" class="size-btn ${isSelected ? 'active' : ''}" ${isDisabled ? 'disabled' : ''} onclick="selectPdpSize(${s})" title="${isDisabled ? 'Out of Stock' : `${stock} pairs left`}">
                          ${s}
                        </button>
                      `;
                    }).join('')}
                  </div>
                  
                  <div id="pdp-stock-notice" style="font-size: 0.75rem; margin-top: 0.5rem; font-weight: 600; color: #059669;">
                    ${selectedPdpSize ? `EU ${selectedPdpSize} is In Stock for Immediate Dispatch` : 'Please select an available size'}
                  </div>
                </div>
              </div>

              <!-- Action buttons & Purchase guarantee -->
              <div>
                <div style="display: flex; gap: 0.75rem; margin-bottom: 1rem;">
                  <button id="pdp-add-to-cart-btn" onclick="addCurrentProductToCart()" class="btn-primary" style="flex: 1; padding: 1rem;">
                    ADD TO BAG · ${formatPrice(p.price)}
                  </button>
                  <button onclick="toggleWishlistItem(event, ${p.id})" class="btn-outline" style="padding: 1rem 1.25rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:14%"></span></button>
                </div>

                <div style="background: #F8F9FA; padding: 0.75rem 1rem; border: 1px solid #E8EAEF; font-size: 0.75rem; color: #64748B; display: flex; align-items: center; justify-content: space-between;">
                  <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></span>
                  <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:81%"></span></span>
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('pdp-modal').classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function selectPdpSize(s) {
        selectedPdpSize = s;
        document.querySelectorAll('#pdp-size-buttons .size-btn').forEach(btn => {
          if (btn.textContent.trim() === String(s)) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        const stock = currentPdpProduct.stockBySize[s] || 0;
        const notice = document.getElementById('pdp-stock-notice');
        if (stock <= 2 && stock > 0) {
          notice.textContent = `Only ${stock} pairs remaining in size EU ${s} - Act fast`;
          notice.style.color = '#D97706';
        } else if (stock > 0) {
          notice.textContent = `EU ${s} is In Stock for Immediate Dispatch`;
          notice.style.color = '#059669';
        } else {
          notice.textContent = `Size EU ${s} is currently out of stock`;
          notice.style.color = '#DC2626';
        }
      }

      function selectPdpColor(c) {
        selectedPdpColor = c;
        const lbl = document.getElementById('pdp-selected-color-label');
        if (lbl) lbl.textContent = c;
      }

      function closeProductDetail() {
        document.getElementById('pdp-modal').classList.remove('active');
        document.body.style.overflow = 'auto';
        currentPdpProduct = null;
      }

      function handlePdpBackdropClick(e) {
        if (e.target.id === 'pdp-modal') {
          closeProductDetail();
        }
      }

      /* --- 6. SHOPPING CART LOGIC --- */
      function addCurrentProductToCart() {
        if (!currentPdpProduct) return;
        if (!selectedPdpSize) {
          alert('Please select an available shoe size before adding to bag.');
          return;
        }

        addToCart(currentPdpProduct.id, selectedPdpSize, selectedPdpColor);
        closeProductDetail();
        toggleCartDrawer(true);
      }

      function addToCart(productId, size, color) {
        const product = PRODUCTS.find(p => p.id === productId);
        if (!product) return;

        // Check if matching item exists
        const existingIdx = state.cart.findIndex(item => item.id === productId && item.size === size && item.color === color);

        if (existingIdx > -1) {
          state.cart[existingIdx].qty += 1;
        } else {
          state.cart.push({
            id: product.id,
            name: product.name,
            brand: product.brand,
            price: product.price,
            image: product.image,
            size: size,
            color: color || "Original",
            qty: 1
          });
        }

        saveCart();
        updateCartUI();
      }

      function updateCartItemQty(idx, delta) {
        if (state.cart[idx]) {
          state.cart[idx].qty += delta;
          if (state.cart[idx].qty <= 0) {
            state.cart.splice(idx, 1);
          }
          saveCart();
          updateCartUI();
        }
      }

      function removeCartItem(idx) {
        state.cart.splice(idx, 1);
        saveCart();
        updateCartUI();
      }

      function saveCart() {
        localStorage.setItem('kv_cart', JSON.stringify(state.cart));
      }

      function updateCartUI() {
        const count = state.cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById('cart-badge').textContent = count;
        document.getElementById('cart-drawer-count').textContent = `(${count} items)`;

        const container = document.getElementById('cart-items-list');

        if (state.cart.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 3rem 1rem; color: #858991;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 1rem auto;"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
              <div class="font-display" style="font-size: 1.5rem; color: #111214; margin-bottom: 0.5rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:46%"></span></div>
              <p style="font-size: 0.875rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
            </div>
          `;
        } else {
          container.innerHTML = state.cart.map((item, idx) => `
            <div style="display: flex; gap: 1rem; border-bottom: 1px solid #ECEEF2; padding-bottom: 1rem;">
              <div style="width: 80px; height: 80px; background: #F6F7F9; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <img src="${item.image}" alt="${item.name}" style="width: 100%; height: 100%; object-fit: contain;" />
              </div>
              <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                  <div style="display: flex; justify-content: space-between;">
                    <span style="font-family: var(--font-heading); font-size: 0.6875rem; font-weight: 700; text-transform: uppercase; color: #858991;">${item.brand}</span>
                    <button onclick="removeCartItem(${idx})" style="background: none; border: none; font-size: 0.75rem; color: #DC2626; cursor: pointer;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:16%"></span></button>
                  </div>
                  <h4 style="font-family: var(--font-heading); font-size: 0.875rem; font-weight: 700; color: #111214;">${item.name}</h4>
                  <div style="font-size: 0.75rem; color: #64748B;">Size: EU ${item.size} · ${item.color}</div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
                  <!-- Stepper -->
                  <div style="display: flex; align-items: center; border: 1px solid #D6DAE1;">
                    <button onclick="updateCartItemQty(${idx}, -1)" style="width: 1.75rem; height: 1.75rem; background: none; border: none; cursor: pointer; font-weight: 700;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></button>
                    <span class="tabular-nums" style="padding: 0 0.5rem; font-size: 0.8125rem; font-weight: 700;">${item.qty}</span>
                    <button onclick="updateCartItemQty(${idx}, 1)" style="width: 1.75rem; height: 1.75rem; background: none; border: none; cursor: pointer; font-weight: 700;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></button>
                  </div>
                  <span class="tabular-nums" style="font-family: var(--font-heading); font-size: 0.9375rem; font-weight: 800; color: #111214;">
                    ${formatPrice(item.price * item.qty)}
                  </span>
                </div>
              </div>
            </div>
          `).join('');
        }

        // Calculations
        const subtotal = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const freeDeliveryThreshold = 10000;
        const shippingFee = (subtotal >= freeDeliveryThreshold || subtotal === 0) ? 0 : 500;
        const discountAmount = Math.round(subtotal * state.discountRate);
        const total = Math.max(0, subtotal - discountAmount + shippingFee);

        // Progress bar for free shipping
        const progressEl = document.getElementById('free-shipping-progress-bar');
        const progressTxt = document.getElementById('free-shipping-progress-text');
        if (subtotal >= freeDeliveryThreshold) {
          progressEl.style.width = '100%';
          progressEl.style.background = '#059669';
          progressTxt.textContent = '🎉 You qualified for FREE delivery across Kenya!';
        } else {
          const pct = Math.min(100, Math.round((subtotal / freeDeliveryThreshold) * 100));
          progressEl.style.width = pct + '%';
          progressEl.style.background = '#355FE8';
          progressTxt.textContent = `Add ${formatPrice(freeDeliveryThreshold - subtotal)} more for FREE delivery`;
        }

        document.getElementById('cart-subtotal').textContent = formatPrice(subtotal);
        document.getElementById('cart-shipping').textContent = shippingFee === 0 ? 'FREE' : formatPrice(shippingFee);

        const discountRow = document.getElementById('cart-discount-row');
        if (discountAmount > 0) {
          discountRow.style.display = 'flex';
          document.getElementById('cart-discount-val').textContent = `- ${formatPrice(discountAmount)}`;
        } else {
          discountRow.style.display = 'none';
        }

        document.getElementById('cart-total').textContent = formatPrice(total);

        // Checkout Button state
        const checkoutBtn = document.getElementById('cart-checkout-btn');
        if (state.cart.length === 0) {
          checkoutBtn.disabled = true;
          checkoutBtn.style.opacity = '0.5';
          checkoutBtn.style.cursor = 'not-allowed';
        } else {
          checkoutBtn.disabled = false;
          checkoutBtn.style.opacity = '1';
          checkoutBtn.style.cursor = 'pointer';
        }
      }

      function toggleCartDrawer(open) {
        const drawer = document.getElementById('cart-drawer');
        if (open) {
          updateCartUI();
          drawer.classList.add('active');
          document.body.style.overflow = 'hidden';
        } else {
          drawer.classList.remove('active');
          document.body.style.overflow = 'auto';
        }
      }

      function applyCoupon() {
        const input = document.getElementById('coupon-input');
        const code = input.value.trim().toUpperCase();

        if (code === 'VAULT10' || code === 'KENYA2026') {
          state.discountRate = 0.10;
          state.activeCoupon = code;
          alert(`Coupon "${code}" applied: 10% Discount activated!`);
          updateCartUI();
        } else if (code === '') {
          state.discountRate = 0;
          state.activeCoupon = null;
          updateCartUI();
        } else {
          alert('Invalid promo code. Use VAULT10 for 10% off.');
        }
      }

      /* --- 7. WISHLIST MANAGEMENT --- */
      function toggleWishlistItem(e, id) {
        if (e) e.stopPropagation();
        const idx = state.wishlist.indexOf(id);
        if (idx > -1) {
          state.wishlist.splice(idx, 1);
        } else {
          state.wishlist.push(id);
        }
        localStorage.setItem('kv_wishlist', JSON.stringify(state.wishlist));
        updateWishlistBadge();
        renderCatalog();
        renderWishlistUI();
      }

      function updateWishlistBadge() {
        document.getElementById('wishlist-badge').textContent = state.wishlist.length;
      }

      function toggleWishlistDrawer(open) {
        const drawer = document.getElementById('wishlist-drawer');
        if (open) {
          renderWishlistUI();
          drawer.classList.add('active');
          document.body.style.overflow = 'hidden';
        } else {
          drawer.classList.remove('active');
          document.body.style.overflow = 'auto';
        }
      }

      function renderWishlistUI() {
        const container = document.getElementById('wishlist-items-list');
        const items = PRODUCTS.filter(p => state.wishlist.includes(p.id));

        if (items.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 3rem 1rem; color: #858991;">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto 1rem auto;"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg>
              <div class="font-display" style="font-size: 1.5rem; color: #111214;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:54%"></span></div>
              <p style="font-size: 0.875rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
            </div>
          `;
        } else {
          container.innerHTML = items.map(p => `
            <div style="display: flex; gap: 1rem; border-bottom: 1px solid #ECEEF2; padding-bottom: 1rem; align-items: center;">
              <img src="${p.image}" alt="${p.name}" style="width: 70px; height: 70px; object-fit: contain; background: #F6F7F9; padding: 0.25rem;" />
              <div style="flex: 1;">
                <span style="font-family: var(--font-heading); font-size: 0.6875rem; font-weight: 700; color: #858991; text-transform: uppercase;">${p.brand}</span>
                <h4 style="font-family: var(--font-heading); font-size: 0.875rem; font-weight: 700;">${p.name}</h4>
                <div class="tabular-nums" style="font-weight: 800; font-size: 0.875rem;">${formatPrice(p.price)}</div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                <button onclick="openProductDetail(${p.id}); toggleWishlistDrawer(false);" class="btn-primary" style="padding: 0.4rem 0.6rem; font-size: 0.6875rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></button>
                <button onclick="toggleWishlistItem(null, ${p.id})" style="background: none; border: none; font-size: 0.6875rem; color: #DC2626; cursor: pointer;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:16%"></span></button>
              </div>
            </div>
          `).join('');
        }
      }

      /* --- 8. SEARCH OVERLAY ENGINE --- */
      function toggleSearchOverlay(open) {
        const overlay = document.getElementById('search-overlay');
        if (open) {
          overlay.classList.add('active');
          document.body.style.overflow = 'hidden';
          const input = document.getElementById('global-search-input');
          input.value = '';
          input.focus();
          handleSearchInput('');
        } else {
          overlay.classList.remove('active');
          document.body.style.overflow = 'auto';
        }
      }

      function setSearchQuery(q) {
        document.getElementById('global-search-input').value = q;
        handleSearchInput(q);
      }

      function handleSearchInput(query) {
        const resultsBox = document.getElementById('search-results-box');
        const q = query.trim().toLowerCase();

        if (q === '') {
          resultsBox.innerHTML = `
            <div style="padding: 1.5rem; text-align: center; color: #858991; font-size: 0.875rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></div>
          `;
          return;
        }

        const matches = PRODUCTS.filter(p => 
          p.name.toLowerCase().includes(q) || 
          p.brand.toLowerCase().includes(q) || 
          p.category.toLowerCase().includes(q) ||
          p.tag.toLowerCase().includes(q)
        ).slice(0, 8);

        if (matches.length === 0) {
          resultsBox.innerHTML = `
            <div style="padding: 2rem; text-align: center;">
              <div class="font-display" style="font-size: 1.5rem; color: #111214;">NO MATCHES FOUND FOR "${query}"</div>
              <p style="color: #64748B; font-size: 0.875rem; margin-top: 0.25rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
            </div>
          `;
        } else {
          resultsBox.innerHTML = `
            <div style="font-family: var(--font-heading); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: #858991; margin-bottom: 0.75rem;">
              Found ${matches.length} matching footwear silhouettes:
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
              ${matches.map(p => `
                <div onclick="openProductDetail(${p.id}); toggleSearchOverlay(false);" style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; border: 1px solid #ECEEF2; cursor: pointer; background: #FFFFFF; transition: all 0.2s;" onmouseover="this.style.borderColor='#111214'" onmouseout="this.style.borderColor='#ECEEF2'">
                  <div style="display: flex; align-items: center; gap: 1rem;">
                    <img src="${p.image}" alt="${p.name}" style="width: 50px; height: 50px; object-fit: contain; background: #F6F7F9;" />
                    <div>
                      <span style="font-size: 0.6875rem; font-weight: 700; color: #858991; text-transform: uppercase;">${p.brand} · ${p.category}</span>
                      <h4 style="font-size: 0.875rem; font-weight: 700; color: #111214;">${p.name}</h4>
                    </div>
                  </div>
                  <div style="text-align: right;">
                    <span class="tabular-nums" style="font-weight: 800; font-size: 0.9375rem; color: #111214;">${formatPrice(p.price)}</span>
                    <span style="display: block; font-size: 0.6875rem; color: #355FE8; font-weight: 700;">VIEW &rarr;</span>
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        }
      }

      /* --- 9. CHECKOUT & REAL PAYMENT TRANSPARENCY --- */
      function startCheckout() {
        if (state.cart.length === 0) return;
        toggleCartDrawer(false);

        // Populate summary
        const subtotal = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        const freeDeliveryThreshold = 10000;
        const shippingFee = (subtotal >= freeDeliveryThreshold) ? 0 : 500;
        const discountAmount = Math.round(subtotal * state.discountRate);
        const total = Math.max(0, subtotal - discountAmount + shippingFee);

        document.getElementById('checkout-subtotal').textContent = formatPrice(subtotal);
        document.getElementById('checkout-shipping').textContent = shippingFee === 0 ? 'FREE' : formatPrice(shippingFee);

        const discountRow = document.getElementById('checkout-discount-row');
        if (discountAmount > 0) {
          discountRow.style.display = 'flex';
          document.getElementById('checkout-discount-val').textContent = `- ${formatPrice(discountAmount)}`;
        } else {
          discountRow.style.display = 'none';
        }

        document.getElementById('checkout-total').textContent = formatPrice(total);

        document.getElementById('checkout-modal').classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeCheckoutModal() {
        document.getElementById('checkout-modal').classList.remove('active');
        document.body.style.overflow = 'auto';
      }

      function handlePlaceOrder(e) {
        e.preventDefault();

        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const county = document.getElementById('cust-county').value;
        const address = document.getElementById('cust-address').value;
        const method = document.querySelector('input[name="paymethod"]:checked').value;

        // Generate distinctive order reference
        const orderRef = 'KV-2026-' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('order-ref-number').textContent = `ORDER #${orderRef}`;

        // Clear cart
        state.cart = [];
        saveCart();
        updateCartUI();

        closeCheckoutModal();
        document.getElementById('order-success-modal').classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeOrderSuccessModal() {
        document.getElementById('order-success-modal').classList.remove('active');
        document.body.style.overflow = 'auto';
      }

      /* --- 10. SIZE GUIDE MODAL --- */
      function openSizeGuideModal() {
        document.getElementById('size-guide-modal').classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeSizeGuideModal() {
        document.getElementById('size-guide-modal').classList.remove('active');
        if (!document.getElementById('pdp-modal').classList.contains('active')) {
          document.body.style.overflow = 'auto';
        }
      }

      /* --- 11. GSAP & SCROLLTRIGGER INITIALIZATION --- */
      function initGSAPAnimations() {
        if (typeof gsap === 'undefined') return;

        // Respect prefers-reduced-motion
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReducedMotion) return;

        if (typeof ScrollTrigger !== 'undefined') {
          gsap.registerPlugin(ScrollTrigger);
        }

        // Hero entrance
        gsap.from('.hero-title', {
          opacity: 0,
          y: 40,
          duration: 1,
          ease: 'power3.out'
        });

        gsap.from('#hero-shoe-img', {
          opacity: 0,
          scale: 0.88,
          rotation: 4,
          duration: 1.2,
          ease: 'power3.out',
          delay: 0.2
        });

        // Floating hero badge triggers
        gsap.to('#hero-shoe-img', {
          y: -12,
          duration: 2.4,
          repeat: -1,
          yoyo: true,
          ease: 'sine.inOut'
        });
      }

      /* --- 12. INITIALIZATION ON DOM READY --- */
      document.addEventListener('DOMContentLoaded', () => {
        renderBrandSelector();
        renderCatalog();
        renderRails();
        updateCartUI();
        updateWishlistBadge();
        initGSAPAnimations();

        // Keyboard navigation escape support
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            closeProductDetail();
            closeSizeGuideModal();
            toggleCartDrawer(false);
            toggleWishlistDrawer(false);
            toggleSearchOverlay(false);
            closeCheckoutModal();
            closeOrderSuccessModal();
          }
        });
      });
    </script>
