/* ==========================================================================
   AUREX Precision Electronics — Master CSS Design System
   Architecture: Pure CSS3, Semantic Responsive Tokens, Light Luxury Theme
   ========================================================================== */

:root {
  /* Color Palette — Refined Porcelain Foundation & Deep Cobalt Accent */
  --bg-body: #f8fafc;
  --bg-surface: #ffffff;
  --bg-surface-alt: #f1f5f9;
  --bg-surface-elevated: #ffffff;
  --bg-dark-hero: #090d16;
  --bg-dark-hero-surface: #111827;

  --border-subtle: #f1f5f9;
  --border-base: #e2e8f0;
  --border-strong: #cbd5e1;
  --border-dark: rgba(255, 255, 255, 0.12);

  --text-main: #0f172a;
  --text-muted: #475569;
  --text-light: #64748b;
  --text-faint: #94a3b8;
  --text-inverted: #f8fafc;
  --text-inverted-muted: #94a3b8;

  --accent: #1d4ed8;
  --accent-hover: #1e40af;
  --accent-light: #eff6ff;
  --accent-border: #bfdbfe;

  --warm-gold: #b45309;
  --warm-gold-bg: #fef3c7;
  --success: #059669;
  --success-bg: #ecfdf5;
  --danger: #dc2626;
  --danger-bg: #fef2f2;

  /* Typography */
  --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  /* Geometry & Elevation */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
  --shadow-floating: 0 25px 50px -12px rgba(15, 23, 42, 0.18);

  /* Transitions */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --duration-fast: 150ms;
  --duration-normal: 250ms;
  --duration-slow: 400ms;

  --container-max: 1360px;
}

/* Base Reset & Box Sizing */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-family: var(--font-body);
  color: var(--text-main);
  background-color: var(--bg-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  background-color: var(--bg-body);
}

img, svg {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: transparent;
}

/* Reduced Motion Support */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Layout Utilities */
.container {
  width: 100%;
  max-width: var(--container-max);
  margin-left: auto;
  margin-right: auto;
  padding-left: 1.5rem;
  padding-right: 1.5rem;
}

@media (min-width: 1024px) {
  .container {
    padding-left: 2.5rem;
    padding-right: 2.5rem;
  }
}

/* Header & Navigation Bar */
.top-announcement {
  background: #0f172a;
  color: #e2e8f0;
  font-size: 0.8125rem;
  font-weight: 500;
  padding: 0.5rem 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.top-announcement a {
  text-decoration: underline;
  text-underline-offset: 3px;
  color: #93c5fd;
}
.announcement-currency {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 80;
  background-color: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-base);
  transition: all var(--duration-normal) var(--ease-out);
}
.site-header.scrolled {
  background-color: rgba(255, 255, 255, 0.98);
  box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 4.5rem;
  gap: 1.5rem;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text-main);
}
.brand-logo .brand-mark {
  width: 2rem;
  height: 2rem;
  background: var(--text-main);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  font-weight: 800;
  font-size: 0.95rem;
  letter-spacing: -0.05em;
}
.brand-tagline {
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-light);
  font-family: var(--font-body);
  font-weight: 600;
  display: block;
}

.main-nav {
  display: none;
  align-items: center;
  gap: 1.75rem;
}
@media (min-width: 1024px) {
  .main-nav {
    display: flex;
  }
}
.nav-link {
  font-size: 0.9375rem;
  font-weight: 500;
  color: var(--text-muted);
  transition: color var(--duration-fast);
  position: relative;
  padding: 0.5rem 0;
}
.nav-link:hover, .nav-link.active {
  color: var(--accent);
}
.nav-link.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 2px;
  background-color: var(--accent);
  border-radius: 2px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.search-bar-wrap {
  position: relative;
  width: 220px;
  display: none;
}
@media (min-width: 768px) {
  .search-bar-wrap {
    display: block;
  }
}
@media (min-width: 1200px) {
  .search-bar-wrap {
    width: 280px;
  }
}
.search-input {
  width: 100%;
  height: 2.375rem;
  padding: 0 0.875rem 0 2.25rem;
  border: 1px solid var(--border-base);
  border-radius: var(--radius-md);
  background-color: var(--bg-surface-alt);
  font-size: 0.875rem;
  color: var(--text-main);
  transition: all var(--duration-fast);
}
.search-input:focus {
  outline: none;
  background-color: #fff;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
}
.search-icon-btn {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-light);
  pointer-events: none;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.5rem;
  height: 2.5rem;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  position: relative;
  transition: all var(--duration-fast);
  border: 1px solid transparent;
}
.icon-btn:hover {
  background-color: var(--bg-surface-alt);
  color: var(--text-main);
  border-color: var(--border-base);
}
.badge-count {
  position: absolute;
  top: 2px;
  right: 2px;
  background-color: var(--accent);
  color: white;
  font-size: 0.6875rem;
  font-weight: 700;
  min-width: 1.125rem;
  height: 1.125rem;
  padding: 0 0.25rem;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Secondary Category Strip */
.category-strip {
  background: #ffffff;
  border-bottom: 1px solid var(--border-base);
  overflow-x: auto;
  white-space: nowrap;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.category-strip::-webkit-scrollbar {
  display: none;
}
.category-strip-inner {
  display: flex;
  gap: 1.25rem;
  padding: 0.625rem 1.5rem;
}
.category-strip-link {
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-muted);
  padding: 0.25rem 0.625rem;
  border-radius: var(--radius-sm);
  transition: all var(--duration-fast);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.category-strip-link:hover, .category-strip-link.active {
  color: var(--accent);
  background-color: var(--accent-light);
}

/* Main Content Area */
#app {
  flex: 1;
}

/* Screen Transitions */
.screen-view {
  display: none;
  animation: fadeIn 0.25s var(--ease-out) forwards;
}
.screen-view.active {
  display: block;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* --------------------------------------------------------------------------
   CINEMATIC HERO SECTION
   -------------------------------------------------------------------------- */
.hero-section {
  position: relative;
  background: radial-gradient(circle at 65% 30%, #172554 0%, #090d16 60%, #030712 100%);
  color: #f8fafc;
  overflow: hidden;
  padding: 4rem 0 5rem;
  min-height: calc(90vh - 4.5rem);
  display: flex;
  align-items: center;
}
.hero-noise {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 0);
  background-size: 32px 32px;
  pointer-events: none;
  opacity: 0.7;
}
.hero-glow {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(37, 99, 235, 0.22) 0%, rgba(37, 99, 235, 0) 70%);
  top: 10%;
  right: 15%;
  filter: blur(60px);
  pointer-events: none;
}
.hero-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 3rem;
  align-items: center;
  position: relative;
  z-index: 2;
}
@media (min-width: 1024px) {
  .hero-grid {
    grid-template-columns: 1.1fr 1fr;
    gap: 4rem;
  }
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-mono);
  font-size: 0.8125rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #93c5fd;
  margin-bottom: 1rem;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 5.5vw, 4.5rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.04em;
  color: #ffffff;
  margin-bottom: 1.5rem;
}
.hero-title span {
  background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-desc {
  font-size: 1.125rem;
  line-height: 1.6;
  color: #cbd5e1;
  max-width: 520px;
  margin-bottom: 2rem;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  margin-bottom: 3rem;
}
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  background-color: var(--accent);
  color: #ffffff;
  font-weight: 600;
  font-size: 0.9375rem;
  padding: 0.875rem 1.75rem;
  border-radius: var(--radius-md);
  box-shadow: 0 4px 14px 0 rgba(29, 78, 216, 0.39);
  transition: all var(--duration-fast);
}
.btn-primary:hover {
  background-color: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px 0 rgba(29, 78, 216, 0.45);
}
.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  background-color: rgba(255, 255, 255, 0.08);
  color: #ffffff;
  font-weight: 600;
  font-size: 0.9375rem;
  padding: 0.875rem 1.75rem;
  border-radius: var(--radius-md);
  border: 1px solid rgba(255, 255, 255, 0.16);
  backdrop-filter: blur(8px);
  transition: all var(--duration-fast);
}
.btn-secondary:hover {
  background-color: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.3);
}

.hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  padding-top: 2rem;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
}
.hero-stat-val {
  font-family: var(--font-display);
  font-size: 1.5rem;
  font-weight: 700;
  color: #ffffff;
}
.hero-stat-lbl {
  font-size: 0.75rem;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 0.25rem;
}

/* Hero Visual Composition */
.hero-visual-stage {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}
.hero-product-frame {
  position: relative;
  width: 100%;
  max-width: 520px;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-main-img {
  width: 90%;
  height: 90%;
  object-fit: cover;
  border-radius: var(--radius-xl);
  box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
  transform-origin: center;
  transition: transform 0.5s ease;
}
.hero-floating-spec {
  position: absolute;
  background: rgba(17, 24, 39, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.16);
  padding: 0.875rem 1.125rem;
  border-radius: var(--radius-lg);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  font-size: 0.8125rem;
  color: #ffffff;
}
.spec-tag-top {
  top: 10%;
  left: -5%;
}
.spec-tag-bottom {
  bottom: 8%;
  right: -5%;
}
.spec-highlight {
  font-weight: 700;
  color: #93c5fd;
  display: block;
  font-size: 1rem;
  font-family: var(--font-display);
}

/* --------------------------------------------------------------------------
   BRAND FEATURES STRIP
   -------------------------------------------------------------------------- */
.trust-strip {
  background: #ffffff;
  border-bottom: 1px solid var(--border-base);
  padding: 2.25rem 0;
}
.trust-grid {
  display: grid;
  grid-template-columns: repeat(1, 1fr);
  gap: 1.5rem;
}
@media (min-width: 640px) {
  .trust-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (min-width: 1024px) {
  .trust-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
.trust-item {
  display: flex;
  align-items: flex-start;
  gap: 1rem;
}
.trust-icon-box {
  width: 2.75rem;
  height: 2.75rem;
  background-color: var(--accent-light);
  color: var(--accent);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.trust-title {
  font-size: 0.9375rem;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 0.2rem;
}
.trust-sub {
  font-size: 0.8125rem;
  color: var(--text-muted);
  line-height: 1.4;
}

/* --------------------------------------------------------------------------
   SECTION HEADINGS & EDITORIAL
   -------------------------------------------------------------------------- */
.section-header {
  margin-bottom: 2.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
@media (min-width: 768px) {
  .section-header {
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-end;
  }
}
.section-kicker {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 0.25rem;
}
.section-title {
  font-family: var(--font-display);
  font-size: clamp(1.75rem, 3vw, 2.25rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text-main);
}
.section-desc {
  font-size: 0.9375rem;
  color: var(--text-muted);
  max-width: 540px;
}
.link-action {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--accent);
  transition: gap var(--duration-fast);
}
.link-action:hover {
  gap: 0.6rem;
  color: var(--accent-hover);
}

/* --------------------------------------------------------------------------
   PRODUCT CARDS SYSTEM
   -------------------------------------------------------------------------- */
.products-grid {
  display: grid;
  grid-template-columns: repeat(1, 1fr);
  gap: 1.5rem;
}
@media (min-width: 540px) {
  .products-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
@media (min-width: 900px) {
  .products-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
@media (min-width: 1200px) {
  .products-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

.product-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-base);
  border-radius: var(--radius-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: all var(--duration-normal) var(--ease-out);
  position: relative;
}
.product-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.card-media {
  position: relative;
  background-color: #f1f5f9;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  cursor: pointer;
}
.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s var(--ease-out);
}
.product-card:hover .card-img {
  transform: scale(1.05);
}

.card-badge {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 0.25rem 0.5rem;
  border-radius: var(--radius-sm);
  background: rgba(15, 23, 42, 0.85);
  color: #fff;
  backdrop-filter: blur(4px);
  z-index: 2;
}
.card-badge.sale {
  background-color: var(--danger);
}
.card-badge.flagship {
  background-color: var(--accent);
}

.card-actions-float {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  z-index: 3;
  opacity: 0.9;
}
.card-float-btn {
  width: 2rem;
  height: 2rem;
  background: rgba(255, 255, 255, 0.92);
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  transition: all var(--duration-fast);
}
.card-float-btn:hover {
  background: #fff;
  color: var(--accent);
  transform: scale(1.08);
}
.card-float-btn.active {
  color: var(--danger);
}

.card-body {
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  flex: 1;
}

/* Anti-AI Slop: Quiet inline unboxed metadata */
.card-meta {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.75rem;
  color: var(--text-light);
  margin-bottom: 0.35rem;
}

  // Safe localStorage persistence

      localStorage.setItem(key, JSON.stringify(data));

      console.warn('Storage quota exceeded or restricted', e);
    }
  }

  // Currency Formatter for Kenyan Shillings (KES)
  const currencyFormatter = new Intl.NumberFormat('en-KE', {

  });

  function formatKSh(amount) {
    if (typeof amount !== 'number') return 'KSh 0';
    return currencyFormatter.format(amount).replace('KES', 'KSh');

  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');

    const toast = document.createElement('div');
    toast.className = `toast-msg toast-${type}`;
    toast.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      </svg>
      <span>${escapeHTML(message)}</span>
    `;

    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(30px)';
      toast.style.transition = 'all 0.3s ease';
      setTimeout(() => toast.remove(), 300);
    }, 3200);
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>'"]/g, tag => ({

      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag] || tag));
  }

  // --------------------------------------------------------------------------

  // --------------------------------------------------------------------------
  function addToCart(productId, qty = 1, selectedVariant = null) {
    const product = window.AUREX_PRODUCTS.find(p => p.id === productId);
    if (!product) return;

    const variantKey = selectedVariant ? JSON.stringify(selectedVariant) : 'standard';
    const existingIndex = APP_STATE.cart.findIndex(
      item => item.id === productId && item.variantKey === variantKey
    );

    if (existingIndex > -1) {
      APP_STATE.cart[existingIndex].qty += qty;
    } else {
      APP_STATE.cart.push({
        id: product.id,
        name: product.name,
        brand: product.brand,
        price: product.price,
        image: product.image,
        category: product.category,
        variantKey: variantKey,
        variantDetails: selectedVariant,
        qty: qty
      });
    }

    saveState('aurex_cart', APP_STATE.cart);
    updateHeaderCounters();
    showToast(`Added "${product.name}" to cart`, 'success');
  }

  function removeFromCart(index) {
    if (APP_STATE.cart[index]) {

      renderCartScreen();
      showToast(`Removed "${removed[0].name}" from cart`, 'info');

  }

      if (APP_STATE.cart[index].qty <= 0) {

        return;
      }
      saveState('aurex_cart', APP_STATE.cart);
      updateHeaderCounters();
      renderCartScreen();
    }
  }

    const idx = APP_STATE.wishlist.indexOf(productId);
    if (idx > -1) {
      APP_STATE.wishlist.splice(idx, 1);
      showToast(`Removed from wishlist`, 'info');
    } else {
      APP_STATE.wishlist.push(productId);
      showToast(`Saved to wishlist`, 'success');
    }
    saveState('aurex_wishlist', APP_STATE.wishlist);
    updateHeaderCounters();
    // Refresh card states if in view
    document.querySelectorAll(`.card-wishlist-btn[data-id="${productId}"]`).forEach(btn => {
      btn.classList.toggle('active', APP_STATE.wishlist.includes(productId));
    });
  }

  function toggleCompare(productId) {
    const product = window.AUREX_PRODUCTS.find(p => p.id === productId);
    if (!product) return;

    const idx = APP_STATE.compare.indexOf(productId);
    if (idx > -1) {
      APP_STATE.compare.splice(idx, 1);
      showToast(`Removed from comparison`, 'info');
    } else {
      if (APP_STATE.compare.length >= 4) {
        showToast(`You can compare up to 4 devices simultaneously`, 'warning');

      }

      showToast(`Added to comparison matrix`, 'success');

  }

      saveState('aurex_recent', APP_STATE.recent);
    }
  }

  // --------------------------------------------------------------------------
  // 4. GSAP & SCROLLTRIGGER INITIALIZATION ENGINE
  // --------------------------------------------------------------------------
  function initGSAPAnimations() {
    // Check reduced motion preference
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) {
      console.info('GSAP motion skipped: prefers-reduced-motion active.');
      return;
    }

    if (!window.gsap) {
      console.warn('GSAP library not detected. Application remains fully operational via CSS.');
      return;
    }

    try {
      if (window.ScrollTrigger) {
        gsap.registerPlugin(ScrollTrigger);
      }

      // Hero Entrance Timeline
      const heroTimeline = gsap.timeline({ defaults: { ease: 'power3.out', duration: 0.9 } });
      heroTimeline
        .from('.hero-eyebrow', { opacity: 0, y: -20, delay: 0.1 })
        .from('.hero-title', { opacity: 0, y: 30, duration: 1.1 }, '-=0.6')
        .from('.hero-desc', { opacity: 0, y: 20 }, '-=0.7')
        .from('.hero-actions', { opacity: 0, y: 20 }, '-=0.7')
        .from('.hero-stats', { opacity: 0, y: 20 }, '-=0.6')
        .from('.hero-main-img', { opacity: 0, scale: 0.88, duration: 1.2, ease: 'power2.out' }, '-=1.2')
        .from('.hero-floating-spec', { opacity: 0, scale: 0.85, stagger: 0.2 }, '-=0.7');

      // ScrollTrigger Parallax on Hero elements
      if (window.ScrollTrigger && document.querySelector('.hero-section')) {
        gsap.to('.hero-main-img', {
          yPercent: 20,
          scale: 1.05,
          ease: 'none',
          scrollTrigger: {
            trigger: '.hero-section',
            start: 'top top',
            end: 'bottom top',
            scrub: true
          }
        });

        gsap.to('.hero-floating-spec', {
          yPercent: -35,
          ease: 'none',
          scrollTrigger: {
            trigger: '.hero-section',
            start: 'top top',
            end: 'bottom top',
            scrub: true
          }
        });
      }

      // Stagger Reveal for Product Cards
      if (window.ScrollTrigger) {
        ScrollTrigger.batch('.product-card', {
          onEnter: batch => gsap.to(batch, { opacity: 1, y: 0, stagger: 0.08, duration: 0.6, overwrite: true }),
          start: 'top 88%'
        });

        // Banner Image Scrub Parallax
        if (document.querySelector('.banner-media-container img')) {
          gsap.to('.banner-media-container img', {
            yPercent: -15,
            ease: 'none',
            scrollTrigger: {
              trigger: '.editorial-banner-section',
              start: 'top bottom',
              end: 'bottom top',
              scrub: true
            }
          });
        }
      }
    } catch (err) {
      console.warn('GSAP animation sequence encountered notice:', err);
    }
  }

  // --------------------------------------------------------------------------
  // 5. PAYSTACK INTEGRATION ARCHITECTURE & ADAPTER
  // --------------------------------------------------------------------------
  /*
   * SECURITY & BACKEND NOTICE:
   * In a live production environment, transactions MUST be initialized server-side
   * using the Paystack Secret Key, and verified via signed webhooks.
   * Client-side secrets are strictly forbidden.
   *
   * The AUREX adapter below supports:
   * 1. Simulated Demo Mode (Default, safe, test orders with reference AUR-XXXX)
   * 2. Official Paystack Inline modal (via https://js.paystack.co/v1/inline.js)
   */
  function handlePaystackCheckout(orderData) {
    const isDemo = APP_STATE.paystackConfig.isDemo;

    if (isDemo) {
      // Simulate authentic processing delay & order receipt
      const demoRef = 'AUR-DEMO-' + Date.now().toString().slice(-6);
      showToast('Connecting to Paystack Demo Gateway (KES)...', 'info');

      setTimeout(() => {
        showToast('Payment verified successfully in Demo Mode', 'success');
        // Clear cart
        APP_STATE.cart = [];
        saveState('aurex_cart', APP_STATE.cart);
        updateHeaderCounters();
        // Route to Confirmation Screen
        window.location.hash = `#/confirmation?ref=${demoRef}&total=${orderData.totalAmount}&email=${encodeURIComponent(orderData.customerEmail)}`;
      }, 1500);
      return;
    }

    // Live or Test Key with PaystackPop Inline SDK
    if (typeof PaystackPop === 'undefined') {
      showToast('Paystack Inline SDK could not be reached. Switching to demo checkout.', 'warning');
      APP_STATE.paystackConfig.isDemo = true;
      handlePaystackCheckout(orderData);
      return;
    }

    try {
      const handler = PaystackPop.setup({
        key: APP_STATE.paystackConfig.publicKey,
        email: orderData.customerEmail,
        amount: Math.round(orderData.totalAmount * 100), // Paystack requires amount in lowest currency unit (cents/kobo)
        currency: 'KES',
        ref: 'AUR-' + Math.floor(Math.random() * 1000000000 + 1),
        metadata: {
          custom_fields: [
            { display_name: "Customer Name", variable_name: "customer_name", value: orderData.customerName },
            { display_name: "Phone", variable_name: "phone", value: orderData.customerPhone }
          ]
        },
        callback: function (response) {
          // Transaction completed in popup
          APP_STATE.cart = [];
          saveState('aurex_cart', APP_STATE.cart);
          updateHeaderCounters();
          window.location.hash = `#/confirmation?ref=${response.reference}&total=${orderData.totalAmount}&email=${encodeURIComponent(orderData.customerEmail)}`;
        },
        onClose: function () {
          showToast('Payment window was closed before completion', 'info');
        }
      });
      handler.openIframe();
    } catch (e) {
      console.error('Paystack initialization error:', e);
      showToast('Paystack error: ' + e.message, 'danger');
    }
  }

        p.name.toLowerCase().includes(q) ||

              ${escapeHTML(product.description)}

                      ${options.map((opt, i) => `

      return `

          <div style="width: 4.5rem; height: 4.5rem; background: var(--bg-surface-alt); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: var(--text-light);">

              <div class="cart-item-row">

    return `
      <div class="container" style="padding: 6rem 0; text-align: center;">
        <div style="font-family: var(--font-mono); font-size: 5rem; font-weight: 800; color: var(--accent); margin-bottom: 1rem;">404</div>
        <h1 style="font-family: var(--font-display); font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem;">Hardware Not Found</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">The requested product or screen does not exist or has been relocated.</p>
        <a href="#/" class="btn-primary" style="margin: 0 auto;">Return to Home</a>
      </div>
    `;
  }

  // --------------------------------------------------------------------------
  // 8. CLIENT-SIDE ROUTER ENGINE
  // --------------------------------------------------------------------------
  function handleRoute() {
    const hash = window.location.hash || '#/';
    const [path, queryString] = hash.split('?');
    const params = new URLSearchParams(queryString || '');
    const appEl = document.getElementById('app');

    window.scrollTo({ top: 0, behavior: 'instant' });

    let screenHTML = '';
    let pageTitle = 'AUREX // Precision Electronics';

    if (path === '#' || path === '#/' || path === '#home') {
      screenHTML = renderHomeScreen();
      pageTitle = 'AUREX Precision Electronics — Flagship Computing & Audio';
    } else if (path === '#/shop') {
      screenHTML = renderShopScreen();
      pageTitle = 'Hardware Catalogue — AUREX Electronics';
    } else if (path === '#/category') {
      const catId = params.get('id') || 'all';
      screenHTML = renderCategoryScreen(catId);
      pageTitle = `${catId.toUpperCase()} Hardware — AUREX`;
    } else if (path === '#/product') {
      const prodId = params.get('id');
      screenHTML = renderProductDetailScreen(prodId);
      pageTitle = `Product Details — AUREX`;
    } else if (path === '#/search') {
      const q = params.get('q') || '';
      screenHTML = renderSearchScreen(q);
      pageTitle = `Search: ${q} — AUREX`;
    } else if (path === '#/cart') {
      screenHTML = renderCartScreen();
      pageTitle = 'Shopping Cart — AUREX';
    } else if (path === '#/wishlist') {
      screenHTML = renderWishlistScreen();
      pageTitle = 'Wishlist — AUREX';
    } else if (path === '#/deals') {
      screenHTML = renderDealsScreen();
      pageTitle = 'Deals & Offers — AUREX';
    } else if (path === '#/compare') {
      screenHTML = renderCompareScreen();
      pageTitle = 'Compare Hardware — AUREX';
    } else if (path === '#/about') {
      screenHTML = renderAboutScreen();
      pageTitle = 'About AUREX Heritage';
    } else if (path === '#/contact') {
      screenHTML = renderContactScreen();
      pageTitle = 'Customer Support — AUREX';
    } else if (path === '#/account') {
      screenHTML = renderAccountScreen();
      pageTitle = 'Customer Account — AUREX';
    } else if (path === '#/checkout') {
      screenHTML = renderCheckoutScreen();
      pageTitle = 'Checkout — AUREX';
    } else if (path === '#/confirmation') {
      screenHTML = renderConfirmationScreen(params);
      pageTitle = 'Order Confirmed — AUREX';
    } else if (path === '#/shipping') {
      screenHTML = renderShippingScreen();
      pageTitle = 'Shipping Guidelines — AUREX';
    } else if (path === '#/warranty') {
      screenHTML = renderWarrantyScreen();
      pageTitle = 'Warranty & Returns — AUREX';
    } else if (path === '#/faq') {
      screenHTML = renderFaqScreen();
      pageTitle = 'FAQ — AUREX';
    } else if (path === '#/legal') {
      screenHTML = renderLegalScreen();
      pageTitle = 'Legal & Privacy — AUREX';
    } else {
      screenHTML = render404Screen();
      pageTitle = 'Page Not Found — AUREX';
    }

    document.title = pageTitle;
    appEl.innerHTML = screenHTML;

    // Trigger animations for fresh DOM
    setTimeout(initGSAPAnimations, 50);

    // Update active state in nav links
    document.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href');
      link.classList.toggle('active', href === path || (path === '#/' && href === '#/'));
    });
  }

  // --------------------------------------------------------------------------
  // 9. PUBLIC APP API & EVENT CONTROLLERS
  // --------------------------------------------------------------------------
  window.aurexApp = {
    addToCart,
    removeFromCart,
    updateCartQty,
    toggleWishlist,
    toggleCompare,
    clearCompare: () => {
      APP_STATE.compare = [];
      saveState('aurex_compare', []);
      updateHeaderCounters();
      renderCompareScreen();
      showToast('Cleared comparison matrix', 'info');
      handleRoute();
    },
    setFilter: (key, value) => {
      APP_STATE.activeFilters[key] = value;
      const appEl = document.getElementById('app');
      appEl.innerHTML = renderShopScreen();
    },
    resetFilters: () => {
      APP_STATE.activeFilters = {
        category: 'all',
        brand: 'all',
        maxPrice: 900000,
        search: '',
        inStockOnly: false,
        sortBy: 'featured'
      };
      const appEl = document.getElementById('app');
      appEl.innerHTML = renderShopScreen();
    },
    stepperChange: (delta) => {
      const el = document.getElementById('pdp-qty-val');
      if (!el) return;
      let val = Math.max(1, parseInt(el.textContent || '1', 10) + delta);
      el.textContent = val;
    },
    addCurrentPdpToCart: (productId) => {
      const el = document.getElementById('pdp-qty-val');
      const qty = el ? parseInt(el.textContent || '1', 10) : 1;
      const activeVariantBtn = document.querySelector('.variant-pill-btn.active');
      const variant = activeVariantBtn ? { option: activeVariantBtn.textContent.trim() } : null;
      addToCart(productId, qty, variant);
    },
    switchPdpImage: (src, btn) => {
      const img = document.getElementById('pdp-active-img');
      if (img) img.src = src;
      document.querySelectorAll('.pdp-thumb-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    },
    selectVariant: (btn) => {
      btn.parentElement.querySelectorAll('.variant-pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    },
    openQuickView: (productId) => {
      const product = window.AUREX_PRODUCTS.find(p => p.id === productId);
      if (!product) return;
      const modal = document.getElementById('quickview-modal');
      const content = document.getElementById('quickview-content');
      if (!modal || !content) return;

      content.innerHTML = `
        <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:2rem; align-items:center;">
          <img src="${product.image}" alt="${escapeHTML(product.name)}" style="width:100%; aspect-ratio:1; object-fit:cover; border-radius:var(--radius-lg);">
          <div>
            <div style="font-family:var(--font-mono); font-size:0.75rem; color:var(--accent); text-transform:uppercase;">${product.brand}</div>
            <h3 style="font-family:var(--font-display); font-size:1.5rem; font-weight:800; margin:0.25rem 0 0.5rem;">${escapeHTML(product.name)}</h3>
            <div style="font-family:var(--font-display); font-size:1.5rem; font-weight:800; color:var(--text-main); margin-bottom:1rem;">${formatKSh(product.price)}</div>
            <p style="color:var(--text-muted); font-size:0.875rem; line-height:1.5; margin-bottom:1.5rem;">${escapeHTML(product.description)}</p>
            <div style="display:flex; gap:0.75rem;">
              <button onclick="window.aurexApp.addToCart('${product.id}'); window.aurexApp.closeQuickView();" class="btn-primary" style="flex:1; justify-content:center;">Add to Cart</button>
              <a href="#/product?id=${product.id}" onclick="window.aurexApp.closeQuickView();" class="btn-secondary" style="color:var(--text-main); border-color:var(--border-strong);">Full Details</a>
            </div>
          </div>
        </div>
      `;
      modal.classList.add('active');
    },
    closeQuickView: () => {
      const modal = document.getElementById('quickview-modal');
      if (modal) modal.classList.remove('active');
    },
    applyCoupon: () => {
      const input = document.getElementById('coupon-code-input');
      if (!input) return;
      const code = input.value.trim().toUpperCase();
      if (code === 'AUREX10') {
        APP_STATE.appliedCoupon = { code: 'AUREX10', discountPercent: 10 };
        saveState('aurex_coupon', APP_STATE.appliedCoupon);
        showToast('Promo code applied: 10% discount', 'success');
        renderCartScreen();
        handleRoute();
      } else if (code === 'TECH5') {
        APP_STATE.appliedCoupon = { code: 'TECH5', discountPercent: 5 };
        saveState('aurex_coupon', APP_STATE.appliedCoupon);
        showToast('Promo code applied: 5% discount', 'success');
        renderCartScreen();
        handleRoute();
      } else {
        showToast('Invalid promo coupon code', 'danger');
      }
    },
    toggleDemoMode: (val) => {
      APP_STATE.paystackConfig.isDemo = val;
    },
    processCheckout: (form) => {
      const formData = new FormData(form);
      const items = APP_STATE.cart;
      const subtotal = items.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const shipping = subtotal > 50000 ? 0 : 1500;
      const discount = APP_STATE.appliedCoupon ? (subtotal * (APP_STATE.appliedCoupon.discountPercent / 100)) : 0;
      const totalAmount = subtotal + shipping - discount;

      const orderData = {
        customerName: formData.get('name'),
        customerEmail: formData.get('email'),
        customerPhone: formData.get('phone'),
        totalAmount: totalAmount,
        items: items
      };

      handlePaystackCheckout(orderData);
    },
    handleNewsletter: (form) => {
      showToast('Thank you for subscribing to AUREX hardware drops', 'success');
      form.reset();
    },
    handleContact: (form) => {
      showToast('Inquiry received. A technical specialist will contact you shortly.', 'success');
      form.reset();
    },
    handleSignIn: (form) => {
      showToast('Client demo authentication simulated', 'info');
      form.reset();
    },
    toggleMobileDrawer: (open) => {
      const drawer = document.getElementById('mobile-drawer');
      const overlay = document.getElementById('drawer-overlay');
      if (drawer && overlay) {
        if (open) {
          drawer.classList.add('active');
          overlay.classList.add('active');
        } else {
          drawer.classList.remove('active');
          overlay.classList.remove('active');
        }
      }
    }
  };

  // --------------------------------------------------------------------------
  // 10. BOOTSTRAP INITIALIZATION
  // --------------------------------------------------------------------------
  window.addEventListener('DOMContentLoaded', () => {
    updateHeaderCounters();
    window.addEventListener('hashchange', handleRoute);
    handleRoute();

    // Sticky header scroll listener
    window.addEventListener('scroll', () => {
      const header = document.querySelector('.site-header');
      if (header) {
        header.classList.toggle('scrolled', window.scrollY > 20);
      }
    }, { passive: true });

    // Header search form listener
    const searchForm = document.getElementById('header-search-form');
    if (searchForm) {
      searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('header-search-input');
        if (input && input.value.trim() !== '') {
          window.location.hash = `#/search?q=${encodeURIComponent(input.value.trim())}`;
          input.value = '';
        }
      });
    }
  });

})();

    </script>
