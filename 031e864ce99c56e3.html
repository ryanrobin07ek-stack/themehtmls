  <style>
    /* Base Reset & Core Typography */
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--theme-kinetic-high-performance-electronics-color-62);
      color: var(--theme-kinetic-high-performance-electronics-color-63);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    h1, h2, h3, h4, .font-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.025em;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--theme-kinetic-high-performance-electronics-color-62);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--theme-kinetic-high-performance-electronics-color-64);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-kinetic-high-performance-electronics-color-65);
    }

    /* Utility classes */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Subtle hair-line borders */
    .hairline-b {
      border-bottom: 1px solid var(--theme-kinetic-high-performance-electronics-color-66);
    }
    .hairline-t {
      border-top: 1px solid var(--theme-kinetic-high-performance-electronics-color-66);
    }
    .hairline-border {
      border: 1px solid var(--theme-kinetic-high-performance-electronics-color-66);
    }
    .hairline-border-light {
      border: 1px solid var(--theme-kinetic-high-performance-electronics-color-67);
    }

    /* Toast animation */
    @keyframes slideInUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-anim {
      animation: slideInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Hide scrollbar for category tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

          user: { name: "George Ruto", email: "", phone: "" },
          addresses: [
            { id: "addr-1", title: "Home", street: "Riverside Drive, Apartment 4B", city: "Nairobi", isDefault: true }
          ],
          orders: [
            {
              id: "KIN-98412",
              date: "2",
              status: "Delivered",
              total: 49500,
              items: [{ name: "Sony WH-1000XM5 Wireless Headphones", qty: 1, price: 49500 }]
            }
          ]
        });
      }

      load(key, fallback) {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item, (k, v) => (typeof v === 'string' && v.startsWith('@@img:') && IMGS[v.slice(6)]) ? IMGS[v.slice(6)] : v) : fallback;
        } catch (e) {
          return fallback;
        }
      }

      save(key, val) {
        try {
          const rev = {}; Object.keys(IMGS).forEach(n => { rev[IMGS[n]] = n; });
          localStorage.setItem(key, JSON.stringify(val, (k, v) => (typeof v === 'string' && rev[v]) ? '@@img:' + rev[v] : v));
        } catch (e) {}
      }

      // Cart Actions
      addToCart(product, selectedColor, selectedOption, qty = 1) {
        const optionDelta = selectedOption ? (selectedOption.priceDelta || 0) : 0;
        const unitPrice = product.price + optionDelta;
        const colorName = selectedColor ? selectedColor.name : (product.variants?.colors?.[0]?.name || 'Standard');
        const optionLabel = selectedOption ? selectedOption.label : (product.variants?.options?.[0]?.label || 'Standard');
        const cartKey = `${product.id}__${colorName}__${optionLabel}`;

        const existingIndex = this.cart.findIndex(i => i.cartKey === cartKey);
        if (existingIndex > -1) {
          this.cart[existingIndex].qty += qty;
        } else {
          this.cart.push({
            cartKey,
            productId: product.id,
            name: product.name,
            brand: product.brand,
            image: product.image,
            fallbackImage: product.fallbackImage,
            unitPrice,
            color: colorName,
            option: optionLabel,
            qty
          });
        }
        this.save('kinetic_cart', this.cart);
        this.updateBadges();
        showToast(`Added to cart: ${product.name}`);
      }

      updateCartQty(cartKey, delta) {
        const item = this.cart.find(i => i.cartKey === cartKey);
        if (item) {
          item.qty += delta;
          if (item.qty <= 0) {
            this.cart = this.cart.filter(i => i.cartKey !== cartKey);
          }
          this.save('kinetic_cart', this.cart);
          this.updateBadges();
        }
      }

      removeFromCart(cartKey) {
        this.cart = this.cart.filter(i => i.cartKey !== cartKey);
        this.save('kinetic_cart', this.cart);
        this.updateBadges();
        showToast("Item removed from cart");
      }

      clearCart() {
        this.cart = [];
        this.save('kinetic_cart', this.cart);
        this.updateBadges();
      }

      getCartSubtotal() {
        return this.cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0);
      }

      // Wishlist Actions
      toggleWishlist(productId) {
        const exists = this.wishlist.includes(productId);
        if (exists) {
          this.wishlist = this.wishlist.filter(id => id !== productId);
          showToast("Removed from wishlist");
        } else {
          this.wishlist.push(productId);
          showToast("Saved to wishlist");
        }
        this.save('kinetic_wishlist', this.wishlist);
        this.updateBadges();
        return !exists;
      }

      isInWishlist(productId) {
        return this.wishlist.includes(productId);
      }

      // Compare Actions
      toggleCompare(productId) {
        const exists = this.compare.includes(productId);
        if (exists) {
          this.compare = this.compare.filter(id => id !== productId);
          showToast("Removed from comparison");
        } else {
          if (this.compare.length >= 4) {
            showToast("Comparison limit is 4 devices. Remove one first.");
            return false;
          }
          this.compare.push(productId);
          showToast("Added to comparison");
        }
        this.save('kinetic_compare', this.compare);
        this.updateBadges();
        return !exists;
      }

      isInCompare(productId) {
        return this.compare.includes(productId);
      }

      clearCompare() {
        this.compare = [];
        this.save('kinetic_compare', this.compare);
        this.updateBadges();
      }

      addRecent(productId) {
        this.recent = [productId, ...this.recent.filter(id => id !== productId)].slice(0, 8);

        if (compareBadge) {
          compareBadge.textContent = compareCount;
          compareBadge.style.display = compareCount > 0 ? 'flex' : 'none';
        }
      }

    // Global PDP State Variables
    let pdpSelectedColorIndex = 0;
    let pdpSelectedOptionIndex = 0;
    let pdpQuantity = 1;

    window.selectPdpColor = function(idx, name) {
      pdpSelectedColorIndex = idx;
      document.getElementById('selectedColorLabel').textContent = name;
      document.querySelectorAll('.pdp-color-btn').forEach((btn, i) => {
        if (i === idx) {
          btn.classList.add('border-brand-accent', 'scale-110');
          btn.classList.remove('border-zinc-700');
        } else {
          btn.classList.remove('border-brand-accent', 'scale-110');
          btn.classList.add('border-zinc-700');
        }
      });
    };

    window.selectPdpOption = function(idx, delta) {
      pdpSelectedOptionIndex = idx;
      const currentHash = window.location.hash;
      const productId = currentHash.replace('#/product/', '');
      const p = PRODUCTS.find(item => item.id === productId);
      if (p) {
        const newTotal = p.price + delta;
        document.getElementById('pdpDisplayPrice').textContent = formatMoney(newTotal);
      }
      document.querySelectorAll('.pdp-option-btn').forEach((btn, i) => {
        if (i === idx) {
          btn.classList.add('border-brand-accent', 'bg-zinc-900', 'text-white');
          btn.classList.remove('border-zinc-800', 'bg-zinc-950', 'text-zinc-400');
        } else {
          btn.classList.remove('border-brand-accent', 'bg-zinc-900', 'text-white');
          btn.classList.add('border-zinc-800', 'bg-zinc-950', 'text-zinc-400');
        }
      });
    };

    window.stepPdpQty = function(delta) {
      pdpQuantity = Math.max(1, pdpQuantity + delta);
      document.getElementById('pdpQtyCount').textContent = pdpQuantity;
    };

    window.submitPdpCart = function(productId) {
      const p = PRODUCTS.find(item => item.id === productId);
      if (p) {
        const color = p.variants?.colors?.[pdpSelectedColorIndex];
        const option = p.variants?.options?.[pdpSelectedOptionIndex];
        state.addToCart(p, color, option, pdpQuantity);
      }
    };

    window.buyNowDirect = function(productId) {
      window.submitPdpCart(productId);
      window.location.hash = '#/checkout';
    };

    // --- 5. CLIENT-SIDE ROUTER ARCHITECTURE ---
    class Router {
      constructor() {
        this.currentRoute = '';
        this.outlet = document.getElementById('appOutlet');
        window.addEventListener('hashchange', () => this.handleRouting());
      }

      init() {
        if (!window.location.hash) {
          window.location.hash = '#/';
        } else {
          this.handleRouting();
        }
      }

      refreshCurrent() {
        this.handleRouting();
      }

      handleRouting() {
        const hash = window.location.hash || '#/';
        this.currentRoute = hash;

        // Reset scroll position on route change
        window.scrollTo({ top: 0, behavior: 'instant' });

        // Update active header indicator
        document.querySelectorAll('.nav-link').forEach(link => {
          const route = link.getAttribute('data-route');
          if (hash.includes(route)) {
            link.classList.add('text-white', 'border-b-2', 'border-brand-accent');
          } else {
            link.classList.remove('text-white', 'border-b-2', 'border-brand-accent');
          }
        });

        // Close mobile drawer on route navigation
        document.getElementById('mobileDrawer').classList.add('hidden');

        // Route resolution
        if (hash === '#/' || hash === '#') {
          this.outlet.innerHTML = renderHomeView();
          initHomeAnimations();
        } else if (hash === '#/products') {
          this.outlet.innerHTML = renderCatalogView(null, null, "All Hardware Products");
          initCatalogFilters();
        } else if (hash === '#/new-arrivals') {
          this.outlet.innerHTML = renderCatalogView(null, null, "New Arrivals 2026");
          initCatalogFilters('new');
        } else if (hash === '#/best-sellers') {
          this.outlet.innerHTML = renderCatalogView(null, null, "Best Sellers & Flagships");
          initCatalogFilters('best');
        } else if (hash === '#/deals') {
          this.outlet.innerHTML = renderCatalogView(null, null, "Featured Hardware Deals");
          initCatalogFilters('deals');
        } else if (hash.startsWith('#/category/')) {
          const catId = hash.replace('#/category/', '');
          this.outlet.innerHTML = renderCatalogView(catId, null);
          initCatalogFilters();
        } else if (hash === '#/brands') {
          this.outlet.innerHTML = renderBrandsDirectoryView();
        } else if (hash.startsWith('#/brand/')) {
          const brandId = hash.replace('#/brand/', '');
          this.outlet.innerHTML = renderCatalogView(null, brandId);
          initCatalogFilters();
        } else if (hash.startsWith('#/product/')) {
          const prodId = hash.replace('#/product/', '');
          this.outlet.innerHTML = renderProductDetailView(prodId);
        } else if (hash.startsWith('#/guide/')) {
          const guideId = hash.replace('#/guide/', '');
          this.outlet.innerHTML = renderGuideArticleView(guideId);
        } else if (hash === '#/buying-guides') {

        } else if (hash === '#/compare') {
          this.outlet.innerHTML = renderCompareView();
        } else if (hash === '#/cart') {

        } else if (hash === '#/wishlist') {

        } else if (hash === '#/checkout') {

        } else if (hash.startsWith('#/order-confirmed/')) {

        } else if (hash === '#/account') {

    // --- 6. CATALOGUE FILTER LOGIC (Multi-criteria intersection) ---
    function initCatalogFilters(presetMode = null) {
      const priceSlider = document.getElementById('priceRangeInput');
      const priceDisplay = document.getElementById('priceRangeDisplay');
      const sortSelect = document.getElementById('catalogSortSelect');
      const inStockCheckbox = document.getElementById('filterInStockOnly');
      const dealsCheckbox = document.getElementById('filterDealsOnly');

      if (presetMode === 'deals' && dealsCheckbox) dealsCheckbox.checked = true;

      function applyFilters() {
        const hash = window.location.hash;
        const currentCategory = hash.startsWith('#/category/') ? hash.replace('#/category/', '') : null;
        const currentBrand = hash.startsWith('#/brand/') ? hash.replace('#/brand/', '') : null;

        const maxPrice = priceSlider ? parseInt(priceSlider.value, 10) : 550000;
        if (priceDisplay) priceDisplay.textContent = formatMoney(maxPrice);

        // Checked brands
        const checkedBrandInputs = Array.from(document.querySelectorAll('input[name="filterBrand"]:checked')).map(i => i.value);
        const inStockOnly = inStockCheckbox ? inStockCheckbox.checked : false;
        const dealsOnly = dealsCheckbox ? dealsCheckbox.checked : false;
        const sortVal = sortSelect ? sortSelect.value : 'featured';

        let filtered = PRODUCTS.filter(p => {
          if (currentCategory && p.category !== currentCategory) return false;
          if (currentBrand && p.brand.toLowerCase() !== currentBrand) return false;
          if (p.price > maxPrice) return false;
          if (checkedBrandInputs.length > 0 && !checkedBrandInputs.includes(p.brand.toLowerCase())) return false;
          if (inStockOnly && !p.inStock) return false;
          if (dealsOnly && (!p.comparePrice || p.comparePrice <= p.price)) return false;
          return true;
        });

        // Sorting
        if (sortVal === 'price_asc') filtered.sort((a, b) => a.price - b.price);
        else if (sortVal === 'price_desc') filtered.sort((a, b) => b.price - a.price);
        else if (sortVal === 'rating') filtered.sort((a, b) => b.rating - a.rating);
        else if (sortVal === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));

        // Render matching products
        const grid = document.getElementById('catalogGrid');
        const emptyState = document.getElementById('catalogEmptyState');
        const countSpan = document.getElementById('activeResultCount');

        if (countSpan) countSpan.textContent = `Showing ${filtered.length} hardware model${filtered.length === 1 ? '' : 's'}`;

        if (grid && emptyState) {
          if (filtered.length === 0) {
            grid.innerHTML = '';
            emptyState.classList.remove('hidden');
          } else {
            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(p => renderProductCard(p)).join('');
            lucide.createIcons();
          }
        }
      }

      // Event listeners
      if (priceSlider) priceSlider.addEventListener('input', applyFilters);
      if (sortSelect) sortSelect.addEventListener('change', applyFilters);
      if (inStockCheckbox) inStockCheckbox.addEventListener('change', applyFilters);
      if (dealsCheckbox) dealsCheckbox.addEventListener('change', applyFilters);
      document.querySelectorAll('input[name="filterBrand"]').forEach(b => b.addEventListener('change', applyFilters));

      const resetBtn = document.getElementById('resetFiltersBtn');
      if (resetBtn) resetBtn.addEventListener('click', () => window.clearAllCatalogFilters());

      // Initial filter calculation
      applyFilters();
    }

    window.clearAllCatalogFilters = function() {
      const slider = document.getElementById('priceRangeInput');
      if (slider) slider.value = 550000;
      document.querySelectorAll('input[name="filterBrand"]').forEach(i => i.checked = false);
      const stock = document.getElementById('filterInStockOnly');
      if (stock) stock.checked = false;
      const deals = document.getElementById('filterDealsOnly');
      if (deals) deals.checked = false;
      initCatalogFilters();
    };
