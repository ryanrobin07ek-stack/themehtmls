      bottom: 6px;
      right: 8px;

      box-shadow: 0 4px 18px var(--theme-arcadia-events-bespoke-event-planning-spatial-design-studio-color-10);
    }
    .btn-hero-contact:hover {
      background-color: var(--theme-arcadia-events-bespoke-event-planning-spatial-design-studio-color-11);
      transform: translateY(-2px);
      box-shadow: 0 8px 26px var(--theme-arcadia-events-bespoke-event-planning-spatial-design-studio-color-12);
    }
    .btn-hero-contact:active {
      transform: translateY(0);
    }

    .btn-editorial-outline {
      border: 1px solid var(--theme-arcadia-events-bespoke-event-planning-spatial-design-studio-color-03);

      color: var(--theme-arcadia-events-bespoke-event-planning-spatial-design-studio-color-01);
    }

    img {
      transition: opacity 0.3s ease;
    }
    img.img-error {
      background: var(--theme-arcadia-events-bespoke-event-planning-spatial-design-studio-color-13);
      object-fit: cover;
    }

    .header-glass {
      background: var(--theme-arcadia-events-bespoke-event-planning-spatial-design-studio-color-14);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--theme-arcadia-events-bespoke-event-planning-spatial-design-studio-color-06);
    }

    /* Animated marquee text if wanted */
    @keyframes subtleDrift {
      0% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0); }
    }
    .drift-subtle {
      animation: subtleDrift 6s ease-in-out infinite;

    function updateLiveQuote() {
      const guests = parseInt(document.getElementById('calcGuestSlider')?.value || '180');
      const display = document.getElementById('sliderGuestsDisplay');
      if (display) display.textContent = `${guests} Guests`;

      const scopeTier = document.getElementById('calcScopeTier')?.value || 'fullProduction';
      const eventType = document.querySelector('input[name="calcEventType"]:checked')?.value || 'wedding';

      const hasFlorals = document.getElementById('addonFlorals')?.checked;
      const hasVenue = document.getElementById('addonVenue')?.checked;
      const hasAV = document.getElementById('addonAV')?.checked;
      const hasRehearsal = document.getElementById('addonRehearsal')?.checked;

      // Base studio fee calculation
      let baseFee = 580000;
      if (scopeTier === 'monthOf') baseFee = 220000;
      if (scopeTier === 'luxuryComprehensive') baseFee = 850000;

      // Add-on adjustments
      if (hasVenue) baseFee += 90000;
      if (hasRehearsal) baseFee += 110000;

      // Estimated total production range (catering ~ /head + florals + AV)
      const perHeadCatering = eventType === 'corporate' ? 3500 : 5200;
      const cateringTotal = guests * perHeadCatering;
      const floralEstimate = hasFlorals ? (guests > 200 ? 950000 : 550000) : 150000;
      const avEstimate = hasAV ? (guests > 200 ? 800000 : 450000) : 100000;

      const totalLow = baseFee + cateringTotal + floralEstimate + avEstimate;
      const totalHigh = Math.round(totalLow * 1.35);

      const feeElem = document.getElementById('calcEstimatedFee');
      const sumGuests = document.getElementById('calcSummaryGuests');
      const sumType = document.getElementById('calcSummaryType');
      const sumTotal = document.getElementById('calcSummaryTotalEvent');

      if (feeElem) feeElem.textContent = `KES ${baseFee.toLocaleString()}`;
      if (sumGuests) sumGuests.textContent = `${guests} Guests`;
      if (sumType) sumType.textContent = eventType.toUpperCase();
      if (sumTotal) sumTotal.textContent = `KES ${(Math.round(totalLow / 100000) * 100000).toLocaleString()} - ${(Math.round(totalHigh / 100000) * 100000).toLocaleString()}`;
    }

    /* =====================================================================

       ===================================================================== */
    function router() {
      const hash = window.location.hash || '#/';
      const path = hash.replace(/^#\/?/, '').trim();
      const app = document.getElementById('app');
      if (!app) return;

      // Update Navigation Active States
      document.querySelectorAll('#desktopNav a').forEach(link => {
        const linkRoute = link.getAttribute('data-route') || '';
        if ((path === '' && linkRoute === '') || (linkRoute !== '' && path.startsWith(linkRoute))) {
          link.classList.add('border-arcadia-gold', 'text-arcadia-gold', 'font-bold');
          link.classList.remove('border-transparent', 'text-arcadia-espresso');
        } else {
          link.classList.remove('border-arcadia-gold', 'text-arcadia-gold', 'font-bold');
          link.classList.add('border-transparent', 'text-arcadia-espresso');
        }
      });

      // Close mobile drawer on route change
      const drawer = document.getElementById('mobileMenuDrawer');
      const iconClosed = document.getElementById('menuIconClosed');
      const iconOpen = document.getElementById('menuIconOpen');
      if (drawer && !drawer.classList.contains('hidden')) {
        drawer.classList.add('hidden');
        iconClosed?.classList.remove('hidden');
        iconOpen?.classList.add('hidden');
      }

      // Route Dispatcher
      if (path === '' || path === '/') {
        app.innerHTML = renderHomeView();
      } else if (path === 'services') {
        app.innerHTML = renderServicesHubView();
      } else if (path.startsWith('services/')) {
        const sub = path.split('/')[1];
        app.innerHTML = renderServiceDetailView(sub);
      } else if (path === 'portfolio') {
        app.innerHTML = renderPortfolioView(currentPortfolioFilter);
      } else if (path.startsWith('portfolio/')) {
        const sub = path.split('/')[1];
        app.innerHTML = renderPortfolioView('All');
        setTimeout(() => showCaseStudyModal(sub), 50);
      } else if (path === 'packages') {
        app.innerHTML = renderPackagesView();
      } else if (path === 'request-a-quote') {
        app.innerHTML = renderQuoteCalculatorView();
        setTimeout(updateLiveQuote, 50);
      } else if (path === 'contact') {
        app.innerHTML = renderContactView();
      } else if (path === 'about') {
        app.innerHTML = renderAboutView();
      } else if (path === 'our-process') {
        app.innerHTML = renderProcessView();
      } else if (path === 'inspiration') {
        app.innerHTML = renderJournalView();
      } else if (path.startsWith('inspiration/')) {
        const sub = path.split('/')[1];
        app.innerHTML = renderJournalView();
        setTimeout(() => showArticleModal(sub), 50);
      } else if (path === 'faq') {
        app.innerHTML = renderFaqView();
      } else if (path === 'policies') {
        app.innerHTML = renderPoliciesView();
      } else {
        // Fallback 404 with sensible navigation back to home
        app.innerHTML = `
          <div class="py-24 text-center max-w-md mx-auto px-4">
            <span class="font-code text-xs text-arcadia-gold uppercase block mb-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span></span>

            <p class="text-xs text-arcadia-muted mb-6"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
            <a href="#/" class="btn-hero-contact px-6 py-3 font-mono text-xs uppercase tracking-wider rounded-sm inline-block"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:49%"></span></a>
          </div>
        `;
      }

      // Scroll smoothly to top
      window.scrollTo({ top: 0, behavior: 'instant' });

      // Refresh Lucide Icons
      lucide.createIcons();

      // Initialize GSAP & ScrollTrigger with fail-safe check
      initGsapAnimations();
    }

    /* =====================================================================
       6. GSAP + SCROLLTRIGGER INITIALIZATION & CLEANUP
       Strict: Must not hide or delay the Hero "Contact Us" CTA!
       ===================================================================== */
    function initGsapAnimations() {
      // Respect user's motion preferences
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) return;

      if (typeof gsap === 'undefined') return;

      try {
        if (typeof ScrollTrigger !== 'undefined') {
          gsap.registerPlugin(ScrollTrigger);
          // Refresh ScrollTrigger to clean up stale triggers
          ScrollTrigger.getAll().forEach(t => t.kill());
          ScrollTrigger.refresh();
        }

        // Subtly animate headlines on view load
        gsap.from('h1, h2', {
          opacity: 0,
          y: 12,
          duration: 0.6,
          ease: 'power2.out',
          stagger: 0.08
        });

        // Gently reveal crosshair cards as user scrolls
        const cards = document.querySelectorAll('.crosshair-box');
        if (cards.length > 0 && typeof ScrollTrigger !== 'undefined') {
          cards.forEach(card => {
            gsap.from(card, {
              scrollTrigger: {
                trigger: card,
                start: 'top 88%',
                toggleActions: 'play none none none'
              },
              opacity: 0.4,
              y: 16,
              duration: 0.5,
              ease: 'power1.out'
            });
          });
        }
      } catch (err) {
        // Safe fallback - animation failure never breaks page usability
        console.warn('GSAP animation warning:', err);
      }
    }

    /* =====================================================================
       7. MOBILE MENU TOGGLE
       ===================================================================== */
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const mobileDrawer = document.getElementById('mobileMenuDrawer');
    const iconClosed = document.getElementById('menuIconClosed');
    const iconOpen = document.getElementById('menuIconOpen');

    mobileBtn?.addEventListener('click', () => {
      const isHidden = mobileDrawer.classList.contains('hidden');
      if (isHidden) {
        mobileDrawer.classList.remove('hidden');
        iconClosed?.classList.add('hidden');
        iconOpen?.classList.remove('hidden');
      } else {
        mobileDrawer.classList.add('hidden');
        iconClosed?.classList.remove('hidden');
        iconOpen?.classList.add('hidden');
      }
    });

    /* =====================================================================
       8. INITIALIZATION ON WINDOW LOAD & HASH CHANGE
       ===================================================================== */
    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', () => {
      router();
      lucide.createIcons();
    });

  </script>
