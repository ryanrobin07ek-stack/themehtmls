<!doctype html>
<html lang="en" data-eshop-skeleton-preview=""><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <meta name="description" content="">
    <meta property="og:title" content="">
    <meta property="og:description" content="">
    <meta property="og:type" content="">
    <meta name="twitter:card" content="">

    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">

    <!-- GSAP & ScrollTrigger from Cloudflare CDN for Cinematic Animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
      /* ==========================================================================
         DESIGN SYSTEM & CSS CUSTOM PROPERTIES
         ========================================================================== */
      :root {
        --color-bg: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-01);
        --color-surface: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-02);
        --color-surface-subtle: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-03);
        --color-surface-dark: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-04);
        --color-surface-darker: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-05);
        --color-surface-card-dark: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-06);
        --color-text-main: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-07);
        --color-text-muted: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-08);
        --color-text-light: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-09);
        --color-text-light-muted: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-10);
        --color-accent: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-11);
        --color-accent-hover: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-12);
        --color-accent-soft: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-13);
        --color-terracotta: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-14);
        --color-sage: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-15);
        --color-border: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-16);
        --color-border-dark: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-17);
        --color-success: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-18);
        --color-danger: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-19);
        --font-serif: 'Cormorant Garamond', Georgia, serif;
        --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        --radius-sm: 6px;
        --radius-md: 12px;
        --radius-lg: 18px;
        --radius-xl: 24px;
        --shadow-soft: 0 4px 20px -2px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-20);
        --shadow-card: 0 10px 30px -4px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-21);
        --shadow-elevated: 0 20px 45px -10px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-22);
        --shadow-cinematic: 0 30px 70px -15px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-23);
        --transition-standard: cubic-bezier(0.16, 1, 0.3, 1);
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        background-color: var(--color-bg);
        color: var(--color-text-main);
        font-family: var(--font-sans);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        background-color: var(--color-bg);
      }

      /* Typography Helpers */
      .font-serif { font-family: var(--font-serif); }
      .font-sans { font-family: var(--font-sans); }

      h1, h2, h3, h4 {
        font-family: var(--font-serif);
        font-weight: 500;
        line-height: 1.15;
        color: var(--color-text-main);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button, input, select, textarea {
        font-family: inherit;
        font-size: inherit;
        border: none;
        outline: none;
        background: none;
      }

      button {
        cursor: pointer;
        transition: all 0.25s ease;
      }

      img {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .container {
        width: 100%;
        max-width: 1320px;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.85rem 1.6rem;
        font-weight: 600;
        font-size: 0.92rem;
        letter-spacing: 0.02em;
        border-radius: 9999px;
        transition: all 0.3s var(--transition-standard);
      }

      .btn-primary {
        background: var(--color-surface-dark);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-24);
        box-shadow: 0 4px 15px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-25);
      }
      .btn-primary:hover {
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-26);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-27);
      }

      .btn-accent {
        background: var(--color-accent);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-02);
        box-shadow: 0 4px 15px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-28);
      }
      .btn-accent:hover {
        background: var(--color-accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-29);
      }

      .btn-secondary {
        background: var(--color-surface);
        color: var(--color-text-main);
        border: 1px solid var(--color-border);
      }
      .btn-secondary:hover {
        background: var(--color-surface-subtle);
        border-color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-30);
      }

      .btn-ghost {
        background: transparent;
        color: var(--color-text-main);
      }
      .btn-ghost:hover {
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-20);
      }

      .btn-outline-white {
        background: transparent;
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-02);
        border: 1px solid var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-31);
      }
      .btn-outline-white:hover {
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-32);
        border-color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-02);
      }

      /* ==========================================================================
         CINEMATIC ENTRANCE: DOORS THAT ACTUALLY OPEN (3D HINGE ANIMATION)
         ========================================================================== */
      #entrance-portal {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-33);
        perspective: 1600px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Behind the doors: revealed interior sanctuary */
      #entrance-reveal-bg {
        position: absolute;
        inset: 0;
        background: none center/cover no-repeat;
        filter: brightness(0.92) contrast(1.05);
        transform: scale(1.08);
        transition: transform 3.5s cubic-bezier(0.1, 0.9, 0.2, 1);
      }

      #entrance-reveal-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-34) 0%, var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-35) 80%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        z-index: 10;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 1.6s ease, transform 1.6s var(--transition-standard);
      }

      .entrance-brand-emblem {
        width: 56px;
        height: 56px;
        border: 1px solid var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-36);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        color: var(--color-accent);
      }

      .entrance-brand-title {
        font-family: var(--font-serif);
        font-size: clamp(2.5rem, 6vw, 5rem);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-24);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 0.75rem;
        text-shadow: 0 4px 20px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-37);
      }

      .entrance-brand-sub {
        font-family: var(--font-sans);
        font-size: 0.95rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-38);
        max-width: 520px;
        font-weight: 300;
      }

      /* 3D Doorway Structure */
      #door-viewport {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        pointer-events: none;
        z-index: 20;
      }

      .door-panel {
        width: 50%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-39);
        /* Rich architectural fluted dark oak texture */
        background-image: 
          repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 16px),
          linear-gradient(180deg, #18221D 0%, #0F1612 100%);
        box-shadow: inset 0 0 80px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-40);
        transition: transform 2.6s cubic-bezier(0.2, 0.8, 0.15, 1);
      }

      .door-panel-left {
        transform-origin: left center;
        border-right: 1px solid var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-28);
      }

      .door-panel-right {
        transform-origin: right center;
        border-left: 1px solid var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-28);
      }

      /* Center seam golden light leaking through */
      #door-light-seam {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        transform: translateX(-50%);
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-41);
        box-shadow: 0 0 45px 12px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-42);
        z-index: 25;
        transition: opacity 1.2s ease;
      }

      /* Door brass vertical handles */
      .door-handle {
        position: absolute;
        top: 50%;
        width: 6px;
        height: 120px;
        background: linear-gradient(180deg, var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-43) 0%, var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-44) 100%);
        border-radius: 3px;
        box-shadow: 0 2px 15px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-37), inset 0 1px 2px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-45);
      }
      .door-panel-left .door-handle {
        right: 40px;
        transform: translateY(-50%);
      }
      .door-panel-right .door-handle {
        left: 40px;
        transform: translateY(-50%);
      }

      /* Architectural Door Moldings */
      .door-molding {
        position: absolute;
        border: 1px solid var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-46);
        box-shadow: inset 0 0 20px var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-47);
      }
      .door-panel-left .door-molding-top {
        top: 8%; left: 15%; right: 15%; height: 38%;
      }
      .door-panel-left .door-molding-bottom {
        bottom: 8%; left: 15%; right: 15%; height: 38%;
      }
      .door-panel-right .door-molding-top {
        top: 8%; left: 15%; right: 15%; height: 38%;
      }
      .door-panel-right .door-molding-bottom {
        bottom: 8%; left: 15%; right: 15%; height: 38%;
      }

      /* Skip Entrance Control */
      #skip-entrance-btn {
        position: absolute;
        bottom: 2.5rem;
        right: 2.5rem;
        z-index: 100;
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-48);
        backdrop-filter: blur(8px);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-24);
        border: 1px solid var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-49);
        padding: 0.65rem 1.4rem;
        border-radius: 9999px;
        font-size: 0.85rem;
        letter-spacing: 0.05em;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #skip-entrance-btn:hover {
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-50);
        border-color: var(--color-accent);
      }

      /* Door Open Active State */
      .doors-opened .door-panel-left {
        transform: rotateY(-105deg);
      }
      .doors-opened .door-panel-right {
        transform: rotateY(105deg);
      }
      .doors-opened #door-light-seam {
        opacity: 0;
      }
      .doors-opened #entrance-reveal-bg {
        transform: scale(1);
      }
      .doors-opened #entrance-reveal-overlay {
        opacity: 1;
        transform: translateY(0);
      }

      /* ==========================================================================
         SITE HEADER & NAVIGATION
         ========================================================================== */
      #site-header {
        position: sticky;
        top: 0;
        z-index: 500;
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-51);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-52);
        transition: all 0.3s ease;
      }

      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 80px;
      }

      .brand-logo {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .brand-symbol {
        width: 38px;
        height: 38px;
        border: 1.5px solid var(--color-accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-accent);
      }
      .brand-text {
        display: flex;
        flex-direction: column;
      }
      .brand-title {
        font-family: var(--font-serif);
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--color-text-main);
        line-height: 1;
      }
      .brand-tagline {
        font-size: 0.65rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--color-text-muted);
        margin-top: 2px;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 2rem;
      }
      .nav-link {
        font-size: 0.92rem;
        font-weight: 500;
        color: var(--color-text-main);
        transition: color 0.2s ease;
        position: relative;
        padding: 0.4rem 0;
      }
      .nav-link:hover, .nav-link.active {
        color: var(--color-accent);
      }
      .nav-link.active::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1.5px;
        background: var(--color-accent);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      /* Currency picker */
      .currency-selector {
        position: relative;
      }
      .currency-btn {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--color-text-muted);
        padding: 0.45rem 0.8rem;
        border-radius: 9999px;
        background: var(--color-surface-subtle);
        border: 1px solid var(--color-border);
      }
      .currency-btn:hover {
        color: var(--color-text-main);
        border-color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-53);
      }

      .nav-badge-btn {
        position: relative;
        padding: 0.6rem;
        border-radius: 50%;
        color: var(--color-text-main);
        background: transparent;
      }
      .nav-badge-btn:hover {
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-54);
      }
      .badge-counter {
        position: absolute;
        top: 2px;
        right: 2px;
        background: var(--color-accent);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-02);
        font-size: 0.68rem;
        font-weight: 700;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mobile-menu-toggle {
        display: none;
        padding: 0.6rem;
        color: var(--color-text-main);
      }

      /* ==========================================================================
         HERO SECTION & IMMERSIVE SEARCH BAR
         ========================================================================== */
      .hero-section {
        position: relative;
        padding: 5rem 0 7rem;
        background: linear-gradient(180deg, var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-55) 0%, var(--color-bg) 100%);
        overflow: hidden;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 4rem;
        align-items: center;
      }

      .hero-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 1rem;
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-56);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-44);
        border-radius: 9999px;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }

      .hero-title {
        font-size: clamp(3rem, 5.5vw, 4.8rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        margin-bottom: 1.5rem;
        color: var(--color-text-main);
      }
      .hero-title span {
        font-style: italic;
        color: var(--color-accent);
      }

      .hero-lead {
        font-size: 1.15rem;
        line-height: 1.65;
        color: var(--color-text-muted);
        max-width: 540px;
        margin-bottom: 2.5rem;
        font-weight: 300;
      }

      .hero-visual-card {
        position: relative;
        border-radius: var(--radius-xl);
        overflow: hidden;
        box-shadow: var(--shadow-cinematic);
      }
      .hero-visual-card img {
        width: 100%;
        height: 540px;
        object-fit: cover;
        transition: transform 1.2s cubic-bezier(0.1, 0.9, 0.2, 1);
      }
      .hero-visual-card:hover img {
        transform: scale(1.03);
      }
      .hero-visual-badge {
        position: absolute;
        bottom: 2rem;
        left: 2rem;
        right: 2rem;
        padding: 1.5rem;
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-57);
        backdrop-filter: blur(12px);
        border: 1px solid var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-58);
        border-radius: var(--radius-lg);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-24);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Unified Floating Search Engine */
      .search-engine-bar {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 9999px;
        padding: 0.6rem 0.75rem;
        box-shadow: var(--shadow-elevated);
        display: grid;
        grid-template-columns: 1.5fr 1fr 1fr 1.2fr auto;
        align-items: center;
        gap: 0.5rem;
        margin-top: 1.5rem;
      }

      .search-segment {
        padding: 0.6rem 1.2rem;
        border-radius: 9999px;
        cursor: pointer;
        transition: background 0.2s ease;
        position: relative;
      }
      .search-segment:hover {

        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--color-accent);
      }

      .host-stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        margin: 2.5rem 0;
      }
      .stat-card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        padding: 1.8rem;
        box-shadow: var(--shadow-soft);
      }
      .stat-card-lbl {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--color-text-muted);
        margin-bottom: 0.4rem;
      }
      .stat-card-val {
        font-family: var(--font-serif);
        font-size: 2.2rem;
        font-weight: 600;
        color: var(--color-text-main);
      }

      /* ==========================================================================
         MODALS & OVERLAYS (PHOTO LIGHTBOX, M-PESA STK DIALOG, TOASTS)
         ========================================================================== */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-70);
        backdrop-filter: blur(12px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .modal-backdrop.open {
        display: flex;
      }

      .modal-box {
        background: var(--color-surface);
        border-radius: var(--radius-xl);
        max-width: 640px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 2.5rem;
        box-shadow: var(--shadow-cinematic);
        position: relative;
      }
      .modal-close-btn {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--color-surface-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-text-main);
      }

      /* Lightbox Gallery Modal */
      .lightbox-modal {
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-71);
        max-width: 1100px;
        width: 100%;
        border-radius: var(--radius-xl);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .lightbox-media {
        position: relative;
        height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lightbox-img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .lightbox-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-58);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-02);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lightbox-nav-btn:hover { background: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-72); }
      .lightbox-prev { left: 1.5rem; }
      .lightbox-next { right: 1.5rem; }

      /* Toast Notification */
      #toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        pointer-events: none;
      }
      .toast-msg {
        background: var(--color-surface-dark);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-24);
        padding: 0.9rem 1.6rem;
        border-radius: 9999px;
        box-shadow: var(--shadow-cinematic);
        font-size: 0.9rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        transform: translateY(20px);
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: auto;
      }
      .toast-msg.show {
        transform: translateY(0);
        opacity: 1;
      }

      /* ==========================================================================
         SITE FOOTER
         ========================================================================== */
      #site-footer {
        background: var(--color-surface-dark);
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-24);
        padding: 5rem 0 3rem;
        border-top: 1px solid var(--color-border-dark);
      }
      .footer-grid {
        display: grid;
        grid-template-columns: 1.5fr repeat(3, 1fr);
        gap: 4rem;
        margin-bottom: 4rem;
      }
      .footer-brand-title {
        font-family: var(--font-serif);
        font-size: 2rem;
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-24);
        letter-spacing: 0.12em;
        margin-bottom: 0.75rem;
      }
      .footer-col-title {
        font-family: var(--font-sans);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--color-accent);
        margin-bottom: 1.4rem;
      }
      .footer-links-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .footer-link {
        font-size: 0.92rem;
        color: var(--color-text-light-muted);
        transition: color 0.2s ease;
      }
      .footer-link:hover {
        color: var(--theme-elysian-stays-cinematic-vacation-boutique-short-stay-rentals-color-02);
      }

      .footer-bottom {
        padding-top: 2.5rem;
        border-top: 1px solid var(--color-border-dark);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        color: var(--color-text-light-muted);
      }

      /* Responsive Media Queries */
      @media (max-width: 1024px) {
        .hero-grid { grid-template-columns: 1fr; gap: 3rem; }
        .hero-visual-card img { height: 420px; }
        .search-engine-bar { grid-template-columns: 1fr 1fr; border-radius: var(--radius-xl); padding: 1.2rem; }
        .detail-layout-grid { grid-template-columns: 1fr; }
        .gallery-editorial-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 200px 200px; }
        .gallery-item-hero { grid-column: span 2; grid-row: span 1; }
        .checkout-grid { grid-template-columns: 1fr; }
        .host-stat-grid { grid-template-columns: repeat(2, 1fr); }
        .footer-grid { grid-template-columns: 1fr 1fr; gap: 2.5rem; }
      }

      @media (max-width: 768px) {
        .nav-links, .nav-actions .btn { display: none; }
        .mobile-menu-toggle { display: block; }
        .dest-card-col-6, .dest-card-col-4, .dest-card-col-8 { grid-column: span 12; }
        .dest-card { height: 280px; }
        .property-grid { grid-template-columns: 1fr; }
        .search-engine-bar { grid-template-columns: 1fr; }
        .search-segment:not(:last-child)::after { display: none; }
        .gallery-editorial-grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
        .gallery-item { min-width: 85vw; height: 260px; scroll-snap-align: start; }
        .story-banner { padding: 3rem 1.8rem; }
        .story-banner-grid { grid-template-columns: 1fr; }
        .footer-grid { grid-template-columns: 1fr; }
      }
    </style>

    <!-- ==========================================================================
         CINEMATIC 3D ENTRANCE PORTAL
         ========================================================================== -->
    <div id="entrance-portal" role="dialog">
      <!-- Revealed interior sanctuary behind doors -->
      <div id="entrance-reveal-bg"></div>
      <div id="entrance-reveal-overlay">
        <div class="entrance-brand-emblem">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <h1 class="entrance-brand-title"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></h1>
        <p class="entrance-brand-sub"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 96%;"></span></p>
      </div>

      <!-- 3D Realistic Double Doorway -->
      <div id="door-viewport">
        <!-- Left Door Panel -->
        <div class="door-panel door-panel-left" id="door-left">
          <div class="door-molding door-molding-top"></div>
          <div class="door-molding door-molding-bottom"></div>
          <div class="door-handle"></div>
        </div>
        <!-- Right Door Panel -->
        <div class="door-panel door-panel-right" id="door-right">
          <div class="door-molding door-molding-top"></div>
          <div class="door-molding door-molding-bottom"></div>
          <div class="door-handle"></div>
        </div>
      </div>

      <!-- Center Seam Warm Light Glow -->
      <div id="door-light-seam"></div>

      <!-- Skip Control -->
      <button id="skip-entrance-btn">
        <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 46%;"></span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

    <!-- ==========================================================================
         SITE HEADER & NAVIGATION
         ========================================================================== -->
    <header id="site-header">
      <div class="container">
        <div class="nav-inner">
          <!-- Brand Logo -->
          <a href="#/" class="brand-logo">
            <div class="brand-symbol">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </div>
            <div class="brand-text">
              <span class="brand-title"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></span>
              <span class="brand-tagline"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 51%;"></span></span>
            </div>
          </a>

          <!-- Navigation Links -->
          <nav class="nav-links">
            <a href="#/explore" class="nav-link" id="nav-explore"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 35%;"></span></a>
            <a href="#/destinations" class="nav-link" id="nav-destinations"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 32%;"></span></a>
            <a href="#/collections" class="nav-link" id="nav-collections"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 30%;"></span></a>
            <a href="#/how-it-works" class="nav-link" id="nav-how"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 32%;"></span></a>
            <a href="#/trips" class="nav-link" id="nav-trips"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 22%;"></span></a>
          </nav>

          <!-- Navigation Right Actions -->
          <div class="nav-actions">
            <!-- Currency Selector -->
            <div class="currency-selector">
              <button class="currency-btn" id="currency-toggle-btn">
                <span id="current-currency-lbl"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>
            </div>

            <!-- Wishlist Icon Badge -->
            <a href="#/wishlist" class="nav-badge-btn">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
              <span class="badge-counter" id="wishlist-counter"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
            </a>

            <!-- Host a Stay CTA -->
            <a href="#/host" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.65rem 1.25rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 30%;"></span></a>

            <!-- User Menu -->
            <a href="#/host/dashboard" class="btn btn-primary" style="font-size: 0.85rem; padding: 0.65rem 1.25rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 30%;"></span></a>

            <!-- Mobile Hamburger Toggle -->
            <button class="mobile-menu-toggle" id="mobile-toggle-btn">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- ==========================================================================
         ROUTER VIEW CONTAINER (DYNAMIC VIEW RENDERING)

        } catch(e) { return []; }
      }

      function toggleWishlist(propId) {
        let list = getWishlist();
        if (list.includes(propId)) {
          list = list.filter(id => id !== propId);
          showToast('Removed from saved sanctuaries');
        } else {
          list.push(propId);
          showToast('Saved to your architectural wishlist');
        }
        localStorage.setItem('elysian_wishlist', JSON.stringify(list));
        updateWishlistBadge();
        // Refresh wishlist buttons on screen
        document.querySelectorAll(`.wishlist-btn[data-id="${propId}"]`).forEach(btn => {
          btn.classList.toggle('saved', list.includes(propId));
        });
      }

        const badge = document.getElementById('wishlist-counter');
        if (badge) {
          badge.textContent = getWishlist().length;
        }

      // ==========================================

        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerHTML = `
          <svg width="18" height="18" viewBox="" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="2"></polyline>
          </svg>
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
        `;
        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add('show'));
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 400);
        }, 3200);
      }

      // ==========================================
      // 6. 3D ENTRANCE SEQUENCE CONTROLLER
      // ==========================================
      function initEntrance() {
        const portal = document.getElementById('entrance-portal');
        const skipBtn = document.getElementById('skip-entrance-btn');
        if (!portal) return;

        // Check if user already saw entrance this session or prefers reduced motion
        const alreadySeen = sessionStorage.getItem('elysian_door_entrance_seen');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function closePortal() {
          portal.classList.add('doors-opened');
          setTimeout(() => {
            portal.style.transition = 'opacity 1s ease';
            portal.style.opacity = '0';
            setTimeout(() => {
              portal.style.display = 'none';
              sessionStorage.setItem('elysian_door_entrance_seen', 'true');
            }, 1000);
          }, 1800);
        }

        if (alreadySeen || prefersReducedMotion) {
          portal.style.display = 'none';
          return;
        }

        // Automatic cinematic reveal on normal initial page load
        setTimeout(() => {
          portal.classList.add('doors-opened');
          setTimeout(() => {
            closePortal();
          }, 2400);
        }, 700);

        skipBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          portal.style.transition = 'opacity 0.4s ease';
          portal.style.opacity = '0';
          setTimeout(() => {
            portal.style.display = 'none';
            sessionStorage.setItem('elysian_door_entrance_seen', 'true');
          }, 400);
        });
      }

      // Replay entrance button in footer
      document.getElementById('replay-entrance-btn')?.addEventListener('click', () => {
        sessionStorage.removeItem('elysian_door_entrance_seen');
        const portal = document.getElementById('entrance-portal');
        if (portal) {
          portal.classList.remove('doors-opened');
          portal.style.display = 'flex';
          portal.style.opacity = '1';
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(() => {
            portal.classList.add('doors-opened');
            setTimeout(() => {
              portal.style.transition = 'opacity 1s ease';
              portal.style.opacity = '0';
              setTimeout(() => {
                portal.style.display = 'none';
              }, 1000);
            }, 2600);
          }, 500);
        }
      });

      // Currency toggle button in header
      document.getElementById('currency-toggle-btn')?.addEventListener('click', () => {
        const keys = Object.keys(CURRENCIES);
        const idx = keys.indexOf(currentCurrency);
        currentCurrency = keys[(idx + 1) % keys.length];

      // 8.2 VIEW: DISCOVERY & SEARCH WITH WORKING REAL-TIME FILTERS
      function renderSearchView(params = {}) {
        const allProperties = getProperties();
        const wishlist = getWishlist();

        // Filter state from parameters or default
        const filterDest = params.dest || '';
        const filterType = params.type || '';
        const filterMaxPrice = params.maxPrice ? parseInt(params.maxPrice) : 150000;
        const filterGuests = params.guests ? parseInt(params.guests) : 1;
        const sortBy = params.sort || 'recommended';

        // Apply filters
        let filtered = allProperties.filter(p => {
          if (filterDest && !p.destination.toLowerCase().includes(filterDest.toLowerCase()) && !p.neighborhood.toLowerCase().includes(filterDest.toLowerCase())) {
            return false;
          }
          if (filterType && p.category !== filterType) {
            return false;
          }
          if (p.pricePerNight > filterMaxPrice) {
            return false;
          }
          if (p.guests < filterGuests) {
            return false;
          }
          return true;
        });

        // Apply sorting
        if (sortBy === 'price-low') {
          filtered.sort((a, b) => a.pricePerNight - b.pricePerNight);
        } else if (sortBy === 'price-high') {
          filtered.sort((a, b) => b.pricePerNight - a.pricePerNight);
        } else if (sortBy === 'rating') {
          filtered.sort((a, b) => b.rating - a.rating);
        }

        return `
          <div class="container search-view-layout">
            <div style="margin-bottom: 2rem;">
              <span class="section-tag"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>

                  <option ${filterDest === 'Diani' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:30%"></span></option>
                  <option ${filterDest === 'Watamu' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:16%"></span></option>
                  <option ${filterDest === 'Naivasha' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></option>
                  <option ${filterDest === 'Mara' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:30%"></span></option>
                  <option ${filterDest === 'Zanzibar' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:22%"></span></option>
                  <option ${filterDest === 'Cape Town' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span></option>
                </select>

                <select class="filter-select" id="filter-type-select" onchange="applySearchFilters()">
                  <option ${filterType === '' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:49%"></span></option>
                  <option ${filterType === 'villa' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></option>
                  <option ${filterType === 'coastal' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:49%"></span></option>
                  <option ${filterType === 'lodge' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></option>
                  <option ${filterType === 'penthouse' ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:41%"></span></option>

        const sort = document.getElementById('filter-sort-select').value;
        let query = `#/explore?`;

        if (type) query += `type=${encodeURIComponent(type)}&`;

      function saveBookingRecord(propId) {
        const p = getPropertyById(propId);
        const existing = JSON.parse(localStorage.getItem('elysian_bookings') || '[]');
        existing.push({
          id: 'ELY-' + Math.floor(100000 + Math.random() * 900000),
          propertyId: propId,
          title: p.title,
          heroImg: p.heroImg,
          destination: p.destination,
          dates: '3 Nights • Confirmed Stay',
          bookedAt: new Date().toLocaleDateString()
        });
        localStorage.setItem('elysian_bookings', JSON.stringify(existing));
      }

      // ==========================================
      // 9. CLIENT-SIDE ROUTER & DISPATCHER
      // ==========================================
      function parseHash() {
        const hash = location.hash || '#/';
        const [path, queryString] = hash.split('?');
        const params = {};
        if (queryString) {
          new URLSearchParams(queryString).forEach((val, key) => {
            params[key] = val;
          });
        }
        return { path, params };
      }

      function renderCurrentRoute() {
        const { path, params } = parseHash();
        const viewport = document.getElementById('app-viewport');
        if (!viewport) return;

        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Update active state on nav links
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        if (path === '#/' || path === '') {
          // Home
        } else if (path.startsWith('#/explore') || path.startsWith('#/search')) {
          document.getElementById('nav-explore')?.classList.add('active');
        } else if (path.startsWith('#/destinations')) {
          document.getElementById('nav-destinations')?.classList.add('active');
        } else if (path.startsWith('#/collections')) {
          document.getElementById('nav-collections')?.classList.add('active');
        } else if (path.startsWith('#/trips')) {
          document.getElementById('nav-trips')?.classList.add('active');
        }

        // Route dispatcher
        if (path === '#/' || path === '') {
          viewport.innerHTML = renderHomeView();
        } else if (path === '#/explore' || path === '#/search') {
          viewport.innerHTML = renderSearchView(params);
        } else if (path.startsWith('#/property/')) {
          const id = path.replace('#/property/', '');
          viewport.innerHTML = renderPropertyDetailView(id);
        } else if (path.startsWith('#/booking/')) {
          const id = path.replace('#/booking/', '').split('?')[0];
          const step = parseInt(params.step) || 1;
          viewport.innerHTML = renderBookingView(id, step);
        } else if (path === '#/trips') {
          viewport.innerHTML = renderTripsView();
        } else if (path === '#/wishlist') {
          viewport.innerHTML = renderWishlistView();
        } else if (path === '#/host') {
          viewport.innerHTML = renderHowItWorksView();
        } else if (path === '#/host/onboarding') {
          viewport.innerHTML = renderHostOnboardingView();
        } else if (path.startsWith('#/host/dashboard')) {
          viewport.innerHTML = renderHostDashboardView();
        } else if (path === '#/how-it-works' || path === '#/trust-and-safety' || path === '#/cancellation-policy') {
          viewport.innerHTML = renderHowItWorksView();
        } else if (path === '#/destinations') {
          viewport.innerHTML = renderSearchView();
        } else if (path === '#/collections') {
          viewport.innerHTML = renderSearchView();
        } else {
          // Fallback to home
          viewport.innerHTML = renderHomeView();
        }

        updateWishlistBadge();
      }

      // Initialize App Lifecycle
      window.addEventListener('hashchange', renderCurrentRoute);
      window.addEventListener('DOMContentLoaded', () => {
        initEntrance();
        renderCurrentRoute();
      });
    </script>
