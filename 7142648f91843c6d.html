  <!-- Dynamic JSON-LD Structured Data -->
  

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & LIGHT LUXURY PALETTE (60-30-10 RULE)
       ========================================================================== */
    :root {
      /* 60% Dominant Warm Ivory / Porcelain Canvas */
      --bg-canvas: #FBF9F5;
      --bg-elevated: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-01);
      --bg-subtle: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-02);
      --bg-stone: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-03);
      --bg-champagne: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-04);
      --bg-glass: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-05);

      /* 30% Structural Surfaces, Borders & Typography */
      --text-primary: #1C1917;
      --text-secondary: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-06);
      --text-muted: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-07);
      --border-hairline: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-08);
      --border-strong: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-09);

      /* 10% High-Intent Accent Budget */
      --accent-primary: #8C4A32;       /* Muted Terracotta / Sienna */
      --accent-primary-hover: #733B27;
      --accent-sage: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-10);          /* Botanical Sage */
      --accent-paystack: #09A5DB;      /* Paystack Official Cyan-Blue */
      --accent-paystack-dark: #011B33; /* Paystack Navy */
      --status-success: #2E6F40;
      --status-warning: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-11);
      --status-danger: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-12);

      /* Typography */
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Spacing & Layout */
      --container-max: 1360px;
      --header-h: 64px;
      --bottom-nav-h: 64px;
      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-soft: 0 8px 28px -6px var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-13);
      --shadow-float: 0 20px 44px -12px var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-14);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
      padding-bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 16px));
    }

    @media (min-width: 1024px) {
      body {
        padding-bottom: 0;
      }
    }

    img {
      max-width: 100%;
      display: block;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       2. SCROLL PROGRESS & TOPBAR CONTRACT
       ========================================================================== */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2.5px;
      width: 0%;
      background: var(--accent-primary);
      z-index: 120;
      transition: width 0.08s linear;
    }

    .announcement-bar {
      background: var(--bg-stone);
      color: var(--text-primary);
      font-size: 0.75rem;
      padding: 0.45rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border-hairline);
    }

    .announcement-bar__inner {
      max-width: var(--container-max);
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .announcement-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .currency-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-xs);
      padding: 2px;
      flex-shrink: 0;
    }

    .currency-btn {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      white-space: nowrap;
      transition: background 0.15s var(--ease-out), color 0.15s var(--ease-out);
    }

    .currency-btn.active {
      background: var(--text-primary);
      color: var(--bg-canvas);
    }

    /* Sticky 3-Zone Top Bar Contract */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 90;
      height: var(--header-h);
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-hairline);
      transition: box-shadow 0.2s var(--ease-out), background 0.2s var(--ease-out);
    }

    .site-header.scrolled {
      box-shadow: var(--shadow-soft);
      background: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-15);
    }

    .site-header__inner {
      max-width: var(--container-max);
      height: 100%;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      .site-header__inner {
        padding: 0 2rem;
      }
    }

    .brand-wordmark {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text-primary);
    }

    .primary-nav {
      display: none;
      align-items: center;
      gap: 1.75rem;
    }

    @media (min-width: 1024px) {
      .primary-nav {
        display: flex;
      }
    }

    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      padding: 0.5rem 0;
      position: relative;
      transition: color 0.15s var(--ease-out);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 2px;
      width: 100%;
      height: 1.5px;
      background: var(--text-primary);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.2s var(--ease-out);
    }

    .nav-link:hover, .nav-link.active {
      color: var(--text-primary);
    }

    .nav-link:hover::after, .nav-link.active::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      position: relative;
      transition: background 0.15s var(--ease-out);
    }

    .icon-btn:hover {
      background: var(--bg-subtle);
    }

    .count-indicator {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      margin-left: 0.25rem;
      color: var(--accent-primary);
    }

    /* ==========================================================================
       3. MOBILE BOTTOM TAB BAR & THUMB-ZONE NAVIGATION
       ========================================================================== */
    .mobile-tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-16);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-hairline);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 95;
    }

    @media (min-width: 1024px) {
      .mobile-tab-bar {
        display: none;
      }
    }

    .mobile-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      gap: 2px;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 600;
      white-space: nowrap;
      transition: color 0.15s var(--ease-out), transform 0.15s var(--ease-out);
    }

    .mobile-tab-item:active {
      transform: scale(0.95);
    }

    .mobile-tab-item.active {
      color: var(--accent-primary);
    }

    .mobile-tab-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.85;
    }

    /* ==========================================================================
       4. LAYOUT CONTAINERS, GRIDS, TYPOGRAPHY & BUTTONS
       ========================================================================== */
    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 1rem;
    }

    @media (min-width: 768px) {
      .container {
        padding: 0 2rem;
      }
    }

    .section {
      padding: 3rem 0;
      border-bottom: 1px solid var(--border-hairline);
    }

    @media (min-width: 768px) {
      .section {
        padding: 4.5rem 0;
      }
    }

    .section-header {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 768px) {
      .section-header {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 2.5rem;
      }
    }

    .kicker {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--accent-primary);
    }

    .display-xl {
      font-family: var(--font-display);
      font-size: clamp(2.25rem, 4.2vw, 3.75rem);
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .display-lg {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 3vw, 2.65rem);
      font-weight: 600;
      line-height: 1.15;
      text-wrap: balance;
    }

    .display-md {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 2.2vw, 1.85rem);
      font-weight: 600;
      line-height: 1.2;
    }

    .body-prose {
      color: var(--text-secondary);
      font-size: 0.95rem;
      max-width: 65ch;
      line-height: 1.65;
    }

    .meta-line {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    /* Buttons (Minimum 44px touch target) */
    .btn {
      min-height: 46px;
      padding: 0.65rem 1.35rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: transform 0.15s var(--ease-out), background 0.15s var(--ease-out), border-color 0.15s var(--ease-out);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--text-primary);
      color: var(--bg-canvas);
    }

    .btn-primary:hover {
      background: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-17);
    }

    .btn-accent {
      background: var(--accent-primary);
      color: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-01);
    }

    .btn-accent:hover {
      background: var(--accent-primary-hover);
    }

    .btn-paystack {
      background: var(--accent-paystack-dark);
      color: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-01);
      border: 1px solid var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-18);
    }

    .btn-paystack:hover {
      background: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-19);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
    }

    .btn-outline:hover {
      background: var(--bg-subtle);
    }

    .btn-block {
      width: 100%;
    }

    /* ==========================================================================
       5. HERO, PARALLAX & EDITORIAL SECTIONS
       ========================================================================== */
    .hero-split {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      padding: 1.25rem 0 2.5rem;
      align-items: stretch;
    }

    @media (min-width: 1024px) {
      .hero-split {
        grid-template-columns: 5fr 7fr;
        gap: 2.5rem;
        padding: 2.5rem 0 3.5rem;
      }
    }

    .hero-copy-pane {
      background: var(--bg-subtle);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.75rem;
      border: 1px solid var(--border-hairline);
    }

    @media (min-width: 768px) {
      .hero-copy-pane {
        padding: 2.75rem;
      }
    }

    .hero-media-pane {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      min-height: 340px;
      background: var(--bg-stone);
      border: 1px solid var(--border-hairline);
    }

    @media (min-width: 1024px) {
      .hero-media-pane {
        min-height: 520px;
      }
    }

    .hero-media-pane img {
      width: 100%;
      height: 115%;
      object-fit: cover;
      object-position: center;
      will-change: transform;
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-20) 0%, var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-21) 50%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
      color: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-01);
    }

    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-hairline);
    }

    @media (min-width: 768px) {
      .kpi-strip {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* ==========================================================================
       6. PRODUCT GRID & LUXURY PRODUCT CARDS
       ========================================================================== */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.85rem;
    }

    @media (min-width: 640px) {
      .product-grid {
        gap: 1.25rem;
      }
    }

    @media (min-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.75rem;
      }
    }

    @media (min-width: 1280px) {
      .product-grid--4 {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .product-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }

    .product-card__media {
      position: relative;
      aspect-ratio: 4 / 4.6;
      background: var(--bg-subtle);
      overflow: hidden;
      cursor: pointer;
    }

    .product-card__media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s var(--ease-out);
    }

    .product-card:hover .product-card__media img {
      transform: scale(1.04);
    }

    .product-card__wishlist {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-22);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      color: var(--text-primary);
      transition: transform 0.15s var(--ease-out), background 0.15s var(--ease-out);
    }

    .product-card__wishlist.active {
      color: var(--accent-primary);
    }

    .product-card__body {
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 0.55rem;
    }

    @media (min-width: 768px) {
      .product-card__body {
        padding: 1.1rem;
      }
    }

    .product-card__title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .product-card__title {
        font-size: 1rem;
      }
    }

    .product-card__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.45rem;
      border-top: 1px solid var(--border-hairline);
    }

    .price-group {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .price-current {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .price-compare {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .quick-add-btn {
      min-height: 40px;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-xs);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.15s var(--ease-out), color 0.15s var(--ease-out);
    }

    .quick-add-btn:hover {
      background: var(--text-primary);
      color: var(--bg-canvas);
    }

    /* ==========================================================================
       7. FILTER BAR, SEGMENTED TABS & INPUT CONTROLS
       ========================================================================== */
    .filter-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      padding: 1rem;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 1.75rem;
      border: 1px solid var(--border-hairline);
    }

    .segmented-scroll {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      max-width: 100%;
    }

    .segmented-scroll::-webkit-scrollbar {
      display: none;
    }

    .seg-btn {
      min-height: 40px;
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-xs);
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text-secondary);
      background: transparent;
      transition: background 0.15s var(--ease-out), color 0.15s var(--ease-out);
    }

    .seg-btn.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 1px 4px var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-23);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      min-height: 46px;
      padding: 0.65rem 0.9rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      color: var(--text-primary);
      transition: border-color 0.15s var(--ease-out);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-primary);
      outline: none;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
    }

    /* ==========================================================================
       8. PRODUCT DETAIL SCREEN (PDP) & MOBILE STICKY BUY BAR
       ========================================================================== */
    .pdp-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (min-width: 1024px) {
      .pdp-grid {
        grid-template-columns: 7fr 5fr;
        gap: 3.5rem;
      }
    }

    .pdp-gallery {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .pdp-main-img {
      aspect-ratio: 4 / 4.5;
      background: var(--bg-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-hairline);
    }

    .pdp-main-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pdp-thumbs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.65rem;
    }

    .pdp-thumb {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 2px solid transparent;
      background: var(--bg-subtle);
      cursor: pointer;
    }

    .pdp-thumb.active {
      border-color: var(--accent-primary);
    }

    .pdp-purchase-module {
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    @media (min-width: 1024px) {
      .pdp-purchase-module {
        position: sticky;
        top: calc(var(--header-h) + 1.5rem);
        padding: 2.25rem;
      }
    }

    .mobile-pdp-bar {
      position: fixed;
      bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      background: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-15);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-strong);
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 88;
    }

    @media (min-width: 1024px) {
      .mobile-pdp-bar {
        display: none;
      }
    }

    /* ==========================================================================
       9. PAYSTACK MOBILE-FIRST CHECKOUT & GATEWAY SHEET
       ========================================================================== */
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 1024px) {
      .checkout-layout {
        grid-template-columns: 7fr 5fr;
        gap: 3rem;
      }
    }

    .checkout-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 1.35rem;
      margin-bottom: 1.25rem;
    }

    @media (min-width: 768px) {
      .checkout-card {
        padding: 2rem;
      }
    }

    .paystack-method-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .paystack-method-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .paystack-method-btn {
      min-height: 68px;
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-strong);
      background: var(--bg-canvas);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      text-align: left;
      transition: border-color 0.15s var(--ease-out), background 0.15s var(--ease-out);
    }

    .paystack-method-btn.active {
      border-color: var(--accent-paystack);
      background: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-24);
    }

    /* ==========================================================================
       10. DRAWERS, BOTTOM SHEETS, ACCORDIONS & TOAST
       ========================================================================== */
    .backdrop-overlay {
      position: fixed;
      inset: 0;
      background: var(--theme-atelier-vera-mobile-first-luxury-storefront-paystack-checkout-color-25);
      backdrop-filter: blur(4px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s var(--ease-out);
    }

    .backdrop-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .slide-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      background: var(--bg-canvas);
      z-index: 110;
      transform: translateX(100%);
      transition: transform 0.28s var(--ease-out);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border-hairline);
    }

    .slide-drawer.open {
      transform: translateX(0);
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 90vh;
      background: var(--bg-canvas);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      z-index: 115;
      transform: translateY(100%);
      transition: transform 0.28s var(--ease-out);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow-float);
    }

    @media (min-width: 768px) {
      .bottom-sheet {
        left: 50%;
        bottom: auto;
        top: 50%;
        width: 92%;
        max-width: 560px;
        border-radius: var(--radius-lg);
        transform: translate(-50%, -44%) scale(0.96);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.22s var(--ease-out), opacity 0.22s var(--ease-out);
      }
    }

    .bottom-sheet.open {
      transform: translateY(0);
    }

    @media (min-width: 768px) {
      .bottom-sheet.open {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
        pointer-events: auto;
      }
    }

    .sheet-grabber {
      width: 40px;
      height: 5px;
      background: var(--border-strong);
      border-radius: 999px;
      margin: 0.65rem auto 0.25rem;
      flex-shrink: 0;
    }

    .accordion-item {
      border-bottom: 1px solid var(--border-hairline);
    }

    .accordion-trigger {
      width: 100%;
      min-height: 52px;
      padding: 1rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .accordion-content {
      display: none;
      padding-bottom: 1.15rem;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .accordion-item.open .accordion-content {
      display: block;
    }

    #toast-container {
      position: fixed;
      top: calc(var(--header-h) + 0.75rem);
      right: 1rem;
      z-index: 140;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: calc(100vw - 2rem);
    }

    .toast-msg {
      background: var(--text-primary);
      color: var(--bg-canvas);
      padding: 0.75rem 1.1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-float);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: toastSlideIn 0.2s var(--ease-out);
    }

    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .site-footer {
      background: var(--bg-subtle);
      border-top: 1px solid var(--border-hairline);
      padding: 4rem 0 2.5rem;
      margin-top: 3rem;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.25rem;
    }

    @media (min-width: 768px) {
      .footer-grid {
        grid-template-columns: 2fr 1fr 1fr 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

    function formatPrice(usdAmount) {
      if (state.currency === 'NGN') {
        const ngn = Math.round(usdAmount * NGN_RATE);
        return '₦' + ngn.toLocaleString('en-NG');
      }
      return '$' + Number(usdAmount).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function getProduct(id) {
      return PRODUCTS.find(p => p.id === id) || PRODUCTS[0];
    }

    function getCartTotals() {
      let subtotalUSD = 0;
      let count = 0;
      state.cart.forEach(item => {
        const p = PRODUCTS.find(x => x.id === item.productId);
        if (p) {
          subtotalUSD += p.priceUSD * item.qty;
          count += item.qty;
        }
      });
      const discountUSD = Math.round(subtotalUSD * state.discountRate);
      const freeShipThresholdUSD = 165; // ~₦250,000
      let shippingUSD = 0;
      if (subtotalUSD > 0 && subtotalUSD - discountUSD < freeShipThresholdUSD) {
        shippingUSD = state.deliverySpeed === 'lagos_sameday' ? 18 : (state.deliverySpeed === 'express' ? 14 : 8);
      }
      const totalUSD = Math.max(0, subtotalUSD - discountUSD + shippingUSD);
      return {
        count,
        subtotalUSD,
        discountUSD,
        shippingUSD,
        totalUSD,
        freeShipThresholdUSD,
        qualifiesFreeShip: (subtotalUSD - discountUSD) >= freeShipThresholdUSD
      };
    }

    function getFilteredProducts() {
      const f = state.shopFilter;
      const q = (f.query || '').trim().toLowerCase();
      let list = PRODUCTS.filter(p => {
        if (f.category !== 'all' && p.category !== f.category) return false;
        if (f.onlySale && !p.isOnSale) return false;
        if (p.priceUSD > f.maxPriceUSD) return false;
        if (q) {
          const hay = `${p.title} ${p.material} ${p.origin} ${p.category} ${p.sku} ${p.badge}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (f.sort === 'price-asc') list.sort((a, b) => a.priceUSD - b.priceUSD);
      else if (f.sort === 'price-desc') list.sort((a, b) => b.priceUSD - a.priceUSD);
      else if (f.sort === 'rating') list.sort((a, b) => b.rating - a.rating);
      else if (f.sort === 'newest') list.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));

      return list;
    }

    function launchPaystackGateway(email, customerName, customPubKey) {
      const totals = getCartTotals();
      if (totals.totalUSD <= 0) {
        showToast('Your bag is empty. Add a piece first.');
        return;
      }
      const refCode = 'PSK-AV-' + Math.floor(100000 + Math.random() * 900000);
      const amountNGN = Math.round(totals.totalUSD * NGN_RATE);

      // If user supplied a real Paystack public key AND PaystackPop CDN loaded, invoke Paystack Inline SDK
      if (customPubKey && customPubKey.startsWith('pk_') && window.PaystackPop) {
        try {
          const handler = window.PaystackPop.setup({
            key: customPubKey.trim(),
            email: email || "",
            amount: amountNGN * 100, // Kobo
            currency: 'NGN',
            ref: refCode,
            callback: function(response) {
              completePaystackOrder(response.reference || refCode, 'Paystack Live Inline SDK', customerName);
            },
            onClose: function() {
              showToast('Paystack window closed.');

          handler.openIframe();

            <span style="color:var(--text-secondary);"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></span>
            <span class="tabular-nums" style="font-weight:600;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
          </div>
        </div><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span><div style="display:grid; grid-template-columns:1fr; gap:0.65rem;">
          <button type="button" class="btn btn-paystack btn-block" data-action="confirm-paystack-demo" data-ref="${refCode}" style="min-height:50px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></button>
          <button type="button" class="btn btn-outline btn-block" data-action="close-overlays"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:49%"></span></button>
        </div>
      `);
    }

    function completePaystackOrder(refCode, methodUsed, customerName) {
      const totals = getCartTotals();
      const newOrder = {
        ref: refCode,
        date: '11 Oct 2026 (Just Now)',
        method: `Paystack (${state.checkoutMethod.toUpperCase()})`,
        totalUSD: totals.totalUSD,
        status: 'Confirmed — Verified via Paystack',
        itemsCount: totals.count || 1
      };
      state.orders.unshift(newOrder);
      state.cart = [];
      state.promoCode = '';
      state.discountRate = 0;
      saveState();

      openSheetWithHTML(`
        <div style="text-align:center; padding:1rem 0.5rem;">
          <div style="width:56px; height:56px; border-radius:50%; background:rgba(46,111,64,0.12); color:var(--status-success); display:inline-flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:700; margin-bottom:0.85rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></div>
          <p class="kicker"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:78%"></span></p>
          <h3 class="display-md" style="margin:0.35rem 0 0.5rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:73%"></span></h3>
          <p class="body-prose" style="margin:0 auto 1.25rem; font-size:0.9rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:27%"></span><strong class="tabular-nums"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span><strong class="tabular-nums"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.65rem;">
            <a href="#account" class="btn btn-primary" data-action="close-overlays"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:30%"></span></a>
            <a href="#shop" class="btn btn-outline" data-action="close-overlays"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:46%"></span></a>
          </div>
        </div>
      `);
      handleRoute();
    }

    /* --------------------------------------------------------------------------
       21. GSAP & SCROLLTRIGGER PARALLAX / REVEAL ENGINE
       -------------------------------------------------------------------------- */
    function initGSAPAnimations() {
      const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReduced || typeof window.gsap === 'undefined') return;

      const gsap = window.gsap;
      if (window.ScrollTrigger) {
        gsap.registerPlugin(window.ScrollTrigger);
        window.ScrollTrigger.getAll().forEach(t => t.kill());
      }

      // Hero Entrance Timeline
      const heroText = document.querySelector('.gs-hero-text');
      if (heroText) {
        gsap.fromTo(heroText, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.65, ease: 'power3.out' });
      }

      // Parallax Images on Scroll
      document.querySelectorAll('.gs-parallax-img').forEach(img => {
        if (window.ScrollTrigger) {
          gsap.fromTo(img,
            { yPercent: -6, scale: 1.04 },
            {
              yPercent: 6,
              scale: 1.0,
              ease: 'none',
              scrollTrigger: {
                trigger: img.parentElement,
                start: 'top bottom',
                end: 'bottom top',
                scrub: true
              }
            }
          );
        }
      });

      // Section Heading Reveals
      document.querySelectorAll('.gs-reveal-text').forEach(el => {
        if (window.ScrollTrigger) {
          gsap.fromTo(el,
            { opacity: 0, y: 16 },
            {
              opacity: 1,
              y: 0,
              duration: 0.55,
              ease: 'power2.out',
              scrollTrigger: {
                trigger: el,
                start: 'top 90%'
              }
            }
          );
        }
      });

      // Staggered Product Cards (First 12 visible to keep 60fps mobile performance)
      const cards = Array.from(document.querySelectorAll('.gs-reveal-card')).slice(0, 12);
      if (cards.length > 0) {
        gsap.fromTo(cards,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.42, stagger: 0.04, ease: 'power2.out' }
        );
      }
    }

    /* --------------------------------------------------------------------------
       22. CLIENT-SIDE ROUTER (ALL 14 SCREENS)
       -------------------------------------------------------------------------- */
    function handleRoute() {
      const rawHash = (window.location.hash || '#home').replace(/^#/, '');
      const parts = rawHash.split('/');
      const route = parts[0] || 'home';
      const param = decodeURIComponent(parts.slice(1).join('/'));
      const main = document.getElementById('app-main');
      if (!main) return;

      let html = '';
      if (route === 'home' || route === '') {
        html = renderHome();
      } else if (route === 'shop') {
        html = renderShop();
      } else if (route === 'category') {
        html = renderCategory(param || 'apparel');
      } else if (route === 'product') {
        html = renderProductDetail(param || 'prod-1');
      } else if (route === 'search') {
        html = renderSearch(param);
      } else if (route === 'cart') {
        html = renderCart();
      } else if (route === 'wishlist') {
        html = renderWishlist();
      } else if (route === 'deals') {
        html = renderDeals();
      } else if (route === 'about') {
        html = renderAbout();
      } else if (route === 'contact') {
        html = renderContact();
      } else if (route === 'account') {
        html = renderAccount();
      } else if (route === 'checkout') {
        html = renderCheckout();
      } else if (route === 'policies') {
        html = renderPolicies();
      } else {
        html = renderNotFound(rawHash);
      }

      main.innerHTML = html;

      // Sync Active States on Header & Mobile Bottom Tab Bar
      document.querySelectorAll('.nav-link[data-nav]').forEach(link => {
        link.classList.toggle('active', link.getAttribute('data-nav') === route);
      });
      document.querySelectorAll('.mobile-tab-item[data-mob-nav]').forEach(tab => {
        tab.classList.toggle('active', tab.getAttribute('data-mob-nav') === route);
      });

      updateHeaderCounts();
      renderCartDrawer();
      window.scrollTo({ top: 0, behavior: 'auto' });
      requestAnimationFrame(() => initGSAPAnimations());
    }

    /* --------------------------------------------------------------------------
       23. UNIFIED EVENT DELEGATION & FORM HANDLERS
       -------------------------------------------------------------------------- */
    document.addEventListener('click', function(e) {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');

      if (action === 'set-currency') {
        state.currency = target.getAttribute('data-currency') || 'NGN';
        saveState();
        handleRoute();
        showToast(`Currency switched to ${state.currency}`);
      } else if (action === 'open-cart-drawer') {
        renderCartDrawer();
        document.getElementById('global-backdrop')?.classList.add('open');
        document.getElementById('cart-drawer')?.classList.add('open');
      } else if (action === 'open-mobile-menu') {
        document.getElementById('global-backdrop')?.classList.add('open');
        const mobNav = document.getElementById('mobile-nav-drawer');
        if (mobNav) mobNav.style.transform = 'translateX(0)';
      } else if (action === 'open-search') {
        openSearchSheet();
      } else if (action === 'close-overlays') {
        closeAllOverlays();
      } else if (action === 'scroll-top') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'nav-product') {
        const id = target.getAttribute('data-id');
        if (id) window.location.hash = `#product/${id}`;
      } else if (action === 'quick-view') {
        const id = target.getAttribute('data-id');
        if (id) openQuickView(id);
      } else if (action === 'quick-add') {
        const id = target.getAttribute('data-id');
        const p = getProduct(id);
        const existing = state.cart.find(x => x.productId === p.id && x.size === p.sizes[0] && x.color === p.colors[0]);
        if (existing) existing.qty += 1;
        else state.cart.push({ productId: p.id, qty: 1, size: p.sizes[0], color: p.colors[0] });
        saveState();
        renderCartDrawer();
        closeAllOverlays();
        showToast(`${p.title} added to bag`);
      } else if (action === 'toggle-wishlist') {
        const id = target.getAttribute('data-id');
        if (!id) return;
        const idx = state.wishlist.indexOf(id);
        const p = getProduct(id);
        if (idx >= 0) {
          state.wishlist.splice(idx, 1);
          showToast(`Removed ${p.title} from wishlist`);
        } else {
          state.wishlist.push(id);
          showToast(`Saved ${p.title} to wishlist`);
        }
        saveState();
        handleRoute();
      } else if (action === 'cart-qty-delta') {
        const idx = Number(target.getAttribute('data-idx'));
        const delta = Number(target.getAttribute('data-delta'));
        if (state.cart[idx]) {
          state.cart[idx].qty += delta;
          if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
          saveState();
          renderCartDrawer();
          if (window.location.hash.startsWith('#cart') || window.location.hash.startsWith('#checkout')) handleRoute();
        }
      } else if (action === 'remove-cart-idx') {
        const idx = Number(target.getAttribute('data-idx'));
        if (state.cart[idx]) {
          state.cart.splice(idx, 1);
          saveState();
          renderCartDrawer();
          if (window.location.hash.startsWith('#cart') || window.location.hash.startsWith('#checkout')) handleRoute();
        }
      } else if (action === 'move-cart-to-wish') {
        const idx = Number(target.getAttribute('data-idx'));
        const item = state.cart[idx];
        if (item) {
          if (!state.wishlist.includes(item.productId)) state.wishlist.push(item.productId);
          state.cart.splice(idx, 1);
          saveState();
          handleRoute();
          showToast('Moved piece to your saved wishlist');
        }
      } else if (action === 'move-all-wish-to-cart') {
        state.wishlist.forEach(id => {
          const p = getProduct(id);
          const ex = state.cart.find(x => x.productId === p.id);
          if (ex) ex.qty += 1;
          else state.cart.push({ productId: p.id, qty: 1, size: p.sizes[0], color: p.colors[0] });
        });
        state.wishlist = [];
        saveState();
        window.location.hash = '#cart';
        showToast('Moved all saved pieces to your bag');
      } else if (action === 'set-shop-cat') {
        state.shopFilter.category = target.getAttribute('data-cat') || 'all';
        state.shopFilter.visibleCount = 24;
        saveState();
        handleRoute();
      } else if (action === 'load-more-shop') {
        state.shopFilter.visibleCount += 24;
        handleRoute();
      } else if (action === 'reset-shop-filters') {
        state.shopFilter = { query: '', category: 'all', sort: 'featured', maxPriceUSD: 1500, onlySale: false, visibleCount: 24 };
        saveState();
        handleRoute();
      } else if (action === 'clear-search') {
        state.shopFilter.query = '';
        saveState();
        handleRoute();
      } else if (action === 'quick-search-term') {
        state.shopFilter.query = target.getAttribute('data-term') || '';
        saveState();
        handleRoute();
      } else if (action === 'pdp-select-img') {
        activePdpState.imgIndex = Number(target.getAttribute('data-idx')) || 0;
        handleRoute();
      } else if (action === 'pdp-select-color') {
        activePdpState.color = target.getAttribute('data-color') || '';
        handleRoute();
      } else if (action === 'pdp-select-size') {
        activePdpState.size = target.getAttribute('data-size') || '';
        handleRoute();
      } else if (action === 'pdp-qty') {
        const delta = Number(target.getAttribute('data-delta')) || 0;
        activePdpState.qty = Math.max(1, activePdpState.qty + delta);
        handleRoute();
      } else if (action === 'pdp-add-to-cart') {
        const p = getProduct(activePdpState.productId);
        const ex = state.cart.find(x => x.productId === p.id && x.size === activePdpState.size && x.color === activePdpState.color);
        if (ex) ex.qty += activePdpState.qty;
        else state.cart.push({ productId: p.id, qty: activePdpState.qty, size: activePdpState.size, color: activePdpState.color });
        saveState();
        renderCartDrawer();
        showToast(`Added ${activePdpState.qty} × ${p.title} to bag`);
      } else if (action === 'pdp-buy-now-paystack') {
        const p = getProduct(activePdpState.productId);
        const ex = state.cart.find(x => x.productId === p.id && x.size === activePdpState.size && x.color === activePdpState.color);
        if (!ex) {
          state.cart.push({ productId: p.id, qty: activePdpState.qty, size: activePdpState.size, color: activePdpState.color });
          saveState();
        }
        window.location.hash = '#checkout';
      } else if (action === 'toggle-accordion') {
        const item = target.closest('.accordion-item');
        if (item) item.classList.toggle('open');
      } else if (action === 'apply-promo-quick') {
        const code = (target.getAttribute('data-code') || '').toUpperCase();
        state.promoCode = code;
        state.discountRate = code === 'LAGOSVIP' ? 0.20 : 0.15;
        saveState();
        showToast(`Activated privilege code ${code} (${Math.round(state.discountRate * 100)}% Off)`);
      } else if (action === 'set-delivery-speed') {
        state.deliverySpeed = target.getAttribute('data-speed') || 'express';
        saveState();
        handleRoute();
      } else if (action === 'set-paystack-method') {
        state.checkoutMethod = target.getAttribute('data-method') || 'card';
        saveState();
        handleRoute();
      } else if (action === 'confirm-paystack-demo') {
        const ref = target.getAttribute('data-ref') || 'PSK-AV-901244';
        const cname = target.getAttribute('data-name') || 'Valued Client';
        completePaystackOrder(ref, 'Paystack Mobile Gateway', cname);
      } else if (action === 'demo-register') {
        const fb = document.getElementById('account-feedback');
        if (fb) fb.textContent = '✓ Client profile created in browser session. Your Paystack order ledger is synced.';
        showToast('Client profile registered');
      } else if (action === 'carousel-scroll') {
        const dir = Number(target.getAttribute('data-dir')) || 1;
        const track = document.getElementById('home-carousel');
        if (track) track.scrollBy({ left: dir * 320, behavior: 'smooth' });
      }
    });

    // Input & Change Listeners for Shop Filters
    document.addEventListener('input', function(e) {
      if (e.target.id === 'shop-search-input') {
        state.shopFilter.query = e.target.value;
        state.shopFilter.visibleCount = 24;
        handleRoute();
        const input = document.getElementById('shop-search-input');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      } else if (e.target.id === 'shop-price-range') {
        state.shopFilter.maxPriceUSD = Number(e.target.value) || 1500;
        handleRoute();
      }
    });

    document.addEventListener('change', function(e) {
      if (e.target.id === 'shop-sale-toggle') {
        state.shopFilter.onlySale = e.target.checked;
        handleRoute();
      } else if (e.target.id === 'shop-sort-select') {
        state.shopFilter.sort = e.target.value;
        handleRoute();
      }
    });

    // Form Submissions (Search, Promo, Checkout, Reviews, Concierge, Newsletter)
    document.addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;

      if (form.id === 'sheet-search-form') {
        const q = document.getElementById('sheet-search-input')?.value || '';
        state.shopFilter.query = q;
        closeAllOverlays();
        window.location.hash = `#search/${encodeURIComponent(q)}`;
      } else if (form.id === 'dedicated-search-form') {
        const q = document.getElementById('dedicated-search-input')?.value || '';
        state.shopFilter.query = q;
        handleRoute();
      } else if (form.id === 'cart-promo-form') {
        const raw = (document.getElementById('cart-promo-input')?.value || '').trim().toUpperCase();
        if (raw === 'ATELIER15') {
          state.promoCode = 'ATELIER15';
          state.discountRate = 0.15;
          showToast('Applied ATELIER15 (15% Privilege)');
        } else if (raw === 'LAGOSVIP') {
          state.promoCode = 'LAGOSVIP';
          state.discountRate = 0.20;
          showToast('Applied LAGOSVIP (20% VIP Privilege)');
        } else {
          state.promoCode = '';
          state.discountRate = 0;
          showToast('Try code ATELIER15 or LAGOSVIP');
        }
        saveState();
        handleRoute();
      } else if (form.id === 'paystack-checkout-form') {
        const name = document.getElementById('chk-name')?.value || 'Valued Client';
        const email = document.getElementById('chk-email')?.value || "";
        const pubKey = document.getElementById('chk-paystack-key')?.value || '';
        launchPaystackGateway(email, name, pubKey);
      } else if (form.id === 'pdp-review-form') {
        const pid = form.getAttribute('data-product-id');
        const author = form.elements.author.value.trim();
        const rating = Number(form.elements.rating.value) || 5;
        const text = form.elements.text.value.trim();
        if (pid && author && text) {
          if (!state.userReviews[pid]) state.userReviews[pid] = [];
          state.userReviews[pid].unshift({ author, date: 'Just now', rating, text });
          saveState();
          handleRoute();
          showToast('Your review has been added');
        }
      } else if (form.id === 'concierge-contact-form') {
        const fb = document.getElementById('contact-form-feedback');
        if (fb) fb.textContent = '✓ Concierge dispatch logged. An advisor will reply within 2 hours.';
        form.reset();
        showToast('Concierge inquiry sent');
      } else if (form.id === 'account-auth-form') {
        const fb = document.getElementById('account-feedback');
        if (fb) fb.textContent = '✓ Signed in to local demonstration profile.';
        showToast('Signed in successfully');
      } else if (form.id === 'footer-newsletter-form') {
        const fb = document.getElementById('footer-news-feedback');
        if (fb) fb.textContent = '✓ Subscribed to Private Archive dispatches. Use code ATELIER15 for 15% off.';
        form.reset();
        showToast('Subscribed to Atelier Véra Archive');
      }
    });

    // Scroll Progress & Sticky Header Shadow
    window.addEventListener('scroll', function() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const docHeight = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const pct = Math.min(100, Math.max(0, (scrollTop / docHeight) * 100));
      const bar = document.getElementById('scroll-progress');
      if (bar) bar.style.width = pct + '%';

      const hdr = document.getElementById('site-header');
      if (hdr) hdr.classList.toggle('scrolled', scrollTop > 16);
    }, { passive: true });

    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', handleRoute);
    if (document.readyState !== 'loading') {
      handleRoute();
    }
  })();
  </script>
