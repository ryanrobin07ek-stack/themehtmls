<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertex — Visual Engineering Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" width="20" height="20"><path d="M3 3l9 18 9-18-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span class="brand-name">Vertex</span>
    </div>
    <div class="doc-info">
      <input id="docName" class="doc-name" value="Untitled" aria-label="Document name">
      <span id="saveStatus" class="save-status">Saved locally</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" data-cmd="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 14L4 9l5-5M4 9h11a5 5 0 010 10h-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon-btn" data-cmd="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 14l5-5-5-5M20 9H9a5 5 0 000 10h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="vdiv"></div>
      <button class="icon-btn" data-cmd="zoomOut" title="Zoom out (−)">−</button>
      <button class="zoom-label" id="zoomLabel" title="Reset zoom">100%</button>
      <button class="icon-btn" data-cmd="zoomIn" title="Zoom in (+)">+</button>
      <button class="icon-btn" data-cmd="fit" title="Fit to content (Shift+1)"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="vdiv"></div>
      <button class="icon-btn" data-cmd="theme" title="Toggle theme"><svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" data-cmd="help" title="Help & shortcuts"><svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 3.5M12 16.5v.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="primary-btn" data-cmd="export"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 3v12M7 8l5-5 5 5M4 20h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Export</button>
    </div>
  </header>

  <aside class="toolrail">
    <button class="tool active" data-tool="select" title="Select (V)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 3l7 18 2-7 7-2-16-9z" fill="currentColor"/></svg></button>
    <button class="tool" data-tool="pan" title="Pan (H)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 11V5a2 2 0 014 0v6M12 11V4a2 2 0 014 0v7M16 11V6a2 2 0 014 0v10a6 6 0 01-6 6h-2a6 6 0 01-5-3l-3-5a2 2 0 013-3l2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="tool" data-tool="connector" title="Connector (C)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 19l14-14M15 5h4v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 5h14M12 5v14M9 19h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="tool" data-tool="table" title="Table"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="4" width="18" height="16" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M3 14h18M9 4v16M15 4v16" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button class="tool" data-tool="frame" title="Frame (F)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 4v16M19 4v16M4 5h16M4 19h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="tool-spacer"></div>
    <button class="tool" data-cmd="command" title="Command palette (Ctrl+K)"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </aside>

  <aside class="leftpanel" id="leftPanel">
    <div class="panel-tabs">
      <button class="panel-tab active" data-tab="shapes">Shapes</button>
      <button class="panel-tab" data-tab="layers">Layers</button>
      <button class="panel-tab" data-tab="templates">Templates</button>
    </div>
    <div class="panel-body">
      <div class="panel-view active" data-view="shapes">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="shapeSearch" placeholder="Search shapes" aria-label="Search shapes">
        </div>
        <div id="shapeLibrary" class="shape-library"></div>
      </div>
      <div class="panel-view" data-view="layers"><div id="layerList" class="layer-list"></div></div>
      <div class="panel-view" data-view="templates"><div id="templateList" class="template-list"></div></div>
    </div>
  </aside>

  <main class="canvas-area" id="canvasArea">
    <svg id="svg" class="canvas-svg" xmlns="http://www.w3.org/2000/svg">
      <g id="world"></g>
      <g id="overlay"></g>
    </svg>
    <div id="textEditor" class="text-editor" hidden><textarea id="textEditorInput" spellcheck="false"></textarea></div>
  </main>

  <aside class="rightpanel" id="rightPanel">
    <div class="panel-header">
      <span id="inspectorTitle">Properties</span>
      <button class="icon-btn small" id="closeInspector" title="Close"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div class="panel-body" id="inspectorBody"></div>
  </aside>

  <footer class="statusbar">
    <div class="status-left">
      <span id="statusTool">Select</span>
      <span class="vdiv"></span>
      <span id="statusSelection">No selection</span>
      <span class="vdiv"></span>
      <span id="statusCoords">0, 0</span>
    </div>
    <div class="status-right">
      <button class="status-btn active" id="gridToggle">Grid</button>
      <button class="status-btn active" id="snapToggle">Snap</button>
      <span class="vdiv"></span>
      <span id="statusZoom">100%</span>
    </div>
  </footer>
</div>

<div id="modalRoot"></div>
<script src="script.js"></script>
</body>
</html>
