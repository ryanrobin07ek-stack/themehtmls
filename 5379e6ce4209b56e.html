  <style>
    :root {
      --bg-obsidian: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-01);

      --accent-copper: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-05);
      --accent-safety: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-06);
      --border-subtle: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg-obsidian);
      color: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-04);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      overflow-x: hidden;
      min-height: 100vh;
      background: radial-gradient(circle at 85% 10%, var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-08), transparent 45%),
                  radial-gradient(circle at 15% 40%, var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-09), transparent 55%),
                  var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-01);
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .balance-text {
      text-wrap: balance;
    }

    /* Architectural Slanted & Curved Structural Geometry */
    .slant-hero-clip {
      clip-path: polygon(0 0, 100% 0, 100% 93%, 0 100%);
    }
    .slant-section-top {
      clip-path: polygon(0 4%, 100% 0, 100% 100%, 0 100%);
    }
    .slant-card-cut {
      clip-path: polygon(0 0, 94% 0, 100% 14%, 100% 100%, 0 100%);
    }
    .curved-arch-mask {
      border-radius: 180px 180px 12px 12px;
    }
    .blueprint-grid {
      background-image: 
        linear-gradient(to right, var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-10) 1px, transparent 1px),
        linear-gradient(to bottom, var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-10) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    .limestone-sheet {
      background-color: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-04);
      color: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-02);
    }

    /* Fallback image styling for Zero-Broken-Image Policy */
    .img-fallback-shell {
      position: relative;
      background: linear-gradient(135deg, var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-03) 0%, var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-11) 55%, var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-12) 100%);
      overflow: hidden;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-01);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-13);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-kifaru-build-kenyan-hardware-construction-supply-superstore-color-05);
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

<body class="antialiased selection:bg-copper selection:text-white">

      <a href="#calculators" onclick="app.navigate('calculators'); return false;" data-nav="calculators" class="nav-link hover:text-limestone hover:underline underline-offset-8 decoration-copper transition-colors whitespace-nowrap shrink-0"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 30%;"></span></a>
      <a href="#boq" onclick="app.navigate('boq'); return false;" data-nav="boq" class="nav-link hover:text-limestone hover:underline underline-offset-8 decoration-copper transition-colors whitespace-nowrap shrink-0"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 27%;"></span></a>

      <a href="#trade" onclick="app.navigate('trade'); return false;" data-nav="trade" class="nav-link hover:text-limestone hover:underline underline-offset-8 decoration-copper transition-colors whitespace-nowrap shrink-0"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 32%;"></span></a>

        ],
        compute(v) {
          const wet = Math.max(0.01, Number(v.length) * Number(v.width) * Number(v.depth));
          const wasteFactor = 1 + (Number(v.waste) || 0) / 100;
          const dry = wet * 1.54 * wasteFactor;
          const ratioStr = String(v.mix).split(" ")[0];
          const parts = ratioStr.split(":").map(Number);
          const sum = parts[0] + parts[1] + parts[2];
          const cementM3 = (parts[0] / sum) * dry;
          const cementBags = Math.ceil(cementM3 / 0.0347); // 1 bag 50kg cement ≈ 0.0347 m³
          const sandTonnes = Number(((parts[1] / sum) * dry * 1.6).toFixed(2));
          const ballastTonnes = Number(((parts[2] / sum) * dry * 1.55).toFixed(2));
          return {
            headline: `${cementBags} Bags (50kg) · ${sandTonnes}T Sand · ${ballastTonnes}T Ballast`,
            metrics: [

      // Shopping Cart & Mixed-Fulfillment Logic
      addToCart(sku, qtyInput = 1, variant = null) {
        const product = this.getProduct(sku);
        const qty = Math.max(product.minQty, Number(qtyInput) || product.minQty);
        const chosenVariant = variant || product.variants[0];
        const existing = this.state.cart.find(i => i.sku === sku && i.variant === chosenVariant);
        if (existing) {
          existing.qty = Math.min(product.stock, existing.qty + qty);
        } else {
          this.state.cart.push({ sku, qty: Math.min(product.stock, qty), variant: chosenVariant });
        }
        this.persistState();
        this.updateCartBadges();
        this.renderCartDrawer();
        this.toast(`Added ${qty} × ${product.name} (${product.unit}) to Site Order Bag`);
      },

      updateCartQty(index, newQty) {
        const item = this.state.cart[index];
        if (!item) return;
        const product = this.getProduct(item.sku);
        const parsed = parseInt(newQty, 10);
        if (isNaN(parsed) || parsed <= 0) {
          this.state.cart.splice(index, 1);
        } else {
          item.qty = Math.max(product.minQty, Math.min(product.stock, parsed));
        }
        this.persistState();
        this.updateCartBadges();
        this.renderCartDrawer();
        if (this.state.view === "cart" || this.state.view === "checkout") {
          this.renderCurrentView();
        }
      },

      calculateCartSummary() {
        const zone = KENYA_ZONES[this.state.deliveryZone] || KENYA_ZONES["Nairobi"];
        let subtotal = 0;
        let totalWeightKg = 0;
        let heavyItemsCount = 0;
        let parcelItemsCount = 0;

        const lines = this.state.cart.map((item, idx) => {
          const product = this.getProduct(item.sku);
          const unitPrice = this.getEffectivePrice(product, item.qty);
          const lineTotal = unitPrice * item.qty;
          const lineWeight = product.weightKg * item.qty;
          subtotal += lineTotal;
          totalWeightKg += lineWeight;
          if (product.heavy) heavyItemsCount++;
          else parcelItemsCount++;
          return { ...item, idx, product, unitPrice, lineTotal, lineWeight };
        });

        // Separate fulfillment logic for heavy lorry freight vs standard courier parcel
        let lorryTransport = 0;
        let vehicleRecommended = "Customer Yard Collection / Rider Parcel";
        if (heavyItemsCount > 0 || totalWeightKg > 80) {
          if (totalWeightKg <= 1200) {
            lorryTransport = zone.pickupFee;
            vehicleRecommended = "1.5-Tonne Single-Cab Site Pickup";
          } else if (totalWeightKg <= 5000) {
            lorryTransport = zone.canter5T;
            vehicleRecommended = "5-Tonne Flatbed Canter Lorry";
          } else if (totalWeightKg <= 10500) {
            lorryTransport = zone.lorry10T;
            vehicleRecommended = "10-Tonne Rigid Flatbed Lorry";
          } else {
            const loads = Math.ceil(totalWeightKg / 18000);
            lorryTransport = zone.tipper18T * loads;
            vehicleRecommended = `${loads} × 18-Tonne Heavy Tipper / Flatbed Lorry`;
          }
        }
        const parcelFee = parcelItemsCount > 0 ? zone.parcelFee : 0;
        const transportTotal = lorryTransport + parcelFee;
        const grandTotal = subtotal + transportTotal;
        const vatComponent = Math.round(subtotal - (subtotal / 1.16)); // 16% Kenyan VAT inclusive extraction

        return {
          lines,
          subtotal,
          totalWeightKg,
          heavyItemsCount,
          parcelItemsCount,
          lorryTransport,
          parcelFee,
          transportTotal,
          vehicleRecommended,
          vatComponent,
          grandTotal,
          zone
        };
      },

        const product = this.getProduct(sku);

        this.state.boqItems.push({
          id: "boq-" + Date.now() + "-" + Math.floor(Math.random() * 999),
          sku: product.sku,
          desc: product.name,
          dept: product.dept,
          unit: product.unit,

          waste: 5,

        });

      pushCalcToBoq(calcId) {
        const calc = MATERIAL_CALCULATORS.find(c => c.id === calcId);
        if (!calc) return;
        const vals = this.state.calcValues[calcId] || {};
        const res = calc.compute(vals);
        res.boqItems.forEach(item => {
          const p = this.getProduct(item.sku);
          this.state.boqItems.push({
            id: "boq-" + Date.now() + "-" + Math.floor(Math.random() * 999),
            sku: p.sku,
            desc: p.name,
            dept: p.dept,
            unit: p.unit,
            qty: item.qty,
            waste: 0,
            unitPrice: this.getEffectivePrice(p, item.qty),
            note: item.note,
            status: "System-Calculated Estimate"
          });
        });
        this.persistState();
        this.toast(`Pushed ${res.boqItems.length} calculated line items to BOQ Takeoff Studio`);
        this.navigate("boq");
      },

      exportBoqCsv() {
        const headers = ["Line", "SKU", "Department", "Description", "Unit", "Net_Qty", "Waste_Pct", "Gross_Qty", "Est_Unit_KSh", "Line_Total_KSh", "Estimate_Status", "Notes"];
        const rows = this.state.boqItems.map((it, i) => {
          const gross = Math.ceil(it.qty * (1 + (Number(it.waste) || 0) / 100));
          const total = gross * it.unitPrice;
          return [
            i + 1,
            it.sku,
            it.dept,
            `"${String(it.desc).replace(/"/g, '""')}"`,
            `"${it.unit}"`,
            it.qty,
            it.waste,
            gross,
            it.unitPrice,
            total,
            `"${it.status}"`,
            `"${String(it.note || "").replace(/"/g, '""')}"`
          ].join(",");
        });
        const csvContent = [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `KIFARU_BOQ_${this.state.boqProjectName.replace(/[^a-z0-9]/gi, "_").slice(0, 30)}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        this.toast("Exported structured BOQ CSV spreadsheet");
      },

      // VIEW 4 & 5: PRODUCT SEARCH, MULTI-FACET FILTERING & PAGINATION
      renderSearchView() {
        const q = String(this.state.searchQuery || "").trim().toLowerCase();
        let results = CATALOG_PRODUCTS.filter(p => {
          if (this.state.filterDept !== "ALL" && p.dept !== this.state.filterDept) return false;
          if (this.state.filterBrand !== "ALL" && p.brand !== this.state.filterBrand) return false;
          if (this.getEffectivePrice(p, 1) > this.state.filterMaxPrice) return false;
          if (!q) return true;
          const haystack = `${p.sku} ${p.name} ${p.sub} ${p.brand} ${p.unit} ${p.synonyms} ${JSON.stringify(p.specs)}`.toLowerCase();
          return q.split(/\s+/).every(token => haystack.includes(token));
        });

        if (this.state.sortBy === "price-asc") {
          results.sort((a, b) => this.getEffectivePrice(a, 1) - this.getEffectivePrice(b, 1));
        } else if (this.state.sortBy === "price-desc") {
          results.sort((a, b) => this.getEffectivePrice(b, 1) - this.getEffectivePrice(a, 1));
        } else if (this.state.sortBy === "stock") {
          results.sort((a, b) => b.stock - a.stock);
        }

        const totalPages = Math.max(1, Math.ceil(results.length / this.state.pageSize));
        const page = Math.min(totalPages, Math.max(1, this.state.catalogPage));

        if (!this.state.boqItems[idx]) return;

      importPastedBoqLines() {
        const box = document.getElementById("boq-paste-box");
        if (!box || !box.value.trim()) {
          this.toast("Paste at least one line (e.g., KB-A01, 100, Substructure)");
          return;
        }
        const lines = box.value.trim().split(/\r?\n/);
        let added = 0;
        lines.forEach(line => {
          const parts = line.split(/[,\t]/).map(s => s.trim());
          if (parts.length >= 1 && parts[0]) {
            const query = parts[0].toUpperCase();
            const match = CATALOG_PRODUCTS.find(p => p.sku === query || p.name.toUpperCase().includes(query));
            const prod = match || CATALOG_PRODUCTS[0];
            const qty = parseInt(parts[1], 10) || 20;
            const note = parts[2] || `Imported from QS paste (${parts[0]})`;
            this.state.boqItems.push({
              id: "boq-" + Date.now() + "-" + Math.floor(Math.random() * 9999),
              sku: prod.sku,
              desc: prod.name,
              dept: prod.dept,
              unit: prod.unit,
              qty,
              waste: 5,
              unitPrice: this.getEffectivePrice(prod, qty),
              note,
              status: "Customer-Entered Estimate"
            });
            added++;
          }
        });
        this.persistState();
        this.toast(`Parsed & appended ${added} line item(s) into your BOQ Schedule`);
        this.renderCurrentView();
      },

      // Hero Live Search Preview & Quick Helpers
      handleHeroSearchPreview(val) {
        this.state.searchQuery = val;
        const box = document.getElementById("hero-search-suggestions");
        if (!box) return;
        const q = (val || "").trim().toLowerCase();
        if (!q) {
          box.classList.add("hidden");
          box.innerHTML = "";
          return;
        }
        const matches = CATALOG_PRODUCTS.filter(p =>
          p.name.toLowerCase().includes(q) ||
          p.sku.toLowerCase().includes(q) ||
          p.sub.toLowerCase().includes(q) ||
          (p.synonyms && p.synonyms.toLowerCase().includes(q))
        ).slice(0, 5);

        box.classList.remove("hidden");
        box.innerHTML = matches.length ? matches.map(m => `
          <div class="flex items-center justify-between text-xs py-1.5 px-2 rounded hover:bg-white/5">
            <button type="button" onclick="app.openProduct('${m.sku}')" class="text-left text-limestone hover:text-copper">

      // GSAP ScrollTrigger & SplitType Motion Choreography (Guarded for Reduced Motion)
      initGsapAnimations() {
        const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduced || typeof gsap === "undefined") return;
        try {
          if (typeof ScrollTrigger !== "undefined") {
            gsap.registerPlugin(ScrollTrigger);
          }
          const heroTitle = document.querySelector(".gsap-hero-title");
          if (heroTitle && !heroTitle.dataset.animated) {
            heroTitle.dataset.animated = "true";
            if (typeof SplitType !== "undefined") {
              const split = new SplitType(heroTitle, { types: "words" });
              gsap.from(split.words, {
                y: 24,
                opacity: 0,
                stagger: 0.04,
                duration: 0.55,
                ease: "power3.out"
              });
            }
          }
        } catch (err) {
