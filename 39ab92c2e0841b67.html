<html lang="en" data-eshop-skeleton-preview=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="">

  <!-- Google Fonts: Outfit (Punchy Editorial Display) and Plus Jakarta Sans (Clean Modern Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

  <!-- GSAP & ScrollTrigger for fluid animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ==========================================================================
       1. CSS RESET & DESIGN TOKENS
       ========================================================================== */
    :root {
      --color-red: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-01);
      --color-red-hover: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-02);
      --color-red-subtle: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-03);
      --color-cream: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-04);
      --color-cream-card: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-05);
      --color-grey-cream: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-06);
      --color-grey-border: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-07);
      --color-green: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-08);
      --color-green-light: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-09);
      --color-orange: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-10);
      --color-orange-light: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-11);
      --color-charcoal: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-12);
      --color-charcoal-muted: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-13);
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 6px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-14);
      --shadow-md: 0 8px 24px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-15);
      --shadow-lg: 0 16px 40px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-16);
      --shadow-food: 0 24px 50px -10px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-17);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--color-cream);
      color: var(--color-charcoal);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.55;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      transition: var(--transition);
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: var(--transition);
    }

    /* Container Utility */
    .container {
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Typography */
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display);
      font-weight: 800;
      line-height: 1.15;
      color: var(--color-charcoal);
      letter-spacing: -0.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-red { background: var(--color-red-subtle); color: var(--color-red); }
    .badge-green { background: var(--color-green-light); color: var(--color-green); }
    .badge-orange { background: var(--color-orange-light); color: var(--color-orange); }
    .badge-dark { background: var(--color-charcoal); color: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-18); }

    /* Button Styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-weight: 700;
      font-size: 15px;
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: var(--color-red);
      color: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-05);
      box-shadow: 0 8px 20px -4px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-19);
    }

    .btn-primary:hover {
      background-color: var(--color-red-hover);
      box-shadow: 0 10px 24px -4px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-20);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-05);
      color: var(--color-charcoal);
      border: 1.5px solid var(--color-grey-border);
    }

    .btn-secondary:hover {
      background-color: var(--color-grey-cream);
      border-color: var(--color-charcoal);
    }

    .btn-sm {
      padding: 8px 16px;
      font-size: 13px;
    }

    /* ==========================================================================
       2. TOP BAR & HANGING CRESCENT ORNAMENTS
       ========================================================================== */
    .top-announcement {
      background-color: var(--color-charcoal);
      color: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-05);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 0;
      text-align: center;
      position: relative;
      z-index: 40;
    }

    .top-announcement .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-badge-group {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }

    /* Hanging Crescent Moon and Stars Sway Animation */
    .hanging-ornaments {
      position: absolute;
      top: 0;
      right: 40px;
      display: flex;
      gap: 22px;
      pointer-events: none;
      z-index: 35;
    }

    .ornament {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: gentleSway 5s ease-in-out infinite alternate;
    }

    .ornament-line {
      width: 1px;
      background: linear-gradient(to bottom, var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-21), var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-22));
    }

    .ornament-1 { animation-duration: 4.8s; }
    .ornament-2 { animation-duration: 6.2s; animation-delay: 0.5s; }
    .ornament-3 { animation-duration: 5.4s; animation-delay: 1.2s; }

    @keyframes gentleSway {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(5deg); }
    }

    /* ==========================================================================
       3. SITE HEADER & NAVIGATION
       ========================================================================== */
    .header {
      position: sticky;
      top: 0;
      background-color: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-23);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-24);
      z-index: 100;
      transition: var(--transition);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      background: var(--color-red);
      color: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-18);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 22px;
      box-shadow: 0 4px 12px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-25);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .brand-name span {
      color: var(--color-red);
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-charcoal-muted);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-link {
      font-weight: 600;
      font-size: 14.5px;
      color: var(--color-charcoal);
      padding: 6px 0;
      position: relative;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--color-red);
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2.5px;
      background: var(--color-red);
      border-radius: var(--radius-full);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-btn {
      position: relative;
      background: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-05);
      border: 1.5px solid var(--color-grey-border);
      border-radius: var(--radius-full);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--color-charcoal);
    }

    .cart-btn:hover {
      border-color: var(--color-red);
      color: var(--color-red);
    }

    .cart-count {
      background: var(--color-red);
      color: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-18);
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    .mobile-menu-btn {
      display: none;
      padding: 8px;
      color: var(--color-charcoal);
    }

    /* ==========================================================================
       4. HERO SECTION (REFERENCE COMPOSITION: LEFT TEXT, RIGHT FLOATING FOOD)
       ========================================================================== */
    .hero {
      position: relative;
      padding: 40px 0 60px;
      overflow: hidden;
      background: linear-gradient(180deg, var(--color-cream) 0%, var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-26) 100%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      align-items: center;
      gap: 50px;
      position: relative;
      z-index: 10;
    }

    .hero-left {
      max-width: 580px;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-05);
      border: 1px solid var(--color-grey-border);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-red);
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .hero-title {
      font-size: 58px;
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 20px;
      letter-spacing: -0.03em;
    }

    .hero-title span.accent-red {
      color: var(--color-red);
    }

    .hero-subtitle {
      font-size: 18px;
      color: var(--color-charcoal-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }

    .hero-service-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding-top: 24px;
      border-top: 1px solid var(--color-grey-border);
      flex-wrap: wrap;
    }

    .service-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--color-charcoal);
    }

    .service-pill i {
      color: var(--color-green);
    }

    /* Hero Right: Floating Food Plate (NO big square box!) */
    .hero-right {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 480px;
    }

    .plate-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .plate-glow {
      position: absolute;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-27) 0%, var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-28) 50%, transparent 70%);
      border-radius: 50%;
      filter: blur(25px);
      z-index: 1;
    }

    .plate-image {
      position: relative;
      z-index: 2;
      width: 90%;
      height: 90%;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: var(--shadow-food);
      border: 8px solid var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-29);
      transition: transform 0.5s ease-out;
    }

    .plate-wrapper:hover .plate-image {
      transform: scale(1.02) rotate(1deg);
    }

    /* Floating Garnish & Ingredient Accents */
    .floating-garnish {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 8px 14px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-30));
    }

    .garnish-1 {
      top: 10px;
      left: 10px;
      width: 70px;
      animation: floatMotion 4.2s ease-in-out infinite alternate;
    }

    .garnish-2 {
      bottom: 25px;
      right: 5px;
      width: 80px;
      animation: floatMotion 5s ease-in-out infinite alternate-reverse;
    }

    .garnish-3 {
      top: 35%;
      right: -25px;
      width: 60px;
      animation: floatMotion 3.8s ease-in-out infinite alternate;
    }

    @keyframes floatMotion {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(8deg); }
    }

    /* Floating Hero Badge */
    .hero-floating-card {
      position: absolute;
      bottom: 10px;
      left: -10px;
      background: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-29);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-31);
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: floatMotion 4.5s ease-in-out infinite alternate;
    }

    .hero-card-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-orange-light);
      color: var(--color-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* ==========================================================================
       5. POPULAR QUICK PICKS HORIZONTAL RAIL (BELOW HERO)
       ========================================================================== */
    .quick-picks-section {
      padding: 30px 0 50px;
      border-bottom: 1px solid var(--color-grey-border);
    }

    .section-header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 20px;
    }

    .section-title {
      font-size: 32px;
      font-weight: 800;
    }

    .section-subtitle {
      font-size: 15px;
      color: var(--color-charcoal-muted);
      margin-top: 4px;
    }

    .quick-rail {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding: 8px 4px 20px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: var(--color-grey-border) transparent;
    }

    .quick-rail::-webkit-scrollbar {
      height: 6px;
    }

    .quick-rail::-webkit-scrollbar-thumb {
      background: var(--color-grey-border);
      border-radius: 10px;
    }

    .quick-item-card {
      flex: 0 0 260px;
      scroll-snap-align: start;
      background: var(--color-cream-card);
      border: 1.5px solid var(--color-grey-border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      cursor: pointer;
    }

    .quick-item-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--color-charcoal);
    }

    .quick-img-wrapper {
      position: relative;
      width: 100%;
      height: 140px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--color-grey-cream);
    }

    .quick-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .quick-item-card:hover .quick-img-wrapper img {
      transform: scale(1.06);
    }

    .quick-info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .quick-dish-name {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.25;
    }

    .quick-dish-price {
      font-weight: 800;
      color: var(--color-red);
      font-size: 15px;
      white-space: nowrap;
    }

    .quick-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px dashed var(--color-grey-border);
    }

    .prep-tag {
      font-size: 11.5px;
      color: var(--color-charcoal-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-quick-add {
      background: var(--color-red);
      color: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-18);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
    }

    .btn-quick-add:hover {
      background: var(--color-red-hover);
      transform: scale(1.1);
    }

    /* ==========================================================================
       6. MENU EXPLORER & CATEGORY FILTERING SECTION
       ========================================================================== */
    .menu-section {
      padding: 60px 0;
      background: var(--color-cream);
    }

    .filter-controls-card {
      background: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-05);
      border: 1.5px solid var(--color-grey-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 36px;
      box-shadow: var(--shadow-sm);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-input-wrapper {
      position: relative;
      width: 100%;
    }

    .search-input-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-charcoal-muted);
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--color-grey-border);
      background: var(--color-cream);
      font-size: 15px;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--color-red);
      background: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-18);
      box-shadow: 0 0 0 3px var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-32);
    }

    .sort-select {
      padding: 13px 20px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--color-grey-border);
      background: var(--theme-nairobi-feast-modern-cbd-kitchen-grill-color-05);
      font-weight: 600;
      color: var(--color-charcoal);
      outline: none;
      cursor: pointer;
    }

    .category-pills {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }

    .category-pills::-webkit-scrollbar { display: none; }

    .cat-pill {
      padding: 9px 18px;
      border-radius: var(--radius-full);
      background: var(--color-grey-cream);
      color: var(--color-charcoal);
      font-weight: 700;
      font-size: 13.5px;
      white-space: nowrap;
      transition: var(--transition);

    function loadSavedCart() {

    function loadOrderHistory() {
      try {

        return Array.isArray(orders) ? orders : [];
      } catch (e) {
        return [];
      }
    }

    function saveOrderToHistory(order) {
      const orders = loadOrderHistory();
      orders.unshift(order);
      try {

      } catch (e) {}

    // Hash-based Router
    function handleHashRouting() {
      const hash = window.location.hash.replace("#", "") || "home";
      
      // Update nav link active status
      document.querySelectorAll(".nav-link").forEach(link => {
        const target = link.getAttribute("data-nav");
        if (target === hash) {
          link.classList.add("active");
        } else {
          link.classList.remove("active");
        }
      });

      // Show matching view
      const viewId = `view-${hash}`;
      const allViews = document.querySelectorAll(".view-container");
      let matched = false;

      allViews.forEach(v => {
        if (v.id === viewId) {
          v.classList.add("active-view");
          matched = true;
        } else {
          v.classList.remove("active-view");
        }
      });

      if (!matched) {
        // Fallback to home view if route not found
        const homeView = document.getElementById("view-home");
        if (homeView) homeView.classList.add("active-view");
      }

      // If routed to checkout or orders, render fresh data
      if (hash === "checkout") {
        renderCheckoutView();
      } else if (hash === "orders") {
        renderOrderHistoryView();
      }

      window.scrollTo({ top: 0, behavior: "smooth" });

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function renderMenuDishes() {
      const grid = document.getElementById("menuDishesGrid");
      const emptyState = document.getElementById("menuEmptyState");
      const resultsCount = document.getElementById("menuResultsCount");
      if (!grid) return;

      // Filter dishes
      let filtered = MENU_DATABASE.filter(dish => {
        // Category
        if (currentCategory !== "all" && dish.category !== currentCategory) {
          return false;
        }
        // Search
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchName = dish.name.toLowerCase().includes(q);
          const matchDesc = dish.desc.toLowerCase().includes(q);
          if (!matchName && !matchDesc) return false;
        }
        // Dietary
        if (dietaryFilters.halal && !dish.isHalal) return false;
        if (dietaryFilters.vegetarian && !dish.isVegetarian) return false;
        if (dietaryFilters.healthy && !dish.isHealthy) return false;
        if (dietaryFilters.spicy && !dish.isSpicy) return false;

        return true;
      });

      // Sort
      if (sortMethod === "price-low") {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortMethod === "price-high") {
        filtered.sort((a, b) => b.price - a.price);
      } else if (sortMethod === "time") {
        filtered.sort((a, b) => parseInt(a.prepTime) - parseInt(b.prepTime));
      } else {
        // Default popular
        filtered.sort((a, b) => (b.isPopular ? 1 : 0) - (a.isPopular ? 1 : 0));
      }

      if (resultsCount) {
        resultsCount.textContent = `Showing ${filtered.length} authentic dishes`;
      }

      if (filtered.length === 0) {
        grid.innerHTML = "";
        if (emptyState) emptyState.style.display = "block";
        return;
      }

      if (emptyState) emptyState.style.display = "none";

      grid.innerHTML = filtered.map(dish => createDishCardHTML(dish)).join("");

      if (window.lucide) lucide.createIcons();
    }

    function setupModalOptionBoxes() {
      document.querySelectorAll(".option-box").forEach(box => {
        box.onclick = function() {
          const radio = this.querySelector('input[type="radio"]');
          if (radio) {
            radio.checked = true;
            const groupName = radio.name;
            document.querySelectorAll(`input[name="${groupName}"]`).forEach(r => {
              r.closest(".option-box").classList.remove("selected");
            });
            this.classList.add("selected");
          }
        };
      });
    }

    function adjustModalQty(delta) {
      modalQuantity = Math.max(1, modalQuantity + delta);
      document.getElementById("modalQtyDisplay").textContent = modalQuantity;
      if (selectedDishForModal) {
        const total = selectedDishForModal.price * modalQuantity;
        document.getElementById("modalTotalPrice").textContent = `KES ${total.toLocaleString()}`;
      }
    }

    function addModalDishToTray() {
      if (!selectedDishForModal) return;

      const sideInput = document.querySelector('input[name="dishSide"]:checked');
      const spiceInput = document.querySelector('input[name="dishSpice"]:checked');
      const dipInput = document.querySelector('input[name="dishDip"]:checked');

      const side = sideInput ? sideInput.value : "Chips";
      const spice = spiceInput ? spiceInput.value : "Mild";
      const dip = dipInput ? dipInput.value : "Kachumbari";

      const cartItem = {
        dishId: selectedDishForModal.id,
        name: selectedDishForModal.name,
        price: selectedDishForModal.price,
        image: selectedDishForModal.image,
        quantity: modalQuantity,
        side: side,
        spice: spice,
        dip: dip,
        itemKey: `${selectedDishForModal.id}_${side}_${spice}_${dip}`
      };

      // Add to cart or increment
      const existing = cart.find(item => item.itemKey === cartItem.itemKey);
      if (existing) {
        existing.quantity += modalQuantity;
      } else {
        cart.push(cartItem);
      }

      saveCart();
      showToast(`Added ${modalQuantity}x ${selectedDishForModal.name} to Tray`);
      closeDishModal();
    }

    function quickAddDish(dishId) {
      let dish = MENU_DATABASE.find(d => d.id === dishId);
      if (!dish) dish = COMBOS_DATABASE.find(d => d.id === dishId);
      if (!dish) return;

      const cartItem = {
        dishId: dish.id,
        name: dish.name,
        price: dish.price,
        image: dish.image,
        quantity: 1,
        side: "Crispy Chips",
        spice: "Mild",
        dip: "Kachumbari",
        itemKey: `${dish.id}_Crispy Chips_Mild_Kachumbari`
      };

      const existing = cart.find(item => item.itemKey === cartItem.itemKey);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push(cartItem);
      }

      saveCart();
      showToast(`Added ${dish.name} to Tray!`);
    }

      const grandTotalEl = document.getElementById("cartDrawerGrandTotal");
      const footer = document.getElementById("cartDrawerFooter");
      if (!body) return;

      if (cart.length === 0) {

      body.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img class="cart-item-img eshop-placeholder-media" />

      const total = subtotal + delivery;

      if (subtotalEl) subtotalEl.textContent = `KES ${subtotal.toLocaleString()}`;
      if (grandTotalEl) grandTotalEl.textContent = `KES ${total.toLocaleString()}`;
    }

    function changeCartQty(itemKey, delta) {
      const itemIndex = cart.findIndex(i => i.itemKey === itemKey);
      if (itemIndex > -1) {
        cart[itemIndex].quantity += delta;
        if (cart[itemIndex].quantity <= 0) {
          cart.splice(itemIndex, 1);
        }
      }
      saveCart();
      renderCartDrawer();
    }

    function clearCart() {
      cart = [];
      saveCart();
      renderCartDrawer();
      showToast("Tray cleared.");
    }

    /* ==========================================================================
       10. CHECKOUT & ORDER PLACEMENT
       ========================================================================== */
    function toggleOrderType(type) {
      currentOrderType = type;
      const addrSection = document.getElementById("deliveryAddressSection");
      if (addrSection) {
        addrSection.style.display = type === "delivery" ? "block" : "none";
      }
      renderCheckoutView();
    }

    function handlePaymentMethodChange(method) {
      currentPaymentMethod = method;
      document.querySelectorAll(".payment-method-radio").forEach(el => el.classList.remove("selected"));
      const selected = document.getElementById(method === "mpesa" ? "optMpesa" : "optCash");
      if (selected) selected.classList.add("selected");
    }

    function handleBuildingSelect(e) {
      const val = e.target.value;
      if (val && val !== "Other CBD Building") {
        document.getElementById("custOffice").focus();
      }
    }

    function renderCheckoutView() {
      const listEl = document.getElementById("checkoutItemsList");
      const subtotalEl = document.getElementById("checkoutSubtotal");
      const feeEl = document.getElementById("checkoutDeliveryFee");
      const totalEl = document.getElementById("checkoutGrandTotal");
      if (!listEl) return;

      if (cart.length === 0) {
        listEl.innerHTML = `
          <div style="text-align: center; padding: 30px 10px; color: var(--color-charcoal-muted);">
            <p><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></p>
            <a href="#menu" class="btn btn-secondary btn-sm" style="margin-top: 10px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:38%"></span></a>
          </div>
        `;
        if (subtotalEl) subtotalEl.textContent = "KES 0";
        if (totalEl) totalEl.textContent = "KES 0";
        return;
      }

      listEl.innerHTML = cart.map(item => `
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding-bottom: 8px; border-bottom: 1px dashed var(--color-grey-border);">
          <div>
            <div style="font-weight: 700;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:92%"></span></div>
            <div style="font-size: 12px; color: var(--color-charcoal-muted);"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:95%"></span></div>
          </div>
          <div style="font-weight: 800; color: var(--color-red);"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:54%"></span></div>
        </div>
      `).join("");

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const deliveryFee = currentOrderType === "delivery" ? 100 : 0;
      const grandTotal = subtotal + deliveryFee;

      if (subtotalEl) subtotalEl.textContent = `KES ${subtotal.toLocaleString()}`;
      if (feeEl) feeEl.textContent = `KES ${deliveryFee.toLocaleString()}`;
      if (totalEl) totalEl.textContent = `KES ${grandTotal.toLocaleString()}`;
    }

    function placeOrder() {
      if (cart.length === 0) {
        alert("Your meal tray is empty! Please add some delicious dishes first.");
        window.location.hash = "#menu";
        return;
      }

      const name = document.getElementById("custName")?.value.trim();
      const phone = document.getElementById("custPhone")?.value.trim();
      
      if (!name) {
        alert("Please enter your name.");
        document.getElementById("custName")?.focus();
        return;
      }

      if (!phone || phone.length < 9) {
        alert("Please enter a valid Kenyan phone number (e.g., ).");
        document.getElementById("custPhone")?.focus();
        return;
      }

      let building = "CBD Counter Pickup";
      let office = "Customer Pickup";
      let notes = "";

      if (currentOrderType === "delivery") {
        building = document.getElementById("custBuilding")?.value;
        office = document.getElementById("custOffice")?.value.trim();
        notes = document.getElementById("custNotes")?.value.trim() || "";

        if (!building) {
          alert("Please select or specify your CBD building.");
          document.getElementById("custBuilding")?.focus();
          return;
        }

        if (!office) {
          alert("Please specify your office floor and company/suite name.");
          document.getElementById("custOffice")?.focus();
          return;
        }
      }

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const deliveryFee = currentOrderType === "delivery" ? 100 : 0;
      const totalAmount = subtotal + deliveryFee;
      const orderRef = `NF-CBD-${Math.floor(1000 + Math.random() * 9000)}`;

      const newOrder = {
        orderId: orderRef,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ', ' + new Date().toLocaleDateString(),
        customer: { name, phone },
        orderType: currentOrderType,
        destination: currentOrderType === "delivery" ? `${building}, ${office}` : "Kimathi St Kitchen Pickup",
        notes: notes,
        paymentMethod: currentPaymentMethod,
        items: [...cart],
        subtotal,
        deliveryFee,
        total: totalAmount,
        status: "Accepted by Kitchen"
      };

      // Save order to history
      saveOrderToHistory(newOrder);

      // Render tracking screen
      renderTrackingScreen(newOrder);

      // Clear active cart
      cart = [];
      saveCart();

      // Route to tracking
      window.location.hash = "#track";

      if (currentPaymentMethod === "mpesa") {
        showToast("M-Pesa STK Push initiated. Check your phone PIN prompt!");
      } else {
        showToast("Order placed successfully!");
      }
    }

    function renderTrackingScreen(order) {
      document.getElementById("trackOrderRef").textContent = order.orderId;
      const detailsContainer = document.getElementById("trackOrderDetails");
      if (!detailsContainer) return;

      detailsContainer.innerHTML = `
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;">
          <div><strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:95%"></span></div>
          <div><strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:19%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></div>
        </div>
        <div style="font-size: 13.5px; color: var(--color-charcoal-muted); margin-bottom: 14px;">
          <strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:24%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:89%"></span></div>
        <div style="border-top: 1px dashed var(--color-grey-border); padding-top: 10px;">
          <strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:38%"></span></strong>
          <ul style="margin-top: 6px; padding-left: 20px; font-size: 13.5px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></ul>
          <div style="margin-top: 10px; font-weight: 800; color: var(--color-red);"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></div>
        </div>
      `;
    }

    function renderOrderHistoryView() {
      const container = document.getElementById("orderHistoryList");
      if (!container) return;
      const orders = loadOrderHistory();

      if (orders.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 50px 20px; background: #FFF; border-radius: var(--radius-lg); border: 1.5px dashed var(--color-grey-border);">
            <div style="font-size: 40px; margin-bottom: 10px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></div>
            <h3 style="font-size: 18px; margin-bottom: 6px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:49%"></span></h3>
            <p style="color: var(--color-charcoal-muted); font-size: 14px; margin-bottom: 16px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
            <a href="#menu" class="btn btn-primary btn-sm"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:32%"></span></a>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(ord => `
        <div style="background: #FFF; padding: 22px; border-radius: var(--radius-md); border: 1.5px solid var(--color-grey-border); box-shadow: var(--shadow-sm);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div>
              <span style="font-weight: 800; font-size: 16px; color: var(--color-red);"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
              <span style="font-size: 12px; color: var(--color-charcoal-muted); margin-left: 8px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
            </div>
            <span class="badge badge-green"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
          </div>
          <div style="font-size: 13.5px; color: var(--color-charcoal-muted); margin-bottom: 10px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:51%"></span></div>
          <div style="font-size: 13.5px; margin-bottom: 12px;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></div>
          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--color-grey-border); padding-top: 10px;">
            <div style="font-weight: 800;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:73%"></span></div>
            <button class="btn btn-secondary btn-sm" onclick="reorderItems('${ord.orderId}')"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:46%"></span></button>
          </div>
        </div>
      `).join("");
    }

    function reorderItems(orderId) {
      const orders = loadOrderHistory();
      const found = orders.find(o => o.orderId === orderId);
      if (found) {
        cart = [...found.items];
        saveCart();
        showToast("Items added back to your tray!");
        openCartDrawer();
      }
    }

    /* ==========================================================================
       11. TOAST NOTIFICATIONS & UTILITIES
       ========================================================================== */
    function showToast(message) {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = `<i data-lucide="check-circle" style="width: 18px; height: 18px; color: #48BB78;"></i> <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>`;
      container.appendChild(toast);

      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(10px)";
        toast.style.transition = "all 0.3s ease";
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function toggleMobileDrawer() {
      const drawer = document.getElementById("mobileDrawerOverlay");
      drawer.classList.toggle("active");
    }

    function handleContactSubmit(e) {
      e.preventDefault();
      alert("Thank you! Your message has been sent to our Kimathi Street kitchen manager.");
      e.target.reset();
    }

    /* ==========================================================================
       12. GSAP & SCROLLTRIGGER INITIALIZATION
       ========================================================================== */
    function initGSAPAnimations() {
      if (typeof gsap === "undefined") {
        console.log("GSAP loaded or running standalone fallback.");
        return;
      }

      if (typeof ScrollTrigger !== "undefined") {
        gsap.registerPlugin(ScrollTrigger);
      }

      // Hero Elements Reveal
      gsap.from(".hero-eyebrow, .hero-title, .hero-subtitle, .hero-actions, .hero-service-row", {
        opacity: 0,
        y: 24,
        duration: 0.8,
        stagger: 0.12,
        ease: "power2.out"
      });

      // Hero Plate Floating Zoom
      gsap.from("#heroMainPlate", {
        scale: 0.88,
        opacity: 0,
        duration: 1.1,
        ease: "power3.out"
      });

      // Parallax effect on scroll for garnish
      if (typeof ScrollTrigger !== "undefined") {
        gsap.to(".garnish-1", {
          y: -40,
          scrollTrigger: {
            trigger: ".hero",
            start: "top top",
            end: "bottom top",
            scrub: 1
          }
        });

        gsap.to(".garnish-2", {
          y: 30,
          scrollTrigger: {
            trigger: ".hero",
            start: "top top",
            end: "bottom top",
            scrub: 1.2
          }
        });
      }
    }
  </script>
