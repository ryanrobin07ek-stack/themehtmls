  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

  <meta name="description" content="Visual Studio site administration suite for FreshBox restaurant storefront." />
  <meta name="theme-color" content="#381207" />
  <meta name="color-scheme" content="only light" />
  <meta name="supported-color-schemes" content="light" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    a, button, input, select, textarea, label, [onclick] {
      touch-action: manipulation;
    }
    :root {
      color-scheme: only light;
      --ff-brand: #381207;
      --ff-bg: #FDF6ED;
      --ff-surface: #FFF9F2;
      --ff-card-bg: #FFFFFF;
      --ff-text: #381207;
      --ff-muted: #78350F;
      --ff-accent: #F59E0B;
      --ff-border: #F3E5D4;
      --ff-card-radius: 20px;
      --ff-card-border: 1px solid #F3E5D4;
      --ff-card-padding: 14px;
      --ff-heading-font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --ff-body-font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --ff-heading-weight: 900;
      --ff-heading-transform: uppercase;
      --ff-letter-spacing: -0.03em;
      --ff-safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body {
      background-color: #EFE4D6;
      color: #381207;
      font-family: var(--ff-body-font);
      line-height: 1.5;
      font-size: 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    #app-container {
      width: 100%;
      max-width: 480px;
      background-color: #FFFFFF;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(56, 18, 7, 0.15);
      padding-bottom: 24px;
    }
    a { color: inherit; text-decoration: none; }
    button { color: inherit; font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; font-size: 15px; }

    /* Studio Shell */
    .studio-shell {
      background-color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .studio-header {
      background-color: #381207;
      color: #FFFFFF;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .studio-title-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .studio-logo-text {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #F59E0B;
    }
    .studio-tag {
      background-color: #DC2626;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }
    .studio-nav-tabs {
      background-color: #2D0D04;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 6px 8px;
      gap: 4px;
    }
    .studio-nav-tabs::-webkit-scrollbar { display: none; }
    .studio-tab-btn {
      color: #F3E5D4;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 7px 12px;
      white-space: nowrap;
      border-radius: 8px;
      opacity: 0.8;
      transition: all 0.2s;
    }
    .studio-tab-btn.active, .studio-tab-btn:hover {
      color: #381207;
      background-color: #F59E0B;
      opacity: 1;
    }
    .studio-body {
      padding: 16px;
      flex: 1;
      background: #FFFFFF;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #381207;
      margin-bottom: 5px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      border: 1.5px solid #F3E5D4;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      color: #381207;
      outline: none;
      background-color: #FFF9F2;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #F59E0B;
      background-color: #FFFFFF;
    }
    .studio-card-box {
      background-color: #FFF9F2;
      border: 1px solid #F3E5D4;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    /* Studio Buttons */
    .btn-pill-action {
      background-color: #F59E0B;
      color: #381207;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 9999px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn-pill-action:active { transform: scale(0.96); background-color: #D97706; }
    .btn-pill-outline {
      border: 1.5px solid #381207;
      background-color: transparent;
      color: #381207;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-pill-outline:active { background-color: #381207; color: #FFFFFF; }

    /* Bottom Sheet Modal */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(56, 18, 7, 0.6);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      backdrop-filter: blur(2px);
    }
    .sheet-overlay.open { opacity: 1; pointer-events: auto; }
    .bottom-sheet {
      background-color: #FFFFFF;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -8px 30px rgba(56, 18, 7, 0.25);
    }
    .sheet-overlay.open .bottom-sheet { transform: translateY(0); }
    .sheet-header {
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #F3E5D4;
    }
    .sheet-drag-handle { width: 36px; height: 4px; background-color: #D1D5DB; border-radius: 4px; margin: 8px auto 0; }
    .sheet-title { font-size: 16px; font-weight: 900; text-transform: uppercase; color: #381207; }
    .sheet-content { padding: 16px 18px; overflow-y: auto; flex: 1; }
    .sheet-footer { padding: 12px 18px; border-top: 1px solid #F3E5D4; display: flex; gap: 10px; background: #FFFDF9; }
  </style>
</head>

          </button>
        </div>
        <div class="sheet-content" id="sheet-content">
          <!-- Dynamic Form -->
        </div>
        <div class="sheet-footer" id="sheet-footer">
          <!-- Dynamic Action Buttons -->
        </div>
      </div>
    </div>

  "pages": [
    { "id": "page-about", "name": "Our Story", "slug": "about", "title": "The FreshBox Culinary Story", "description": "How FreshBox grew from a passion for real, uncompromised comfort food in Nairobi into a premier gourmet dining brand.", "content": "<p style=\"margin-bottom:12px;\">At FreshBox, we believe food should be bold, unapologetic, and made from scratch every single morning. We never use frozen beef patties or pre-shredded cheese. Our 100% grass-fed beef is freshly ground daily, and our pizza dough ferments slowly over 48 hours for an airy, digestible crust.</p><p style=\"margin-bottom:12px;\">From our signature smash burgers with caramelized onions to our 24-hour herb buttermilk fried chicken, every recipe is crafted to make food history. Whether you order online or visit our open kitchen in Nairobi Central, welcome to the family.</p>" },
    { "id": "page-delivery", "name": "Delivery Info", "slug": "delivery", "title": "Fast 30-Minute Delivery Service", "description": "Hot, thermal-insulated motorcycle courier delivery across Nairobi Central, Westlands, Kilimani, Upper Hill and beyond.", "content": "<p style=\"margin-bottom:12px;\"><strong>30-Minute Guarantee:</strong> We pack orders in custom ventilated thermal boxes to guarantee your fries stay crispy and your pizza arrives steaming hot.</p><p style=\"margin-bottom:12px;\"><strong>Flat Rate Shipping:</strong> KSh 250 flat courier delivery fee within 10km radius. <strong>FREE DELIVERY</strong> applies on all orders exceeding KSh 2,500.</p>" },

    { "id": "page-faqs", "name": "FAQs", "slug": "faqs", "title": "Frequently Asked Questions", "description": "Answers to ordering times, delivery radius, group catering, and payment options.", "content": "<div style=\"display:flex; flex-direction:column; gap:12px;\"><div><h4 style=\"font-size:13px; font-weight:900;\">How hot does the food arrive?</h4><p style=\"font-size:12px; color:#4B5563;\">Our courier boxes maintain 70°C heat retention for up to 45 minutes.</p></div><div><h4 style=\"font-size:13px; font-weight:900;\">Can I customize my burger toppings?</h4><p style=\"font-size:12px; color:#4B5563;\">Yes! Tap any meal card to pick single/double patties, extra melted cheddar, bacon, jalapeños, and sauces.</p></div><div><h4 style=\"font-size:13px; font-weight:900;\">What payment methods are supported?</h4><p style=\"font-size:12px; color:#4B5563;\">We support M-Pesa Express, Visa, Mastercard, and Cash on Delivery.</p></div></div>" }

  <!-- STUDIO LIVE ENGINE (All 18 Interactive Editor Pages) -->
  <script>
  window.__FF_CONFIG__ = JSON.parse(document.getElementById("ff-config").textContent);
  window.__FF_SITE__ = JSON.parse(document.getElementById("ff-site-data").textContent);

  (function() {
    'use strict';

    const APP_MODE = 'studio'; // Admin Studio mode
    const CFG = window.__FF_CONFIG__;
    const initialSiteData = window.__FF_SITE__;

    let site = JSON.parse(JSON.stringify(initialSiteData));
    let undoStack = [];
    let redoStack = [];
    let currentTab = 'dashboard';
    let secDraft = null;

    // Studio tabs list
    const STUDIO_TABS = [
      { id: 'dashboard', label: '📊 Dashboard' },
      { id: 'products', label: '🍔 Menu Dishes' },
      { id: 'inventory', label: '📦 Stock & Availability' },
      { id: 'categories', label: '📁 Categories' },
      { id: 'sections', label: '🧱 Sections Builder' },
      { id: 'hero-editor', label: '✨ Hero Banner' },
      { id: 'themes', label: '🎨 Themes & Palettes' },
      { id: 'typography', label: '✍️ Typography' },
      { id: 'branding', label: '🏷️ Logo & Brand' },
      { id: 'card-layouts', label: '📐 Card Layouts' },
      { id: 'navigation', label: '🧭 Navigation Links' },
      { id: 'pages', label: '📄 Custom Pages' },
      { id: 'contact', label: '📞 Kitchen Contacts' },
      { id: 'location', label: '🗺️ Map & Location' },
      { id: 'floating', label: '💬 Floating Chat' },
      { id: 'payments', label: '💳 Delivery & Payments' },
      { id: 'cart-account', label: '🛒 Cart & Profile' },
      { id: 'settings', label: '⚙️ Settings & Backup' }
    ];

    function loadState() {
      try {
        const rev = String(initialSiteData.dataRevision ?? initialSiteData.version);
        const appliedRev = localStorage.getItem(CFG.storage.revisionKey);
        if (appliedRev !== rev) localStorage.setItem(CFG.storage.revisionKey, rev);
        const savedSite = appliedRev === rev ? localStorage.getItem(CFG.storage.siteKey) : null;
        if (savedSite) {
          const parsed = JSON.parse(savedSite);
          if (parsed && parsed.products) site = parsed;
        }
      } catch (err) {
        console.warn('Failed to load studio state:', err);
      }
    }

    let saveTimeout = null;
    function scheduleSave() {
      if (saveTimeout) clearTimeout(saveTimeout);
      const st = document.getElementById('studio-save-status');
      if (st) st.textContent = 'Saving…';
      saveTimeout = setTimeout(flushSave, 350);
    }

    function flushSave() {
      try {
        localStorage.setItem(CFG.storage.siteKey, JSON.stringify(site));
        const st = document.getElementById('studio-save-status');
        if (st) st.textContent = 'Saved ✓';
      } catch (e) {
        console.warn('Failed to save to storage:', e);
      }
    }

    function pushUndoState() {
      undoStack.push(JSON.stringify(site));
      if (undoStack.length > 25) undoStack.shift();
      redoStack = [];
    }

    function formatCurrency(amount) {
      const sym = site.currencySymbol || 'KSh';
      return sym + ' ' + Math.round(amount || 0).toLocaleString();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setByPath(obj, path, val) {
      const parts = path.split('.').filter(Boolean);
      let curr = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        const p = parts[i];
        if (p === '__proto__' || p === 'constructor' || p === 'prototype') return false;
        if (!(p in curr) || curr[p] == null || typeof curr[p] !== 'object') {
          curr[p] = /^\d+$/.test(parts[i + 1]) ? [] : {};
        }
        curr = curr[p];
      }
      curr[parts[parts.length - 1]] = val;
      return true;
    }

    function showToast(msg) {
      const existing = document.getElementById('global-toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.id = 'global-toast';
      toast.textContent = msg;
      toast.style.cssText = 'position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#381207; color:#FBBF24; font-size:12px; font-weight:900; letter-spacing:0.03em; padding:10px 22px; border-radius:9999px; box-shadow:0 8px 24px rgba(56, 18, 7, 0.35); z-index:99999; border:1px solid #F59E0B; transition:all 0.25s cubic-bezier(0.16, 1, 0.3, 1);';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2400);
    }
    window.showToast = showToast;

    // RENDER STUDIO TABS & CONTENT

          ${t.label}
        </button>
      `).join('');
    }

      currentTab = tabId;
      renderTabs();
      renderCurrentTabContent();
    };

    window.updateSiteProperty = function(path, val) {
      pushUndoState();

    window.updateCardColumns = function(n) {
      pushUndoState();

      renderCurrentTabContent();
      showToast('Card columns updated to ' + (n === 0 ? 'AUTO' : n));

    window.updateCardRadius = function(val) {
      pushUndoState();
      site.cardLayoutSettings = site.cardLayoutSettings || {};
      site.cardLayoutSettings.radius = val + 'px';
      document.getElementById('radius-val').textContent = val + 'px';
      scheduleSave();
    };

      pushUndoState();
      site.activeThemeId = tId;
      scheduleSave();
      renderCurrentTabContent();
      showToast('Theme updated!');
    };

    window.updateHero = function(field, val) {
      pushUndoState();
      const hero = (site.sections || []).find(s => s.type === 'hero');
      if (hero) hero[field] = val;
      scheduleSave();
    };

    window.updateTypography = function(field, val) {
      pushUndoState();
      site.typography = site.typography || {};
      site.typography[field] = val;
      scheduleSave();
      showToast('Typography updated');
    };

    window.moveSection = function(idx, delta) {
      pushUndoState();
      const t = idx + delta;
      if (t < 0 || t >= site.sections.length) return;
      const tmp = site.sections[idx];
      site.sections[idx] = site.sections[t];
      site.sections[t] = tmp;
      scheduleSave();
      renderCurrentTabContent();
    };

    window.toggleSection = function(idx) {
      pushUndoState();
      site.sections[idx].enabled = !site.sections[idx].enabled;
      scheduleSave();
      renderCurrentTabContent();
    };

    window.adjustStock = function(pId, size, delta) {
      const p = site.products.find(x => x.id === pId);
      if (!p) return;
      const s = p.sizes.find(sz => sz.size === size);
      if (!s) return;
      s.stock = Math.max(0, (s.stock || 0) + delta);
      scheduleSave();
      renderCurrentTabContent();
    };

    window.restockAllDishes = function() {
      pushUndoState();
      site.products.forEach(p => {
        (p.sizes || []).forEach(s => { s.stock = (s.stock || 0) + 15; });
      });
      scheduleSave();
      renderCurrentTabContent();
      showToast('Restocked +15 portions to all menu items!');
    };

      });

      const idx = site.products.findIndex(x => x.id === pId);
      site.products.splice(idx, 1);
      scheduleSave();
      renderCurrentTabContent();
      showToast('Dish removed from menu');

    // Export & Import
    window.exportJSON = function() {
      const blob = new Blob([JSON.stringify(site, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = CFG.backupFileName;
      a.click();
      URL.revokeObjectURL(url);
    };

    window.promptImportJSON = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const imported = JSON.parse(evt.target.result);
            if (imported && imported.products) {
              pushUndoState();
              site = imported;
              scheduleSave();
              showToast('Site data imported successfully!');
              renderCurrentTabContent();
            }
          } catch (err) {
            alert('Failed to parse JSON backup file');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    };

    window.resetStoreDefaults = function() {
      if (confirm('Reset all store settings and dishes back to original defaults?')) {
        pushUndoState();
        site = JSON.parse(JSON.stringify(initialSiteData));
        localStorage.clear();
        scheduleSave();
        showToast('Store reset to defaults!');
        renderCurrentTabContent();
      }
    };

    document.getElementById('sheet-close-btn').addEventListener('click', window.closeSheet);
    document.getElementById('sheet-overlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) window.closeSheet();
    });

    // Initial Bootstrap
    loadState();
    renderTabs();
    renderCurrentTabContent();

  })();
  </script>
</body>
</html>
