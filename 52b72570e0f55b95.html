  <!-- ==========================================================================
       03. CSS VARIABLES & DESIGN SYSTEM
       ========================================================================== -->
  <style>
    :root {
      /* Supplied Reference Palette & Art Direction */
      --pink-primary: #F1B7C9;
      --rose-deep: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-01);
      --rose-ink: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-02);
      --blush-pale: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-03);
      --blush-soft: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-04);
      --white: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-05);
      --neutral-warm: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-06);
      --neutral-stone: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-07);
      --charcoal: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-08);
      --charcoal-muted: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-09);
      --charcoal-subtle: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-10);
      --sage-muted: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-11);
      --sage-deep: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-12);
      --champagne: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-13);
      --border-hairline: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-14);
      --border-rose: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-15);
      --shadow-soft: 0 12px 34px -10px var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-16);
      --shadow-elevated: 0 20px 44px -12px var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-14);

      /* Status Semantic Colours (Paired with Explicit Text/Icons) */
      --status-ok-bg: #EFF5EC;
      --status-ok-text: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-17);
      --status-warn-bg: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-18);
      --status-warn-text: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-19);
      --status-err-bg: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-20);
      --status-err-text: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-21);

      /* Typography */
      --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      /* Spacing & Layout */
      --container-max: 1320px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-arch: 180px 180px 16px 16px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ==========================================================================
       04. GLOBAL LAYOUT, RESET & TYPOGRAPHY
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      color: var(--charcoal);
      background-color: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Accessible Focus States */
    :focus-visible {
      outline: 2px solid var(--rose-deep);
      outline-offset: 3px;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: 16px;
      background: var(--charcoal);
      color: var(--white);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      z-index: 9999;
      font-weight: 600;
    }
    .skip-link:focus {
      top: 12px;
    }

    /* Typography Hierarchy */
    .display-hero {
      font-family: var(--font-display);
      font-size: clamp(2.45rem, 4.6vw, 4.35rem);
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -0.015em;
      text-wrap: balance;
      color: var(--charcoal);
    }

    .display-hero em, .section-title em {
      font-style: italic;
      font-weight: 500;
      color: var(--rose-ink);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 3.2vw, 2.85rem);
      font-weight: 600;
      line-height: 1.14;
      letter-spacing: -0.01em;
      text-wrap: balance;
      color: var(--charcoal);
    }

    .subsection-title {
      font-family: var(--font-display);
      font-size: clamp(1.35rem, 2vw, 1.75rem);
      font-weight: 600;
      line-height: 1.22;
      color: var(--charcoal);
    }

    /* Clean Unboxed Metadata (Zero-Pill Discipline) */
    .kicker {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rose-ink);
      display: block;
      margin-bottom: 0.5rem;
    }

    .meta-inline {
      font-size: 0.8125rem;
      color: var(--charcoal-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      line-height: 1.4;
    }

    .meta-sep {
      color: var(--champagne);
      user-select: none;
    }

    .tabular-price {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    /* Layout Containers */
    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    @media (min-width: 768px) {
      .container {
        padding: 0 2.25rem;
      }
    }

    .section-pad {
      padding: 4.25rem 0;
    }

    @media (min-width: 1024px) {
      .section-pad {
        padding: 5.75rem 0;
      }
    }

    .bg-blush { background-color: var(--blush-pale); }
    .bg-warm { background-color: var(--neutral-warm); }
    .bg-white { background-color: var(--white); }

    /* ==========================================================================
       05. NAVIGATION & TOP BAR CONTRACT (15% Mobile Sticky Cap Compliant)
       ========================================================================== */
    .promo-strip {
      background-color: var(--blush-soft);
      border-bottom: 1px solid var(--border-hairline);
      font-size: 0.78rem;
      color: var(--charcoal);
      padding: 0.45rem 1rem;
    }
    .promo-strip-inner {
      max-width: var(--container-max);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .promo-strip-links {
      display: none;
      align-items: center;
      gap: 1rem;
    }
    @media (min-width: 900px) {
      .promo-strip-links { display: flex; }
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-22);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-hairline);
      height: 64px;
      display: flex;
      align-items: center;
    }

    /* Strict 3-Zone Top Bar Contract */
    .header-inner {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .brand-wordmark {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--charcoal);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .primary-nav {
      display: none;
      align-items: center;
      gap: 1.75rem;
    }
    @media (min-width: 960px) {
      .primary-nav { display: flex; }
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--charcoal-muted);
      white-space: nowrap;
      flex-shrink: 0;
      padding: 0.25rem 0;
      border-bottom: 1.5px solid transparent;
      transition: color 160ms var(--ease-out), border-color 160ms var(--ease-out);
    }
    .nav-link:hover, .nav-link.active {
      color: var(--charcoal);
      border-bottom-color: var(--rose-deep);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
    }

    /* Secondary View Explorer Strip (Non-Sticky — Gives Direct 1-Click Access to All 37 Views) */
    .subnav-bar {
      background: var(--neutral-warm);
      border-bottom: 1px solid var(--border-hairline);
      padding: 0.5rem 0;
      font-size: 0.8rem;
    }
    .subnav-inner {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .subnav-inner::-webkit-scrollbar { display: none; }
    .subnav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
      white-space: nowrap;
    }
    .subnav-item {
      color: var(--charcoal-muted);
      white-space: nowrap;
      transition: color 150ms ease;
    }
    .subnav-item:hover, .subnav-item.active {
      color: var(--rose-ink);
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.35rem;
      min-height: 42px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out), border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn-primary {
      background-color: var(--rose-deep);
      color: var(--white);
      border: 1px solid var(--rose-deep);
    }
    .btn-primary:hover {
      background-color: var(--rose-ink);
      border-color: var(--rose-ink);
    }
    .btn-secondary {
      background-color: var(--white);
      color: var(--charcoal);
      border: 1px solid var(--border-hairline);
    }
    .btn-secondary:hover {
      border-color: var(--rose-deep);
      background-color: var(--blush-pale);
    }
    .btn-ghost {
      background-color: transparent;
      color: var(--charcoal);
      padding: 0.5rem 0.85rem;
      border: 1px solid transparent;
    }
    .btn-ghost:hover {
      background-color: var(--blush-pale);
    }
    .btn-sm {
      padding: 0.45rem 0.9rem;
      min-height: 36px;
      font-size: 0.8125rem;
    }

    /* Editorial Hero Composition (Inspired by Reference) */
    .hero-editorial {
      background: linear-gradient(180deg, var(--blush-pale) 0%, var(--white) 100%);
      padding: 2.5rem 0 4rem;
      border-bottom: 1px solid var(--border-hairline);
      position: relative;
      overflow: hidden;
    }
    @media (min-width: 1024px) {
      .hero-editorial {
        padding: 4rem 0 5rem;
      }
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
      align-items: stretch;
    }
    @media (min-width: 1024px) {
      .hero-grid {
        grid-template-columns: 1.08fr 0.92fr;
        gap: 3.5rem;
      }
    }
    .hero-copy-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.35rem;
    }
    .hero-lead {
      font-size: clamp(1rem, 1.2vw, 1.125rem);
      color: var(--charcoal-muted);
      max-width: 58ch;
      line-height: 1.68;
    }
    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.85rem;
      padding-top: 0.35rem;
    }
    .hero-visual-col {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 1rem;
      align-items: stretch;
    }
    @media (max-width: 640px) {
      .hero-visual-col {
        grid-template-columns: 1fr;
      }
    }
    .hero-arch-frame {
      border-radius: var(--radius-arch);
      overflow: hidden;
      border: 1px solid var(--border-rose);
      background: var(--blush-soft);
      position: relative;
      min-height: 360px;
    }
    .hero-arch-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-side-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      justify-content: space-between;
    }
    .hero-mini-card {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-hairline);
      background: var(--white);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .hero-mini-img {
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--blush-pale);
    }
    .hero-mini-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Full-width Hero Metrics & Quick Booking Strip */
    .hero-Trust-bar {
      margin-top: 2.75rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-hairline);
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 1.25rem;
    }
    @media (min-width: 640px) {
      .hero-Trust-bar { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .hero-Trust-bar { grid-template-columns: repeat(4, 1fr); }
    }
    .trust-cell {
      padding: 1rem 1.25rem;
      background: var(--white);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
    }

    /* Cards, Grids & Editorial Sections */
    .grid-2 { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    .grid-4 { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }

    @media (min-width: 640px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); gap: 1.75rem; }
      .grid-4 { grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out), border-color 180ms var(--ease-out);
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
      border-color: var(--border-rose);
    }
    .card-body {
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      flex: 1;
    }
    .card-footer {
      padding: 1rem 1.35rem;
      border-top: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: var(--white);
    }

    /* Image Aspect Containers & Resilient Fallbacks */
    .media-frame {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--blush-soft) 0%, var(--neutral-warm) 100%);
    }
    .aspect-3-4 { aspect-ratio: 3 / 4; }
    .aspect-4-3 { aspect-ratio: 4 / 3; }
    .aspect-1-1 { aspect-ratio: 1 / 1; }
    .aspect-16-9 { aspect-ratio: 16 / 9; }

    .media-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 400ms var(--ease-out);
    }
    .card:hover .media-frame img {
      transform: scale(1.03);
    }
    .img-fallback-overlay {
      display: none;
      position: absolute;
      inset: 0;
      padding: 1.25rem;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(145deg, var(--blush-pale), var(--neutral-warm));
      color: var(--charcoal);
    }
    .media-frame.img-error img {
      display: none;
    }
    .media-frame.img-error .img-fallback-overlay {
      display: flex;
    }

    /* Interactive Filter Controls (Buttons/Tabs Allowed per Zero-Pill Rule) */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem;
      background: var(--neutral-warm);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hairline);
    }
    .filter-btn {
      padding: 0.45rem 0.85rem;
      min-height: 36px;
      border-radius: 4px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--charcoal-muted);
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .filter-btn:hover {
      color: var(--charcoal);
    }
    .filter-btn.active {
      background: var(--white);
      color: var(--charcoal);
      font-weight: 600;
      box-shadow: 0 1px 3px var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-23);
    }

    /* Editorial Price Table / Service List */
    .service-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      padding: 1.35rem 0;
      border-bottom: 1px solid var(--border-hairline);
      align-items: center;
    }
    @media (min-width: 768px) {
      .service-row {
        grid-template-columns: 1.6fr 0.7fr 0.5fr auto;
      }
    }

    /* Multi-step Booking Layout */
    .booking-shell {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: start;
    }
    @media (min-width: 1024px) {
      .booking-shell {
        grid-template-columns: 1.55fr 0.85fr;
        gap: 2.5rem;
      }
    }
    .booking-summary-panel {
      background: var(--blush-pale);
      border: 1px solid var(--border-rose);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      position: sticky;
      top: 84px;
    }
    .step-indicator {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-hairline);
    }
    .step-btn {
      padding: 0.4rem 0.7rem;
      font-size: 0.78rem;
      border-radius: 4px;
      border: 1px solid var(--border-hairline);
      background: var(--white);
      color: var(--charcoal-muted);
      white-space: nowrap;
    }
    .step-btn.current {
      background: var(--charcoal);
      color: var(--white);
      border-color: var(--charcoal);
      font-weight: 600;
    }
    .step-btn.completed {
      background: var(--blush-soft);
      color: var(--rose-ink);
      border-color: var(--border-rose);
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.15rem;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--charcoal);
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      min-height: 42px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      background: var(--white);
      font-size: 0.925rem;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--rose-deep);
      outline: none;
    }
    .field-error {
      font-size: 0.78rem;
      color: var(--status-err-text);
      background: var(--status-err-bg);
      padding: 0.35rem 0.6rem;
      border-radius: 4px;
    }

    /* Selectable Option Tiles */
    .option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 0.75rem;
    }
    .option-tile {
      text-align: left;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      background: var(--white);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      transition: border-color 150ms ease, background-color 150ms ease;
    }
    .option-tile:hover:not(:disabled) {
      border-color: var(--rose-deep);
    }
    .option-tile.selected {
      border: 2px solid var(--rose-deep);
      background: var(--blush-pale);
    }
    .option-tile:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: var(--neutral-warm);
    }

    /* Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.4rem;
      margin-top: 0.75rem;
    }
    .cal-day-header {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--charcoal-muted);
      padding: 0.35rem 0;
    }
    .cal-cell {
      min-height: 44px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-family: var(--font-mono);
    }
    .cal-cell.selected {
      background: var(--rose-deep);
      color: var(--white);
      border-color: var(--rose-deep);
      font-weight: 600;
    }
    .cal-cell:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      background: var(--neutral-warm);
    }

    /* Modals & Drawers */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-24);
      z-index: 200;
      display: none;
      align-items: stretch;
      justify-content: flex-end;
    }
    .drawer-backdrop.open {
      display: flex;
    }
    .drawer-panel {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      height: 100%;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-elevated);
    }

    /* Breadcrumbs */
    .breadcrumb-bar {
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-hairline);
      background: var(--blush-pale);
      font-size: 0.8125rem;
    }

    /* Notice Boxes (No Thick Left Accent Borders!) */
    .notice-box {
      padding: 1.1rem 1.25rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hairline);
      background: var(--neutral-warm);
      font-size: 0.875rem;
    }
    .notice-box.warn {
      background: var(--status-warn-bg);
      color: var(--status-warn-text);
      border-color: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-25);
    }
    .notice-box.ok {
      background: var(--status-ok-bg);
      color: var(--status-ok-text);
      border-color: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-26);
    }

    /* Footer */
    .site-footer {
      background: var(--charcoal);
      color: var(--neutral-warm);
      padding: 4.5rem 0 2.5rem;
      margin-top: 4rem;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2.5rem;
    }
    @media (min-width: 768px) {
      .footer-grid { grid-template-columns: 1.4fr 1fr 1fr 1fr; }
    }
    .footer-link {
      display: block;
      font-size: 0.875rem;
      color: var(--theme-blush-theory-nail-studio-editorial-nail-art-online-booking-apoth-color-27);
      padding: 0.28rem 0;
      transition: color 150ms ease;
    }
    .footer-link:hover {
      color: var(--pink-primary);
    }

    /* Reduced Motion Support */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

      /* ========================================================================
         15. TRANSPARENT BOOKING PRICE & DURATION CALCULATION ENGINE
         Base service + secondary service + shape/length/finish upgrades + extras - valid promo
         ======================================================================== */
      function calculateBookingBreakdown() {
        const b = STATE.booking;
        const primary = getServiceById(b.primaryServiceId);
        const secondary = b.secondaryServiceId ? SERVICES_DATA.find(s => s.id === b.secondaryServiceId) : null;
        const shape = SALON_CONFIG.shapes.find(s => s.id === b.shapeId) || SALON_CONFIG.shapes[0];
        const length = SALON_CONFIG.lengths.find(l => l.id === b.lengthId) || SALON_CONFIG.lengths[0];
        const finish = SALON_CONFIG.finishes.find(f => f.id === b.finishId) || SALON_CONFIG.finishes[0];
        const design = (!b.noElaborateArt && b.selectedDesignId) ? getDesignById(b.selectedDesignId) : null;

        const baseKES = primary.priceKES + (secondary ? secondary.priceKES : 0);
        const shapeKES = primary.compatibleShapes.includes(shape.id) ? shape.surchargeKES : 0;
        const lengthKES = primary.compatibleLengths.includes(length.id) ? length.surchargeKES : 0;
        const finishKES = primary.compatibleFinishes.includes(finish.id) ? finish.surchargeKES : 0;

        // If selected design has an art surcharge above base service when not already an art package
        let designArtUpgradeKES = 0;
        if (design && primary.categorySlug !== 'nail-art' && primary.categorySlug !== 'packages') {
          designArtUpgradeKES = Math.max(0, design.startingKES - primary.priceKES);
        }

        const selectedExtras = b.selectedExtraIds
          .map(eid => SALON_CONFIG.extrasCatalogue.find(x => x.id === eid))
          .filter(Boolean);
        const extrasKES = selectedExtras.reduce((sum, x) => sum + x.priceKES, 0);

        const subtotalKES = baseKES + shapeKES + lengthKES + finishKES + designArtUpgradeKES + extrasKES;

        // Check valid configured promo code
        let discountKES = 0;
        let appliedOffer = null;
        if (b.promoCode) {
          const cleanCode = b.promoCode.trim().toUpperCase();
          appliedOffer = OFFERS_DATA.find(o => o.code === cleanCode);
          if (appliedOffer) {
            discountKES = appliedOffer.discountKES;
          }
        }

        const totalKES = Math.max(0, subtotalKES - discountKES);
        const depositRequired = primary.depositRequired || (secondary && secondary.depositRequired) || totalKES >= 3500;
        const depositKES = depositRequired ? Math.round(totalKES * SALON_CONFIG.depositRate) : 0;
        const balanceKES = totalKES - depositKES;

        const totalDurationMins =
          primary.durationMins +
          (secondary ? secondary.durationMins : 0) +
          length.extraMins +
          selectedExtras.reduce((s, x) => s + x.durationMins, 0);

        return {
          primary,
          secondary,
          shape,
          length,
          finish,
          design,
          selectedExtras,
          baseKES,
          shapeKES,
          lengthKES,
          finishKES,
          designArtUpgradeKES,
          extrasKES,
          subtotalKES,
          discountKES,
          appliedOffer,
          totalKES,
          depositRequired,
          depositKES,
          balanceKES,
          totalDurationMins
        };
      }

      /* ========================================================================
         14. REAL SCHEDULE & DOUBLE-BOOKING PROTECTION ENGINE
         ======================================================================== */
      function timeToMins(t) {
        const parts = t.split(':').map(Number);
        return parts[0] * 60 + parts[1];
      }

      function minsToTime(m) {
        const hh = String(Math.floor(m / 60)).padStart(2, '0');
        const mm = String(m % 60).padStart(2, '0');
        return hh + ':' + mm;
      }

      function getAvailableSlotsForDate(dateISO, techId, durationMins) {
        const dateObj = new Date(dateISO + 'T00:00:00');
        if (isNaN(dateObj.getTime())) return { closed: true, reason: 'Invalid date selected.', slots: [] };

        const dayOfWeek = dateObj.getDay();
        const studioHours = SALON_CONFIG.operatingHours[dayOfWeek];
        if (!studioHours) {
          return { closed: true, reason: 'Studio is closed on Mondays for autoclave maintenance & staff rest.', slots: [] };
        }

        const primary = getServiceById(STATE.booking.primaryServiceId);
        let candidateTechs = TECHNICIANS_DATA.filter(t => primary.eligibleTechIds.includes(t.id));
        if (techId && techId !== 'any' && techId !== 'next') {
          candidateTechs = candidateTechs.filter(t => t.id === techId);
        }
        // Filter by working day
        const workingTechs = candidateTechs.filter(t => t.workingDays.includes(dayOfWeek));
        if (workingTechs.length === 0) {
          return { closed: true, reason: 'Selected technician does not work on this day of the week. Choose another date or select "Next Available Qualified Technician".', slots: [] };
        }

        const openM = timeToMins(studioHours.open);
        const closeM = timeToMins(studioHours.close);
        const requiredWithBuffer = durationMins + SALON_CONFIG.bufferMinutes;
        const slots = [];

        for (let m = openM; m + durationMins <= closeM; m += 30) {
          const slotLabel = minsToTime(m);
          let availableTechForSlot = null;

          for (const tech of workingTechs) {
            const tStart = timeToMins(tech.hours.start);
            const tEnd = timeToMins(tech.hours.end);
            const bStart = timeToMins(tech.hours.breakStart);
            const bEnd = timeToMins(tech.hours.breakEnd);

            if (m < tStart || (m + durationMins) > tEnd) continue;
            // Overlaps lunch break?
            if (m < bEnd && (m + durationMins) > bStart) continue;

            // Check overlap with existing appointments + user's provisional appointments
            const allAppts = STATE.existingAppointments.concat(STATE.myAppointments);
            const hasConflict = allAppts.some(ap => {
              if (ap.dateISO !== dateISO || ap.techId !== tech.id) return false;
              const apStart = timeToMins(ap.start || ap.timeSlot);
              const apEnd = apStart + ap.durationMins + SALON_CONFIG.bufferMinutes;
              return m < apEnd && (m + requiredWithBuffer) > apStart;
            });

            if (!hasConflict) {
              availableTechForSlot = tech;
              break;
            }
          }

          slots.push({
            time: slotLabel,
            available: Boolean(availableTechForSlot),
            assignedTechName: availableTechForSlot ? availableTechForSlot.name : 'Booked / Break'
          });
        }

        return { closed: false, reason: '', slots };
      }

      function calculateCartTotals() {
        const itemsDetailed = STATE.cart.map(item => {
          const product = SHOP_PRODUCTS.find(p => p.id === item.productId) || SHOP_PRODUCTS[0];
          return {
            ...item,
            product,
            lineTotalKES: product.priceKES * item.qty
          };
        });
        const subtotalKES = itemsDetailed.reduce((s, x) => s + x.lineTotalKES, 0);
        const deliveryKES = itemsDetailed.length === 0 ? 0 : (
          STATE.cartDeliveryZone === 'pickup' ? 0 : (STATE.cartDeliveryZone === 'nairobi-express' ? 350 : 650)
        );
        const discountKES = (STATE.cartPromoCode.trim().toUpperCase() === 'BLUSHSHOP10') ? Math.round(subtotalKES * 0.10) : 0;
        const totalKES = Math.max(0, subtotalKES + deliveryKES - discountKES);
        return { itemsDetailed, subtotalKES, deliveryKES, discountKES, totalKES };
      }

                <span class="kicker"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
                <h1 class="section-title" style="margin-bottom:1rem;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></h1>
                <p style="font-size:0.95rem;color:var(--charcoal-muted);line-height:1.75;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></p>
                <div style="margin-top:1.5rem;">
                  <a href="#/booking" class="btn btn-primary btn-sm"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:78%"></span></a>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      function renderOwnerConfigView() {
        return `
          ${renderBreadcrumbs([{ label: 'Home', href: '#/home' }, { label: 'Owner Studio Configuration (Prototype)', href: '#/owner-config' }])}
          <section class="section-pad">
            <div class="container">
              <span class="kicker"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></span>
              <h1 class="section-title"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></h1>
              <div class="notice-box warn" style="margin:1rem 0 2rem;">
                <strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:46%"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></div>
              <div class="card" style="padding:1.75rem;max-width:760px;">
                <div class="form-group">
                  <label class="form-label" for="own-name"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></label>
                  <input type="text" id="own-name" class="form-input" oninput="window.App.updateOwnerConfig('brandName', this.value)" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="own-addr"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:68%"></span></label>
                  <input type="text" id="own-addr" class="form-input" oninput="window.App.updateOwnerConfig('addressPlaceholder', this.value)" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="own-phone"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:62%"></span></label>
                  <input type="text" id="own-phone" class="form-input" oninput="window.App.updateOwnerConfig('phonePlaceholder', this.value)" />
                </div>
                <button type="button" class="btn btn-primary btn-sm" onclick="window.location.hash='#/home'"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></button>
              </div>
            </div>
          </section>
        `;
      }

      /* ========================================================================
         20 & 21. ROUTER, PUBLIC CONTROLLER & AUTOMATIC GSAP / SCROLLTRIGGER INIT
         ======================================================================== */
      let activeGsapTriggers = [];

      function cleanupGsap() {
        if (window.ScrollTrigger) {
          activeGsapTriggers.forEach(t => { if (t && t.kill) t.kill(); });
          activeGsapTriggers = [];
        }
      }

      function initGsapAnimations() {
        const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReduced || !window.gsap) return;

        if (window.ScrollTrigger) {
          window.gsap.registerPlugin(window.ScrollTrigger);
        }

        cleanupGsap();

        const heroEl = document.querySelector('.gsap-hero');
        if (heroEl) {
          window.gsap.fromTo(heroEl, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.65, ease: 'power2.out' });
        }

        const heroImg = document.querySelector('.gsap-hero-img');
        if (heroImg) {
          window.gsap.fromTo(heroImg, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.75, delay: 0.1, ease: 'power2.out' });
        }

        const cards = document.querySelectorAll('.gsap-reveal');
        cards.forEach((card, idx) => {
          if (window.ScrollTrigger) {
            const anim = window.gsap.fromTo(card,
              { opacity: 0, y: 16 },
              {
                opacity: 1,
                y: 0,
                duration: 0.5,
                delay: (idx % 3) * 0.06,
                ease: 'power2.out',
                scrollTrigger: {
                  trigger: card,
                  start: 'top 92%'
                }
              }
            );
            if (anim.scrollTrigger) activeGsapTriggers.push(anim.scrollTrigger);
          }
        });
      }

      function updateHeaderBadges() {
        const cartBtn = document.getElementById('header-cart-btn');
        if (cartBtn) {
          const count = STATE.cart.reduce((s, i) => s + i.qty, 0);
          cartBtn.textContent = 'Bag (' + count + ')';
        }
        const wishEl = document.getElementById('header-wishlist-count');
        if (wishEl) {
          wishEl.textContent = 'Saved Designs (' + STATE.wishlist.length + ')';
        }
      }

      function populateDirectoryDrawer() {
        const container = document.getElementById('directory-links-container');
        if (!container) return;
        container.innerHTML = STUDIO_SCREENS.map(sc => `
          <a class="subnav-item" style="padding:0.25rem 0;" onclick="window.App.toggleDirectoryDrawer(false)">
            <span class="tabular-price" style="color:var(--rose-ink);font-weight:600;"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:46%"></span></span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></a>
        `).join('');
      }

      function renderRoute() {
        const rawHash = window.location.hash || '#/home';
        const path = rawHash.replace(/^#/, '') || '/home';
        STATE.currentRoute = path;

        const main = document.getElementById('main-view');
        if (!main) return;

        let html = '';
        if (path === '/home' || path === '/') {
          html = renderHomeView();
        } else if (path === '/services') {
          html = renderServicesView('');
        } else if (path.startsWith('/services/')) {
          const slug = path.split('/')[2];
          html = renderServicesView(slug);
        } else if (path === '/pricing') {
          html = renderPricingView();
        } else if (path === '/gallery') {
          html = renderGalleryView();
        } else if (path.startsWith('/design/')) {
          html = renderDesignDetailView(path.split('/')[2]);
        } else if (path === '/shapes-guide') {
          html = renderShapesGuideView();
        } else if (path === '/care-guide') {
          html = renderCareGuideView();
        } else if (path === '/technicians') {
          html = renderTechniciansView();
        } else if (path.startsWith('/technician/')) {
          html = renderTechnicianDetailView(path.split('/')[2]);
        } else if (path === '/booking') {
          html = renderBookingView();
        } else if (path === '/calendar') {
          html = renderCalendarView();
        } else if (path === '/booking-review') {
          html = renderBookingReviewView();
        } else if (path === '/payment-status') {
          html = renderPaymentStatusView();
        } else if (path === '/booking-confirmation') {
          html = renderBookingConfirmationView();
        } else if (path === '/appointments') {
          html = renderAppointmentsView();
        } else if (path === '/offers') {
          html = renderOffersView();
        } else if (path.startsWith('/offer/')) {
          html = renderOfferDetailView(path.split('/')[2]);
        } else if (path === '/shop') {
          html = renderShopView();
        } else if (path.startsWith('/product/')) {
          html = renderProductDetailView(path.split('/')[2]);
        } else if (path === '/cart') {
          html = renderCartView();
        } else if (path === '/checkout') {
          html = renderCheckoutView();
        } else if (path === '/gift-cards') {
          html = renderGiftCardsView();
        } else if (path === '/account') {
          html = renderAccountView();
        } else if (path === '/wishlist') {
          html = renderWishlistView();
        } else if (path === '/about') {
          html = renderAboutView();
        } else if (path === '/contact') {
          html = renderContactView();
        } else if (path === '/faq') {
          html = renderFaqView();
        } else if (path === '/aftercare') {
          html = renderAftercareView();
        } else if (path === '/privacy' || path === '/terms' || path === '/cancellation-policy') {
          html = renderPolicyView(path.slice(1));
        } else if (path === '/owner-config') {
          html = renderOwnerConfigView();
        } else {
          html = renderHomeView();
        }

        main.innerHTML = html;
        updateHeaderBadges();
        window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
        requestAnimationFrame(initGsapAnimations);
      }

      /* ========================================================================
         PUBLIC INTERACTIVE CONTROLLER (window.App)
         ======================================================================== */
      window.App = {
        toggleDirectoryDrawer(open) {
          const dr = document.getElementById('directory-drawer');
          if (dr) dr.classList.toggle('open', Boolean(open));
        },
        setServiceSearch(q) {
          STATE.serviceSearchQuery = q;
          renderRoute();
        },
        setGalleryFilter(type, val) {
          if (type === 'tag') STATE.galleryFilterTag = val;
          if (type === 'shape') STATE.galleryFilterShape = val;
          if (type === 'length') STATE.galleryFilterLength = val;
          renderRoute();
        },
        resetGalleryFilters() {
          STATE.galleryFilterTag = 'All';
          STATE.galleryFilterShape = 'all';
          STATE.galleryFilterLength = 'all';
          renderRoute();
        },
        toggleWishlist(designId) {
          const idx = STATE.wishlist.indexOf(designId);
          if (idx >= 0) STATE.wishlist.splice(idx, 1);
          else STATE.wishlist.push(designId);
          renderRoute();
        },
        startBookingWithService(serviceId) {
          const srv = getServiceById(serviceId);
          STATE.booking.primaryServiceId = srv.id;
          if (!srv.compatibleShapes.includes(STATE.booking.shapeId)) {
            STATE.booking.shapeId = srv.compatibleShapes[0];
          }
          if (!srv.compatibleLengths.includes(STATE.booking.lengthId)) {
            STATE.booking.lengthId = srv.compatibleLengths[0];
          }
          if (!srv.compatibleFinishes.includes(STATE.booking.finishId)) {
            STATE.booking.finishId = srv.compatibleFinishes[0];
          }
          STATE.booking.step = 2;
          window.location.hash = '#/booking';
        },
        bookDesign(designId) {
          const d = getDesignById(designId);
          if (d) {
            STATE.booking.selectedDesignId = d.id;
            STATE.booking.noElaborateArt = false;
            STATE.booking.primaryServiceId = d.compatibleServiceIds[0] || 'srv-g3';
            STATE.booking.shapeId = d.shape;
            STATE.booking.lengthId = d.length;
            STATE.booking.step = 3;
          }
          window.location.hash = '#/booking';
        },
        bookDesignWithService(designId, serviceId) {
          STATE.booking.selectedDesignId = designId;
          STATE.booking.noElaborateArt = false;
          this.startBookingWithService(serviceId);
        },
        selectShapeAndBook(shapeId) {
          STATE.booking.shapeId = shapeId;
          STATE.booking.step = 3;
          window.location.hash = '#/booking';
        },
        bookWithTechnician(techId) {
          STATE.booking.technicianId = techId;
          STATE.booking.step = 5;
          window.location.hash = '#/booking';
        },
        applyOfferAndBook(offerId) {
          const o = OFFERS_DATA.find(x => x.id === offerId);
          if (o) {
            STATE.booking.promoCode = o.code;
            STATE.booking.primaryServiceId = o.serviceIdToBook;
            STATE.booking.step = 3;
          }
          window.location.hash = '#/booking';
        },
        setBookingStep(stepNum) {
          STATE.booking.step = Math.max(1, Math.min(10, Number(stepNum) || 1));
          if (window.location.hash !== '#/booking') {
            window.location.hash = '#/booking';
          } else {
            renderRoute();
          }
        },
        nextBookingStep() {
          if (STATE.booking.step === 7) {
            this.validateStep7AndContinue();
            return;
          }
          this.setBookingStep(STATE.booking.step + 1);
        },
        updateBookingField(field, value) {
          STATE.booking[field] = value;
          const srv = getServiceById(STATE.booking.primaryServiceId);
          if (!srv.compatibleShapes.includes(STATE.booking.shapeId)) STATE.booking.shapeId = srv.compatibleShapes[0];
          if (!srv.compatibleLengths.includes(STATE.booking.lengthId)) STATE.booking.lengthId = srv.compatibleLengths[0];
          if (!srv.compatibleFinishes.includes(STATE.booking.finishId)) STATE.booking.finishId = srv.compatibleFinishes[0];
          renderRoute();
        },
        selectNoArt() {
          STATE.booking.noElaborateArt = true;
          STATE.booking.selectedDesignId = '';
          renderRoute();
        },
        selectDesignInBooking(designId) {
          STATE.booking.noElaborateArt = false;
          STATE.booking.selectedDesignId = designId;
          renderRoute();
        },
        toggleBookingExtra(extraId) {
          const arr = STATE.booking.selectedExtraIds;
          const idx = arr.indexOf(extraId);
          if (idx >= 0) arr.splice(idx, 1);
          else arr.push(extraId);
          renderRoute();
        },
        selectBookingDate(dateISO) {
          if (dateISO < "2") return;
          STATE.booking.dateISO = dateISO;
          renderRoute();
        },
        pickSlotFromCalendar(slotTime) {
          STATE.booking.timeSlot = slotTime;
          STATE.booking.step = 7;
          window.location.hash = '#/booking';
        },
        updateCustomerField(field, val) {
          STATE.booking.customer[field] = val;
        },
        validateStep7AndContinue() {
          const c = STATE.booking.customer;
          const errs = {};
          if (!c.name || c.name.trim().length < 2) errs.name = 'Please enter your full name.';
          const phoneClean = (c.phone || '').replace(/\s+/g, '');
          if (!/^(\+?254|0)[17]\d{8}$/.test(phoneClean)) {
            errs.phone = "Enter a valid Kenyan mobile number (e.g.,  or ).";
          }
          if (!c.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)) {
            errs.email = 'Enter a valid email address for your booking summary.';
          }
          STATE.booking.validationErrors = errs;
          if (Object.keys(errs).length > 0) {
            renderRoute();
            return;
          }
          this.setBookingStep(8);
        },
        submitBookingProvisional() {
          const calc = calculateBookingBreakdown();
          const b = STATE.booking;
          const techObj = getTechById(b.technicianId);
          const refCode = 'BT-PROV-' + Math.floor(100 + Math.random() * 900);
          STATE.myAppointments.unshift({
            ref: refCode,
            createdAt: "2",
            primaryServiceId: calc.primary.id,
            serviceName: calc.primary.name + (calc.secondary ? ' + ' + calc.secondary.name : ''),
            designTitle: calc.design ? calc.design.title : 'Clean Natural Finish',
            techId: techObj ? techObj.id : 'tech-1',
            techName: techObj ? techObj.name : 'Next Available Qualified Specialist',
            dateISO: b.dateISO,
            timeSlot: b.timeSlot,
            durationMins: calc.totalDurationMins,
            totalKES: calc.totalKES,
            depositRequiredKES: calc.depositKES,
            depositPaidKES: 0,
            balanceKES: calc.totalKES,
            paymentMethodLabel: b.paymentOption + ' (Pending Backend Verification)',
            status: 'Provisional — Awaiting Server & Payment Verification'
          });
          this.setBookingStep(10);
        },
        rescheduleAppointment(idx) {
          const ap = STATE.myAppointments[idx];
          if (ap) {
            STATE.booking.primaryServiceId = ap.primaryServiceId || 'srv-g3';
            STATE.booking.dateISO = ap.dateISO;
            STATE.booking.step = 5;
            window.location.hash = '#/booking';
          }
        },
        cancelAppointment(idx) {
          if (STATE.myAppointments[idx]) {
            STATE.myAppointments[idx].status = 'Cancellation Requested (Local Session — Requires Server Acceptance)';
            renderRoute();
          }
        },
        quickAddToCart(productId) {
          const p = SHOP_PRODUCTS.find(x => x.id === productId);
          if (!p) return;
          const existing = STATE.cart.find(i => i.productId === productId);
          if (existing) existing.qty = Math.min(p.maxQty, existing.qty + 1);
          else STATE.cart.push({ productId, variant: p.variants[0], qty: 1 });
          updateHeaderBadges();
          window.location.hash = '#/cart';
        },
        addProductFromDetail(productId) {
          const p = SHOP_PRODUCTS.find(x => x.id === productId);
          const selEl = document.getElementById('prd-var-select');
          const variant = selEl ? selEl.value : (p ? p.variants[0] : 'Standard');
          const existing = STATE.cart.find(i => i.productId === productId && i.variant === variant);
          if (existing) existing.qty = Math.min(p.maxQty, existing.qty + 1);
          else STATE.cart.push({ productId, variant, qty: 1 });
          updateHeaderBadges();
          window.location.hash = '#/cart';
        },
        updateCartQty(idx, delta) {
          const item = STATE.cart[idx];
          if (!item) return;
          item.qty += delta;
          if (item.qty <= 0) STATE.cart.splice(idx, 1);
          renderRoute();
        },
        removeCartItem(idx) {
          STATE.cart.splice(idx, 1);
          renderRoute();
        },
        setCartDelivery(zone) {
          STATE.cartDeliveryZone = zone;
          renderRoute();
        },
        setCartPromo(code) {
          STATE.cartPromoCode = code;
          renderRoute();
        },
        updateCheckoutField(field, val) {
          STATE.checkoutCustomer[field] = val;
        },
        submitProductOrder() {
          const c = calculateCartTotals();
          STATE.lastProductOrder = {
            ref: 'BT-ORD-' + Math.floor(1000 + Math.random() * 9000),
            totalKES: c.totalKES
          };
          renderRoute();
        },
        setGiftAmount(amt) {
          STATE.giftCardDraft.amountKES = amt;
          renderRoute();
        },
        setGiftField(field, val) {
          STATE.giftCardDraft[field] = val;
        },
        updateOwnerConfig(field, val) {
          SALON_CONFIG[field] = val;
        }
      };

      /* ========================================================================
         22. ACCESSIBILITY KEYBOARD HANDLING & INITIALISATION ON LOAD
         ======================================================================== */
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          window.App.toggleDirectoryDrawer(false);
        }
      });

      window.addEventListener('hashchange', renderRoute);

      function bootstrapStudioApp() {
        populateDirectoryDrawer();
        renderRoute();
        window.addEventListener('load', function () {
          initGsapAnimations();
          if (window.ScrollTrigger) window.ScrollTrigger.refresh();
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrapStudioApp);
      } else {
        bootstrapStudioApp();
      }
    })();
  </script>
