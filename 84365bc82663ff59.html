  <style>
    /* Design Tokens & Reset */
    :root {
      --color-primary: var(--theme-veluna-grand-electronics-retail-store-color-01);
      --color-surface: var(--theme-veluna-grand-electronics-retail-store-color-02);
      --color-canvas: var(--theme-veluna-grand-electronics-retail-store-color-03);
      --color-border: var(--theme-veluna-grand-electronics-retail-store-color-04);
      --color-text-main: var(--theme-veluna-grand-electronics-retail-store-color-05);
      --color-text-muted: var(--theme-veluna-grand-electronics-retail-store-color-06);
      --color-slate-banner: var(--theme-veluna-grand-electronics-retail-store-color-07);
      --color-ivory-banner: var(--theme-veluna-grand-electronics-retail-store-color-08);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-canvas);
      color: var(--color-text-main);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--theme-veluna-grand-electronics-retail-store-color-09);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--theme-veluna-grand-electronics-retail-store-color-10);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-veluna-grand-electronics-retail-store-color-11);
    }

    /* Typography Utilities */
    .tracking-tight-headings {
      letter-spacing: -0.035em;
    }

    /* Hide horizontal scroll indicators */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Card & Image Styling */
    .product-card {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s ease;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px -8px var(--theme-veluna-grand-electronics-retail-store-color-12);
      border-color: var(--theme-veluna-grand-electronics-retail-store-color-10);
    }

    /* Swatch dot */
    .swatch-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--theme-veluna-grand-electronics-retail-store-color-13);
      box-shadow: 0 0 0 1px var(--theme-veluna-grand-electronics-retail-store-color-14);
      display: inline-block;
      transition: transform 0.15s ease;
    }
    .swatch-dot:hover {
      transform: scale(1.2);
    }

    /* Watermark text effect */
    .watermark-text {
      position: absolute;
      font-size: clamp(4rem, 15vw, 13rem);
      font-weight: 800;
      line-height: 0.8;
      pointer-events: none;
      user-select: none;
      opacity: 0.06;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: -0.05em;
    }

    /* Toast Animation */
    @keyframes slideInUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-anim {
      animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Image zoom on hover */
    .zoom-img-container {
      overflow: hidden;
    }
    .zoom-img-container img {
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .product-card:hover .zoom-img-container img {
      transform: scale(1.04);
    }

    /* Range slider custom thumb */
    input[type=range] {
      accent-color: var(--theme-veluna-grand-electronics-retail-store-color-01);
    }
  </style>

    // --- 3. CURRENCY FORMATTER ---
    function formatMoney(amountUSD) {
      if (STATE.currency === 'KES') {
        const kes = Math.round(amountUSD * CONFIG.exchangeRateKES);
        return 'KES ' + kes.toLocaleString();
      }
      return '$' + amountUSD.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function toggleCurrency() {
      STATE.currency = STATE.currency === 'USD' ? 'KES' : 'USD';
      localStorage.setItem('veluna_currency', STATE.currency);
      const label = document.getElementById('current-currency-label');
      if (label) label.textContent = STATE.currency === 'USD' ? 'USD ($)' : 'KES (Sh)';
      renderRoute();
      showToast(`Switched currency to ${STATE.currency}`);
    }

    function updateBadges() {

      if (compareBar && compareBarCount && compareBarThumbs) {

    function addToCart(productId, variant = null, color = null, qty = 1, showDrawer = true) {
      const product = PRODUCTS.find(p => p.id === productId);
      if (!product) return;

      const chosenVariant = variant || (product.variants && product.variants.length > 0 ? product.variants[0] : 'Standard');
      const chosenColor = color || (product.colors && product.colors.length > 0 ? product.colors[0].name : 'Default');

      const existingIndex = STATE.cart.findIndex(item => 
        item.id === productId && item.variant === chosenVariant && item.color === chosenColor
      );

      if (existingIndex > -1) {
        STATE.cart[existingIndex].quantity += qty;
      } else {
        STATE.cart.push({
          id: productId,
          name: product.name,
          brand: product.brand,
          price: product.price,
          image: product.image,
          category: product.category,
          variant: chosenVariant,
          color: chosenColor,
          quantity: qty
        });
      }

      saveState('cart');
      updateBadges();
      showToast(`Added ${product.name} to cart`);
      if (showDrawer) toggleCartDrawer(true);
    }

    function updateCartQuantity(index, delta) {
      if (!STATE.cart[index]) return;
      STATE.cart[index].quantity += delta;
      if (STATE.cart[index].quantity <= 0) {
        STATE.cart.splice(index, 1);
      }
      saveState('cart');
      updateBadges();
      // If we are on the /cart page, re-render it
      if (window.location.hash.startsWith('#/cart')) {
        renderRoute();
      }
    }

    function removeFromCart(index) {
      if (!STATE.cart[index]) return;
      const name = STATE.cart[index].name;
      STATE.cart.splice(index, 1);
      saveState('cart');
      updateBadges();
      showToast(`Removed ${name} from cart`, 'trash-2');
      if (window.location.hash.startsWith('#/cart')) {
        renderRoute();
      }
    }

    function toggleWishlist(productId) {
      const index = STATE.wishlist.indexOf(productId);
      const prod = PRODUCTS.find(p => p.id === productId);
      const name = prod ? prod.name : 'Product';
      if (index > -1) {
        STATE.wishlist.splice(index, 1);
        showToast(`Removed ${name} from wishlist`, 'heart-off');
      } else {
        STATE.wishlist.push(productId);
        showToast(`Saved ${name} to wishlist`, 'heart');

      saveState('wishlist');
      updateBadges();
      renderRoute();
    }

      buttons.forEach(b => {

      pdpSelectedColor = colorName;

      showToast(`Selected color: ${colorName}`);
    }

    function changePDPQty(delta) {
      const input = document.getElementById('pdp-qty-input');
      if (!input) return;
      let val = parseInt(input.value, 10) + delta;
      if (val < 1) val = 1;
      if (val > 10) val = 10;
      input.value = val;
    }

    function handlePDPAddToCart(productId) {
      const qtyInput = document.getElementById('pdp-qty-input');
      const qty = qtyInput ? parseInt(qtyInput.value, 10) : 1;
      addToCart(productId, pdpSelectedVariant, pdpSelectedColor, qty, true);

    function handlePDPBuyNow(productId) {
      const qtyInput = document.getElementById('pdp-qty-input');
      const qty = qtyInput ? parseInt(qtyInput.value, 10) : 1;
      addToCart(productId, pdpSelectedVariant, pdpSelectedColor, qty, false);
      window.location.hash = '#/checkout';

    function togglePaymentInputs(method) {
      const cardBox = document.getElementById('card-payment-details');

      if (method === 'card') {
        cardBox.classList.remove('hidden');
        mpesaBox.classList.add('hidden');
      } else {
        cardBox.classList.add('hidden');
        mpesaBox.classList.remove('hidden');
      }

    function handleCheckoutSubmit(e) {
      e.preventDefault();
      const orderId = 'VLN-' + Math.floor(100000 + Math.random() * 900000);
      let subtotal = 0;
      STATE.cart.forEach(item => subtotal += (item.price * item.quantity));
      const total = subtotal + (subtotal * CONFIG.taxRate);

      const newOrder = {
        id: orderId,
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        items: [...STATE.cart],
        total: total,
        status: 'Confirmed & Processing',
        trackingNumber: 'TRK-' + Math.floor(10000000 + Math.random() * 90000000)
      };

      STATE.orders.unshift(newOrder);
      STATE.cart = [];
      saveState('orders');
      saveState('cart');
      updateBadges();

      window.location.hash = `#/order-success/${orderId}`;
    }

    // --- 23. HASH ROUTER ENGINE ---
    function renderRoute() {
      const hash = window.location.hash || '#/';
      const appRoot = document.getElementById('app-root');
      if (!appRoot) return;

      // Scroll smoothly to top on navigation
      window.scrollTo({ top: 0, behavior: 'instant' });

      // Clean up previous GSAP ScrollTriggers to prevent duplicate handlers
      if (window.ScrollTrigger) {
        ScrollTrigger.getAll().forEach(t => t.kill());
      }

      if (hash === '#/' || hash === '' || hash === '#/home') {
        appRoot.innerHTML = renderHomePage();
      } else if (hash.startsWith('#/category/')) {
        const catId = hash.replace('#/category/', '').split('?')[0];
        appRoot.innerHTML = renderCategoryPage(catId);
      } else if (hash === '#/brands') {
        appRoot.innerHTML = renderBrandsPage();
      } else if (hash.startsWith('#/brand/')) {
        const brandId = hash.replace('#/brand/', '').split('?')[0];
        appRoot.innerHTML = renderBrandPage(brandId);
      } else if (hash.startsWith('#/product/')) {
        const prodId = hash.replace('#/product/', '').split('?')[0];
        appRoot.innerHTML = renderProductDetailPage(prodId);
      } else if (hash.startsWith('#/search')) {
        const params = new URLSearchParams(hash.split('?')[1] || '');
        const query = params.get('q') || '';
        appRoot.innerHTML = renderSearchResultsPage(query);
      } else if (hash === '#/compare') {
        appRoot.innerHTML = renderComparePage();
      } else if (hash === '#/wishlist') {
        appRoot.innerHTML = renderWishlistPage();
      } else if (hash === '#/cart') {
        appRoot.innerHTML = renderCartPage();
      } else if (hash === '#/checkout') {
        appRoot.innerHTML = renderCheckoutPage();
      } else if (hash.startsWith('#/order-success/')) {
        const orderId = hash.replace('#/order-success/', '').split('?')[0];
        appRoot.innerHTML = renderOrderSuccessPage(orderId);
      } else if (hash.startsWith('#/account')) {
        appRoot.innerHTML = renderAccountPage();
      } else if (hash === '#/deals') {
        appRoot.innerHTML = renderDealsPage();
      } else if (hash === '#/support' || hash === '#/contact' || hash === '#/shipping' || hash === '#/returns' || hash === '#/terms' || hash === '#/privacy') {
        appRoot.innerHTML = renderSupportPage();
      } else {
        appRoot.innerHTML = `
          <div class="max-w-xl mx-auto py-24 px-4 text-center">
            <h1 class="text-4xl font-extrabold text-gray-900"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:8%"></span></h1>
            <p class="text-sm text-gray-500 mt-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>
            <a href="#/" class="inline-block mt-4 px-6 py-2.5 bg-black text-white text-xs font-bold rounded-full"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:30%"></span></a>
          </div>
        `;
      }

      // Re-initialize Lucide Icons across all dynamic elements
      if (window.lucide) {
        lucide.createIcons();
      }

      // Initialize GSAP Animations on newly rendered view
      initGSAPAnimations();
    }

    // --- 24. GSAP & SCROLLTRIGGER ANIMATION SYSTEM ---
    function initGSAPAnimations() {
      // Respect user's motion preferences
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      if (!window.gsap) return;

      try {
        if (window.ScrollTrigger) {
          gsap.registerPlugin(ScrollTrigger);
        }

        // Hero entrance animation
        const heroText = document.querySelector('.hero-text-block');
        const heroImg = document.querySelector('.hero-image-block');
        if (heroText && heroImg) {
          gsap.from(heroText.children, {
            y: 24,
            opacity: 0,
            duration: 0.8,
            stagger: 0.12,
            ease: 'power3.out'
          });
          gsap.from(heroImg, {
            scale: 0.94,
            opacity: 0,
            duration: 0.9,
            ease: 'power3.out',
            delay: 0.2
          });
        }

        // Section ScrollTrigger reveals
        if (window.ScrollTrigger) {
          const cards = document.querySelectorAll('.product-card');
          if (cards.length > 0) {
            ScrollTrigger.batch(cards, {
              onEnter: batch => gsap.from(batch, {
                opacity: 0,
                y: 20,
                stagger: 0.08,
                duration: 0.6,
                ease: 'power2.out',
                overwrite: true
              }),
              once: true
            });
          }
        }
      } catch (err) {
        console.warn('GSAP animation skipped:', err);
      }
    }

    // --- 25. INITIALIZATION ---
    window.addEventListener('hashchange', renderRoute);
    window.addEventListener('DOMContentLoaded', () => {
      updateBadges();
      renderRoute();

    // Keyboard shortcut (Cmd+K or Ctrl+K) to open search modal

        e.preventDefault();
        openSearchModal();
      }
      if (e.key === 'Escape') {
        closeSearchModal();
        toggleCartDrawer(false);
      }
    });
  </script>
