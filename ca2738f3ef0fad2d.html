  <!-- Tailwind CSS via CDN for rapid atomic styling + Deep luxury custom styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#080808',
            'obsidian-light': '#121111',
            espresso: '#171210',
            plum: '#1d0e17',
            burgundy: '#230c16',
            'gold-light': '#eed9b8',
            'gold-antique': '#c5a880',
            'gold-deep': '#9b7e56',
            champagne: '#e9dfd0',
            ivory: '#f8f5ee',
            'charcoal-border': '#292524'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            cinzel: ['"Cinzel"', 'serif'],
            sans: ['"Montserrat"', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Absolute Luxury Custom Art Direction */
    :root {
      --bg-dark: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-01);
      --gold-primary: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-02);
      --gold-highlight: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-03);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-heading: 'Cinzel', serif;
      --font-sans: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-04);
      font-family: var(--font-sans);
      overflow-x: hidden;
      selection-background-color: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-02);
      selection-color: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-01);
    }

    ::selection {
      background: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-02);
      color: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-01);
    }

    /* Subtle luxury scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-01);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-05);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-02);
    }

    /* Editorial Typography */
    .font-cormorant { font-family: var(--font-serif); }
    .font-cinzel { font-family: var(--font-heading); }
    .gold-gradient-text {
      background: linear-gradient(135deg, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-03) 0%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-02) 50%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-06) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .metallic-border {
      border: 1px solid var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-07);
    }
    .metallic-border-subtle {
      border: 1px solid var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-08);
    }

    /* Atmospheric Gradients */
    .bg-gradient-radial-dark {
      background: radial-gradient(circle at 50% 30%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-09) 0%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-10) 60%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-01) 100%);
    }
    .bg-gradient-hero {
      background: linear-gradient(180deg, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-11) 0%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-12) 40%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-13) 100%);
    }
    .bg-diagonal-luxury {
      background: linear-gradient(135deg, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-14) 0%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-15) 50%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-16) 100%);
    }
    .bg-ivory-editorial {
      background-color: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-17);
      color: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-14);
    }

    /* Sculptural Bottle Glow */
    .bottle-glow {
      position: absolute;
      width: 380px;
      height: 520px;
      background: radial-gradient(circle, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-18) 0%, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-19) 60%, transparent 80%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 1;
    }

    /* Non-rectangular sculptural masks */
    .mask-arch {
      clip-path: ellipse(50% 50% at 50% 50%);
    }
    .mask-oval-portrait {
      clip-path: ellipse(48% 50% at 50% 50%);
    }
    .mask-diagonal-slanted {
      clip-path: polygon(0 8%, 100% 0, 100% 92%, 0 100%);
    }

    /* Glassmorphism */
    .glass-luxury {
      background: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-20);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-21);
    }
    .glass-drawer {
      background: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-22);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    /* Grain Texture Overlay */
    .noise-overlay {
      position: fixed;
      inset: 0;
      opacity: 0.025;
      pointer-events: none;
      z-index: 999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='none'/%3E%3C/svg%3E");
    }

    /* Interactive button ripples & transitions */
    .btn-luxury {
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-luxury:hover {
      box-shadow: 0 0 25px var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-07);
    }
    .btn-luxury::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-23), transparent);
      transition: left 0.7s ease;
    }
    .btn-luxury:hover::after {
      left: 100%;
    }

    /* Pyramid Accord visualization */
    .pyramid-tier {
      transition: all 0.3s ease;
      position: relative;
    }
    .pyramid-tier:hover {
      transform: scale(1.02);
      border-color: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-02);
    }

    /* Custom engraving preview animation */
    .engraved-text {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.25em;
      color: var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-24);
      text-shadow: 0 1px 2px var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-25), 0 0 1px var(--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-26);
    }

    /* Reduced Motion Accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

-niche-fragrances-18-place-vendo-color-16:#1d0e17;--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-17:#f7f4ee;--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-18:rgba(197,168,128,0.18);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-19:rgba(197,168,128,0.02);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-20:rgba(18,17,17,0.75);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-21:rgba(197,168,128,0.15);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-22:rgba(12,11,10,0.94);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-23:rgba(238,217,184,0.2);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-24:rgba(238,217,184,0.85);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-25:rgba(0,0,0,0.8);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-26:rgba(197,168,128,0.5);--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-27:#d1d5db;--theme-maison-alchemie-haute-parfumerie-niche-fragrances-18-place-vendo-color-28:#f3f4f6;}</style></head>

<body class="antialiased text-[#e2ded9] bg-[#080808]">
  <!-- Noise Texture -->
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- ANNOUNCEMENT BANNER -->
  <aside class="bg-[#120f0e] border-b border-[#24201c] text-[#a89f91] text-xs py-2 px-4 text-center tracking-widest uppercase flex items-center justify-center gap-4">
    <span class="hidden sm:inline"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 62%;"></span></span>
    <span class="hidden sm:inline text-[#c5a880] text-opacity-50"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
    <span class="text-[#c5a880]"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 96%;"></span></span>
    <span class="hidden md:inline text-[#c5a880] text-opacity-50"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
    <button onclick="app.openView('concierge')" class="hidden md:inline text-[#eed9b8] underline underline-offset-4 hover:text-white transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 46%;"></span></button>
  </aside>

  <!-- LUXURY FLOATING HEADER -->
  <header id="main-header" class="sticky top-0 z-40 bg-[#080808]/90 backdrop-blur-md border-b border-[#221f1c] transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      
      <!-- Mobile Menu Button & Search Trigger -->
      <div class="flex items-center gap-5">
        <button id="menu-toggle-btn" onclick="app.toggleMobileMenu()" class="lg:hidden text-[#c5a880] p-1.5 focus:outline-none focus-visible:ring-1 focus-visible:ring-[#c5a880]">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <button onclick="app.openSearchModal()" class="flex items-center gap-2 text-xs tracking-widest text-[#a89f91] hover:text-[#eed9b8] transition-colors uppercase">
          <i data-lucide="search" class="w-4 h-4 text-[#c5a880]"></i>
          <span class="hidden sm:inline"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 32%;"></span></span>
        </button>
      </div>

      <!-- Brand Monogram & Wordmark -->
      <div class="text-center cursor-pointer" onclick="app.openView('home')">
        <div class="font-cinzel text-xs tracking-[0.3em] text-[#c5a880] uppercase mb-0.5"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 43%;"></span></div>
        <h1 class="font-cinzel text-xl sm:text-2xl md:text-3xl tracking-[0.22em] text-[#f4efe8] font-medium uppercase"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 41%;"></span></h1>
        <div class="text-[9px] tracking-[0.35em] text-[#8e8577] uppercase hidden sm:block"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 43%;"></span></div>
      </div>

      <!-- Action Utilities: Currency, Wishlist, Account, Bag -->
      <div class="flex items-center gap-4 sm:gap-6">
        <!-- Currency Selector -->
        <div class="relative hidden md:block">
          <select id="currency-select" onchange="app.changeCurrency(this.value)" class="bg-transparent text-xs text-[#a89f91] hover:text-[#eed9b8] cursor-pointer focus:outline-none border-none tracking-widest uppercase pr-2">
            <option value="EUR" class="bg-[#121111] text-[#f4efe8]"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></option>
            <option value="USD" selected="" class="bg-[#121111] text-[#f4efe8]"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></option>
            <option value="GBP" class="bg-[#121111] text-[#f4efe8]"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></option>
            <option value="NGN" class="bg-[#121111] text-[#f4efe8]"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></option>
          </select>
        </div>

        <!-- Wishlist -->
        <button onclick="app.openView('wishlist')" class="relative text-[#a89f91] hover:text-[#eed9b8] p-1 transition-colors">
          <i data-lucide="heart" class="w-5 h-5"></i>
          <span id="wishlist-badge" class="absolute -top-1 -right-1 text-[9px] w-4 h-4 rounded-full bg-[#c5a880] text-black font-semibold flex items-center justify-center hidden"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
        </button>

        <!-- Account -->
        <button onclick="app.openAccountModal()" class="text-[#a89f91] hover:text-[#eed9b8] p-1 transition-colors">
          <i data-lucide="user" class="w-5 h-5"></i>
        </button>

        <!-- Shopping Bag Trigger -->
        <button onclick="app.toggleCartDrawer(true)" class="flex items-center gap-2 p-1 text-[#f4efe8] hover:text-[#eed9b8] transition-colors focus:outline-none focus-visible:ring-1 focus-visible:ring-[#c5a880]">
          <div class="relative">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-[#c5a880]"></i>
            <span id="cart-badge" class="absolute -top-1.5 -right-2 text-[10px] w-4 h-4 rounded-full bg-[#eed9b8] text-[#080808] font-bold flex items-center justify-center"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
          </div>
          <span id="header-cart-total" class="hidden lg:inline text-xs tracking-wider text-[#eed9b8] font-medium"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
        </button>
      </div>

    </div>

    <!-- Desktop Navigation Bar -->
    <nav class="hidden lg:block border-t border-[#1b1816] bg-[#0a0909]/95">
      <ul class="max-w-6xl mx-auto px-6 h-12 flex items-center justify-center gap-10 text-[11px] tracking-[0.2em] uppercase text-[#b8afa3]">
        <li><a href="#signature" onclick="app.navigateCategory('all'); return false;" class="hover:text-[#eed9b8] transition-colors py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 32%;"></span></a></li>
        <li><a href="#collections" onclick="app.openView('collections'); return false;" class="hover:text-[#eed9b8] transition-colors py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 30%;"></span></a></li>
        <li><a href="#discovery" onclick="app.openView('discovery'); return false;" class="hover:text-[#eed9b8] transition-colors py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 38%;"></span></a></li>
        <li><a href="#fragrance-finder" onclick="app.openView('finder'); return false;" class="text-[#c5a880] hover:text-[#eed9b8] transition-colors py-2 font-medium"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 49%;"></span></a></li>
        <li><a href="#comparison" onclick="app.openView('comparison'); return false;" class="hover:text-[#eed9b8] transition-colors py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 43%;"></span></a></li>
        <li><a href="#gifting" onclick="app.openView('gifting'); return false;" class="hover:text-[#eed9b8] transition-colors py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 51%;"></span></a></li>
        <li><a href="#craftsmanship" onclick="app.openView('craftsmanship'); return false;" class="hover:text-[#eed9b8] transition-colors py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 51%;"></span></a></li>
        <li><a href="#journal" onclick="app.openView('journal'); return false;" class="hover:text-[#eed9b8] transition-colors py-2"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 19%;"></span></a></li>
      </ul>
    </nav>
  </header>

          gsap.registerPlugin(ScrollTrigger);
          // Hero entrance timeline
          const tl = gsap.timeline();
          tl.from('#hero-badge', { opacity: 0, y: -20, duration: 1, ease: 'power3.out' })
            .from('#hero-headline', { opacity: 0, y: 30, duration: 1.2, ease: 'power3.out' }, '-=0.6')

            .from('#hero-cta', { opacity: 0, y: 20, duration: 0.8, ease: 'power3.out' }, '-=0.6');

          // Parallax for floating bottle and background
          gsap.to('#hero-floating-bottle', {
            scrollTrigger: {
              trigger: '#hero-section',
              start: 'top top',
              end: 'bottom top',
              scrub: 1.2
            },
            y: 80,
            scale: 0.96
          });
        }
      },

      formatPrice(amountInUSD) {
        const rate = appState.rates[appState.currency] || 1;
        const sym = appState.symbols[appState.currency] || '$';
        const converted = Math.round(amountInUSD * rate);
        return `${sym}${converted.toLocaleString()}`;
      },

        this.renderView(appState.currentView);
        this.updateHeaderCartBadge();
        this.showToast(`Currency adjusted to ${curr}`);

        appState.currentView = viewName;
        if (params.productId) appState.selectedProductId = params.productId;
        this.renderView(viewName, params);
        if (window.lucide) setTimeout(() => lucide.createIcons(), 50);
      },

      navigateCategory(cat) {
        appState.currentCategory = cat;
        this.openView('catalog');
      },

      showToast(msg, isSuccess = true) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = `p-4 bg-[#141211] border ${isSuccess ? 'border-[#c5a880]' : 'border-red-800'} text-[#f4efe8] text-xs font-serif shadow-2xl flex items-center gap-3 transform translate-y-4 opacity-0 transition-all duration-300 pointer-events-auto`;
        toast.innerHTML = `
          <i data-lucide="${isSuccess ? 'sparkles' : 'alert-circle'}" class="w-4 h-4 text-[#c5a880]"></i>
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></span>
        `;
        container.appendChild(toast);
        if (window.lucide) lucide.createIcons();

        setTimeout(() => {
          toast.classList.remove('translate-y-4', 'opacity-0');
        }, 10);
        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 400);
        }, 4000);
      },

      // CART ACTIONS
      addToCart(productId, size = '50ml Flacon', engraving = '') {
        const prod = PRODUCTS.find(p => p.id === productId);
        if (!prod) return;

        const mult = prod.sizeMultipliers[size] || 1;
        const unitPrice = prod.prices.USD * mult;
        const existing = appState.cart.find(item => item.id === productId && item.size === size && item.engraving === engraving);

        if (existing) {
          existing.qty += 1;
        } else {
          appState.cart.push({
            id: prod.id,
            name: prod.name,
            subtitle: prod.subtitle,
            size: size,
            unitPrice: unitPrice,
            image: prod.image,
            qty: 1,
            engraving: engraving
          });
        }
        localStorage.setItem('maison_cart', JSON.stringify(appState.cart));
        this.updateHeaderCartBadge();
        this.renderCartDrawer();
        this.toggleCartDrawer(true);
        this.showToast(`${prod.name} (${size}) placed in shopping bag.`);

          return;

        localStorage.setItem('maison_cart', JSON.stringify(appState.cart));
        this.updateHeaderCartBadge();

        const list = document.getElementById('search-results-list');
        const q = query.trim().toLowerCase();
        if (q.length < 2) {
          list.innerHTML = `<p class="text-xs text-[#736a5e] italic"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:96%"></span></p>`;
          return;

        const matches = PRODUCTS.filter(p => {
          return p.name.toLowerCase().includes(q) ||
                 p.family.toLowerCase().includes(q) ||
                 p.familyDetailed.toLowerCase().includes(q) ||
                 p.description.toLowerCase().includes(q) ||
                 p.topNotes.some(n => n.toLowerCase().includes(q)) ||
                 p.heartNotes.some(n => n.toLowerCase().includes(q)) ||
                 p.baseNotes.some(n => n.toLowerCase().includes(q));
        });

        if (matches.length === 0) {
          list.innerHTML = `

    // CHECKOUT PROCESSOR WITH PAYSTACK REAL GATEWAY OR VERIFIED SIMULATION
    app.processCheckoutOrder = function(e) {
      e.preventDefault();
      if (appState.cart.length === 0) {
        app.showToast('Your bag is empty.');
        return;
      }

      const email = document.getElementById('checkout-email').value;
      const fname = document.getElementById('checkout-fname').value;
      const lname = document.getElementById('checkout-lname').value;
      const subtotal = appState.cart.reduce((sum, item) => sum + (item.unitPrice * item.qty), 0);
      let discount = 0;
      if (appState.appliedVoucher) {
        discount = subtotal * (appState.appliedVoucher.percent / 100);
      }
      const totalAmount = Math.max(0, subtotal - discount);
      const orderRef = 'MA-' + Math.floor(100000 + Math.random() * 900000);

      // Check if Paystack script is present and valid key is set
      const pubKey = appState.paystackPublicKey;
      const isRealKey = pubKey && pubKey.startsWith('pk_');

      if (window.PaystackPop && isRealKey && pubKey !== 'pk_test_sample_maison_key_demo') {
        // Real Paystack Inline popup
        const handler = PaystackPop.setup({
          key: pubKey,
          email: email,
          amount: Math.round(totalAmount * (appState.currency === 'NGN' ? 1 : 100)), // kobo or cents
          currency: appState.currency === 'NGN' ? 'NGN' : 'USD',
          ref: orderRef,
          metadata: {
            custom_fields: [
              { display_name: "Client Name", variable_name: "client_name", value: `${fname} ${lname}` },
              { display_name: "Flacons Count", variable_name: "flacons_count", value: appState.cart.length }
            ]
          },
          callback: function(response) {
            // Payment verified by Paystack
            app.finalizeOrder(orderRef, totalAmount, response.reference || orderRef);
          },
          onClose: function() {
            app.showToast('Payment window closed. Transaction preserved in pending state.');
          }
        });
        handler.openIframe();
      } else {
        // High-Fidelity Luxury Simulation Mode (Transparent demonstration)
        app.showToast('Initializing Paystack Transaction Gateway...');
        setTimeout(() => {
          app.finalizeOrder(orderRef, totalAmount, 'PSTK-' + orderRef);
        }, 1200);
      }
    };

    app.finalizeOrder = function(orderId, total, pRef) {
      const order = {
        id: orderId,
        reference: pRef,
        date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
        total: total,
        itemsCount: appState.cart.reduce((s, i) => s + i.qty, 0),
        status: 'Confirmed & In Grasse Cold Cellar'
      };

      appState.orders.unshift(order);
      localStorage.setItem('maison_orders', JSON.stringify(appState.orders));
      appState.cart = [];
      localStorage.setItem('maison_cart', JSON.stringify([]));
      app.updateHeaderCartBadge();
      app.openView('confirmation', { orderId: orderId });
      app.showToast(`Order ${orderId} verified and confirmed!`);
    };

    app.queryOrderTracking = function() {
      const ref = document.getElementById('track-ref-input').value;
      app.showToast(`Status updated for commission ${ref}`);
    };

    // Initialize application on DOM ready
    window.addEventListener('DOMContentLoaded', () => {
      app.init();
    });
  </script>
