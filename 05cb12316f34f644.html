  <style>
    /* CSS DESIGN TOKENS & SYSTEM */
    :root {
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-brand: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      
      --color-canvas: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-01);
      --color-canvas-subtle: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-02);
      --color-surface: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-03);
      --color-surface-elevated: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-03);
      
      --color-champagne: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-04);
      --color-champagne-light: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-05);
      --color-gold: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-06);
      --color-gold-hover: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-07);
      --color-sand: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-08);
      --color-taupe: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-09);
      --color-mocha: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-10);
      
      --color-text-main: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-11);
      --color-text-muted: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-12);
      --color-text-light: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-13);
      --color-text-inverse: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-03);
      
      --color-border: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-14);
      --color-border-hover: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-15);
      --color-border-focus: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-06);
      
      --color-success: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-16);
      --color-success-bg: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-17);
      --color-warning: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-18);
      --color-warning-bg: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-19);
      --color-error: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-20);
      --color-error-bg: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-21);
      
      --shadow-subtle: 0 4px 20px -2px var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-22);
      --shadow-elevated: 0 16px 36px -4px var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-14);
      --shadow-modal: 0 24px 60px -8px var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-23);
      
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      
      --transition-fast: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: 320ms cubic-bezier(0.16, 1, 0.3, 1);
      --transition-deliberate: 550ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--color-canvas);
      color: var(--color-text-main);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      background-color: var(--color-canvas);
    }

    /* SCROLL PROGRESS BAR */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-04), var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-06), var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-07));
      z-index: 1000;
      transition: width 0.1s ease-out;
    }

    /* TYPOGRAPHY */
    h1, h2, h3, h4, .font-serif {
      font-family: var(--font-display);
      font-weight: 400;
      line-height: 1.15;
      color: var(--color-text-main);
      text-wrap: balance;
    }

    .font-brand {
      font-family: var(--font-brand);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      border: none;
      background: none;
      outline: none;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* BUTTON STYLES */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: var(--radius-sm);
      transition: all var(--transition-smooth);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-primary {
      background-color: var(--color-text-main);
      color: var(--color-text-inverse);
      box-shadow: 0 4px 14px var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-24);
    }

    .btn-primary:hover {
      background-color: var(--color-mocha);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-15);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-06), var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-07));
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-03);
      box-shadow: 0 4px 16px var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-25);
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-26), var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-27));
      transform: translateY(-2px);
      box-shadow: 0 6px 22px var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-28);
    }

    .btn-outline {
      border: 1px solid var(--color-border-hover);
      color: var(--color-text-main);
      background: transparent;
    }

    .btn-outline:hover {
      border-color: var(--color-text-main);
      background-color: var(--color-text-main);
      color: var(--color-text-inverse);
    }

    .btn-text {
      padding: 0.5rem 0;
      color: var(--color-text-main);
      font-weight: 500;
      position: relative;
    }

    .btn-text::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: currentColor;
      transform: scaleX(1);
      transform-origin: left;
      transition: transform var(--transition-smooth);
    }

    .btn-text:hover::after {
      transform: scaleX(0.7);
    }

    /* TOP ANNOUNCEMENT BAR */
    .top-announcement {
      background-color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-29);
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-04);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.5rem 1.5rem;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      border-bottom: 1px solid var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-30);
      z-index: 101;
    }

    .top-announcement span {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* TOP BAR CONTRACT: Brand — 4-5 Nav Links — 1 Primary Action */
    .site-header {
      position: sticky;
      top: 0;
      background: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-31);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--color-border);
      z-index: 100;
      transition: all var(--transition-smooth);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    /* Zone 1: Single text element wordmark */
    .brand-wordmark {
      font-family: var(--font-brand);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--color-text-main);
      white-space: nowrap;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-wordmark:hover {
      color: var(--color-gold);
    }

    /* Zone 2: 4-5 single-line clean nav links */
    .primary-nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      white-space: nowrap;
    }

    .nav-link {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      position: relative;
      padding: 0.25rem 0;
      transition: color var(--transition-fast);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--color-text-main);
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background-color: var(--color-gold);
      transition: width var(--transition-fast);
    }

    .nav-link:hover::after, .nav-link.active::after {
      width: 100%;
    }

    /* Zone 3: Header Actions (Cart, Wishlist, Primary Book CTA) */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .icon-action-btn {
      position: relative;
      padding: 0.5rem;
      color: var(--color-text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      transition: color var(--transition-fast);
    }

    .icon-action-btn:hover {
      color: var(--color-gold);
    }

    .badge-count {
      position: absolute;
      top: 0;
      right: -2px;
      background-color: var(--color-text-main);
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-32);
      font-size: 0.625rem;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .mobile-menu-toggle {
      display: none;
      background: none;
      border: none;
      padding: 0.5rem;
      color: var(--color-text-main);
    }

    /* SCREEN ROUTER CONTAINERS */
    #main-content {
      flex: 1;
      width: 100%;
      min-height: calc(100vh - 180px);
    }

    .screen-view {
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .screen-view.active {
      display: block;
      opacity: 1;
    }

    /* GENERIC CONTAINER WRAPPERS */
    .container-wide {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .container-reading {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .section-spacing {
      padding: 5.5rem 0;
    }

    .section-header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 3.5rem auto;
    }

    .eyebrow-text {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-gold);
      margin-bottom: 0.75rem;
      display: block;
    }

    .section-title {
      font-size: clamp(2rem, 3.5vw, 3.25rem);
      margin-bottom: 1rem;
      color: var(--color-text-main);
      line-height: 1.15;
    }

    .section-subtitle {
      font-size: 1rem;
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    /* FOOTER */
    .site-footer {
      background-color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-29);
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-01);
      padding: 5rem 0 2.5rem 0;
      border-top: 1px solid var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-33);
      margin-top: auto;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr;
      gap: 3rem;
      margin-bottom: 4rem;
    }

    .footer-brand-title {
      font-family: var(--font-brand);
      font-size: 1.25rem;
      letter-spacing: 0.18em;
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-01);
      margin-bottom: 1.25rem;
    }

    .footer-brand-desc {
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-34);
      font-size: 0.875rem;
      line-height: 1.65;
      margin-bottom: 1.75rem;
      max-width: 320px;
    }

    .footer-col-title {
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-04);
      margin-bottom: 1.25rem;
    }

    .footer-links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .footer-links-list a {
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-34);
      font-size: 0.875rem;
      transition: color var(--transition-fast);
    }

    .footer-links-list a:hover {
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-32);
    }

    .footer-newsletter-input {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .newsletter-field {
      flex: 1;
      padding: 0.75rem 1rem;
      background: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-35);
      border: 1px solid var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-36);
      border-radius: var(--radius-sm);
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-32);
      font-size: 0.8125rem;
    }

    .newsletter-field::placeholder {
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-09);
    }

    .footer-bottom {
      border-top: 1px solid var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-37);
      padding-top: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-09);
    }

    /* BACK TO TOP */
    #back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 44px;
      height: 44px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-elevated);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all var(--transition-smooth);
      z-index: 90;
    }

    #back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #back-to-top:hover {
      transform: translateY(-3px);
      background: var(--color-text-main);
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-32);
    }

    /* TOAST NOTIFICATION */
    #toast-notification {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-29);
      color: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-01);
      padding: 0.85rem 1.75rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-modal);
      border: 1px solid var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-38);
      font-size: 0.875rem;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #toast-notification.active {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 1024px) {
      .primary-nav {
        display: none;
      }
      .mobile-menu-toggle {
        display: block;
      }
      .footer-grid {
        grid-template-columns: 1fr 1fr;
        gap: 2.5rem;
      }
    }

    @media (max-width: 640px) {
      .header-inner {
        padding: 0.85rem 1rem;
      }
      .footer-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .section-spacing {
        padding: 3.5rem 0;
      }
      .footer-bottom {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
    }

    /* MOBILE DRAWER */
    #mobile-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--theme-maison-elysee-haute-coiffure-luxury-salon-beauty-atelier-color-39);
      backdrop-filter: blur(8px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-smooth);
    }

    #mobile-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-content {
      position: absolute;
      top: 0;
      right: 0;
      width: 85%;
      max-width: 360px;
      height: 100%;
      background: var(--color-canvas);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-modal);
      transform: translateX(100%);
      transition: transform var(--transition-smooth);
    }

    const updateHeaderBadges = () => {
      const cartCount = state.cart.reduce((sum, item) => sum + item.quantity, 0);
      const wishCount = state.wishlist.size;

      const cartBadge = document.getElementById("cart-counter");
      if (cartBadge) {
        cartBadge.textContent = cartCount;
        cartBadge.style.display = cartCount > 0 ? "flex" : "none";
      }

      const wishBadge = document.getElementById("wishlist-counter");
      if (wishBadge) {

      getBookingDraft: () => state.bookingDraft,

      setBookingDraft: (data) => {
        state.bookingDraft = { ...state.bookingDraft, ...data };
      },

      addToCart: (productId, variant = "Default Size", quantity = 1) => {
        const product = MaisonData.PRODUCTS.find(p => p.id === productId);
        if (!product) return;

        const existingIndex = state.cart.findIndex(i => i.product.id === productId && i.variant === variant);
        if (existingIndex > -1) {
          state.cart[existingIndex].quantity += quantity;
        } else {
          state.cart.push({ product, variant, quantity });
        }
        saveCart();
        updateHeaderBadges();
        window.MaisonApp.showToast(`Added ${product.name} to cart`);
      },

      removeFromCart: (index) => {
        state.cart.splice(index, 1);
        saveCart();
        updateHeaderBadges();
      },

      updateCartQty: (index, qty) => {
        if (qty <= 0) {
          state.cart.splice(index, 1);
        } else {
          state.cart[index].quantity = qty;
        }
        saveCart();
        updateHeaderBadges();
      },

      clearCart: () => {
        state.cart = [];
        saveCart();
        updateHeaderBadges();
      },

      toggleWishlist: (productId) => {
        const product = MaisonData.PRODUCTS.find(p => p.id === productId);
        if (!product) return;

        if (state.wishlist.has(productId)) {
          state.wishlist.delete(productId);
          window.MaisonApp.showToast(`Removed from wishlist`);
        } else {
          state.wishlist.add(productId);
          window.MaisonApp.showToast(`Saved ${product.name} to wishlist`);
        }
        saveWish();
        updateHeaderBadges();
      },

      addAppointment: (apptData) => {
        state.appointments.unshift(apptData);
        saveAppts();
      },

      cancelAppointment: (apptId) => {
        const appt = state.appointments.find(a => a.id === apptId);
        if (appt) {
          appt.status = "Cancelled (Refund Initiated)";
          saveAppts();
          window.MaisonApp.showToast(`Appointment ${apptId} cancellation request logged`);
        }
      },

      updateHeaderBadges
    };
  })();

  window.PaystackService = (function() {

    /**
     * Executes Paystack checkout for Appointments or Boutique Products
     */
    const initializePayment = ({ email, amountKES, metadata, purpose = "Appointment Deposit", onSuccess, onCancel }) => {
      const amountInKobo = Math.round(amountKES * 100);
      const reference = "PSTK_" + purpose.substring(0, 3).toUpperCase() + "_" + Date.now();

      // Check if official PaystackPop library is loaded in window
      if (typeof window.PaystackPop !== "undefined" && window.PaystackPop.setup && !isLiveBackendConnected) {
        // Attempt official Paystack Inline popup
        try {
          const handler = window.PaystackPop.setup({
            key: publicKey,
            email: email || "",
            amount: amountInKobo,
            currency: "KES",
            ref: reference,
            metadata: {
              custom_fields: [
                { display_name: "Purpose", variable_name: "purpose", value: purpose },
                { display_name: "Maison Booking Ref", variable_name: "maison_ref", value: metadata.bookingId || metadata.orderId || reference }
              ]
            },
            callback: function(response) {
              // Real callback received from Paystack popup
              if (onSuccess) onSuccess({ ...response, reference, amountKES });
            },
            onClose: function() {
              if (onCancel) onCancel();
            }
          });
          handler.openIframe();
          return;

          console.warn("Paystack popup fallback to simulated secure test verification:", e);

  window.MaisonApp = {
    currentBookingStep: 1,
    selectedGiftAmount: 10000,

    init: function() {
      // Setup initial navigation and router
      window.addEventListener("hashchange", () => MaisonRouter.route());
      MaisonRouter.route();

      // Setup scroll progress indicator
      window.addEventListener("scroll", () => {
        const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        const bar = document.getElementById("scroll-progress");
        if (bar) bar.style.width = scrolled + "%";

        const backBtn = document.getElementById("back-to-top");
        if (backBtn) {
          if (winScroll > 400) {
            backBtn.classList.add("visible");
          } else {
            backBtn.classList.remove("visible");
          }
        }
      });

      // Back to top button
      const backBtn = document.getElementById("back-to-top");
      if (backBtn) {
        backBtn.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      // Mobile drawer handlers
      const mobileToggle = document.getElementById("mobile-toggle");
      const mobileDrawer = document.getElementById("mobile-drawer");

    initGSAP: function() {
      if (typeof window.gsap !== "undefined") {
        try {
          if (typeof window.ScrollTrigger !== "undefined") {
            gsap.registerPlugin(ScrollTrigger);
          }

          // If hero is present on initial load, animate
          const heroTitle = document.querySelector(".hero-title");
          if (heroTitle) {
            const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
            tl.from(".hero-eyebrow", { y: -20, opacity: 0, duration: 0.6 })
              .from(".hero-title", { y: 30, opacity: 0, duration: 0.8 }, "-=0.3")
              .from(".hero-description", { y: 20, opacity: 0, duration: 0.7 }, "-=0.4")
              .from(".hero-cta-group", { y: 20, opacity: 0, duration: 0.6 }, "-=0.4")
              .from(".hero-kpis", { opacity: 0, duration: 0.6 }, "-=0.2")
              .from(".hero-image-frame", { scale: 0.95, opacity: 0, duration: 1 }, "-=0.7")
              .from(".hero-floating-card", { x: -30, opacity: 0, duration: 0.8 }, "-=0.5");

            // Hero image subtle parallax
            const heroImg = document.querySelector("#hero-main-image img");
            if (heroImg && window.ScrollTrigger) {
              gsap.to(heroImg, {
                yPercent: 15,
                ease: "none",
                scrollTrigger: {
                  trigger: ".hero-section",
                  start: "top top",
                  end: "bottom top",
                  scrub: true
                }
              });
            }
          }
        } catch (e) {
          console.warn("GSAP animation initialization notice:", e);
        }
      }
    },

      const msgEl = document.getElementById("toast-message");
      const iconEl = document.getElementById("toast-icon");

      if (toast && msgEl) {
        msgEl.textContent = message;
        if (iconEl) iconEl.textContent = icon;
        toast.classList.add("active");
        setTimeout(() => toast.classList.remove("active"), 3200);

    filterServices: function(category, btn) {
      const container = document.getElementById("services-catalogue-grid");
      const tabs = document.querySelectorAll("#services-filter-tabs .filter-tab-btn");
      tabs.forEach(t => t.classList.remove("active"));
      if (btn) btn.classList.add("active");

      if (!container) return;
      const cards = container.querySelectorAll(".service-card");
      let visibleCount = 0;

      cards.forEach(card => {
        const cat = card.getAttribute("data-category");
        if (category === "All" || cat === category) {
          card.style.display = "flex";
          visibleCount++;
        } else {
          card.style.display = "none";
        }
      });

      const countEl = document.getElementById("services-count");
      if (countEl) countEl.textContent = visibleCount;
    },

    filterShopCategory: function(category, btn) {
      const tabs = document.querySelectorAll("#shop-category-tabs .filter-tab-btn");
      tabs.forEach(t => t.classList.remove("active"));
      if (btn) btn.classList.add("active");

      const cards = document.querySelectorAll("#shop-catalogue-grid .product-card");
      let visibleCount = 0;

      cards.forEach(card => {
        const cat = card.getAttribute("data-category");
        if (category === "All" || cat === category) {
          card.style.display = "flex";
          visibleCount++;
        } else {
          card.style.display = "none";
        }
      });

      const counter = document.getElementById("shop-products-counter");

    sortShopProducts: function(sortType) {
      const grid = document.getElementById("shop-catalogue-grid");
      if (!grid) return;
      const cards = Array.from(grid.querySelectorAll(".product-card"));

      if (sortType === "price-asc") {
        cards.sort((a, b) => parseFloat(a.dataset.price) - parseFloat(b.dataset.price));
      } else if (sortType === "price-desc") {
        cards.sort((a, b) => parseFloat(b.dataset.price) - parseFloat(a.dataset.price));
      } else if (sortType === "name") {
        cards.sort((a, b) => a.dataset.name.localeCompare(b.dataset.name));
      }

      cards.forEach(card => grid.appendChild(card));
    },

      document.querySelectorAll(".wizard-stepper .step-item").forEach(item => {
        const itemStep = parseInt(item.getAttribute("data-step"));
        if (itemStep === step) {
          item.classList.add("active");
          item.classList.remove("completed");
        } else if (itemStep < step) {
          item.classList.remove("active");
          item.classList.add("completed");
        } else {
          item.classList.remove("active");
          item.classList.remove("completed");
        }
      });

      document.querySelectorAll(".wizard-step-panel").forEach(panel => panel.classList.remove("active"));

      if (targetPanel) targetPanel.classList.add("active");

  window.MaisonRouter = {
    route: function() {
      const hash = window.location.hash.slice(1) || "home";
      const [screenName, queryString] = hash.split("?");
      const params = {};

      if (queryString) {
        const pairs = queryString.split("&");
        pairs.forEach(pair => {
          const [k, v] = pair.split("=");
          if (k) params[k] = decodeURIComponent(v || "");
        });
      }

      const container = document.getElementById("screen-container");
      if (!container) return;

      // Update Navigation Active State
      document.querySelectorAll(".nav-link").forEach(link => {
        if (link.getAttribute("data-screen") === screenName) {
          link.classList.add("active");
        } else {
          link.classList.remove("active");
        }
      });

      // Match Route to View Renderer
      let html = "";
      if (screenName === "home" || screenName === "") {
        html = MaisonViews.home();
      } else if (screenName === "services") {
        html = MaisonViews.services();
      } else if (screenName === "service") {
        html = MaisonViews.service(params.id);
      } else if (screenName === "booking") {
        html = MaisonViews.booking(params);
      } else if (screenName === "stylists") {
        html = MaisonViews.stylists();
      } else if (screenName === "stylist") {
        html = MaisonViews.stylist(params.id);
      } else if (screenName === "availability") {
        html = MaisonViews.availability();
      } else if (screenName === "my-appointments") {
        html = MaisonViews["my-appointments"]();
      } else if (screenName === "shop") {
        html = MaisonViews.shop();
      } else if (screenName === "product") {
        html = MaisonViews.product(params.id);
      } else if (screenName === "search") {
        html = MaisonViews.search(params.q || "");
      } else if (screenName === "cart") {
        html = MaisonViews.cart();
      } else if (screenName === "wishlist") {
        html = MaisonViews.wishlist();
      } else if (screenName === "checkout") {
        html = MaisonViews.checkout();
      } else if (screenName === "packages") {
        html = MaisonViews.packages();
      } else if (screenName === "giftcards") {
        html = MaisonViews.giftcards();
      } else if (screenName === "gallery") {
        html = MaisonViews.gallery();
      } else if (screenName === "about") {
        html = MaisonViews.about();
      } else if (screenName === "contact") {
        html = MaisonViews.contact();
      } else if (screenName === "account") {
        html = MaisonViews.account();
      } else if (screenName === "faq") {
        html = MaisonViews.faq();
      } else if (screenName === "policies") {
        html = MaisonViews.policies(params.doc || "booking");
      } else {
        html = MaisonViews.notFound();
      }

      container.innerHTML = html;
      window.scrollTo(0, 0);

      // Re-trigger animations if on home view
      if (screenName === "home" || screenName === "") {
        setTimeout(() => MaisonApp.initGSAP(), 50);
      }
    },

    refresh: function() {
      MaisonRouter.route();
    }
  };

  // Launch on DOM ready
  document.addEventListener("DOMContentLoaded", () => {
    MaisonApp.init();
  });
