/* --- 8.3 CATEGORY -------------------------------------------------------- */
Views.category = function (params, query) {
  const cat = CATEGORY_SLUGS[params.slug];
  if (!cat) return Views.notfound();

  const subs = SUBCATEGORY_MAP[cat.slug] || [];
  const subParam = query.sub ? decodeURIComponent(query.sub) : null;

  let products = ProductService.byCategory(cat.slug);
  let activeSub = null;

  if (subParam) {
    activeSub = subs.filter(function (s) { return slugify(s) === subParam; })[0] || null;
    if (activeSub) products = products.filter(function (p) { return p.subcategory === activeSub; });
  }

  const filters = Object.assign({}, AppState.productFilters);
  if (activeSub) filters.subcategory = activeSub;

  const heading = activeSub ? cat.name + ' — ' + activeSub : cat.name;

  const relatedRecipes = RecipeService.all().filter(function (r) {
    const kw = (cat.name + ' ' + cat.slug).toLowerCase();
    return r.ingredients.join(' ').toLowerCase().indexOf(cat.slug.split('-')[0]) !== -1;
  }).slice(0, 3);

  const faqs = [
    ['How fresh is the ' + cat.name.toLowerCase() + '?', cat.buying_guide || 'Everything in this department is checked on arrival and again on the shelf.'],
    ['Can I get ' + cat.name.toLowerCase() + ' delivered?', 'Yes — ' + cat.name.toLowerCase() + ' is available for delivery from all stores within the delivery radius. Some items are collected-only.'],
    ['Do you have organic options?', 'Yes. Look for the Organic badge, or filter the list by dietary preference. We stock ' + ProductService.organic().length + ' certified organic lines across the store.']
  ];

  return '' +
  '<section style="background:var(--surface);border-bottom:1px solid var(--line)">' +
    '<div class="wrap">' +
      breadcrumb([{ label: 'Home', href: '#/home' }, { label: 'Shop', href: '#/shop' }, { label: cat.name, href: activeSub ? '#/category/' + cat.slug : null }, ...(activeSub ? [{ label: activeSub }] : [])]) +
    '</div>' +
  '</section>' +
  '<section class="sec-tight" style="background:var(--green);color:#F2EEE1;position:relative;overflow:hidden">' +
    '<div class="wrap" style="position:relative;z-index:2">' +
      '<div class="grid" style="grid-template-columns:1.3fr .7fr;gap:30px;align-items:center">' +
        '<div>' +
          '<div class="eyebrow" style="color:var(--leaf-2);margin-bottom:12px">' + esc(cat.department) + ' · ' + products.length + ' products</div>' +
          '<h1 class="display-lg" style="color:#fff">' + esc(heading) + '</h1>' +
          '<p style="color:rgba(242,238,225,.8);max-width:60ch;margin-top:14px">' + esc(cat.description) + '</p>' +
        '</div>' +
        '<div style="border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/11">' +
          imgTag('https://loremflickr.com/700/480/' + cat.image + '?lock=' + (hashStr(cat.slug) % 900), cat.name, '') +
        '</div>' +
      '</div>' +
      (subs.length ? '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:26px">' +
        '<a class="btn btn-sm ' + (!activeSub ? 'btn-amber' : 'btn-light') + '" href="#/category/' + cat.slug + '">All ' + esc(cat.name) + '</a>' +
        subs.map(function (s) {
          return '<a class="btn btn-sm ' + (activeSub === s ? 'btn-amber' : 'btn-light') + '" href="#/category/' + cat.slug + '?sub=' + slugify(s) + '">' + esc(s) + ' <span style="opacity:.7">(' + ProductService.subcategoryCount(cat.slug, s) + ')</span></a>';
        }).join('') +
      '</div>' : '') +
    '</div>' +
  '</section>' +

  '<section class="sec" style="background:var(--paper-2)">' +
    '<div class="wrap">' +
      '<div class="grid" style="grid-template-columns:1.4fr 1fr;gap:30px;margin-bottom:44px">' +
        '<div>' +
          '<h2 class="display-md" style="margin-bottom:14px">About this department</h2>' +
          '<p class="lede" style="font-size:.96rem">' + esc(cat.intro) + '</p>' +
        '</div>' +
        '<div class="card" style="background:var(--surface-2)">' +
          '<div class="eyebrow" style="margin-bottom:10px">Buying guide</div>' +
          '<p style="font-size:.9rem;color:var(--ink-2);margin:0">' + esc(cat.buying_guide) + '</p>' +
        '</div>' +
      '</div>' +
      renderListingBody({
        products: products,
        filters: filters,
        sort: AppState.productSort,
        page: AppState.productPage,
        view: AppState.productView,
        baseRoute: 'category/' + cat.slug + (activeSub ? '?sub=' + slugify(activeSub) : ''),
        showCategories: false,
        hideHeading: true
      }) +
    '</div>' +
  '</section>' +

  (relatedRecipes.length ? '<section class="sec" style="background:var(--surface);border-top:1px solid var(--line)">' +
    '<div class="wrap">' +
      '<div class="sec-head"><div class="t"><div class="eyebrow" style="margin-bottom:10px">Cook with it</div><h2 class="display-md">Recipes using ' + esc(cat.name.toLowerCase()) + '</h2></div>' +
      '<a class="btn btn-ghost" href="#/recipes">All recipes</a></div>' +
      '<div class="grid g-3">' + relatedRecipes.map(recipeCard).join('') + '</div>' +
    '</div>' +
  '</section>' : '') +

  '<section class="sec" style="background:var(--paper-2)">' +
    '<div class="wrap">' +
      '<div class="grid" style="grid-template-columns:1fr 1fr;gap:40px">' +
        '<div>' +
          '<h2 class="display-md" style="margin-bottom:20px">Questions about ' + esc(cat.name.toLowerCase()) + '</h2>' +
          '<div class="accordion">' + faqs.map(function (f, i) {
            return '<div class="acc-item"><button class="acc-head" data-action="accordion" aria-expanded="false">' + esc(f[0]) + '<span class="pl">+</span></button><div class="acc-body"><div class="acc-body-in">' + esc(f[1]) + '</div></div></div>';
          }).join('') + '</div>' +
        '</div>' +
        '<div>' +
          '<h2 class="display-md" style="margin-bottom:20px">Related departments</h2>' +
          '<div class="grid g-2">' +
            CATEGORY_SEED.filter(function (c) { return c[0] !== cat.slug; }).slice(0, 4).map(function (c) {
              return '<a class="card" href="#/category/' + c[0] + '"><h4 style="font-family:var(--f-body);font-size:.95rem;margin-bottom:6px">' + esc(c[1]) + '</h4><p style="font-size:.8rem;color:var(--ink-3);margin:0">' + ProductService.categoryCount(c[0]) + ' products</p></a>';
            }).join('') +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</section>';
};

/* --- listing renderer ---------------------------------------------------- */
function renderListing(opts) {
  return pageHeader({
    eyebrow: opts.eyebrow,
    title: opts.title,
    lede: opts.lede,
    breadcrumb: opts.trail ? '<div class="wrap">' + breadcrumb(opts.trail) + '</div>' : ''
  }) +
  '<section class="sec" style="background:var(--paper-2)">' +
    '<div class="wrap">' +
      renderListingBody(opts) +
    '</div>' +
  '</section>';
}

function renderListingBody(opts) {
  const storeId = AppState.selectedStoreId;
  const filters = opts.filters || {};
  let rows = FilterService.apply(opts.products, Object.assign({}, filters, { storeId: storeId }));
  rows = FilterService.sort(rows, opts.sort || 'popular');

  const total = rows.length;
  const perPage = CONFIG.productsPerPage;
  const page = Math.max(1, opts.page || 1);
  const pages = Math.max(1, Math.ceil(total / perPage));
  const current = Math.min(page, pages);
  const slice = rows.slice((current - 1) * perPage, current * perPage);

  const facets = FilterService.facets(opts.products);
  const activeChips = [];

  if (filters.brands && filters.brands.length) {
    filters.brands.forEach(function (b) {
      activeChips.push({ label: b, key: 'brands', value: b });
    });
  }
  if (filters.dietary && filters.dietary.length) {
    filters.dietary.forEach(function (d) { activeChips.push({ label: d, key: 'dietary', value: d }); });
  }
  if (filters.origins && filters.origins.length) {
    filters.origins.forEach(function (o) { activeChips.push({ label: o, key: 'origins', value: o }); });
  }
  if (filters.minPrice != null || filters.maxPrice != null) {
    activeChips.push({ label: money(filters.minPrice || 0) + ' – ' + money(filters.maxPrice || facets.maxPrice), key: 'price', value: null });
  }
  if (filters.minRating) activeChips.push({ label: filters.minRating + '★ and up', key: 'minRating', value: null });
  if (filters.onSale) activeChips.push({ label: 'On promotion', key: 'onSale', value: null });
  if (filters.organic) activeChips.push({ label: 'Organic', key: 'organic', value: null });
  if (filters.bestSeller) activeChips.push({ label: 'Best sellers', key: 'bestSeller', value: null });
  if (filters.newProduct) activeChips.push({ label: 'New arrivals', key: 'newProduct', value: null });
  if (filters.inStockOnly) activeChips.push({ label: 'In stock at ' + currentStoreName(), key: 'inStockOnly', value: null });
  if (filters.deliveryOnly) activeChips.push({ label: 'Delivery eligible', key: 'deliveryOnly', value: null });
  if (filters.pickupOnly) activeChips.push({ label: 'Pickup eligible', key: 'pickupOnly', value: null });

  const sidebar =
    '<aside class="filters" id="filterPanel" aria-label="Product filters">' +
      '<div class="fgroup" style="display:flex;justify-content:space-between;align-items:center">' +
        '<strong style="font-size:.95rem">Filters</strong>' +
        '<button class="link-btn" data-action="clear-filters">Clear all</button>' +
      '</div>' +

      '<div class="fgroup">' +
        '<h4>Availability</h4>' +
        '<label class="fopt"><input type="checkbox" data-filter="inStockOnly"' + (filters.inStockOnly ? ' checked' : '') + ' /> In stock at ' + esc(currentStoreName()) + '</label>' +
        '<label class="fopt"><input type="checkbox" data-filter="onSale"' + (filters.onSale ? ' checked' : '') + ' /> On promotion</label>' +
        '<label class="fopt"><input type="checkbox" data-filter="deliveryOnly"' + (filters.deliveryOnly ? ' checked' : '') + ' /> Delivery eligible</label>' +
        '<label class="fopt"><input type="checkbox" data-filter="pickupOnly"' + (filters.pickupOnly ? ' checked' : '') + ' /> Click &amp; Collect eligible</label>' +
      '</div>' +

      '<div class="fgroup">' +
        '<h4>Price</h4>' +
        '<div class="range-row">' +
          '<input type="number" min="0" placeholder="Min" data-price="min" value="' + (filters.minPrice != null ? filters.minPrice : '') + '" aria-label="Minimum price" />' +
          '<span style="color:var(--ink-3)">–</span>' +
          '<input type="number" min="0" placeholder="Max" data-price="max" value="' + (filters.maxPrice != null ? filters.maxPrice : '') + '" aria-label="Maximum price" />' +
        '</div>' +
        '<button class="btn btn-ghost btn-sm btn-block" style="margin-top:10px" data-action="apply-price">Apply price range</button>' +
        '<div style="font-size:.74rem;color:var(--ink-3);margin-top:8px">This list runs from ' + money(facets.minPrice) + ' to ' + money(facets.maxPrice) + '.</div>' +
      '</div>' +

      '<div class="fgroup">' +
        '<h4>Customer rating</h4>' +
        [4.5,4,3.5,3].map(function (r) {
          return '<label class="fopt"><input type="radio" name="rating" data-filter-rating="' + r + '"' + (filters.minRating === r ? ' checked' : '') + ' /> ' + stars(r) + ' &amp; up</label>';
        }).join('') +
        '<label class="fopt"><input type="radio" name="rating" data-filter-rating=""' + (!filters.minRating ? ' checked' : '') + ' /> Any rating</label>' +
      '</div>' +

      (facets.dietary.length ? '<div class="fgroup">' +
        '<h4>Dietary</h4>' +
        facets.dietary.slice(0, 8).map(function (d) {
          const on = filters.dietary && filters.dietary.indexOf(d.name) !== -1;
          return '<label class="fopt"><input type="checkbox" data-filter-multi="dietary" value="' + esc(d.name) + '"' + (on ? ' checked' : '') + ' /> ' + esc(d.name) + '<span class="cnt">' + d.count + '</span></label>';
        }).join('') +
      '</div>' : '') +

      '<div class="fgroup">' +
        '<h4>Highlights</h4>' +
        '<label class="fopt"><input type="checkbox" data-filter="organic"' + (filters.organic ? ' checked' : '') + ' /> Organic only</label>' +
        '<label class="fopt"><input type="checkbox" data-filter="bestSeller"' + (filters.bestSeller ? ' checked' : '') + ' /> Best sellers</label>' +
        '<label class="fopt"><input type="checkbox" data-filter="newProduct"' + (filters.newProduct ? ' checked' : '') + ' /> New arrivals</label>' +
      '</div>' +

      (opts.showCategories ? '<div class="fgroup">' +
        '<h4>Department</h4>' +
        CATEGORY_SEED.map(function (c) {
          const on = filters.category === c[0];
          return '<label class="fopt"><input type="radio" name="cat" data-filter-category="' + c[0] + '"' + (on ? ' checked' : '') + ' /> ' + esc(c[1]) + '<span class="cnt">' + ProductService.categoryCount(c[0]) + '</span></label>';
        }).join('') +
        '<label class="fopt"><input type="radio" name="cat" data-filter-category=""' + (!filters.category ? ' checked' : '') + ' /> All departments</label>' +
      '</div>' : '') +

      '<div class="fgroup">' +
        '<h4>Brand</h4>' +
        '<input type="search" placeholder="Search brands" data-action="filter-brand-search" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);margin-bottom:8px;font-size:.84rem" aria-label="Search brands" />' +
        '<div style="max-height:230px;overflow:auto" id="brandList">' +
          facets.brands.slice(0, 30).map(function (b) {
            const on = filters.brands && filters.brands.indexOf(b.name) !== -1;
            return '<label class="fopt" data-brand-row="' + esc(b.name.toLowerCase()) + '"><input type="checkbox" data-filter-multi="brands" value="' + esc(b.name) + '"' + (on ? ' checked' : '') + ' /> ' + esc(b.name) + '<span class="cnt">' + b.count + '</span></label>';
          }).join('') +
        '</div>' +
      '</div>' +

      (facets.origins.length ? '<div class="fgroup">' +
        '<h4>Country of origin</h4>' +
        facets.origins.map(function (o) {
          const on = filters.origins && filters.origins.indexOf(o.name) !== -1;
          return '<label class="fopt"><input type="checkbox" data-filter-multi="origins" value="' + esc(o.name) + '"' + (on ? ' checked' : '') + ' /> ' + esc(o.name) + '<span class="cnt">' + o.count + '</span></label>';
        }).join('') +
      '</div>' : '') +
    '</aside>';

  const toolbar =
    '<div class="toolbar">' +
      '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<button class="btn btn-ghost btn-sm filters-desktop-toggle" data-action="open-filters" style="display:none">' + svg('plus', 15) + ' Filters</button>' +
        '<span style="font-size:.86rem;color:var(--ink-2);font-weight:600">' + total + ' ' + plural(total, 'product') + '</span>' +
        (activeChips.length ? '<div class="chips">' + activeChips.map(function (c) {
          return '<span class="chip">' + esc(c.label) + '<button data-action="remove-chip" data-key="' + c.key + '" data-value="' + esc(c.value || '') + '" aria-label="Remove filter">×</button></span>';
        }).join('') + '<button class="link-btn" data-action="clear-filters">Clear all</button></div>' : '') +
      '</div>' +
      '<div style="display:flex;gap:10px;align-items:center">' +
        '<label class="sr" for="sortSelect">Sort products</label>' +
        '<select class="select" id="sortSelect" data-action="sort-change">' +
          '<option value="popular"' + (opts.sort === 'popular' ? ' selected' : '') + '>Most popular</option>' +
          '<option value="price-asc"' + (opts.sort === 'price-asc' ? ' selected' : '') + '>Price: low to high</option>' +
          '<option value="price-desc"' + (opts.sort === 'price-desc' ? ' selected' : '') + '>Price: high to low</option>' +
          '<option value="rating"' + (opts.sort === 'rating' ? ' selected' : '') + '>Highest rated</option>' +
          '<option value="reviews"' + (opts.sort === 'reviews' ? ' selected' : '') + '>Most reviewed</option>' +
          '<option value="discount"' + (opts.sort === 'discount' ? ' selected' : '') + '>Biggest saving</option>' +
          '<option value="newest"' + (opts.sort === 'newest' ? ' selected' : '') + '>Newest first</option>' +
          '<option value="name"' + (opts.sort === 'name' ? ' selected' : '') + '>Name A–Z</option>' +
        '</select>' +
        '<div class="view-toggle" role="group" aria-label="View layout">' +
          '<button data-action="view-toggle" data-view="grid" class="' + (opts.view !== 'list' ? 'on' : '') + '" aria-label="Grid view" aria-pressed="' + (opts.view !== 'list') + '">' +
            "<svg width=\"16\" height=\"16\" viewBox=\"\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/></svg>" +
          '</button>' +
          '<button data-action="view-toggle" data-view="list" class="' + (opts.view === 'list' ? 'on' : '') + '" aria-label="List view" aria-pressed="' + (opts.view === 'list') + '">' +
            "<svg width=\"16\" height=\"16\" viewBox=\"\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"><path d=\"M4 6h16M4 12h16M4 18h16\"/></svg>" +
          '</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  const body = slice.length
    ? productGrid(slice, { layout: opts.view === 'list' ? 'list' : 'grid' })
    : '<div class="empty">' +
        '<div class="ic">' + svg('search', 30) + '</div>' +
        '<h3>No products match those filters</h3>' +
        '<p>Try removing a filter or widening your price range. We have ' + opts.products.length + ' products in this list.</p>' +
        '<button class="btn btn-primary" data-action="clear-filters">Clear all filters</button>' +
      '</div>';

  let pager = '';
  if (pages > 1) {
    const buttons = [];
    buttons.push('<button data-action="goto-page" data-page="' + (current - 1) + '"' + (current === 1 ? ' disabled' : '') + ' aria-label="Previous page">‹</button>');
    const start = Math.max(1, current - 2), end = Math.min(pages, start + 4);
    for (let i = start; i <= end; i++) {
      buttons.push('<button data-action="goto-page" data-page="' + i + '" class="' + (i === current ? 'on' : '') + '" aria-label="Page ' + i + '"' + (i === current ? ' aria-current="page"' : '') + '>' + i + '</button>');
    }
    buttons.push('<button data-action="goto-page" data-page="' + (current + 1) + '"' + (current === pages ? ' disabled' : '') + ' aria-label="Next page">›</button>');
    pager = '<nav class="pager" aria-label="Pagination">' + buttons.join('') + '</nav>';
  }

  return '<div class="shop-layout">' + sidebar + '<div>' + toolbar + body + pager + '</div></div>';
}

/* --- 8.4 PRODUCT DETAIL -------------------------------------------------- */
Views.product = function (params) {
  const p = ProductService.get(params.id);
  if (!p) return Views.notfound();

  RecentlyViewed.add(p.id);

  const storeId = AppState.selectedStoreId;
  const stockLevel = ProductService.stockAt(p, storeId);
  const stock = StoreService.stockLabel(stockLevel);
  const price = ProductService.effectivePrice(p);
  const qty = CartService.qtyOf(p.id);
  const wished = WishlistService.has(p.id);
  const cat = CATEGORY_SLUGS[p.category];
  const related = ProductService.related(p, 8);
  const fbt = ProductService.frequentlyBought(p, 6);
  const reviews = DB.query('SELECT * FROM reviews WHERE product_id = ?', [p.id]).slice(0, 6);
  const recent = RecentlyViewed.items().filter(function (x) { return x.id !== p.id; }).slice(0, 6);

  const gallery = [p.image, p.image2, p.image3, p.image4];

  const ratingDist = [5,4,3,2,1].map(function (s) {
    const count = Math.round(p.review_count * (s === 5 ? 0.52 : s === 4 ? 0.27 : s === 3 ? 0.13 : s === 2 ? 0.05 : 0.03));
    return { stars: s, count: count, pct: (count / Math.max(1, p.review_count)) * 100 };
  });

  const faqs = [
    ['Is this available at ' + esc(currentStoreName()) + '?', stockLevel === 0
      ? 'Not right now. It is stocked at several other Harvest Lane stores — try switching store, or we can notify you when it returns.'
      : stockLevel === 1
        ? 'Yes, but stock is low at this store. We would recommend ordering soon or choosing Click & Collect to reserve it.'
        : 'Yes — in stock now at ' + currentStoreName() + '.'],
    ['How is it delivered?', 'Standard delivery arrives in a temperature-controlled van within your selected window. Chilled and frozen items travel in insulated liners with ice packs.'],
    ['Can I return it?', 'Fresh and chilled items can be refunded within 24 hours if you are not happy. Ambient goods can be returned within 14 days, unopened. See our returns policy for full details.']
  ];

  return '' +
  '<div class="wrap">' + breadcrumb([
    { label: 'Home', href: '#/home' },
    { label: 'Shop', href: '#/shop' },
    { label: cat ? cat.name : p.category, href: '#/category/' + p.category },
    { label: p.subcategory, href: '#/category/' + p.category + '?sub=' + slugify(p.subcategory) },
    { label: p.name }
  ]) + '</div>' +

  '<section class="sec-tight" style="background:var(--paper-2)">' +
    '<div class="wrap">' +
      '<div class="pdp">' +
        '<div class="gallery">' +
          '<div class="gal-main">' + imgTag(gallery[0], p.name + ' by ' + p.brand, '', 'id="galMain"') + '</div>' +
          '<div class="gal-thumbs" role="group" aria-label="Product images">' +
            gallery.map(function (g, i) {
              return '<button class="' + (i === 0 ? 'on' : '') + '" data-action="gal-select" data-src="' + esc(g) + '" aria-label="View image ' + (i + 1) + '">' +
                imgTag(g, p.name + ' image ' + (i + 1), '') + '</button>';
            }).join('') +
          '</div>' +
        '</div>' +

        '<div>' +
          '<div class="eyebrow" style="margin-bottom:10px">' + esc(p.brand) + ' · ' + esc(p.subcategory) + '</div>' +
          '<h1 class="display-md">' + esc(p.name) + '</h1>' +
          '<div style="display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap">' +
            '<div style="display:flex;align-items:center;gap:7px">' + stars(p.rating) + '<span style="font-size:.86rem;font-weight:700">' + p.rating.toFixed(1) + '</span></div>' +
            '<a href="#reviews" style="font-size:.84rem;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px">' + p.review_count + ' reviews</a>' +
            '<span class="pc-stock ' + stock.cls + '" style="font-size:.8rem">' + stock.text + ' at ' + esc(currentStoreName()) + '</span>' +
          '</div>' +

          '<div class="pdp-price">' +
            (p.sale_price != null
              ? '<span class="now sale">' + money(p.sale_price) + '</span><span class="was">' + money(p.price) + '</span><span class="save">Save ' + p.discount_percentage + '%</span>'
              : '<span class="now">' + money(p.price) + '</span>') +
            '<span style="font-size:.88rem;color:var(--ink-3)">' + esc(p.unit) + '</span>' +
          '</div>' +
          '<div style="font-size:.78rem;color:var(--ink-3)">Including all applicable taxes. Price shown for ' + esc(currentStoreName()) + '.</div>' +

          '<p style="margin-top:20px;font-size:.94rem;color:var(--ink-2)">' + esc(p.description) + '</p>' +

          (p.dietary.length ? '<div class="svc" style="margin:16px 0">' + p.dietary.map(function (d) { return '<span>' + esc(d) + '</span>'; }).join('') + '</div>' : '') +

          '<div class="pdp-actions">' +
            (stockLevel === 0
              ? '<button class="btn btn-primary btn-lg" data-action="notify-me" data-id="' + p.id + '">Notify me when available</button>'
              : (qty > 0
                  ? '<div class="qty" style="height:56px">' +
                      '<button data-action="pdp-dec" data-id="' + p.id + '" aria-label="Decrease quantity">−</button>' +
                      '<input type="number" value="' + qty + '" min="1" max="99" data-action="pdp-qty" data-id="' + p.id + '" aria-label="Quantity" />' +
                      '<button data-action="pdp-inc" data-id="' + p.id + '" aria-label="Increase quantity">+</button>' +
                    '</div>' +
                    '<button class="btn btn-amber btn-lg" data-action="open-cart">In basket · ' + money(price * qty) + '</button>'
                  : '<button class="btn btn-primary btn-lg" data-action="pdp-add" data-id="' + p.id + '">Add to basket · ' + money(price) + '</button>')) +
            '<button class="btn btn-ghost btn-lg" data-action="buy-now" data-id="' + p.id + '">Buy now</button>' +
            '<button class="btn btn-ghost btn-lg" data-action="wish-toggle" data-id="' + p.id + '" aria-pressed="' + wished + '">' +
              svg('heart', 18) + (wished ? ' Saved' : ' Save') +
            '</button>' +
          '</div>' +

          '<div class="grid g-2" style="gap:12px;margin-bottom:22px">' +
            '<div class="card" style="padding:14px 16px;display:flex;gap:12px;align-items:center">' +
              '<span style="color:var(--green)">' + svg('truck', 19) + '</span>' +
              "<div style=\"font-size:.82rem\"><strong>Free delivery over </strong><br><span style=\"color:var(--ink-3)\">Otherwise  standard</span></div>" +
            '</div>' +
            '<div class="card" style="padding:14px 16px;display:flex;gap:12px;align-items:center">' +
              '<span style="color:var(--green)">' + svg('store', 19) + '</span>' +
              '<div style="font-size:.82rem"><strong>Click &amp; Collect</strong><br><span style="color:var(--ink-3)">Ready in 60 minutes</span></div>' +
            '</div>' +
          '</div>' +

          '<div class="accordion">' +
            accItem('Description', '<p>' + esc(p.description) + '</p><p style="margin:0">Sold as ' + esc(p.unit) + '. Country of origin: ' + esc(p.origin) + '. SKU: ' + esc(p.sku) + '.</p>', true) +
            accItem('Specifications', specTable(p)) +
            accItem('Nutrition &amp; ingredients', nutritionBlock(p)) +
            accItem('Storage &amp; preparation', '<p>' + storageAdvice(p) + '</p>') +
            accItem('Delivery &amp; returns', '<p>Standard delivery is free on orders over ' + money(CONFIG.freeDeliveryThreshold) + ', otherwise ' + money(CONFIG.standardDeliveryFee) + '. Express delivery within 90 minutes is available for ' + money(CONFIG.expressDeliveryFee) + ' in selected postcodes.</p><p style="margin:0">Fresh and chilled items can be refunded within 24 hours if you are not satisfied. Ambient goods can be returned unopened within 14 days. <a href="#/returns" style="text-decoration:underline">Read the full returns policy</a>.</p>') +
          '</div>' +

          '<div style="margin-top:24px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">' +
              '<div><div style="font-weight:700;font-size:.9rem">Shopping at ' + esc(currentStoreName()) + '</div>' +
              '<div style="font-size:.78rem;color:var(--ink-3)">Availability and pricing shown for this store.</div></div>' +
              '<button class="btn btn-ghost btn-sm" data-action="open-store-modal">Change store</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</section>' +

  (fbt.length ? '<section class="sec-tight" style="background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)">' +
    '<div class="wrap">' +
      '<h2 class="display-md" style="margin-bottom:6px">Frequently bought together</h2>' +
      '<p class="muted" style="font-size:.9rem;margin-bottom:20px">Customers who bought ' + esc(p.name.toLowerCase()) + ' usually add these too.</p>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:20px">' +
        fbt.map(function (f) {
          return '<label class="fopt" style="border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--surface);gap:12px">' +
            '<input type="checkbox" data-fbt="' + f.id + '" checked />' +
            imgTag(f.image, f.name, '', 'style="width:44px;height:44px;border-radius:8px;object-fit:cover"') +
            '<span style="flex:1"><span style="display:block;font-weight:600;font-size:.86rem">' + esc(f.name) + '</span><span style="font-size:.75rem;color:var(--ink-3)">' + money(ProductService.effectivePrice(f)) + '</span></span>' +
          '</label>';
        }).join('') +
      '</div>' +
      '<button class="btn btn-primary" data-action="add-fbt" data-id="' + p.id + '">Add selected to basket</button>' +
    '</div>' +
  '</section>' : '') +

  '<section class="sec" id="reviews">' +
    '<div class="wrap">' +
      '<div class="grid" style="grid-template-columns:340px 1fr;gap:clamp(24px,4vw,56px);align-items:start">' +
        '<div class="card card-pad" style="position:sticky;top:120px">' +
          '<div style="font-family:var(--f-display);font-size:3.2rem;font-weight:900;line-height:1">' + p.rating.toFixed(1) + '</div>' +
          '<div style="margin:8px 0 4px">' + stars(p.rating) + '</div>' +
          '<div style="font-size:.84rem;color:var(--ink-3);margin-bottom:18px">Based on ' + p.review_count + ' reviews</div>' +
          ratingDist.map(function (r) {
            return '<div class="rating-bar"><span style="width:34px">' + r.stars + '★</span><span class="bar"><i style="width:' + r.pct.toFixed(0) + '%"></i></span><span style="width:38px;text-align:right;color:var(--ink-3)">' + r.count + '</span></div>';
          }).join('') +
          '<button class="btn btn-ghost btn-block" style="margin-top:20px" data-action="write-review" data-id="' + p.id + '">Write a review</button>' +
        '</div>' +
        '<div>' +
          '<h2 class="display-md" style="margin-bottom:20px">Customer reviews</h2>' +
          (reviews.length ? reviews.map(function (r) {
            return '<div class="review">' +
              '<div class="rh">' +
                '<span class="avatar">' + esc(r.author.charAt(0)) + '</span>' +
                '<div><div style="font-weight:700;font-size:.9rem">' + esc(r.author) + '</div>' +
                '<div style="font-size:.75rem;color:var(--ink-3)">' + formatDate(r.date) + '</div></div>' +
                (r.verified ? '<span class="verified">Verified purchase</span>' : '') +
              '</div>' +
              '<div style="margin-bottom:6px">' + stars(r.rating) + '</div>' +
              '<div style="font-weight:700;font-size:.94rem;margin-bottom:5px">' + esc(r.title) + '</div>' +
              '<p style="font-size:.88rem;color:var(--ink-2);margin:0">' + esc(r.body) + '</p>' +
            '</div>';
          }).join('') : '<p class="muted">No written reviews yet for this product. Be the first.</p>') +
        '</div>' +
      '</div>' +
    '</div>' +
  '</section>' +

  (related.length ? '<section class="sec" style="background:var(--surface);border-top:1px solid var(--line)">' +
    '<div class="wrap">' +
      '<div class="sec-head"><div class="t"><div class="eyebrow" style="margin-bottom:10px">You may also like</div><h2 class="display-md">Similar products</h2></div>' +
      '<a class="btn btn-ghost" href="#/category/' + p.category + '">Shop ' + esc(cat ? cat.name : p.category) + '</a></div>' +
      productGrid(related, {}) +
    '</div>' +
  '</section>' : '') +

  (recent.length ? '<section class="sec-tight">' +
    '<div class="wrap">' +
      '<div class="sec-head"><div class="t"><h2 class="display-md">Recently viewed</h2></div><button class="link-btn" data-action="clear-recent">Clear history</button></div>' +
      productGrid(recent, {}) +
    '</div>' +
  '</section>' : '');
};

function accItem(title, body, open) {
  return '<div class="acc-item' + (open ? ' open' : '') + '">' +
    '<button class="acc-head" data-action="accordion" aria-expanded="' + (open ? 'true' : 'false') + '">' + title + '<span class="pl">+</span></button>' +
    '<div class="acc-body"' + (open ? ' style="max-height:none"' : '') + '><div class="acc-body-in">' + body + '</div></div>' +
  '</div>';
}

function specTable(p) {
  const rows = [
    ['Brand', p.brand],
    ['Product name', p.name],
    ['Category', (CATEGORY_SLUGS[p.category] ? CATEGORY_SLUGS[p.category].name : p.category)],
    ['Subcategory', p.subcategory],
    ['Unit / pack size', p.unit],
    ['Country of origin', p.origin],
    ['SKU', p.sku],
    ['Dietary', p.dietary.length ? p.dietary.join(', ') : 'No specific dietary claims'],
    ['Delivery eligible', p.delivery_eligible ? 'Yes' : 'No'],
    ['Click & Collect', p.pickup_eligible ? 'Yes' : 'No'],
    ['Storage', p.category === 'frozen' ? 'Keep frozen below −18°C' : (p.category === 'dairy-eggs' || p.category === 'meat-poultry' || p.category === 'seafood' || p.category === 'ready-meals' ? 'Keep refrigerated below 4°C' : 'Store in a cool, dry place')]
  ];
  return '<table class="spec-table"><tbody>' + rows.map(function (r) {
    return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>';
  }).join('') + '</tbody></table>';
}

function nutritionBlock(p) {
  const rand = seededRand('nut' + p.id);
  const isDrink = p.category === 'beverages';
  const isFresh = p.category === 'fresh-produce';
  if (isFresh) {
    return '<p style="font-size:.9rem">Fresh produce. Typical values per 100g: energy ' + Math.round(30 + rand() * 90) + ' kcal, carbohydrate ' + (4 + rand() * 18).toFixed(1) + 'g, of which sugars ' + (2 + rand() * 12).toFixed(1) + 'g, fibre ' + (1 + rand() * 4).toFixed(1) + 'g, protein ' + (0.5 + rand() * 2).toFixed(1) + 'g, salt trace.</p><p style="font-size:.9rem;margin:0"><strong>Ingredients:</strong> 100% ' + esc(p.name.toLowerCase()) + '.</p>';
  }
  if (isDrink) {
    return '<p style="font-size:.9rem">Typical values per 100ml: energy ' + Math.round(2 + rand() * 60) + ' kcal, fat ' + (rand() * 0.5).toFixed(1) + 'g, carbohydrate ' + (rand() * 12).toFixed(1) + 'g, of which sugars ' + (rand() * 10).toFixed(1) + 'g, protein ' + (rand() * 3).toFixed(1) + 'g, salt ' + (rand() * 0.3).toFixed(2) + 'g.</p><p style="font-size:.9rem;margin:0"><strong>Ingredients:</strong> See pack for full ingredient listing. Produced in a facility that also handles nuts and cereals containing gluten.</p>';
  }
  return '<p style="font-size:.9rem">Typical values per 100g: energy ' + Math.round(80 + rand() * 420) + ' kcal, fat ' + (1 + rand() * 30).toFixed(1) + 'g, of which saturates ' + (0.4 + rand() * 14).toFixed(1) + 'g, carbohydrate ' + (1 + rand() * 60).toFixed(1) + 'g, of which sugars ' + (0.4 + rand() * 28).toFixed(1) + 'g, fibre ' + (0.4 + rand() * 8).toFixed(1) + 'g, protein ' + (0.8 + rand() * 26).toFixed(1) + 'g, salt ' + (0.02 + rand() * 1.6).toFixed(2) + 'g.</p>' +
    '<p style="font-size:.9rem;margin:0"><strong>Allergens:</strong> ' + (rand() > 0.5 ? 'Contains milk. May contain traces of nuts and sesame.' : 'Contains cereals containing gluten. May contain traces of milk and egg.') + '</p>';
}

function storageAdvice(p) {
  const map = {
    'fresh-produce': 'Refrigerate in the crisper drawer for maximum freshness. Wash before use. Best consumed within 3–5 days of purchase.',
    'bakery': 'Store at room temperature in a paper bag or bread bin. Do not refrigerate — it accelerates staling. Suitable for home freezing on the day of purchase.',
    'dairy-eggs': 'Keep refrigerated below 4°C and consume within three days of opening. Do not refreeze once thawed.',
    'meat-poultry': 'Keep refrigerated below 4°C. Suitable for home freezing on the day of purchase. Defrost thoroughly in the refrigerator before cooking and do not refreeze.',

            '<div class="sum-row"><span>' + (AppState.deliveryMode === 'pickup' ? 'Click &amp; Collect' : 'Delivery') + '</span><span>' + (fee === 0 ? '<span class="free">Free</span>' : money(fee)) + '</span></div>' +

                    '<input id="couponInput" type="text" placeholder="Promotion code" style="flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:.86rem" />' +
                    '<button class="btn btn-ghost btn-sm" data-action="apply-coupon">Apply</button>' +
                  '</div>') +
            '</div>' +

            '<a class="btn btn-primary btn-block btn-lg" href="#/checkout">Go to checkout</a>' +
            '<a class="btn btn-ghost btn-block" href="#/shop" style="margin-top:8px">Continue shopping</a>' +

            '<div style="margin-top:18px;font-size:.76rem;color:var(--ink-3);line-height:1.6">' +
              '<div style="display:flex;gap:8px;margin-bottom:6px"><span style="color:var(--green)">' + svg('check', 14) + '</span> Cold-chain delivery</div>' +
              '<div style="display:flex;gap:8px;margin-bottom:6px"><span style="color:var(--green)">' + svg('check', 14) + '</span> No substitutions without your say-so</div>' +
              '<div style="display:flex;gap:8px"><span style="color:var(--green)">' + svg('check', 14) + '</span> Refunds on anything you are not happy with</div>' +
            '</div>' +
          '</div>' +
        '</aside>' +
      '</div>' +
    '</div>' +
  '</section>';
};

/* --- 8.11 CHECKOUT ------------------------------------------------------- */
Views.checkout = function () {
  const items = CartService.items();
  if (!items.length) {
    return pageHeader({ eyebrow: 'Checkout', title: 'Checkout' }) +
      '<section class="sec"><div class="wrap"><div class="empty">' +
        '<div class="ic">' + svg('basket', 32) + '</div>' +
        '<h3>Nothing to check out</h3>' +
        '<p>Your basket is empty. Add some items and come back.</p>' +
        '<a class="btn btn-primary btn-lg" href="#/shop">Start shopping</a>' +
      '</div></div></section>';
  }

  const step = AppState.checkoutStep || 1;
  const store = StoreService.get(AppState.selectedStoreId) || StoreService.all()[0];
  const addresses = DB.query('SELECT * FROM addresses WHERE customer_id = 1');
  const data = AppState.checkoutData;
  const sub = CartService.subtotal();
  const disc = CartService.discount();
  const fee = CartService.deliveryFee(AppState.deliveryMode);
  const tax = CartService.tax();
  const total = CartService.total(AppState.deliveryMode);

  const stepNames = ['Basket','Method','Details','Payment','Review'];

  const stepsHtml = '<div class="steps">' + stepNames.map(function (s, i) {
    const n = i + 1;
    return '<div class="step ' + (n === step ? 'on' : n < step ? 'done' : '') + '">' +
      '<span class="n">' + (n < step ? '✓' : n) + '</span>' + esc(s) + '</div>';
  }).join('') + '</div>';

  let body = '';

  if (step === 1) {
    body = '<div class="card">' +
      '<h2 style="font-size:1.3rem;margin-bottom:18px">Review your basket</h2>' +
      items.map(function (i) {
        const p = i.product;
        return '<div style="display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center">' +
          imgTag(p.image, p.name, '', 'style="width:66px;height:66px;border-radius:8px;object-fit:cover"') +
          '<div style="flex:1">' +
            '<div style="font-weight:700;font-size:.9rem">' + esc(p.name) + '</div>' +
            '<div style="font-size:.78rem;color:var(--ink-3)">' + esc(p.brand) + ' · ' + esc(p.unit) + '</div>' +
          '</div>' +
          '<div class="qty-sm">' +
            '<button data-action="checkout-dec" data-id="' + p.id + '">−</button>' +
            '<span>' + i.qty + '</span>' +
            '<button data-action="checkout-inc" data-id="' + p.id + '">+</button>' +
          '</div>' +
          '<div style="width:80px;text-align:right;font-weight:800">' + money(ProductService.effectivePrice(p) * i.qty) + '</div>' +
          '<button class="link-btn" data-action="cart-remove" data-id="' + p.id + '" style="margin-left:10px">Remove</button>' +
        '</div>';
      }).join('') +
      '<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">' +
        '<a class="btn btn-ghost" href="#/cart">Edit basket</a>' +
        '<a class="btn btn-ghost" href="#/shop">Add more items</a>' +
      '</div>' +
    '</div>';
  }

  if (step === 2) {
    body = '<div class="card">' +
      '<h2 style="font-size:1.3rem;margin-bottom:18px">How would you like your groceries?</h2>' +
      '<div class="grid g-2">' +
        '<button class="card" data-action="checkout-mode" data-mode="delivery" style="text-align:left;border:2px solid ' + (AppState.deliveryMode === 'delivery' ? 'var(--green)' : 'var(--line)') + '">' +
          '<div style="color:var(--green);margin-bottom:10px">' + svg('truck', 22) + '</div>' +
          '<h3 style="font-size:1.05rem;margin-bottom:6px">Delivery</h3>' +
          '<p style="font-size:.84rem;color:var(--ink-3);margin:0 0 10px">From ' + esc(store.name) + '. Free over ' + money(CONFIG.freeDeliveryThreshold) + ', otherwise ' + money(CONFIG.standardDeliveryFee) + '.</p>' +
          '<span style="font-size:.78rem;font-weight:700;color:var(--green)">Select delivery →</span>' +
        '</button>' +
        '<button class="card" data-action="checkout-mode" data-mode="pickup" style="text-align:left;border:2px solid ' + (AppState.deliveryMode === 'pickup' ? 'var(--green)' : 'var(--line)') + '">' +
          '<div style="color:var(--green);margin-bottom:10px">' + svg('store', 22) + '</div>' +
          '<h3 style="font-size:1.05rem;margin-bottom:6px">Click &amp; Collect</h3>' +
          '<p style="font-size:.84rem;color:var(--ink-3);margin:0 0 10px">Free collection from ' + esc(store.name) + ', ready in as little as 60 minutes.</p>' +
          '<span style="font-size:.78rem;font-weight:700;color:var(--green)">Select collection →</span>' +
        '</button>' +
      '</div>' +

      (AppState.deliveryMode === 'delivery' ? '<div style="margin-top:24px">' +
        '<h3 style="font-size:1.05rem;margin-bottom:12px">Delivery speed</h3>' +
        '<div style="display:flex;flex-direction:column;gap:10px">' +
          ['standard','express','scheduled'].map(function (m) {
            const labels = { standard: 'Standard (choose a slot)', express: 'Express (within 90 minutes)', scheduled: 'Scheduled (weekly recurring slot)' };
            const prices = { standard: CONFIG.standardDeliveryFee, express: CONFIG.expressDeliveryFee, scheduled: CONFIG.scheduledDeliveryFee };
            const on = (data.deliverySpeed || 'standard') === m;
            return '<label class="fopt" style="border:1.5px solid ' + (on ? 'var(--green)' : 'var(--line)') + ';border-radius:var(--r-sm);padding:14px;background:var(--surface)">' +

              '<span style="font-weight:800">' + money(prices[m]) + '</span>' +

          }).join('') +

            return '<button class="card" data-action="checkout-slot" data-slot="' + esc(s) + '" style="padding:14px;text-align:left;' + (on ? 'border-color:var(--green);box-shadow:0 0 0 3px rgba(67,122,82,.14)' : '') + (disabled ? 'opacity:.5;pointer-events:none' : '') + '">' +
              '<div style="font-weight:700;font-size:.86rem">' + esc(s) + '</div>' +
              '<div style="font-size:.74rem;color:' + (disabled ? 'var(--bad)' : 'var(--ok)') + ';font-weight:700">' + (disabled ? 'Fully booked' : 'Available') + '</div>' +
            '</button>';
          }).join('') +
        '</div>' +
      '</div>' : '<div style="margin-top:24px">' +
        '<h3 style="font-size:1.05rem;margin-bottom:12px">Choose a collection time</h3>' +
        '<div class="grid g-3" style="gap:10px">' +
          ['In 60 minutes','Today 6–8pm','Tomorrow 8–10am','Tomorrow 12–2pm','Tomorrow 4–6pm','Tomorrow 7–9pm'].map(function (s) {
            const on = data.slot === s;
            return '<button class="card" data-action="checkout-slot" data-slot="' + esc(s) + '" style="padding:14px;text-align:left;' + (on ? 'border-color:var(--green);box-shadow:0 0 0 3px rgba(67,122,82,.14)' : '') + '">' +
              '<div style="font-weight:700;font-size:.86rem">' + esc(s) + '</div>' +
              '<div style="font-size:.74rem;color:var(--ok);font-weight:700">Available</div>' +
            '</button>';
          }).join('') +
        '</div>' +
      '</div>') +
    '</div>';
  }

  if (step === 3) {
    body = '<div class="card">' +
      '<h2 style="font-size:1.3rem;margin-bottom:18px">' +
        (AppState.deliveryMode === 'pickup' ? 'Contact details' : 'Delivery address and contact details') + '</h2>' +

      (AppState.deliveryMode === 'delivery' ?
        '<div style="margin-bottom:24px">' +
          '<h3 style="font-size:.95rem;margin-bottom:12px">Saved addresses</h3>' +
          '<div class="grid g-2">' +
            addresses.map(function (a) {
              const on = data.addressId === a.id;
              return '<button class="card" data-action="checkout-address" data-id="' + a.id + '" style="text-align:left;padding:16px;' + (on ? 'border-color:var(--green);box-shadow:0 0 0 3px rgba(67,122,82,.14)' : '') + '">' +
                '<div style="display:flex;justify-content:space-between;margin-bottom:6px">' +
                  '<strong style="font-size:.9rem">' + esc(a.label) + '</strong>' +
                  (a.is_default ? '<span class="tag tag-new" style="position:static">Default</span>' : '') +
                '</div>' +
                '<div style="font-size:.82rem;color:var(--ink-3)">' + esc(a.line1) + (a.line2 ? ', ' + esc(a.line2) : '') + '<br>' + esc(a.city) + ', ' + esc(a.state) + ' ' + esc(a.postcode) + '</div>' +
              '</button>';
            }).join('') +
          '</div>' +
        '</div>' : '') +

      '<div class="grid g-2">' +

        '<div class="field"><label for="coPhone">Mobile number</label><input id="coPhone" type="tel" data-field="phone" value="' + esc(data.phone || '') + '" placeholder="+1 555 0100" required /></div>' +
      '</div>' +
      '<div class="field"><label for="coEmail">Email address</label><input id="coEmail" type="email" data-field="email" value="' + esc(data.email || '') + "\" placeholder=\"\" required /></div>" +

      (AppState.deliveryMode === 'delivery' ?
        '<div class="field"><label for="coNotes">Delivery notes (optional)</label><textarea id="coNotes" rows="3" data-field="notes" placeholder="Gate code, safe place, anything the driver should know">' + esc(data.notes || '') + '</textarea></div>' : '') +

      '<label class="check"><input type="checkbox" data-field="contactless"' + (data.contactless ? ' checked' : '') + ' /> ' +
        (AppState.deliveryMode === 'delivery' ? 'Leave my order in a safe place if I am not in' : 'I will collect from the Click &amp; Collect desk') + '</label>' +
    '</div>';
  }

  if (step === 4) {
    const methods = [
      ['card','Card ending 4417','Visa · expires 08/27'],
      ['card2','Card ending 9902','Mastercard · expires 02/26'],
      ['applepay','Apple Pay','Fastest checkout'],
      ['paypal','PayPal','You will be redirected'],
      ['cash','Pay on delivery','Cash or card at the door (delivery only)']
    ];
    body = '<div class="card">' +
      '<h2 style="font-size:1.3rem;margin-bottom:18px">Payment method</h2>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +

          const disabled = AppState.deliveryMode === 'pickup' && m[0] === 'cash';
          const on = (data.payment || 'card') === m[0];
          return '<label class="fopt" style="border:1.5px solid ' + (on ? 'var(--green)' : 'var(--line)') + ';border-radius:var(--r-sm);padding:16px;background:var(--surface);align-items:center' + (disabled ? ';opacity:.5' : '') + '">' +
            '<input type="radio" name="payment" data-action="checkout-payment" value="' + m[0] + '"' + (on ? ' checked' : '') + (disabled ? ' disabled' : '') + ' />' +
            '<span style="color:var(--green)">' + svg('card', 18) + '</span>' +
            '<span style="flex:1"><strong style="display:block;font-size:.92rem">' + m[1] + '</strong><span style="font-size:.78rem;color:var(--ink-3)">' + m[2] + '</span></span>' +
          '</label>';
        }).join('') +

      '<div style="margin-top:24px;padding:16px;background:var(--paper-2);border-radius:var(--r-sm)">' +
        '<div class="eyebrow" style="margin-bottom:8px">Billing address</div>' +
        '<p style="font-size:.85rem;margin:0;color:var(--ink-2)">Same as delivery address. <button class="link-btn" data-action="noop">Change</button></p>' +

      '<label class="check"><input type="checkbox" data-field="makeSubscription"' + (data.makeSubscription ? ' checked' : '') + ' /> Create a repeat subscription from this order</label>' +
      (data.makeSubscription ? '<div class="field" style="margin-left:26px"><label for="subFreq">Repeat frequency</label><select id="subFreq" data-field="subscriptionFrequency">' +
        ['weekly','fortnightly','monthly'].map(function (f) { return '<option value="' + f + '"' + (data.subscriptionFrequency === f ? ' selected' : '') + '>' + f.charAt(0).toUpperCase() + f.slice(1) + '</option>'; }).join('') +
      '</select></div>' : '') +
    '</div>';
  }

  if (step === 5) {
    const addr = DB.query('SELECT * FROM addresses WHERE id = ?', [data.addressId])[0];
    body = '<div class="card">' +
      '<h2 style="font-size:1.3rem;margin-bottom:18px">Review and place order</h2>' +
      '<div class="grid g-2" style="gap:20px;margin-bottom:24px">' +
        '<div class="card" style="background:var(--paper-2)">' +
          '<div class="eyebrow" style="margin-bottom:8px">' + (AppState.deliveryMode === 'pickup' ? 'Collection' : 'Delivering to') + '</div>' +
          '<div style="font-weight:700;font-size:.92rem">' + esc(data.name || 'Guest Shopper') + '</div>' +
          '<div style="font-size:.84rem;color:var(--ink-3)">' +
            (AppState.deliveryMode === 'pickup'
              ? esc(store.name) + '<br>' + esc(store.address)

          '</div>' +
          '<button class="link-btn" style="margin-top:8px" data-action="checkout-goto" data-step="3">Change</button>' +
        '</div>' +
        '<div class="card" style="background:var(--paper-2)">' +
          '<div class="eyebrow" style="margin-bottom:8px">' + (AppState.deliveryMode === 'pickup' ? 'Collection time' : 'Delivery slot') + '</div>' +
          '<div style="font-weight:700;font-size:.92rem">' + esc(data.slot || 'Not selected') + '</div>' +
          '<div style="font-size:.84rem;color:var(--ink-3)">' + esc(data.deliverySpeed || 'standard') + ' service</div>' +
          '<button class="link-btn" style="margin-top:8px" data-action="checkout-goto" data-step="2">Change</button>' +
        '</div>' +
        '<div class="card" style="background:var(--paper-2)">' +
          '<div class="eyebrow" style="margin-bottom:8px">Payment</div>' +
          '<div style="font-weight:700;font-size:.92rem">' + esc(paymentLabel(data.payment)) + '</div>' +
          '<button class="link-btn" style="margin-top:8px" data-action="checkout-goto" data-step="4">Change</button>' +
        '</div>' +
        '<div class="card" style="background:var(--paper-2)">' +
          '<div class="eyebrow" style="margin-bottom:8px">Store</div>' +
          '<div style="font-weight:700;font-size:.92rem">' + esc(store.name) + '</div>' +
          '<button class="link-btn" style="margin-top:8px" data-action="open-store-modal">Change</button>' +
        '</div>' +
      '</div>' +
      '<h3 style="font-size:1rem;margin-bottom:12px">' + items.length + ' items</h3>' +
      items.map(function (i) {
        return '<div style="display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem">' +
          '<span><strong>' + i.qty + '×</strong> ' + esc(i.product.name) + '</span>' +
          '<span style="font-weight:700">' + money(ProductService.effectivePrice(i.product) * i.qty) + '</span>' +
        '</div>';
      }).join('') +
      '<label class="check" style="margin-top:20px"><input type="checkbox" data-field="confirm" id="confirmOrder" /> I confirm my order is correct and I am happy to be charged ' + money(total) + '.</label>' +
    '</div>';
  }

  const sidebar =
    '<aside>' +
      '<div class="card" style="position:sticky;top:120px">' +
        '<h3 style="font-size:1.05rem;margin-bottom:16px">Order summary</h3>' +
        '<div style="max-height:220px;overflow:auto;margin-bottom:14px">' +
          items.map(function (i) {
            return '<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.84rem">' +
              '<span style="color:var(--ink-2)">' + i.qty + '× ' + esc(i.product.name) + '</span>' +
              '<span style="font-weight:700;white-space:nowrap">' + money(ProductService.effectivePrice(i.product) * i.qty) + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<div class="sum-row"><span>Subtotal</span><span>' + money(sub) + '</span></div>' +
        (disc > 0 ? '<div class="sum-row"><span>Promotion</span><span style="color:var(--ok);font-weight:700">−' + money(disc) + '</span></div>' : '') +
        '<div class="sum-row"><span>' + (AppState.deliveryMode === 'pickup' ? 'Collection' : 'Delivery') + '</span><span>' + (fee === 0 ? '<span class="free">Free</span>' : money(fee)) + '</span></div>' +
        '<div class="sum-row"><span>Tax</span><span>' + money(tax) + '</span></div>' +
        '<div class="sum-row total"><span>Total</span><span>' + money(total) + '</span></div>' +
        (step < 5 ? '<button class="btn btn-primary btn-block btn-lg" style="margin-top:18px" data-action="checkout-next">Continue</button>' :
          '<button class="btn btn-amber btn-block btn-lg" style="margin-top:18px" data-action="place-order">Place order · ' + money(total) + '</button>') +
        (step > 1 ? '<button class="btn btn-ghost btn-block" style="margin-top:8px" data-action="checkout-back">Back</button>' : '') +
        '<div style="margin-top:16px;font-size:.74rem;color:var(--ink-3);text-align:center">This is a front-end demonstration. No payment is taken.</div>' +
      '</div>' +
    '</aside>';

  return pageHeader({
    eyebrow: 'Checkout',
    title: 'Checkout',

    breadcrumb: '<div class="wrap">' + breadcrumb([{ label: 'Home', href: '#/home' }, { label: 'Basket', href: '#/cart' }, { label: 'Checkout' }]) + '</div>'
  }) +
  '<section class="sec">' +
    '<div class="wrap">' +
      stepsHtml +
      '<div class="grid" style="grid-template-columns:1.5fr 1fr;gap:clamp(24px,3vw,44px);align-items:start">' +
        '<div>' + body + '</div>' +
        sidebar +
      '</div>' +
    '</div>' +
  '</section>';
};

function paymentLabel(key) {
  const map = { card: 'Card ending 4417', card2: 'Card ending 9902', applepay: 'Apple Pay', paypal: 'PayPal', cash: 'Pay on delivery' };
  return map[key] || 'Card ending 4417';
}

/* --- 8.12 ORDER CONFIRMATION -------------------------------------------- */
Views.confirmation = function (params) {
  const order = OrderService.get(params.id);
  if (!order) return Views.notfound();
  const items = OrderService.items(order.id);
  const store = StoreService.get(order.store_id) || StoreService.all()[0];

function renderOrderTimeline(order) {
  const progress = OrderService.progress(order);
  const stages = order.mode === 'pickup'
    ? [['placed','Order placed','We received your order and payment.'],['picking','Picking your items','A shopper is walking the aisles for you.'],['packing','Packing your order','Items are being checked and packed into crates.'],['ready','Ready to collect','Come to the Click & Collect desk with your order number.']]
    : [['placed','Order placed','We received your order and payment.'],['picking','Picking your items','A shopper is walking the aisles for you.'],['packing','Packing your order','Chilled and frozen items go into insulated liners.'],['ready','Ready for dispatch','Your order is sealed and waiting for a driver.'],['dispatched','Out for delivery','Your driver has left the store.'],['arriving','Arriving soon','Your driver is in your neighbourhood.'],['delivered','Delivered','Your order has been delivered. Enjoy.']];

  return '<div class="timeline">' + stages.map(function (s) {
    const idx = progress.indexOf(s[0]);
    const isDone = idx !== -1 && idx < progress.length - 1;
    const isNow = idx !== -1 && idx === progress.length - 1;
    return '<div class="tl-item ' + (isDone ? 'done' : isNow ? 'now' : '') + '">' +
      '<span class="tl-dot">' + (isDone ? svg('check', 13) : svg('clock', 12)) + '</span>' +
      '<h5>' + esc(s[1]) + '</h5>' +
      '<p>' + esc(s[2]) + '</p>' +
      (isDone || isNow ? '<span class="time">' + (isDone ? 'Completed' : 'In progress') + '</span>' : '') +
    '</div>';
  }).join('') + '</div>';
}

  days.forEach(function (d) {

  return pageHeader({

                days.map(function (d) {

                    '<td style="padding:10px;border-top:1px solid var(--line);font-weight:700;font-size:.88rem;text-transform:capitalize">' + d + '</td>' +
                    meals.map(function (m) {

                      return '<td style="padding:10px;border-top:1px solid var(--line)">' +
                        '<select data-action="meal-change" data-day="' + d + '" data-meal="' + m + '" style="width:100%;padding:8px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-size:.8rem">' +
