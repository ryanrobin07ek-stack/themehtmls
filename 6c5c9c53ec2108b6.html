/* =========================================================================
   ROUTER
   ========================================================================= */
const Router = {
  parse: function () {
    let hash = location.hash || '#/home';
    hash = hash.replace(/^#/, '');
    if (!hash) hash = '/home';
    const parts = hash.split('?');
    const path = parts[0];
    const queryStr = parts[1] || '';
    const query = {};
    queryStr.split('&').forEach(function (kv) {
      if (!kv) return;
      const p = kv.split('=');
      query[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    const segments = path.split('/').filter(Boolean);
    return {
      name: segments[0] || 'home',
      params: {
        slug: segments[1] || null,
        id: segments[1] || null
      },
      segments: segments,
      query: query,
      raw: hash
    };
  },

  go: function (path) {
    if (location.hash === path) {
      this.render();
    } else {
      location.hash = path;
    }
  },

  render: function () {
    const route = this.parse();
    const viewKey = this.resolveView(route);
    const view = Views[viewKey] || Views.notfound;

    /* scroll to top on genuine route change */
    const changed = AppState.currentRoute !== route.raw;
    AppState.currentRoute = route.raw;

    const main = $('#main');
    main.innerHTML = '';

    /* brief skeleton for perceived performance */
    if (changed) {
      main.innerHTML = '<div class="wrap" style="padding:40px 0"><div class="grid g-4">' +
        new Array(8).join('<div class="sk sk-card"></div>') + '</div></div>';
    }

    let html;
    try {
      html = view(route.params, route.query, route.segments);
    } catch (err) {
      console.error('[Router] View error:', err);
      html = Views.notfound();
    }

    main.innerHTML = html;

    /* update document title + meta + structured data */
    SEOManager.update(route, viewKey);

    /* post-render wiring */
    Header.updateStore();
    Header.updateBadges();
    if (typeof highlightNav === 'function') highlightNav(route);

    /* animations */
    AnimationManager.init(route);

    /* focus management for accessibility */
    if (changed) {
      window.scrollTo({ top: 0, behavior: 'auto' });
      const h1 = main.querySelector('h1');
      if (h1) {
        h1.setAttribute('tabindex', '-1');
        h1.focus({ preventScroll: true });
      }
    }
  },

  resolveView: function (route) {
    const n = route.name;
    const map = {
      home: 'home', shop: 'shop', category: 'category', product: 'product',
      search: 'search', deals: 'deals', new: 'new', bestsellers: 'bestsellers',
      organic: 'organic', international: 'international', stores: 'stores',
      store: 'store', delivery: 'delivery', pickup: 'pickup', cart: 'cart',
      checkout: 'checkout', confirmation: 'confirmation', orders: 'orders',
      order: 'order', tracking: 'tracking', account: 'account', login: 'login',
      register: 'register', forgot: 'forgot', wishlist: 'wishlist', saved: 'saved',
      recipes: 'recipes', recipe: 'recipe', 'meal-planner': 'mealPlanner',
      subscriptions: 'subscriptions', loyalty: 'loyalty', newsletter: 'newsletter',
      journal: 'journal', about: 'about', careers: 'careers', contact: 'contact',
      help: 'help', faq: 'faq', privacy: 'privacy', terms: 'terms',
      cookies: 'cookies', accessibility: 'accessibility', returns: 'returns',
      shipping: 'shipping'
    };
    if (n === 'journal' && route.params.slug) return 'journalPost';
    if (n === 'confirmation') return 'confirmation';
    return map[n] || 'notfound';
  }
};

function highlightNav(route) {
  $$('.nav-link').forEach(function (a) {
    a.classList.toggle('active', a.getAttribute('href') === '#/' + (route.segments.join('/')));
  });
  $$('.mobile-bar .mb').forEach(function (a) {
    const nav = a.getAttribute('data-nav');
    a.classList.toggle('on', nav === route.name);
  });
}

/* =========================================================================
   ANIMATION MANAGER — GSAP + ScrollTrigger, reduced-motion aware
   ========================================================================= */
const AnimationManager = {
  ctx: null,
  init: function (route) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (typeof gsap === 'undefined') return;

    if (this.ctx && this.ctx.revert) {
      try { this.ctx.revert(); } catch (e) {}
    }
    if (typeof ScrollTrigger !== 'undefined') {
      try { ScrollTrigger.getAll().forEach(function (t) { t.kill(); }); } catch (e) {}
    }

    if (reduce) return;

    this.ctx = gsap.context(function () {

      /* -- hero entrance -- */
      const heroH1 = document.querySelector('.hero h1, .display-lg');
      if (heroH1 && route.name === 'home') {
        gsap.from('.hero h1 .word-inner, .hero h1', {
          y: 34, opacity: 0, duration: .9, ease: 'power3.out', stagger: .05
        });
        gsap.from('.hero p.lede, .hero-cta, .hero-stats', {
          y: 20, opacity: 0, duration: .7, delay: .22, ease: 'power2.out', stagger: .08
        });
        gsap.from('.hero-art', {
          scale: .94, opacity: 0, duration: 1.1, delay: .1, ease: 'power3.out'
        });
        gsap.from('.hero-float', {
          y: 18, opacity: 0, duration: .6, delay: .7, ease: 'back.out(1.6)', stagger: .12
        });
      }

      /* -- parallax on editorial images -- */
      if (typeof ScrollTrigger !== 'undefined') {
        document.querySelectorAll('.promo img, .cat-tile img, .hero-art img').forEach(function (img) {
          gsap.to(img, {
            yPercent: -7,
            ease: 'none',
            scrollTrigger: {
              trigger: img.closest('.promo, .cat-tile, .hero-art') || img,
              start: 'top bottom',
              end: 'bottom top',
              scrub: 1
            }
          });
        });

        /* -- section reveal -- */
        document.querySelectorAll('.sec .card, .sec .usp, .pc').forEach(function (el, i) {
          if (i > 60) return; /* cap for performance */
          gsap.from(el, {
            y: 22,
            opacity: 0,
            duration: .55,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: el,
              start: 'top 92%',
              once: true
            },
            delay: (i % 4) * 0.045
          });
        });

        /* -- horizontal shelf strip motion -- */
        const strips = document.querySelectorAll('.marquee-track');
        strips.forEach(function (s) {
          /* CSS handles this; nothing to do */
        });
      }

      /* -- page transition -- */
      gsap.from('#main > *', {
        opacity: 0,
        y: 10,
        duration: .35,
        ease: 'power2.out',
        stagger: .04
      });

    });
  },

  /* contained horizontal rails — user controlled */
  scrollRail: function (id, dir) {
    const rail = document.getElementById(id);
    if (!rail) return;
    const amount = Math.max(240, rail.clientWidth * 0.7) * dir;
    rail.scrollBy({ left: amount, behavior: 'smooth' });
  }
};

/* =========================================================================
   SEO MANAGER
   ========================================================================= */
const SEOManager = {
  base: 'https://www.harvestlanemarket.example/',
  jsonLdNodes: {},

  update: function (route, viewKey) {
    let title = CONFIG.brand;
    let description = "Shop fresh groceries from Harvest Lane Market. Free delivery over  or Click & Collect in 60 minutes from fourteen local stores.";
    let path = route.raw;

    switch (viewKey) {
      case 'home':
        title = 'Harvest Lane Market — Fresh Groceries, Delivered or Ready to Collect';
        break;
      case 'shop':
        title = 'Shop All Groceries — ' + PRODUCTS.length + ' Products | Harvest Lane Market';
        description = 'Browse all ' + PRODUCTS.length + ' products across fresh produce, bakery, butchery, seafood, pantry, household and more.';
        break;
      case 'category': {
        const c = CATEGORY_SLUGS[route.params.slug];
        if (c) {
          title = c.name + ' — Shop Online | Harvest Lane Market';
          description = c.description;
        }
        break;
      }
      case 'product': {
        const p = ProductService.get(route.params.id);
        if (p) {
          title = p.name + ' — ' + p.brand + ' | Harvest Lane Market';
          description = p.description.slice(0, 155);
          this.productSchema(p);
          this.breadcrumbSchema([
            { name: 'Home', url: '#/home' },
            { name: CATEGORY_SLUGS[p.category] ? CATEGORY_SLUGS[p.category].name : p.category, url: '#/category/' + p.category },
            { name: p.name, url: '#/product/' + p.id }
          ]);
        }
        break;
      }
      case 'search': {
        const q = route.query.q || '';
        title = (q ? 'Search results for “' + q + '”' : 'Search') + ' | Harvest Lane Market';
        description = q ? 'Products matching “' + q + '” at Harvest Lane Market.' : 'Search products, brands and categories at Harvest Lane Market.';
        break;
      }
      case 'deals':
        title = 'Weekly Deals and Offers | Harvest Lane Market';
        description = 'Every current promotion across fresh produce, bakery, butchery, pantry and household. Prices held until Sunday.';
        break;
      case 'stores':
        title = 'Store Locator — 14 Locations | Harvest Lane Market';
        description = 'Find your nearest Harvest Lane Market. Opening hours, services, delivery radius and Click & Collect availability.';
        break;
      case 'store': {
        const s = StoreService.bySlug(route.params.slug);
        if (s) {
          title = 'Harvest Lane ' + s.name + ' — Store Details | Harvest Lane Market';
          description = 'Harvest Lane ' + s.name + ' at ' + s.address + '. ' + s.hours + '.';
          this.storeSchema(s);
        }
        break;
      }
      case 'recipes':
        title = 'Recipes — ' + RecipeService.all().length + ' Tested Recipes | Harvest Lane Market';
        description = 'Recipes from the Harvest Lane test kitchen, with one-click shopping lists for every ingredient.';
        this.recipeListSchema();
        break;
      case 'recipe': {
        const r = RecipeService.get(route.params.slug);
        if (r) {
          title = r.title + ' — Recipe | Harvest Lane Market';
          description = r.summary;
          this.recipeSchema(r);
        }
        break;
      }
      case 'loyalty':
        title = 'Crate Club Loyalty Programme | Harvest Lane Market';
        description = "Earn a point per dollar, redeem 500 points for  and unlock member-only pricing across hundreds of products.";
        break;
      case 'delivery':
        title = "Delivery Information — Free Over  | Harvest Lane Market";
        description = "Standard, express and scheduled grocery delivery. Cold-chain packed, two-hour windows, free on orders over ";
        break;
      case 'pickup':
        title = 'Click & Collect — Ready in 60 Minutes | Harvest Lane Market';
        description = 'Order online and collect free from any of our fourteen stores, ready in as little as 60 minutes.';
        break;
      case 'faq':
        title = 'Frequently Asked Questions | Harvest Lane Market';
        description = 'Answers about delivery, collection, products, payments, returns and Crate Club rewards.';
        break;
      case 'notfound':
        title = 'Page Not Found | Harvest Lane Market';
        break;
      default:
        if (ROUTES[viewKey] && ROUTES[viewKey].title) {
          title = ROUTES[viewKey].title + ' | Harvest Lane Market';
        }
    }

    document.title = title;
    this.setMeta('name', 'description', description);
    this.setMeta('property', 'og:title', title);
    this.setMeta('property', 'og:description', description);
    this.setMeta('property', 'og:url', this.base + '#' + path);
    this.setMeta('name', 'twitter:title', title);
    this.setMeta('name', 'twitter:description', description);

    let canonical = document.querySelector('link[rel="canonical"]');
    if (!canonical) {
      canonical = document.createElement('link');
      canonical.rel = 'canonical';
      document.head.appendChild(canonical);
    }
    canonical.href = this.base + '#' + path;
  },

  setMeta: function (attr, name, content) {
    let el = document.querySelector('meta[' + attr + '="' + name + '"]');
    if (!el) {
      el = document.createElement('meta');
      el.setAttribute(attr, name);
      document.head.appendChild(el);
    }
    el.setAttribute('content', content);
  },

  injectJsonLd: function (id, obj) {
    let node = document.getElementById('ld-' + id);
    if (!node) {
      node = document.createElement('script');
      node.type = 'application/ld+json';
      node.id = 'ld-' + id;
      document.head.appendChild(node);
    }
    node.textContent = JSON.stringify(obj);
    this.jsonLdNodes[id] = true;
  },

  productSchema: function (p) {
    const schema = {
      '@context': 'https://schema.org',
      '@type': 'Product',
      name: p.name,
      sku: p.sku,
      brand: { '@type': 'Brand', name: p.brand },
      description: p.description,
      image: [artSrc(p.image), artSrc(p.image2), artSrc(p.image3)].map(function (u) { return u.indexOf('data:') === 0 ? 'https://www.harvestlanemarket.example/img/' + p.id + '.svg' : u; }),
      category: CATEGORY_SLUGS[p.category] ? CATEGORY_SLUGS[p.category].name : p.category,
      countryOfOrigin: p.origin,
      aggregateRating: {
        '@type': 'AggregateRating',
        ratingValue: p.rating.toFixed(1),
        reviewCount: p.review_count,
        bestRating: '5',
        worstRating: '1'
      },
      offers: {
        '@type': 'Offer',
        url: this.base + '#/product/' + p.id,
        priceCurrency: 'USD',
        price: ProductService.effectivePrice(p).toFixed(2),
        availability: p.store_availability && Object.keys(p.store_availability).some(function (k) { return p.store_availability[k] > 0; })
          ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
        itemCondition: 'https://schema.org/NewCondition',
        seller: { '@type': 'Organization', name: CONFIG.brand }
      }
    };
    const reviews = DB.query('SELECT * FROM reviews WHERE product_id = ?', [p.id]).slice(0, 3);
    if (reviews.length) {
      schema.review = reviews.map(function (r) {
        return {
          '@type': 'Review',
          author: { '@type': 'Person', name: r.author },
          datePublished: r.date.slice(0, 10),
          name: r.title,
          reviewBody: r.body,
          reviewRating: { '@type': 'Rating', ratingValue: r.rating, bestRating: '5', worstRating: '1' }
        };
      });
    }
    this.injectJsonLd('product', schema);
  },

  storeSchema: function (s) {
    this.injectJsonLd('store', {
      '@context': 'https://schema.org',
      '@type': 'GroceryStore',
      name: 'Harvest Lane Market — ' + s.name,
      image: s.image,
      telephone: s.phone,
      priceRange: '$$',
      address: {
        '@type': 'PostalAddress',
        streetAddress: s.address,
        addressLocality: s.city,
        addressRegion: s.state,
        postalCode: s.postcode,
        addressCountry: 'US'
      },
      geo: { '@type': 'GeoCoordinates', latitude: s.lat, longitude: s.lng },
      openingHours: s.hours,
      department: s.departments.split(',').map(function (d) {
        return { '@type': 'DepartmentStore', name: d.trim() };
      })
    });
  },

  breadcrumbSchema: function (items) {
    this.injectJsonLd('breadcrumb', {
      '@context': 'https://schema.org',
      '@type': 'BreadcrumbList',
      itemListElement: items.map(function (it, i) {
        return {
          '@type': 'ListItem',
          position: i + 1,
          name: it.name,
          item: this.base + it.url
        };
      }, this)
    });
  },

  recipeSchema: function (r) {
    this.injectJsonLd('recipe', {
      '@context': 'https://schema.org',
      '@type': 'Recipe',
      name: r.title,
      description: r.summary,
      image: 'https://loremflickr.com/900/680/' + encodeURIComponent(r.title.split(' ').slice(0, 2).join(',')) + '?lock=' + (hashStr(r.slug) % 900),
      author: { '@type': 'Organization', name: CONFIG.brand },
      datePublished: daysAgo(60).slice(0, 10),
      prepTime: 'PT' + r.prep_time + 'M',
      cookTime: 'PT' + r.cook_time + 'M',
      totalTime: 'PT' + (r.prep_time + r.cook_time) + 'M',
      recipeYield: r.serves + ' servings',
      recipeCategory: r.meal_type,
      recipeCuisine: 'Contemporary',
      keywords: r.dietary,
      recipeIngredient: r.ingredients.map(function (i) { return i.split('|')[0]; }),
      recipeInstructions: r.steps.map(function (s, i) {
        return { '@type': 'HowToStep', position: i + 1, text: s };
      }),
      nutrition: { '@type': 'NutritionInformation', description: r.nutrition },
      aggregateRating: {
        '@type': 'AggregateRating',
        ratingValue: r.rating,
        reviewCount: r.reviews,
        bestRating: '5'
      }
    });
  },

  recipeListSchema: function () {
    this.injectJsonLd('recipe-list', {
      '@context': 'https://schema.org',
      '@type': 'ItemList',
      name: 'Recipes',
      numberOfItems: RecipeService.all().length,
      itemListElement: RecipeService.all().map(function (r, i) {
        return {
          '@type': 'ListItem',
          position: i + 1,
          url: this.base + '#/recipe/' + r.slug,
          name: r.title
        };
      }, this)
    });
  }
};

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
document.addEventListener('click', function (e) {
  const target = e.target.closest('[data-action]');
  if (!target) {
    /* close mega menu when clicking outside */
    const mega = $('#mega');
    if (mega && mega.classList.contains('open') && !e.target.closest('.nav-row') && !e.target.closest('.mega')) {
      mega.classList.remove('open');
    }
    return;
  }
  const action = target.getAttribute('data-action');
  const id = target.getAttribute('data-id');

  switch (action) {

    /* ---------- CART ---------- */
    case 'open-cart':
      e.preventDefault();
      openCartDrawer();
      break;
    case 'close-cart':
      closeCartDrawer();
      break;
    case 'card-add': {
      e.preventDefault();
      const p = ProductService.get(id);
      if (!p) break;
      CartService.add(id, 1);
      ToastManager.success(p.name + ' added to basket');
      animateBadge();
      refreshCurrentView();
      break;
    }
    case 'card-inc':
      e.preventDefault();
      CartService.setQty(id, CartService.qtyOf(id) + 1);
      refreshCurrentView();
      break;
    case 'card-dec':
      e.preventDefault();
      CartService.setQty(id, CartService.qtyOf(id) - 1);
      refreshCurrentView();
      break;
    case 'cart-inc':
      e.preventDefault();
      CartService.setQty(id, CartService.qtyOf(id) + 1);
      refreshCurrentView();
      break;
    case 'cart-dec':
      e.preventDefault();
      CartService.setQty(id, CartService.qtyOf(id) - 1);
      refreshCurrentView();
      break;
    case 'cart-remove':
      e.preventDefault();
      CartService.remove(id);
      ToastManager.show('Item removed from basket');
      refreshCurrentView();
      break;
    case 'cart-save': {
      e.preventDefault();
      const savedProduct = ProductService.get(id);
      CartService.moveToSaved(id);
      ToastManager.success(savedProduct ? savedProduct.name + ' saved for later' : 'Saved for later');
      refreshCurrentView();
      break;
    }
    case 'saved-to-cart':
      e.preventDefault();
      CartService.moveSavedToCart(id);
      ToastManager.success('Moved to basket');
      refreshCurrentView();
      break;
    case 'saved-remove':
      e.preventDefault();
      Store.set('savedForLater', Store.get('savedForLater', []).filter(function (x) { return x !== id; }));
      refreshCurrentView();
      break;

    /* ---------- WISHLIST ---------- */
    case 'wish-toggle': {
      e.preventDefault();
      const added = WishlistService.toggle(id);
      const p2 = ProductService.get(id);
      ToastManager.show((added ? 'Added to wishlist: ' : 'Removed from wishlist: ') + (p2 ? p2.name : ''), added ? 'ok' : '');
      refreshCurrentView();
      break;
    }
    case 'wishlist-add-all':
      WishlistService.items().forEach(function (p) { CartService.add(p.id, 1); });
      ToastManager.success('Wishlist added to basket');
      refreshCurrentView();
      break;
    case 'wishlist-clear':
      WishlistService.clear();
      ToastManager.show('Wishlist cleared');
      refreshCurrentView();
      break;

    /* ---------- PDP ---------- */
    case 'pdp-add': {
      e.preventDefault();
      const pp = ProductService.get(id);
      CartService.add(id, 1);
      ToastManager.success(pp.name + ' added to basket');
      animateBadge();
      refreshCurrentView();
      break;
    }
    case 'pdp-inc':
      e.preventDefault();
      CartService.setQty(id, CartService.qtyOf(id) + 1);
      refreshCurrentView();
      break;
    case 'pdp-dec':
      e.preventDefault();
      CartService.setQty(id, Math.max(0, CartService.qtyOf(id) - 1));
      refreshCurrentView();
      break;
    case 'buy-now': {
      e.preventDefault();
      CartService.add(id, 1);
      Router.go('#/checkout');
      break;
    }
    case 'gal-select':
      e.preventDefault();
      $$('.gal-thumbs button').forEach(function (b) { b.classList.remove('on'); });
      target.classList.add('on');
      const main = $('#galMain');
      if (main) main.src = artSrc(target.getAttribute('data-src'));
      break;
    case 'add-fbt': {
      const checked = $$('[data-fbt]:checked');
      CartService.add(id, 1);
      checked.forEach(function (cb) { CartService.add(cb.getAttribute('data-fbt'), 1); });
      ToastManager.success((checked.length + 1) + ' items added to basket');
      refreshCurrentView();
      break;
    }
    case 'quick-view':
      e.preventDefault();
      openQuickView(id);
      break;
    case 'notify-me': {
      ToastManager.success('We will email you when this is back in stock');
      break;
    }
    case 'write-review':
      ModalManager.open('Write a review', '<form data-form="review" data-id="' + id + '">' +
        '<div class="field"><label for="rvName">Your name</label><input id="rvName" name="author" type="text" required /></div>' +
        '<div class="field"><label for="rvRating">Rating</label><select id="rvRating" name="rating">' +
          [5,4,3,2,1].map(function (n) { return '<option value="' + n + '">' + n + ' star' + (n > 1 ? 's' : '') + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label for="rvTitle">Review title</label><input id="rvTitle" name="title" type="text" required /></div>' +
        '<div class="field"><label for="rvBody">Your review</label><textarea id="rvBody" name="body" rows="5" required></textarea></div>' +
        '<button class="btn btn-primary btn-block" type="submit">Submit review</button>' +
      '</form>', { size: 'narrow' });
      break;

    /* ---------- MODALS ---------- */
    case 'close-modal':
      ModalManager.close();
      break;
    case 'open-store-modal':
      openStoreModal();
      break;
    case 'open-mode-modal':
      openModeModal();
      break;
    case 'select-store': {
      const sid = Number(id);
      AppState.selectedStoreId = sid;
      Store.set('selectedStoreId', sid);
      const st = StoreService.get(sid);
      ToastManager.success('Now shopping at ' + st.name);
      Header.updateStore();
      ModalManager.close();
      closeMobileDrawer();
      refreshCurrentView();
      break;
    }
    case 'set-pickup': {
      const sid2 = Number(id);
      AppState.selectedStoreId = sid2;
      AppState.deliveryMode = 'pickup';
      Store.set('selectedStoreId', sid2);
      Store.set('deliveryMode', 'pickup');
      ToastManager.success('Collecting from ' + StoreService.get(sid2).name);
      Header.updateStore();
      ModalManager.close();
      refreshCurrentView();
      break;
    }

    /* ---------- FILTERS ---------- */
    case 'clear-filters':
      AppState.productFilters = {};
      AppState.productPage = 1;
      refreshCurrentView();
      ToastManager.show('Filters cleared');
      break;
    case 'remove-chip': {
      const key = target.getAttribute('data-key');
      const val = target.getAttribute('data-value');
      const f = AppState.productFilters;
      if (key === 'price') { delete f.minPrice; delete f.maxPrice; }
      else if (Array.isArray(f[key])) { f[key] = f[key].filter(function (x) { return x !== val; }); }
      else { delete f[key]; }
      AppState.productPage = 1;
      refreshCurrentView();
      break;
    }
    case 'apply-price': {
      const minEl = document.querySelector('[data-price="min"]');
      const maxEl = document.querySelector('[data-price="max"]');
      AppState.productFilters.minPrice = minEl && minEl.value ? parseFloat(minEl.value) : null;
      AppState.productFilters.maxPrice = maxEl && maxEl.value ? parseFloat(maxEl.value) : null;
      AppState.productPage = 1;
      refreshCurrentView();
      break;
    }
    case 'view-toggle':
      AppState.productView = target.getAttribute('data-view');
      refreshCurrentView();
      break;
    case 'goto-page':
      AppState.productPage = Number(target.getAttribute('data-page'));
      refreshCurrentView();
      break;
    case 'open-filters':
      $('#filterPanel').classList.add('open');
      $('#scrim').classList.add('on');
      break;

    /* ---------- CHECKOUT ---------- */
    case 'checkout-next': {
      if (AppState.checkoutStep === 3) {
        const name = document.querySelector('[data-field="name"]');
        const phone = document.querySelector('[data-field="phone"]');
        const email = document.querySelector('[data-field="email"]');
        if (!name || !name.value.trim()) { ToastManager.error('Please enter your name'); return; }
        if (!phone || !phone.value.trim()) { ToastManager.error('Please enter a mobile number'); return; }
        if (!email || !email.value.includes('@')) { ToastManager.error('Please enter a valid email address'); return; }
        AppState.checkoutData.name = name.value;
        AppState.checkoutData.phone = phone.value;
        AppState.checkoutData.email = email.value;
      }
      if (AppState.checkoutStep === 4) {
        const terms = document.querySelector('[data-field="terms"]');
        if (terms && !terms.checked) { ToastManager.error('Please accept the terms to continue'); return; }
      }
      if (AppState.checkoutStep === 2 && !AppState.checkoutData.slot) {
        ToastManager.error('Please choose a ' + (AppState.deliveryMode === 'pickup' ? 'collection time' : 'delivery slot'));
        return;
      }
      if (AppState.checkoutStep < 5) {
        AppState.checkoutStep++;
        refreshCurrentView();
      }
      break;
    }
    case 'checkout-back':
      if (AppState.checkoutStep > 1) {
        AppState.checkoutStep--;
        refreshCurrentView();
      }
      break;
    case 'checkout-goto':
      AppState.checkoutStep = Number(target.getAttribute('data-step'));
      refreshCurrentView();
      break;
    case 'checkout-mode':
      AppState.deliveryMode = target.getAttribute('data-mode');
      Store.set('deliveryMode', AppState.deliveryMode);
      Header.updateStore();
      refreshCurrentView();
      break;
    case 'checkout-slot':
      AppState.checkoutData.slot = target.getAttribute('data-slot');
      refreshCurrentView();
      break;
    case 'checkout-address':
      AppState.checkoutData.addressId = Number(id);
      refreshCurrentView();
      break;
    case 'place-order': {
      const confirm = document.getElementById('confirmOrder');
      if (confirm && !confirm.checked) {
        ToastManager.error('Please confirm your order before placing it');
        return;
      }
      AppState.checkoutData.address = AppState.checkoutData.addressId;
      const order = OrderService.place({
        storeId: AppState.selectedStoreId,
        mode: AppState.deliveryMode,
        slot: AppState.checkoutData.slot,
        address: AppState.checkoutData.addressId,
        payment: AppState.checkoutData.payment || 'card',
        makeSubscription: AppState.checkoutData.makeSubscription,
        subscriptionFrequency: AppState.checkoutData.subscriptionFrequency
      });
      if (!order) { ToastManager.error('Something went wrong placing your order'); return; }
      ToastManager.success('Order ' + order.id + ' placed');
      AppState.checkoutStep = 1;
      AppState.checkoutData = {};
      Router.go('#/confirmation/' + order.id);
      break;
    }
    case 'apply-coupon': {
      const input = $('#couponInput');
      const res = CartService.applyCoupon(input ? input.value : '');

/* search input */
const searchInput = $('#searchInput');
const suggestBox = $('#suggest');

if (searchInput) {
  const handleSuggest = debounce(function () {
    const term = searchInput.value.trim();
    if (term.length < 2) {
      suggestBox.classList.remove('open');
      suggestBox.innerHTML = '';
      return;
    }
    const res = SearchService.suggest(term, 6);
    const history = SearchService.history();

    let html = '';
    if (res.products.length) {
      html += '<div class="suggest-group"><h5>Products</h5>' + res.products.map(function (p) {
        return '<a class="sg-item" href="#/product/' + p.id + '" role="option">' +
          imgTag(p.image, p.name, '') +
          '<span style="flex:1"><span class="nm">' + esc(p.name) + '</span><span class="meta">' + esc(p.brand) + ' · ' + money(ProductService.effectivePrice(p)) + '</span></span>' +
        '</a>';
      }).join('') + '</div>';
    }
    if (res.categories.length) {
      html += '<div class="suggest-group"><h5>Departments</h5>' + res.categories.map(function (c) {
        return '<a class="sg-item" href="#/category/' + c.slug + '" role="option">' +
          '<span style="width:38px;height:38px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center">' + svg('box', 17) + '</span>' +
          '<span style="flex:1"><span class="nm">' + esc(c.name) + '</span><span class="meta">' + ProductService.categoryCount(c.slug) + ' products</span></span>' +
        '</a>';
      }).join('') + '</div>';
    }
    if (res.brands.length) {
      html += '<div class="suggest-group"><h5>Brands</h5>' + res.brands.map(function (b) {
        return '<a class="sg-item" href="#/search?q=' + encodeURIComponent(b.name) + '" role="option">' +
          '<span style="width:38px;height:38px;border-radius:8px;background:var(--paper-2);display:grid;place-items:center">' + svg('star', 17) + '</span>' +
          '<span style="flex:1"><span class="nm">' + esc(b.name) + '</span><span class="meta">' + esc(b.country) + '</span></span>' +
        '</a>';
      }).join('') + '</div>';
    }
    if (!html) {
      html = '<div class="suggest-group"><div style="padding:14px 16px;font-size:.86rem;color:var(--ink-3)">No matches for “' + esc(term) + '”. Try a different spelling.</div></div>';
    }

    html += '<div class="suggest-group"><h5>' + (history.length ? 'Recent searches' : 'Trending') + '</h5><div style="padding:0 16px 10px">' +
      (history.length ? history : SearchService.trending).slice(0, 6).map(function (t) {
        return '<a class="sg-pill" href="#/search?q=' + encodeURIComponent(t) + '">' + esc(t) + '</a>';
      }).join('') + '</div></div>';

    suggestBox.innerHTML = html;
    suggestBox.classList.add('open');
  }, 180);

  searchInput.addEventListener('input', handleSuggest);
  searchInput.addEventListener('focus', function () {
    if (searchInput.value.trim().length >= 2) handleSuggest();
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.search-wrap')) suggestBox.classList.remove('open');
  });
  suggestBox.addEventListener('click', function (e) {
    const a = e.target.closest('a');
    if (a) {
      suggestBox.classList.remove('open');
      SearchService.record(searchInput.value.trim());
    }
  });
}

/* filter change delegation */
document.addEventListener('change', function (e) {
  const t = e.target;

  if (t.matches('[data-filter]')) {
    const key = t.getAttribute('data-filter');
    AppState.productFilters[key] = t.checked ? true : false;
    if (!t.checked) delete AppState.productFilters[key];
    AppState.productPage = 1;
    refreshCurrentView();
    return;
  }

  if (t.matches('[data-filter-multi]')) {
    const key = t.getAttribute('data-filter-multi');
    const val = t.value;
    const arr = AppState.productFilters[key] || [];
    if (t.checked) { if (arr.indexOf(val) === -1) arr.push(val); }
    else { const i = arr.indexOf(val); if (i !== -1) arr.splice(i, 1); }
    AppState.productFilters[key] = arr;
    AppState.productPage = 1;
    refreshCurrentView();
    return;
  }

  if (t.matches('[data-filter-rating]')) {
    const v = t.getAttribute('data-filter-rating');
    if (v) AppState.productFilters.minRating = parseFloat(v);
    else delete AppState.productFilters.minRating;
    AppState.productPage = 1;
    refreshCurrentView();
    return;
  }

  if (t.matches('[data-filter-category]')) {
    const v = t.getAttribute('data-filter-category');
    if (v) AppState.productFilters.category = v;
    else delete AppState.productFilters.category;
    AppState.productPage = 1;
    refreshCurrentView();
    return;
  }

  if (t.matches('[data-action="sort-change"]')) {
    AppState.productSort = t.value;
    AppState.productPage = 1;
    refreshCurrentView();
    return;
  }

  if (t.matches('[data-action="meal-change"]')) {
    const plan = RecipeService.mealPlan();
    const day = t.getAttribute('data-day');
    const meal = t.getAttribute('data-meal');
    if (!plan[day]) plan[day] = {};
    plan[day][meal] = t.value;
    RecipeService.saveMealPlan(plan);
    ToastManager.show('Meal plan updated', '', 1400);
    return;
  }

  if (t.matches('[data-field]')) {
    const f = t.getAttribute('data-field');
    AppState.checkoutData[f] = t.type === 'checkbox' ? t.checked : t.value;
    if (f === 'makeSubscription') refreshCurrentView();
    return;
  }

  if (t.matches('[data-action="checkout-speed"]')) {
    AppState.checkoutData.deliverySpeed = t.value;
    refreshCurrentView();
    return;
  }

  if (t.matches('[data-action="checkout-payment"]')) {
    AppState.checkoutData.payment = t.value;
    refreshCurrentView();
    return;
  }

  if (t.matches('[data-action="store-service"]') || t.matches('[data-action="store-mode"]')) {
    filterStoreList();
    return;
  }

  if (t.matches('[data-pref]')) {
    const prefs = Store.get('preferences', {});
    prefs[t.getAttribute('data-pref')] = t.checked;
    Store.set('preferences', prefs);
    ToastManager.show('Preference saved', '', 1400);
    return;
  }
});

/* form submission delegation */
document.addEventListener('submit', function (e) {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const kind = form.getAttribute('data-form');
  const fd = new FormData(form);

  switch (kind) {
    case 'login':
      ToastManager.success('Signed in as ' + (fd.get('email') || ""));
      ModalManager.close();
      Router.go('#/account');
      break;

    case 'register': {
      const storeSel = form.querySelector('[name="store"]');
      if (storeSel) {
        AppState.selectedStoreId = Number(storeSel.value);
        Store.set('selectedStoreId', AppState.selectedStoreId);
      }
      ToastManager.success('Account created. Welcome to Harvest Lane.');
      Router.go('#/account');
      break;
    }

    case 'forgot':
      ToastManager.success('Reset link sent to ' + fd.get('email'));
      break;

    case 'contact':
      ToastManager.success('Message sent — we will reply within two hours');
      form.reset();
      break;

    case 'newsletter':
    case 'newsletter-inline': {
      const email = fd.get('email');
      if (!email || email.indexOf('@') === -1) {
        ToastManager.error('Please enter a valid email address');
        return;
      }
      Store.set('newsletterSubscribed', true);
      Store.set('newsletterEmail', email);
      Store.set('newsletterPrefs', {
        offers: !!fd.get('offers'),
        recipes: !!fd.get('recipes'),
        newProducts: !!fd.get('newProducts'),
        storeNews: !!fd.get('storeNews'),
        frequency: fd.get('frequency') || 'weekly'
      });
      ToastManager.success('Subscribed. The next issue lands on Thursday.');
      if (kind === 'newsletter') refreshCurrentView();
      form.reset();
      break;
    }

    case 'profile':
      ToastManager.success('Profile updated');
      break;

    case 'address':
      DB.insert('addresses', {
        id: Date.now(),
        customer_id: 1,
        label: fd.get('label'),
        line1: fd.get('line1'),
        line2: fd.get('line2'),
        city: fd.get('city'),
        state: 'CA',
        postcode: fd.get('postcode'),
        phone: '+1-555-0100',
        is_default: 0
      });
      ModalManager.close();
      ToastManager.success('Address saved');
      refreshCurrentView();
      break;

    case 'review': {
      const productId = form.getAttribute('data-id');
      DB.insert('reviews', {
        id: Date.now(),
        product_id: productId,
        author: fd.get('author'),
        rating: Number(fd.get('rating')),
        title: fd.get('title'),
        body: fd.get('body'),
        date: new Date().toISOString(),
        verified: 1
      });
      ModalManager.close();
      ToastManager.success('Thank you — your review is published');
      refreshCurrentView();
      break;
    }

    case 'sub-edit': {
      const subId = form.getAttribute('data-id');
      SubscriptionService.update(subId, {
        name: fd.get('name'),
        frequency: fd.get('frequency')
      });
      ModalManager.close();
      ToastManager.success('Subscription updated');
      refreshCurrentView();
      break;
    }

    case 'job':
      ModalManager.close();
      ToastManager.success('Application received — we will be in touch within five days');
      break;
  }
});

/* ESC key + outside click for modals / drawers */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (ModalManager.isOpen() && $('#modal').getAttribute('data-esc') !== 'false') {
      ModalManager.close();
      return;
    }
    if ($('#cartDrawer').classList.contains('open')) { closeCartDrawer(); return; }
    if ($('#mobileDrawer').classList.contains('open')) { closeMobileDrawer(); return; }
    const fp = $('#filterPanel');
    if (fp && fp.classList.contains('open')) { fp.classList.remove('open'); $('#scrim').classList.remove('on'); return; }
    if ($('#mega').classList.contains('open')) { $('#mega').classList.remove('open'); }
  }
  /* focus trap for modal */
  if (e.key === 'Tab' && ModalManager.isOpen()) {
    const card = $('#modalCard');
    const focusables = card.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

  $('#mobileDrawer').classList.remove('open');
  $('#mobileDrawer').setAttribute('aria-hidden', 'true');

    $('#scrim').classList.remove('on');

}

/* --- mode modal --------------------------------------------------------- */
function openModeModal() {

    '<p style="font-size:.9rem;color:var(--ink-3);margin-bottom:20px">Currently shopping with <strong>' + esc(store.name) + '</strong>.</p>' +
    '<div class="grid g-2">' +
      '<button class="card" data-action="select-mode" data-mode="delivery" style="text-align:left;border:2px solid ' + (AppState.deliveryMode === 'delivery' ? 'var(--green)' : 'var(--line)') + '">' +
        '<div style="color:var(--green);margin-bottom:10px">' + svg('truck', 24) + '</div>' +
        '<h3 style="font-size:1.1rem;margin-bottom:6px">Delivery</h3>' +
        '<p style="font-size:.85rem;color:var(--ink-3);margin:0 0 10px">Two-hour slots, seven days a week. Free over ' + money(CONFIG.freeDeliveryThreshold) + ', otherwise ' + money(CONFIG.standardDeliveryFee) + '.</p>' +
        '<span style="font-size:.78rem;font-weight:700;color:var(--green)">' + (AppState.deliveryMode === 'delivery' ? 'Currently selected' : 'Switch to delivery') + ' →</span>' +
      '</button>' +
      '<button class="card" data-action="select-mode" data-mode="pickup" style="text-align:left;border:2px solid ' + (AppState.deliveryMode === 'pickup' ? 'var(--green)' : 'var(--line)') + '">' +
        '<div style="color:var(--green);margin-bottom:10px">' + svg('store', 24) + '</div>' +
        '<h3 style="font-size:1.1rem;margin-bottom:6px">Click &amp; Collect</h3>' +
        '<p style="font-size:.85rem;color:var(--ink-3);margin:0 0 10px">Free collection from any of our fourteen stores, ready in as little as 60 minutes.</p>' +
        '<span style="font-size:.78rem;font-weight:700;color:var(--green)">' + (AppState.deliveryMode === 'pickup' ? 'Currently selected' : 'Switch to collection') + ' →</span>' +
      '</button>' +
    '</div>' +
    '<div style="margin-top:20px"><button class="btn btn-ghost btn-block" data-action="open-store-modal">Change store instead</button></div>';

/* handle mode selection inside modal */
document.addEventListener('click', function (e) {
  const t = e.target.closest('[data-action="select-mode"]');
  if (!t) return;
  AppState.deliveryMode = t.getAttribute('data-mode');
  Store.set('deliveryMode', AppState.deliveryMode);
  Header.updateStore();
  ModalManager.close();
  ToastManager.success(AppState.deliveryMode === 'pickup' ? 'Click & Collect selected' : 'Delivery selected');
  refreshCurrentView();
});

/* --- quick view --------------------------------------------------------- */
function openQuickView(id) {
  const p = ProductService.get(id);
  if (!p) return;
  const stock = ProductService.stockAt(p, AppState.selectedStoreId);
  const html =
    '<div class="grid" style="grid-template-columns:1fr 1.1fr;gap:24px">' +
      '<div><div style="border-radius:var(--r-md);overflow:hidden;aspect-ratio:1/1;background:var(--paper-2)">' +
        imgTag(p.image, p.name, '') + '</div></div>' +
      '<div>' +
        '<div class="eyebrow" style="margin-bottom:8px">' + esc(p.brand) + '</div>' +
        '<h3 style="font-size:1.4rem;margin-bottom:10px">' + esc(p.name) + '</h3>' +
        '<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">' + stars(p.rating) + '<span style="font-size:.82rem;color:var(--ink-3)">' + p.rating.toFixed(1) + ' (' + p.review_count + ')</span></div>' +
        '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px">' +
          (p.sale_price != null
            ? '<span style="font-family:var(--f-display);font-size:1.8rem;font-weight:900;color:var(--tomato)">' + money(p.sale_price) + '</span><span style="text-decoration:line-through;color:var(--ink-3)">' + money(p.price) + '</span>'
            : '<span style="font-family:var(--f-display);font-size:1.8rem;font-weight:900">' + money(p.price) + '</span>') +
          '<span style="font-size:.82rem;color:var(--ink-3)">' + esc(p.unit) + '</span>' +
        '</div>' +
        '<p style="font-size:.88rem;color:var(--ink-2);margin-bottom:16px">' + esc(p.short_description) + '</p>' +
        '<div class="pc-stock ' + StoreService.stockLabel(stock).cls + '" style="margin-bottom:16px">' + StoreService.stockLabel(stock).text + ' at ' + esc(currentStoreName()) + '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          (stock === 0
            ? '<button class="btn btn-ghost" data-action="notify-me" data-id="' + p.id + '">Notify me</button>'
            : '<button class="btn btn-primary" data-action="card-add" data-id="' + p.id + '">Add to basket</button>') +
          '<a class="btn btn-ghost" href="#/product/' + p.id + '" data-action="close-modal">Full details</a>' +
        '</div>' +
        '<div class="svc" style="margin-top:16px">' + (p.dietary || []).map(function (d) { return '<span>' + esc(d) + '</span>'; }).join('') + '</div>' +
      '</div>' +
    '</div>';
  ModalManager.open(p.name, html, { size: 'wide' });
}

/* --- store list filtering ----------------------------------------------- */
function filterStoreList() {
  const term = ($('#storeSearch') ? $('#storeSearch').value : '').toLowerCase();
  const service = $('#storeService') ? $('#storeService').value : '';
  const results = $('#storeResults');
  if (!results) return;

  const filtered = StoreService.all().filter(function (s) {
    const matchesTerm = !term || (s.name + ' ' + s.postcode + ' ' + s.address + ' ' + s.city).toLowerCase().indexOf(term) !== -1;
    const matchesService = !service || s.services.indexOf(service) !== -1;
    return matchesTerm && matchesService;
  });

  results.innerHTML = filtered.length
    ? filtered.map(storeCardHtml).join('')
    : '<div class="empty"><div class="ic">' + svg('pin', 30) + '</div><h3>No stores match that search</h3><p>Try a different postcode or clear the service filter.</p><button class="btn btn-primary" onclick="document.getElementById(\'storeSearch\').value=\'\';document.getElementById(\'storeService\').value=\'\';document.getElementById(\'storeService\').dispatchEvent(new Event(\'change\',{bubbles:true}))">Clear filters</button></div>';
}

/* =========================================================================
   INIT
   ========================================================================= */
function init() {
  buildDatabase();

  /* restore persisted state */
  const savedStore = Store.get('selectedStoreId', null);
  AppState.selectedStoreId = savedStore && StoreService.get(savedStore) ? savedStore : 1;
  AppState.deliveryMode = Store.get('deliveryMode', 'delivery');
  AppState.productView = Store.get('productView', 'grid');

  /* seed a demo order so order history and tracking have content */
  if (!Store.get('orders', []).length && Store.get('seededDemo', false) === false) {
    seedDemoOrders();
    Store.set('seededDemo', true);
  }

  /* year in footer */
  const yearEl = $('#year');
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  /* header */
  Header.render();
  Header.updateStore();
  Header.updateBadges();

  /* cart drawer initial content */
  renderCartDrawer();

  /* announce rotation — pauses when the tab is hidden */
  const announceEl = $('#announceText');
  if (announceEl) {
    const messages = [
      "Free delivery over <b></b> · Click &amp; Collect in 60 minutes · <b>Crate Club</b> members save more every week",
      '<b>Fresh Produce Week</b> — up to 30% off fruit and vegetables until Sunday',
      'Now delivering from <b>fourteen stores</b> across the region',
      'Order before 6pm for <b>same-day delivery</b>'
    ];
    let i = 0;
    setInterval(function () {
      if (document.hidden) return;
      i = (i + 1) % messages.length;
      announceEl.innerHTML = messages[i];
      announceEl.classList.remove('rot');
      void announceEl.offsetWidth;
      announceEl.classList.add('rot');
    }, 6500);
  }

  /* shorter search placeholder on phones */
  (function () {
    const si = document.getElementById('searchInput');
    if (!si) return;
    const full = si.getAttribute('placeholder');
    const fit = function () { si.setAttribute('placeholder', window.innerWidth <= 560 ? 'Search products…' : full); };
    fit(); window.addEventListener('resize', fit);
  })();

  /* initial route */
  if (!location.hash) location.hash = '#/home';
  Router.render();

  /* re-render on resize for filter panel behaviour */
  window.addEventListener('resize', debounce(function () {
    const fp = $('#filterPanel');
    if (fp && window.innerWidth > 980) {
      fp.classList.remove('open');
      $('#scrim').classList.remove('on');
    }
  }, 200));

  /* keyboard shortcut: "/" focuses search */
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault();
      const si = $('#searchInput');
      if (si) si.focus();
    }
  });

  /* console note for anyone inspecting */
  console.log('%cHarvest Lane Market', 'font:700 18px serif;color:#1F3D2B');
  console.log('%c' + PRODUCTS.length + ' products · ' + StoreService.all().length + ' stores · ' + RecipeService.all().length + ' recipes loaded from the SQL-compatible data layer.',
    'color:#6C7059;font-size:12px');
}

/* seed realistic order history */
function seedDemoOrders() {
  const pickProducts = function (n, seedOffset) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const idx = (seedOffset * 17 + i * 31) % PRODUCTS.length;
      out.push(PRODUCTS[idx]);
    }
    return out;
  };

  const demoConfigs = [
    { daysAgo: 34, mode: 'delivery', storeId: 1, status: 'delivered', seed: 3, slot: '6pm – 8pm', count: 9 },
    { daysAgo: 18, mode: 'pickup', storeId: 2, status: 'collected', seed: 7, slot: 'Tomorrow 10am–12pm', count: 6 },
    { daysAgo: 9, mode: 'delivery', storeId: 1, status: 'delivered', seed: 11, slot: '2pm – 4pm', count: 12 },
    { daysAgo: 4, mode: 'delivery', storeId: 3, status: 'delivered', seed: 5, slot: '8am – 10am', count: 8 }
  ];

  const orders = [];
  const orderItems = [];

  demoConfigs.forEach(function (cfg, ci) {
    const id = 'HL' + String(22014000 + ci * 371 + cfg.seed * 13);
    const products = pickProducts(cfg.count, cfg.seed);
    let subtotal = 0;
    let itemCount = 0;

    products.forEach(function (p) {
      const qty = 1 + (hashStr(p.id + ci) % 3);
      const price = ProductService.effectivePrice(p);
      const line = Math.round(price * qty * 100) / 100;
      subtotal += line;
      itemCount += qty;
      orderItems.push({
        order_id: id,
        product_id: p.id,
        name: p.name,
        brand: p.brand,
        image: p.image,
        qty: qty,
        price: price,
        line_total: line
      });
    });

    subtotal = Math.round(subtotal * 100) / 100;
    const discount = ci === 2 ? 10 : 0;
    const fee = cfg.mode === 'pickup' ? 0 : (subtotal >= CONFIG.freeDeliveryThreshold ? 0 : CONFIG.standardDeliveryFee);
    const tax = Math.round((subtotal - discount) * CONFIG.taxRate * 100) / 100;
    const total = Math.round((subtotal - discount + fee + tax) * 100) / 100;

    orders.push({
      id: id,
      customer_id: 1,
      store_id: cfg.storeId,
      mode: cfg.mode,
      status: cfg.status,
      subtotal: subtotal,
      discount: discount,
      delivery_fee: fee,
      tax: tax,
      total: total,
      created: daysAgo(cfg.daysAgo),
      slot: cfg.slot,
      address: 1,
      payment: 'card',
      items_count: itemCount
    });
  });

  Store.set('orders', orders);
  Store.set('orderItems', orderItems);

  /* seed a couple of subscriptions */
  Store.set('subscriptions', [
    {
      id: 'sub-seed-1',
      name: 'Weekly Essentials',
      products: ['fresh-whole-milk-2l-92', 'sourdough-loaf-60', 'free-range-eggs-12pk-118', 'salted-butter-250g-114'].filter(function (id) { return !!PRODUCT_BY_ID[id]; }),
      frequency: 'weekly',
      next_delivery: daysAhead(3),
      status: 'active',
      price: 24.5,
      created: daysAgo(80)
    },
    {
      id: 'sub-seed-2',
      name: 'Coffee Club',
      products: ['coffee-beans-500g-236'].filter(function (id) { return !!PRODUCT_BY_ID[id]; }),
      frequency: 'fortnightly',
      next_delivery: daysAhead(9),
      status: 'paused',
      price: 16.5,
      created: daysAgo(140)
    }
  ]);

  /* seed a few wishlist items */
  Store.set('wishlist', [PRODUCTS[8].id, PRODUCTS[14].id, PRODUCTS[62].id, PRODUCTS[130].id, PRODUCTS[210].id].filter(Boolean));

  /* loyalty ledger seed */
  Store.set('loyaltyLedger', [
    { type: 'earn', points: 82, description: 'Order HL22014873', date: daysAgo(4) },
    { type: 'earn', points: 64, description: 'Order HL22014412', date: daysAgo(9) },
    { type: 'redeem', points: -500, description: " reward voucher", date: daysAgo(19) },
    { type: 'earn', points: 118, description: 'Order HL22013988', date: daysAgo(18) },
    { type: 'earn', points: 50, description: 'Newsletter signup bonus', date: daysAgo(31) },
    { type: 'earn', points: 96, description: 'Order HL22013402', date: daysAgo(34) }
  ]);
}

/* start when the DOM is ready */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
