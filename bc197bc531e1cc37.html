/* ---------- SHOP ---------- */
function pageShop(catId, subFilter){
  const cats = [
    {id:'polish', name:'Lacquer'}, {id:'gel', name:'Gel Systems'}, {id:'tools', name:'Tools'},
    {id:'care', name:'Care'}, {id:'nail-art', name:'Nail Art'}, {id:'accessories', name:'Accessories'},
    {id:'home-kits', name:'Home Kits'}, {id:'gift-sets', name:'Gift Sets'}
  ];
  let list = catId ? PRODUCTS.filter(function(p){ return p.cat === catId; }) : PRODUCTS.slice();
  const sort = state._shopSort || 'featured';
  if (sort === 'price-asc') list.sort(function(a,b){ return (a.salePrice||a.price) - (b.salePrice||b.price); });
  else if (sort === 'price-desc') list.sort(function(a,b){ return (b.salePrice||b.price) - (a.salePrice||a.price); });
  else if (sort === 'rating') list.sort(function(a,b){ return b.rating - a.rating; });
  else if (sort === 'new') list.sort(function(a,b){ return b.id.localeCompare(a.id); });
  else list.sort(function(a,b){ return (b.featured?1:0) - (a.featured?1:0) || b.reviewCount - a.reviewCount; });

  const brandFilter = state._shopBrand;
  if (brandFilter) list = list.filter(function(p){ return p.brand === brandFilter; });
  const brands = Array.from(new Set((catId ? PRODUCTS.filter(function(p){return p.cat===catId;}) : PRODUCTS).map(function(p){return p.brand;}))).sort();

  let h = '<section class="sec-sm" style="background:var(--ink2);border-bottom:1px solid var(--lineD2)"><div class="wrap-wide">' +

    '<h1 class="d1" style="margin-top:18px;font-size:clamp(34px,6vw,72px)">' + (catId ? esc((cats.filter(function(c){return c.id===catId;})[0]||{}).name || 'Shop') : 'The <span class="it">Shop</span>') + '</h1>' +
    '<p class="lead" style="max-width:62ch;margin-top:16px">' + (catId ? 'Professional-grade products, shipped worldwide. Free delivery over ' + money(75) + '.' : 'Everything we use on the floor, available to take home. ' + PRODUCTS.length + ' products across ' + cats.length + ' categories.') + '</p>' +
  '</div></section>';

  h += '<section style="background:var(--ink2);border-bottom:1px solid var(--lineD2);position:sticky;top:var(--hdr);z-index:20">' +
    '<div class="wrap-wide" style="padding-block:12px">' +
      '<div class="chips" style="margin-bottom:10px">' +
        '<a href="#/shop" class="chip' + (!catId ? ' on' : '') + '">All</a>' +

      '<div class="between wrapf" style="gap:10px">' +
        '<div class="chips">' +
          '<button class="chip' + (!brandFilter ? ' on' : '') + '" data-brand="">All brands</button>' +
          brands.slice(0,10).map(function(b){ return '<button class="chip' + (brandFilter === b ? ' on' : '') + '" data-brand="' + esc(b) + '">' + esc(b) + '</button>'; }).join('') +
        '</div>' +
        '<select class="select" id="shopSort" style="max-width:200px;min-height:40px;padding:8px 36px 8px 14px;font-size:13px">' +
          [['featured','Featured'],['price-asc','Price: low to high'],['price-desc','Price: high to low'],['rating','Highest rated'],['new','Newest']].map(function(o){
            return '<option value="' + o[0] + '"' + (sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
          }).join('') +
        '</select>' +
      '</div>' +
    '</div>' +
  '</section>';

  h += '<section class="sec"><div class="wrap-wide">' +
    '<div class="between wrapf" style="margin-bottom:18px"><span class="mono" style="color:var(--mut)">' + list.length + ' products</span>' +

  '</div></section>';
  return h;
}

/* ---------- CART ---------- */
function pageCart(){
  const lines = cartLines();
  const sub = cartSubtotal();
  const c = state.coupon;
  let disc = 0;
  if (c && (c.scope === 'products' || c.scope === 'all')){
    if (c.type === 'percent') disc = sub * c.value / 100;
    else if (c.type === 'fixed') disc = Math.min(c.value, sub);

  const shipping = sub > 75 ? 0 : (sub > 0 ? 4.95 : 0);
  const total = Math.max(0, sub - disc + shipping);

  let h = '<section class="sec-sm" style="background:var(--ink2);border-bottom:1px solid var(--lineD2)"><div class="wrap-wide">' +
    breadcrumb([{label:'Home',href:'#/home'},{label:'Bag'}]) +

  '</div></section>';

  h += '<section class="sec"><div class="wrap-wide">';
  if (!lines.length){
    h += emptyState(ICONS.bag, 'Your bag is empty', 'Nothing here yet. Browse the shop and add something worth owning.', 'Shop all products', '#/shop');
  } else {
    h += '<div class="pd-grid" style="grid-template-columns:1.6fr 1fr">' +
      '<div>' +

function placeOrder(){
  const f = state._checkout || {};
  const lines = cartLines();
  if (!lines.length) return null;
  if (!f.name || !f.email || !f.address || !f.city || !f.postcode){
    toast('Please complete your delivery details.', 'err');
    return null;
  }
  const sub = cartSubtotal();
  const c = state.coupon;
  let disc = 0;
  if (c && (c.scope === 'products' || c.scope === 'all')){
    if (c.type === 'percent') disc = sub * c.value / 100;
    else if (c.type === 'fixed') disc = Math.min(c.value, sub);
  }
  const shipping = f.delivery === 'express' ? 9.95 : (f.delivery === 'click' ? 0 : (sub > 75 ? 0 : 4.95));
  const total = Math.max(0, sub - disc + shipping);
  state.orderSeq++;
  const stages = ['Order placed','Confirmed','Preparing','Packed','Dispatched','In transit','Out for delivery','Delivered'];
  const now = Date.now();
  const order = {
    id: 'LQ-' + state.orderSeq,
    customerId: 'cus-' + (state.user ? state.user.id : 'guest'),
    customer: { name: f.name, email: f.email, phone: f.phone || '' },
    address: { street: f.address, city: f.city, postcode: f.postcode, country: f.country },
    items: lines.map(function(l){ return { productId: l.product.id, name: l.product.name, brand: l.product.brand, qty: l.qty, price: l.product.salePrice || l.product.price, image: l.product.gallery[0] }; }),
    subtotal: sub, discount: disc, shipping: shipping, total: total,
    delivery: f.delivery, payment: f.payment, coupon: c ? c.code : null,
    status: 'Order placed',
    stage: 0,
    stages: stages,
    placedAt: new Date(now).toISOString(),
    eta: addDays(todayISO(), f.delivery === 'express' ? 1 : 4),
    tracking: 'LQ' + String(state.orderSeq).slice(-4) + 'GB' + (f.delivery === 'express' ? 'X' : 'S')
  };
  state.orders.unshift(order);
  state.cart = [];
  state.coupon = null;
  state._checkout = null;
  addPoints(Math.round(total), 'Order ' + order.id);
  pushNotification('Order placed', order.id + ' · ' + lines.length + ' item' + (lines.length === 1 ? '' : 's') + ' · ' + money(total));
  save(); renderHeaderState();
  return order;
}

function consultationResult(){
  const d = state._consult || {};
  let rec = 'sv-builder-mani', shape = 'Squoval', length = 'Short', notes = [];
  if (d.length && d.length.indexOf('Long') === 0) { rec = 'sv-builder-ext'; length = 'Medium to long'; }
  if (d.length && d.length.indexOf('Extra') === 0) { rec = 'sv-sculpted'; length = 'Extra long'; }
  if (d.style === 'Chrome or metallic') rec = 'sv-chrome-gel';
  if (d.style === 'Hand-painted art') rec = 'sv-gel-mani';
  if (d.style === 'Bridal') rec = 'sv-bridal-trial';
  if (d.condition === 'Damaged from acrylic' || d.condition === 'Recovering from gel') { rec = 'sv-nail-health'; notes.push('Given your nail condition, we would start with a free Nail Health Consultation rather than applying product immediately.'); }
  if (d.shape) shape = d.shape;
  if (d.maintenance === 'I need the longest possible wear') { notes.push('For maximum wear we recommend a builder overlay under your colour — it adds three to five days over gel alone.'); }
  if (d.event) notes.push('With an event on ' + fmtDate(d.event) + ', we recommend booking a trial at least four weeks ahead.');
  if (d.colour === 'Let the technician decide') notes.push('We will do a colour consultation at the desk — it takes five minutes and it is worth it.');

  const svc = SVC_BY[rec];
  return { svc: svc, shape: shape, length: length, notes: notes };
}

/* ---------- ABOUT ---------- */
function pageAbout(){
  let h = '<section class="hero" style="min-height:64svh">' +

    '<p class="lead" style="font-size:20px;color:var(--bone)">LACQUERIA began in 2014 in a single room on Mount Street with one technician, one lamp and a stubborn belief that nail work deserved the same rigour as any other craft.</p>' +
    "<p class=\"lead\" style=\"margin-top:22px\">Twelve years later we have fourteen ateliers across nine cities, twenty-three technicians, and a training academy that ta hours before a student touches a paying client. The belief has not changed. A nail service is an engineering problem first and a decorative one second — get the structure right and everything else follows.</p>" +
    '<p class="lead" style="margin-top:22px">We do not use nail clips. We do not skip the dehydrator. We do not apply product over an infected nail, at any price. We publish our full price list with no hidden supplements, and we will tell you honestly when the service you have asked for is not the one you need.</p>' +
    '<p class="lead" style="margin-top:22px">That is the whole proposition. It is not complicated, but it is surprisingly rare.</p>' +
  '</div></section>';

  h += '<section class="sec" style="background:var(--bone);color:var(--ink)"><div class="wrap-wide">' +
    '<div class="section-head"><div class="sh-l"><div class="mono" style="color:var(--lac2);margin-bottom:12px">Timeline</div><h2 class="d2">How we <span class="it">grew</span></h2></div></div>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))">' +
      [['2014','Mayfair','Amara Osei opens a single-room atelier on Mount Street with one technician and one lamp.'],
       ['2016','New York','Soho opens with ten stations. The first international floor.'],
       ['2017','Shoreditch & Paris','Two openings in one year. The Academy is founded.'],
       ['2018','Upper East Side','A townhouse atelier with a dedicated bridal floor.'],
       ['2019','Chelsea & Berlin','Natural nail health becomes a formal specialism.'],
       ['2020','Barcelona','The largest pedicure lounge in Europe opens in Eixample.'],
       ['2021','Milan & Brooklyn','The editorial house in Brera. Warehouse light in Williamsburg.'],
       ['2022','Paris & Los Angeles','Palais Royal opens appointment-only. Melrose becomes the set-ready studio.'],
       ['2023','Dubai','Waterfront suites open until 23:00, with a private VIP floor.'],
       ['2024','Tokyo','Precision Japanese nail architecture arrives in Ginza.']].map(function(x){
        return '<div class="card card-pad" style="background:#fff;border-color:var(--line2)">' +
          '<div class="mono" style="color:var(--lac2)">' + x[0] + '</div>' +
          '<div class="d4" style="margin-top:10px">' + esc(x[1]) + '</div>' +
          '<p class="sm" style="margin-top:10px;color:var(--mut2)">' + esc(x[2]) + '</p>' +
        '</div>';
      }).join('') +
    '</div>' +
  '</div></section>';

  h += '<section class="sec"><div class="wrap-wide"><div class="split b">' +
    '<div>' +
      '<div class="mono" style="color:var(--lac3);margin-bottom:14px">Our values</div>' +
      '<h2 class="d2">Five things we will not <span class="it">compromise</span>.</h2>' +
      '<ol class="numlist" style="margin-top:26px">' +
        '<li><div><div class="d4">Single-use or sterilised</div><p class="sm" style="margin-top:6px">Files, buffers and sticks are single-use. Metal tools are autoclaved at 134°C for 18 minutes and the cycle is logged. The log is available at the desk on request.</p></div></li>' +
        '<li><div><div class="d4">Published prices</div><p class="sm" style="margin-top:6px">Every price on this site is the full price. Art that takes longer than the standard allocation is quoted before we start, never after.</p></div></li>' +
        '<li><div><div class="d4">No product over infection</div><p class="sm" style="margin-top:6px">If we see signs of infection, we stop. We explain what we see and refer you to someone qualified. We do not treat, diagnose or prescribe.</p></div></li>' +
        '<li><div><div class="d4">A full wage, not a tipped wage</div><p class="sm" style="margin-top:6px">Our technicians are paid properly. Tipping is optional and nothing in your service depends on it.</p></div></li>' +
        '<li><div><div class="d4">Honest advice</div><p class="sm" style="margin-top:6px">If the service you asked for is not the one you need, we will say so. We would rather lose a booking than sell you something that damages your nails.</p></div></li>' +
      '</ol>' +
    '</div>' +
    '<div class="grid g2">' +
      '<div class="media media-3x4 zoomable" data-zoom data-src="' + pickPhotoW('about1','salon',1200) + '" data-cap="Inside the atelier">' + imgTag(pickPhotoW('about1','salon',800), 'Inside a LACQUERIA atelier', '') + '</div>' +
      '<div class="media media-3x4 zoomable" data-zoom data-src="' + pickPhotoW('about2','hands',1200) + '" data-cap="Detail work" style="margin-top:26px">' + imgTag(pickPhotoW('about2','hands',800), 'Detail work in progress', '') + '</div>' +
    '</div>' +
  '</div></div></section>';

  h += '<section class="sec" style="background:var(--ink2)"><div class="wrap-wide"><div class="split a">' +
    '<div class="media media-4x5 zoomable" data-zoom data-src="' + pickPhotoW('amara','portraits',1400) + '" data-cap="Amara Osei, Founder">' + imgTag(pickPhotoW('t01','portraits',1000), 'Amara Osei, Founder and Creative Director', '') + '</div>' +
    '<div>' +
      '<div class="mono" style="color:var(--lac3);margin-bottom:14px">Founder</div>' +
      '<h2 class="d2">Amara <span class="it">Osei</span></h2>' +
      '<p class="lead" style="margin-top:20px">Amara trained as a sculptor before she ever picked up a nail brush, and it shows. She spent a decade backstage at London Fashion Week building sets for shows that started in ninety seconds and could not be redone.</p>' +
      '<p class="lead" style="margin-top:16px">She founded LACQUERIA in 2014 with a single rule: the structure comes first. Everything the house has become — the academy, the published prices, the refusal to use nail clips — follows from that one position.</p>' +
      '<p class="lead" style="margin-top:16px">She still works the floor at Mayfair two days a week, and she still does the pinky last.</p>' +
      "<a href=\"#/technician/t01\" class=\"arrow-lnk\" style=\"margin-top:24px\">View her profile <svg width=\"14\" height=\"10\" viewBox=\"\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"M0 5h12M8 1l4 4-4 4\"/></svg></a>" +
    '</div>' +
  '</div></div></section>';

  h += newsletterSection();
  return h;
}

function pageSearch(q){
  const query = (q || '').toLowerCase().trim();
  if (!query) return '<section class="sec"><div class="wrap-tight">' + emptyState(ICONS.search, 'Search LACQUERIA', 'Find a service, a design, a product, a technician or an article.', 'Browse services', '#/services') + '</div></section>';

  let h = '<section class="sec-sm" style="background:var(--ink2);border-bottom:1px solid var(--lineD2)"><div class="wrap-wide">' +
    breadcrumb([{label:'Home',href:'#/home'},{label:'Search'}]) +

    '<div class="sm" style="margin-top:10px">' + res.total + ' results across ' + res.groups.length + ' categories</div>' +
  '</div></section>';
  h += '<section class="sec"><div class="wrap-wide">';
  if (!res.total) h += emptyState(ICONS.search, 'Nothing found', 'Try a different term, or browse our services and shop.', 'Browse services', '#/services');
  else h += res.groups.map(function(g){
    return '<div style="margin-bottom:38px">' +
      '<div class="between" style="margin-bottom:16px"><div class="d4">' + esc(g.label) + '</div><span class="mono" style="color:var(--mut)">' + g.items.length + '</span></div>' +
      '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))">' + g.items.join('') + '</div>' +
    '</div>';
  }).join('');
  h += '</div></section>';
  return h;
}

function searchAll(q){
  const groups = [];
  let total = 0;
  const svcs = SERVICES.filter(function(s){ return (s.name + ' ' + s.blurb + ' ' + s.long + ' ' + (CAT_BY[s.cat]||{}).name).toLowerCase().indexOf(q) >= 0; }).slice(0,8);
  if (svcs.length){ groups.push({ label:'Services', items: svcs.map(svcCard) }); total += svcs.length; }
  const ds = DESIGNS.filter(function(d){ return (d.name + ' ' + d.style + ' ' + d.tags.join(' ') + ' ' + d.desc).toLowerCase().indexOf(q) >= 0; }).slice(0,8);
  if (ds.length){ groups.push({ label:'Nail Designs', items: ds.map(designCard) }); total += ds.length; }
  const ps = PRODUCTS.filter(function(p){ return (p.name + ' ' + p.brand + ' ' + p.cat + ' ' + p.sub + ' ' + p.desc).toLowerCase().indexOf(q) >= 0; }).slice(0,10);
  if (ps.length){ groups.push({ label:'Products', items: ps.map(prodCard) }); total += ps.length; }
  const ts = TECHS.filter(function(t){ return (t.name + ' ' + t.title + ' ' + t.spec.join(' ') + ' ' + t.bio).toLowerCase().indexOf(q) >= 0; }).slice(0,6);
  if (ts.length){ groups.push({ label:'Technicians', items: ts.map(techCard) }); total += ts.length; }
  const ls = LOCATIONS.filter(function(l){ return (l.name + ' ' + l.city + ' ' + l.country + ' ' + l.street).toLowerCase().indexOf(q) >= 0; }).slice(0,6);
  if (ls.length){ groups.push({ label:'Ateliers', items: ls.map(locCard) }); total += ls.length; }
  const as = ARTICLES.filter(function(a){ return (a.title + ' ' + a.excerpt + ' ' + a.cat + ' ' + a.tags.join(' ')).toLowerCase().indexOf(q) >= 0; }).slice(0,6);
  if (as.length){ groups.push({ label:'Journal', items: as.map(artCard) }); total += as.length; }
  const fqs = FAQS.filter(function(f){ return (f.q + ' ' + f.a).toLowerCase().indexOf(q) >= 0; }).slice(0,6);
  if (fqs.length){
    groups.push({ label:'FAQ', items: fqs.map(function(f){
      return '<div class="card card-pad"><div class="d4" style="font-size:16px">' + esc(f.q) + '</div><p class="sm" style="margin-top:10px">' + esc(f.a.slice(0,160)) + "…</p><a href=\"#/faq\" class=\"arrow-lnk\" style=\"margin-top:14px\">Read answer <svg width=\"14\" height=\"10\" viewBox=\"\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><path d=\"M0 5h12M8 1l4 4-4 4\"/></svg></a></div>";
    })});
    total += fqs.length;
  }
  return { groups: groups, total: total };
}

function parseHash(){
  let h = location.hash.replace(/^#\/?/, '');
  if (!h) h = 'home';
  return h.split('/').filter(Boolean).map(decodeURIComponent);
}

let _lastRoute = null;
function render(){
  const parts = parseHash();
  const route = parts[0] || 'home';
  const params = parts.slice(1);
  state.route = route;
  state.params = params;

  const fn = ROUTES[route];
  let out;
  if (fn){
    try { out = fn(params); }
    catch(e){
      console.error(e);
      out = { html: notFound('Something went wrong', 'We hit an error rendering this page.', '#/home', 'Back home'), title:'Error — LACQUERIA', desc:'' };
    }
  } else {
    out = { html: notFound('Page not found', 'That page does not exist. Try one of the links below.', '#/home', 'Back home'), title:'Not Found — LACQUERIA', desc:'' };
  }

  /* SEO */
  document.title = out.title;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', out.desc || '');
  const og = document.querySelector('meta[property="og:title"]');
  if (og) og.setAttribute('content', out.title);

  /* Render */
  const app = $('#app');
  app.innerHTML = out.html;

  /* Nav active state */
  $$('#navDesk a').forEach(function(a){
    const r = (a.getAttribute('href')||'').replace('#/','');
    a.classList.toggle('on', r === route || (route === 'service' && r === 'services') || (route === 'design' && r === 'nail-art'));
  });

  /* Close overlays */
  closeDrawer();

  /* Scroll to top on route change (user-initiated navigation only) */
  if (_lastRoute !== null && _lastRoute !== location.hash){
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  _lastRoute = location.hash;

  /* Post-render */
  enhance();
  runEnterAnimations();

  /* Sticky booking bar */
  const bar = $('#bookBar');
  if (bar) setTimeout(function(){ bar.classList.add('on'); }, 400);
}

function rerender(){ render(); }

function enhance(){
  /* Accordions */
  $$('.acc-h').forEach(function(btn){
    btn.addEventListener('click', function(){
      const acc = btn.parentNode;
      const body = acc.querySelector('.acc-b');
      const open = acc.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      body.style.maxHeight = open ? (body.scrollHeight + 40) + 'px' : '0px';
    });
  });

  /* Product gallery thumbs */
  const main = $('#pdMain');
  if (main){
    $$('.pd-thumbs img').forEach(function(t){
      t.addEventListener('click', function(){
        $$('.pd-thumbs img').forEach(function(x){ x.classList.remove('on'); });
        t.classList.add('on');
        const img = main.querySelector('img');
        if (img){ img.style.opacity = '0'; setTimeout(function(){ img.src = t.getAttribute('data-thumb'); main.setAttribute('data-src', t.getAttribute('data-thumb')); img.style.opacity = '1'; }, 180); }
      });
    });
  }

  /* Product quantity */
  const qtyEl = $('#pdQty');
  if (qtyEl){
    $$('[data-qty]').forEach(function(b){
      b.addEventListener('click', function(){
        const d = parseInt(b.getAttribute('data-qty'),10);
        let v = parseInt(qtyEl.textContent,10) + d;
        v = clamp(v, 1, 20);
        qtyEl.textContent = v;
        const addBtn = $('[data-qty-src="pdQty"]');
        if (addBtn) addBtn.setAttribute('data-qty-val', v);
      });
    });
  }

  /* Shop sort */
  const sortSel = $('#shopSort');
  if (sortSel){
    sortSel.addEventListener('change', function(){
      state._shopSort = sortSel.value;
      render();
    });
  }

  /* Gift card live preview */
  const gcCustom = $('#gcCustom');
  if (gcCustom){
    const update = function(){
      state.giftCardDraft.custom = gcCustom.value;
      const d = state.giftCardDraft;
      const fields = { gcTo:'to', gcFrom:'from', gcEmail:'email', gcDate:'date', gcMsg:'message', gcDelivery:'delivery' };
      Object.keys(fields).forEach(function(id){
        const el = $('#' + id);
        if (el) d[fields[id]] = el.value;
      });
      render();
      setTimeout(function(){
        const c = $('#gcCustom'); if (c) { c.focus(); c.setSelectionRange(c.value.length, c.value.length); }
      }, 0);
    };
    gcCustom.addEventListener('change', update);
    const gcMsg = $('#gcMsg');
    if (gcMsg){
      gcMsg.addEventListener('input', function(){
        const cnt = $('#gcCount');
        if (cnt) cnt.textContent = gcMsg.value.length + '/240';
      });
    }
  }

  /* Contact phone quick lookup */
  const ql = $('#ctQuickLoc');
  if (ql){
    ql.addEventListener('change', function(){
      const l = LOC_BY[ql.value];
      const out = $('#ctPhoneOut');
      if (out) out.innerHTML = l ? '<a href="tel:' + l.phone.replace(/\s/g,'') + '" class="lnk" style="color:var(--lac3)">' + esc(l.phone) + '</a><br><span class="xs">' + esc(l.street + ', ' + l.city) + '</span>' : '';
    });
  }

  /* Sticky booking bar visibility */
  const bar = $('#bookBar');
  if (bar){
    const onScroll = function(){
      const y = window.scrollY;
      bar.classList.toggle('on', y > 200);
    };
    window.removeEventListener('scroll', window.__bookScroll || function(){});
    window.__bookScroll = onScroll;
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }
}

/* ---------------------------------------------------------------------------
   14. ANIMATIONS
   --------------------------------------------------------------------------- */
function prefersReduced(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
let _triggers = [];
function killTriggers(){
  if (window.ScrollTrigger){
    _triggers.forEach(function(t){ try { t.kill(); } catch(e){} });
  }
  _triggers = [];
}
function runEnterAnimations(){
  killTriggers();
  if (!window.gsap) return;
  const reduce = prefersReduced();

  /* Page enter */
  const app = $('#app');
  if (app){
    gsap.fromTo(app, { opacity: 0 }, { opacity: 1, duration: reduce ? 0.01 : 0.45, ease: 'power2.out' });
  }

  if (reduce) return;

  if (window.ScrollTrigger){
    gsap.registerPlugin(ScrollTrigger);

    /* Hero entrance */
    const heroIn = $('.hero-in');
    if (heroIn){
      gsap.fromTo(heroIn.children, { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, stagger: 0.1, ease: 'power3.out', delay: 0.15 });
    }
    const heroBg = $('.hero-bg img');
    if (heroBg){
      gsap.to(heroBg, {
        yPercent: 14, ease: 'none',
        scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: 0.6 }
      });
    }

    /* Section reveals */
    $$('.sec > .wrap-wide, .sec > .wrap-tight, .sec-sm > .wrap-wide').forEach(function(el){
      const kids = Array.prototype.slice.call(el.children);
      if (!kids.length) return;
      const t = gsap.fromTo(kids, { y: 34, opacity: 0 }, {
        y: 0, opacity: 1, duration: 0.85, stagger: 0.08, ease: 'power3.out',
        scrollTrigger: { trigger: el, start: 'top 88%', once: true }
      });
      _triggers.push(t.scrollTrigger);
    });

    /* Cards */
    $$('.pgrid, .grid').forEach(function(g){
      if (g.children.length < 3) return;
      const t = gsap.fromTo(g.children, { y: 26, opacity: 0 }, {
        y: 0, opacity: 1, duration: 0.7, stagger: 0.05, ease: 'power2.out',
        scrollTrigger: { trigger: g, start: 'top 90%', once: true }
      });
      _triggers.push(t.scrollTrigger);
    });

    /* Rails */
    $$('.rail').forEach(function(r){
      const t = gsap.fromTo(r.children, { x: 60, opacity: 0 }, {
        x: 0, opacity: 1, duration: 0.8, stagger: 0.06, ease: 'power3.out',
        scrollTrigger: { trigger: r, start: 'top 90%', once: true }
      });
      _triggers.push(t.scrollTrigger);
    });

    /* Headings with italic accent */
    $$('.d1, .d2, .d3').forEach(function(h){
      if (h.closest('.hero')) return;
      const t = gsap.fromTo(h, { y: 22, opacity: 0 }, {
        y: 0, opacity: 1, duration: 0.9, ease: 'power3.out',
        scrollTrigger: { trigger: h, start: 'top 92%', once: true }
      });
      _triggers.push(t.scrollTrigger);
    });

    /* Parallax on large media */
    $$('.media-4x5 img, .media-3x4 img').forEach(function(im){
      const t = gsap.fromTo(im, { yPercent: -4 }, {
        yPercent: 4, ease: 'none',
        scrollTrigger: { trigger: im.parentNode, start: 'top bottom', end: 'bottom top', scrub: 0.8 }
      });
      _triggers.push(t.scrollTrigger);
    });

    ScrollTrigger.refresh();
  }
}

/* ---------------------------------------------------------------------------
   15. EVENT DELEGATION
   --------------------------------------------------------------------------- */
document.addEventListener('click', function(e){
  const t = e.target;

  /* Close modal */
  if (t.closest('[data-close-modal]')){ closeModal(); return; }
  if (t.closest('[data-close-drawer]')){ closeDrawer(); return; }

  /* Wishlist */
  const w = t.closest('[data-wish]');
  if (w){ e.preventDefault(); toggleWishlist(w.getAttribute('data-wish')); return; }

  /* Saved looks */
  const sl = t.closest('[data-save-look]');
  if (sl){ e.preventDefault(); e.stopPropagation(); toggleSavedLook(sl.getAttribute('data-save-look')); return; }

  /* Add to cart */
  const a = t.closest('[data-add]');
  if (a){
    e.preventDefault();
    const id = a.getAttribute('data-add');
    let qty = 1;
    const src = a.getAttribute('data-qty-src');
    if (src){ const el = document.getElementById(src); if (el) qty = parseInt(el.textContent,10) || 1; }
    addToCart(id, qty);
    const icon = $('#cartCount');
    if (icon && window.gsap && !prefersReduced()){
      gsap.fromTo(icon, { scale: 1 }, { scale: 1.6, duration: 0.2, yoyo: true, repeat: 1, ease: 'power2.out' });
    }
    return;
  }

  /* Cart qty */
  const cq = t.closest('[data-cart-qty]');
  if (cq){
    const id = cq.getAttribute('data-cart-qty');
    const d = parseInt(cq.getAttribute('data-d'),10);
    const line = state.cart.filter(function(x){ return x.id === id; })[0];
    if (line) setQty(id, line.qty + d);
    render();
    return;
  }
  const cr = t.closest('[data-cart-remove]');
  if (cr){ setQty(cr.getAttribute('data-cart-remove'), 0); render(); return; }
  const cs = t.closest('[data-cart-save]');
  if (cs){ const id = cs.getAttribute('data-cart-save'); setQty(id, 0); toggleWishlist(id); render(); return; }

  /* Brand filter */
  const bf = t.closest('[data-brand]');
  if (bf){
    const b = bf.getAttribute('data-brand');
    state._shopBrand = b || null;
    render();
    return;
  }
  if (t.closest('[data-clear-filters]')){ state._shopBrand = null; render(); return; }

  /* Drawer */
  if (t.closest('#burgerBtn')){ openDrawer(); return; }

  /* Search */
  if (t.closest('#searchBtn')){ openSearch(); return; }
  if (t.closest('#searchClose')){ closeSearch(); return; }

  /* Lightbox */
  if (t.closest('#lbClose')){ closeLightbox(); return; }
  if (t.closest('#lbPrev')){ lbStep(-1); return; }
  if (t.closest('#lbNext')){ lbStep(1); return; }

  /* Zoom hint / zoomable */
  const z = t.closest('[data-zoom]');
  if (z){
    const src = z.getAttribute('data-src');
    const cap = z.getAttribute('data-cap');
    if (src){
      const gallery = $$('[data-zoom]').map(function(el){
        return { src: el.getAttribute('data-src'), alt: el.getAttribute('data-cap') || '' };
      });
      const idx = gallery.map(function(g){ return g.src; }).indexOf(src);
      openLightbox(gallery, idx < 0 ? 0 : idx);
      return;
    }
  }
  if (t.closest('.zoomable') && !t.closest('[data-zoom]')){
    const im = t.closest('.zoomable').querySelector('img');
    if (im){ openLightbox([{ src: im.src, alt: im.alt }], 0); }
    return;
  }

  /* Location picker */
  if (t.closest('#locPill')){ openLocationModal(); return; }
  if (t.closest('[data-action="pick-location"]')){ openLocationModal(); return; }
  const setLoc = t.closest('[data-set-location]');
  if (setLoc){
    setLocation(setLoc.getAttribute('data-set-location'));
    toast('Atelier set to ' + (LOC_BY[state.locationId] || {}).name + '.', 'ok');
    return;
  }

  /* Booking actions */
  const bs = t.closest('[data-book-service]');
  if (bs){
    const id = bs.getAttribute('data-book-service');
    state.bookingDraft = newDraft();
    state.bookingDraft.serviceId = id;
    state.bookingDraft.locationId = state.locationId || null;
    state.bookingDraft.step = state.locationId ? 3 : 2;
    save();
    location.hash = '#/book';
    if (state.route === 'book') render();
    return;
  }
  const bt = t.closest('[data-book-tech]');
  if (bt){
    const id = bt.getAttribute('data-book-tech');
    state.bookingDraft = newDraft();
    state.bookingDraft.technicianId = id;
    const tech = TECH_BY[id];
    state.bookingDraft.locationId = tech ? tech.loc : (state.locationId || null);
    state.bookingDraft.step = 1;
    save();
    location.hash = '#/book';
    if (state.route === 'book') render();
    return;
  }
  const btl = t.closest('[data-book-tech-link]');
  if (btl){
    e.preventDefault();
    state.bookingDraft = newDraft();
    state.bookingDraft.technicianId = btl.getAttribute('data-book-tech-link');
    const tech = TECH_BY[state.bookingDraft.technicianId];
    state.bookingDraft.locationId = tech ? tech.loc : null;
    save();
    location.hash = '#/book';
    return;
  }
  const bl = t.closest('[data-book-loc]');
  if (bl){
    state.bookingDraft = newDraft();
    state.bookingDraft.locationId = bl.getAttribute('data-book-loc');
    state.bookingDraft.step = 1;
    save();
    location.hash = '#/book';
    if (state.route === 'book') render();
    return;
  }
  const bd = t.closest('[data-book-design]');
  if (bd){
    const des = DES_BY[bd.getAttribute('data-book-design')];
    state.bookingDraft = newDraft();
    state.bookingDraft.serviceId = 'sv-gel-mani';
    state.bookingDraft.locationId = state.locationId || null;
    state.bookingDraft.addons = ['art-det'];
    state.bookingDraft.step = state.locationId ? 3 : 2;
    state._bookDesignNote = des ? des.name : '';
    save();
    location.hash = '#/book';
    if (state.route === 'book') render();
    else render();
    return;
  }
  const atb = t.closest('[data-action="add-to-booking"]');
  if (atb){
    if (!state.bookingDraft) state.bookingDraft = newDraft();
    state.bookingDraft.serviceId = atb.getAttribute('data-id');
    save();
    toast('Added to your current booking.', 'ok');
    return;
  }

  /* Booking step picks */
  const ps = t.closest('[data-pick-service]');
  if (ps){ state.bookingDraft.serviceId = ps.getAttribute('data-pick-service'); state.bookingDraft.addons = []; save(); render(); return; }
  const pl = t.closest('[data-pick-loc]');
  if (pl){ state.bookingDraft.locationId = pl.getAttribute('data-pick-loc'); state.bookingDraft.technicianId = null; state.bookingDraft.date = null; state.bookingDraft.time = null; save(); render(); return; }
  const pt = t.closest('[data-pick-tech]');
  if (pt){ state.bookingDraft.technicianId = pt.getAttribute('data-pick-tech'); state.bookingDraft.date = null; state.bookingDraft.time = null; save(); render(); return; }
  const pd = t.closest('[data-pick-date]');
  if (pd){ state.bookingDraft.date = pd.getAttribute('data-pick-date'); state.bookingDraft.time = null; save(); render(); return; }
  const ptime = t.closest('[data-pick-time]');
  if (ptime){ state.bookingDraft.time = ptime.getAttribute('data-pick-time'); save(); render(); return; }
  const ta = t.closest('[data-toggle-addon]');
  if (ta){
    const id = ta.getAttribute('data-toggle-addon');
    const i = state.bookingDraft.addons.indexOf(id);
    if (i >= 0) state.bookingDraft.addons.splice(i,1); else state.bookingDraft.addons.push(id);
    state.bookingDraft.time = null;
    save(); render(); return;
  }
  const pp = t.closest('[data-pick-payment]');
  if (pp){ state.bookingDraft.payment = pp.getAttribute('data-pick-payment'); save(); render(); return; }
  const bc = t.closest('[data-book-clear]');
  if (bc){
    const what = bc.getAttribute('data-book-clear');
    if (what === 'service'){ state.bookingDraft.serviceId = null; state.bookingDraft.addons = []; state.bookingDraft.time = null; }
    save(); render(); return;
  }
  if (t.closest('[data-book-back]')){
    const d = state.bookingDraft;
    captureStepFields();
    d.step = Math.max(1, (d.step||1) - 1);
    save(); render(); return;
  }
  if (t.closest('[data-book-next]')){
    const d = state.bookingDraft;
    if (d.step === 7) captureStepFields();
    const err = validateStep(d.step);
    if (err){ toast(err, 'err'); return; }
    if (d.step === 9){
      const booking = confirmBooking();
      if (booking){ location.hash = '#/booking-confirmation/' + booking.id; }
      return;
    }
    d.step = Math.min(9, (d.step||1) + 1);
    save(); render(); return;
  }
  if (t.closest('[data-apply-promo]')){
    const inp = $('#bkPromo');
    const code = inp ? inp.value.trim().toUpperCase() : '';
    const promo = PROMOS.filter(function(p){ return p.code === code && p.active; })[0];
    const d = state.bookingDraft;
    if (!promo){
      d.promoError = 'That code is not valid or has expired.';
      d.coupon = null;
    } else if (promo.scope === 'products'){
      d.promoError = 'That code applies to product orders only.';
      d.coupon = null;
    } else if (promo.min && draftPrice().base < promo.min){
      d.promoError = 'This code requires a minimum service spend of ' + money(promo.min) + '.';
      d.coupon = null;
    } else {
      d.coupon = promo; d.promoError = null;
      toast('Code ' + promo.code + ' applied.', 'ok');
    }
    save(); render(); return;
  }

  /* Calendar nav */
  if (t.closest('[data-cal-prev]')){
    let m = state._calMonth === undefined ? new Date().getMonth() : state._calMonth;
    let y = state._calYear || new Date().getFullYear();
    m--; if (m < 0){ m = 11; y--; }
    state._calMonth = m; state._calYear = y; render(); return;
  }
  if (t.closest('[data-cal-next]')){
    let m = state._calMonth === undefined ? new Date().getMonth() : state._calMonth;
    let y = state._calYear || new Date().getFullYear();
    m++; if (m > 11){ m = 0; y++; }
    state._calMonth = m; state._calYear = y; render(); return;
  }

  /* Reschedule */
  const rt = t.closest('[data-rs-time]');
  if (rt){ state._reschedule.time = rt.getAttribute('data-rs-time'); render(); return; }
  const rd = t.closest('[data-pick-date]');
  if (rd && state.route === 'reschedule'){ state._reschedule.date = rd.getAttribute('data-pick-date'); state._reschedule.time = null; render(); return; }
  const rtt = t.closest('[data-rs-tech]');
  if (rtt){ state._reschedule.technicianId = rtt.getAttribute('data-rs-tech'); state._reschedule.time = null; render(); return; }
  const rc = t.closest('[data-rs-confirm]');
  if (rc){
    const id = rc.getAttribute('data-rs-confirm');
    const b = state.bookings.filter(function(x){ return x.id === id; })[0];
    if (b && state._reschedule){
      b.date = state._reschedule.date;
      b.time = state._reschedule.time;
      b.technicianId = state._reschedule.technicianId === 'any' ? (techsAtLocation(b.locationId)[0] || {}).id : state._reschedule.technicianId;
      b.status = 'confirmed';
      save();
      state._reschedule = null;
      toast('Booking rescheduled.', 'ok');
      pushNotification('Booking rescheduled', id + ' moved to ' + fmtDate(b.date) + ' at ' + fmtTime(b.time));
      location.hash = '#/booking/' + id;
    }
    return;
  }

  /* Cancel booking */
  const cb = t.closest('[data-cancel-booking]');
  if (cb){
    const id = cb.getAttribute('data-cancel-booking');
    const b = state.bookings.filter(function(x){ return x.id === id; })[0];
    if (!b) return;
    const hours = Math.round((new Date(b.date + 'T' + b.time) - new Date()) / 3600000);
    const free = hours > 24;
    openModal(
      modalHeader('Cancel booking', id) +
      '<div class="modal-bd-in">' +
        '<p class="lead">You are about to cancel your ' + esc(SVC_BY[b.serviceId] ? SVC_BY[b.serviceId].name : 'appointment') + ' on ' + esc(fmtDateLong(b.date)) + ' at ' + esc(fmtTime(b.time)) + '.</p>' +
        '<div class="card card-pad" style="margin-top:20px">' +
          '<div class="mono" style="color:var(--lac3);margin-bottom:10px">Deposit rules</div>' +
          '<p class="sm">' + (free
            ? 'You are cancelling more than 24 hours before your appointment, so your deposit of ' + money(b.deposit) + ' is fully refundable and will be returned within five working days.'
            : 'You are cancelling within 24 hours of your appointment, so your deposit of ' + money(b.deposit) + ' is retained. It covers the technician\u2019s reserved time, which cannot be resold at short notice.') + '</p>' +
        '</div>' +
        '<div class="field" style="margin-top:20px"><label for="cxReason">Reason (optional)</label>' +
          '<select class="select" id="cxReason">' +
            ['I need to reschedule','I am unwell','Something came up','I found another time','Other'].map(function(x){ return '<option>' + esc(x) + '</option>'; }).join('') +
          '</select></div>' +
        '<div class="field"><label for="cxNote">Anything else?</label><textarea class="textarea" id="cxNote" style="min-height:90px"></textarea></div>' +
        '<div class="mid wrapf" style="gap:10px;margin-top:8px">' +
          '<button class="btn btn-lac" data-cancel-confirm="' + id + '">Confirm cancellation</button>' +
          '<button class="btn" data-close-modal>Keep my booking</button>' +
          '<a href="#/reschedule/' + id + '" class="btn">Reschedule instead</a>' +
        '</div>' +
      '</div>'
    );
    return;
  }
  const cc = t.closest('[data-cancel-confirm]');
  if (cc){
    const id = cc.getAttribute('data-cancel-confirm');
    const b = state.bookings.filter(function(x){ return x.id === id; })[0];
    if (b){
      b.status = 'cancelled';
      b.cancelledAt = new Date().toISOString();
      save();
      closeModal();
      toast('Booking ' + id + ' cancelled.', 'ok');
      pushNotification('Booking cancelled', id + ' was cancelled.');
      render();
    }
    return;
  }

  /* Add to calendar */
  const ical = t.closest('[data-ical]');
  if (ical){
    const id = ical.getAttribute('data-ical');
    const b = state.bookings.filter(function(x){ return x.id === id; })[0];
    if (!b) return;
    const svc = SVC_BY[b.serviceId], loc = LOC_BY[b.locationId];
    const start = b.date.replace(/-/g,'') + 'T' + b.time.replace(':','') + '00';
    const endMin = toMin(b.time) + b.duration;
    const end = b.date.replace(/-/g,'') + 'T' + fromMin(endMin).replace(':','') + '00';
