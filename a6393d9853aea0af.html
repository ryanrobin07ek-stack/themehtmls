    .torn-paper-edge-down {

      height: 48px;

      overflow: hidden;
      line-height: 0;
      z-index: 10;
    }
    .torn-paper-edge-up {
      position: relative;
      width: 100%;
      height: 48px;
      margin-top: -1px;
      overflow: hidden;
      line-height: 0;
      z-index: 10;
    }

    /* Smooth Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--theme-shamba-bora-kenya-s-premier-agricultural-inputs-agrovet-platform-color-05);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--theme-shamba-bora-kenya-s-premier-agricultural-inputs-agrovet-platform-color-06);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-shamba-bora-kenya-s-premier-agricultural-inputs-agrovet-platform-color-07);
    }

    /* Hide horizontal scrollbar on rails while keeping scrollable */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Modal Backdrop Transitions */
    .modal-backdrop {
      background-color: var(--theme-shamba-bora-kenya-s-premier-agricultural-inputs-agrovet-platform-color-08);
      backdrop-filter: blur(4px);

      color: var(--theme-shamba-bora-kenya-s-premier-agricultural-inputs-agrovet-platform-color-06);

      padding: 1rem;

    // Application State
    const AppState = {
      currentRoute: window.location.hash || '#/',
      cart: JSON.parse(localStorage.getItem('sb_cart') || '[]'),
      wishlist: JSON.parse(localStorage.getItem('sb_wishlist') || '[]'),
      activeCounty: localStorage.getItem('sb_county') || 'Nakuru',
      activeFilterCategory: '',
      activeFilterSubcategory: '',
      activeFilterBrand: '',
      activeFilterSearch: '',
      activeFilterPriceMin: 0,
      activeFilterPriceMax: 3000000,
      activeFilterInStockOnly: false,
      activeFilterRestrictedOnly: false,
      activeSort: 'relevance',
      viewMode: 'grid',
      orders: JSON.parse(localStorage.getItem('sb_orders') || '[]'),
      quickViewId: null,
      countdownTimer: null
    };

    // Initialize Counties Selectors
    function initCountySelectors() {
      const select = document.getElementById('userCountySelect');
      if (select) {
        select.innerHTML = COUNTIES_DATA.map(c => 
          `<option ${c.name === AppState.activeCounty ? 'selected' : ''}><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:95%"></span></option>`
        ).join('');
      }
    }

    function changeActiveCounty(countyName) {
      AppState.activeCounty = countyName;
      localStorage.setItem('sb_county', countyName);
      updateCartTotalsBadge();
      showToast(`Delivery location set to ${countyName} County`);
      // re-render cart or checkout if on that screen
      if (window.location.hash === '#/cart' || window.location.hash === '#/checkout') {
        renderScreen();
      }
    }

    // Cart and Wishlist Persistence Helpers
    function saveCart() {
      localStorage.setItem('sb_cart', JSON.stringify(AppState.cart));
      updateCartTotalsBadge();
    }
    function saveWishlist() {
      localStorage.setItem('sb_wishlist', JSON.stringify(AppState.wishlist));
      updateWishlistBadge();
    }

    function addToCart(productId, qty = 1) {
      const product = PRODUCTS_DATA.find(p => p.id === productId);
      if (!product) return;
      if (product.isQuotationOnly) {
        openQuoteModal(productId);
        return;
      }
      const existing = AppState.cart.find(i => i.id === productId);
      if (existing) {
        existing.qty += qty;
      } else {
        AppState.cart.push({
          id: product.id,
          name: product.name,
          brand: product.brand,
          price: product.price,
          packSize: product.packSize,
          image: product.image,
          category: product.category,
          isRestricted: product.isRestricted,
          qty: qty
        });
      }
      saveCart();
      showToast(`Added ${qty}x ${product.name} to your basket!`);
    }

    function removeFromCart(productId) {
      AppState.cart = AppState.cart.filter(i => i.id !== productId);
      saveCart();
      showToast('Item removed from basket');
      if (window.location.hash === '#/cart' || window.location.hash === '#/checkout') {
        renderScreen();
      }
    }

    function updateCartItemQty(productId, delta) {
      const item = AppState.cart.find(i => i.id === productId);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        removeFromCart(productId);
      } else {
        saveCart();
        if (window.location.hash === '#/cart' || window.location.hash === '#/checkout') {
          renderScreen();
        }
      }
    }

    function toggleWishlist(productId) {
      const index = AppState.wishlist.indexOf(productId);
      if (index >= 0) {
        AppState.wishlist.splice(index, 1);
        showToast('Item removed from your wishlist');
      } else {
        AppState.wishlist.push(productId);
        showToast('Saved to your agricultural wishlist!');
      }
      saveWishlist();
      // If we are currently on wishlist screen, re-render
      if (window.location.hash === '#/wishlist') {
        renderScreen();
      } else {
        // Update any heart icons on visible page
        document.querySelectorAll(`.wishlist-btn-${productId}`).forEach(btn => {
          btn.classList.toggle('text-amber-600', AppState.wishlist.includes(productId));
          btn.classList.toggle('fill-amber-600', AppState.wishlist.includes(productId));
        });
      }
    }

      const countBadge = document.getElementById('cartCountBadge');

    // ==================== SCREEN RENDERING ENGINE ====================
    function renderScreen() {
      const hash = window.location.hash || '#/';
      const container = document.getElementById('appContainer');
      if (!container) return;

      // Scroll smoothly to top
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Kill previous ScrollTrigger instances to prevent stale listeners
      if (typeof ScrollTrigger !== 'undefined') {
        ScrollTrigger.getAll().forEach(t => t.kill());
      }

      // Route matching
      if (hash === '#/' || hash === '#' || hash === '') {
        container.innerHTML = renderHomeScreen();
      } else if (hash.startsWith('#/shop') || hash.startsWith('#/products')) {
        container.innerHTML = renderShopScreen();
      } else if (hash === '#/categories') {
        container.innerHTML = renderCategoriesScreen();
      } else if (hash.startsWith('#/category/')) {
        const catId = hash.replace('#/category/', '').split('?')[0];
        container.innerHTML = renderCategoryDetailScreen(catId);
      } else if (hash.startsWith('#/product/')) {
        const prodId = hash.replace('#/product/', '').split('?')[0];
        container.innerHTML = renderProductDetailScreen(prodId);
      } else if (hash === '#/brands') {
        container.innerHTML = renderBrandsScreen();
      } else if (hash.startsWith('#/brand/')) {
        const brandId = hash.replace('#/brand/', '').split('?')[0];
        container.innerHTML = renderBrandDetailScreen(brandId);
      } else if (hash === '#/cart') {
        container.innerHTML = renderCartScreen();
      } else if (hash === '#/checkout') {
        container.innerHTML = renderCheckoutScreen();
      } else if (hash.startsWith('#/order-confirmation')) {
        container.innerHTML = renderOrderConfirmationScreen();
      } else if (hash === '#/orders') {
        container.innerHTML = renderOrdersScreen();
      } else if (hash === '#/wishlist') {
        container.innerHTML = renderWishlistScreen();
      } else if (hash === '#/quote-request') {
        container.innerHTML = renderQuoteRequestScreen();
      } else if (hash === '#/bulk-orders') {
        container.innerHTML = renderBulkOrdersScreen();
      } else if (hash === '#/resources') {
        container.innerHTML = renderResourcesScreen();
      } else if (hash.startsWith('#/resource/')) {
        const slug = hash.replace('#/resource/', '').split('?')[0];
        container.innerHTML = renderResourceDetailScreen(slug);
      } else if (hash === '#/delivery') {
        container.innerHTML = renderDeliveryScreen();
      } else if (hash === '#/contact') {
        container.innerHTML = renderContactScreen();
      } else if (hash === '#/about') {
        container.innerHTML = renderAboutScreen();
      } else if (hash === '#/returns') {
        container.innerHTML = renderReturnsScreen();
      } else if (hash === '#/terms') {
        container.innerHTML = renderTermsScreen();
      } else if (hash === '#/privacy') {
        container.innerHTML = renderPrivacyScreen();
      } else {
        container.innerHTML = renderNotFoundScreen();
      }

      // Refresh Lucide icons on newly inserted DOM elements
      lucide.createIcons();

      // Trigger GSAP entrance animations
      initScreenAnimations();
    }

    // ==================== SCREEN 2: ALL PRODUCTS / SHOP ====================
    function renderShopScreen() {
      // Parse active query params if any
      const urlParams = new URLSearchParams(window.location.hash.split('?')[1] || '');
      const searchParam = urlParams.get('search') || '';
      const catParam = urlParams.get('category') || '';
      const brandParam = urlParams.get('brand') || '';

      if (searchParam) AppState.activeFilterSearch = searchParam;
      if (catParam) AppState.activeFilterCategory = catParam;
      if (brandParam) AppState.activeFilterBrand = brandParam;

      // Filter products
      let filtered = PRODUCTS_DATA.filter(p => {
        if (AppState.activeFilterSearch) {
          const q = AppState.activeFilterSearch.toLowerCase();
          const matchName = p.name.toLowerCase().includes(q);
          const matchBrand = p.brand.toLowerCase().includes(q);
          const matchDesc = p.description.toLowerCase().includes(q);
          const matchCat = p.category.toLowerCase().includes(q);
          const matchSub = p.subcategory.toLowerCase().includes(q);
          if (!matchName && !matchBrand && !matchDesc && !matchCat && !matchSub) return false;
        }
        if (AppState.activeFilterCategory && p.category !== AppState.activeFilterCategory) {
          return false;
        }
        if (AppState.activeFilterSubcategory && p.subcategory !== AppState.activeFilterSubcategory) {
          return false;
        }
        if (AppState.activeFilterBrand && p.brand !== AppState.activeFilterBrand) {
          return false;
        }
        if (AppState.activeFilterInStockOnly && !p.inStock) {
          return false;
        }
        if (AppState.activeFilterRestrictedOnly && !p.isRestricted) {
          return false;
        }
        if (p.price < AppState.activeFilterPriceMin || p.price > AppState.activeFilterPriceMax) {
          return false;
        }
        return true;
      });

      // Sort
      if (AppState.activeSort === 'price-low') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (AppState.activeSort === 'price-high') {
        filtered.sort((a, b) => b.price - a.price);
      } else if (AppState.activeSort === 'rating') {
        filtered.sort((a, b) => b.rating - a.rating);
      } else if (AppState.activeSort === 'name') {
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      }

      // Find subcategories for selected category
      let availableSubcategories = [];

    function updateFilter(key, val) {
      if (key === 'category') {
        AppState.activeFilterCategory = val;
        AppState.activeFilterSubcategory = ''; // reset subcat on cat change
      } else if (key === 'subcategory') {
        AppState.activeFilterSubcategory = val;
      } else if (key === 'brand') {
        AppState.activeFilterBrand = val;
      } else if (key === 'search') {
        AppState.activeFilterSearch = val;
      } else if (key === 'priceMax') {
        AppState.activeFilterPriceMax = val;
      } else if (key === 'inStockOnly') {
        AppState.activeFilterInStockOnly = val;
      } else if (key === 'restrictedOnly') {
        AppState.activeFilterRestrictedOnly = val;
      }
      renderScreen();
    }

    function updateSort(val) {
      AppState.activeSort = val;
      renderScreen();
    }

    function resetFilters() {
      AppState.activeFilterCategory = '';
      AppState.activeFilterSubcategory = '';
      AppState.activeFilterBrand = '';
      AppState.activeFilterSearch = '';
      AppState.activeFilterPriceMin = 0;
      AppState.activeFilterPriceMax = 3000000;
      AppState.activeFilterInStockOnly = false;
      AppState.activeFilterRestrictedOnly = false;
      AppState.activeSort = 'relevance';
      renderScreen();
    }

    // ==================== GSAP & SCROLLTRIGGER INITIALIZATION ====================
    function initScreenAnimations() {
      // Respect prefers-reduced-motion
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }
      if (typeof gsap === 'undefined') return;

      // Register ScrollTrigger plugin
      if (typeof ScrollTrigger !== 'undefined') {
        gsap.registerPlugin(ScrollTrigger);
      }

      // Smooth fade-up for product cards
      gsap.fromTo('.product-card', 
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, stagger: 0.04, ease: 'power2.out' }
      );

      // Hero animation if present
      const heroTitle = document.querySelector('h1');
      if (heroTitle) {
        gsap.fromTo(heroTitle,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }
        );
      }
    }

    const headerSearch = document.getElementById('headerSearchInput');
    if (headerSearch) {
      headerSearch.addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        const drop = document.getElementById('liveSearchResults');
        if (!drop) return;
        if (q.length < 2) {
          drop.classList.add('hidden');
          return;
        }
        const matches = PRODUCTS_DATA.filter(p => 
          p.name.toLowerCase().includes(q) || 
          p.brand.toLowerCase().includes(q) || 
          p.subcategory.toLowerCase().includes(q)
        ).slice(0, 5);

        if (matches.length === 0) {
          drop.innerHTML = '<div class="p-3 text-xs text-earth-500">No matching agricultural inputs found</div>';
        } else {
          drop.innerHTML = matches.map(m => `
            <a href="#/product/${m.id}" onclick="document.getElementById('liveSearchResults').classList.add('hidden')" class="flex items-center gap-3 p-2 hover:bg-earth-50 rounded-xl transition-colors">

          `).join('');
        }

        drop.classList.add('hidden');

    });
