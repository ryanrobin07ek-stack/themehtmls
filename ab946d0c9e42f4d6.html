/* =========================================================================
   12. ROUTER
   ========================================================================= */
function route() {
  const { parts, params } = parseHash();
  const main = $('#main');
  if (!main) return;
  let html = '';
  let title = 'Drizzle';

  if (!parts.length) { html = screenHome(); title = 'Home'; }
  else if (parts[0] === 'products') { html = screenAllProducts(params); title = 'All dishes'; }
  else if (parts[0] === 'categories') { html = screenCategories(); title = 'Categories'; }
  else if (parts[0] === 'c' && parts[1]) { html = screenCategory(parts[1], params); title = getCategoryBySlug(parts[1]) ? getCategoryBySlug(parts[1]).name : 'Category'; }
  else if (parts[0] === 'p' && parts[1]) { html = screenProduct(parts[1]); title = getProductBySlug(parts[1]) ? getProductBySlug(parts[1]).name : 'Dish'; }
  else if (parts[0] === 'search') { html = screenSearch(params); title = 'Search'; }
  else if (parts[0] === 'cart') { html = screenCartPage(); title = 'Cart'; }
  else if (parts[0] === 'wishlist') { html = screenWishlist(); title = 'Wishlist'; }
  else if (parts[0] === 'checkout') { html = screenCheckout(); title = 'Checkout'; }
  else if (parts[0] === 'order-confirmed') { html = screenOrderConfirm(); title = 'Order confirmed'; }
  else if (parts[0] === 'account') { html = screenAccount(); title = 'Account'; }
  else if (parts[0] === 'page' && parts[1]) { html = screenPage(parts[1]); title = (Store.pages.find((p) => p.slug === parts[1]) || {}).title || 'Page'; }
  else { html = screenNotFound(); title = 'Not found'; }

  main.innerHTML = html;
  document.title = title + ' — Drizzle';
  bindMain();
  if (location.hash.indexOf('#/p/') === 0 || location.hash === '#/' || location.hash === '') {
    window.scrollTo({ top: 0, behavior: 'auto' });
  } else {
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
  markTab();
  updateCartCount();
  updateWishCount();
  closeMobileMenu();
  closeSearchOverlay();
  toggleMega(false);
}

/* =========================================================================
   13. EVENT BINDING
   ========================================================================= */
function bindMain() {
  const main = $('#main');
  if (!main) return;

  // header search shortcut
  // (bound globally in init)

  // product card wish buttons
  main.addEventListener('click', mainClickDelegate, { once: false });

  // sort
  const sortSel = $('#sortSelect');
  if (sortSel) {
    sortSel.addEventListener('change', () => {
      const { parts, params } = parseHash();
      const next = new URLSearchParams(params.toString());
      next.set('sort', sortSel.value);
      next.delete('page');
      const path = '/' + parts.join('/');
      location.hash = path + '?' + next.toString();
    });
  }

  // filter inputs
  const sidebar = $('#filtersSidebar');
  if (sidebar) {
    sidebar.addEventListener('change', onFilterChange);
    sidebar.addEventListener('input', debounce(onFilterChange, 280));
  }

  // mobile filter button
  const openFilters = $('#openFiltersBtn');
  if (openFilters) {
    openFilters.addEventListener('click', () => {
      // mirror sidebar filters into drawer
      const drawerBody = $('#filterDrawerBody');
      const { params } = parseHash();
      const f = readFilters(params);
      const { parts } = parseHash();
      const scoped = parts[0] === 'c' ? (getCategoryBySlug(parts[1]) || {}).id : null;
      drawerBody.innerHTML = filtersHTML(f, 'category', scoped);
      drawerBody.querySelectorAll('input').forEach((el) => {
        el.addEventListener('change', onFilterChange);
        el.addEventListener('input', debounce(onFilterChange, 280));
      });
      $('#filterDrawer').dataset.open = 'true';
      document.body.style.overflow = 'hidden';
    });
  }

  // PDP interactions
  bindPDP(main);

  // checkout
  bindCheckout();

  // account
  bindAccount();

  // newsletter
  const nlForm = $('#newsletterForm');
  if (nlForm) {
    nlForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = $('#newsletterMsg');
      const input = nlForm.querySelector('input');
      if (input && input.value) {
        msg.textContent = 'Thanks — you are on the list (demo).';
        input.value = '';
      }
    });
  }

  // search page form
  const spForm = $('#searchPageForm');
  if (spForm) {
    spForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = (spForm.querySelector('input[name=q]').value || '').trim();
      navigate('/search' + buildQuery({ q: q }));
    });
  }
}

function mainClickDelegate(e) {
  const wish = e.target.closest('[data-wish]');
  if (wish) {
    e.preventDefault();
    toggleWish(wish.getAttribute('data-wish'));
    return;
  }
  const quick = e.target.closest('[data-quickadd]');
  if (quick) {
    e.preventDefault();
    const p = getProductById(quick.getAttribute('data-quickadd'));
    if (p) addToCart(p, { qty: 1 });
    return;
  }
  const addToCartBtn = e.target.closest('[data-add-to-cart]');
  if (addToCartBtn) {
    e.preventDefault();
    const p = getProductById(addToCartBtn.getAttribute('data-add-to-cart'));
    if (!p) return;
    const qtyEl = $('[data-qty-input]');
    const qty = qtyEl ? clamp(Number(qtyEl.value) || 1, 1, 99) : 1;
    // variant selection
    const variant = {};
    const sizeEl = $('[data-size-group] [aria-pressed="true"]');
    const colorEl = $('[data-color-group] [aria-pressed="true"]');
    let variantLabel = '';
    if (sizeEl) { variant.size = sizeEl.getAttribute('data-size'); variantLabel = variant.size; }
    if (colorEl) {
      const ci = Number(colorEl.getAttribute('data-color'));
      const c = (p.colors || [])[ci];
      if (c) {
        variant.color = c.name;
        variant.hue = c.hue;
        variantLabel = (variantLabel ? variantLabel + ' · ' : '') + c.name;
      }
    }
    addToCart(p, { qty: qty, variant: variant, variantLabel: variantLabel });
    openCartDrawer();
    return;
  }
  const cartInc = e.target.closest('[data-cart-inc]');
  if (cartInc) {
    const key = cartInc.getAttribute('data-cart-inc');
    const line = State.cart.find((l) => l.key === key);
    if (line) updateCartQty(key, line.qty + 1);
    return;
  }
  const cartDec = e.target.closest('[data-cart-dec]');
  if (cartDec) {
    const key = cartDec.getAttribute('data-cart-dec');
    const line = State.cart.find((l) => l.key === key);
    if (line) updateCartQty(key, line.qty - 1);
    return;
  }
  const cartRem = e.target.closest('[data-cart-remove]');
  if (cartRem) {
    removeFromCart(cartRem.getAttribute('data-cart-remove'));
    return;
  }
  const clearFilters = e.target.closest('[data-clear-filters]');
  if (clearFilters) {
    const { parts } = parseHash();
    const path = parts[0] === 'c' ? '/c/' + parts[1] : '/' + parts.join('/');
    location.hash = path;
    return;
  }
  const clearCat = e.target.closest('[data-clear-cat]');
  if (clearCat) { toggleFilterValue('cats', clearCat.getAttribute('data-clear-cat')); return; }
  const clearDiet = e.target.closest('[data-clear-diet]');
  if (clearDiet) { toggleFilterValue('diet', clearDiet.getAttribute('data-clear-diet')); return; }
  const clearBadge = e.target.closest('[data-clear-badge]');
  if (clearBadge) { toggleFilterValue('badges', clearBadge.getAttribute('data-clear-badge')); return; }
  const clearMin = e.target.closest('[data-clear-min]');
  if (clearMin) { setFilterSingle('min', null); return; }
  const clearMax = e.target.closest('[data-clear-max]');
  if (clearMax) { setFilterSingle('max', null); return; }
  const clearAvail = e.target.closest('[data-clear-avail]');
  if (clearAvail) { setFilterSingle('avail', 'all'); return; }
  const clearQ = e.target.closest('[data-clear-q]');
  if (clearQ) { setFilterSingle('q', null); return; }
  const closeFilter = e.target.closest('[data-close-filter]');
  if (closeFilter) {
    $('#filterDrawer').dataset.open = 'false';
    document.body.style.overflow = '';
    return;
  }
}

function onFilterChange(e) {
  const el = e.target;
  if (!el) return;
  if (el.matches('[data-filter-cat]')) {
    toggleFilterValue('cats', el.getAttribute('data-filter-cat'));
  } else if (el.matches('[data-filter-diet]')) {
    toggleFilterValue('diet', el.getAttribute('data-filter-diet'));
  } else if (el.matches('[data-filter-badge]')) {
    toggleFilterValue('badges', el.getAttribute('data-filter-badge'));
  } else if (el.matches('[data-filter-avail]')) {
    setFilterSingle('avail', el.getAttribute('data-filter-avail'));
  } else if (el.matches('[data-filter-min]')) {
    setFilterSingle('min', el.value === '' ? null : Number(el.value));
  } else if (el.matches('[data-filter-max]')) {
    setFilterSingle('max', el.value === '' ? null : Number(el.value));
  }
}

function currentPath() {
  const { parts } = parseHash();
  if (parts[0] === 'c' && parts[1]) return '/c/' + parts[1];
  if (parts[0] === 'search') return '/search';
  if (parts[0] === 'products') return '/products';
  return '/products';
}

function toggleFilterValue(field, value) {
  const { params } = parseHash();
  const path = currentPath();
  const next = new URLSearchParams(params.toString());
  const cur = parseList(next.get(field));
  const i = cur.indexOf(value);
  if (i === -1) cur.push(value); else cur.splice(i, 1);
  if (cur.length) next.set(field, cur.join(',')); else next.delete(field);
  next.delete('page');
  location.hash = path + (next.toString() ? '?' + next.toString() : '');
}

function setFilterSingle(field, value) {
  const { params } = parseHash();
  const path = currentPath();
  const next = new URLSearchParams(params.toString());
  if (value == null || value === '' || value === 'all') next.delete(field);
  else next.set(field, value);
  next.delete('page');
  location.hash = path + (next.toString() ? '?' + next.toString() : '');
}

/* =========================================================================
   14. PDP INTERACTIONS

function bindPDP(main) {
  if (!$('.pdp')) return;
  const media = $('#pdpMedia');
  const thumbWrap = $('#pdpThumbs');

  if (thumbWrap) {
    thumbWrap.addEventListener('click', (e) => {
      const b = e.target.closest('[data-thumb]');
      if (!b) return;
      const preset = b.getAttribute('data-thumb');
      const hue = b.getAttribute('data-thumb-hue');
      if (media) media.innerHTML = artSVG(preset, hue ? Number(hue) : null);
      thumbWrap.querySelectorAll('[data-thumb]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    });
  }

  const sizeGroup = $('[data-size-group]');
  if (sizeGroup) {
    sizeGroup.addEventListener('click', (e) => {
      const b = e.target.closest('[data-size]');
      if (!b) return;
      sizeGroup.querySelectorAll('[data-size]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      const label = $('[data-size-label]');
      if (label) label.textContent = b.getAttribute('data-size');
    });
  }

  const colorGroup = $('[data-color-group]');
  if (colorGroup) {
    colorGroup.addEventListener('click', (e) => {
      const b = e.target.closest('[data-color]');
      if (!b) return;
      colorGroup.querySelectorAll('[data-color]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      const idx = Number(b.getAttribute('data-color'));
      const label = $('[data-color-label]');
      const p = getProductBySlug(parseHash().parts[1]);
      if (label && p && p.colors[idx]) label.textContent = p.colors[idx].name;
    });
  }

  const dec = $('[data-qty-dec]');
  const inc = $('[data-qty-inc]');
  const input = $('[data-qty-input]');
  if (dec && input) dec.addEventListener('click', () => { input.value = Math.max(1, (Number(input.value) || 1) - 1); });
  if (inc && input) inc.addEventListener('click', () => { input.value = Math.min(99, (Number(input.value) || 1) + 1); });
}

/* =========================================================================
   15. CHECKOUT
   ========================================================================= */
function bindCheckout() {
  const form = $('#checkoutForm');
  if (!form) return;

  form.querySelectorAll('[data-delivery-option]').forEach((card) => {
    card.addEventListener('click', () => {
      form.querySelectorAll('[data-delivery-option]').forEach((c) => c.classList.remove('selected'));
      card.classList.add('selected');
      const input = card.querySelector('input');
      if (input) input.checked = true;
      const addr = $('#addressCard');
      if (addr) addr.style.display = (card.getAttribute('data-delivery-option') === 'delivery') ? '' : 'none';
    });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let ok = true;
    const email = $('#coEmail');
    const phone = $('#coPhone');
    const name = $('#coName');
    const address = $('#coAddress');
    const city = $('#coCity');
    const postal = $('#coPostal');
    const terms = $('#coTerms');
    const fulfil = form.querySelector('input[name="fulfil"]:checked');
    const isDelivery = fulfil && fulfil.value === 'delivery';

    function setErr(el, bad) {
      const field = el.closest('.field');
      if (!field) return;
      field.classList.toggle('error', bad);
      if (bad) ok = false;
    }

    setErr(email, !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()));
    setErr(phone, phone.value.trim().length < 5);
    if (isDelivery) {
      setErr(name, name.value.trim().length < 2);
      setErr(address, address.value.trim().length < 4);
      setErr(city, city.value.trim().length < 1);
      setErr(postal, postal.value.trim().length < 2);
    }
    const termsErr = $('#termsErr');
    if (!terms.checked) { if (termsErr) termsErr.style.display = 'block'; ok = false; }
    else if (termsErr) termsErr.style.display = 'none';

    if (!ok) {
      const firstErr = form.querySelector('.field.error input, .field.error select');
      if (firstErr) firstErr.focus();
      return;
    }
    State.lastOrderCount = cartCount();
    navigate('/order-confirmed');
  });
}

/* =========================================================================
   16. ACCOUNT
   ========================================================================= */
function bindAccount() {
  const form = $('#accountForm');
  if (form) {
    let mode = 'signin';
    $$('[data-acct-tab]').forEach((b) => {
      b.addEventListener('click', () => {
        mode = b.getAttribute('data-acct-tab');
        $$('[data-acct-tab]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
        const title = $('#accountTitle');
        const sub = $('#accountSub');
        const confirm = $('#acctConfirmField');
        const submit = $('#acctSubmit');
        if (mode === 'register') {
          title.textContent = 'Create your account';
          sub.textContent = 'Save addresses and reorder in one tap.';
          if (confirm) confirm.style.display = '';
          if (submit) submit.textContent = 'Create account';
        } else {
          title.textContent = 'Welcome back';
          sub.textContent = 'Sign in to track your orders and save addresses.';
          if (confirm) confirm.style.display = 'none';
          if (submit) submit.textContent = 'Sign in';
        }
      });
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = $('#acctEmail');
      const pass = $('#acctPassword');
      const confirm = $('#acctConfirm');
      let ok = true;
      const emailField = email.closest('.field');
      const passField = pass.closest('.field');
      emailField.classList.toggle('error', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()));
      if (emailField.classList.contains('error')) ok = false;
      passField.classList.toggle('error', pass.value.length < 6);
      if (passField.classList.contains('error')) ok = false;
      if (mode === 'register' && confirm) {
        const cf = confirm.closest('.field');
        cf.classList.toggle('error', confirm.value !== pass.value);
        if (cf.classList.contains('error')) ok = false;
      }
      if (!ok) return;
      State.account = { email: email.value.trim() };
      saveAccount();
      toast('Signed in (demo)', 'success');
      navigate('/account');
    });
  }
  const out = $('#signOutBtn');
  if (out) {
    out.addEventListener('click', () => {
      State.account = null;
      saveAccount();
      toast('Signed out');
      navigate('/account');
    });
  }
}

/* =========================================================================
   17. GLOBAL CHROME BINDING
   ========================================================================= */
function bindChrome() {
  // cart
  const btnCart = $('#btnCart');
  if (btnCart) btnCart.addEventListener('click', openCartDrawer);
  const closeCart = $('#btnCloseCart');
  if (closeCart) closeCart.addEventListener('click', closeCartDrawer);

  // mobile menu
  const btnMobile = $('#btnMobileMenu');
  if (btnMobile) btnMobile.addEventListener('click', openMobileMenu);
  const closeMobile = $('#btnCloseMobile');
  if (closeMobile) closeMobile.addEventListener('click', closeMobileMenu);

  // search
  const btnSearch = $('#btnSearch');
  if (btnSearch) btnSearch.addEventListener('click', openSearchOverlay);
  const closeSearch = $('#btnCloseSearch');
  if (closeSearch) closeSearch.addEventListener('click', closeSearchOverlay);
  const searchInput = $('#searchOverlayInput');
  if (searchInput) {
    searchInput.addEventListener('input', debounce(() => renderSearchOverlay(searchInput.value), 140));
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const q = searchInput.value.trim();
        if (q) { closeSearchOverlay(); navigate('/search?q=' + encodeURIComponent(q)); }
      }
    });
  }

  // header search
  const hs = $('#headerSearch');
  if (hs) {
    hs.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = $('#headerSearchInput').value.trim();
      if (q) navigate('/search?q=' + encodeURIComponent(q));
      else navigate('/products');
    });
  }

  // mega
  const btnMega = $('#btnMega');
  if (btnMega) {
    btnMega.addEventListener('click', (e) => { e.stopPropagation(); toggleMega(); });
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#megaMenu') && !e.target.closest('#btnMega')) toggleMega(false);
  });

  // scrim
  const scrim = $('#scrim');
  if (scrim) {
    scrim.addEventListener('click', () => {
      closeCartDrawer();
      closeMobileMenu();
    });
  }

  // esc
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeCartDrawer();
      closeMobileMenu();
      closeSearchOverlay();
      toggleMega(false);
      const fd = $('#filterDrawer');
      if (fd) { fd.dataset.open = 'false'; document.body.style.overflow = ''; }
    }
    if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && !/input|textarea|select/i.test((document.activeElement || {}).tagName || '')) {
      e.preventDefault();
      openSearchOverlay();
    }
  });

  // cart drawer / mobile / search delegated close
  document.addEventListener('click', (e) => {
    const closeBtn = e.target.closest('[data-close-cart]');
    if (closeBtn) closeCartDrawer();
    const closeSearch = e.target.closest('[data-close-search]');
    if (closeSearch) closeSearchOverlay();
  });

  // cart drawer delegated clicks
  const cartBody = $('#cartDrawerBody');
  const cartFoot = $('#cartDrawerFoot');
  if (cartBody) {
    cartBody.addEventListener('click', (e) => {
      const inc = e.target.closest('[data-cart-inc]');
      if (inc) { const line = State.cart.find((l) => l.key === inc.getAttribute('data-cart-inc')); if (line) updateCartQty(line.key, line.qty + 1); return; }
      const dec = e.target.closest('[data-cart-dec]');
      if (dec) { const line = State.cart.find((l) => l.key === dec.getAttribute('data-cart-dec')); if (line) updateCartQty(line.key, line.qty - 1); return; }
      const rem = e.target.closest('[data-cart-remove]');
      if (rem) { removeFromCart(rem.getAttribute('data-cart-remove')); }
    });
  }

  const ts = $('#tabSearch'); if (ts) ts.addEventListener('click', openSearchOverlay);
  const tc = $('#tabCart'); if (tc) tc.addEventListener('click', openCartDrawer);
  // hash routing
  window.addEventListener('hashchange', route);

  // wishlist count on load
  updateCartCount();
  updateWishCount();
}

/* =========================================================================
   18. INIT
   ========================================================================= */
function init() {
  normalise();
  loadState();

  const app = $('#app');
  app.innerHTML =
    renderHeader() +
    '<main id="main" tabindex="-1"></main>' +
    renderFooter() + renderTabbar();

  bindChrome();
  route();
  renderCartDrawer();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
