<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0EA5E9">
<meta name="description" content="Drizzle — Experience the Language of Taste. Order chef-crafted dishes for delivery, pickup or dine-in.">
<title>Drizzle — Experience the Language of Taste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   1. DESIGN TOKENS
   ========================================================================= */
:root{
  --sky-50:#F0F9FF;
  --sky-100:#E0F2FE;
  --sky-200:#BAE6FD;
  --sky-300:#7DD3FC;
  --sky-400:#38BDF8;
  --sky-500:#0EA5E9;
  --sky-600:#0284C7;
  --sky-700:#0369A1;
  --sky-800:#075985;
  --sky-900:#0C4A6E;
  --ink:#0F172A;
  --ink-2:#1E293B;
  --ink-3:#334155;
  --muted:#64748B;
  --muted-2:#94A3B8;
  --line:#E2E8F0;
  --line-2:#F1F5F9;
  --bg:#FFFFFF;
  --bg-2:#F8FAFC;
  --bg-3:#F0F9FF;
  --ok:#16A34A;
  --warn:#D97706;
  --danger:#DC2626;
  --accent:var(--sky-500);
  --accent-hover:var(--sky-600);
  --accent-soft:var(--sky-50);
  --accent-soft-2:var(--sky-100);
  --r-xs:4px;
  --r-sm:6px;
  --r:10px;
  --r-lg:14px;
  --r-xl:20px;
  --r-full:9999px;
  --sh-xs:0 1px 2px rgba(15,23,42,.06);
  --sh-sm:0 1px 3px rgba(15,23,42,.08);
  --sh:0 4px 12px -2px rgba(15,23,42,.08);
  --sh-lg:0 12px 32px -8px rgba(15,23,42,.14);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --max:1280px;
  --header-h:64px;
  --ease:cubic-bezier(.4,0,.2,1);
}

/* =========================================================================
   2. RESET & BASE
   ========================================================================= */
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font);
  font-size:15px;
  line-height:1.5;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
img,svg,video{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,h5{font-weight:650;line-height:1.18;letter-spacing:-.02em}
h1{font-size:clamp(1.75rem,3.4vw,2.5rem);font-weight:700}
h2{font-size:clamp(1.35rem,2.4vw,1.875rem);font-weight:700}
h3{font-size:1.125rem}
p{margin:0}
ul,ol{list-style:none;padding:0}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:1000;background:var(--accent);color:#fff;padding:10px 18px;border-radius:0 0 var(--r) var(--r);font-weight:600;transition:top .2s}
.skip:focus{top:0}

/* =========================================================================
   3. LAYOUT UTILITIES
   ========================================================================= */
.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:20px}


.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column}
.gap-4{gap:4px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}.mt-48{margin-top:48px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);max-width:62ch;line-height:1.6}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* =========================================================================
   4. BUTTONS
   ========================================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 20px;border-radius:var(--r);
  font-weight:600;font-size:.9rem;letter-spacing:.005em;
  border:1px solid transparent;background:var(--accent);color:#fff;
  transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .05s;
  white-space:nowrap;user-select:none;
}
.btn:hover{background:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn--ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn--ghost:hover{background:var(--bg-2);border-color:var(--muted-2);color:var(--ink)}
.btn--soft{background:var(--accent-soft);color:var(--accent-hover);border-color:transparent}
.btn--soft:hover{background:var(--accent-soft-2)}
.btn--danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn--danger:hover{background:#FEF2F2;border-color:#FECACA}
.btn--sm{height:36px;padding:0 14px;font-size:.82rem;border-radius:var(--r-sm)}
.btn--lg{height:52px;padding:0 28px;font-size:1rem}
.btn--block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{
  width:40px;height:40px;border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:background .15s,color .15s;position:relative;flex:0 0 auto;
}
.icon-btn:hover{background:var(--bg-2);color:var(--ink)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn__badge{
  position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:var(--r-full);
  background:var(--accent);color:#fff;font-size:.66rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;
  border:2px solid var(--bg);
}
.icon-btn__badge[hidden]{display:none}

/* =========================================================================
   5. HEADER
   ========================================================================= */
.site-header{
  position:sticky;top:0;z-index:80;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;gap:16px;height:var(--header-h)}
.brand{display:inline-flex;align-items:baseline;gap:0;font-weight:800;font-size:1.4rem;letter-spacing:-.03em;color:var(--ink);flex:0 0 auto}
.brand span{color:var(--accent)}
.brand:hover{color:var(--ink)}
.header-search{
  flex:1 1 auto;max-width:440px;position:relative;display:none;
}

.header-search input{
  width:100%;height:42px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--bg-2);padding:0 40px 0 14px;font-size:.88rem;transition:border-color .15s,background .15s;
}
.header-search input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.header-search .search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-2);pointer-events:none}
.header-search input{padding-left:38px;padding-right:12px}
.header-search .search-ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.header-nav{display:none;align-items:center;gap:2px;margin-left:auto}

.nav-link{
  display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:var(--r-sm);
  font-size:.85rem;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s;
}
.nav-link:hover{background:var(--bg-2);color:var(--ink)}
.nav-link[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent-hover)}
.nav-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.nav-link[aria-expanded="true"] svg{transform:rotate(180deg)}
.header-actions{display:flex;align-items:center;gap:2px;margin-left:auto}

.header-actions .icon-btn{width:40px;height:40px}
.header-actions .icon-btn{width:36px;height:36px}
.mobile-toggle{display:inline-flex}

.desktop-only{display:none}

.mobile-only{display:inline-flex}


/* Announcement bar */
.announce{
  background:var(--ink);color:#fff;font-size:.78rem;padding:8px 20px;text-align:center;
  letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
}
.announce a{color:var(--sky-300);text-decoration:underline;text-underline-offset:2px}
.announce a:hover{color:#fff}

/* Mega menu */
.mega{
  position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:var(--sh-lg);z-index:79;display:none;
}
.mega[data-open="true"]{display:block}
.mega-inner{max-width:var(--max);margin-inline:auto;padding:24px 40px 28px}
.mega-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.mega-col h4{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.mega-col a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:.88rem;color:var(--ink-2);border-radius:4px}
.mega-col a:hover{color:var(--accent-hover)}
.mega-col a .count{font-size:.72rem;color:var(--muted-2);font-variant-numeric:tabular-nums}
.mega-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);gap:16px;flex-wrap:wrap}
.mega-grid{grid-template-columns:repeat(2,1fr)}

/* Mobile drawer */
.mdrawer{
  position:fixed;inset:0;z-index:120;background:var(--bg);
  transform:translateX(-100%);transition:transform .25s var(--ease);
  display:flex;flex-direction:column;max-width:360px;
}
.mdrawer[data-open="true"]{transform:none}
.mdrawer-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.mdrawer-body{flex:1;overflow-y:auto;padding:8px 0}
.mdrawer-body a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px;font-size:.94rem;color:var(--ink-2);border-radius:0}
.mdrawer-body a:hover{background:var(--bg-2);color:var(--ink)}
.mdrawer-body a .count{font-size:.75rem;color:var(--muted-2)}
.mdrawer-sect{padding:12px 20px 6px;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mdrawer-ft{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}

/* =========================================================================
   6. SEARCH OVERLAY
   ========================================================================= */
.search-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.35);
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.search-overlay[data-open="true"]{opacity:1;pointer-events:auto}
.search-panel{
  max-width:720px;margin:80px auto 0;background:#fff;border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);overflow:hidden;max-height:calc(100dvh - 120px);display:flex;flex-direction:column;
  transform:translateY(-8px);transition:transform .18s;
}
.search-overlay[data-open="true"] .search-panel{transform:none}
.search-field{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.search-field svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.search-field input{flex:1;border:0;background:transparent;font-size:1rem;height:36px;outline:none;min-width:0}
.search-field .kbd{font-size:.7rem;color:var(--muted-2);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-family:inherit}
.search-body{overflow-y:auto;padding:16px 20px 20px}
.search-section{margin-bottom:20px}
.search-section h4{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.search-sugg{display:flex;flex-wrap:wrap;gap:8px}
.search-sugg a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-full);background:var(--bg-2);border:1px solid var(--line);font-size:.82rem;color:var(--ink-2)}
.search-sugg a:hover{background:var(--accent-soft);border-color:var(--sky-200);color:var(--accent-hover)}
.search-results{display:flex;flex-direction:column;gap:2px}
.search-result{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--r-sm)}
.search-result:hover{background:var(--bg-2)}
.search-result__thumb{width:44px;height:44px;border-radius:var(--r-sm);overflow:hidden;flex:0 0 auto;background:var(--bg-2)}
.search-result__thumb svg{width:100%;height:100%}
.search-result__meta{flex:1;min-width:0}
.search-result__name{font-size:.88rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result__cat{font-size:.74rem;color:var(--muted)}
.search-result__price{font-size:.85rem;font-weight:650;color:var(--ink);flex:0 0 auto}
.search-empty{padding:32px 12px;text-align:center;color:var(--muted);font-size:.88rem}

/* =========================================================================
   7. FORMS
   ========================================================================= */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-3)}
.field input,.field select,.field textarea{
  width:100%;height:44px;padding:0 12px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:#fff;font-size:.9rem;transition:border-color .15s,box-shadow .15s;
}
.field textarea{height:auto;min-height:100px;padding:10px 12px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:.74rem;color:var(--muted)}
.field.error input,.field.error select,.field.error textarea{border-color:var(--danger)}
.field .err{font-size:.74rem;color:var(--danger);display:none}
.field.error .err{display:block}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row{grid-template-columns:1fr}
.checkbox{display:flex;align-items:flex-start;gap:10px;font-size:.86rem;color:var(--ink-2);cursor:pointer;line-height:1.4}
.checkbox input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
.radio-card{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;transition:border-color .15s,background .15s}
.radio-card:hover{border-color:var(--muted-2)}
.radio-card input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.radio-card.selected{border-color:var(--accent);background:var(--accent-soft)}
.radio-card__title{font-weight:600;font-size:.9rem;color:var(--ink)}
.radio-card__meta{font-size:.78rem;color:var(--muted)}

/* =========================================================================
   8. CHIPS / BADGES / TAGS
   ========================================================================= */
.chip{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-full);
  border:1px solid var(--line);background:#fff;font-size:.82rem;font-weight:500;color:var(--ink-2);
  cursor:pointer;transition:border-color .15s,background .15s,color .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--muted-2);color:var(--ink)}
.chip[aria-pressed="true"],.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip--accent[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chip__x{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--r-xs);
  font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--sky-100);color:var(--sky-800);
}
.badge--sale{background:#FEF2F2;color:#B91C1C}
.badge--new{background:#F0FDF4;color:#166534}
.badge--soft{background:var(--bg-2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-full);font-size:.72rem;font-weight:500;background:var(--bg-2);color:var(--muted);border:1px solid var(--line)}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* =========================================================================
   9. PRODUCT CARD
   ========================================================================= */
.pcard{
  display:flex;flex-direction:column;background:#fff;border-radius:var(--r-lg);
  overflow:hidden;transition:box-shadow .18s,transform .18s;position:relative;
}
.pcard:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.pcard__media{
  position:relative;aspect-ratio:1/1;background:var(--bg-2);overflow:hidden;
}
.pcard__media svg{width:100%;height:100%;display:block}
.pcard__media img{width:100%;height:100%;object-fit:cover}
.pcard__badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px;z-index:2}
.pcard__wish{
  position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:var(--r-full);
  background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:color .15s,background .15s;box-shadow:var(--sh-xs);
}
.pcard__wish:hover{color:var(--danger);background:#fff}
.pcard__wish.active{color:var(--danger)}
.pcard__wish svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pcard__wish.active svg{fill:currentColor}
.pcard__add{
  position:absolute;bottom:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:var(--r-full);
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s,background .15s;box-shadow:var(--sh-sm);
}
.pcard:hover .pcard__add{opacity:1;transform:none}
.pcard__add:hover{background:var(--accent-hover)}
.pcard__add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pcard__body{padding:12px 4px 8px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard__cat{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.pcard__name{
  font-size:.92rem;font-weight:600;color:var(--ink);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pcard__price{display:flex;align-items:baseline;gap:8px;margin-top:auto;padding-top:4px}
.pcard__price .now{font-size:.95rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pcard__price .was{font-size:.82rem;color:var(--muted-2);text-decoration:line-through;font-variant-numeric:tabular-nums}
.pcard__price .sale{color:var(--danger)}

/* =========================================================================
   10. PRODUCT GRID
   ========================================================================= */
.pgrid{display:grid;gap:20px 16px;grid-template-columns:repeat(2,1fr)}


.pgrid--3{grid-template-columns:repeat(2,1fr)}

.pgrid--5{grid-template-columns:repeat(2,1fr)}



/* =========================================================================
   11. SECTION
   ========================================================================= */
.section{padding:40px 0}

.section--tight{padding:24px 0}
.section--soft{background:var(--bg-2)}
.section--sky{background:var(--bg-3)}
.section-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.section-hd h2{margin-bottom:4px}
.section-hd p{color:var(--muted);font-size:.9rem}
.section-hd .link{font-size:.85rem;font-weight:600;color:var(--accent-hover);display:inline-flex;align-items:center;gap:4px}
.section-hd .link:hover{text-decoration:underline;text-underline-offset:3px}

/* =========================================================================
   12. HOMEPAGE
   ========================================================================= */
.hero{
  background:linear-gradient(180deg,var(--bg-3) 0%,#fff 100%);
  padding:40px 0 48px;border-bottom:1px solid var(--line);
}

.hero-grid{display:grid;gap:32px;align-items:center}

.hero h1{font-size:clamp(2rem,4.4vw,3.25rem);line-height:1.08;letter-spacing:-.03em;margin-bottom:16px;font-weight:800}
.hero h1 .accent{color:var(--accent-hover)}
.hero .lead{font-size:1.02rem;margin-bottom:24px}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-media{position:relative;aspect-ratio:4/3;border-radius:var(--r-xl);overflow:hidden;background:var(--bg-2);box-shadow:var(--sh-lg)}
.hero-media svg{width:100%;height:100%;display:block}
.hero-stats{display:flex;gap:28px;margin-top:32px;flex-wrap:wrap}
.hero-stat__n{font-size:1.5rem;font-weight:800;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-stat__l{font-size:.78rem;color:var(--muted)}
.service-strip{
  background:var(--ink);color:#fff;padding:12px 0;
}
.service-strip__inner{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center}
.service-strip__item{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:500}
.service-strip__item svg{width:16px;height:16px;stroke:var(--sky-400);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.service-strip__item strong{color:var(--sky-300);font-weight:700}
.cat-grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}


.cat-card{
  display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r-lg);
  background:#fff;border:1px solid var(--line);transition:border-color .15s,box-shadow .15s,transform .15s;
  position:relative;overflow:hidden;min-height:120px;
}
.cat-card:hover{border-color:var(--sky-200);box-shadow:var(--sh);transform:translateY(-2px)}
.cat-card__icon{width:44px;height:44px;border-radius:var(--r);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-hover)}
.cat-card__icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat-card__name{font-size:1rem;font-weight:650;color:var(--ink)}
.cat-card__count{font-size:.78rem;color:var(--muted)}
.cat-card__arrow{position:absolute;top:16px;right:16px;color:var(--muted-2);transition:transform .15s,color .15s}
.cat-card:hover .cat-card__arrow{transform:translateX(3px);color:var(--accent-hover)}
.cat-card__arrow svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.reviews-grid{display:grid;gap:16px;grid-template-columns:1fr}

.review-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:12px}
.review-stars{display:flex;gap:2px;color:#F59E0B}
.review-stars svg{width:16px;height:16px;fill:currentColor;stroke:none}
.review-quote{font-size:.92rem;line-height:1.55;color:var(--ink-3)}
.review-person{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line-2)}
.review-avatar{width:36px;height:36px;border-radius:var(--r-full);background:var(--accent-soft);color:var(--accent-hover);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex:0 0 auto}
.review-name{font-size:.85rem;font-weight:600;color:var(--ink)}
.review-loc{font-size:.74rem;color:var(--muted)}
.newsletter{background:var(--accent-soft);border-radius:var(--r-xl);padding:36px 28px;text-align:center;max-width:720px;margin:0 auto}

.newsletter h2{margin-bottom:8px}
.newsletter p{color:var(--muted);margin-bottom:20px}
.newsletter form{display:flex;gap:8px;max-width:440px;margin:0 auto;flex-wrap:wrap}
.newsletter input{flex:1 1 200px;height:46px;padding:0 16px;border-radius:var(--r);border:1px solid var(--sky-200);background:#fff;font-size:.9rem}
.newsletter input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.newsletter button{height:46px;padding:0 22px;border-radius:var(--r);background:var(--accent);color:#fff;font-weight:600;font-size:.9rem;transition:background .15s}
.newsletter button:hover{background:var(--accent-hover)}
.newsletter .msg{font-size:.82rem;color:var(--muted);margin-top:10px;min-height:18px}

/* =========================================================================
   13. LISTING / CATEGORY PAGE
   ========================================================================= */
.page-head{padding:28px 0 20px;border-bottom:1px solid var(--line);background:#fff}

.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:12px}
.breadcrumb a{color:var(--muted);transition:color .15s}
.breadcrumb a:hover{color:var(--accent-hover)}
.breadcrumb .sep{color:var(--muted-2)}
.breadcrumb [aria-current="page"]{color:var(--ink-2);font-weight:500}
.page-head h1{margin-bottom:6px}
.page-head p{color:var(--muted);max-width:62ch}
.listing-layout{display:grid;gap:28px;padding:24px 0 56px}

.filters{display:none}

.filters__hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.filters__hd h3{font-size:.82rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filters__clear{font-size:.78rem;color:var(--accent-hover);font-weight:600}
.filters__clear:hover{text-decoration:underline;text-underline-offset:3px}
.filter-group{border-bottom:1px solid var(--line);padding:14px 0}
.filter-group:last-child{border-bottom:0}
.filter-group > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:.85rem;font-weight:600;color:var(--ink);padding:4px 0;user-select:none}
.filter-group > summary::-webkit-details-marker{display:none}
.filter-group > summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-top:-4px}
.filter-group[open] > summary::after{transform:rotate(-135deg);margin-top:4px}
.filter-group__body{padding-top:12px;display:flex;flex-direction:column;gap:8px}
.filter-check{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-2);cursor:pointer}
.filter-check input{width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto}
.filter-check .count{margin-left:auto;font-size:.74rem;color:var(--muted-2);font-variant-numeric:tabular-nums}
.price-range{display:flex;align-items:center;gap:8px}
.price-range input{width:100%;height:38px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--line);font-size:.85rem;font-variant-numeric:tabular-nums}
.price-range span{color:var(--muted-2);font-size:.85rem}
.listing-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.listing-bar__count{font-size:.85rem;color:var(--muted)}
.listing-bar__count strong{color:var(--ink);font-weight:650}
.listing-bar__actions{display:flex;align-items:center;gap:8px}
.sort-select{position:relative}
.sort-select select{
  height:38px;padding:0 32px 0 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;
  font-size:.84rem;font-weight:500;appearance:none;cursor:pointer;transition:border-color .15s;
}
.sort-select select:hover{border-color:var(--muted-2)}
.sort-select select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sort-select::after{content:"";position:absolute;right:12px;top:50%;width:8px;height:8px;border-right:1.8px solid var(--muted);border-bottom:1.8px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.mobile-filter-btn{display:inline-flex}

.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.active-filters .chip{height:30px;font-size:.76rem;padding:0 10px;background:var(--accent-soft);border-color:var(--sky-200);color:var(--accent-hover)}
.empty-state{padding:56px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-lg)}
.empty-state h3{margin-bottom:8px}
.empty-state p{color:var(--muted);margin-bottom:20px}

/* Mobile filter drawer */
.filter-drawer{position:fixed;inset:0;z-index:130;pointer-events:none}
.filter-drawer[data-open="true"]{pointer-events:auto}
.filter-drawer__scrim{position:absolute;inset:0;background:rgba(15,23,42,.4);opacity:0;transition:opacity .2s}
.filter-drawer[data-open="true"] .filter-drawer__scrim{opacity:1}
.filter-drawer__panel{
  position:absolute;right:0;top:0;bottom:0;width:min(360px,100vw);background:#fff;
  transform:translateX(100%);transition:transform .25s var(--ease);display:flex;flex-direction:column;
}
.filter-drawer[data-open="true"] .filter-drawer__panel{transform:none}
.filter-drawer__hd{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.filter-drawer__body{flex:1;overflow-y:auto;padding:0 20px 20px}
.filter-drawer__ft{padding:16px;border-top:1px solid var(--line);display:flex;gap:10px}
.filter-drawer__ft .btn{flex:1}

/* Pagination */
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:32px 0 0;flex-wrap:wrap}
.pagination a,.pagination span{
  min-width:38px;height:38px;padding:0 12px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;
  font-size:.85rem;font-weight:500;color:var(--ink-2);border:1px solid var(--line);background:#fff;
}
.pagination a:hover{border-color:var(--muted-2);color:var(--ink)}
.pagination [aria-current="page"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.pagination .disabled{opacity:.4;pointer-events:none}

/* =========================================================================
   14. PRODUCT DETAIL
   ========================================================================= */
.pdp{padding:24px 0 64px}
.pdp-grid{display:grid;gap:32px}

.pdp-media{
  position:relative;aspect-ratio:1/1;border-radius:var(--r-lg);overflow:hidden;background:var(--bg-2);
  border:1px solid var(--line);
}
.pdp-media svg,.pdp-media img{width:100%;height:100%;display:block}
.pdp-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.pdp-thumb{aspect-ratio:1/1;border-radius:var(--r-sm);overflow:hidden;background:var(--bg-2);border:1px solid var(--line);cursor:pointer;transition:border-color .15s;padding:0}
.pdp-thumb[aria-pressed="true"]{border-color:var(--accent);border-width:2px}
.pdp-thumb svg{width:100%;height:100%}
.pdp-info h1{font-size:clamp(1.5rem,2.4vw,2rem);margin-bottom:8px}
.pdp-cat{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pdp-price{display:flex;align-items:baseline;gap:12px;margin:12px 0 16px}
.pdp-price .now{font-size:1.6rem;font-weight:750;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pdp-price .was{font-size:1rem;color:var(--muted-2);text-decoration:line-through}
.pdp-price .save{font-size:.78rem;font-weight:700;color:var(--danger);background:#FEF2F2;padding:3px 8px;border-radius:var(--r-xs)}
.pdp-desc{font-size:.95rem;line-height:1.65;color:var(--ink-3);margin-bottom:20px}
.pdp-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.pdp-opt{margin-bottom:20px}
.pdp-opt__label{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:600;color:var(--ink-3);margin-bottom:10px}
.pdp-opt__label .selected{color:var(--muted);font-weight:500}
.size-options{display:flex;flex-wrap:wrap;gap:8px}
.size-btn{
  height:40px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;
  font-size:.85rem;font-weight:500;color:var(--ink-2);transition:border-color .15s,background .15s,color .15s;
}
.size-btn:hover{border-color:var(--muted-2)}
.size-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.color-options{display:flex;flex-wrap:wrap;gap:8px}
.color-btn{
  width:38px;height:38px;border-radius:var(--r-full);border:2px solid var(--line);padding:2px;background:transparent;
  transition:border-color .15s;position:relative;
}
.color-btn span{display:block;width:100%;height:100%;border-radius:var(--r-full);background:var(--swatch)}
.color-btn[aria-pressed="true"]{border-color:var(--accent)}
.color-btn[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:var(--r-full);border:2px solid var(--accent);opacity:.35}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:#fff}
.qty button{width:40px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:1.1rem;transition:background .15s}
.qty button:hover{background:var(--bg-2)}
.qty input{width:48px;height:42px;border:0;text-align:center;font-weight:600;font-size:.92rem;background:transparent;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pdp-actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
.pdp-actions .btn{flex:1 1 200px}
.pdp-wish{width:52px;flex:0 0 auto;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:var(--r);color:var(--ink-2);transition:color .15s,border-color .15s}
.pdp-wish:hover{color:var(--danger);border-color:var(--danger)}
.pdp-wish.active{color:var(--danger);border-color:var(--danger);background:#FEF2F2}
.pdp-wish svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pdp-wish.active svg{fill:currentColor}
.pdp-details{border-top:1px solid var(--line);margin-top:8px}
.pdp-details details{border-bottom:1px solid var(--line)}
.pdp-details summary{list-style:none;cursor:pointer;padding:16px 0;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:.9rem;color:var(--ink)}
.pdp-details summary::-webkit-details-marker{display:none}
.pdp-details summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:400;line-height:1}
.pdp-details details[open] summary::after{content:"−"}
.pdp-details__body{padding:0 0 16px;font-size:.88rem;color:var(--ink-3);line-height:1.6}
.pdp-details__body dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.pdp-details__body dt{color:var(--muted);font-size:.82rem}
.pdp-details__body dd{margin:0;font-size:.85rem;color:var(--ink-2)}
.pdp-stock{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:500;color:var(--ok)}
.pdp-stock::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pdp-stock--out{color:var(--danger)}
.pdp-related{margin-top:64px;padding-top:40px;border-top:1px solid var(--line)}

/* =========================================================================
   15. CART
   ========================================================================= */
.cart-drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:210;background:#fff;
  transform:translateX(100%);transition:transform .28s var(--ease);display:flex;flex-direction:column;
  box-shadow:-24px 0 48px -24px rgba(15,23,42,.2);
}
.cart-drawer[data-open="true"]{transform:none}
.cart-drawer__hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.cart-drawer__hd h2{font-size:1rem;display:flex;align-items:center;gap:8px}
.cart-drawer__count{font-size:.75rem;font-weight:600;color:var(--muted);background:var(--bg-2);padding:2px 8px;border-radius:var(--r-full)}
.cart-drawer__body{flex:1;overflow-y:auto;padding:8px 20px}
.cart-drawer__ft{border-top:1px solid var(--line);padding:16px 20px;background:#fff}
.cart-empty{padding:60px 20px;text-align:center}
.cart-empty svg{width:56px;height:56px;stroke:var(--muted-2);fill:none;stroke-width:1.4;margin:0 auto 16px;stroke-linecap:round;stroke-linejoin:round}
.cart-empty h3{font-size:1rem;margin-bottom:6px}
.cart-empty p{font-size:.85rem;color:var(--muted);margin-bottom:20px}
.cart-line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.cart-line:last-child{border-bottom:0}
.cart-line__media{width:72px;height:72px;border-radius:var(--r-sm);overflow:hidden;background:var(--bg-2);flex:0 0 auto;position:relative}
.cart-line__media svg{width:100%;height:100%}
.cart-line__meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cart-line__name{font-size:.88rem;font-weight:600;color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cart-line__variant{font-size:.74rem;color:var(--muted)}
.cart-line__bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.cart-line__qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);height:30px;background:#fff}
.cart-line__qty button{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:.95rem}
.cart-line__qty button:hover{background:var(--bg-2)}
.cart-line__qty span{min-width:26px;text-align:center;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.cart-line__price{font-size:.88rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cart-line__remove{font-size:.72rem;color:var(--muted);text-decoration:underline;text-underline-offset:2px;margin-top:4px;align-self:flex-start}
.cart-line__remove:hover{color:var(--danger)}
.cart-summary{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;font-size:.88rem}
.cart-summary__row{display:flex;align-items:center;justify-content:space-between}
.cart-summary__row.total{font-size:1rem;font-weight:700;color:var(--ink);padding-top:8px;border-top:1px solid var(--line)}
.cart-summary__row .label{color:var(--muted)}
.cart-note{font-size:.74rem;color:var(--muted);text-align:center;margin-top:10px}
.cart-free-ship{font-size:.78rem;color:var(--ink-2);background:var(--accent-soft);padding:10px 12px;border-radius:var(--r-sm);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cart-free-ship svg{width:16px;height:16px;stroke:var(--accent-hover);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* Full cart page */
.cart-page{padding:32px 0 64px}
.cart-page-grid{display:grid;gap:32px}

.cart-list{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 20px}
.cart-list .cart-line{padding:18px 0}
.cart-aside{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;position:sticky;top:calc(var(--header-h) + 16px)}
.cart-aside h3{margin-bottom:16px}
.cart-aside .btn{width:100%;margin-top:12px}

/* =========================================================================
   16. CHECKOUT
   ========================================================================= */
.checkout{padding:32px 0 64px}
.checkout-grid{display:grid;gap:32px}

.checkout-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}

.checkout-card h2{font-size:1.1rem;margin-bottom:20px}
.checkout-card + .checkout-card{margin-top:20px}
.checkout-summary{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;position:sticky;top:calc(var(--header-h) + 16px)}
.checkout-summary h3{margin-bottom:16px}
.checkout-summary .cart-line{padding:12px 0}
.order-confirm{padding:64px 24px;text-align:center;max-width:560px;margin:0 auto}
.order-confirm__icon{width:72px;height:72px;border-radius:50%;background:#F0FDF4;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.order-confirm__icon svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.order-confirm h1{font-size:1.5rem;margin-bottom:8px}
.order-confirm p{color:var(--muted);margin-bottom:24px}
.order-ref{display:inline-block;font-family:monospace;font-size:.9rem;background:var(--bg-2);padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line);margin-bottom:24px}

/* =========================================================================
   17. ACCOUNT
   ========================================================================= */
.account{padding:32px 0 64px;max-width:480px;margin:0 auto}
.account-tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px}
.account-tab{
  padding:12px 20px;font-size:.9rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:color .15s,border-color .15s;
}
.account-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.account-form{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}

.account-form h2{font-size:1.15rem;margin-bottom:6px}
.account-form > p{color:var(--muted);font-size:.85rem;margin-bottom:20px}
.account-form .btn{width:100%;margin-top:8px}
.account-note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:16px}
.account-note a{color:var(--accent-hover);font-weight:500}

/* =========================================================================
   18. FOOTER
   ========================================================================= */
.site-footer{background:var(--ink);color:#CBD5E1;margin-top:auto}
.footer-top{padding:56px 0 40px}
.footer-grid{display:grid;gap:32px;grid-template-columns:1fr}


.footer-brand .brand{color:#fff;font-size:1.5rem;margin-bottom:12px}
.footer-brand p{font-size:.88rem;color:#94A3B8;max-width:36ch;line-height:1.6;margin-bottom:16px}
.footer-contact{font-size:.85rem;line-height:1.9}
.footer-contact a{color:#E2E8F0;transition:color .15s}
.footer-contact a:hover{color:var(--sky-400)}
.footer-col h4{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#94A3B8;margin-bottom:14px}
.footer-col ul{display:flex;flex-direction:column;gap:10px}
.footer-col a{font-size:.86rem;color:#CBD5E1;transition:color .15s}
.footer-col a:hover{color:#fff}
.footer-bottom{border-top:1px solid #1E293B;padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.8rem;color:#64748B}
.footer-social{display:flex;gap:8px}
.footer-social a{width:36px;height:36px;border-radius:var(--r-full);border:1px solid #334155;display:flex;align-items:center;justify-content:center;color:#CBD5E1;transition:background .15s,border-color .15s,color .15s}
.footer-social a:hover{background:#1E293B;border-color:#475569;color:#fff}
.footer-social svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.footer-payments{display:flex;gap:6px;align-items:center}
.footer-payments span{font-size:.7rem;padding:3px 6px;border:1px solid #334155;border-radius:3px;color:#94A3B8}

/* =========================================================================
   19. TOAST
   ========================================================================= */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%;max-width:400px;padding:0 16px}
.toast{
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);
  font-size:.85rem;font-weight:500;box-shadow:var(--sh-lg);
  animation:toastIn .25s var(--ease),toastOut .25s var(--ease) 2.6s forwards;
  display:flex;align-items:center;gap:8px;max-width:100%;
}
.toast svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.toast--success{background:var(--ok)}
.toast--error{background:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px)}}

/* =========================================================================
   20. SKELETON / LOADING
   ========================================================================= */
.skeleton{background:linear-gradient(90deg,var(--bg-2) 0%,#fff 50%,var(--bg-2) 100%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r-sm)}
@keyframes shimmer{to{background-position:-200% 0}}

/* =========================================================================
   21. RESPONSIVE TWEAKS
   ========================================================================= */

  .header-inner{gap:8px}
  .brand{font-size:1.25rem}
  .hero{padding:28px 0 36px}
  .hero-stats{gap:20px;margin-top:24px}
  .hero-stat__n{font-size:1.25rem}
  .section{padding:32px 0}
  .section-hd{margin-bottom:16px}
  .pgrid{gap:16px 12px}
  .pdp-actions .btn{flex:1 1 100%}
  .pdp-wish{width:100%;height:44px}
  .cart-aside,.checkout-summary{position:static}
  .footer-top{padding:40px 0 28px}
  .newsletter{padding:28px 20px}
  .mega-inner{padding:16px 20px 20px}
  .service-strip__inner{gap:12px 20px}


  .wrap{padding-inline:16px}
  .cat-grid{gap:10px}
  .cat-card{padding:14px;min-height:100px}
  .pcard__body{padding:10px 2px 6px}


/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

/* Print */
@media print{
  .site-header,.site-footer,.toast-wrap,.cart-drawer,.mdrawer,.scrim,.search-overlay,.filter-drawer{display:none !important}
}

/* ===== MOBILE-ONLY LAYER ===== */
:root{--tab-h:60px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html{background:#E2E8F0;-webkit-tap-highlight-color:transparent}
body{max-width:480px;margin:0 auto;background:var(--bg);min-height:100dvh;padding-bottom:calc(var(--tab-h) + var(--safe-b));font-size:16px;box-shadow:0 0 0 1px var(--line);overscroll-behavior-y:none}
input,select,textarea{font-size:16px !important}
.btn,.size-btn,.chip,.icon-btn{min-height:44px;touch-action:manipulation}
.btn--sm{min-height:40px}
.site-header{padding-top:var(--safe-t)}
.header-inner{height:56px}
.pcard:hover{transform:none;box-shadow:none}
.pcard__add{opacity:1;transform:none;width:40px;height:40px}
.pcard__wish{width:40px;height:40px}
.hero{padding:24px 0 32px}
.hero-media{aspect-ratio:16/10}
.service-strip__inner{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.service-strip__item{flex:0 0 auto}
.cat-grid{grid-template-columns:repeat(2,1fr)}
.cart-drawer,.mdrawer{width:100%;max-width:480px}
.cart-drawer{left:50%;right:auto;transform:translateX(100vw);margin-left:-240px}
@media(max-width:480px){.cart-drawer{left:0;margin-left:0}}
.cart-drawer[data-open="true"]{transform:none}
.cart-drawer__ft{padding-bottom:calc(16px + var(--safe-b))}
.pdp-actions{position:sticky;bottom:calc(var(--tab-h) + var(--safe-b));background:#fff;padding:12px 0;margin:16px 0;z-index:5;border-top:1px solid var(--line)}
.toast-wrap{bottom:calc(var(--tab-h) + var(--safe-b) + 12px)}
.search-panel{margin:0;border-radius:0 0 var(--r-lg) var(--r-lg);max-height:100dvh}
.checkout-summary,.cart-aside{position:static}
.account{padding-inline:16px}
.footer-contact a{display:inline-block;padding:4px 0}
.footer-bottom{flex-direction:column;align-items:flex-start}
/* bottom tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:90}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.66rem;font-weight:600;color:var(--muted);position:relative;min-height:var(--tab-h)}
.tabbar a.on,.tabbar button.on{color:var(--accent-hover)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .icon-btn__badge{top:6px;right:calc(50% - 20px)}
</style>

<script>
(function () {
'use strict';

/* =========================================================================
   0. UTILITIES
   ========================================================================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '$' + Number(n || 0).toFixed(2);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const debounce = (fn, ms) => { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; };
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 9);
const slugify = (s) => String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const toNumber = (v, d) => { const n = Number(v); return isFinite(n) ? n : d; };
const parseList = (s) => String(s == null ? '' : s).split(',').map((x) => x.trim()).filter(Boolean);

/* =========================================================================
   1. DATA LOAD & NORMALISATION
   ========================================================================= */
const EMBEDDED_RAW = JSON.parse(document.getElementById('data').textContent);
const RAW = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem('drizzle.restaurant.v1') || 'null');
    if (saved?.published && Array.isArray(saved.published.sections) && saved.published.sections.length) {
      return saved.published;
    }
  } catch {}
  return EMBEDDED_RAW;
})();

const Store = {
  settings: RAW.settings || {},
  categories: [],
  products: [],
  pages: [],
  sections: [],
  footerGroups: [],
  socialLinks: [],
  reviews: [],
  serviceOptions: {},
};

function normalise() {
  Store.serviceOptions = (Store.settings.serviceOptions) || {};

  // categories
  Store.categories = (RAW.categories || [])
    .filter((c) => c && c.id)
    .map((c) => ({
      id: c.id,
      slug: c.slug || slugify(c.name),
      name: c.name || 'Untitled',
      description: c.description || '',
      parentId: c.parentId || null,
      hue: toNumber(c.hue, 200),
      media: c.media || '',
      published: c.published === 1 || c.published === true,
      position: toNumber(c.position, 0),
    }))
    .sort((a, b) => a.position - b.position);

  // products
  Store.products = (RAW.products || [])
    .filter((p) => p && p.id)
    .map((p) => {
      const sale = p.salePrice != null && Number(p.salePrice) > 0 && Number(p.salePrice) < Number(p.price) ? Number(p.salePrice) : null;
      return {
        id: p.id,
        slug: p.slug || slugify(p.name),
        name: p.name || 'Untitled',
        description: p.description || '',
        price: toNumber(p.price, 0),
        salePrice: sale,
        stock: toNumber(p.stock, 0),
        badge: p.badge || '',
        featured: p.featured === 1 || p.featured === true,
        published: p.published !== 0 && p.published !== false,
        position: toNumber(p.position, 0),
        categoryIds: Array.isArray(p.categoryIds) ? p.categoryIds.slice() : [],
        hue: toNumber(p.hue, 200),
        preset: (p.illustrationPreset || (p.art && p.art.preset) || 'default').toLowerCase(),
        media: p.media || '',
        dietary: Array.isArray(p.dietary) ? p.dietary.slice() : [],
        portion: p.portion || '',
        colors: Array.isArray(p.colors) ? p.colors.map((c) => ({ name: c.name || '', hex: c.hex || '#ccc', hue: toNumber(c.hue, 200) })) : [],
        sizes: Array.isArray(p.sizes) ? p.sizes.slice() : [],
      };
    })
    .sort((a, b) => a.position - b.position);

  // pages & sections
  Store.pages = (RAW.pages || []).filter((p) => p && p.id);
  Store.sections = (RAW.sections || []).filter((s) => s && s.id);

  // reviews from section
  const reviewsSection = Store.sections.find((s) => s.type === 'restaurant-reviews');
  Store.reviews = reviewsSection && reviewsSection.props && Array.isArray(reviewsSection.props.items)
    ? reviewsSection.props.items.slice() : [];

  // footer & social
  Store.footerGroups = (RAW.footerGroups || []).filter((g) => g && g.id);
  Store.socialLinks = (RAW.socialLinks || []).filter((s) => s && s.id && s.visible !== 0);

  // indexes
  Store._pidx = new Map(Store.products.map((p) => [p.id, p]));
  Store._pslug = new Map(Store.products.map((p) => [p.slug, p]));
  Store._cidx = new Map(Store.categories.map((c) => [c.id, c]));
  Store._cslug = new Map(Store.categories.map((c) => [c.slug, c]));
  Store._prodByCat = new Map();
  Store.products.forEach((p) => {
    p.categoryIds.forEach((cid) => {
      if (!Store._prodByCat.has(cid)) Store._prodByCat.set(cid, new Set());
      Store._prodByCat.get(cid).add(p.id);
    });
  });
  Store._childrenOf = new Map();
  Store.categories.forEach((c) => {
    if (c.parentId) {
      if (!Store._childrenOf.has(c.parentId)) Store._childrenOf.set(c.parentId, []);
      Store._childrenOf.get(c.parentId).push(c.id);
    }
  });
}

/* ---------- Data accessors ---------- */
function getProductById(id) { return Store._pidx.get(id) || null; }
function getProductBySlug(slug) { return Store._pslug.get(slug) || null; }
function getCategoryById(id) { return Store._cidx.get(id) || null; }
function getCategoryBySlug(slug) { return Store._cslug.get(slug) || null; }
function publishedProducts() { return Store.products.filter((p) => p.published); }
function publishedCategories() { return Store.categories.filter((c) => c.published); }
function categoryProductIds(catId) { return Store._prodByCat.get(catId) || new Set(); }
function productCountForCategory(catId) {
  // include descendants (not needed in current data, but future-proof)
  const ids = new Set();
  const stack = [catId];
  while (stack.length) {
    const id = stack.pop();
    categoryProductIds(id).forEach((pid) => ids.add(pid));
    (Store._childrenOf.get(id) || []).forEach((c) => stack.push(c));
  }
  return ids.size;
}
function productsForCategory(catId, includeDescendants) {
  const ids = new Set();
  const stack = [catId];
  while (stack.length) {
    const id = stack.pop();
    categoryProductIds(id).forEach((pid) => ids.add(pid));
    if (includeDescendants !== false) (Store._childrenOf.get(id) || []).forEach((c) => stack.push(c));
  }
  return Array.from(ids).map((id) => getProductById(id)).filter((p) => p && p.published);
}
function categoriesForProduct(p) {
  return (p.categoryIds || []).map((id) => getCategoryById(id)).filter(Boolean);
}
function primaryCategory(p) { return categoriesForProduct(p)[0] || null; }
function relatedProducts(p, limit) {
  const cats = new Set(p.categoryIds || []);
  return publishedProducts()
    .filter((x) => x.id !== p.id && (x.categoryIds || []).some((id) => cats.has(id)))
    .slice(0, limit || 4);
}
function featuredProducts() { return publishedProducts().filter((p) => p.featured); }
function allDietaryTags() {
  const set = new Set();
  publishedProducts().forEach((p) => (p.dietary || []).forEach((d) => set.add(d)));
  return Array.from(set).sort();
}
function allBadges() {
  const set = new Set();
  publishedProducts().forEach((p) => { if (p.badge) set.add(p.badge); });
  return Array.from(set).sort();
}
function priceBounds() {
  const prices = publishedProducts().map((p) => p.price);
  if (!prices.length) return { min: 0, max: 100 };
  return { min: Math.floor(Math.min.apply(null, prices)), max: Math.ceil(Math.max.apply(null, prices)) };
}

/* =========================================================================
   2. SVG ART GENERATOR
   ========================================================================= */
const ART_BG = '#F1F5F9';

function artSVG(preset, hue) {

  const map = {

        '<ellipse cx="160" cy="146" rx="4" ry="7" fill="#FFF8E8"/>' +
        '<ellipse cx="210" cy="136" rx="4" ry="7" fill="#FFF8E8"/>' +
        '<ellipse cx="262" cy="152" rx="4" ry="7" fill="#FFF8E8"/>' +
        '</svg>';
    },
    pasta: function () {
      return '<svg viewBox="0 0 400 400" role="img" aria-label="Pasta">' +
        '<rect width="400" height="400" fill="' + bg + '"/>' +
        '<circle cx="200" cy="200" r="152" fill="#1F2937"/>' +

/* =========================================================================
   3. STATE (cart, wishlist, recently viewed)
   ========================================================================= */
const LS = {
  cart: 'drizzle.cart.v1',
  wish: 'drizzle.wish.v1',
  recent: 'drizzle.recent.v1',
  acct: 'drizzle.acct.v1',
};

const State = {
  cart: [],
  wish: [],
  recent: [],
  filtersOpen: false,
  account: null,
};

function loadState() {
  try { State.cart = JSON.parse(localStorage.getItem(LS.cart) || '[]') || []; } catch (e) { State.cart = []; }
  try { State.wish = JSON.parse(localStorage.getItem(LS.wish) || '[]') || []; } catch (e) { State.wish = []; }
  try { State.recent = JSON.parse(localStorage.getItem(LS.recent) || '[]') || []; } catch (e) { State.recent = []; }
  try { State.account = JSON.parse(localStorage.getItem(LS.acct) || 'null'); } catch (e) { State.account = null; }
  // sanitise cart lines (products may have changed)
  State.cart = State.cart.filter((l) => l && l.productId && getProductById(l.productId));
  State.wish = State.wish.filter((id) => getProductById(id));
  State.recent = State.recent.filter((id) => getProductById(id));
}
function saveCart() { try { localStorage.setItem(LS.cart, JSON.stringify(State.cart)); } catch (e) {} }
function saveWish() { try { localStorage.setItem(LS.wish, JSON.stringify(State.wish)); } catch (e) {} }
function saveRecent() { try { localStorage.setItem(LS.recent, JSON.stringify(State.recent)); } catch (e) {} }
function saveAccount() { try { localStorage.setItem(LS.acct, JSON.stringify(State.account)); } catch (e) {} }

function cartKey(productId, variant) {
  return productId + '::' + JSON.stringify(variant || {});
}
function cartCount() { return State.cart.reduce((s, l) => s + l.qty, 0); }
function cartSubtotal() {
  return State.cart.reduce((s, l) => {
    const p = getProductById(l.productId);
    if (!p) return s;
    const unit = l.price != null ? l.price : (p.salePrice != null ? p.salePrice : p.price);
    return s + unit * l.qty;
  }, 0);
}
function deliveryFee() {
  const sub = cartSubtotal();
  const so = Store.serviceOptions || {};
  if (!so.delivery) return 0;
  const threshold = toNumber(so.freeDeliveryThreshold, 0);
  if (threshold > 0 && sub >= threshold) return 0;
  return toNumber(so.deliveryFee, 0);
}
function cartTotal() { return cartSubtotal() + deliveryFee(); }

function addToCart(product, opts) {
  if (!product) return false;
  opts = opts || {};
  const variant = opts.variant || {};
  const qty = clamp(Number(opts.qty) || 1, 1, 99);
  const key = cartKey(product.id, variant);
  const existing = State.cart.find((l) => l.key === key);
  if (existing) {
    existing.qty = clamp(existing.qty + qty, 1, 99);
  } else {
    const unit = opts.price != null ? Number(opts.price) : (product.salePrice != null ? product.salePrice : product.price);
    State.cart.push({
      key: key,
      productId: product.id,
      name: product.name,
      price: unit,
      qty: qty,
      variant: variant,
      variantLabel: opts.variantLabel || '',
    });
  }
  saveCart();
  updateCartCount();
  renderCartDrawer();
  toast(product.name + ' added to cart', 'success');
  return true;
}
function removeFromCart(key) {
  State.cart = State.cart.filter((l) => l.key !== key);
  saveCart(); updateCartCount(); renderCartDrawer();
}
function updateCartQty(key, qty) {
  qty = clamp(Number(qty) || 0, 0, 99);
  const line = State.cart.find((l) => l.key === key);
  if (!line) return;
  if (qty === 0) { removeFromCart(key); return; }
  line.qty = qty;
  saveCart(); updateCartCount(); renderCartDrawer();
}
function clearCart() { State.cart = []; saveCart(); updateCartCount(); renderCartDrawer(); }

function isWished(id) { return State.wish.indexOf(id) !== -1; }
function toggleWish(productId) {
  const p = getProductById(productId);
  if (!p) return;
  const i = State.wish.indexOf(productId);
  if (i === -1) { State.wish.push(productId); toast('Saved to wishlist', 'success'); }
  else { State.wish.splice(i, 1); toast('Removed from wishlist'); }
  saveWish();
  updateWishCount();
  $$('[data-wish="' + productId + '"]').forEach((b) => {
    b.classList.toggle('active', isWished(productId));
    b.setAttribute('aria-pressed', isWished(productId) ? 'true' : 'false');
  });
}
function pushRecent(productId) {
  if (!productId) return;
  State.recent = State.recent.filter((id) => id !== productId);
  State.recent.unshift(productId);
  State.recent = State.recent.slice(0, 12);
  saveRecent();
}

/* =========================================================================
   4. DOM HELPERS
   ========================================================================= */
function toast(msg, type) {
  const wrap = $('#toast');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' toast--' + type : '');
  el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>' + esc(msg) + '</span>';
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function updateCartCount() {
  const n = cartCount();
  $$('[data-cart-count]').forEach((el) => { el.textContent = n; el.hidden = n === 0; });
}
function updateWishCount() {
  const n = State.wish.length;
  $$('[data-wish-count]').forEach((el) => { el.textContent = n; el.hidden = n === 0; });
}

/* =========================================================================
   5. ROUTER
   ========================================================================= */
function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const qIdx = raw.indexOf('?');
  const path = qIdx === -1 ? raw : raw.slice(0, qIdx);
  const query = qIdx === -1 ? '' : raw.slice(qIdx + 1);
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(query);
  return { parts: parts, params: params };
}

function navigate(path, opts) {
  opts = opts || {};
  const target = '#' + path;
  if (location.hash === target) { route(); return; }
  location.hash = path.replace(/^#/, '');
  if (!opts.keepScroll) {
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
}

function buildQuery(obj) {
  const p = new URLSearchParams();
  Object.keys(obj).forEach((k) => {
    const v = obj[k];
    if (v == null || v === '' || (Array.isArray(v) && !v.length)) return;
    if (Array.isArray(v)) p.set(k, v.join(','));
    else p.set(k, v);
  });
  const s = p.toString();
  return s ? '?' + s : '';
}

/* =========================================================================
   6. FILTERS & SORTING
   ========================================================================= */
const SORTS = [
  { id: 'featured', label: 'Featured' },
  { id: 'price-asc', label: 'Price: Low to High' },
  { id: 'price-desc', label: 'Price: High to Low' },
  { id: 'name-asc', label: 'Name: A–Z' },
  { id: 'name-desc', label: 'Name: Z–A' },
];

function readFilters(params) {
  return {
    q: (params.get('q') || '').trim(),
    sort: params.get('sort') || 'featured',
    cats: parseList(params.get('cats')),
    diet: parseList(params.get('diet')),
    badges: parseList(params.get('badge')),
    min: params.get('min') != null && params.get('min') !== '' ? Number(params.get('min')) : null,
    max: params.get('max') != null && params.get('max') !== '' ? Number(params.get('max')) : null,
    avail: params.get('avail') || 'all',
    page: Math.max(1, toNumber(params.get('page'), 1)),
  };
}

function applyFilters(list, f) {
  let out = list.slice();
  if (f.q) {
    const q = f.q.toLowerCase();
    out = out.filter((p) =>
      (p.name + ' ' + p.description + ' ' + p.badge + ' ' + (p.dietary || []).join(' ')).toLowerCase().indexOf(q) !== -1
    );
  }
  if (f.cats.length) {
    const set = new Set(f.cats);
    out = out.filter((p) => (p.categoryIds || []).some((id) => set.has(id)));
  }
  if (f.diet.length) {
    const set = new Set(f.diet);
    out = out.filter((p) => (p.dietary || []).some((d) => set.has(d)));
  }
  if (f.badges.length) {
    const set = new Set(f.badges);
    out = out.filter((p) => set.has(p.badge));
  }
  if (f.min != null && isFinite(f.min)) out = out.filter((p) => effectivePrice(p) >= f.min);
  if (f.max != null && isFinite(f.max)) out = out.filter((p) => effectivePrice(p) <= f.max);
  if (f.avail === 'in') out = out.filter((p) => p.stock > 0);
  if (f.avail === 'out') out = out.filter((p) => p.stock <= 0);
  return out;
}

function effectivePrice(p) { return p.salePrice != null ? p.salePrice : p.price; }

function sortProducts(list, sort) {
  const arr = list.slice();
  switch (sort) {
    case 'price-asc': arr.sort((a, b) => effectivePrice(a) - effectivePrice(b)); break;
    case 'price-desc': arr.sort((a, b) => effectivePrice(b) - effectivePrice(a)); break;
    case 'name-asc': arr.sort((a, b) => a.name.localeCompare(b.name)); break;
    case 'name-desc': arr.sort((a, b) => b.name.localeCompare(a.name)); break;
    default: arr.sort((a, b) => {
      if (a.featured !== b.featured) return a.featured ? -1 : 1;
      return a.position - b.position;
    });
  }
  return arr;
}

function paginate(list, page) {
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / PER_PAGE));
  const p = clamp(page, 1, pages);
  const start = (p - 1) * PER_PAGE;
  const items = list.slice(start, start + PER_PAGE);
  return { items: items, page: p, pages: pages, total: total, start: start };
}

function paginationHTML(page, pages, buildHref) {
  if (pages <= 1) return '';
  const items = [];
  items.push('<a href="' + buildHref(Math.max(1, page - 1)) + '" class="' + (page === 1 ? 'disabled' : '') + '" aria-label="Previous page">‹</a>');
  const windowSize = 5;
  let start = Math.max(1, page - Math.floor(windowSize / 2));
  let end = Math.min(pages, start + windowSize - 1);
  if (end - start + 1 < windowSize) start = Math.max(1, end - windowSize + 1);
  if (start > 1) {
    items.push('<a href="' + buildHref(1) + '">1</a>');
    if (start > 2) items.push('<span class="disabled">…</span>');
  }
  for (let i = start; i <= end; i++) {
    if (i === page) items.push('<span aria-current="page">' + i + '</span>');
    else items.push('<a href="' + buildHref(i) + '">' + i + '</a>');
  }
  if (end < pages) {
    if (end < pages - 1) items.push('<span class="disabled">…</span>');
    items.push('<a href="' + buildHref(pages) + '">' + pages + '</a>');
  }
  items.push('<a href="' + buildHref(Math.min(pages, page + 1)) + '" class="' + (page === pages ? 'disabled' : '') + '" aria-label="Next page">›</a>');
  return '<nav class="pagination" aria-label="Pagination">' + items.join('') + '</nav>';
}

function breadcrumbsHTML(items) {
  return '<nav class="breadcrumb" aria-label="Breadcrumb">' +
    items.map((it, i) => {
      const last = i === items.length - 1;
      const inner = last ? '<span aria-current="page">' + esc(it.label) + '</span>' : '<a href="' + esc(it.href) + '">' + esc(it.label) + '</a>';
      return inner + (last ? '' : '<span class="sep">/</span>');
    }).join('') +
  '</nav>';
}

function renderCartDrawer() {
  const body = $('#cartDrawerBody');
  const foot = $('#cartDrawerFoot');
  const countEl = $('#cartDrawerCount');
  if (!body || !foot) return;
  const n = cartCount();
  if (countEl) countEl.textContent = n + ' item' + (n === 1 ? '' : 's');

  if (!State.cart.length) {
    body.innerHTML = '<div class="cart-empty">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>' +
      '<h3>Your cart is empty</h3><p>Browse our menu and add a few dishes to get started.</p>' +
      '<a class="btn" href="#/products" data-close-cart>Browse dishes</a></div>';
    foot.innerHTML = '';
    return;
  }

  body.innerHTML = State.cart.map((l) => {
    const p = getProductById(l.productId);
    if (!p) return '';
    return '<div class="cart-line">' +
      '<div class="cart-line__media">' + artFor(p) + '</div>' +
      '<div class="cart-line__meta">' +
        '<div class="cart-line__name">' + esc(l.name) + '</div>' +
        (l.variantLabel ? '<div class="cart-line__variant">' + esc(l.variantLabel) + '</div>' : '') +
        '<button type="button" class="cart-line__remove" data-cart-remove="' + esc(l.key) + '">Remove</button>' +
        '<div class="cart-line__bottom">' +
          '<div class="cart-line__qty">' +
            '<button type="button" data-cart-dec="' + esc(l.key) + '" aria-label="Decrease quantity">−</button>' +
            '<span>' + l.qty + '</span>' +
            '<button type="button" data-cart-inc="' + esc(l.key) + '" aria-label="Increase quantity">+</button>' +
          '</div>' +
          '<div class="cart-line__price">' + money(l.price * l.qty) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  const sub = cartSubtotal();
  const fee = deliveryFee();
  const total = sub + fee;
  const freeThreshold = toNumber(Store.serviceOptions.freeDeliveryThreshold, 0);
  let freeShipNote = '';
  if (freeThreshold > 0 && sub < freeThreshold) {
    freeShipNote = '<div class="cart-free-ship">' + icon('truck') + 'Add ' + money(freeThreshold - sub) + ' more for free delivery</div>';
  } else if (freeThreshold > 0) {
    freeShipNote = '<div class="cart-free-ship">' + icon('check') + 'You qualify for free delivery</div>';
  }
  foot.innerHTML = freeShipNote +
    '<div class="cart-summary">' +
      '<div class="cart-summary__row"><span class="label">Subtotal</span><span>' + money(sub) + '</span></div>' +
      '<div class="cart-summary__row"><span class="label">Delivery</span><span>' + (fee === 0 ? 'Free' : money(fee)) + '</span></div>' +
      '<div class="cart-summary__row total"><span>Total</span><span>' + money(total) + '</span></div>' +
    '</div>' +
    '<a class="btn btn--block" href="#/checkout" data-close-cart>Checkout</a>' +
    '<a class="btn btn--ghost btn--block" href="#/cart" data-close-cart style="margin-top:8px">View cart</a>' +
    '<p class="cart-note">Payment is not processed in this demo.</p>';
}

function renderSearchOverlay(query) {
  const body = $('#searchOverlayBody');
  if (!body) return;
  const q = String(query || '').trim().toLowerCase();
  const cats = publishedCategories();
  const prods = publishedProducts();
  const matchedCats = q ? cats.filter((c) => c.name.toLowerCase().indexOf(q) !== -1) : [];
  const matchedProds = q
    ? prods.filter((p) => (p.name + ' ' + p.description + ' ' + p.badge + ' ' + (p.dietary || []).join(' ')).toLowerCase().indexOf(q) !== -1).slice(0, 6)
    : [];
  const suggestions = q ? [] : ['Burger', 'Pasta', 'Seafood', 'Dessert', 'Vegan', 'Coffee', 'Cocktail'];

  let html = '';
  if (!q) {
    html += '<div class="search-section"><h4>Popular searches</h4><div class="search-sugg">' +
      suggestions.map((s) => '<a href="#/search?q=' + encodeURIComponent(s) + '" data-close-search>' + esc(s) + '</a>').join('') +
    '</div></div>';
    html += '<div class="search-section"><h4>Browse categories</h4><div class="search-sugg">' +
      cats.slice(0, 8).map((c) => '<a href="#/c/' + esc(c.slug) + '" data-close-search>' + esc(c.name) + '</a>').join('') +
    '</div></div>';
  } else if (!matchedCats.length && !matchedProds.length) {
    html += '<div class="search-empty">No matches for “' + esc(query) + '”. Try a different keyword.</div>';
  } else {
    if (matchedCats.length) {
      html += '<div class="search-section"><h4>Categories</h4><div class="search-sugg">' +
        matchedCats.map((c) => '<a href="#/c/' + esc(c.slug) + '" data-close-search>' + esc(c.name) + '</a>').join('') +
      '</div></div>';
    }
    if (matchedProds.length) {
      html += '<div class="search-section"><h4>Dishes</h4><div class="search-results">' +
        matchedProds.map((p) => '<a class="search-result" href="#/p/' + esc(p.slug) + '" data-close-search>' +
          '<span class="search-result__thumb">' + artFor(p) + '</span>' +
          '<span class="search-result__meta"><span class="search-result__name">' + esc(p.name) + '</span>' +
          '<span class="search-result__cat">' + esc(primaryCategory(p) ? primaryCategory(p).name : '') + '</span></span>' +
          '<span class="search-result__price">' + money(effectivePrice(p)) + '</span>' +

      '</div><p style="margin-top:10px"><a class="link" href="#/search?q=' + encodeURIComponent(query) + '" data-close-search>See all results ' + icon('arrow') + '</a></p></div>';
    }
  }
  body.innerHTML = html;
}

function screenCategory(slug, params) {
  const cat = getCategoryBySlug(slug);
  if (!cat) return screenNotFound('Category not found');
  const f = readFilters(params);
  // if no explicit cats filter, scope to this category
  if (!f.cats.length) f.cats = [cat.id];
  // ensure category itself always included
  if (f.cats.indexOf(cat.id) === -1) f.cats.push(cat.id);
  const all = productsForCategory(cat.id, true);
  const filtered = sortProducts(applyFilters(all, f), f.sort);
  const paged = paginate(filtered, f.page);
  const children = (Store._childrenOf.get(cat.id) || []).map(getCategoryById).filter(Boolean);
  const baseHref = function (page) {
    return '#/c/' + esc(slug) + buildQuery({
      q: f.q || null, sort: f.sort !== 'featured' ? f.sort : null,
      cats: f.cats.filter((id) => id !== cat.id), diet: f.diet.length ? f.diet : null,
      badge: f.badges.length ? f.badges : null, min: f.min, max: f.max,
      avail: f.avail !== 'all' ? f.avail : null, page: page > 1 ? page : null,
    });
  };
  return '' +
    '<div class="page-head"><div class="wrap">' +
      breadcrumbsHTML([{ label: 'Home', href: '#/' }, { label: 'Categories', href: '#/categories' }, { label: cat.name }]) +
      '<h1>' + esc(cat.name) + '</h1>' +
      (cat.description ? '<p>' + esc(cat.description) + '</p>' : '') +
    '</div></div>' +
    '<div class="wrap listing-layout">' +
      '<aside class="filters" id="filtersSidebar">' + filtersHTML(f, 'category', cat.id) + '</aside>' +

          '<div class="listing-bar__count">Showing <strong>' + paged.items.length + '</strong> of <strong>' + filtered.length + '</strong> dishes</div>' +

            '<div class="sort-select"><label class="sr-only" for="sortSelect">Sort by</label>' +
              '<select id="sortSelect">' + SORTS.map((s) => '<option value="' + s.id + '"' + (s.id === f.sort ? ' selected' : '') + '>' + s.label + '</option>').join('') + '</select>' +
            '</div>' +

function activeFiltersHTML(f) {
  const chips = [];
  f.cats.forEach((id) => {
    const c = getCategoryById(id);
    if (c) chips.push({ label: c.name, attr: 'data-clear-cat="' + esc(id) + '"' });
  });
  f.diet.forEach((d) => chips.push({ label: d, attr: 'data-clear-diet="' + esc(d) + '"' }));
  f.badges.forEach((b) => chips.push({ label: b, attr: 'data-clear-badge="' + esc(b) + '"' }));
  if (f.min != null) chips.push({ label: 'Min ' + money(f.min), attr: 'data-clear-min' });
  if (f.max != null) chips.push({ label: 'Max ' + money(f.max), attr: 'data-clear-max' });
  if (f.avail !== 'all') chips.push({ label: f.avail === 'in' ? 'In stock' : 'Out of stock', attr: 'data-clear-avail' });
  if (f.q) chips.push({ label: '"' + f.q + '"', attr: 'data-clear-q' });
  if (!chips.length) return '';
  return '<div class="active-filters">' +
    chips.map((c) => '<button type="button" class="chip" ' + c.attr + '>' + esc(c.label) + icon('close') + '</button>').join('') +
    '<button type="button" class="chip" data-clear-filters style="background:transparent;border-style:dashed">Clear all</button>' +
  '</div>';
}
