  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

  <!-- Tailwind CSS CDN -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {

            brand: {
              navy: '#0B132B',
              slate: '#1C2541',

          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Syne"', '"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- Custom CSS for luxury real estate aesthetics -->
  <style>
    :root {
      --brand-navy: var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-01);
      --brand-orange: var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-02);
      --brand-stone: var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-03);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-04);
      background-color: var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-05);
      overflow-x: hidden;
    }
    h1, h2, h3, .font-display {
      font-family: 'Syne', 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.02em;
    }
    /* Hide scrollbar for clean horizontal rails */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Leaflet popup styling override */
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 0.75rem;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-06), 0 8px 10px -6px var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-06);
    }
    .leaflet-popup-content {
      margin: 0;
      line-height: 1.4;
    }
    /* Graceful image fallbacks */
    img {
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    /* Safe motion defaults */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* Watermark text styling */
    .watermark-text {
      font-size: clamp(4rem, 15vw, 14rem);
      line-height: 0.8;
      pointer-events: none;
      user-select: none;
    }
  </style>

  <!-- Lucide Icons & GSAP + Leaflet via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="./eshop-mobile.css?v=3">
<style data-eshop-skeleton-styles="">.eshop-skeleton-bar{display:inline-block;max-width:100%;height:.72em;min-width:2.5em;border-radius:999px;background:var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-07);vertical-align:middle}.eshop-placeholder-media{background:linear-gradient(135deg,var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-07),var(--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-08));object-fit:cover}</style><style data-theme-tokens="">:root{--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-01:#0b132b;--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-02:#e05a2b;--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-03:#f8f9fa;--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-04:#1e293b;--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-05:#ffffff;--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-06:rgb(000/0.1);--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-07:#d1d5db;--theme-aurus-real-estate-kenya-luxury-property-discovery-platform-color-08:#f3f4f6;}</style></head>
<body class="bg-white text-slate-800 antialiased selection:bg-orange-500 selection:text-white">

  <!-- ================= TOP ANNOUNCEMENT / CONTACT TICKER ================= -->
  <div class="bg-brand-dark text-slate-300 text-xs py-2 px-4 border-b border-white/10 z-50 relative">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-4 text-[11px] sm:text-xs">
        <span class="inline-flex items-center gap-1.5 text-orange-400 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-orange-500 animate-pulse"></span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 89%;"></span></span>
        <span class="hidden md:inline text-slate-600"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
        <span class="hidden md:flex items-center gap-1 text-slate-400">
          <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-400"></i><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 96%;"></span></span>
      </div>
      <div class="flex items-center gap-4 text-[11px] sm:text-xs">
        <a class="hover:text-white flex items-center gap-1 transition-colors">
          <i data-lucide="phone" class="w-3 h-3 text-orange-400"></i><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 54%;"></span></a>
        <a target="_blank" rel="noopener noreferrer" class="hover:text-white flex items-center gap-1 transition-colors">
          <i data-lucide="message-circle" class="w-3 h-3 text-emerald-400"></i><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 35%;"></span></a>
        <span class="text-slate-600"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
        <!-- Currency Toggle -->
        <button id="currency-toggle-btn" onclick="toggleCurrency()" class="text-slate-300 hover:text-white font-semibold transition-colors flex items-center gap-1 bg-white/5 px-2 py-0.5 rounded text-[11px]">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 24%;"></span></span>
          <span id="current-currency-label" class="text-orange-400 font-bold"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= PRIMARY NAVIGATION HEADER ================= -->
  <header id="main-header" class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-100 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Brand Logo -->
        <a href="#home" class="flex items-center gap-2 group">
          <div class="flex flex-col">
            <span class="font-display text-2xl sm:text-3xl font-extrabold tracking-tight text-brand-navy group-hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 14%;"></span><span class="text-brand-orange"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
            </span>
            <span class="text-[9px] tracking-[0.28em] uppercase text-slate-400 font-semibold -mt-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 46%;"></span></span>
          </div>
        </a>

        <!-- Desktop Navigation Links -->
        <nav class="hidden lg:flex items-center gap-7 text-[13px] font-semibold text-slate-700 uppercase tracking-wider">
          <a href="#properties" onclick="applyCategoryFilter('all')" class="hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 27%;"></span></a>
          <a href="#properties" onclick="applyCategoryFilter('sale')" class="hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></a>
          <a href="#properties" onclick="applyCategoryFilter('rent')" class="hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 11%;"></span></a>
          <a href="#properties" onclick="applyCategoryFilter('commercial')" class="hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 27%;"></span></a>
          <a href="#properties" onclick="applyCategoryFilter('land')" class="hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 32%;"></span></a>
          <a href="#neighbourhoods" class="hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 38%;"></span></a>
          <a href="#agents" class="hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 16%;"></span></a>
          <a href="#mortgage-calculator" class="hover:text-brand-orange transition-colors"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 27%;"></span></a>
        </nav>

        <!-- Header Actions: Saved Wishlist, Sell CTA & Mobile Toggle -->
        <div class="flex items-center gap-3">
          <!-- Saved Properties Shortcut Button -->
          <a href="#saved" class="relative p-2.5 text-slate-700 hover:text-brand-orange rounded-full hover:bg-slate-50 transition-colors">
            <i data-lucide="bookmark" class="w-5 h-5"></i>
            <span id="saved-count-badge" class="absolute -top-0.5 -right-0.5 bg-brand-orange text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
          </a>

          <!-- Quick Search Icon -->
          <a href="#properties" class="p-2.5 text-slate-700 hover:text-brand-orange rounded-full hover:bg-slate-50 transition-colors">
            <i data-lucide="search" class="w-5 h-5"></i>
          </a>

          <!-- List With Us CTA Button -->
          <a href="#sell" class="hidden sm:inline-flex items-center justify-center px-5 py-2.5 bg-brand-navy hover:bg-brand-slate text-white text-xs font-bold uppercase tracking-wider rounded-lg transition-all shadow-sm hover:shadow"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 32%;"></span></a>

          <!-- Mobile Hamburger Toggle -->
          <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="lg:hidden p-2 text-slate-700 hover:text-brand-orange rounded-lg focus:outline-none">
            <i data-lucide="menu" id="menu-icon" class="w-6 h-6"></i>
          </button>
        </div>

      </div>
    </div>

    <!-- Mobile Slide-down Drawer -->
    <div id="mobile-menu" class="hidden lg:hidden bg-white border-b border-slate-200 px-5 pt-3 pb-6 shadow-xl">
      <div class="flex flex-col gap-3 text-sm font-semibold text-slate-800 uppercase tracking-wide">
        <a href="#home" onclick="closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 11%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#properties" onclick="applyCategoryFilter('all'); closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 38%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#properties" onclick="applyCategoryFilter('sale'); closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 41%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#properties" onclick="applyCategoryFilter('rent'); closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 27%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#properties" onclick="applyCategoryFilter('commercial'); closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 54%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#properties" onclick="applyCategoryFilter('land'); closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 32%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#neighbourhoods" onclick="closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 54%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#agents" onclick="closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 27%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#mortgage-calculator" onclick="closeMobileMenu()" class="py-2 border-b border-slate-100 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 51%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
        </a>
        <a href="#sell" onclick="closeMobileMenu()" class="py-2 border-b border-slate-100 text-brand-orange flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 78%;"></span></span> <i data-lucide="chevron-right" class="w-4 h-4 text-brand-orange"></i>
        </a>
        <a href="#saved" onclick="closeMobileMenu()" class="py-2 flex items-center justify-between">
          <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 43%;"></span></span> <span id="mobile-saved-badge" class="bg-brand-orange text-white text-xs px-2 py-0.5 rounded-full"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 8%;"></span></span>
        </a>
      </div>
      <div class="mt-4 pt-4 border-t border-slate-100 flex flex-col gap-2">
        <a href="#sell" onclick="closeMobileMenu()" class="w-full text-center py-3 bg-brand-navy text-white text-xs font-bold uppercase rounded-lg"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 49%;"></span></a>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT APP CONTAINER (DYNAMIC VIEWS) ================= -->
  <main id="app-root" class="min-h-screen">
    <!-- Views rendered dynamically via JavaScript based on URL hash:
         - #home (Reference image layout)
         - #properties (Catalogue with full filters & map)
         - #property/:id (Detailed individual listing)
         - #agents & #agent/:id (Directory & profiles)
         - #neighbourhoods & #neighbourhood/:id (Area guides)
         - #mortgage-calculator (Amortisation tool)
         - #sell & #rent-out (Owner lead gen)
         - #saved (Shortlist wishlist & comparison)
         - #about, #contact, #faq, #guides (Informational)
    -->
  </main>

  <!-- ================= GLOBAL MODAL: SCHEDULE VIEWING / INQUIRY ================= -->
  <div id="viewing-modal" class="fixed inset-0 z-50 hidden bg-brand-dark/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full max-h-[92vh] overflow-y-auto shadow-2xl p-6 relative">
      <button onclick="closeViewingModal()" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-700 rounded-full hover:bg-slate-100 transition-colors">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="mb-5">
        <span class="text-[11px] font-bold uppercase tracking-wider text-brand-orange"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 62%;"></span></span>
        <h3 id="modal-property-title" class="font-display text-xl font-bold text-slate-900 mt-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 86%;"></span></h3>
        <p class="text-xs text-slate-500 mt-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 96%;"></span></p>
      </div>

      <!-- Demo Disclaimer Notice -->
      <div class="bg-orange-50 border border-orange-200/80 rounded-xl p-3 mb-5 text-[11px] text-amber-900 flex items-start gap-2">
        <i data-lucide="info" class="w-4 h-4 text-orange-600 shrink-0 mt-0.5"></i>
        <span><strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 38%;"></span></strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 96%;"></span></span>
      </div>

      <form id="viewing-form" onsubmit="handleViewingSubmit(event)" class="space-y-4">
        <input type="hidden" id="modal-property-id" value="">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 30%;"></span></label>
          <input type="text" id="v-name" required="" class="w-full text-xs px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/40 focus:border-brand-orange">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 41%;"></span></label>
            <input type="email" id="v-email" required="" class="w-full text-xs px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/40 focus:border-brand-orange">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 49%;"></span></label>
            <input type="tel" id="v-phone" required="" class="w-full text-xs px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/40 focus:border-brand-orange">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 43%;"></span></label>
            <input type="date" id="v-date" required="" class="w-full text-xs px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/40 focus:border-brand-orange">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 62%;"></span></label>
            <select id="v-time" class="w-full text-xs px-3.5 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/40 focus:border-brand-orange">
              <option><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 62%;"></span></option>
              <option selected=""><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 68%;"></span></option>
              <option><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 81%;"></span></option>
              <option><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 78%;"></span></option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 38%;"></span></label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="border border-slate-200 rounded-lg p-2.5 flex items-center gap-2 cursor-pointer hover:bg-slate-50">
              <input type="radio" name="v-type" value="in-person" checked="" class="text-brand-orange focus:ring-brand-orange">
              <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 57%;"></span></span>
            </label>
            <label class="border border-slate-200 rounded-lg p-2.5 flex items-center gap-2 cursor-pointer hover:bg-slate-50">
              <input type="radio" name="v-type" value="virtual" class="text-brand-orange focus:ring-brand-orange">
              <span><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 62%;"></span></span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 70%;"></span></label>
          <textarea id="v-notes" rows="2" class="w-full text-xs px-3.5 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-orange/40 focus:border-brand-orange"></textarea>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3 bg-brand-orange hover:bg-brand-orange-hover text-white text-xs font-bold uppercase tracking-wider rounded-lg transition-colors shadow"><span class="eshop-skeleton-bar" data-skeleton-text="" style="width: 84%;"></span></button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= GLOBAL ENLARGED PHOTO LIGHTBOX ================= -->
  <div id="lightbox-modal" class="fixed inset-0 z-50 hidden bg-black/95 flex items-center justify-center p-4">
    <button onclick="closeLightbox()" class="absolute top-5 right-5 text-white/80 hover:text-white p-2 text-2xl z-50">

    function formatCurrency(amountKes, rentPeriod = null) {
      if (!amountKes || amountKes === 0) return 'Price on Inquiry';

      let displayVal = '';
      if (STATE.currency === 'USD') {
        const usdVal = Math.round(amountKes / STATE.kesToUsdRate);
        displayVal = '$' + usdVal.toLocaleString('en-US');
      } else {
        displayVal = 'KES ' + amountKes.toLocaleString('en-KE');
      }

      if (rentPeriod) {
        displayVal += ` / ${rentPeriod}`;
      }
      return displayVal;
    }

      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      });

      setTimeout(() => {

        setTimeout(() => toast.remove(), 350);

    // --- Wishlist / Saved Properties Functionality ---
    function isPropertySaved(id) {
      return STATE.savedProperties.includes(id);
    }

    function toggleSaveProperty(id, event) {
      if (event) {
        event.stopPropagation();
        event.preventDefault();
      }
      const index = STATE.savedProperties.indexOf(id);
      if (index > -1) {
        STATE.savedProperties.splice(index, 1);
        showToast('Property removed from shortlist');
      } else {
        STATE.savedProperties.push(id);
        showToast('Property saved to shortlist');
      }
      localStorage.setItem('aurus_saved_properties', JSON.stringify(STATE.savedProperties));
      updateSavedBadges();
      
      // Update heart icon if on screen
      const heartBtns = document.querySelectorAll(`[data-save-id="${id}"]`);
      heartBtns.forEach(btn => {
        const icon = btn.querySelector('i');
        if (icon) {
          if (isPropertySaved(id)) {
            btn.classList.add('text-brand-orange');
            btn.classList.remove('text-slate-400');
            icon.setAttribute('fill', 'currentColor');
          } else {
            btn.classList.remove('text-brand-orange');
            btn.classList.add('text-slate-400');
            icon.removeAttribute('fill');
          }
        }
      });

      // If currently on saved view, re-render
      if (STATE.currentRoute === 'saved') {
        renderSavedView();
      }
    }

    function updateSavedBadges() {
      const count = STATE.savedProperties.length;
      const b1 = document.getElementById('saved-count-badge');
      const b2 = document.getElementById('mobile-saved-badge');
      if (b1) b1.innerText = count;
      if (b2) b2.innerText = count;
    }

    // --- Viewing Modal Form Handler ---
    function openViewingModal(propertyId = '') {
      const modal = document.getElementById('viewing-modal');
      const propInput = document.getElementById('modal-property-id');
      const titleElem = document.getElementById('modal-property-title');
      
      if (propertyId) {
        propInput.value = propertyId;
        const prop = PROPERTIES_DATA.find(p => p.id === propertyId);
        if (prop) {
          titleElem.innerText = `Viewing: ${prop.title} (${prop.location})`;
        }
      } else {
        propInput.value = '';
        titleElem.innerText = 'Schedule a Private Property Consultation';
      }

      // Set min date to today
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById('v-date');
      if (dateInput) {
        dateInput.min = today;
        dateInput.value = today;
      }

      modal.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeViewingModal() {
      document.getElementById('viewing-modal').classList.add('hidden');
    }

    function handleViewingSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('v-name').value;
      const date = document.getElementById('v-date').value;
      const time = document.getElementById('v-time').value;
      const propId = document.getElementById('modal-property-id').value;
      
      let propName = 'General Portfolio';
      if (propId) {
        const p = PROPERTIES_DATA.find(x => x.id === propId);
        if (p) propName = p.title;
      }

      closeViewingModal();
      showToast(`Thank you, ${name}! Your viewing request for "${propName}" on ${date} (${time}) has been registered with our advisory desk.`);
      document.getElementById('viewing-form').reset();
    }

    // ========================================================================
    // ROUTING & CONTROLLER LOGIC

    function handleHashChange() {
      const hash = window.location.hash.replace('#', '') || 'home';
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (hash.startsWith('property/')) {
        const id = hash.replace('property/', '');
        STATE.currentRoute = 'property-detail';
        STATE.currentPropertyId = id;
      } else if (hash.startsWith('neighbourhood/')) {
        const nId = hash.replace('neighbourhood/', '');
        // Filter properties by this neighbourhood and jump to catalogue
        STATE.filterCriteria.location = nId;
        STATE.currentRoute = 'properties';
      } else {
        STATE.currentRoute = hash;
        STATE.currentPropertyId = null;
      }

      renderCurrentRoute();
    }

    function renderCurrentRoute() {
      const root = document.getElementById('app-root');
      if (!root) return;

      let html = '';
      switch (STATE.currentRoute) {
        case 'home':
          html = renderHomeView();
          break;
        case 'properties':
          html = renderPropertiesCatalogueView();
          break;
        case 'property-detail':
          html = renderPropertyDetailView(STATE.currentPropertyId);
          break;
        case 'agents':
          html = renderAgentsView();
          break;
        case 'neighbourhoods':
          html = renderNeighbourhoodsView();
          break;
        case 'mortgage-calculator':
          html = renderMortgageCalculatorView();
          break;
        case 'saved':
          html = renderSavedView();
          break;
        case 'sell':
          html = renderOwnerLeadGenView('sell');
          break;
        case 'rent-out':
          html = renderOwnerLeadGenView('rent-out');
          break;
        case 'valuation':
          html = renderOwnerLeadGenView('valuation');
          break;
        case 'about':
          html = renderAboutView();
          break;
        case 'contact':
          html = renderContactView();
          break;
        case 'faq':
          html = renderFaqView();
          break;
        case 'guides':
          html = renderGuidesView();
          break;
        default:
          html = renderHomeView();
      }

      root.innerHTML = html;

      // Re-initialize Lucide Icons
      if (window.lucide) {
        lucide.createIcons();
      }

      // Re-initialize Maps if needed
      if (STATE.currentRoute === 'property-detail' && STATE.currentPropertyId) {
        initPropertyDetailMap(STATE.currentPropertyId);
      }

      // Re-trigger subtle GSAP text animations if GSAP is loaded
      initGsapAnimations();
    }

    // --- Filter Application Functions ---
    function getFilteredProperties() {
      return PROPERTIES_DATA.filter(p => {
        // Purpose / Category
        if (STATE.filterCriteria.category !== 'all') {
          if (STATE.filterCriteria.category === 'sale' && p.purpose !== 'sale') return false;
          if (STATE.filterCriteria.category === 'rent' && p.purpose !== 'rent') return false;
          if (STATE.filterCriteria.category === 'commercial' && p.purpose !== 'commercial') return false;
          if (STATE.filterCriteria.category === 'land' && p.purpose !== 'land') return false;
          if (STATE.filterCriteria.category === 'off-plan' && p.purpose !== 'off-plan') return false;
          if (STATE.filterCriteria.category === 'penthouses' && p.type !== 'Penthouse') return false;
        }

        // Location
        if (STATE.filterCriteria.location !== 'all') {
          if (p.neighbourhood !== STATE.filterCriteria.location) return false;
        }

        // Property Type
        if (STATE.filterCriteria.type !== 'all') {
          if (p.type !== STATE.filterCriteria.type) return false;
        }

        // Bedrooms
        if (STATE.filterCriteria.bedrooms !== 'all') {
          const minBeds = parseInt(STATE.filterCriteria.bedrooms, 10);
          if (p.beds < minBeds) return false;
        }

        // Search Query
        if (STATE.filterCriteria.searchQuery.trim() !== '') {
          const q = STATE.filterCriteria.searchQuery.toLowerCase();
          const matches = p.title.toLowerCase().includes(q) ||
                          p.location.toLowerCase().includes(q) ||
                          p.address.toLowerCase().includes(q) ||
                          p.type.toLowerCase().includes(q) ||
                          p.shortDesc.toLowerCase().includes(q);
          if (!matches) return false;
        }

        return true;
      }).sort((a, b) => {
        if (STATE.filterCriteria.sortBy === 'price-asc') return a.priceKes - b.priceKes;
        if (STATE.filterCriteria.sortBy === 'price-desc') return b.priceKes - a.priceKes;
        if (STATE.filterCriteria.sortBy === 'sqm-desc') return (b.sqm || 0) - (a.sqm || 0);
        return 0; // default featured
      });
    }

        renderCurrentRoute();

      else if (cat === 'commercial') list = PROPERTIES_DATA.filter(p => p.purpose === 'commercial' || p.purpose === 'land');

    // --- Interactive Map Toggles & Initializers ---
    function toggleCatalogueViewMode(mode) {
      const grid = document.getElementById('catalogue-grid-container');

      } else {
        map.classList.add('hidden');
        grid.classList.remove('hidden');
        gridBtn.classList.add('bg-brand-navy', 'text-white');
        gridBtn.classList.remove('bg-white', 'text-slate-700');
        mapBtn.classList.remove('bg-brand-navy', 'text-white');
        mapBtn.classList.add('bg-white', 'text-slate-700');

    }

    function initCatalogueMap() {
      if (!window.L) return;
      const container = document.getElementById('catalogue-leaflet-map');
      if (!container) return;

      // Clean old instance
      if (STATE.mapInstance) {
        STATE.mapInstance.remove();
        STATE.mapInstance = null;

    function initPropertyDetailMap(propertyId) {
      if (!window.L) return;
      const container = document.getElementById('property-detail-map');
      if (!container) return;

      const p = PROPERTIES_DATA.find(x => x.id === propertyId);
      if (!p || !p.lat) return;

      const map = L.map('property-detail-map').setView([p.lat, p.lng], 14);
      L.tileLayer("", {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      const marker = L.marker([p.lat, p.lng]).addTo(map);
      marker.bindPopup(`<strong><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:43%"></span></strong><br /><span class="eshop-skeleton-bar" data-skeleton-text="" style="width:40%"></span>`).openPopup();
      setTimeout(() => map.invalidateSize(), 200);
    }

    // --- Mortgage Formula Calculations ---
    function calculateMonthlyRepayment(principal, annualRatePct, years) {
      const monthlyRate = (annualRatePct / 100) / 12;
      const numMonths = years * 12;
      if (monthlyRate === 0) return 'KES ' + Math.round(principal / numMonths).toLocaleString('en-KE');
      
      const factor = Math.pow(1 + monthlyRate, numMonths);
      const monthlyPayment = principal * ((monthlyRate * factor) / (factor - 1));
      return 'KES ' + Math.round(monthlyPayment).toLocaleString('en-KE');
    }

    function updateQuickMortgage(totalPrice, depositPct) {
      const depVal = Math.round(totalPrice * (depositPct / 100));
      const loanAmount = totalPrice - depVal;
      const repay = calculateMonthlyRepayment(loanAmount, 13.5, 20);

      document.getElementById('widget-dep-pct').innerText = depositPct + '%';
      document.getElementById('widget-dep-val').innerText = formatCurrency(depVal);
      document.getElementById('widget-repay-val').innerText = repay;
    }

    function recalculateMortgage() {
      const price = parseFloat(document.getElementById('calc-price-input').value) || 45000000;
      const depPct = parseFloat(document.getElementById('calc-deposit-input').value) || 20;
      const rate = parseFloat(document.getElementById('calc-rate-input').value) || 13.5;
      const years = parseInt(document.getElementById('calc-tenure-input').value, 10) || 20;

      const depAmount = price * (depPct / 100);
      const loanPrincipal = price - depAmount;

      const monthlyRate = (rate / 100) / 12;
      const numMonths = years * 12;
      const factor = Math.pow(1 + monthlyRate, numMonths);
      const monthlyPayment = loanPrincipal * ((monthlyRate * factor) / (factor - 1));
      const totalLifetime = monthlyPayment * numMonths;
      const totalInterest = totalLifetime - loanPrincipal;

      // Update UI elements
      document.getElementById('calc-price-display').innerText = 'KES ' + price.toLocaleString('en-KE');
      document.getElementById('calc-deposit-display').innerText = `${depPct}% (KES ${depAmount.toLocaleString('en-KE')})`;
      
      document.getElementById('res-monthly').innerText = 'KES ' + Math.round(monthlyPayment).toLocaleString('en-KE');
      document.getElementById('res-principal').innerText = 'KES ' + Math.round(loanPrincipal).toLocaleString('en-KE');
      document.getElementById('res-interest').innerText = 'KES ' + Math.round(totalInterest).toLocaleString('en-KE');
      document.getElementById('res-total').innerText = 'KES ' + Math.round(totalLifetime).toLocaleString('en-KE');

      // Visual ratios
      const pRatio = Math.round((loanPrincipal / totalLifetime) * 100);
      const iRatio = 100 - pRatio;
      document.getElementById('bar-principal').style.width = pRatio + '%';
      document.getElementById('bar-interest').style.width = iRatio + '%';
    }

    // --- Lead Gen Form Submissions ---
    function handleLeadGenSubmit(e, mode) {
      e.preventDefault();
      showToast('Thank you! Your property intake has been dispatched to our senior valuation partner. We will contact you within 24 hours.');
      e.target.reset();
    }

    function handleContactSubmit(e) {
      e.preventDefault();
      showToast('Your message has been received by our client desk. A senior advisor will follow up promptly.');
      e.target.reset();
    }

    // --- GSAP Animation Initializer (With Full Defensive Fallbacks) ---
    function initGsapAnimations() {
      if (!window.gsap) return;
      
      // Respect user's motion preferences
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      try {
        // Register ScrollTrigger if available
        if (window.ScrollTrigger) {
          gsap.registerPlugin(ScrollTrigger);
        }

        // Subtly animate headlines in view
        gsap.fromTo("h1, h2", 
          { opacity: 0.85, y: 8 }, 
          { opacity: 1, y: 0, duration: 0.6, ease: "power2.out", stagger: 0.05 }
        );
      } catch (err) {
        // Safe silent fail
        console.warn("GSAP subtle animation skipped", err);
      }
    }

    // --- Application Bootstrapping ---
    window.addEventListener('DOMContentLoaded', () => {
      updateSavedBadges();
      handleHashChange();
    });

    window.addEventListener('hashchange', handleHashChange);
  </script>
