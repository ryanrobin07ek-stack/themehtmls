  function screenPage(slug){
    const pg = PUB.pages.find(x => x.slug === slug && x.published !== 0 && x.type === "custom");
    if (!pg) return `<div class="container">${notFound('Page not found.')}</div>`;
    const body = String(pg.body || "").split(/\n{2,}/)
      .map(p => `<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join('');
    return `<div class="container prose" style="padding-top:24px">
      <h1>${esc(pg.title)}</h1>${body}
    </div>`;
  }

  function notFound(msg){
    return `<div class="empty-state" style="margin:30px 0"><h3>${esc(msg || 'Not found')}</h3>
      <p>The page you asked for does not exist or is not published.</p>
      <p style="margin-top:14px"><a class="btn btn--outline" href="#/home">Back to home</a></p>
    </div>`;
  }

  function renderFooter(){
    const groups = (PUB.footerGroups || []).slice()
      .sort((a,b) => (a.position||0) - (b.position||0));
    const href = l => l.type === "page" ? `#/page/${l.target}`
      : l.type === "category" ? `#/category/${l.target}`
      : l.type === "screen" ? `#/${l.target}` : l.target;
    const groupHTML = groups.map(g => {
      const links = (g.links || []).filter(l => l.visible !== 0)
        .sort((a,b) => (a.position||0) - (b.position||0));
      return `<div class="footer-group"><h4>${esc(g.title)}</h4>
        <ul>${links.map(l => `<li><a href="${esc(href(l))}">${esc(l.label)}</a></li>`).join('')}</ul>
      </div>`;
    }).join('');
    const socials = (PUB.socialLinks || []).filter(s => s.visible !== 0)
      .map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.label)}">${esc((s.label||'•')[0].toUpperCase())}</a>`).join('');
    return `<footer class="site-footer"><div class="container">
      ${groupHTML ? `<div class="footer-groups">${groupHTML}</div>` : ''}
      ${socials ? `<div class="footer-social">${socials}</div>` : ''}
      <p class="small muted" style="margin-top:18px">${esc(PUB.settings.copyright || '')}</p>
    </div></footer>`;
  }

  /* =========================================================
     ROUTER
     ========================================================= */
  function parseHash(){
    const raw = location.hash.replace(/^#\/?/, "");
    const parts = raw.split("?");
    const path = parts[0] || "";
    const qs = parts[1] || "";
    const segments = path.split("/").filter(Boolean).map(s => {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    });
    return { segments, query: new URLSearchParams(qs) };
  }

  function render(){
    const route = parseHash();
    const key = route.segments.join("/") + "?" + route.query.toString();
    if (key !== lastRouteKey) { lastRouteKey = key; listLimit = 9; }
    const page = route.segments[0] || "home";
    let html;
    switch (page) {
      case "home":       html = renderHome(); break;
      case "products":   html = screenAllProducts(route); break;
      case "category":   html = screenCategory(route, route.segments[1]); break;
      case "product":    html = screenProduct(route.segments[1]); break;
      case "search":     html = screenSearch(route); break;
      case "wishlist":   html = screenWishlist(); break;
      case "cart":       html = screenCart(); break;
      case "checkout":   html = screenCheckout(); break;
      case "account":    html = screenAccount(route); break;
      case "page":       html = screenPage(route.segments[1]); break;
      default:           html = `<div class="container">${notFound('Page not found.')}</div>`;
    }
    $("#app").innerHTML = html + renderFooter();
    updateCartBadge();
    updateActiveNav(page);
    renderDrawer();
    updateLogo();
    bindScreenEvents();
    window.scrollTo(0, 0);
  }

  function updateActiveNav(page){
    const map = {
      "brand-logo": { logo:"", label:"", width:140 },
      home:"home", products:"products", category:"products", product:"products",
      search:"search", cart:"cart", checkout:"cart", account:"account"
    };
    const active = map[page] || "";
    $$(".nav-item").forEach(el => {
      el.classList.toggle("is-active", el.dataset.nav === active);
      if (el.dataset.nav === active) el.setAttribute("aria-current","page");
      else el.removeAttribute("aria-current");
    });

  async function handleNewsletter(e){
    e.preventDefault();
    const form = e.currentTarget;
    const input = form.querySelector('input[type="email"]');
    const msg = $("#newsletter-msg");
    const email = (input && input.value || "").trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if (!valid) { if (msg) { msg.className = "form-msg is-error"; msg.textContent = "Enter a valid email address."; } return; }
    const endpoint = PUB.settings.newsletterEndpoint;
    if (!endpoint) {
      if (msg) { msg.className = "form-msg is-error"; msg.textContent = "Newsletter endpoint not configured — set it in Studio → Site."; }
      return;
    }
    try {
      const r = await fetch(endpoint, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ email })
      });
      if (!r.ok) throw new Error();
      if (msg) { msg.className = "form-msg is-ok"; msg.textContent = "Subscription received."; }
      form.reset();
    } catch (err) {
      if (msg) { msg.className = "form-msg is-error"; msg.textContent = "Subscription could not be completed."; }
    }
  }

  function setStatus(el, type, message){
    if (!el) return;
    el.className = "form-msg is-" + type;

  }
  function loadPaystackScript(){
    return new Promise((resolve, reject) => {
      if (window.PaystackPop) return resolve();
      const s = document.createElement("script");
      s.src = "https://js.paystack.co/v1/inline.js";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("Unable to load Paystack library."));
      document.head.appendChild(s);
    });
  }
  async function startPayment(form){
    const status = $("#pay-status");
    const cfg = paystackConfig();
    const items = validCartItems();
    if (!items.length) { setStatus(status, "error", "Your cart has no valid items."); return; }
    if (!form.reportValidity()) return;
    if (!cfg.publicKey || !cfg.initEndpoint) {
      setStatus(status, "error", "Payment is not configured. Set Paystack in Studio → Site.");
      return;
    }
    const customer = {
      name: form.querySelector("#co-name").value.trim(),
      email: form.querySelector("#co-email").value.trim(),
      phone: form.querySelector("#co-phone").value.trim(),
      address: form.querySelector("#co-address").value.trim(),
      city: form.querySelector("#co-city").value.trim(),
      region: form.querySelector("#co-region").value.trim(),
      postalCode: form.querySelector("#co-postal").value.trim()
    };
    setStatus(status, "info", "Preparing payment…");
    try {
      const r = await fetch(cfg.initEndpoint, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          items: items.map(it => ({ productId: it.product.id, qty: it.qty })),
          customer
        })
      });
      if (!r.ok) throw new Error("Could not initialise the order.");
      const order = await r.json(); // { reference, email, amount }
      await loadPaystackScript();
      const handler = window.PaystackPop.setup({
        key: cfg.publicKey,
        email: order.email,
        amount: order.amount,
        currency: cfg.currency || "NGN",
        ref: order.reference,
        callback: tx => verifyPayment(tx.reference, cfg),
        onClose: () => setStatus($("#pay-status"), "info", "Payment window closed.")
      });
      handler.openIframe();
    } catch (err) {
      setStatus(status, "error", err.message || "Payment could not be started.");
    }
  }
  async function verifyPayment(reference, cfg){
    try {
      const r = await fetch(cfg.verifyEndpoint + "?reference=" + encodeURIComponent(reference));
      if (!r.ok) throw new Error("Verification request failed.");
      const result = await r.json();
      if (result.status === "success" || result.paid === true) {
        cart = []; saveCart();
        render(); updateCartBadge();
        toast("Payment verified. Order confirmed.");
      } else {
        setStatus($("#pay-status"), "error", "Payment could not be verified.");
      }
    } catch (err) {
      setStatus($("#pay-status"), "error", "Verification failed. Do not fulfil until verified.");
    }
  }

  function uploadImage(file, options){
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1400, r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(options && options.preserveTransparency
          ? c.toDataURL("image/png")
          : c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = () => reject(new Error("Couldn't read that image."));
      img.src = url;
    });
  }

      const s = secs.find(x => x.id === this.selectedSection);
      this._fb = {};
      insp.innerHTML = s ? this.sectionInspector(s) : `<p class="empty">No section selected.</p>`;
      Object.entries(this._fb).forEach(([id, { f, onChange }]) => {
        const el = document.getElementById(id);
        if (!el) return;
        const h = () => {
          let v;
          if (el.type === "checkbox") v = el.checked ? 1 : 0;
          else if (f.t === "number" || f.t === "range") v = el.value === "" ? "" : Number(el.value);
          else if (f.t === "json") { try { v = JSON.parse(el.value); } catch (e) { return; } }
          else v = el.value;
          const out = el.parentElement.querySelector(`[data-out="${id}"]`);
          if (out) out.textContent = v;
          onChange(v);
          this.renderPreview();
        };
        el.addEventListener("input", h);
        el.addEventListener("change", h);
        const up = insp.querySelector(`[data-upfor="${id}"]`);
        if (up) up.addEventListener("change", async ev => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          try { onChange(await uploadImage(file)); this.render(); }
          catch (err) { alert(err.message); }
        });
      });
    },

    sectionInspector(s){
      const schema = SCHEMA[s.type] || [];
      const defaults = defaultProps(s.type);
      const fields = schema.map(f =>
        this.field(f, s.props[f.k] ?? defaults[f.k], v => {
          s.props[f.k] = v;
          dirty = true;
          this.autosave();
        })
      ).join('');
      return `<h3 style="margin-top:0">${esc(typeLabel(s.type))}</h3>
        <p class="mini">position ${s.position} · ${s.id.slice(-5)}</p>
        <details class="st__group" open><summary>Content &amp; layout</summary>
          <div>${fields || "<p class='mini'>No fields.</p>"}</div>
        </details>`;
    },

    field(f, value, onChange){
      const id = "f_" + Math.random().toString(36).slice(2, 9);
      (this._fb = this._fb || {})[id] = { f, onChange };
      if (f.t === "bool") {
        return `<div class="fld fld--row"><input type="checkbox" id="${id}" ${value ? "checked" : ""}>
          <label for="${id}">${esc(f.l)}</label></div>`;
      }
      if (f.t === "select") {
        return `<div class="fld"><label for="${id}">${esc(f.l)}</label>
          <select id="${id}">${f.o.map(o =>
            `<option value="${esc(o)}" ${String(value) === String(o) ? "selected" : ""}>${esc(o)}</option>`).join('')}</select></div>`;
      }
      if (f.t === "color") {
        return `<div class="fld"><label for="${id}">${esc(f.l)}</label>
          <input type="color" id="${id}" value="${esc(hex6(value, "#2f9fdd"))}"></div>`;
      }
      if (f.t === "textarea") {
        return `<div class="fld"><label for="${id}">${esc(f.l)}</label>
          <textarea id="${id}">${esc(value || "")}</textarea></div>`;
      }
      if (f.t === "json") {
        return `<div class="fld"><label for="${id}">${esc(f.l)}</label>
          <textarea id="${id}" style="min-height:200px;font-family:monospace;font-size:.8rem">${esc(JSON.stringify(value || [], null, 2))}</textarea>
          <p class="mini">Edit the raw JSON array.</p></div>`;
      }
      if (f.t === "range") {
        return `<div class="fld"><label for="${id}">${esc(f.l)} <span class="fld__out" data-out="${id}">${esc(value ?? f.min)}</span></label>
          <input type="range" id="${id}" min="${f.min}" max="${f.max}" step="${f.step || 1}" value="${esc(value ?? f.min)}"></div>`;
      }
      if (f.t === "number") {
        return `<div class="fld"><label for="${id}">${esc(f.l)}</label>
          <input type="number" id="${id}" step="${f.step || 1}"
            ${f.min == null ? "" : `min="${f.min}"`} ${f.max == null ? "" : `max="${f.max}"`}
            value="${esc(value ?? "")}"></div>`;
      }
      const up = f.t === "url" && (f.k === "media" || f.k === "poster" || f.k === "logo");
      return `<div class="fld"><label for="${id}">${esc(f.l)}</label>
        ${up && value && value.startsWith("data:") ? `<img src="${esc(value)}" alt="" style="width:100%;max-height:140px;object-fit:cover;margin-bottom:6px">` : ""}
        ${up ? `<input type="file" accept="image/*" data-upfor="${id}" style="margin-bottom:6px">` : ""}
        <input type="${f.t === "url" ? "url" : "text"}" id="${id}"
          value="${esc(value && String(value).startsWith && String(value).startsWith("data:") ? "" : (value ?? ""))}"
          ${up ? 'placeholder="…or paste an image URL"' : ""}></div>`;
    },

    addSection(){
      const home = DRAFT.pages.find(p => p.type === "home");
      if (!home) { alert("Create a home page before adding a section."); return; }
      const type = SECTION_TYPES.find(([value]) => value === this.sectionPickerType);
      if (!type) return;
      const sec = { id: uid("s"), pageId: home.id, type: type[0],
        position: DRAFT.sections.length, visible: 1, props: defaultProps(type[0]) };
      DRAFT.sections.push(sec);
      this.selectedSection = sec.id;
      dirty = true;
      this.render();
      this.autosave();
    },

    openSectionPicker(){
      const groups = [
        { title:"Brand", types:["brand-logo"] },
        { title:"Hero sections", types:["hero-text-image","hero-image"] },
        { title:"Banners & announcements", types:["announce","ticker"] },
        { title:"Product sections", types:["products-grid","product-grid","category-sections"] },
        { title:"Category sections", types:["categories-rail","category-circles"] },
        { title:"Content sections", types:["rich-text","newsletter-a","faq-accordion","testimonials"] }
      ];
      const descriptions = {
        "brand-logo":"Add a clean logo or wordmark block.",
        "hero-text-image":"Large headline with optional image and button.",
        "hero-image":"Full-width image banner.",
        "announce":"A compact announcement strip.",
        "ticker":"A moving text banner.",
        "products-grid":"Responsive product cards from your catalog.",
        "product-grid":"A flexible product grid with sorting options.",
        "category-sections":"Product groups organized by category.",
        "categories-rail":"A horizontal category carousel.",
        "category-circles":"Circular category links.",

        "newsletter-a":"Email signup form.",

        if (type.includes("product") || type === "category-sections") return `<div style="height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:5px">${[0,1,2].map(() => `<i style="background:var(--surface-bg);border:1px solid var(--border);border-radius:6px;position:relative"><b style="position:absolute;inset:5px 4px 14px;background:var(--accent-wash);border-radius:4px"></b><b style="position:absolute;left:4px;right:8px;bottom:5px;height:3px;background:var(--ink);opacity:.5"></b></i>`).join("")}</div>`;
        if (type.includes("categor")) return `<div style="height:100%;display:flex;align-items:center;gap:12px">${[0,1,2,3].map((_,i) => `<i style="width:30px;height:30px;border-radius:50%;background:${i%2 ? "var(--accent-wash)" : "var(--surface-bg)"};border:1px solid var(--border)"></i>`).join("")}</div>`;
        if (type === "announce" || type === "ticker") return `<div style="height:100%;display:grid;place-items:center;background:var(--wine);color:#fff;border-radius:5px;font-size:.68rem;font-weight:700">${type === "ticker" ? "NEW  ·  ARRIVALS  ·  SHOP" : "A short store announcement"}</div>`;
        if (type === "brand-logo") return `<div style="height:100%;display:grid;place-items:center;font-size:1.25rem;font-weight:800;letter-spacing:.06em;color:var(--wine)">YOUR BRAND</div>`;
        return `<div style="height:100%;display:grid;align-content:center;gap:6px"><i style="width:60%;height:7px;background:var(--ink);opacity:.65"></i><i style="height:4px;background:var(--muted);opacity:.3"></i><i style="height:4px;background:var(--muted);opacity:.3"></i><i style="height:4px;width:70%;background:var(--muted);opacity:.3"></i></div>`;
      };
      let picker = document.getElementById("stSectionPicker");
      if (!picker) {
        picker = document.createElement("div");
        picker.id = "stSectionPicker";
        picker.className = "st__section-picker";
        picker.hidden = true;
        picker.setAttribute("role", "presentation");
        document.getElementById("studio").appendChild(picker);
      }
      picker.innerHTML = `<div class="st__picker-card" role="dialog" aria-modal="true" aria-labelledby="stPickerTitle">
        <div class="st__picker-head"><div><h2 class="st__picker-title" id="stPickerTitle">Add a section</h2>
          <p class="mini" style="margin:5px 0 0">Choose a section family, then pick its layout variant. All text, images, and products remain editable.</p></div>
          <button type="button" class="btn btn--sm btn--ghost" data-picker-close aria-label="Close section picker">Close</button></div>
        ${groups.map(group => `<section class="st__section-group"><h3>${esc(group.title)}</h3><div class="st__variant-grid">
          ${group.types.map(type => {
            const item = SECTION_TYPES.find(([value]) => value === type);
            return item ? `<button type="button" class="st__variant" data-add-section="${esc(type)}">
              <span class="st__variant-art">${art(type)}</span><span class="st__variant-name">${esc(item[1])}</span>
              <span class="st__variant-description">${esc(descriptions[type])}</span>
            </button>` : "";
          }).join("")}</div></section>`).join("")}</div>`;
      picker.hidden = false;
      picker.onclick = event => {
        if (event.target === picker || event.target.closest("[data-picker-close]")) {
          picker.hidden = true;
          return;
        }
        const option = event.target.closest("[data-add-section]");
        if (!option) return;
        this.sectionPickerType = option.dataset.addSection;
        picker.hidden = true;
        this.addSection();
      };
      picker.querySelector("[data-add-section]")?.focus();
    },

    sectionAction(act, id){
      const home = DRAFT.pages.find(p => p.type === "home");
      const list = DRAFT.sections.filter(s => s.pageId === home.id)
        .sort((a,b) => (a.position||0) - (b.position||0));
      const s = DRAFT.sections.find(x => x.id === id);
      if (!s) return;
      if (act === "up" || act === "down") {
        const i = list.indexOf(s), j = act === "up" ? i - 1 : i + 1;
        if (j < 0 || j >= list.length) return;
        [list[i], list[j]] = [list[j], list[i]];
        list.forEach((x,n) => x.position = n);
      } else if (act === "vis") s.visible = s.visible ? 0 : 1;
      else if (act === "dup") {
        const c = clone(s); c.id = uid("s"); c.position = DRAFT.sections.length;
        DRAFT.sections.push(c); this.selectedSection = c.id;
      } else if (act === "del") {
        if (!confirm("Delete this section?")) return;
        DRAFT.sections = DRAFT.sections.filter(x => x.id !== id);
      }
      DRAFT.sections.sort((a,b) => (a.position||0) - (b.position||0)).forEach((x,n) => x.position = n);
      dirty = true;
      this.render();
      this.autosave();
    },

    renderLibrary(list, insp){
      const lib = DRAFT.library || {};
      const themes = lib.extractedThemes || [];
      const featureNames = lib.featureNames || [];
      const nativeTypes = Object.fromEntries(lib.sectionTypeByFeature || []);
      const features = [];
      (lib.featureMatrix || []).forEach((row, themeIndex) => {
        const theme = themes[themeIndex];
        if (!theme) return;
        for (let featureIndex = 0; featureIndex < row.length; featureIndex++) {
          const evidence = row[featureIndex];
          const name = featureNames[featureIndex];
          if (!name || evidence === "0") continue;
          features.push({
            name,
            themeFile: theme.file,
            themeTitle: theme.title,
            status: evidence === "1" ? "present" : "text-evidence",
            nativeType: nativeTypes[featureIndex] || "rich-text"
          });
        }
      });
      const sections = features.filter(item => nativeTypes[featureNames.indexOf(item.name)])
        .map(item => ({
          ...item,
          category: item.name,
          sourceTheme: item.themeFile,
          evidence: item.status,
          headings: (themes.find(theme => theme.file === item.themeFile) || {}).headings || []
        }));
      const elements = themes.flatMap(theme => [
        ...(theme.classNames || []).map(name => ({ name, themeFile: theme.file, themeTitle: theme.title, kind: "class" })),
        ...(theme.ids || []).map(name => ({ name, themeFile: theme.file, themeTitle: theme.title, kind: "id" }))
      ]);
      const colors = (lib.colorCatalog || []).map(([hex, count]) => ({ hex, count }));
      const catalogs = { sections, components: features, elements, themes, colors };
      const labels = { sections:"Sections", components:"Components", elements:"Elements", themes:"Themes", colors:"Colors" };
      if (!catalogs[this.libraryCategory]) this.libraryCategory = "sections";
      const category = this.libraryCategory;
      const items = catalogs[category];
      const PAGE = 60;
      let limit = PAGE;
      let matches = [];
      const self = this;
      const textOf = item => [
        item.name, item.title, item.file, item.themeTitle, item.themeFile, item.category,
        item.kind, item.hex, item.nativeType, item.description,
        ...(item.headings || []), ...(item.classNames || []), ...(item.ids || [])
      ].join(" ").toLowerCase();
      const rowLabel = item => category === "colors" ? item.hex
        : category === "themes" ? item.title : item.name || item.title || item.file || "Untitled";
      const rowMeta = item => category === "sections" ? `${item.category} · ${item.themeTitle || ""}`
        : category === "components" ? `${item.status} · ${item.themeTitle || ""}`
        : category === "elements" ? `${item.kind} · ${item.themeTitle || ""}`
        : category === "themes" ? `${item.category || "theme"} · ${(item.classNames || []).length} classes`
        : `${item.count || 0} occurrences`;

      list.innerHTML = `<div class="st__toolbar lib-bar">
        <div class="lib-kinds" role="group" aria-label="Library categories">
          ${Object.entries(labels).map(([key,label]) => `<button class="btn btn--sm ${key===category?"":"btn--ghost"}" type="button" data-library-kind="${key}" aria-pressed="${key===category}">${label} <span class="lib-n">${catalogs[key].length.toLocaleString()}</span></button>`).join('')}
        </div>
        <input id="studioLibrarySearch" type="search" placeholder="Search ${esc(labels[category].toLowerCase())}…" value="${esc(this.libraryQuery||"")}">
        <p class="mini lib-count" data-library-count></p>
      </div><div data-library-list></div>`;
      const box = list.querySelector("[data-library-list]");
      const count = list.querySelector("[data-library-count]");
      const search = list.querySelector("#studioLibrarySearch");

      const filter = () => {
        const q = (self.libraryQuery || "").trim().toLowerCase();
        matches = q ? items.filter(item => textOf(item).includes(q)) : items;
        if (!(self.librarySelection >= 0 && self.librarySelection < matches.length)) self.librarySelection = 0;
      };
      const drawRows = () => {
        const shown = matches.slice(0, limit);
        box.innerHTML = shown.length ? shown.map((item, i) => `<button type="button" class="sitem lib-row" data-library-index="${i}" aria-current="${i === self.librarySelection}">
            ${category === "colors" ? `<span aria-hidden="true" style="width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:${esc(item.hex)};border:1px solid var(--border)"></span>` : ""}
            <span class="lib-row__txt"><span class="sitem__name" style="display:block">${esc(rowLabel(item))}</span>
            <span class="sitem__type" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rowMeta(item))}</span></span>
          </button>`).join("") + (matches.length > shown.length
            ? `<button type="button" class="btn btn--sm btn--ghost btn--block" data-library-more>Load more (${(matches.length - shown.length).toLocaleString()} remaining)</button>` : "")
          : `<p class="empty">No results found.</p>`;
        count.textContent = `${matches.length.toLocaleString()} results · extracted from ${(lib.extractionSummary || {}).themesScanned || 0} HTML files`;
      };
      const drawDetail = () => {
        const selected = matches[self.librarySelection] || null;
        if (!selected) { insp.innerHTML = `<h3>${esc(labels[category])}</h3><p class="empty">No results found.</p>`; return; }
        const title = rowLabel(selected);
        const source = selected.themeTitle || selected.themeFile || selected.sourceTheme || "Extracted HTML theme";
        let facts = "", action = "";
        if (category === "themes") {
          const swatches = (selected.colors || []).slice(0, 12).map(color => `<span title="${esc(color)}" style="display:inline-block;width:24px;height:24px;border-radius:50%;background:${esc(color)};border:1px solid var(--border);margin:3px"></span>`).join("");
          const palette = (DRAFT.palettes || []).find(item => item.sourceTheme === selected.file);
          facts = `<p>${esc(selected.description || "Extracted theme metadata")}</p><div style="margin:10px 0">${swatches}</div><p class="mini">${(selected.classNames || []).length} classes · ${(selected.ids || []).length} IDs · ${(selected.headings || []).length} headings · ${selected.formCount || 0} forms</p>`;
          if (palette) action = `<button type="button" class="btn btn--sm" data-library-apply-palette="${esc(palette.id)}">Apply theme palette</button>`;
        } else if (category === "colors") {
          facts = `<div style="display:flex;align-items:center;gap:12px"><span style="width:52px;height:52px;border-radius:14px;background:${esc(selected.hex)};border:1px solid var(--border)"></span><strong>${esc(selected.hex)}</strong></div><p class="mini">Seen ${selected.count} times across the extracted HTML source.</p>`;
          action = `<button type="button" class="btn btn--sm" data-library-apply-color="${esc(selected.hex)}">Apply as accent</button>`;
        } else if (category === "elements") {
          facts = `<p>Extracted ${esc(selected.kind)} token: <code>${esc(selected.name)}</code></p><p class="mini">Theme: ${esc(source)}</p>`;
        } else if (category === "components") {
          facts = `<p>Feature evidence: <strong>${esc(selected.status)}</strong></p><p class="mini">Native block: ${esc(selected.nativeType)} · source: ${esc(source)}</p>`;
          action = `<button type="button" class="btn btn--sm" data-library-add-section="${esc(selected.nativeType)}" data-library-title="${esc(selected.name)}">Add editable section</button>`;
        } else {
          const examples = (selected.headings || []).slice(0, 8);
          facts = `<p>${esc(selected.evidence || "Reusable native section pattern")} · ${esc(selected.category || "section")}</p><p class="mini">Source: ${esc(source)}</p>${examples.length ? `<details><summary>Extracted screen content</summary><ul>${examples.map(item => `<li>${esc(item)}</li>`).join("")}</ul></details>` : ""}`;
          action = `<button type="button" class="btn btn--sm" data-library-add-section="${esc(selected.nativeType)}" data-library-title="${esc((selected.headings || [])[0] || selected.name)}">Add editable section</button>`;
        }
        insp.innerHTML = `<h3 style="margin-top:0">${esc(labels[category])}</h3><p class="mini">${matches.length.toLocaleString()} extracted entries. Select an item for details or an available studio action.</p><h3>${esc(title)}</h3>${facts}<div class="btn-row">${action}</div>`;
      };
      filter(); drawRows(); drawDetail();

      list.onclick = e => {
        const kind = e.target.closest("[data-library-kind]");
        if (kind) {
          if (kind.dataset.libraryKind === category) return;
          self.libraryCategory = kind.dataset.libraryKind; self.librarySelection = 0;
          list.scrollTop = 0; self.renderLibrary(list, insp);
          return;
        }
        if (e.target.closest("[data-library-more]")) { limit += PAGE; drawRows(); return; }
        const row = e.target.closest("[data-library-index]");
        if (!row) return;
        self.librarySelection = Number(row.dataset.libraryIndex);
        box.querySelectorAll("[data-library-index]").forEach(r =>
          r.setAttribute("aria-current", String(r === row)));
        drawDetail();
        if (self.isNarrow()) self.setView("insp");
      };
      insp.onclick = e => {
        const add = e.target.closest("[data-library-add-section]");
        if (add) { self.addLibrarySection(add.dataset.libraryAddSection, add.dataset.libraryTitle); return; }
        const palette = e.target.closest("[data-library-apply-palette]");
        if (palette) {
          const item = (DRAFT.palettes || []).find(value => value.id === palette.dataset.libraryApplyPalette);
          if (!item) return;
          applyPaletteToTheme(DRAFT.theme, item);
          applyTheme(DRAFT.theme); dirty = true; self.autosave();
          toast("Theme palette applied");
          return;
        }
        const color = e.target.closest("[data-library-apply-color]");
        if (color) {
          const value = color.dataset.libraryApplyColor;
          if (!/^#[0-9a-f]{6}$/i.test(value)) { toast("Only 6-digit hex colours can be applied"); return; }
          DRAFT.theme.colors.wine = value;
          applyTheme(DRAFT.theme); dirty = true; self.autosave();
        }
      };
      let timer;
      search.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          self.libraryQuery = search.value; self.librarySelection = 0; limit = PAGE;
          filter(); drawRows(); drawDetail();
        }, 120);
      });
    },

    addLibrarySection(type, title){
      if (!SECTION_TYPES.some(([key]) => key === type)) {
        alert("This extracted pattern has no editable section equivalent yet.");
        return;
      }
      const page = DRAFT.pages.find(item => item.type === "home");
      if (!page) { alert("Create a home page before adding a section."); return; }
      const props = defaultProps(type);
      if (title) {
        if ("heading" in props) props.heading = title;
        if ("title" in props) props.title = title;
        if ("text" in props) props.text = title;
      }
      const section = {
        id: uid("s"),
        pageId: page.id,
        type,
        position: DRAFT.sections.filter(item => item.pageId === page.id).length,
        visible: 1,
        props
      };
      DRAFT.sections.push(section);
      this.selectedSection = section.id;
      this.tab = "sections";
      dirty = true;
      this.renderTabs();
      this.render();
      this.autosave();
      if (this.isNarrow()) this.setView("insp");
    },

    bindInspectorFields(root, onEach){
      $$("input,select,textarea", root).forEach(el => {
        const handler = () => {
          let v;
          if (el.type === "checkbox") v = el.checked;
          else if (el.type === "number" || el.type === "range") v = el.value === "" ? "" : Number(el.value);
          else v = el.value;
          const out = el.parentElement.querySelector(`[data-out="${el.id}"]`);
          if (out) out.textContent = v;
          onEach(el, v);
        };
        el.addEventListener("input", handler);
        el.addEventListener("change", handler);
      });
    }
  };

  function contrast(hex1, hex2){
    const lum = h => {
      const m = h.replace("#","");
      const v = [0,2,4].map(i => parseInt(m.substr(i,2),16)/255)
        .map(c => c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4));
      return 0.2126*v[0] + 0.7152*v[1] + 0.0722*v[2];
    };
    const a = lum(hex1 || "#000"), b = lum(hex2 || "#fff");
    return (Math.max(a,b) + 0.05) / (Math.min(a,b) + 0.05);
  }
  function downloadJSON(obj, name){
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function validateImport(d){
    if (!d || typeof d !== "object") return "Root must be an object.";
    if (!Array.isArray(d.sections)) return "Missing sections array.";
    if (!Array.isArray(d.products)) return "Missing products array.";
    if (!Array.isArray(d.categories)) return "Missing categories array.";
    if (!Array.isArray(d.pages)) return "Missing pages array.";
    if (!d.theme || !d.theme.colors) return "Missing theme.colors.";
    return null;
  }

    /* Studio theme toggle */
    (function(){
      const st = $("#studio"), b = $("#stTheme");
      const set = m => {
        const dark = m === "dark";
        st.dataset.theme = m;
        b.querySelector(".st__ico").textContent = dark ? "☀️" : "🌙";
        b.querySelector(".st__lbl").textContent = dark ? "Light" : "Dark";
        b.setAttribute("aria-pressed", String(dark));
        try { localStorage.setItem("studioTheme", m); } catch (e) {}
      };
      let m = "light";
      try { m = localStorage.getItem("studioTheme") || "light"; } catch (e) {}
      set(m);
      b.addEventListener("click", () => set(st.dataset.theme === "dark" ? "light" : "dark"));
    })();

    window.addEventListener("hashchange", () => {
      if ($("#studio").dataset.open === "true") return;
      render();
    });
  }

  async function init(){
    const stored = loadFromBrowser();
    const embedded = await loadDataFile();
    const seed = makeSeed();
    if (embedded && embedded.library) seed.library = embedded.library;
    if (Array.isArray(embedded?.products)) seed.products = embedded.products;
    if (Array.isArray(embedded?.categories)) seed.categories = embedded.categories;

    if (stored) {
      PUB = stored.published;
      DRAFT = stored.draft || clone(PUB);
      const isDrizzleMock = PUB.settings.siteName === "Drizzle."
        && (PUB.products || []).some(product => product.id === "p_drizzle_burger")
        && (PUB.categories || []).some(category => category.id === "c_mains");
      if (isDrizzleMock) {
        PUB = clone(seed);
        DRAFT = clone(seed);
        persist();
      }
      if (!PUB.library && seed.library) PUB.library = seed.library;
      if ((!Array.isArray(PUB.products) || !PUB.products.length) && seed.products.length) {
        PUB.products = clone(seed.products);
      }
      if ((!Array.isArray(PUB.categories) || !PUB.categories.length) && seed.categories.length) {
        PUB.categories = clone(seed.categories);
      }
      if ((!Array.isArray(DRAFT.products) || !DRAFT.products.length) && seed.products.length) {
        DRAFT.products = clone(seed.products);
      }
      if ((!Array.isArray(DRAFT.categories) || !DRAFT.categories.length) && seed.categories.length) {
        DRAFT.categories = clone(seed.categories);
      }
      if (!PUB.palettes || !PUB.palettes.length) PUB.palettes = seed.palettes;
      if (!DRAFT.palettes || !DRAFT.palettes.length) DRAFT.palettes = seed.palettes;
      if (!DRAFT.library && seed.library) DRAFT.library = seed.library;
    } else {
      PUB = clone(seed);
      DRAFT = clone(seed);
      persist();
    }
    /* Backfill currency / paystack for existing PUB */
    if (!PUB.settings.currency) PUB.settings.currency = { code:"NGN", locale:"en-NG", symbol:"₦" };
    if (!PUB.settings.paystack) PUB.settings.paystack = { publicKey:"", initEndpoint:"", verifyEndpoint:"", currency:"NGN" };
    persist();

    loadCart();
    loadWish();
    applyTheme(PUB.theme);
    bindChrome();

    if (!location.hash) location.hash = "#/home";
    render();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
