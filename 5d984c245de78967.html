<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f9fdd">
<title>Shop</title>
<style>
/* =========================================================
   1 · TOKENS (FILE A palette + Studio canonical aliases)
   ========================================================= */
:root{
  --wine:#2f9fdd;
  --wine-deep:#1c7db2;
  --sand:#e8f5fc;
  --sand-pale:#f5fbff;
  --white:#ffffff;
  --text:#22262b;
  --muted:#6b7480;

  --sky:var(--wine);
  --sky-dark:var(--wine-deep);
  --sky-light:var(--sand);
  --sky-lighter:var(--sand-pale);
  --ink:var(--text);

  --border:#e6eaef;
  --border-strong:#d4dae1;
  --ph:#eef2f6;
  --ph-2:#e2e8ee;

  --header-h:56px;
  --nav-h:58px;
  --maxw:1180px;
  --pad:clamp(14px,4vw,28px);

  --radius:10px;
  --radius-sm:8px;

  --font-head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

/* =========================================================
   2 · BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;font-family:var(--font-body);font-size:15px;line-height:1.5;
  color:var(--ink);background:var(--page-bg,var(--white));-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 24px);
}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;}
ul,ol{list-style:none;padding:0;}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:4px;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.slot-text{font-size:13.5px;color:var(--muted);margin-top:4px;}
.slot-note{font-size:12.5px;color:var(--muted);margin-top:10px;}

.container,
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);}

/* =========================================================
   3 · HEADER
   ========================================================= */
.site-header{position:sticky;top:0;z-index:40;background:var(--header-bg,rgba(255,255,255,.97));
  border-bottom:1px solid var(--border);}
.header-inner{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad);
  height:var(--header-h);display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:8px;}
.header-actions{display:flex;justify-content:flex-end;gap:0;margin-right:-6px;}

.icon-btn{position:relative;width:40px;height:40px;display:inline-flex;
  align-items:center;justify-content:center;background:none;border:0;
  border-radius:var(--radius-sm);color:var(--ink);cursor:pointer;
  transition:background .15s ease,color .15s ease;}
.icon-btn:hover{background:var(--sky-light);color:var(--sky-dark);}
.icon-btn svg{width:21px;height:21px;}

.logo-slot{width:min(164px,30vw);height:46px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;text-align:center;}
.logo-slot img{display:block;width:auto;height:auto;max-width:100%;max-height:40px;object-fit:contain;}
.logo-slot__wordmark{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--font-head);font-weight:700;font-size:1rem;letter-spacing:.015em;color:var(--ink);}
@media (max-width:420px){.logo-slot{width:min(132px,29vw);height:42px}.logo-slot img{max-height:36px}}

.badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--sky);color:#fff;font-size:10px;font-weight:700;
  line-height:16px;text-align:center;}

/* =========================================================
   4 · DRAWER
   ========================================================= */
.drawer-backdrop{position:fixed;inset:0;z-index:60;background:rgba(20,28,36,.38);
  opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease;}
.drawer-backdrop.is-open{opacity:1;visibility:visible;}
.drawer{position:fixed;top:0;left:0;bottom:0;z-index:61;width:min(320px,86vw);
  background:var(--white);border-right:1px solid var(--border);display:flex;
  flex-direction:column;transform:translateX(-100%);transition:transform .26s ease;
  padding-bottom:env(safe-area-inset-bottom);}
.drawer.is-open{transform:none;}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border);}
.drawer-title{font-size:15px;font-weight:650;}
.drawer-body{padding:12px 10px;overflow-y:auto;flex:1 1 auto;display:flex;
  flex-direction:column;gap:2px;}
.drawer-link{display:block;padding:10px 12px;border-radius:var(--radius-sm);
  font-size:14px;color:var(--ink);}
.drawer-link:hover{background:var(--sky-lighter);color:var(--sky-dark);}
.drawer-sub{display:flex;flex-direction:column;padding:2px 0 6px 12px;}
.drawer-sub a{display:block;padding:7px 12px;border-radius:var(--radius-sm);
  font-size:13px;color:var(--muted);}
.drawer-sub a:hover{background:var(--sky-lighter);color:var(--sky-dark);}
.drawer-empty{padding:16px 12px;font-size:13px;color:var(--muted);}

/* =========================================================
   5 · BOTTOM NAV
   ========================================================= */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav-bg,var(--white));
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-height:var(--nav-h);font-size:11px;color:var(--muted);
  transition:color .15s ease;}
.nav-item svg{width:21px;height:21px;}
.nav-item:hover{color:var(--sky-dark);}
.nav-item.is-active{color:var(--sky);}
.nav-item.is-active svg{stroke-width:2;}

/* =========================================================
   6 · GENERIC UI
   ========================================================= */
.page-head{padding:20px 0 10px;}
.page-title{font-size:22px;font-weight:650;letter-spacing:-.02em;}
.page-sub{font-size:13.5px;color:var(--muted);margin-top:4px;}

.section,.sec{padding:22px 0;}
.sec--tight{padding:0;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin-bottom:14px;}
.section-title{font-size:17px;font-weight:650;letter-spacing:-.01em;}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;
  gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.see-all{font-size:13px;color:var(--sky-dark);}
.see-all:hover{text-decoration:underline;}
.see-all.is-disabled{color:var(--muted);opacity:.65;cursor:default;text-decoration:none;}
.section-foot{display:flex;justify-content:center;padding-top:18px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 20px;border-radius:var(--radius-sm);border:1px solid var(--sky);
  background:var(--sky);color:#fff;font-size:14px;font-weight:600;cursor:pointer;
  text-decoration:none;transition:background .15s ease,border-color .15s ease,color .15s ease;}
.btn:hover{background:var(--sky-dark);border-color:var(--sky-dark);}
.btn--outline{background:#fff;color:var(--ink);border-color:var(--border-strong);}
.btn--outline:hover{background:var(--sky-light);border-color:var(--sky);color:var(--sky-dark);}
.btn--ghost{background:transparent;color:var(--ink);border-color:var(--border-strong);}
.btn--ghost:hover{background:var(--sky-light);border-color:var(--sky);color:var(--sky-dark);}
.btn--light{background:#fff;color:var(--sky-dark);border-color:transparent;}
.btn--light:hover{background:var(--sky-light);}
.btn--block{width:100%;}
.btn--sm{height:36px;padding:0 14px;font-size:13px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn:disabled:hover{background:var(--sky);border-color:var(--sky);}

.link-btn{background:none;border:0;padding:0;font-size:12.5px;color:var(--sky-dark);
  cursor:pointer;align-self:flex-start;}
.link-btn:hover{text-decoration:underline;}

.empty-state{padding:44px 20px;text-align:center;border:1px dashed var(--border-strong);
  border-radius:12px;background:var(--sky-lighter);color:var(--muted);}
.empty-state h3{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.empty-state p{font-size:13.5px;max-width:420px;margin:0 auto;}
.empty{padding:48px 20px;text-align:center;color:var(--muted);
  border:1px dashed var(--border-strong);border-radius:12px;}

.ph-line{display:block;height:9px;border-radius:5px;background:var(--ph-2);}
.ph-line--sm{height:7px;}
.ph-line--xs{height:7px;}

.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sky-dark);font-weight:700;margin-bottom:.6em;}
.lead{color:var(--muted);max-width:60ch;}

/* =========================================================
   7 · CATEGORY RAIL
   ========================================================= */
.cat-rail{display:grid;grid-auto-flow:column;
  grid-auto-columns:calc((100% - 4 * 16px) / 5);gap:16px;overflow-x:auto;
  padding:4px 0 8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:8px;
  min-width:0;scroll-snap-align:start;}
.cat-circle{width:min(100%,124px);aspect-ratio:1;border-radius:50%;
  background:var(--ph);border:1px solid var(--border);overflow:hidden;flex:0 0 auto;}
.cat-circle img{width:100%;height:100%;object-fit:cover;}
.cat-name{font-size:12.5px;text-align:center;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
@media (max-width:700px){
  .cat-rail{grid-auto-columns:calc((100% - 3 * 12px) / 3.6);gap:12px;}
}

/* =========================================================
   8 · PRODUCT GRID / CARD
   ========================================================= */
.product-grid{--product-grid-columns:3;--product-grid-columns-mobile:2;
  display:grid;grid-template-columns:repeat(var(--product-grid-columns),minmax(0,1fr));gap:20px 14px;}
.product-grid--duo{--product-grid-columns:2;}
@media (max-width:720px){
  .product-grid{grid-template-columns:repeat(var(--product-grid-columns-mobile),minmax(0,1fr));gap:16px 10px;}
}
.product-card{position:relative;display:flex;flex-direction:column;min-width:0;}
.product-media{display:block;aspect-ratio:1 / 1.05;border-radius:var(--radius-sm);
  background:var(--ph);border:1px solid var(--border);overflow:hidden;}
.product-media img{width:100%;height:100%;object-fit:cover;}
.product-info{min-width:0;padding:8px 2px 0;display:flex;flex-direction:column;gap:3px;}
.product-name{min-width:0;font-size:13.5px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere;}
.product-name:hover{color:var(--sky-dark);}
.product-price{min-width:0;font-size:13.5px;font-weight:650;overflow-wrap:anywhere;}
.product-card.is-placeholder .product-info{gap:7px;padding-top:10px;}
.wish-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.94);border:1px solid var(--border);display:flex;
  align-items:center;justify-content:center;color:var(--muted);cursor:pointer;
  transition:color .15s ease,background .15s ease;}
.wish-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;}
.wish-btn:hover{color:var(--sky-dark);background:#fff;}
.wish-btn.is-active{color:var(--sky);}
.wish-btn.is-active svg{fill:currentColor;}

/* =========================================================
   9 · NEWSLETTER
   ========================================================= */
.newsletter{margin:28px 0 10px;padding:22px;background:var(--sky-lighter);
  border:1px solid var(--border);border-radius:12px;}
.newsletter-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;}
@media (max-width:720px){.newsletter-grid{grid-template-columns:1fr;}}
.newsletter-form{display:flex;gap:8px;}
.newsletter-form input{flex:1 1 auto;min-width:0;}
input.input,select.input,textarea.input{width:100%;height:44px;padding:0 12px;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:#fff;
  color:var(--ink);font:inherit;font-size:14px;}
textarea.input{height:auto;min-height:96px;padding:10px 12px;resize:vertical;}
input.input:focus,select.input:focus,textarea.input:focus{outline:none;
  border-color:var(--sky);box-shadow:0 0 0 3px rgba(47,159,221,.15);}
input.input:disabled,select.input:disabled{background:#f7f9fb;color:var(--muted);cursor:not-allowed;}
.form-msg{font-size:13px;margin-top:10px;min-height:1px;}
.form-msg.is-error{color:#c0392b;}
.form-msg.is-info{color:var(--sky-dark);}
.form-msg.is-ok{color:#1e7d4f;}

/* =========================================================
   10 · TOOLBAR / FILTERS
   ========================================================= */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0;
  border-bottom:1px solid var(--border);margin-bottom:18px;}
.toolbar .field--inline{width:auto;}
.toolbar select.input{width:auto;min-width:170px;}
.toolbar .count{margin-left:auto;font-size:13px;color:var(--muted);}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field label{font-size:12.5px;font-weight:500;color:var(--muted);}
.field--full{grid-column:1 / -1;}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
@media (max-width:620px){.form-grid{grid-template-columns:1fr;}}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

/* =========================================================
   11 · BREADCRUMBS / CHIPS
   ========================================================= */
.breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:14px;
  font-size:12.5px;color:var(--muted);}
.breadcrumbs a:hover{color:var(--sky-dark);}
.breadcrumbs .sep{opacity:.55;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px;}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;
  border-radius:999px;border:1px solid var(--border-strong);background:#fff;font-size:13px;}
.chip:hover{border-color:var(--sky);color:var(--sky-dark);background:var(--sky-lighter);}
.chip.is-active{background:var(--sky);border-color:var(--sky);color:#fff;}

/* =========================================================
   12 · CART
   ========================================================= */
.cart-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr);
  gap:24px;align-items:start;}
@media (max-width:860px){.cart-layout{grid-template-columns:1fr;}}
.cart-list{border-top:1px solid var(--border);}
.cart-item{display:grid;grid-template-columns:76px minmax(0,1fr) auto;
  gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);}
.cart-thumb{width:76px;aspect-ratio:1;border-radius:var(--radius-sm);
  background:var(--ph);border:1px solid var(--border);overflow:hidden;}
.cart-thumb img{width:100%;height:100%;object-fit:cover;}
.cart-main{display:flex;flex-direction:column;gap:5px;min-width:0;}
.cart-end{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.line-total{font-size:13.5px;font-weight:650;}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border-strong);
  border-radius:6px;overflow:hidden;margin-top:2px;width:max-content;}
.qty button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  background:#fff;border:0;cursor:pointer;font-size:16px;line-height:1;color:var(--ink);}
.qty button:hover{background:var(--sky-light);color:var(--sky-dark);}
.qty span{min-width:34px;text-align:center;font-size:13.5px;border-left:1px solid var(--border);
  border-right:1px solid var(--border);line-height:32px;}
.summary{border:1px solid var(--border);border-radius:12px;padding:18px;background:#fff;}
.summary-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;
  color:var(--muted);padding:6px 0;}
.summary-row span:last-child{color:var(--ink);}
.summary-total{display:flex;justify-content:space-between;gap:12px;font-size:16px;
  font-weight:700;border-top:1px solid var(--border);margin-top:10px;padding-top:14px;}
.summary .btn{margin-top:16px;}

/* =========================================================
   13 · CHECKOUT
   ========================================================= */
.checkout-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.85fr);
  gap:24px;align-items:start;}
@media (max-width:860px){.checkout-grid{grid-template-columns:1fr;}}
.card-panel{border:1px solid var(--border);border-radius:12px;padding:18px;background:#fff;}
.card-panel + .card-panel{margin-top:16px;}
.panel-title{font-size:15px;font-weight:650;margin-bottom:6px;}
.panel-note{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.summary-line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;
  padding:5px 0;color:var(--muted);}
.summary-line span:last-child{color:var(--ink);}

/* =========================================================
   14 · ACCOUNT
   ========================================================= */
.account-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding-bottom:24px;}
@media (max-width:780px){.account-layout{grid-template-columns:1fr;gap:14px;}}
.account-nav{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--border);padding-right:12px;}
.account-nav a{padding:9px 10px;border-radius:var(--radius-sm);font-size:14px;color:var(--muted);}
.account-nav a:hover{background:var(--sky-lighter);color:var(--ink);}
.account-nav a.is-active{background:var(--sky-light);color:var(--sky-dark);font-weight:600;}
@media (max-width:780px){
  .account-nav{flex-direction:row;overflow-x:auto;border-right:0;
    border-bottom:1px solid var(--border);padding:0 0 8px;}
  .account-nav a{white-space:nowrap;}
}

/* =========================================================
   15 · FOOTER
   ========================================================= */
.site-footer{background:var(--footer-bg,transparent);border-top:1px solid var(--border);margin-top:36px;padding:22px 0 26px;}
.footer-links{display:flex;flex-wrap:wrap;gap:8px 22px;}
.footer-links a{font-size:13.5px;color:var(--muted);}
.footer-links a:hover{color:var(--sky-dark);}
.footer-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:20px;}
.footer-group h4{font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin-bottom:10px;}
.footer-group ul{display:flex;flex-direction:column;gap:6px;}
.footer-social{display:flex;gap:8px;margin-top:18px;}
.footer-social a{width:36px;height:36px;border-radius:999px;border:1px solid var(--border);
  display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);}
.footer-social a:hover{border-color:var(--sky);color:var(--sky-dark);}

/* =========================================================
   16 · TOAST
   ========================================================= */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  transform:translate(-50%,10px);background:var(--ink);color:#fff;font-size:13px;
  padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;z-index:70;
  max-width:calc(100vw - 32px);text-align:center;}
.toast.is-visible{opacity:1;transform:translate(-50%,0);}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
}

/* =========================================================
   17 · OPTIONAL SECTION STYLES (used by Studio additions)
   ========================================================= */
.announce{background:var(--sky);color:#fff;padding:10px max(var(--pad),var(--safe-l));
  font-size:.82rem;display:flex;align-items:center;gap:10px;justify-content:center;
  letter-spacing:.05em;}
.announce a{color:#fff;text-decoration:underline;}
.announce button{background:none;border:0;color:#fff;cursor:pointer;font-size:1.1rem;
  padding:4px 8px;margin-left:auto;opacity:.7;}

.hero__box{position:relative;overflow:hidden;background:var(--sky-light);
  display:flex;align-items:flex-end;min-height:60svh;border-radius:12px;}
.hero__box>a{position:absolute;inset:0;display:block;z-index:2;}
.hero__box>.art{position:absolute;inset:0;}

.tai{display:grid;gap:clamp(14px,4vw,28px);}
.tai__text{padding-block:clamp(8px,2.5vw,20px) clamp(12px,3vw,22px);}
.tai__text h1{font-family:var(--font-head);font-size:clamp(1.6rem,5vw,2.6rem);
  font-weight:650;letter-spacing:-.02em;margin-bottom:.4em;}
.tai__text .lead{margin-bottom:1em;}
.tai__media{position:relative;overflow:hidden;background:var(--sky-light);
  aspect-ratio:var(--ar,4/3);border-radius:10px;}
.tai__media>img,.tai__media>.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
@media(min-width:820px){.tai--split{grid-template-columns:1fr 1fr;align-items:center}}

.vhero{position:relative;overflow:hidden;background:var(--wine-deep);color:#fff;
  aspect-ratio:var(--ar,16/10);border-radius:12px;}
.vhero video,.vhero .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.vhero__ov{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;

.colorcard{padding:clamp(26px,8vw,72px) clamp(20px,6vw,60px);display:flex;

.split{display:grid;gap:0;overflow:hidden;background:#fff;border:1px solid var(--border);

.split__media{position:relative;aspect-ratio:var(--ar,4/3);background:var(--sky-light);min-height:200px;}
.split__media>img,.split__media>.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.split__body{padding:clamp(20px,5vw,44px);display:flex;flex-direction:column;

.split__body h2{font-family:var(--font-head);font-size:clamp(1.2rem,3.4vw,1.7rem);font-weight:650;}
@media(min-width:760px){
  .split--img-left,.split--img-right{grid-template-columns:1fr 1fr}
  .split--img-right .split__media{order:2}
}

.feature{position:relative;overflow:hidden;background:var(--sky-light);
  aspect-ratio:var(--ar,16/10);display:block;border-radius:12px;}
.feature>img,.feature>.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

.pgrid{display:grid;gap:18px 14px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
@media(min-width:640px){.pgrid{grid-template-columns:repeat(var(--cols-sm,3),minmax(0,1fr))}}
@media(min-width:960px){.pgrid{grid-template-columns:repeat(var(--cols-lg,4),minmax(0,1fr))}}
.pcard{background:#fff;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-sm);
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  transition:transform .18s,box-shadow .18s;}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px -18px rgba(0,0,0,.35);}
.pcard__media{position:relative;aspect-ratio:var(--par,1/1);background:var(--sky-light);overflow:hidden}
.pcard__media img,.pcard__media .art{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pcard__body{padding:10px 11px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard__name{font-family:var(--font-head);font-size:1rem;line-height:1.25;margin:0}
.pcard__cat{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pcard__price{margin-top:auto;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;

.pcard__price s{color:var(--muted);font-weight:400;font-size:.86em}
.pcard__price ins{text-decoration:none;color:var(--sky-dark)}
.pcard__swatch{position:absolute;bottom:8px;right:8px;display:flex;gap:3px;
  background:rgba(255,255,255,.9);padding:3px 6px;border-radius:999px}
.pcard__swatch span{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.pcard .badge{position:absolute;top:9px;left:9px;background:var(--sky);color:#fff;

  border-radius:999px;font-weight:700;z-index:2;min-width:auto;height:auto;line-height:1;}

.circles{display:flex;gap:clamp(14px,4vw,26px);overflow-x:auto;padding-block:6px 12px;
  scroll-snap-type:x proximity;scrollbar-width:thin}
.circle{scroll-snap-align:center;flex:0 0 auto;display:flex;flex-direction:column;
  align-items:center;gap:9px;text-decoration:none;color:inherit;background:none;
  border:0;cursor:pointer;padding:0}
.circle__disc{width:var(--cs,104px);height:var(--cs,104px);border-radius:50%;
  position:relative;overflow:hidden;border:2px solid var(--border);background:var(--sky-light);
  transition:transform .18s,border-color .18s}
.circle:hover .circle__disc{transform:scale(1.04);border-color:var(--sky)}
.circle__disc img{width:100%;height:100%;object-fit:cover}
.circle__disc .art{position:absolute;inset:0}
.circle__label{font-size:.82rem;font-weight:600;text-align:center;
  max-width:calc(var(--cs,104px) + 16px);line-height:1.25}

.ticker{overflow:hidden;background:var(--sky);color:#fff;padding-block:clamp(12px,3vw,20px);
  white-space:nowrap}
.ticker__inner{display:inline-flex;animation:tick var(--dur,26s) linear infinite;will-change:transform}
.ticker[data-dir="right"] .ticker__inner{animation-direction:reverse}
.ticker[data-static="true"] .ticker__inner{animation:none;width:100%;justify-content:center}
.ticker__inner span{font-family:var(--font-head);font-size:clamp(1rem,3.6vw,1.6rem);
  letter-spacing:var(--ls,.02em);padding-inline:.55em}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.marq{overflow:hidden;max-width:100%}
.marq__track{display:flex;gap:14px;width:max-content;animation:marq var(--dur,40s) linear infinite}
.marq[data-static="true"] .marq__track{animation:none;justify-content:center;width:100%}
.marq__item{flex:0 0 auto;width:clamp(140px,28vw,240px);aspect-ratio:1/1;
  position:relative;overflow:hidden;background:var(--sky-light);border-radius:10px}
.marq__item img,.marq__item .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.bento{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(140px,auto)}
.bento__cell{position:relative;overflow:hidden;background:#fff;border:1px solid var(--border);
  border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  text-decoration:none;color:inherit;min-height:180px}
.bento__cell--lg{grid-column:span 2;grid-row:span 2;min-height:340px}
.bento__cell--tall{grid-row:span 2}
.bento__cell--wide{grid-column:span 2}
.bento__cell .art{position:absolute;inset:0;z-index:0}
.bento__cell h3{position:relative;z-index:2;margin:0}
.bento__cell .bento__ov{position:relative;z-index:2;
  background:linear-gradient(to top,rgba(0,0,0,.5),transparent);

@media(min-width:700px){.bento{grid-template-columns:repeat(4,1fr)}}

.testis{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:720px){.testis{grid-template-columns:repeat(3,1fr)}}
.testi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;
  display:flex;flex-direction:column;gap:10px}
.testi__quote{font-size:1rem;line-height:1.5;font-family:var(--font-head);font-style:italic;margin:0}
.testi__who{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:10px;
  border-top:1px solid var(--border)}
.testi__av{width:38px;height:38px;border-radius:50%;background:var(--sky);color:#fff;
  display:grid;place-items:center;font-weight:700;font-family:var(--font-head);flex:0 0 auto}
.testi__name{font-weight:600;font-size:.9rem}
.testi__role{font-size:.78rem;color:var(--muted)}
.testi__stars{color:#D4A22E;letter-spacing:2px;font-size:.9rem}

.faq{display:grid;gap:8px;max-width:800px;margin:0 auto}
.faq__item{border:1px solid var(--border);background:#fff;border-radius:10px;overflow:hidden}
.faq__item summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center;min-height:50px;
  font-family:var(--font-head);font-size:1rem}
.faq__item summary::-webkit-details-marker{display:none}
.faq__item summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--sky);
  transition:transform .2s}
.faq__item[open] summary::after{transform:rotate(45deg)}
.faq__item p{padding:0 18px 16px;margin:0;color:var(--muted);line-height:1.6}

.stats{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);text-align:center}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat__n{font-family:var(--font-head);font-size:clamp(1.6rem,5vw,2.6rem);color:var(--sky-dark);
  line-height:1;margin:0 0 6px;font-weight:650}
.stat__l{font-size:.82rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:0}

.logos{display:flex;flex-wrap:wrap;gap:clamp(16px,5vw,48px);align-items:center;
  justify-content:center;padding-block:clamp(16px,4vw,30px);opacity:.7}
.logos__item{font-family:var(--font-head);font-size:clamp(1rem,3vw,1.4rem);
  letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:600}

.tabs__nav{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;
  scrollbar-width:none;margin-bottom:18px}
.tabs__nav::-webkit-scrollbar{display:none}
.tabs__nav button{flex:0 0 auto;background:none;border:0;padding:12px 16px;font-weight:600;
  cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);min-height:44px;font-size:.92rem}
.tabs__nav button[aria-selected="true"]{color:var(--sky-dark);border-bottom-color:var(--sky)}
.tabs__panel{padding-block:8px}

.bundle{background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:clamp(16px,4vw,28px);display:grid;gap:16px}
.bundle__items{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.bundle__item{text-align:center;text-decoration:none;color:inherit}
.bundle__item .pcard__media{aspect-ratio:1;margin-bottom:6px}
.bundle__item .pcard__media>.art{position:absolute;inset:0}
.bundle__price{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--border);padding-top:14px;flex-wrap:wrap}

.promo{min-height:100svh;display:flex;align-items:center;background:var(--sky);color:#fff;
  position:relative;overflow:hidden;padding-block:calc(var(--safe-t) + 40px) calc(var(--safe-b) + 40px)}
.promo h2{color:#fff;font-size:clamp(1.9rem,7vw,3.6rem);max-width:16ch;font-family:var(--font-head);}
.promo p{color:rgba(255,255,255,.9);max-width:44ch}
.promo__deco{position:absolute;inset:auto -12% -22% auto;width:min(78vw,620px);
  aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(255,255,255,.22)}
.promo__deco::after{content:"";position:absolute;inset:14%;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.16)}

.fsmedia{min-height:100svh;position:relative;overflow:hidden;background:var(--sky-light)}
.fsmedia img,.fsmedia .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fsmedia__ov{position:relative;z-index:2;min-height:inherit;display:flex;align-items:flex-end;
  padding:clamp(20px,6vw,60px) max(var(--pad),var(--safe-l))}

.diag{background:#fff;position:relative;overflow:hidden;padding-block:clamp(24px,6vw,54px)}
.diag__stage{position:relative;height:clamp(360px,62dvh,560px);touch-action:pan-y;
  user-select:none;-webkit-user-select:none}
.diag__slide{position:absolute;inset:0;display:grid;place-items:center;
  transition:transform .55s cubic-bezier(.22,.8,.28,1),opacity .45s;will-change:transform,opacity}
.diag__card{width:min(78%,340px);background:var(--sky-lighter);overflow:hidden;
  box-shadow:0 26px 60px -34px rgba(0,0,0,.35);border:1px solid var(--border);
  text-decoration:none;color:inherit;display:block;border-radius:10px}
.diag__media{aspect-ratio:4/5;position:relative;background:var(--sky-light)}
.diag__media img,.diag__media .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.diag__body{padding:14px 16px 18px}
.diag__deco{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.4}
.diag__deco::before{content:"";position:absolute;left:-10%;top:50%;width:130%;height:1.5px;
  background:var(--border);transform:rotate(var(--angle,-6deg))}
.diag__ctrls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:18px}
.diag__ctrls button{width:44px;height:44px;border-radius:999px;border:1px solid var(--border);
  background:#fff;cursor:pointer;display:grid;place-items:center;font-size:1.2rem}
.diag__count{font-size:.82rem;letter-spacing:.16em;color:var(--muted);
  font-variant-numeric:tabular-nums}

.talls{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.talls{grid-template-columns:1fr 1fr}}
.tall{position:relative;overflow:hidden;min-height:clamp(300px,52dvh,480px);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:clamp(18px,4.5vw,34px);text-decoration:none;color:inherit;
  background:var(--sky-light);border:1px solid var(--border);border-radius:10px}
.tall--full{grid-column:1/-1;min-height:clamp(340px,64dvh,600px)}
.tall--text{background:var(--sky);color:#fff;justify-content:center}
.tall--text h3{color:#fff;font-size:clamp(1.4rem,5vw,2.4rem);max-width:14ch;font-family:var(--font-head);}
.tall__art{position:absolute;inset:0;z-index:0}
.tall__art img,.tall__art .art{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tall__ov{position:relative;z-index:2}
.tall__ov h3{max-width:16ch;font-family:var(--font-head);font-size:clamp(1.2rem,3vw,1.7rem);font-weight:650;}
.tall__ov p{max-width:40ch}

.cta-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
  padding-block:clamp(20px,5vw,40px)}
.pill{display:inline-flex;align-items:center;gap:.55em;min-height:48px;padding:.75em 1.6em;
  border-radius:999px;background:var(--sky);color:#fff;text-decoration:none;font-weight:650;
  box-shadow:0 8px 24px -14px rgba(0,0,0,.35)}
.pill--alt{background:transparent;color:var(--sky-dark);border:1.5px solid var(--sky-dark);
  box-shadow:none}

.map{position:relative;overflow:hidden;background:var(--sky-light);border:1px solid var(--border);
  border-radius:10px}
.map iframe{width:100%;height:clamp(260px,44dvh,420px);border:0;display:block}
.map__foot{padding:8px 14px;font-size:.74rem;color:var(--muted);margin:0}

.prose{max-width:70ch}
.prose h2{margin-top:1.2em;font-family:var(--font-head);}
.prose p{font-size:1.02rem}

.news{padding:clamp(28px,7vw,56px) clamp(20px,5vw,50px);background:var(--sky);color:#fff;
  text-align:center;border-radius:12px}
.news h2{color:#fff;max-width:20ch;margin-inline:auto;font-family:var(--font-head);}
.news p{color:rgba(255,255,255,.86);max-width:44ch;margin-inline:auto}
.news form{display:flex;gap:8px;max-width:440px;margin:20px auto 0;flex-wrap:wrap}
.news input{flex:1 1 200px;min-height:46px;border:0;border-radius:999px;padding:0 20px;
  background:#fff;color:var(--ink)}
.news button{border:0;background:var(--wine-deep);color:#fff;min-height:46px;
  border-radius:999px;padding:0 26px;font-weight:650;cursor:pointer;font-family:inherit}
.news__msg{font-size:.85rem;margin-top:12px;color:rgba(255,255,255,.9);min-height:1.2em}

.art{position:absolute;inset:0;width:100%;height:100%}
.art svg{width:100%;height:100%;display:block}

.car{position:relative;overflow:hidden;max-width:100%}
.car__track{display:flex;gap:14px;width:max-content;will-change:transform}
.car__item{flex:0 0 var(--cw,60vw);max-width:var(--cwmax,320px)}
@media(min-width:760px){.car__item{flex-basis:var(--cw-d,24vw)}}
.car__ctrls button{width:38px;height:38px;border-radius:999px;border:1px solid var(--border);
  background:#fff;cursor:pointer;display:grid;place-items:center;font-size:.9rem}

.scroller{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.scroller>*{scroll-snap-align:start;flex:0 0 var(--cw,64vw);max-width:var(--cwmax,320px)}
@media(min-width:760px){.scroller>*{flex-basis:var(--cw-d,26vw)}}

/* =========================================================
   18 · STUDIO OVERLAY
   ========================================================= */
#studio{position:fixed;inset:0;z-index:300;background:var(--sand-pale);display:none;
  flex-direction:column;padding-top:var(--safe-t)}
#studio[data-open="true"]{display:flex}

.st__hdr{display:flex;align-items:center;gap:10px;padding:10px max(14px,var(--safe-l));
  border-bottom:1px solid var(--border);background:#fff;flex-wrap:wrap}
.st__title{font-family:var(--font-head);font-size:1.05rem;margin:0;white-space:nowrap}
.st__tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;order:3}
.st__tabs::-webkit-scrollbar{display:none}
.st__tabs button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;
  border:1px solid transparent;background:transparent;cursor:pointer;font-size:.84rem;
  font-weight:600;color:var(--muted)}
.st__tabs button[aria-selected="true"]{background:var(--wine);color:#fff}
.st__status{font-size:.76rem;padding:5px 11px;border-radius:999px;background:var(--sand);
  color:var(--muted);font-weight:600;white-space:nowrap}
.st__status[data-s="saved"]{background:#dcefe0;color:#1d5b2c}
.st__status[data-s="error"]{background:#f8d9d9;color:#8a1f1f}

.st__body{flex:1;display:grid;grid-template-columns:1fr;overflow:hidden}
@media(min-width:900px){.st__body{grid-template-columns:280px 1fr 380px}}
.st__pane{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;min-width:0}
.st__pane--list{border-right:1px solid var(--border);background:#fff}
.st__pane--prev{background:var(--sand);padding:0}
.st__pane--insp{border-left:1px solid var(--border);background:#fff}
@media(max-width:899px){
  .st__body[data-view="list"] .st__pane--prev,
  .st__body[data-view="list"] .st__pane--insp{display:none}
  .st__body[data-view="prev"] .st__pane--list,
  .st__body[data-view="prev"] .st__pane--insp{display:none}
  .st__body[data-view="insp"] .st__pane--list,
  .st__body[data-view="insp"] .st__pane--prev{display:none}
}

.st__views{display:flex;gap:4px;order:2}
@media(min-width:900px){.st__views{display:none}}
.st__views button{min-height:38px;padding:0 12px;border-radius:999px;
  border:1px solid var(--border);background:#fff;font-size:.8rem;font-weight:600;cursor:pointer}
.st__views button[aria-pressed="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}

.st__acts{display:flex;gap:6px;margin-left:auto;flex:0 0 auto}
.st__act{white-space:nowrap}
@media(max-width:899px){
  .st__hdr{flex-wrap:nowrap;gap:6px;min-height:60px;
    padding:8px max(10px,var(--safe-r)) 8px max(10px,var(--safe-l))}
  .st__hdr .icon-btn{width:44px;height:44px;flex:0 0 auto}
  .st__title{font-size:1rem}
  .st__status{flex:1 1 0;min-width:0;max-width:none;overflow:hidden;text-overflow:ellipsis;
    font-size:.7rem;padding:5px 9px;text-align:center}
  .st__acts{margin-left:0;flex:0 0 auto;gap:4px}
  .st__act{min-width:44px;min-height:44px;padding:0 4px;border-radius:12px;font-size:1.1rem;
    touch-action:manipulation}
  .st__act .st__lbl{display:none}
  .st__act--primary{min-width:68px;padding:0 14px;font-size:.92rem}
  .st__views{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;
    padding:6px max(12px,var(--safe-r)) 6px max(12px,var(--safe-l));
    background:#fff;border-bottom:1px solid var(--border)}
  .st__views button{border-radius:0;min-height:42px;margin:0 -.5px}
  .st__views button:first-child{border-radius:999px 0 0 999px}
  .st__views button:last-child{border-radius:0 999px 999px 0}
  .st__body{padding-bottom:calc(58px + var(--safe-b))}
  .st__tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;flex:none;order:0;
    background:#fff;border-top:1px solid var(--border);
    padding:6px 8px calc(6px + var(--safe-b));gap:2px;-webkit-overflow-scrolling:touch}
  .st__tabs button{min-height:44px;padding:0 13px;font-size:.8rem}
  body:has(#studio[data-open="true"]) .toast{bottom:calc(76px + var(--safe-b))}
}
@media(max-width:480px){.st__title{display:none}}
.st__preview{background:var(--sand-pale);min-height:100%}
.st__preview .sec{pointer-events:none}

.st__section-picker{position:fixed;inset:0;z-index:10002;display:grid;place-items:center;
  padding:18px;background:rgba(17,24,39,.62);backdrop-filter:blur(5px)}
.st__section-picker[hidden]{display:none}
.st__picker-card{width:min(900px,100%);max-height:min(86vh,780px);overflow:auto;

    { id:"serif_system", name:"Iowan Old Style (system)", stack:'"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif', source:"System" },
  ];

  /* =========================================================
     STATE
     ========================================================= */
  const LS_KEY = "craft.main-storefront.studio.v1";
  const CART_KEY = "storefront.cart";
  const WISH_KEY = "storefront.wishlist";

  let PUB = null;
  let DRAFT = null;
  let dirty = false;
  let cart = [];
  let wishlist = [];
  let listLimit = 9;
  let lastRouteKey = "";

  function loadFromBrowser(){
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !d.published) return null;
      return d;
    } catch (e) { return null; }
  }
  function persist(){
    try {
      const published = { ...PUB }, draft = { ...DRAFT };
      delete published.library; delete draft.library;
      localStorage.setItem(LS_KEY, JSON.stringify({ published, draft }));
      return true;
    } catch (e) { return false; }
  }
  function loadCart() {
    try { cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch (e) { cart = []; }
    if (!Array.isArray(cart)) cart = [];
  }
  function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {} }
  function loadWish() {
    try { wishlist = JSON.parse(localStorage.getItem(WISH_KEY) || "[]"); } catch (e) { wishlist = []; }
    if (!Array.isArray(wishlist)) wishlist = [];
  }
  function saveWish() { try { localStorage.setItem(WISH_KEY, JSON.stringify(wishlist)); } catch (e) {} }

  /* =========================================================
     THEME / CURRENCY
     ========================================================= */
  function applyTheme(t){
    if (!t) return;
    const c = t.colors || {};
    const r = document.documentElement.style;
    r.setProperty("--wine",      c.wine      || "#2f9fdd");
    r.setProperty("--wine-deep", c.wineDeep  || "#1c7db2");
    r.setProperty("--sand",      c.sand      || "#e8f5fc");
    r.setProperty("--sand-pale", c.pageBackground || c.sandPale || "#f5fbff");
    r.setProperty("--white",     c.surfaceBackground || c.white || "#FFFFFF");
    r.setProperty("--text",      c.text      || "#22262b");
    r.setProperty("--muted",     c.muted     || "#6b7480");
    r.setProperty("--radius",    (t.radius ?? 10) + "px");
    r.setProperty("--page-bg", c.pageBackground || c.sandPale || "#f5fbff");
    r.setProperty("--surface-bg", c.surfaceBackground || c.white || "#ffffff");
    r.setProperty("--header-bg", c.headerBackground || c.surfaceBackground || c.white || "#ffffff");
    r.setProperty("--nav-bg", c.navigationBackground || c.surfaceBackground || c.white || "#ffffff");
    r.setProperty("--footer-bg", c.footerBackground || c.pageBackground || c.sandPale || "#f5fbff");
    r.setProperty("--border", `color-mix(in srgb, ${c.wine || "#2f9fdd"} 18%, ${c.pageBackground || c.sandPale || "#f5fbff"})`);
    r.setProperty("--accent-wash", `color-mix(in srgb, ${c.wine || "#2f9fdd"} 10%, ${c.pageBackground || c.sandPale || "#f5fbff"})`);
    if (t.fonts) {
      r.setProperty("--font-head", t.fonts.head);
      r.setProperty("--font-body", t.fonts.body);
      ["head", "body"].forEach(role => {
        const stack = String(t.fonts[role] || "");
        const font = FONTS.find(item => item.stack === stack && item.source === "Google Fonts");
        if (!font) return;
        const linkId = "st-font-" + font.id;
        if (document.getElementById(linkId)) return;
        const link = document.createElement("link");
        link.id = linkId;
        link.rel = "stylesheet";
        link.href = "https://fonts.googleapis.com/css2?family=" +
          encodeURIComponent(font.googleFamily).replace(/%20/g, "+") + "&display=swap";
        document.head.appendChild(link);
      });
    }
    const mt = document.querySelector('meta[name="theme-color"]');
    if (mt) mt.setAttribute("content", c.wine || "#2f9fdd");
  }
  function currencyConfig(){
    return (PUB && PUB.settings && PUB.settings.currency)
      || { code:"NGN", locale:"en-NG", symbol:"₦" };
  }
  function money(value){
    const n = Number(value) || 0;
    const c = currencyConfig();
    try {
      return new Intl.NumberFormat(c.locale, {
        style:"currency", currency:c.code, maximumFractionDigits:2
      }).format(n);
    } catch (e) {
      return c.symbol + n.toFixed(2);
    }
  }
  function paystackConfig(){
    return (PUB && PUB.settings && PUB.settings.paystack) || {};
  }

  /* =========================================================
     PRODUCT / CATEGORY NORMALIZATION
     ========================================================= */
  function productImage(p){
    if (!p) return "";
    if (p.media) return p.media;
    if (Array.isArray(p.images) && p.images[0]) return p.images[0];
    return "";
  }
  function productCategoryId(p){
    if (!p) return null;
    if (Array.isArray(p.categoryIds) && p.categoryIds.length) return p.categoryIds[0];
    return p.categoryId || null;
  }
  function productSubcategoryId(p){
    if (!p) return null;
    if (Array.isArray(p.categoryIds) && p.categoryIds.length > 1) return p.categoryIds[1];
    return p.subcategoryId || null;
  }
  function getProduct(id, src){
    src = src || PUB;
    return src.products.find(p => String(p.id) === String(id)) || null;
  }
  function getCategory(id, src){
    src = src || PUB;
    return src.categories.find(c => String(c.id) === String(id)) || null;
  }
  function topCategories(src){
    src = src || PUB;
    return src.categories.filter(c => c.published !== 0 && !c.parentId)
      .sort((a,b) => (a.position||0) - (b.position||0));
  }
  function childCategories(parentId, src){
    src = src || PUB;
    return src.categories.filter(c => String(c.parentId||"") === String(parentId))
      .sort((a,b) => (a.position||0) - (b.position||0));
  }
  function productsInCategory(cid, src){
    src = src || PUB;
    return src.products.filter(p => p.published !== 0 &&
      (String(productCategoryId(p)) === String(cid) ||
       String(productSubcategoryId(p)) === String(cid)));
  }
  function sortProducts(list, sort){
    const c = [...list];
    if (sort === "price-asc") c.sort((a,b) => (a.salePrice ?? a.price) - (b.salePrice ?? b.price));
    else if (sort === "price-desc") c.sort((a,b) => (b.salePrice ?? b.price) - (a.salePrice ?? a.price));
    else if (sort === "name") c.sort((a,b) => a.name.localeCompare(b.name));
    else c.sort((a,b) => (a.position || 0) - (b.position || 0) || a.name.localeCompare(b.name));
    return c;
  }

  /* =========================================================
     ART placeholder (deterministic SVG)
     ========================================================= */
  function art(hue, seed, shape){
    const h = ((Number(hue)||340)%360+360)%360;
    const n = hash(String(seed||""));
    const v = ((Number(shape)||0) + n) % 3;
    const bg = `hsl(${h} 28% 90%)`;
    const fg1 = `hsl(${h} 42% 65%)`;
    const fg2 = `hsl(${(h+30)%360} 38% 45%)`;
    const a = 20 + (n%30), b = 40 + (n%40), c = 15 + (n%20);
    let s = "";
    if (v === 0) s = `<circle cx="${a}%" cy="${b}%" r="${c}%" fill="${fg1}"/><circle cx="${100-a}%" cy="${100-b}%" r="${c*0.8}%" fill="${fg2}" opacity=".7"/>`;
    else if (v === 1) s = `<path d="M0,${b} Q${a},${b-15} 100,${b+5} L100,100 L0,100 Z" fill="${fg1}"/><circle cx="${100-a}%" cy="${a}%" r="${c}%" fill="${fg2}" opacity=".6"/>`;
    else s = `<rect x="${a}%" y="${a}%" width="${c*1.4}%" height="${c*1.4}%" rx="20%" fill="${fg1}" transform="rotate(${(n%40)-20} 50 50)"/><circle cx="${100-a}%" cy="${b}%" r="${c*0.7}%" fill="${fg2}" opacity=".6"/>`;
    return `<div class="art" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="${bg}"/>${s}</svg></div>`;
  }

  /* =========================================================
     ICONS
     ========================================================= */
  const ICON = {
    heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.3 4.9 13.2a4.6 4.6 0 0 1 6.5-6.5l.6.6.6-.6a4.6 4.6 0 0 1 6.5 6.5Z"/></svg>'
  };

  /* =========================================================
     CART / WISHLIST
     ========================================================= */
  function cartCount(){ return cart.reduce((s,i) => s + (Number(i.qty)||0), 0); }
  function cartSubtotal(){
    return cart.reduce((s,i) => {
      const p = getProduct(i.productId);
      return s + (p ? (Number(p.price)||0) * (Number(i.qty)||0) : 0);
    }, 0);
  }
  function validCartItems(){
    return cart.map(i => {
      const p = getProduct(i.productId);
      return p ? { product:p, qty:Math.max(1, Number(i.qty)||1) } : null;
    }).filter(Boolean);
  }
  function addToCart(productId, qty){
    const p = getProduct(productId); if (!p) return;
    qty = Math.max(1, Math.floor(Number(qty) || 1));
    const ex = cart.find(i => String(i.productId) === String(productId));
    if (ex) ex.qty += qty;
    else cart.push({ productId, qty });
    saveCart(); updateCartBadge();
    toast(p.name + " added to cart");
  }
  function changeQty(productId, delta){
    const it = cart.find(i => String(i.productId) === String(productId));
    if (!it) return;
    it.qty += delta;
    if (it.qty <= 0) cart = cart.filter(i => String(i.productId) !== String(productId));
    saveCart(); render(); updateCartBadge();
  }
  function removeFromCart(productId){
    cart = cart.filter(i => String(i.productId) !== String(productId));
    saveCart(); render(); updateCartBadge();
  }
  function toggleWishlist(productId){
    const i = wishlist.indexOf(productId);
    if (i === -1) { wishlist.push(productId); toast("Saved to wishlist"); }
    else          { wishlist.splice(i,1);  toast("Removed from wishlist"); }
    saveWish(); render();
  }
  function updateCartBadge(){
    const b = $("#cart-badge"); if (b) b.textContent = String(cartCount());
  }

  /* =========================================================
     PRODUCT CARD (FILE A markup)
     ========================================================= */
  function placeholderCard(){
    return '<article class="product-card is-placeholder" aria-hidden="true">' +
      '<div class="product-media"></div>' +
      '<div class="product-info">' +
        '<span class="ph-line" style="width:64%"></span>' +
        '<span class="ph-line ph-line--sm" style="width:36%"></span>' +
      '</div></article>';
  }
  function productCard(product, opts){
    opts = opts || {};
    if (!product) return "";
    const inWish = wishlist.indexOf(product.id) !== -1;
    const image = productImage(product);
    const href = "#/product/" + encodeURIComponent(product.id);
    const price = product.salePrice != null
      ? `<span class="product-price">${money(product.salePrice)} <s style="color:var(--muted);font-weight:400">${money(product.price)}</s></span>`
      : `<span class="product-price">${money(product.price)}</span>`;
    return `<article class="product-card">
      <a class="product-media" href="${href}" aria-label="${esc(product.name)}">
        ${image ? `<img src="${esc(image)}" alt="" loading="lazy">` : ''}
      </a>
      <button class="wish-btn${inWish ? ' is-active' : ''}" type="button"
        data-action="toggle-wishlist" data-id="${esc(product.id)}"
        aria-pressed="${inWish}"
        aria-label="${inWish ? 'Remove from wishlist' : 'Save to wishlist'}">
        ${ICON.heart}
      </button>
      <div class="product-info">
        <a class="product-name" href="${href}">${esc(product.name)}</a>
        ${price}
        ${opts.showRemove ? `<button class="link-btn" type="button" data-action="toggle-wishlist" data-id="${esc(product.id)}">Remove</button>` : ''}
      </div>
    </article>`;
  }

  /* =========================================================
     SECTION RENDERERS (home page + optional addables)
     Each returns a block of markup. `src` is the source data (PUB or DRAFT).
     ========================================================= */
  const SEC = {};
  const productGridStyle = (props, desktopFallback, mobileFallback) => {
    const columns = (value, fallback, maximum) =>
      Math.max(1, Math.min(maximum, Math.round(Number(value) || fallback)));
    return ` style="--product-grid-columns:${columns(props.columns, desktopFallback, 4)};` +
      `--product-grid-columns-mobile:${columns(props.mobileColumns, mobileFallback, 4)}"`;
  };

  SEC["brand-logo"] = (p, id, src) => {
    const settings = src.settings || {};
    const image = p.logo || settings.logo || "";
    const label = p.label || settings.siteName || "Store";
    const width = clamp(Number(p.width) || 140, 48, 320);
    return `<div class="container" style="display:flex;justify-content:center">
      <a href="#/home" aria-label="${esc(label)}" style="display:inline-flex;align-items:center;justify-content:center;max-width:100%">
        ${image
          ? `<img src="${esc(image)}" alt="${esc(label)}" style="display:block;width:min(${width}px,100%);height:auto;max-height:120px;object-fit:contain">`
          : `<span style="font-size:1.25rem;font-weight:700;color:var(--ink)">${esc(label)}</span>`}
      </a>
    </div>`;
  };

  SEC["categories-rail"] = (p, id, src) => {
    const cats = src.categories.filter(c => c.published !== 0 &&
      (p.source === "all" || !c.parentId)).slice(0, p.limit || 8);
    if (!cats.length) {
      const ph = Array.from({length:6}).map(() =>
        '<div class="cat-item" aria-hidden="true"><div class="cat-circle"></div>' +
        '<span class="ph-line ph-line--xs" style="width:58%"></span></div>').join('');
      return `<div class="container"><div class="cat-rail">${ph}</div></div>`;
    }
    return `<div class="container"><div class="cat-rail">${cats.map(c => `
      <a class="cat-item" href="#/category/${encodeURIComponent(c.id)}">
        <span class="cat-circle">${c.media ? `<img src="${esc(c.media)}" alt="" loading="lazy">` : ''}</span>
        <span class="cat-name">${esc(c.name)}</span>
      </a>`).join('')}</div></div>`;
  };

  SEC["products-grid"] = (p, id, src) => {
    const items = src.products.filter(x => x.published !== 0).slice(0, p.limit || 3);
    const cards = items.length
      ? items.map(x => productCard(x)).join('')
      : [placeholderCard(), placeholderCard(), placeholderCard()].join('');
    return `<div class="container">
      <div class="section-head"><h2 class="section-title">${esc(p.title || 'Products')}</h2></div>
      <div class="product-grid"${productGridStyle(p, 3, 2)}>${cards}</div>
      ${p.seeMore !== 0 ? `<div class="section-foot"><a class="btn btn--outline" href="#/products">See more</a></div>` : ''}
    </div>`;
  };

  SEC["category-sections"] = (p, id, src) => {
    const cats = src.categories.filter(c => c.published !== 0 && !c.parentId);
    if (!cats.length) return '';
    return cats.map(cat => {
      const items = productsInCategory(cat.id, src).slice(0, p.limit || 4);
      const grid = items.length
        ? items.map(x => productCard(x)).join('')
        : '';
      return `<div class="container"><section class="section cat-section">
        <div class="section-head">
          <h2 class="section-title">${esc(cat.name)}</h2>
          <a class="see-all" href="#/category/${encodeURIComponent(cat.id)}">See all</a>
        </div>
        ${items.length
          ? `<div class="product-grid"${productGridStyle(p, 2, 2)}>${grid}</div>`
          : `<p class="slot-note">No products in this category yet.</p>`}
      </section></div>`;
    }).join('');
  };

  SEC["newsletter-a"] = (p) => `
    <div class="container">
      <section class="newsletter" aria-labelledby="nl-title">
        <div class="newsletter-grid">
          <div>
            <h2 class="section-title" id="nl-title">${esc(p.title || 'Newsletter')}</h2>
            <p class="slot-text">${esc(p.subtitle || '')}</p>
          </div>
          <div>
            <form class="newsletter-form" id="newsletter-form" novalidate>
              <label class="sr-only" for="newsletter-email">Email address</label>
              <input class="input" id="newsletter-email" type="email" name="email"
                placeholder="${esc(p.placeholder || 'Email address')}"
                autocomplete="email" required>
              <button class="btn" type="submit">${esc(p.ctaLabel || 'Subscribe')}</button>
            </form>
            <p class="form-msg" id="newsletter-msg" role="status"></p>
          </div>
        </div>
      </section>
    </div>`;

  /* --- Generic optional sections ported from FILE B --- */
  SEC["announce"] = (p) => {
    if (!p.text) return '';
    return `<div class="announce" style="background:${esc(p.bg || 'var(--sky)')};color:${esc(p.fg || '#fff')}">
      <span>${esc(p.text)}</span>
      ${p.linkLabel ? `<a href="${esc(p.linkHref || '#')}">${esc(p.linkLabel)}</a>` : ''}
      ${p.dismissible ? `<button type="button" aria-label="Dismiss">✕</button>` : ''}
    </div>`;
  };

  SEC["hero-text-image"] = (p) => {
    const media = p.media
      ? `<img src="${esc(p.media)}" alt="" loading="lazy">`
      : art(340, "hero", 1);
    return `<div class="container"><div class="tai ${p.layout === 'split' ? 'tai--split' : ''}">
      <div class="tai__text" style="text-align:${p.align === 'center' ? 'center' : 'left'}">
        ${p.eyebrow ? `<p class="eyebrow">${esc(p.eyebrow)}</p>` : ''}
        <h1>${esc(p.heading || '')}</h1>
        ${p.body ? `<p class="lead">${esc(p.body)}</p>` : ''}
        ${p.ctaLabel ? `<a class="btn" href="${esc(p.ctaHref || '#/products')}">${esc(p.ctaLabel)}</a>` : ''}
      </div>
      <div class="tai__media" style="--ar:${esc(p.ar || '4/3')}">${media}</div>
    </div></div>`;
  };

  SEC["hero-image"] = (p) => {
    const h = (p.height || 60) + "svh";
    const media = p.media
      ? `<img src="${esc(p.media)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`
      : art(342, "heroimg", 0);
    return `<div class="container"><div class="hero__box" style="background:${esc(p.bg || 'var(--sky-light)')};min-height:${h}">
      ${media}${p.link ? `<a href="${esc(p.link)}" aria-label="Open featured collection"></a>` : ''}
    </div></div>`;
  };

  SEC["product-grid"] = (p, id, src) => {
    const items = sortProducts(src.products.filter(x => x.published !== 0),
      p.sort || "position").slice(0, p.limit || 8);
    if (!items.length) return '';

    return `<div class="container">
      <div class="section-head"><h2 class="section-title">${esc(p.title || '')}</h2>
        ${p.viewAll ? `<a class="see-all" href="#/products">View all</a>` : ''}
      </div>
      <div class="pgrid" style="${style}">
        ${items.map(x => {
          const img = productImage(x);
          return `<a class="pcard" href="#/product/${encodeURIComponent(x.id)}">
            <div class="pcard__media">${img ? `<img src="${esc(img)}" alt="">` : art(x.hue, x.id, 0)}
              ${x.badge ? `<span class="badge">${esc(x.badge)}</span>` : ''}
            </div>
            <div class="pcard__body">
              <h3 class="pcard__name">${esc(x.name)}</h3>
              <span class="pcard__price">${money(x.salePrice ?? x.price)}</span>
            </div></a>`;
        }).join('')}
      </div></div>`;

  SEC["category-circles"] = (p, id, src) => {
    const list = src.categories.filter(c => c.published !== 0 &&
      (p.source === "all" || !c.parentId)).slice(0, p.limit || 8);
    if (!list.length) return '';
    return `<div class="container">
      ${p.title ? `<div class="section-head"><h2 class="section-title">${esc(p.title)}</h2></div>` : ''}
      <div class="circles" style="--cs:${clamp(Number(p.size)||104,72,160)}px">
        ${list.map(c => `<a class="circle" href="#/category/${encodeURIComponent(c.id)}">
          <span class="circle__disc">${c.media ? `<img src="${esc(c.media)}" alt="">` : art(c.hue, c.id, 0)}</span>
          <span class="circle__label">${esc(c.name)}</span></a>`).join('')}
      </div></div>`;
  };

  SEC["faq-accordion"] = (p) => {
    const items = Array.isArray(p.items) ? p.items : [];
    if (!items.length) return '';
    return `<div class="container">
      ${p.title ? `<div class="section-head"><h2 class="section-title">${esc(p.title)}</h2></div>` : ''}
      <div class="faq">
        ${items.map(i => `<details class="faq__item">
          <summary>${esc(i.q || '')}</summary>
          <p>${esc(i.a || '')}</p>
        </details>`).join('')}
      </div></div>`;
  };

  SEC["testimonials"] = (p) => {
    const items = Array.isArray(p.items) ? p.items : [];
    if (!items.length) return '';
    return `<div class="container">
      ${p.title ? `<div class="section-head"><h2 class="section-title">${esc(p.title)}</h2></div>` : ''}
      <div class="testis">
        ${items.map(t => `<div class="testi">
          ${t.stars ? `<div class="testi__stars">${"★".repeat(Number(t.stars)||0)}</div>` : ''}
          <p class="testi__quote">“${esc(t.quote || '')}”</p>
          <div class="testi__who">

              ${t.role ? `<div class="testi__role">${esc(t.role)}</div>` : ''}</div>
          </div>

      </div></div>`;

  SEC["rich-text"] = (p) => `<div class="container prose">
    ${p.heading ? `<h2>${esc(p.heading)}</h2>` : ''}
    ${p.html || ''}
  </div>`;

  SEC["ticker"] = (p) => {
    const phrases = String(p.phrases || "").split("·").map(t => t.trim()).filter(Boolean);
    if (!phrases.length) return '';
    const one = phrases.map(t => `<span>${esc(t)}</span><span aria-hidden="true">·</span>`).join('');
    return `<div class="ticker" data-dir="${esc(p.direction || 'left')}"
      data-static="${p.static ? 'true' : 'false'}"
      style="--dur:${clamp(Number(p.speed)||28,4,120)}s;background:${esc(p.bg || 'var(--sky)')};color:${esc(p.fg || '#fff')}">
      <div class="ticker__inner">${one}${one}</div>
    </div>`;
  };

  /* =========================================================
     RENDER SECTION + STOREFRONT PAGES
     ========================================================= */
  function renderSection(s, src){
    if (!s || s.visible === 0) return '';
    const fn = SEC[s.type];
    if (!fn) return `<div class="container"><p class="empty">Unknown section: ${esc(s.type)}</p></div>`;
    try { return fn(s.props || {}, s.id, src || PUB) || ''; }
    catch (err) { return `<div class="container"><p class="empty">Error rendering section: ${esc(err.message)}</p></div>`; }
  }

  function renderHome(){
    const home = PUB.pages.find(p => p.type === "home") || PUB.pages[0];
    if (!home) return `<div class="container"><div class="empty-state"><h3>No home page</h3>
      <p>Open Studio → Pages and mark one page as the home page.</p></div></div>`;
    const secs = PUB.sections.filter(s => s.pageId === home.id)
      .sort((a,b) => (a.position||0) - (b.position||0));
    if (!secs.length) return `<div class="container"><div class="empty-state"><h3>Home is empty</h3>
      <p>Add sections in Studio → Sections.</p></div></div>`;
    return secs.map(s => {
      const inner = renderSection(s);
      const full = ["announce","ticker","promo-fullscreen","fullscreen-image"].includes(s.type);
      if (full) return inner;
      return `<section class="section" data-sec="${esc(s.id)}">${inner}</section>`;
    }).join('');
  }

  function screenAllProducts(route){
    const catFilter = route.query.get("cat") || "";
    const sort = route.query.get("sort") || "default";
    let items = PUB.products.filter(p => p.published !== 0);
    if (catFilter) items = items.filter(p =>
      String(productCategoryId(p)) === String(catFilter) ||
      String(productSubcategoryId(p)) === String(catFilter));
    items = sortProducts(items, sort);
    const visible = items.slice(0, listLimit);
    const hasMore = items.length > visible.length;
    return `<div class="container">
      <header class="page-head">
        <h1 class="page-title">All Products</h1>
        <p class="page-sub">${items.length} product${items.length === 1 ? '' : 's'}</p>
      </header>
      <div class="toolbar">
        <div class="field field--inline">
          <label class="sr-only" for="sort-select">Sort</label>
          <select class="input" id="sort-select" data-param="sort">
            <option value="default" ${sort==='default'?'selected':''}>Sort: Featured</option>
            <option value="price-asc" ${sort==='price-asc'?'selected':''}>Price: low to high</option>
            <option value="price-desc" ${sort==='price-desc'?'selected':''}>Price: high to low</option>
            <option value="name" ${sort==='name'?'selected':''}>Name: A–Z</option>
          </select>
        </div>
        <span class="count">${items.length} item${items.length === 1 ? '' : 's'}</span>
      </div>
      ${items.length
        ? `<div class="product-grid">${visible.map(p => productCard(p)).join('')}</div>
           ${hasMore ? '<div class="section-foot"><button class="btn btn--outline" type="button" data-action="load-more">Load more</button></div>' : ''}`
        : '<div class="empty-state"><h3>No products yet</h3><p>Add product records in Studio → Products.</p></div>'}
    </div>`;
  }

  function screenCategory(route, categoryId){
    const cat = getCategory(categoryId);
    if (!cat) return `<div class="container">${notFound('Category not found.')}</div>`;
    const parent = cat.parentId ? getCategory(cat.parentId) : null;
    const children = childCategories(cat.id);
    const sort = route.query.get("sort") || "default";
    let items = productsInCategory(cat.id);
    items = sortProducts(items, sort);
    const visible = items.slice(0, listLimit);
    const hasMore = items.length > visible.length;
    const base = "#/category/" + encodeURIComponent(cat.id);
    const crumbs = ['<a href="#/home">Home</a>'];
    if (parent) crumbs.push(`<span class="sep">/</span><a href="#/category/${encodeURIComponent(parent.id)}">${esc(parent.name)}</a>`);
    crumbs.push(`<span class="sep">/</span><span>${esc(cat.name)}</span>`);
    const chips = children.length
      ? `<div class="chips"><a class="chip is-active" href="${base}">All</a>${children.map(ch =>
          `<a class="chip" href="${base}?sub=${encodeURIComponent(ch.id)}">${esc(ch.name)}</a>`).join('')}</div>`
      : "";
    return `<div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb">${crumbs.join('')}</nav>
      <header class="page-head">
        <h1 class="page-title">${esc(cat.name)}</h1>
        <p class="page-sub">${items.length} product${items.length===1?'':'s'}</p>
      </header>
      ${chips}
      <div class="toolbar" style="margin-top:14px">
        <select class="input" data-param="sort">
          <option value="default">Sort: Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name: A–Z</option>
        </select>
      </div>
      ${items.length
        ? `<div class="product-grid">${visible.map(p => productCard(p)).join('')}</div>
           ${hasMore ? '<div class="section-foot"><button class="btn btn--outline" type="button" data-action="load-more">Load more</button></div>' : ''}`
        : '<div class="empty-state"><h3>No products in this category</h3><p>Products linked to this category will appear here.</p></div>'}
    </div>`;
  }

  function screenProduct(productId){
    const p = getProduct(productId);
    if (!p) return `<div class="container">${notFound('Product not found.')}</div>`;
    const cat = productCategoryId(p) ? getCategory(productCategoryId(p)) : null;
    const sub = productSubcategoryId(p) ? getCategory(productSubcategoryId(p)) : null;
    const inWish = wishlist.indexOf(p.id) !== -1;
    const image = productImage(p);
    const crumbs = ['<a href="#/home">Home</a>'];
    if (cat) crumbs.push(`<span class="sep">/</span><a href="#/category/${encodeURIComponent(cat.id)}">${esc(cat.name)}</a>`);
    if (sub) crumbs.push(`<span class="sep">/</span><a href="#/category/${encodeURIComponent(sub.id)}">${esc(sub.name)}</a>`);
    const related = PUB.products.filter(x => x.published !== 0 && x.id !== p.id &&
      (x.categoryIds||[]).some(id => (p.categoryIds||[]).includes(id))).slice(0, 4);
    return `<div class="container">
      <nav class="breadcrumbs">${crumbs.join('')}</nav>
      <div class="checkout-grid" style="margin-top:18px">
        <div class="product-media" style="aspect-ratio:1/1;border-radius:12px">
          ${image ? `<img src="${esc(image)}" alt="${esc(p.name)}">` : ''}
        </div>
        <div>
          <h1 class="page-title">${esc(p.name)}</h1>
          <p class="page-sub">${p.salePrice != null ? money(p.salePrice) + ' <s style="color:var(--muted)">' + money(p.price) + '</s>' : money(p.price)}</p>
          ${p.brand ? `<p class="slot-note">Brand: ${esc(p.brand)}</p>` : ''}
          ${p.description ? `<p class="slot-text" style="margin-top:12px">${esc(p.description)}</p>` : ''}
          <div class="form-grid" style="margin-top:18px;max-width:220px">
            <div class="field">
              <label for="pdp-qty">Quantity</label>
              <input class="input" id="pdp-qty" type="number" min="1" value="1" inputmode="numeric">
            </div>
          </div>
          <div class="form-actions">
            <button class="btn" type="button" data-action="add-to-cart" data-id="${esc(p.id)}">Add to cart</button>
            <button class="btn btn--outline" type="button" data-action="toggle-wishlist" data-id="${esc(p.id)}" aria-pressed="${inWish}">
              ${inWish ? 'In wishlist' : 'Save to wishlist'}

      </div>
      ${related.length ? `<div style="margin-top:36px">
        <div class="section-head"><h2 class="section-title">You may also like</h2></div>
        <div class="product-grid">${related.map(productCard).join('')}</div>
      </div>` : ''}
    </div>`;
  }

  function searchProducts(q){
    q = String(q || "").trim().toLowerCase();
    if (!q) return [];
    return PUB.products.filter(p => p.published !== 0).filter(p => {
      const cat = productCategoryId(p) ? getCategory(productCategoryId(p)) : null;
      const sub = productSubcategoryId(p) ? getCategory(productSubcategoryId(p)) : null;
      const hay = [p.name, p.description, p.brand, cat ? cat.name : '', sub ? sub.name : '']
        .filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  function screenSearch(route){
    const q = route.query.get("q") || "";
    const results = q ? searchProducts(q) : [];
    let body;
    if (!q) body = `<div class="empty-state"><h3>Search the catalogue</h3><p>Enter a term to search products.</p></div>`;
    else if (!results.length) body = `<div class="empty-state"><h3>No results for “${esc(q)}”</h3><p>Try a different search term.</p></div>`;
    else body = `<p class="page-sub" style="margin-bottom:14px">${results.length} result${results.length===1?'':'s'}</p>
      <div class="product-grid">${results.map(productCard).join('')}</div>`;
    return `<div class="container">
      <header class="page-head"><h1 class="page-title">Search</h1></header>
      <form class="newsletter-form" id="search-form" role="search">
        <label class="sr-only" for="search-input">Search</label>
        <input class="input" id="search-input" type="search" name="q" value="${esc(q)}"
          placeholder="Search products" autocomplete="off">
        <button class="btn" type="submit">Search</button>
      </form>
      <div style="margin-top:22px">${body}</div>
    </div>`;
  }

  function screenWishlist(){
    const items = wishlist.map(id => getProduct(id)).filter(Boolean);
    return `<div class="container">
      <header class="page-head">
        <h1 class="page-title">Wishlist</h1>

  function screenCart(){

      const p = it.product;
      const img = productImage(p);
      return `<div class="cart-item">
        <a class="cart-thumb" href="#/product/${encodeURIComponent(p.id)}" aria-label="${esc(p.name)}">
          ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ''}
        </a>
        <div class="cart-main">
          <a class="product-name" href="#/product/${encodeURIComponent(p.id)}">${esc(p.name)}</a>
          <span class="product-price">${money(p.price)}</span>
          <div class="qty">

          <span class="line-total">${money((Number(p.price)||0) * it.qty)}</span>
          <button class="link-btn" type="button" data-action="remove-item" data-id="${esc(p.id)}">Remove</button>
        </div>

    return `<div class="container">
      <header class="page-head">
        <h1 class="page-title">Cart</h1>
        <p class="page-sub">${cartCount()} item${cartCount()===1?'':'s'}</p>

        <div class="cart-list">${rows}</div>
        <aside class="summary" aria-label="Order summary">

  }

  const ACCOUNT_SECTIONS = [
    ['signin','Sign in'],['register','Create account'],['profile','Customer information'],
    ['addresses','Saved addresses'],['orders','Orders & history'],
    ['delivery','Delivery updates'],['notifications','Notifications'],

  ];
  function accountPanel(section){
    const note = `<p class="panel-note">Frontend scaffold. Connect endpoints in Studio → Site to enable.</p>`;
    switch (section) {
      case 'signin': return `<div class="card-panel"><h2 class="panel-title">Sign in</h2>${note}

            <div class="field field--full"><label>Password</label><input class="input" type="password"></div>
          </div>
          <div class="form-actions"><button class="btn" type="submit">Sign in</button></div>
          <p class="form-msg" role="status"></p>

      case 'register': return `<div class="card-panel"><h2 class="panel-title">Create account</h2>${note}
        <form class="scaffold-form" data-scaffold="Create account" novalidate>
          <div class="form-grid">
            <div class="field field--full"><label>Full name</label><input class="input" type="text"></div>

            <div class="field"><label>Phone</label><input class="input" type="tel"></div>

          <div class="form-actions"><button class="btn" type="submit">Create account</button></div>
          <p class="form-msg" role="status"></p>

      case 'orders': return `<div class="card-panel"><h2 class="panel-title">Orders & history</h2>

      case 'wishlist': return `<div class="card-panel"><h2 class="panel-title">Wishlist</h2>

      case 'profile': case 'addresses': case 'delivery': case 'notifications': case 'settings':
        return `<div class="card-panel"><h2 class="panel-title">${esc(ACCOUNT_SECTIONS.find(e=>e[0]===section)[1])}</h2>
          <div class="empty-state"><h3>Scaffold</h3><p>This section is a frontend scaffold.</p></div></div>`;
      default: return `<div class="card-panel"><div class="empty-state"><h3>Section not found</h3>

  function screenAccount(route){
    const sec = route.query.get("section") || "signin";
    const nav = ACCOUNT_SECTIONS.map(([id,label]) =>
      `<a href="#/account?section=${id}"${sec===id?' class="is-active"':''}>${label}</a>`).join('');
    return `<div class="container">
      <header class="page-head">
        <h1 class="page-title">Account</h1>
        <p class="page-sub">Frontend scaffold — no authentication exists yet.</p>

        <nav class="account-nav" aria-label="Account sections">${nav}</nav>

      </div>
