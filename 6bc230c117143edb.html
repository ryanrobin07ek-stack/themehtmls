  renderLibrary(list, insp) {
    const self = this;
    const library = DRAFT.library || {};
    const themes = library.extractedThemes || [];
    const featureNames = library.featureNames || [];
    const nativeTypes = Object.fromEntries(library.sectionTypeByFeature || []);
    const features = [];
    (library.featureMatrix || []).forEach((row, themeIndex) => {
      const theme = themes[themeIndex];
      if (!theme) return;
      for (let featureIndex = 0; featureIndex < row.length; featureIndex++) {
        const evidence = row[featureIndex];
        if (evidence === "0") continue;
        const name = featureNames[featureIndex];
        if (!name) continue;
        features.push({ name, themeFile: theme.file, themeTitle: theme.title,
          status: evidence === "1" ? "present" : "text-evidence",
          nativeType: nativeTypes[featureIndex] || "rich-text" });
      }
    });
    const sectionTemplates = features.filter(item => nativeTypes[featureNames.indexOf(item.name)])
      .map(item => ({ ...item, category: item.name, sourceTheme: item.themeFile,
        evidence: item.status, headings: (themes.find(theme => theme.file === item.themeFile) || {}).headings || [] }));
    const elements = themes.flatMap(theme => [
      ...(theme.classNames || []).map(name => ({ name, themeFile: theme.file, themeTitle: theme.title, kind: "class" })),
      ...(theme.ids || []).map(name => ({ name, themeFile: theme.file, themeTitle: theme.title, kind: "id" }))
    ]);
    const colors = (library.colorCatalog || []).map(([hex, count]) => ({ hex, count }));
    const catalogs = { sections: sectionTemplates, components: features, elements,
      themes, colors };
    const labels = { sections:"Sections", components:"Components", elements:"Elements", themes:"Themes", colors:"Colors" };
    if (!catalogs[this.libraryCategory]) this.libraryCategory = "sections";
    const category = this.libraryCategory;
    const items = catalogs[category];
    const PAGE = 60;
    let limit = PAGE, matches = [];
    const cache = Studio._libText || (Studio._libText = new WeakMap());
    const textOf = item => {
      let t = cache.get(item);
      if (t === undefined) {
        t = [item.name,item.title,item.file,item.themeTitle,item.themeFile,item.category,item.kind,item.hex,
          item.nativeType,item.description,(item.headings || []).join(" "),(item.classNames || []).join(" "),
          (item.ids || []).join(" "),(item.features || []).map(x => x.name).join(" ")].join(" ").toLowerCase();
        cache.set(item, t);
      }
      return t;
    };
    const rowLabel = item => category === "colors" ? item.hex : category === "themes" ? item.title : item.name || item.title || item.file || "Untitled";
    const rowMeta = item => category === "sections" ? `${item.category || "section"} · ${item.themeTitle || item.sourceTheme || ""}`
      : category === "components" ? `${item.status || "component"} · ${item.themeTitle || item.themeFile || ""}`
      : category === "elements" ? `${item.kind} · ${item.themeTitle || ""}`
      : category === "themes" ? `${item.category || "theme"} · ${(item.classNames || []).length} classes`
      : `${item.count || 0} occurrences`;

    list.innerHTML = `<div class="st__toolbar lib-bar">
      <div class="lib-kinds" role="group" aria-label="Library categories">${Object.entries(labels).map(([key,label]) =>
        `<button class="btn btn--sm ${key===category?"":"btn--ghost"}" type="button" data-library-kind="${key}" aria-pressed="${key===category}">${label} <span class="lib-n">${catalogs[key].length.toLocaleString()}</span></button>`).join("")}</div>
      <label class="sr-only" for="studioLibrarySearch">Search library</label>
      <input id="studioLibrarySearch" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search ${esc(labels[category].toLowerCase())}…" value="${esc(this.libraryQuery || "")}">
      <p class="mini lib-count" data-library-count></p>
    </div><div data-library-list></div>`;
    const box = list.querySelector("[data-library-list]");
    const count = list.querySelector("[data-library-count]");
    const search = list.querySelector("#studioLibrarySearch");

    const filter = () => {
      const q = (self.libraryQuery || "").trim().toLowerCase();
      matches = q ? items.filter(item => textOf(item).includes(q)) : items;
      if (!(self.librarySelection >= 0 && self.librarySelection < matches.length)) self.librarySelection = 0;
    };
    const rowHtml = (item, index) => {
      const swatch = category === "colors" ? `<span aria-hidden="true" style="width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:${esc(item.hex)};border:1px solid var(--border)"></span>` : "";
      return `<button type="button" class="sitem lib-row" data-library-index="${index}" aria-current="${index === self.librarySelection}">${swatch}<span class="lib-row__txt"><span class="sitem__name" style="display:block">${esc(rowLabel(item))}</span><span class="sitem__type" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rowMeta(item))}</span></span></button>`;
    };
    const drawRows = () => {
      const shown = matches.slice(0, limit);
      box.innerHTML = shown.length
        ? shown.map(rowHtml).join("") + (matches.length > shown.length
            ? `<button type="button" class="btn btn--sm btn--ghost btn--block" data-library-more>Load more (${(matches.length - shown.length).toLocaleString()} remaining)</button>` : "")
        : `<p class="empty">No results found.</p>`;
      count.textContent = `${matches.length.toLocaleString()} results · extracted from ${library.extractionSummary?.themesScanned || 0} HTML files`;
    };
    const drawDetail = () => {
      const selected = matches[self.librarySelection] || null;
      const detail = selected ? (() => {
        const title = rowLabel(selected);
        const source = selected.themeTitle || selected.themeFile || selected.sourceTheme || "Extracted HTML theme";
        let facts = "", action = "";
        if (category === "themes") {
          const swatches = (selected.colors || []).slice(0,12).map(c => `<span title="${esc(c)}" style="display:inline-block;width:24px;height:24px;border-radius:50%;background:${esc(c)};border:1px solid var(--border);margin:3px"></span>`).join("");
          facts = `<p>${esc(selected.description || "Extracted theme metadata")}</p><div style="margin:10px 0">${swatches}</div><p class="mini">${(selected.classNames || []).length} classes · ${(selected.ids || []).length} IDs · ${(selected.headings || []).length} headings · ${selected.formCount || 0} forms</p><p class="mini">Apply look updates colours, typography, corner radius and product-card shape only. Products, categories and sections stay as they are.</p>`;
          action = `<button type="button" class="btn btn--sm" data-library-apply-look="${esc(selected.file || "")}">Apply look</button>`;
        } else if (category === "colors") {
          facts = `<div style="display:flex;align-items:center;gap:12px"><span style="width:52px;height:52px;border-radius:14px;background:${esc(selected.hex)};border:1px solid var(--border)"></span><strong>${esc(selected.hex)}</strong></div><p class="mini">Seen ${selected.count} times across the extracted HTML source.</p>`;
          action = `<button type="button" class="btn btn--sm" data-library-apply-color="${esc(selected.hex)}">Apply as accent</button>`;
        } else if (category === "elements") {
          facts = `<p>Extracted ${esc(selected.kind)} token: <code>${esc(selected.name)}</code></p><p class="mini">Theme: ${esc(source)}</p>`;
        } else if (category === "components") {
          facts = `<p>Feature evidence: <strong>${esc(selected.status)}</strong></p><p class="mini">Native block: ${esc(selected.nativeType)} · source: ${esc(source)}</p>`;
          action = `<button type="button" class="btn btn--sm" data-library-add-section="${esc(selected.nativeType)}" data-library-title="${esc(selected.name)}">Add editable section</button>`;
        } else {
          const examples = (selected.headings || []).slice(0,8);
          facts = `<p>${esc(selected.evidence || "Reusable native section pattern")} · ${esc(selected.category || "section")}</p><p class="mini">Source: ${esc(source)}</p>${examples.length ? `<details><summary>Extracted screen content</summary><ul>${examples.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}`;
          action = `<button type="button" class="btn btn--sm" data-library-add-section="${esc(selected.nativeType)}" data-library-title="${esc((selected.headings || [])[0] || selected.name)}">Add editable section</button>`;
        }
        return `<h3 style="margin-top:0">${esc(title)}</h3>${facts}<div class="btn-row">${action}</div>`;
      })() : `<p class="empty">No results found.</p>`;
      insp.innerHTML = `<button type="button" class="btn btn--sm btn--ghost lib-back" data-library-back>← Back to list</button><h3 style="margin-top:0">${esc(labels[category])}</h3><p class="mini">${matches.length.toLocaleString()} extracted entries. Select an item for details or an available studio action.</p>${detail}`;
    };

    filter(); drawRows(); drawDetail();

    list.onclick = event => {
      const kind = event.target.closest("[data-library-kind]");
      if (kind) {
        if (kind.dataset.libraryKind === category) return;
        self.libraryCategory = kind.dataset.libraryKind; self.librarySelection = 0;
        list.scrollTop = 0; self.renderLibrary(list, insp);
        return;
      }
      if (event.target.closest("[data-library-more]")) { limit += PAGE; drawRows(); return; }
      const row = event.target.closest("[data-library-index]");
      if (!row) return;
      self.librarySelection = Number(row.dataset.libraryIndex);
      box.querySelectorAll("[data-library-index]").forEach(r => r.setAttribute("aria-current", String(r === row)));
      drawDetail();
      insp.scrollTop = 0;
      if (self.isNarrow()) self.setView("insp");
    };
    insp.onclick = event => {
      if (event.target.closest("[data-library-back]")) { self.setView("list"); return; }
      const add = event.target.closest("[data-library-add-section]");
      if (add) { self.addLibrarySection(add.dataset.libraryAddSection, add.dataset.libraryTitle); return; }
      const lookBtn = event.target.closest("[data-library-apply-look]");
      if (lookBtn) {
        const theme = (DRAFT.library?.extractedThemes || []).find(t => t.file === lookBtn.dataset.libraryApplyLook)
          || matches[self.librarySelection];
        self.applyLibraryThemeLook(theme);
        return;
      }
      const pal = event.target.closest("[data-library-apply-palette]");
      if (pal) {
        const p = (DRAFT.palettes || []).find(x => x.id === pal.dataset.libraryApplyPalette);
        if (!p) return;
        if (paletteColorsCollapsed(p.colors) && p.sourceTheme) {
          const theme = (DRAFT.library?.extractedThemes || []).find(t => t.file === p.sourceTheme);
          if (theme) { self.applyLibraryThemeLook(theme); return; }
        }
        applyLookTokensToDraft({ colors: p.colors });
        dirty = true; self.autosave(); self.render();
        toast("Palette applied — colours only. Products unchanged.");
        return;
      }
      const col = event.target.closest("[data-library-apply-color]");
      if (col) {
        const color = col.dataset.libraryApplyColor;
        if (!/^#[0-9a-f]{6}$/i.test(color)) { toast("Only 6-digit hex colours can be applied"); return; }
        applyLookTokensToDraft({ colors: { wine: color } });
        dirty = true; self.autosave(); self.render();
        toast("Accent colour applied");
      }
    };
    let timer;
    search.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        self.libraryQuery = search.value; self.librarySelection = 0; limit = PAGE;
        filter(); drawRows(); drawDetail();
      }, 120);
    });
    search.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); search.blur(); } });
  },

  addLibrarySection(type,title) {
    const valid=SECTION_TYPES.some(([key])=>key===type);
    if(!valid){alert("This extracted pattern has no editable section equivalent yet.");return;}
    const page=DRAFT.pages.find(p=>p.type==="home");
    if(!page){alert("Create a home page before adding a section.");return;}
    const props=defaultProps(type);
    if(title){if("heading" in props)props.heading=title;if("title" in props)props.title=title;if("text" in props)props.text=title;}
    const sec={id:uid("s"),pageId:page.id,type,position:DRAFT.sections.filter(s=>s.pageId===page.id).length,visible:1,props};
    DRAFT.sections.push(sec);this.selectedSection=sec.id;this.tab="sections";dirty=true;this.renderTabs();this.render();this.autosave();
    if(this.isNarrow())this.setView("insp");
  },

  applyLibraryThemeLook(theme) {
    const tokens = lookTokensFromLibraryTheme(theme);
    if (!tokens) { toast("No colours found on this theme"); return; }
    const productCount = Array.isArray(DRAFT.products) ? DRAFT.products.length : 0;
    const categoryCount = Array.isArray(DRAFT.categories) ? DRAFT.categories.length : 0;
    applyLookTokensToDraft(tokens);
    dirty = true;
    this.autosave();
    this.render();
    if ((DRAFT.products?.length || 0) !== productCount || (DRAFT.categories?.length || 0) !== categoryCount) {
      toast("Look apply aborted safety check failed");
      return;
    }
    toast("Look applied — colours, type & cards only. Catalog unchanged.");
  },

  themeMakerCss() {
    try { return localStorage.getItem(`${LS_KEY}.theme-maker-css`) || ""; }
  catch (error) {
    console.warn("Theme Maker CSS could not be read from this browser.", error);
    return "";
  }
  },

  applyThemeMakerCSS(css = this.themeMakerCss()) {
  let style = document.getElementById("stThemeMakerCss");
  if (!css) {
    style?.remove();
    return;
  }
  if (!style) {
    style = document.createElement("style");
    style.id = "stThemeMakerCss";
    document.head.appendChild(style);
  }
  style.textContent = css;
  },

  downloadThemeCSS(css) {
  const blob = new Blob([css], { type: "text/css;charset=utf-8" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "theme.css";
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  },

  themePackageFromDraft(name) {
  const fontIdOrStack = value => FONTS.find(font => font.stack === value)?.id || value;
  return {
    name: String(name || "").trim() || "Storefront theme",
    theme: {
      colors: clone(DRAFT.theme.colors),
      radius: Number(DRAFT.theme.radius ?? 14),
      cardShape: DRAFT.theme.cardShape || "standard",
      fonts: {
        head: fontIdOrStack(DRAFT.theme.fonts?.head || ""),
        body: fontIdOrStack(DRAFT.theme.fonts?.body || "")
      }
    }
  };
  },

  validateThemeMakerPackage(theme) {
  if (!theme || typeof theme !== "object" || Array.isArray(theme)) return "Theme JSON must contain an object.";
  // Tokens only — reject catalog/content fields so themes cannot carry products or copy.
  const allowed = new Set(["name", "palette", "theme", "fonts"]);
  const forbidden = ["products", "categories", "sections", "pages", "settings", "home", "library", "footerGroups", "socialLinks"];
  const blocked = Object.keys(theme).find(key => forbidden.includes(key));
  if (blocked) return `Theme packages are look-only and cannot include "${blocked}".`;
  const unknown = Object.keys(theme).find(key => !allowed.has(key));
  if (unknown) return `Unknown theme field: ${unknown}.`;
  if (theme.name !== undefined && typeof theme.name !== "string") return "Theme name must be text.";
  if (theme.theme !== undefined && (!theme.theme || typeof theme.theme !== "object" || Array.isArray(theme.theme))) {
    return "The theme field must contain an object.";
  }
  if (theme.theme) {
    const themeAllowed = new Set(["colors", "radius", "cardShape", "fonts"]);
    const themeUnknown = Object.keys(theme.theme).find(key => !themeAllowed.has(key));
    if (themeUnknown) return `Unknown theme.theme field: ${themeUnknown}.`;
  }
  if (theme.palette !== undefined &&
      !DRAFT.palettes.some(palette => palette.id === theme.palette)) {
    return `Unknown palette: ${theme.palette}.`;
  }
  const colors = theme.theme?.colors;
  if (colors !== undefined) {
    if (!colors || typeof colors !== "object" || Array.isArray(colors)) return "Theme colors must be an object.";
    const validColors = new Set(["wine", "wineDeep", "sand", "sandPale", "white", "text", "muted"]);
    for (const [key, value] of Object.entries(colors)) {
      if (!validColors.has(key)) return `Unknown theme color: ${key}.`;
      if (typeof value !== "string" || !/^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(value)) {
        return `Invalid hex color for ${key}.`;
      }
    }
  }
  if (theme.theme?.radius !== undefined &&
      (typeof theme.theme.radius !== "number" || theme.theme.radius < 0 || theme.theme.radius > 40)) {
    return "Theme radius must be a number from 0 to 40.";
  }
  if (theme.theme?.cardShape !== undefined &&
      !CARD_SHAPES.includes(theme.theme.cardShape)) {
    return "Theme cardShape must be a supported card shape.";
  }
  const fonts = theme.theme?.fonts || theme.fonts;
  if (fonts !== undefined) {
    if (!fonts || typeof fonts !== "object" || Array.isArray(fonts)) return "Theme fonts must be an object.";
    for (const key of Object.keys(fonts)) {
      if (!["head", "body"].includes(key) || typeof fonts[key] !== "string") {
        return "Theme fonts may contain only heading and body font strings.";
      }
    }
  }
  return "";
  },

  applyThemeMakerPackage(theme) {
  const error = this.validateThemeMakerPackage(theme);
  if (error) return error;
  const palette = theme.palette
    ? DRAFT.palettes.find(item => item.id === theme.palette)
    : null;
  const colors = { ...(palette?.colors || {}), ...(theme.theme?.colors || {}) };
  const fonts = theme.theme?.fonts || theme.fonts;
  const resolvedFonts = fonts
    ? Object.fromEntries(Object.entries(fonts).map(([key, value]) => [
        key,
        FONTS.find(font => font.id === value)?.stack || value
      ]))
    : undefined;
  applyLookTokensToDraft({
    colors,
    radius: theme.theme?.radius,
    cardShape: theme.theme?.cardShape,
    fonts: resolvedFonts
  });
  return "";
  },

  renderTheme(list, insp) {
    this.applyThemeMakerCSS();
    let savedName = "Storefront theme";
    try { savedName = localStorage.getItem(`${LS_KEY}.theme-maker-name`) || `${DRAFT.settings.siteName || "Store"} theme`; }
    catch (error) { console.warn("Theme Maker name could not be read from this browser.", error); }

    list.innerHTML = `<div class="st__toolbar" style="flex-wrap:wrap">
      <button class="btn btn--sm" type="button" id="stExportTheme">Download theme.json</button>
      <label class="btn btn--sm btn--ghost" for="stImportThemeFile" style="cursor:pointer">Import / swap theme<input id="stImportThemeFile" type="file" accept="application/json,.json" hidden></label>
      <button class="btn btn--sm" type="button" id="stRestorePalette">Reset to Wine &amp; Sand</button>
    </div>
    <p class="mini">Themes control colors, fonts and product-card shape. Sections, products, categories and store content stay separate.</p>` +
      DRAFT.palettes.map(p => `<div class="sitem" data-palid="${p.id}" tabindex="0" role="button">
        <div style="min-width:0;flex:1"><div class="sitem__name">${esc(p.name)}</div></div>
        <div style="display:flex;gap:2px">
          <span style="width:14px;height:14px;border-radius:50%;background:${esc(p.colors.wine)};border:1px solid var(--border)"></span>
          <span style="width:14px;height:14px;border-radius:50%;background:${esc(p.colors.sand)};border:1px solid var(--border)"></span>
          <span style="width:14px;height:14px;border-radius:50%;background:${esc(p.colors.sandPale)};border:1px solid var(--border)"></span>
        </div>

    $("#stRestorePalette").addEventListener("click", () => {

    const c = DRAFT.theme.colors;
    const colorField = (k, label) => `<div class="fld">
      <label for="tc_${k}">${label}</label>

    </div>`;
    const css = this.themeMakerCss();

      </div>
      <div class="fld"><label for="stThemeCss">Optional custom CSS (${css.length}/12000 chars)</label>

      <p class="mini" id="stThemeMakerMessage" role="status">Download both files into themes/your-theme/ and build with --theme.</p>

      ${colorField("sand", "Complement background")}
      ${colorField("sandPale", "Page background")}
      ${colorField("white", "Card background")}
      ${colorField("text", "Body text")}
      ${colorField("muted", "Muted text")}
      <div class="fld"><label>Corner radius (px)</label>

        <select id="stThemeCardShape" data-card-shape>
          ${[
            ["standard", "Standard"],
            ["arch", "Arch"],
            ["pill", "Pill"],
            ["arch-palace", "Palace arch"],
            ["lantern", "Lantern"],
            ["cut", "Cut corner"],
            ["ticket", "Ticket"]
          ].map(([value, label]) =>
            `<option value="${value}"${(DRAFT.theme.cardShape || "standard") === value ? " selected" : ""}>${label}</option>`
          ).join("")}
        </select>
      </div>
      <div class="btn-row"><button class="btn btn--sm" type="button" id="stSavePalette">Save as new palette</button></div>
      <p class="mini" id="contrastMsg"></p>`;

    const updateContrast = () => {
      const r = contrast(c.text, c.sandPale);
      $("#contrastMsg").innerHTML = r >= 4.5
        ? `<span class="notice notice--ok">Text/background contrast ${r.toFixed(1)}:1 — readable.</span>`

    };
    updateContrast();
    $$("[data-tc]", insp).forEach(el => el.addEventListener("input", () => {
      DRAFT.theme.colors[el.dataset.tc] = el.value;
      applyTheme(DRAFT.theme);
      updateContrast();
      dirty = true;
      this.autosave();
    }));
    $$("[data-tc-hex]", insp).forEach(el => el.addEventListener("input", () => {
      const v = el.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) {
        DRAFT.theme.colors[el.dataset.tcHex] = v;
        const colorEl = $("#tc_" + el.dataset.tcHex, insp);
        if (colorEl) colorEl.value = v;
        applyTheme(DRAFT.theme);
        updateContrast();
        dirty = true;
        this.autosave();
      }
    }));
    $("[data-trad]", insp).addEventListener("input", e => {
      DRAFT.theme.radius = Number(e.target.value);
      applyTheme(DRAFT.theme);
      dirty = true;
      this.autosave();

    $("[data-card-shape]", insp).addEventListener("change", e => {

    $("#stThemePackageName").addEventListener("input", event => {
      try { localStorage.setItem(`${LS_KEY}.theme-maker-name`, event.target.value); }
      catch (error) {

        $("#stThemeMakerMessage").textContent = "The theme name could not be saved in this browser.";

    $("#stExportTheme").addEventListener("click", () => {

    $("#stImportThemeFile").addEventListener("change", async event => {

        if (error) {
          message.textContent = `Theme was not imported: ${error}`;
          return;
        }
        if (typeof incoming.name === "string" && incoming.name.trim()) {
          try { localStorage.setItem(`${LS_KEY}.theme-maker-name`, incoming.name.trim()); }
          catch (storageError) { console.warn("Imported theme name could not be saved.", storageError); }
        }
        applyTheme(DRAFT.theme);

        this.render();

    });
    $("#stThemeCss").addEventListener("input", event => {
      const value = event.target.value;
      if (/<\/style/i.test(value)) {

      $("#stExportThemeCss").disabled = !value.trim();
      const cssLabel = insp.querySelector('label[for="stThemeCss"]');
      if (cssLabel) cssLabel.textContent = `Optional custom CSS (${value.length}/12000 chars)`;
      try {
        localStorage.setItem(`${LS_KEY}.theme-maker-css`, value);
        $("#stThemeMakerMessage").textContent = "CSS preview updated and saved in this browser.";
      } catch (error) {
        console.error("Theme Maker CSS could not be saved.", error);
        $("#stThemeMakerMessage").textContent = "CSS preview updated, but could not be saved in this browser.";
      }
    });
    $("#stExportThemeCss").addEventListener("click", () => {
      const value = this.themeMakerCss();
      if (!value.trim()) return;
      this.downloadThemeCSS(value);
      $("#stThemeMakerMessage").textContent = "Downloaded theme.css separately. Place it beside theme.json in the theme folder.";
    });
    $("#stImportThemeCssFile").addEventListener("change", async event => {
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;
      const message = $("#stThemeMakerMessage");
      try {
        const value = await file.text();
        if (value.length > 12000) {
          message.textContent = "CSS was not imported: maximum size is 12000 characters.";
          return;
        }
        if (/<\/style/i.test(value)) {
          message.textContent = "CSS was not imported: it cannot contain a closing style tag.";
          return;
        }
        $("#stThemeCss").value = value;
        $("#stThemeCss").dispatchEvent(new Event("input", { bubbles: true }));
      } catch (error) {
        console.error("Theme CSS could not be imported.", error);
        message.textContent = `CSS was not imported: ${error.message || "Could not read the file."}`;
      }
    });
    $("#stSavePalette").addEventListener("click", () => {
      const name = prompt("Palette name:", "My palette");
      if (!name) return;
      DRAFT.palettes.push({ id: uid("pal"), name, colors: clone(DRAFT.theme.colors) });
      dirty = true;
      this.render();
      this.autosave();
    });
  },
  renderSite(list, insp) {
    const st = DRAFT.settings = DRAFT.settings || {};
    DRAFT.socialLinks = DRAFT.socialLinks || [];
    list.innerHTML = `<div class="st__toolbar"><span class="mini">Site name, contact details and social links. These show in the header, footer and browser tab.</span></div>`;
    const fields = [["siteName","Site name"],["tagline","Tagline"],["email","Email"],["phone","Phone"],["copyright","Copyright line"]];
    const socials = DRAFT.socialLinks.slice().sort((a, b) => (a.position || 0) - (b.position || 0));
    insp.innerHTML = `<h3 style="margin-top:0">Site info</h3>
      ${fields.map(([k, l]) => `<div class="fld"><label>${l}</label><input type="text" data-site="${k}" value="${esc(st[k] || "")}"></div>`).join("")}
      <h3>Storefront wording</h3>
      <p class="mini">Buttons and messages shoppers see. Leave blank to use the default.</p>
      ${Object.keys(TEXT_DEFAULTS).map(k => `<div class="fld"><label>${esc(k.replace(/([A-Z])/g, " $1").replace(/^./, c => c.toUpperCase()))}</label><input type="text" data-txt="${k}" placeholder="${esc(TEXT_DEFAULTS[k])}" value="${esc((st.text && st.text[k]) || "")}"></div>`).join("")}
      <h3>Social links</h3>
      ${socials.map(x => `<div class="fld" data-soc="${x.id}" style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">
        <label>Label</label><input type="text" data-sf="label" value="${esc(x.label || "")}">
        <label style="margin-top:6px">URL</label><input type="url" data-sf="url" value="${esc(x.url || "")}">
        <div class="fld fld--row" style="margin-top:6px"><input type="checkbox" data-sf="visible" ${x.visible ? "checked" : ""}><label>Visible</label></div>
        <button class="btn btn--sm btn--ghost" type="button" data-socdel="${x.id}">Remove</button></div>`).join("")}
      <div class="btn-row"><button class="btn btn--sm" type="button" id="stAddSocial">+ Add social link</button></div>`;
    const touch = () => { dirty = true; this.autosave(); };
    $$("[data-site]", insp).forEach(el => el.addEventListener("input", () => { st[el.dataset.site] = el.value; touch(); }));
    $$("[data-txt]", insp).forEach(el => el.addEventListener("input", () => {
      st.text = st.text || {}; st.text[el.dataset.txt] = el.value; touch();
    }));
    $$("[data-soc]", insp).forEach(box => {
      const x = DRAFT.socialLinks.find(y => y.id === box.dataset.soc);
      $$("[data-sf]", box).forEach(el => {
        const h = () => { x[el.dataset.sf] = el.type === "checkbox" ? (el.checked ? 1 : 0) : el.value; touch(); };
        el.addEventListener("input", h); el.addEventListener("change", h);
      });
    });
    $$("[data-socdel]", insp).forEach(b => b.addEventListener("click", () => {
      DRAFT.socialLinks = DRAFT.socialLinks.filter(y => y.id !== b.dataset.socdel);
      touch(); this.render();
    }));
    $("#stAddSocial", insp).addEventListener("click", () => {
      DRAFT.socialLinks.push({ id: uid("so"), label: "New link", url: "https://", visible: 1, position: DRAFT.socialLinks.length });
      touch(); this.render();
    });
  },

  renderFonts(list, insp) {
    list.innerHTML = `<div class="st__toolbar"><span class="mini">Choose a font stack. Marked “Self-hosted only” means the font is available only if you supply the .woff/.ttf file — otherwise it silently falls back to the next family in the stack.</span></div>` +
      FONTS.map(f => `<div class="sitem" data-fontid="${f.id}" tabindex="0" role="button">
        <div style="min-width:0;flex:1">
          <div class="sitem__name">${esc(f.name)}</div>
          <div class="sitem__type">${esc(f.source)}</div>
        </div>
      </div>`).join("");
    list.addEventListener("click", e => {
      const row = e.target.closest("[data-fontid]");
      if (!row) return;
      const f = FONTS.find(x => x.id === row.dataset.fontid);
      DRAFT.theme.fonts.head = f.stack;
      applyTheme(DRAFT.theme);
      dirty = true;
      this.autosave();
      toast("Heading font: " + f.name);
    });
    insp.innerHTML = `<h3 style="margin-top:0">Typography</h3>
      <div class="fld"><label>Heading font stack</label>
        <textarea data-tfont="head">${esc(DRAFT.theme.fonts.head)}</textarea></div>
      <div class="fld"><label>Body font stack</label>
        <textarea data-tfont="body">${esc(DRAFT.theme.fonts.body)}</textarea></div>
      <div class="fld"><label>Base font size (rem)</label>
        <input type="number" step=".05" min="0.8" max="1.4" data-tnum="size" value="1"></div>
      <div class="fld"><label>Base letter spacing (em)</label>
        <input type="number" step=".005" min="-.05" max=".1" data-tnum="ls" value="0"></div>
      <div class="fld"><label>Base line height</label>
        <input type="number" step=".05" min="1" max="2" data-tnum="lh" value="1.55"></div>
      <p class="mini">Fonts marked “Self-hosted only” (Mgion, Nextover, Antique) require you to drop the .woff files into your site and register them with @font-face in the &lt;style&gt; block — otherwise the fallback family shows.</p>`;
    $$("[data-tfont]", insp).forEach(el => el.addEventListener("input", () => {
      DRAFT.theme.fonts[el.dataset.tfont] = el.value;
      applyTheme(DRAFT.theme);
      dirty = true;
      this.autosave();
    }));
    $$("[data-tnum]", insp).forEach(el => el.addEventListener("input", () => {
      const k = el.dataset.tnum;
      const v = Number(el.value);
      if (k === "size") document.documentElement.style.setProperty("--body", v + "rem");
      else if (k === "ls") document.body.style.letterSpacing = v + "em";
      else if (k === "lh") document.body.style.lineHeight = v;
    }));
  },

  renderData(list, insp) {
    list.innerHTML = `<div class="notice">Edits here are saved in <strong>this browser only</strong>. To make them live for everyone:
      tap <strong>Download data.json</strong>, then replace <code>data.json</code> in your site folder and re-upload.</div>
      <p class="mini">Storage: <strong>localStorage</strong> (key: <code>${LS_KEY}</code>)</p>
      <p class="mini">Size: ${(JSON.stringify(DRAFT).length / 1024).toFixed(1)} KB (before base64 images)</p>`;
    insp.innerHTML = `<h3 style="margin-top:0">Import / export</h3>
      <div class="btn-row">
        <button class="btn btn--sm" type="button" id="stExport">Download data.json</button>
        <button class="btn btn--sm btn--ghost" type="button" id="stReset">Reload from data.json</button>
      </div>
      <div class="fld" style="margin-top:14px"><label for="stImport">Import JSON</label>
        <textarea id="stImport" placeholder="Paste a previously exported JSON document…" style="min-height:170px"></textarea></div>
      <div class="btn-row"><button class="btn btn--sm" type="button" id="stImportGo">Validate &amp; import</button></div>
      <p class="mini" id="stImportMsg"></p>`;
    $("#stExport").addEventListener("click", () => downloadJSON(DRAFT, "data.json"));
    $("#stReset").addEventListener("click", async () => {
      if (!confirm("Reload data from data.json? Your current edits will be replaced.")) return;
      DRAFT = (await loadDataFile()) || makeSeed();
      PUB = clone(DRAFT); applyText(); applyText();
      persist();
      dirty = true;
      applyTheme(DRAFT.theme);
      this.render();
      this.setStatus("saved", "Reloaded from data.json");
    });
    $("#stImportGo").addEventListener("click", () => {
      const msg = $("#stImportMsg");
      let data;
      try { data = JSON.parse($("#stImport").value); }
      catch (e) { msg.innerHTML = `<span class="notice notice--err">Invalid JSON: ${esc(e.message)}</span>`; return; }
      const err = validateImport(data);
      if (err) { msg.innerHTML = `<span class="notice notice--err">${esc(err)}</span>`; return; }
      if (!confirm("Replace the current storefront with the imported data?")) return;
      DRAFT = data;
      PUB = clone(data);
      persist();
      dirty = true;
      applyTheme(DRAFT.theme);
      this.render();
      msg.innerHTML = `<span class="notice notice--ok">Imported and saved.</span>`;
    });
  },

  bindInspectorFields(root, onEach) {
    $$("input,select,textarea", root).forEach(el => {
      const handler = () => {
        let v;
        if (el.type === "checkbox") v = el.checked ? 1 : 0;
        else if (el.type === "number" || el.type === "range") v = el.value === "" ? "" : Number(el.value);
        else v = el.value;
        const out = el.parentElement.querySelector(`[data-out="${el.id}"]`);
        if (out) out.textContent = v;
        onEach(el, v);
      };
      el.addEventListener("input", handler);
      el.addEventListener("change", handler);
    });
  }
};

function contrast(hex1, hex2) {
  const lum = h => {
    const m = h.replace("#", "");
    const v = [0, 2, 4].map(i => parseInt(m.substr(i, 2), 16) / 255)
      .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  };
  const a = lum(hex1 || "#000"), b = lum(hex2 || "#fff");
  return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
}
function downloadJSON(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function validateImport(d) {
  if (!d || typeof d !== "object") return "Root must be an object.";
  if (!Array.isArray(d.sections)) return "Missing sections array.";
  if (!Array.isArray(d.products)) return "Missing products array.";
  if (!Array.isArray(d.categories)) return "Missing categories array.";
  if (!Array.isArray(d.pages)) return "Missing pages array.";
  if (!d.theme || !d.theme.colors) return "Missing theme.colors.";
  return null;
}

/* =========================================================================
   CHROME
   ========================================================================= */
function bindChrome() {
  const drawer = $("#drawer");
  const openMenu  = () => {
    drawer.dataset.open = "true";
    $("#btnMenu").setAttribute("aria-expanded", "true");
    $("#btnCloseMenu").focus();
    document.body.style.overflow = "hidden";
  };
  const closeMenu = () => {
    drawer.dataset.open = "false";
    $("#btnMenu").setAttribute("aria-expanded", "false");
    document.body.style.overflow = "";
    $("#btnMenu").focus();
  };
  $("#btnMenu").addEventListener("click", openMenu);
  $("#btnCloseMenu").addEventListener("click", closeMenu);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if ($("#searchModal").dataset.open === "true") { closeSearch(); return; }
      if ($("#cartDrawer").dataset.open === "true") { closeCart(); return; }
      if (drawer.dataset.open === "true") { closeMenu(); return; }
      if ($("#studio").dataset.open === "true") { Studio.close(); return; }
    }
  });
  $("#btnStudio").addEventListener("click", () => Studio.open());
  $("#btnSearch").addEventListener("click", openSearch);
  $("#btnCart").addEventListener("click", openCart);
  $("#btnCartClose").addEventListener("click", closeCart);
  $("#btnWishlist").addEventListener("click", () => toast("Wishlist is a demo — nothing is saved yet."));
  $("#backdrop").addEventListener("click", () => {
    if ($("#cartDrawer").dataset.open === "true") closeCart();
    if ($("#searchModal").dataset.open === "true") closeSearch();
  });

  bindSearch();
  renderCartBadge();

  // install prompt
  (function () {
    let deferred = null;
    const name = () => (typeof PUB !== "undefined" && PUB && PUB.settings && PUB.settings.siteName) || "Maison Verre";
    const icon = (n) => {
      const c = document.createElement("canvas"); c.width = c.height = n;
      const g = c.getContext("2d");
      g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--wine").trim() || "#76243A";
      g.fillRect(0, 0, n, n);
      g.fillStyle = "#FBF7F0"; g.font = "600 " + Math.round(n * .55) + "px Georgia,serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(name().charAt(0).toUpperCase(), n / 2, n / 2 + n * .03);
      return c.toDataURL("image/png");
    };
    try {
      const m = {
        name: name(), short_name: name(), start_url: location.href.split("#")[0], scope: location.href.split("#")[0],
        display: "standalone", background_color: "#FBF7F0", theme_color: "#76243A",
        icons: [192, 512].map(n => ({ src: icon(n), sizes: n + "x" + n, type: "image/png", purpose: "any" }))
      };
      const l = document.createElement("link"); l.rel = "manifest";
      l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
      document.head.appendChild(l);
    } catch (e) {}
    window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
    window.addEventListener("appinstalled", () => { deferred = null; });
    $("#stInstall").addEventListener("click", async () => {
      if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; return; }
      const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
      if (standalone) { alert("This site is already installed."); return; }
      if (/iphone|ipad|ipod/i.test(navigator.userAgent))
        alert("On iPhone/iPad: tap the Share button, then “Add to Home Screen”.");
      else
        alert("Install prompt isn't available right now. It needs Chrome, Edge or Samsung Internet on https (or localhost), and it won't appear if the site is already installed.");
    });
  })();

  // studio theme toggle
  (function () {
    const st = $("#studio"), b = $("#stTheme");
    const set = (m) => {
      const dark = m === "dark";
      st.dataset.theme = m;
      b.querySelector(".st__ico").textContent = dark ? "☀️" : "🌙";
      b.querySelector(".st__lbl").textContent = dark ? "Light" : "Dark";
      b.setAttribute("aria-label", dark ? "Switch Studio to light mode" : "Switch Studio to dark mode");
      b.setAttribute("aria-pressed", String(dark));
      try { localStorage.setItem("studioTheme", m); } catch (e) {}
    };
    let m = "light";
    try { m = localStorage.getItem("studioTheme") || "light"; } catch (e) {}
    set(m);
    b.addEventListener("click", () => set(st.dataset.theme === "dark" ? "light" : "dark"));
  })();

  $("#stExit").addEventListener("click", () => Studio.close());
  $("#stSave").addEventListener("click", () => Studio.save());
  $("#stReload").addEventListener("click", () => {
    if (!confirm("Discard unsaved edits and reload from browser storage?")) return;
    const stored = loadFromBrowser();
    if (stored) { PUB = stored.published; }
    DRAFT = clone(PUB);
    applyTheme(DRAFT.theme);
    dirty = false;
    Studio.render();
    Studio.setStatus("saved", "Reloaded");
  });
  $$(".st__views button").forEach(b => b.addEventListener("click", () => Studio.setView(b.dataset.view)));
  // keep the List / Preview / Edit buttons in sync when any tab switches view directly
  new MutationObserver(() => {
    const v = $("#stBody").dataset.view;
    $$(".st__views button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.view === v)));
  }).observe($("#stBody"), { attributes: true, attributeFilter: ["data-view"] });
  window.addEventListener("hashchange", () => {
    if ($("#studio").dataset.open === "true") return;
    route();
  });
}

/* =========================================================================
   LOAD / INIT
   ========================================================================= */
async function loadDataFile() {
  try {
    const r = await fetch("data.json", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d || !d.settings) throw new Error("bad data.json");
    return d;
  } catch (e) {
    try { const el = document.getElementById("embeddedData"); if (el) return JSON.parse(el.textContent); } catch (e2) {}
    return null;
  }
}

function makeSeed() {
  // fallback if data.json is missing
  return {
    version: 2,
    settings: { siteName: "Maison Verre", tagline: "Objects made to be handled daily",
      email: "hello@maisonverre.example", phone: "+44 20 0000 0000", copyright: "© Maison Verre" },
    theme: { colors: PALETTES[16].colors, radius: 14,
      fonts: { head: FONTS[11].stack, body: FONTS[5].stack } },
    palettes: PALETTES.map(p => ({ id: p.id, name: p.name, colors: p.colors })),
    categories: [], products: [], pages: [{ id:"pg_home", slug:"home", title:"Home", type:"home", body:"", published:1, position:0 }],
    sections: [], footerGroups: [], socialLinks: []
  };
}

async function init() {
  const stored = loadFromBrowser();
  const seed = (await loadDataFile()) || makeSeed();
  if (stored) {
    PUB = stored.published;
    DRAFT = stored.draft || clone(PUB);
    PUB.library = seed.library || PUB.library || {};
    DRAFT.library = seed.library || DRAFT.library || {};
    PUB.palettes = Array.isArray(PUB.palettes) ? PUB.palettes : [];
    DRAFT.palettes = Array.isArray(DRAFT.palettes) ? DRAFT.palettes : [];
    const paletteIds = new Set(PUB.palettes.map(p => p.id));
    (seed.palettes || []).forEach(p => { if (!paletteIds.has(p.id)) { PUB.palettes.push(p); paletteIds.add(p.id); } });
    const draftPaletteIds = new Set(DRAFT.palettes.map(p => p.id));
    (seed.palettes || []).forEach(p => { if (!draftPaletteIds.has(p.id)) { DRAFT.palettes.push(p); draftPaletteIds.add(p.id); } });
  } else {
    PUB = clone(seed);
    DRAFT = clone(seed);
    persist();
  }
  loadCart();
  applyTheme(PUB.theme);
  applyText();

  document.getElementById("brand").innerHTML = esc(PUB.settings.siteName)
    .replace(/(\S+)$/, "<em>$1</em>");
  const headerNav = document.getElementById("headerNav");
  const rootCategory = PUB.categories.find(category => !category.parentId);
  if (headerNav && rootCategory) {
    headerNav.innerHTML = PUB.categories
      .filter(category => category.published && category.parentId === rootCategory.id)
      .slice(0, 8)
      .map(category => `<a href="#/c/${esc(category.slug)}">${esc(category.name)}</a>`)
      .join("");
  }
  document.getElementById("drawerNav").innerHTML = `
    <a href="#/">Home</a>
    <a href="#/products">All Products</a>
    <a href="#/categories">All Categories</a>
    ${PUB.categories.filter(c => c.published && !c.parentId)
      .map(c => `<a href="#/c/${esc(c.slug)}">${esc(c.name)}</a>`).join("")}
    ${PUB.pages.filter(p => p.type === "custom" && p.published)
      .map(p => `<a href="#/p/${esc(p.slug)}">${esc(p.title)}</a>`).join("")}`;

  bindChrome();
  route();
}

document.addEventListener("DOMContentLoaded", init);
</script>
