<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#76243A">
<title>Maison Verre</title>
<style>
:root{
  --wine:#76243A; --wine-deep:#541727; --sand:#F3E7D5; --sand-pale:#FBF7F0;
  --white:#FFFFFF; --text:#242124; --muted:#6E6267; --border:rgba(36,33,36,.14);
  --radius:14px; --shadow:0 10px 30px -18px rgba(36,33,36,.45);
  --font-head:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --h1:clamp(1.6rem,6vw,3.4rem); --h2:clamp(1.25rem,4.5vw,2.4rem); --h3:clamp(1rem,3.2vw,1.5rem);
  --body:clamp(.94rem,2.8vw,1.05rem); --gap:clamp(14px,4vw,26px);
  --pad:clamp(16px,5vw,40px); --header-h:56px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand-pale);color:var(--text);font-family:var(--font-body);
  font-size:var(--body);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,svg,video{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;line-height:1.12;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:var(--h1)}h2{font-size:var(--h2)}h3{font-size:var(--h3)}
p{margin:0 0 1em}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--wine);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--wine);color:#fff;padding:10px 16px;border-radius:0 0 8px 8px}
.skip:focus{top:0}

/* ---- Layout ---- */
.wrap{width:100%;max-width:1240px;margin-inline:auto;
  padding-inline:max(var(--pad),var(--safe-l),var(--safe-r))}
.sec{padding-block:clamp(18px,5vw,40px);max-width:100vw;overflow-x:clip}
.sec--tight{padding-block:0}
.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--wine);font-weight:700;margin-bottom:.6em}
.lead{color:var(--muted);max-width:60ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:44px;
  padding:.7em 1.4em;border-radius:999px;border:1px solid transparent;background:var(--wine);
  color:#fff;font-weight:650;text-decoration:none;cursor:pointer;transition:transform .16s,background .16s;
  -webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--wine-deep)}
.btn:active{transform:scale(.975)}
.btn--ghost{background:transparent;border-color:currentColor;color:var(--wine)}
.btn--ghost:hover{background:rgba(118,36,58,.08)}
.btn--light{background:#fff;color:var(--wine)}
.btn--light:hover{background:var(--sand)}
.btn--sm{min-height:38px;padding:.45em 1em;font-size:.86rem}
.btn--block{width:100%}
.pill{display:inline-flex;align-items:center;gap:.55em;min-height:48px;padding:.75em 1.6em;
  border-radius:999px;background:var(--wine);color:#fff;text-decoration:none;font-weight:650;
  box-shadow:var(--shadow)}
.pill--alt{background:transparent;color:var(--wine);border:1.5px solid var(--wine);box-shadow:none}

/* ---- Header ---- */
.hdr{position:sticky;top:0;z-index:60;background:rgba(251,247,240,.92);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border);padding-top:var(--safe-t)}
.hdr__in{display:flex;align-items:center;gap:12px;height:var(--header-h);justify-content:space-between}
.hdr__nav{display:none;align-items:center;justify-content:center;gap:clamp(12px,2vw,26px);flex:1}
.hdr__nav a{color:inherit;text-decoration:none;font-size:.78rem;font-weight:600;white-space:nowrap}
.hdr__nav a:hover{text-decoration:underline;text-underline-offset:4px}
.brand{font-family:var(--font-head);font-size:1.2rem;letter-spacing:.04em;
  text-decoration:none;color:var(--text);font-weight:600;white-space:nowrap}
.brand em{color:var(--wine);font-style:normal}
.hdr__actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:999px;
  border:1px solid var(--border);background:#fff;cursor:pointer;padding:0;position:relative;transition:background .15s}
.icon-btn:hover{background:var(--sand)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .badge-cnt{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;
  border-radius:999px;background:var(--wine);color:#fff;font-size:.68rem;font-weight:700;
  display:grid;place-items:center;padding:0 5px;line-height:1;font-family:var(--font-body)}
.icon-btn .badge-cnt[hidden]{display:none}
@media(min-width:900px){.hdr__nav{display:flex}}
/* ---- Drawer (mobile menu) ---- */
.drawer{position:fixed;inset:0;z-index:120;background:var(--sand-pale);
  clip-path:inset(0 0 0 100%);transition:clip-path .28s cubic-bezier(.4,0,.2,1),visibility 0s .28s;
  display:flex;flex-direction:column;padding:calc(var(--safe-t) + 14px) max(20px,var(--safe-l)) calc(var(--safe-b) + 24px);
  overflow-y:auto;visibility:hidden}
.drawer[data-open="true"]{clip-path:inset(0);visibility:visible;transition:clip-path .28s cubic-bezier(.4,0,.2,1)}
.drawer__top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.drawer nav a{display:flex;align-items:center;min-height:52px;text-decoration:none;
  font-family:var(--font-head);font-size:1.24rem;border-bottom:1px solid var(--border);color:var(--text)}
.drawer nav a:hover{color:var(--wine)}

/* ---- Cart drawer ---- */
.cart{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:220;background:#fff;
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:-20px 0 40px -20px rgba(0,0,0,.2)}
.cart[data-open="true"]{transform:none}
.cart__hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);padding-top:calc(14px + var(--safe-t))}
.cart__hdr h2{font-size:1.1rem;margin:0;font-family:var(--font-head)}
.cart__body{flex:1;overflow-y:auto;padding:12px 16px}
.cart__foot{border-top:1px solid var(--border);padding:14px 16px calc(14px + var(--safe-b))}
.cart__row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.cart__row:last-child{border-bottom:0}
.cart__thumb{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--sand);flex:0 0 auto;position:relative}
.cart__thumb .art{position:absolute;inset:0}
.cart__meta{flex:1;min-width:0}
.cart__name{font-weight:600;font-size:.9rem;line-height:1.3;margin:0 0 2px}
.cart__variant{font-size:.74rem;color:var(--muted)}
.cart__qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.cart__qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:.9rem}
.cart__qty input{width:44px;text-align:center;border:1px solid var(--border);border-radius:6px;height:28px;padding:0}
.cart__price{font-weight:650;font-size:.9rem;white-space:nowrap;text-align:right}
.cart__remove{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.74rem;text-decoration:underline;padding:0;margin-top:4px}
.cart__total{display:flex;justify-content:space-between;font-weight:700;font-size:1rem;margin-bottom:10px}
.cart__empty{padding:40px 10px;text-align:center;color:var(--muted)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:210;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop[data-open="true"]{opacity:1;pointer-events:auto}

/* ---- Search modal ---- */
.searchmodal{position:fixed;inset:0;z-index:230;display:none;padding:min(6vh,60px) 16px}
.searchmodal[data-open="true"]{display:block}
.searchmodal__panel{max-width:680px;margin:0 auto;background:#fff;border-radius:12px;
  overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.4);max-height:calc(100dvh - 80px);display:flex;flex-direction:column}
.searchmodal__in{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.searchmodal__in input{flex:1;border:0;background:transparent;min-height:44px;font-size:1rem;outline:none}
.searchmodal__body{overflow-y:auto;padding:14px}
.searchmodal__empty{padding:30px 10px;text-align:center;color:var(--muted)}

/* ---- Media ---- */
.art{position:absolute;inset:0;width:100%;height:100%}
.art svg{width:100%;height:100%;display:block}
.media{position:relative;overflow:hidden;background:var(--sand);isolation:isolate}
.media>img,.media>video{width:100%;height:100%;object-fit:cover;object-position:center}

/* ---- Sections ---- */
.hero__box{position:relative;overflow:hidden;background:var(--sand);
  display:flex;align-items:flex-end;min-height:60dvh;min-height:60svh}
.hero__box>a{position:absolute;inset:0;display:block;z-index:2}

.tai{display:grid;gap:clamp(14px,4vw,28px)}
.tai__text{padding-block:clamp(8px,2.5vw,20px) clamp(12px,3vw,22px)}
.tai__media{position:relative;overflow:hidden;background:var(--sand);aspect-ratio:var(--ar,4/3)}
@media(min-width:820px){.tai--split{grid-template-columns:1fr 1fr;align-items:center}}

.vhero{position:relative;overflow:hidden;background:var(--wine-deep);color:#fff;aspect-ratio:var(--ar,16/10)}
.vhero video,.vhero .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vhero__ov{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;gap:10px;padding:clamp(18px,5vw,44px);
  background:linear-gradient(to top,rgba(20,8,12,.72),rgba(20,8,12,.05) 62%)}
.vhero__ov h2,.vhero__ov p{color:#fff;max-width:26ch}
.vhero__ctrls{position:absolute;top:12px;right:12px;z-index:3;display:flex;gap:8px}
.vhero__ctrls button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);
  color:#fff;border-radius:999px;min-height:38px;min-width:38px;padding:0 12px;cursor:pointer;font-size:.78rem}

.colorcard{padding:clamp(26px,8vw,72px) clamp(20px,6vw,60px);
  display:flex;flex-direction:column;justify-content:center;min-height:260px;background:var(--wine);color:#fff}
.colorcard h2{color:inherit}

.split{display:grid;gap:0;overflow:hidden;background:#fff;border:1px solid var(--border)}
.split__media{position:relative;aspect-ratio:var(--ar,4/3);background:var(--sand);min-height:200px}
.split__body{padding:clamp(20px,5vw,44px);display:flex;flex-direction:column;justify-content:center;gap:10px}
@media(min-width:760px){
  .split--img-left,.split--img-right{grid-template-columns:1fr 1fr}
  .split--img-right .split__media{order:2}
}
.feature{position:relative;overflow:hidden;background:var(--sand);
  aspect-ratio:var(--ar,16/10);display:block}

/* ---- Products ---- */
.pgrid{display:grid;gap:var(--gap);grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
@media(min-width:640px){.pgrid{grid-template-columns:repeat(var(--cols-sm,3),minmax(0,1fr))}}
@media(min-width:960px){.pgrid{grid-template-columns:repeat(var(--cols-lg,4),minmax(0,1fr))}}
.pcard{background:#fff;overflow:hidden;border:1px solid var(--border);
  display:flex;flex-direction:column;text-decoration:none;color:inherit;
  transition:transform .18s,box-shadow .18s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard__media{position:relative;aspect-ratio:var(--par,1/1);background:var(--sand);overflow:hidden}
.pcard__media img{width:100%;height:100%;object-fit:cover}
.pcard__body{padding:12px 13px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard__name{font-family:var(--font-head);font-size:1rem;line-height:1.25;margin:0}
.pcard__cat{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pcard__price{margin-top:auto;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:650}
.pcard__price s{color:var(--muted);font-weight:400;font-size:.86em}
.pcard__price ins{text-decoration:none;color:var(--wine)}
.pcard__swatch{position:absolute;bottom:8px;right:8px;display:flex;gap:3px;background:rgba(255,255,255,.9);
  padding:3px 6px;border-radius:999px}
.pcard__swatch span{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.badge{position:absolute;top:9px;left:9px;background:var(--wine);color:#fff;font-size:.66rem;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;font-weight:700;z-index:2}

/* ---- Carousels ---- */
.car{position:relative;overflow:hidden;overflow:clip;contain:paint;max-width:100%}
.car__track{display:flex;gap:var(--gap);width:max-content;will-change:transform}
.car__item{flex:0 0 var(--cw,60vw);max-width:var(--cwmax,320px)}
@media(min-width:760px){.car__item{flex-basis:var(--cw-d,24vw)}}
.car__ctrls button{width:38px;height:38px;border-radius:999px;border:1px solid var(--border);
  background:#fff;cursor:pointer;display:grid;place-items:center;font-size:.9rem}

.scroller{display:flex;gap:var(--gap);overflow-x:auto;scroll-snap-type:x mandatory;
  padding-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.scroller>*{scroll-snap-align:start;flex:0 0 var(--cw,64vw);max-width:var(--cwmax,320px)}
@media(min-width:760px){.scroller>*{flex-basis:var(--cw-d,26vw)}}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  margin-bottom:var(--gap);flex-wrap:wrap}

/* ---- Ticker ---- */
.ticker{overflow:hidden;overflow:clip;contain:paint;max-width:100%;background:var(--wine);color:#fff;
  padding-block:clamp(12px,3vw,20px);white-space:nowrap}
.ticker__inner{display:inline-flex;animation:tick var(--dur,26s) linear infinite;will-change:transform}
.ticker[data-dir="right"] .ticker__inner{animation-direction:reverse}
.ticker[data-static="true"] .ticker__inner{animation:none;width:100%;justify-content:center}
.ticker__inner span{font-family:var(--font-head);font-size:clamp(1rem,3.6vw,1.6rem);
  letter-spacing:var(--ls,.02em);padding-inline:.55em}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker__inner{animation:none}}

/* ---- Announcement ---- */
.announce{background:var(--wine);color:#fff;padding:10px max(var(--pad),var(--safe-l));
  font-size:.82rem;display:flex;align-items:center;gap:10px;justify-content:center;
  letter-spacing:.05em;padding-top:calc(10px + var(--safe-t))}
.announce a{color:#fff;text-decoration:underline}
.announce button{background:none;border:0;color:#fff;cursor:pointer;font-size:1.1rem;line-height:1;
  padding:4px 8px;margin-left:auto;opacity:.7}
.announce button:hover{opacity:1}

/* ---- Promo / fullscreen ---- */
.promo{min-height:100dvh;min-height:100svh;display:flex;align-items:center;
  background:var(--wine);color:#fff;position:relative;overflow:hidden;
  padding-block:calc(var(--safe-t) + 40px) calc(var(--safe-b) + 40px)}
.promo h2{color:#fff;font-size:clamp(1.9rem,8vw,4.2rem);max-width:16ch}
.promo p{color:rgba(255,255,255,.86);max-width:44ch}
.promo__deco{position:absolute;inset:auto -12% -22% auto;width:min(78vw,620px);aspect-ratio:1;
  border-radius:50%;border:1.5px solid rgba(255,255,255,.22)}
.promo__deco::after{content:"";position:absolute;inset:14%;border-radius:50%;border:1.5px solid rgba(255,255,255,.16)}

.fsmedia{min-height:100dvh;min-height:100svh;position:relative;overflow:hidden;background:var(--sand)}
.fsmedia img,.fsmedia .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fsmedia__ov{position:relative;z-index:2;min-height:inherit;display:flex;align-items:flex-end;
  padding:clamp(20px,6vw,60px) max(var(--pad),var(--safe-l))}

/* ---- Diagonal swiper ---- */
.diag{background:#fff;position:relative;overflow:hidden;padding-block:clamp(28px,7vw,64px)}
.diag__stage{position:relative;height:clamp(360px,62dvh,560px);touch-action:pan-y;
  user-select:none;-webkit-user-select:none}
.diag__slide{position:absolute;inset:0;display:grid;place-items:center;
  transition:transform .55s cubic-bezier(.22,.8,.28,1),opacity .45s;will-change:transform,opacity}
.diag__card{width:min(78%,340px);background:var(--sand-pale);
  overflow:hidden;box-shadow:0 26px 60px -34px rgba(36,33,36,.6);border:1px solid var(--border);
  text-decoration:none;color:inherit;display:block}
.diag__media{aspect-ratio:4/5;position:relative;background:var(--sand)}
.diag__media img{width:100%;height:100%;object-fit:cover}
.diag__body{padding:14px 16px 18px}
.diag__deco{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.4}
.diag__deco::before{content:"";position:absolute;left:-10%;top:50%;width:130%;height:1.5px;
  background:var(--border);transform:rotate(var(--angle,-6deg))}
.diag__ctrls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:18px}
.diag__ctrls button{width:44px;height:44px;border-radius:999px;border:1px solid var(--border);
  background:#fff;cursor:pointer;display:grid;place-items:center;font-size:1.2rem}
.diag__count{font-size:.82rem;letter-spacing:.16em;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- Circles / Tall cards ---- */
.circles{display:flex;gap:clamp(14px,4vw,26px);overflow-x:auto;
  padding-block:6px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.circle{scroll-snap-align:center;flex:0 0 auto;display:flex;flex-direction:column;
  align-items:center;gap:9px;text-decoration:none;color:inherit;background:none;border:0;
  cursor:pointer;padding:0}
.circle__disc{width:var(--cs,104px);height:var(--cs,104px);border-radius:50%;
  position:relative;overflow:hidden;border:2px solid var(--border);background:var(--sand);
  transition:transform .18s,border-color .18s}
.circle:hover .circle__disc{transform:scale(1.04);border-color:var(--wine)}
.circle__disc img{width:100%;height:100%;object-fit:cover}
.circle__label{font-size:.82rem;font-weight:600;text-align:center;
  max-width:calc(var(--cs,104px) + 16px);line-height:1.25}

.talls{display:grid;gap:var(--gap);grid-template-columns:1fr}
@media(min-width:700px){.talls{grid-template-columns:1fr 1fr}}
.tall{position:relative;overflow:hidden;
  min-height:clamp(300px,52dvh,480px);display:flex;flex-direction:column;
  justify-content:flex-end;padding:clamp(18px,4.5vw,34px);
  text-decoration:none;color:inherit;background:var(--sand);border:1px solid var(--border)}
.tall--full{grid-column:1/-1;min-height:clamp(340px,64dvh,600px)}
.tall--text{background:var(--wine);color:#fff;justify-content:center}
.tall--text h3{color:#fff;font-size:clamp(1.4rem,5vw,2.4rem);max-width:14ch}
.tall__art{position:absolute;inset:0;z-index:0}
.tall__art img{width:100%;height:100%;object-fit:cover}
.tall__ov{position:relative;z-index:2}
.tall__ov h3{max-width:16ch}

/* ---- CTA / map ---- */
.cta-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
  padding-block:clamp(20px,5vw,40px)}
.map{position:relative;overflow:hidden;background:var(--sand);border:1px solid var(--border)}
.map iframe{width:100%;height:clamp(260px,44dvh,420px);border:0;display:block}
.map__foot{padding:8px 14px;font-size:.74rem;color:var(--muted);margin:0}

/* ---- Bento ---- */
.bento{display:grid;gap:var(--gap);grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(140px,auto)}
.bento__cell{position:relative;overflow:hidden;background:#fff;border:1px solid var(--border);
  display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  text-decoration:none;color:inherit;min-height:180px}
.bento__cell--lg{grid-column:span 2;grid-row:span 2;min-height:340px}
.bento__cell--tall{grid-row:span 2}
.bento__cell--wide{grid-column:span 2}
.bento__cell .art{position:absolute;inset:0;z-index:0}
.bento__image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bento__cell h3{position:relative;z-index:2;margin:0}
.bento__cell .bento__ov{position:relative;z-index:2;background:linear-gradient(to top,rgba(0,0,0,.55),transparent);
  margin:-14px;padding:14px;margin-top:auto;color:#fff}
@media(min-width:700px){
  .bento{grid-template-columns:repeat(4,1fr)}
  .bento__cell--lg{grid-column:span 2;grid-row:span 2}

}
/* ---- Testimonials ---- */
.testis{display:grid;gap:var(--gap);grid-template-columns:1fr}

.testi{background:#fff;border:1px solid var(--border);padding:22px;display:flex;flex-direction:column;gap:10px}

.testi__who{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid var(--border)}
.testi__av{width:38px;height:38px;border-radius:50%;background:var(--wine);color:#fff;
  display:grid;place-items:center;font-weight:700;font-family:var(--font-head);flex:0 0 auto}
.testi__name{font-weight:600;font-size:.9rem}
.testi__role{font-size:.78rem;color:var(--muted)}

/* ---- FAQ ---- */
.faq{display:grid;gap:8px;max-width:800px;margin:0 auto}
.faq__item{border:1px solid var(--border);background:#fff}
.faq__item summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center;min-height:52px;font-family:var(--font-head);font-size:1.02rem}
.faq__item summary::-webkit-details-marker{display:none}
.faq__item summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--wine);transition:transform .2s}
.faq__item[open] summary::after{transform:rotate(45deg)}
.faq__item p{padding:0 18px 18px;margin:0;color:var(--muted);line-height:1.6}

/* ---- Newsletter ---- */
.news{padding:clamp(30px,7vw,60px) clamp(20px,5vw,50px);
  background:var(--wine);color:#fff;text-align:center}
.news h2{color:#fff;max-width:20ch;margin-inline:auto}
.news p{color:rgba(255,255,255,.82);max-width:44ch;margin-inline:auto}
.news form{display:flex;gap:8px;max-width:440px;margin:20px auto 0;flex-wrap:wrap}
.news input{flex:1 1 200px;min-height:48px;border:0;border-radius:999px;padding:0 20px;background:#fff;color:var(--text)}
.news button{border:0;background:var(--wine-deep);color:#fff;min-height:48px;border-radius:999px;
  padding:0 26px;font-weight:650;cursor:pointer;font-family:inherit}
.news button:hover{background:#3d0f1c}
.news__msg{font-size:.85rem;margin-top:12px;color:rgba(255,255,255,.9);min-height:20px}

/* ---- Stats ---- */
.stats{display:grid;gap:var(--gap);grid-template-columns:repeat(2,1fr);text-align:center}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat__n{font-family:var(--font-head);font-size:clamp(1.6rem,6vw,3rem);color:var(--wine);line-height:1;margin:0 0 6px;font-weight:600}
.stat__l{font-size:.82rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:0}

/* ---- Logo strip ---- */
.logos{display:flex;flex-wrap:wrap;gap:clamp(16px,5vw,48px);align-items:center;
  justify-content:center;padding-block:clamp(16px,4vw,30px);opacity:.7}
.logos__item{font-family:var(--font-head);font-size:clamp(1rem,3vw,1.4rem);
  letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:600}

/* ---- Tabs ---- */
.tabs__nav{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.tabs__nav::-webkit-scrollbar{display:none}
.tabs__nav button{flex:0 0 auto;background:none;border:0;padding:12px 16px;font-weight:600;
  cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);min-height:44px;font-size:.92rem}
.tabs__nav button[aria-selected="true"]{color:var(--wine);border-bottom-color:var(--wine)}
.tabs__panel{padding-block:8px}

/* ---- Marquee images ---- */
.marq{overflow:hidden;overflow:clip;contain:paint;max-width:100%}
.marq__track{display:flex;gap:14px;width:max-content;animation:marq var(--dur,40s) linear infinite}
.marq[data-static="true"] .marq__track{animation:none;justify-content:center;width:100%}
.marq__item{flex:0 0 auto;width:clamp(140px,28vw,240px);aspect-ratio:1/1;position:relative;overflow:hidden;background:var(--sand)}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.marq__track{animation:none}}

/* ---- Bundle ---- */
.bundle{background:#fff;border:1px solid var(--border);padding:clamp(16px,4vw,28px);display:grid;gap:16px}
.bundle__items{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}

.bundle__item .pcard__media{aspect-ratio:1;margin-bottom:6px}
.bundle__price{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--border);padding-top:14px;flex-wrap:wrap}

/* ---- Footer ---- */
.ftr{background:var(--wine-deep);color:#F6EADC;margin-top:clamp(30px,7vw,60px);
  padding-block:clamp(30px,7vw,56px) calc(var(--safe-b) + 22px)}
.ftr a{color:#F6EADC;text-decoration:none}
.ftr a:hover{text-decoration:underline}
.ftr__grid{display:grid;gap:clamp(18px,5vw,44px);grid-template-columns:1fr}

.ftr__head{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;

.ftr__acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;min-height:44px;font-size:.78rem;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(246,234,220,.62)}
.ftr__acc summary::-webkit-details-marker{display:none}
.ftr__acc summary::after{content:"+";font-size:1rem}
.ftr__acc[open] summary::after{content:"–"}
.ftr__acc ul{list-style:none;margin:0 0 1em;padding:0;display:grid;gap:2px}
.ftr__desk{list-style:none;margin:0 0 1em;padding:0;display:grid;gap:2px}
@media(max-width:699px){.ftr__desk{display:none}.ftr__head{display:none}}
@media(min-width:700px){.ftr__acc{display:none}}
.ftr li a{display:flex;align-items:center;min-height:38px;font-size:.93rem}
.ftr__bottom{border-top:1px solid rgba(246,234,220,.18);margin-top:clamp(20px,5vw,36px);
  padding-top:18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;
  font-size:.8rem;color:rgba(246,234,220,.66)}
.ftr__social{display:flex;gap:8px;flex-wrap:wrap}
.ftr__social a{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;
  border:1px solid rgba(246,234,220,.3)}

/* ---- Screens ---- */
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.bar__back{display:inline-flex;align-items:center;gap:7px;min-height:44px;
  padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--border);

.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:.55em 1.1em;border-radius:999px;border:1px solid var(--border);
  background:#fff;text-decoration:none;color:inherit;font-size:.86rem;min-height:40px;
  display:inline-flex;align-items:center;font-weight:600}
.chip[aria-current="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-block:14px}
.toolbar input[type=search],.toolbar select{min-height:44px;border-radius:999px;
  border:1px solid var(--border);background:#fff;padding:0 16px;min-width:0;flex:1 1 160px}
.empty{padding:48px 20px;text-align:center;color:var(--muted);
  border:1px dashed var(--border)}
.prose{max-width:70ch}
.prose h2{margin-top:1.4em}
.prose p{font-size:1.02rem}
.category-page__intro{padding-block:clamp(32px,7vw,76px) 26px}
.category-page__intro h1{font-size:clamp(2.2rem,6vw,4.6rem);margin:.12em 0}
.category-page__image{height:clamp(180px,32vw,360px);margin-bottom:28px;overflow:hidden;background:var(--sand)}

.category-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.category-tile{position:relative;min-height:180px;overflow:hidden;display:flex;align-items:flex-end;
  padding:16px;text-decoration:none;color:#fff;background:#263b46}
.category-tile__image{position:absolute;inset:0;background:linear-gradient(145deg,hsl(var(--category-hue) 32% 62%),hsl(var(--category-hue) 34% 28%))}
.category-tile__image::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.62),rgba(0,0,0,0) 72%)}
.category-tile__image img{width:100%;height:100%;object-fit:cover}
.category-tile__name{position:relative;font-weight:650;font-size:1.08rem}
.category-tile__arrow{position:absolute;right:16px;bottom:16px}
.category-page__products .sec-head h2{margin:0}
@media(min-width:620px){.category-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.category-tile{min-height:240px}}
@media(min-width:980px){.category-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.category-tile{min-height:280px}}
.category-showcase__grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(130px,22vw));gap:12px}
.category-showcase__tile{position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px;color:#fff;text-decoration:none;background:#333}
.category-showcase__tile:first-child{grid-row:span 2}
.category-showcase__tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.category-showcase__tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.58),transparent 70%)}
.category-showcase__tile span,.category-showcase__tile i{position:relative;z-index:1;font-style:normal;font-weight:650}
.category-showcase__tile i{margin-left:auto}
.category-showcase__tile:hover img{transform:scale(1.035)}
.category-showcase__grid--row{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(150px,25vw)}
.category-showcase__grid--row .category-showcase__tile:first-child{grid-row:auto}
.brand-wordmark{overflow:hidden;text-align:center;font-size:clamp(4rem,18vw,18rem);line-height:.8;letter-spacing:-.075em;font-weight:300;white-space:nowrap;color:var(--wine)}
/* ---- Product detail ---- */
.pdp{display:grid;gap:clamp(16px,4vw,32px);grid-template-columns:1fr}
@media(min-width:800px){.pdp{grid-template-columns:1fr 1fr;align-items:start}}
.pdp__media{position:relative;aspect-ratio:1;background:var(--sand);overflow:hidden}
.pdp__media img{width:100%;height:100%;object-fit:cover}
.pdp__body{padding-block:6px}
.pdp__price{font-size:1.4rem;font-weight:650;display:flex;gap:10px;align-items:baseline;margin:8px 0}
.pdp__price s{font-size:.8em;color:var(--muted);font-weight:400}
.pdp__price ins{text-decoration:none;color:var(--wine)}
.opt{margin-block:18px}
.opt__label{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;font-weight:700}
.opt__swatches{display:flex;gap:8px;flex-wrap:wrap}
.opt__swatch{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);
  background:var(--swatch,#ccc);cursor:pointer;padding:0;position:relative}
.opt__swatch[aria-pressed="true"]{border-color:var(--wine);
  box-shadow:0 0 0 2px #fff inset,0 0 0 4px var(--wine) inset}

.opt__sizes{display:flex;gap:8px;flex-wrap:wrap}
.opt__size{min-width:48px;height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--border);
  background:#fff;cursor:pointer;font-weight:600;font-size:.9rem}
.opt__size[aria-pressed="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}
.opt__size:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.qty{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.qty button{width:44px;height:44px;background:#fff;border:0;cursor:pointer;font-size:1.1rem}
.qty input{width:50px;height:44px;border:0;text-align:center;font-weight:600}

/* ---- Toast ---- */
.toast-wrap{position:fixed;bottom:calc(20px + var(--safe-b));left:50%;transform:translateX(-50%);
  z-index:500;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--wine);color:#fff;padding:12px 20px;border-radius:999px;
  font-size:.86rem;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.3);
  animation:tin .25s ease, tout .25s ease 2.6s forwards}
@keyframes tin{from{opacity:0;transform:translateY(20px)}}
@keyframes tout{to{opacity:0;transform:translateY(20px)}}

/* ---- Studio (same as before) ---- */

  display:none;flex-direction:column;padding-top:var(--safe-t)}

.st__tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;order:3}
.st__tabs::-webkit-scrollbar{display:none}
.st__tabs button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;
  border:1px solid transparent;background:transparent;cursor:pointer;font-size:.84rem;
  font-weight:600;color:var(--muted)}
.st__tabs button[aria-selected="true"]{background:var(--wine);color:#fff}
.st__status{font-size:.76rem;padding:5px 11px;border-radius:999px;

.st__pane{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;min-width:0}
.st__pane--list{border-right:1px solid var(--border);background:#fff}

@media(max-width:899px){
  .st__body[data-view="list"] .st__pane--prev,.st__body[data-view="list"] .st__pane--insp{display:none}
  .st__body[data-view="prev"] .st__pane--list,.st__body[data-view="prev"] .st__pane--insp{display:none}
  .st__body[data-view="insp"] .st__pane--list,.st__body[data-view="insp"] .st__pane--prev{display:none}
}
.st__views{display:flex;gap:4px;order:2}
@media(min-width:900px){.st__views{display:none}}

@media(max-width:899px){

}
@media(max-width:480px){.st__title{display:none}}
.st__preview{background:var(--sand-pale);min-height:100%}

.sitem{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;
  border:1px solid var(--border);background:#fff;margin-bottom:7px;cursor:pointer;font-size:.85rem}
.sitem[aria-current="true"]{border-color:var(--wine);box-shadow:0 0 0 1px var(--wine) inset}
.sitem[data-hidden="true"]{opacity:.5}
.sitem__name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-weight:600}
.sitem__type{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.fld{margin-bottom:13px}

.st__group{border:1px solid var(--border);border-radius:12px;

    .map(v => hex6(v, "").toLowerCase())
    .filter(v => v && v !== "#ffffff");
  return new Set(vals).size <= 1;
}
function colorsFromSwatches(swatches, themeColor) {
  const uniq = [];
  const seen = new Set();
  for (const raw of [themeColor, ...(Array.isArray(swatches) ? swatches : [])]) {
    const h = hex6(raw, "");
    if (!h) continue;
    const key = h.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    uniq.push(h);
  }
  if (!uniq.length) return null;
  const scored = uniq.map(h => ({ h, L: lumOf(h), S: satOf(h) }));
  const darks = scored.filter(x => x.L < 0.35).sort((a, b) => a.L - b.L);
  const lights = scored.filter(x => x.L > 0.72).sort((a, b) => b.L - a.L);
  const mids = scored.filter(x => x.L >= 0.35 && x.L <= 0.72).sort((a, b) => b.S - a.S);
  const accent = [...mids, ...darks].sort((a, b) => b.S - a.S)[0]
    || scored.slice().sort((a, b) => b.S - a.S)[0];
  const wine = themeColor && hex6(themeColor, "") ? hex6(themeColor) : (accent?.h || scored[0].h);
  const wineDeep = darks.find(x => x.h.toLowerCase() !== wine.toLowerCase())?.h || darkenHex(wine, 0.28);
  const sand = lights[1]?.h || lights[0]?.h || mids.find(x => x.h.toLowerCase() !== wine.toLowerCase())?.h || "#F3E7D5";
  const sandPale = lights[0]?.h || "#FBF7F0";
  const text = darks[0]?.h || "#1A1A1A";
  const muted = scored.slice().sort((a, b) => Math.abs(a.L - 0.45) - Math.abs(b.L - 0.45))[0]?.h || "#6E6267";
  return { wine, wineDeep, sand, sandPale, white: "#FFFFFF", text, muted };
}
function fontsForLibraryTheme(theme, seed) {
  const hint = `${theme?.category || ""} ${theme?.title || ""}`.toLowerCase();
  let headId = "jakarta", bodyId = "inter";
  if (/luxe|luxury|fashion|parfum|beauty|atelier|maison|editorial|haute/.test(hint)) {
    headId = "antique"; bodyId = "manrope";
  } else if (/electron|tech|auto|sport|kinetic|volt/.test(hint)) {
    headId = "bricolage"; bodyId = "inter";
  } else if (/food|restaurant|market|fresh|grocery|minimarket|woodfire/.test(hint)) {
    headId = "manrope"; bodyId = "inter";
  } else {
    headId = FONTS[seed % FONTS.length]?.id || "jakarta";
  }
  return {
    head: FONTS.find(f => f.id === headId)?.stack || FONTS[0].stack,
    body: FONTS.find(f => f.id === bodyId)?.stack || FONTS[5].stack
  };
}
function lookTokensFromLibraryTheme(theme) {
  if (!theme) return null;
  const colors = colorsFromSwatches(theme.colors, theme.themeColor);
  if (!colors) return null;
  const seed = hash(String(theme.file || theme.title || "theme"));
  const rawShapes = Array.isArray(DRAFT?.library?.shapeLibrary) ? DRAFT.library.shapeLibrary : CARD_SHAPES;
  const shapes = [...new Set(rawShapes.map(s => SHAPE_ALIAS[s] || (CARD_SHAPES.includes(s) ? s : null)).filter(Boolean))];
  const pool = shapes.length ? shapes : ["standard", "arch", "pill"];
  return {
    colors,
    radius: 8 + (seed % 17),
    cardShape: pool[seed % pool.length],
    fonts: fontsForLibraryTheme(theme, seed)
  };
}
/** Mutates DRAFT.theme look tokens only — never catalog or page content. */
function applyLookTokensToDraft(tokens) {
  if (!tokens?.colors || !DRAFT?.theme) return false;
  DRAFT.theme.colors = { ...DRAFT.theme.colors, ...tokens.colors };
  if (tokens.radius != null) DRAFT.theme.radius = Number(tokens.radius);
  if (tokens.cardShape && CARD_SHAPES.includes(tokens.cardShape)) DRAFT.theme.cardShape = tokens.cardShape;
  if (tokens.fonts) DRAFT.theme.fonts = { ...DRAFT.theme.fonts, ...tokens.fonts };
  applyTheme(DRAFT.theme);
  return true;
}
/* =========================================================================
   ART — deterministic inline SVG placeholder
   ========================================================================= */
function art(hue, seed, variant) {
  const h = ((Number(hue) || 340) % 360 + 360) % 360;
  const n = hash(String(seed || "art"));
  const v = ((variant ?? 0) + n) % 3;
  const bg  = `hsl(${h} 30% 88%)`;
  const fg1 = `hsl(${h} 40% 62%)`;
  const fg2 = `hsl(${(h + 30) % 360} 35% 42%)`;
  const a = 20 + (n % 30);
  const b = 40 + (n % 40);
  const c = 15 + (n % 20);
  let shape = "";
  if (v === 0) {
    shape = `<circle cx="${a}%" cy="${b}%" r="${c}%" fill="${fg1}"/>
             <circle cx="${100-a}%" cy="${100-b}%" r="${c*0.8}%" fill="${fg2}" opacity=".7"/>`;
  } else if (v === 1) {
    shape = `<path d="M0,${b} Q${a},${b-15} 100,${b+5} L100,100 L0,100 Z" fill="${fg1}"/>
             <circle cx="${100-a}%" cy="${a}%" r="${c}%" fill="${fg2}" opacity=".6"/>`;
  } else {
    shape = `<rect x="${a}%" y="${a}%" width="${c*1.4}%" height="${c*1.4}%" rx="20%" fill="${fg1}" transform="rotate(${(n%40)-20} 50 50)"/>
             <circle cx="${100-a}%" cy="${b}%" r="${c*0.7}%" fill="${fg2}" opacity=".6"/>`;
  }
  return `<div class="art" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="presentation">
    <rect width="100" height="100" fill="${bg}"/>${shape}</svg></div>`;
}

function cartCount(){ return cart.reduce((s, i) => s + i.qty, 0); }
function cartTotal(){ return cart.reduce((s, i) => s + i.qty * i.price, 0); }
function addToCart(product, opts = {}) {
  const qty = Math.max(1, Number(opts.qty) || 1);
  const variant = opts.variant || {};
  const key = product.id + "|" + JSON.stringify(variant);
  const existing = cart.find(i => i.key === key);
  if (existing) existing.qty += qty;
  else cart.push({
    key, productId: product.id, slug: product.slug, name: product.name,
    price: Number(opts.price ?? product.salePrice ?? product.price),
    hue: variant.hue ?? product.hue,
    variantLabel: opts.variantLabel || "",
    variant: variant, qty
  });
  saveCart();
  renderCartBadge();
  toast(product.name + " added to bag");
}
function removeFromCart(key) {
  cart = cart.filter(i => i.key !== key);
  saveCart(); renderCartBadge(); renderCart();
}
function updateCartQty(key, qty) {
  qty = Math.max(0, Number(qty) || 0);
  const item = cart.find(i => i.key === key);
  if (!item) return;
  if (qty === 0) return removeFromCart(key);
  item.qty = qty;
  saveCart(); renderCartBadge(); renderCart();
}
function renderCartBadge() {
  const b = $("#cartBadge");
  const n = cartCount();
  b.hidden = n === 0;
  b.textContent = n;
}
function renderCart() {
  const body = $("#cartBody"), foot = $("#cartFoot");
  if (!cart.length) {
    body.innerHTML = `<div class="cart__empty">
      <p>${esc(T("cartEmpty"))}</p>
      <a class="btn btn--ghost btn--sm" href="#/products" onclick="closeCart()">${esc(T("browse"))}</a>
    </div>`;
    foot.innerHTML = "";
    return;
  }
  body.innerHTML = cart.map(i => `
    <div class="cart__row">
      <div class="cart__thumb">${art(i.hue, i.slug, 0)}</div>
      <div class="cart__meta">
        <p class="cart__name">${esc(i.name)}</p>
        ${i.variantLabel ? `<p class="cart__variant">${esc(i.variantLabel)}</p>` : ""}
        <div class="cart__qty">
          <button type="button" data-cq="${esc(i.key)}" data-q="${i.qty - 1}" aria-label="Decrease quantity">−</button>
          <input type="number" min="1" value="${i.qty}" data-cqi="${esc(i.key)}" aria-label="Quantity">
          <button type="button" data-cq="${esc(i.key)}" data-q="${i.qty + 1}" aria-label="Increase quantity">+</button>
        </div>
        <button type="button" class="cart__remove" data-cr="${esc(i.key)}">Remove</button>
      </div>
      <div class="cart__price">${money(i.qty * i.price)}</div>
    </div>`).join("");
  foot.innerHTML = `
    <div class="cart__total"><span>${esc(T("subtotal"))}</span><span>${money(cartTotal())}</span></div>
    <p class="mini" style="margin:0 0 8px">Shipping calculated at checkout. Tax included where applicable.</p>
    <button class="btn btn--block" type="button" id="btnCheckout">${esc(T("checkout"))}</button>
    <p class="mini" style="margin-top:8px;text-align:center">${esc(T("demoNote"))}</p>`;

  $$("[data-cq]", body).forEach(b => b.addEventListener("click", () => updateCartQty(b.dataset.cq, Number(b.dataset.q))));
  $$("[data-cqi]", body).forEach(inp => inp.addEventListener("change", () => updateCartQty(inp.dataset.cqi, inp.value)));
  $$("[data-cr]", body).forEach(b => b.addEventListener("click", () => removeFromCart(b.dataset.cr)));
  $("#btnCheckout").addEventListener("click", () => {
    toast("Checkout is a demo — no real payment is taken.");
  });
}
function openCart(){ $("#cartDrawer").dataset.open = "true"; $("#backdrop").dataset.open = "true"; renderCart(); document.body.style.overflow = "hidden"; }
function closeCart(){ $("#cartDrawer").dataset.open = "false"; $("#backdrop").dataset.open = "false"; document.body.style.overflow = ""; }

  const inp = $("#searchInput"), out = $("#searchBody");

    const prods = PUB.products.filter(p => p.published &&

      <form id="newsForm" data-news>
        <input type="email" name="email" placeholder="${esc(p.placeholder || "you@example.com")}" aria-label="Email address" required>

      <p class="news__msg" data-news-msg aria-live="polite"></p>

  },
  "stats-row"(p) {
    const items = Array.isArray(p.items) ? p.items : [];
    if (!items.length) return emptyRow(p.title);
    return `<div class="wrap">
      ${p.title ? `<div class="sec-head"><h2 style="margin:0 auto;text-align:center">${esc(p.title)}</h2></div>` : ""}

  "logo-strip"(p) {

  "tabs-content"(p) {
    const tabs = Array.isArray(p.tabs) ? p.tabs : [];

  "marquee-images"(p) {

      </div></div>`;
  },
  "product-bundle"(p) {
    const ids = Array.isArray(p.productIds) ? p.productIds : [];
    const items = ids.map(id => PUB.products.find(x => x.id === id)).filter(Boolean);
    if (!items.length) return emptyRow(p.title);
    const orig = items.reduce((s, i) => s + (i.salePrice ?? i.price), 0);
    const disc = clamp(Number(p.discount) || 0, 0, 50) / 100;
    const finalPrice = orig * (1 - disc);
    return `<div class="wrap">
      <div class="sec-head"><h2 style="margin:0">${esc(p.title || "Bundle")}</h2></div>
      <div class="bundle">
        ${p.body ? `<p class="lead" style="margin:0">${esc(p.body)}</p>` : ""}
        <div class="bundle__items">
          ${items.map(x => `<a class="bundle__item" href="#/p/${esc(x.slug)}">

            <span style="font-size:1.3rem;font-weight:700">${money(finalPrice)}</span>

              <span class="badge" style="position:static;display:inline-block;margin-left:8px">−${Math.round(disc * 100)}%</span>` : ""}

  "ticker"(p) {
    const phrases = String(p.phrases || "").split("·").map(t => t.trim()).filter(Boolean);

    return `<div class="ticker" data-dir="${esc(p.direction || "left")}"
          data-static="${p.static ? "true" : "false"}"
          style="--dur:${clamp(Number(p.speed) || 28, 4, 120)}s;--ls:${esc(p.ls || ".02")}em;
                 background:${esc(p.bg || "#76243A")};color:${esc(p.fg || "#fff")}">

  },
  "promo-fullscreen"(p) {
    return `<div class="promo" style="background:${esc(p.bg || "#76243A")};color:${esc(p.fg || "#fff")}">
      <div class="promo__deco" aria-hidden="true"></div>
      <div class="wrap">
        ${p.label ? `<p class="eyebrow" style="color:rgba(255,255,255,.72)">${esc(p.label)}</p>` : ""}

  "fullscreen-image"(p) {

      ? `<img src="${esc(p.media)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:${esc(p.fit || "cover")}">`
      : art(16, "fs", 1);
    return `<div class="fsmedia" style="background:${esc(p.bg || "#541727")}">
      ${media}
      ${p.heading || p.body ? `<div class="fsmedia__ov"><div class="wrap" style="padding:0">
        ${p.heading ? `<h2 style="color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)">${esc(p.heading)}</h2>` : ""}
        ${p.body ? `<p style="color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)">${esc(p.body)}</p>` : ""}
      </div></div>` : ""}
    </div>`;
  },
  "diagonal-swiper"(p) {
    const items = productSource(p).slice(0, 12);
    if (!items.length) return emptyRow(p.title);
    return `<div class="diag" data-diag
      data-angle="${esc(p.angle || "-6")}"
      data-dir="${esc(p.direction || "slash")}"
      data-autoplay="${p.autoplay ? 1 : 0}"
      data-speed="${clamp(Number(p.speed) || 4200, 1500, 12000)}"
      data-loop="${p.loop ? 1 : 0}"
      style="--angle:${esc(p.angle || "-6")}deg">
      <div class="wrap">
        <div class="sec-head">
          <h2 style="margin:0">${esc(p.title || "Featured")}</h2>
          ${p.showCount ? `<span class="diag__count" data-diag-count>01 / ${String(items.length).padStart(2, "0")}</span>` : ""}
        </div>
        <div class="diag__stage" data-diag-stage tabindex="0" role="group"
             aria-roledescription="carousel" aria-label="${esc(p.title || "Featured products")}">
          <div class="diag__deco" aria-hidden="true"></div>
          ${items.map((x, i) => `
            <div class="diag__slide" data-i="${i}" aria-hidden="${i ? "true" : "false"}">
              <a class="diag__card" href="#/p/${esc(x.slug)}">
                <div class="diag__media">${x.media
                  ? `<img src="${esc(x.media)}" alt="${esc(x.name)}" loading="lazy">`
                  : art(x.hue, x.id, x.art && x.art.shape)}</div>
                <div class="diag__body">
                  <p class="pcard__cat">${esc(catName((x.categoryIds || [])[0]))}</p>
                  <h3 style="margin:2px 0 4px;font-size:1.12rem">${esc(x.name)}</h3>
                  <div class="pcard__price">${x.salePrice
                    ? `<ins>${money(x.salePrice)}</ins><s>${money(x.price)}</s>`
                    : money(x.price)}</div>
                </div>
              </a>
            </div>`).join("")}
        </div>
        ${p.showCtrls ? `<div class="diag__ctrls">
          <button type="button" data-diag-prev aria-label="Previous product">‹</button>
          <button type="button" data-diag-next aria-label="Next product">›</button>
          ${p.autoplay ? `<button type="button" data-diag-pause aria-label="Pause">❚❚</button>` : ""}
        </div>` : ""}
      </div></div>`;
  },
  "category-circles"(p) {
    const root = PUB.categories.find(c => !c.parentId);
    const list = PUB.categories
      .filter(c => c.published && (p.source === "all"
        || (p.source === "children" ? c.parentId === root?.id : !c.parentId)))
      .slice(0, clamp(Number(p.limit) || 8, 1, 20));
    if (!list.length) return "";
    return `<div class="wrap">
      <div class="sec-head"><h2 style="margin:0">${esc(p.title || "Browse")}</h2></div>
      <div class="circles" style="--cs:${clamp(Number(p.size) || 104, 72, 160)}px">
        ${list.map(c => `<a class="circle" href="#/c/${esc(c.slug)}">
          <span class="circle__disc">${c.media
            ? `<img src="${esc(c.media)}" alt="">`
            : art(c.hue, c.id, 0)}</span>
          <span class="circle__label">${esc(c.name)}</span></a>`).join("")}
      </div></div>`;
  },
  "tall-cards"(p) {
    const cards = Array.isArray(p.cards) ? p.cards : [];
    if (!cards.length) return "";
    return `<div class="wrap"><div class="talls">
      ${cards.map(c => {
        const cls = `tall ${c.width === "full" ? "tall--full" : ""} ${c.tone === "text" ? "tall--text" : ""}`;
        const artHtml = c.tone === "text" ? ""
          : `<div class="tall__art">${c.media
              ? `<img src="${esc(c.media)}" alt="">`
              : art(c.hue || 340, c.id, 1)}</div>`;
        const inner = `${artHtml}<div class="tall__ov">
          ${c.eyebrow ? `<p class="eyebrow" style="color:${c.tone === "text" ? "rgba(255,255,255,.75)" : "var(--wine)"}">${esc(c.eyebrow)}</p>` : ""}
          <h3>${esc(c.heading || "")}</h3>
          ${c.body ? `<p style="max-width:40ch">${esc(c.body)}</p>` : ""}
          ${c.ctaLabel ? `<span class="btn btn--sm ${c.tone === "text" ? "btn--light" : ""}">${esc(c.ctaLabel)}</span>` : ""}
        </div>`;
        return c.ctaHref ? `<a class="${cls}" href="${esc(c.ctaHref)}">${inner}</a>`
                         : `<div class="${cls}">${inner}</div>`;
      }).join("")}
    </div></div>`;
  },
  "cta-pills"(p) {
    return `<div class="wrap"><div class="cta-row">
      <a class="pill" href="#/products">${esc(p.productLabel || "All Products")}</a>
      <a class="pill pill--alt" href="#/categories">${esc(p.categoryLabel || "All Categories")}</a>
    </div></div>`;
  },
  "map"(p) {
    if (!p.show) return "";
    const lat = Number(p.lat) || 51.5265;
    const lon = Number(p.lon) || -0.0813;
    const d   = Number(p.zoom) || 0.006;
    const bbox = [lon - d, lat - d / 2, lon + d, lat + d / 2].map(n => n.toFixed(5)).join("%2C");
    return `<div class="wrap">
      <div class="sec-head"><div>
        <h2 style="margin:0">${esc(p.title || "Find us")}</h2>
        ${p.body ? `<p class="lead" style="margin:6px 0 0">${esc(p.body)}</p>` : ""}
      </div>
      <a class="btn btn--ghost btn--sm" target="_blank" rel="noopener"
         href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=17/${lat}/${lon}">Directions</a></div>
      <div class="map">
        <iframe title="Map showing ${esc(p.title || "our location")}" loading="lazy"
          src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${lat}%2C${lon}"></iframe>
        <p class="map__foot">${p.address ? esc(p.address) + " · " : ""}Map data ©
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</p>
      </div></div>`;
  },
  "rich-text"(p) {
    return `<div class="wrap prose"><h2>${esc(p.heading || "")}</h2>${p.html || ""}</div>`;
  },
  "brand-wordmark"(p) {
    return `<div class="brand-wordmark" aria-label="${esc(p.text || "")}">${esc(p.text || "")}</div>`;
  }
};

/* helpers */
function split(p) {
  const media = p.media
    ? `<img src="${esc(p.media)}" alt="" style="width:100%;height:100%;object-fit:cover">`
    : art(20 + (hash(p.heading || "s") % 60), p.heading || "split", 0);
  const cls = p.arrangement === "img-right" ? "split--img-right"
            : p.arrangement === "img-top"   ? ""
            : "split--img-left";
  return `<div class="wrap"><div class="split ${cls}" style="--ar:${esc(p.ar || "4/3")}">
    <div class="split__media">${media}</div>
    <div class="split__body">
      ${p.eyebrow ? `<p class="eyebrow" style="margin:0">${esc(p.eyebrow)}</p>` : ""}
      <h2 style="margin:0">${esc(p.heading || "")}</h2>
      ${p.body ? `<p class="lead" style="margin:0">${esc(p.body)}</p>` : ""}
      ${p.ctaLabel ? `<p style="margin:14px 0 0"><a class="btn" href="${esc(p.ctaHref || "#/products")}">${esc(p.ctaLabel)}</a></p>` : ""}
    </div></div></div>`;
}
function emptyRow(title) {
  return `<div class="wrap"><h2>${esc(title || "")}</h2><p class="empty">No content in this source yet.</p></div>`;
}
function catName(id) {
  const c = PUB.categories.find(x => x.id === id);
  return c ? c.name : "";
}
function productSource(p) {
  const all = PUB.products.filter(x => x.published);
  const categoryExists = PUB.categories.some(category =>
    category.id === p.categoryId && category.published);
  if (p.categoryId && categoryExists) {
    return all.filter(x => (x.categoryIds || []).includes(p.categoryId));
  }
  return all;
}
function sortProducts(list, mode) {
  const c = [...list];
  if (mode === "price-asc")  c.sort((a, b) => (a.salePrice ?? a.price) - (b.salePrice ?? b.price));
  else if (mode === "price-desc") c.sort((a, b) => (b.salePrice ?? b.price) - (a.salePrice ?? a.price));
  else if (mode === "name") c.sort((a, b) => a.name.localeCompare(b.name));
  else c.sort((a, b) => (a.position || 0) - (b.position || 0) || a.name.localeCompare(b.name));
  return c;
}
function card(p, opts = {}) {
  const cat = catName((p.categoryIds || [])[0]);
  const media = p.media
    ? `<img src="${esc(p.media)}" alt="${esc(p.name)}" loading="lazy">`
    : art(p.hue, p.id, p.art && p.art.shape);
  const price = p.salePrice
    ? `<span class="pcard__price"><ins>${money(p.salePrice)}</ins><s>${money(p.price)}</s></span>`
    : `<span class="pcard__price">${money(p.price)}</span>`;
  const swatches = Array.isArray(p.colors) && p.colors.length > 1
    ? `<span class="pcard__swatch">${p.colors.slice(0, 4).map(c => `<span style="background:${esc(c.hex)}"></span>`).join("")}</span>` : "";
  return `<a class="pcard" href="#/p/${esc(p.slug)}" style="--par:${esc(opts.par || "1/1")}">
    <div class="pcard__media">${media}${p.badge ? `<span class="badge">${esc(p.badge)}</span>` : ""}${swatches}</div>
    <div class="pcard__body">
      ${opts.showCat && cat ? `<span class="pcard__cat">${esc(cat)}</span>` : ""}
      <h3 class="pcard__name">${esc(p.name)}</h3>
      ${price}
    </div></a>`;
}

function renderSection(s, force) {
  if (!s.visible && !force) return "";
  const fn = SEC[s.type];
  if (!fn) return `<section class="sec"><div class="wrap"><p class="empty">Unknown section: ${esc(s.type)}</p></div></section>`;
  const tight = ["hero-image","promo-fullscreen","fullscreen-image","ticker","cta-pills","announce"].includes(s.type);
  return `<section class="sec${tight ? " sec--tight" : ""}" data-sec="${s.id}" data-type="${s.type}">${fn(s.props || {}, s.id)}</section>`;
}
/* =========================================================================
   SCREENS
   ========================================================================= */
function screenHome() {
  const page = PUB.pages.find(p => p.type === "home");
  const secs = PUB.sections.filter(s => s.pageId === page.id && s.visible)
    .sort((a, b) => a.position - b.position);
  return secs.map(s => renderSection(s)).join("");
}
function screenCategory(slug) {
  const c = PUB.categories.find(x => x.slug === slug && x.published);
  if (!c) return screenNotFound("Category not found");
  const subs = PUB.categories.filter(x => x.parentId === c.id && x.published)
    .sort((a, b) => a.position - b.position);
  const items = PUB.products.filter(p => p.published && (p.categoryIds || []).includes(c.id));
  const parent = PUB.categories.find(x => x.id === c.parentId);
  const media = c.media ? `<img src="${esc(c.media)}" alt="">` : "";
  return `<div class="category-page">
    <div class="wrap bar"><a class="bar__back" href="#/">‹ Home</a>${parent ? `<a class="bar__back" href="#/c/${esc(parent.slug)}">${esc(parent.name)}</a>` : ""}</div>
    <header class="wrap category-page__intro">
      ${media ? `<div class="category-page__image">${media}</div>` : ""}
      <p class="eyebrow">${esc(PUB.settings.siteName)} COLLECTION</p>
      <h1>${esc(c.name)}</h1>
      ${c.description ? `<p class="lead">${esc(c.description)}</p>` : ""}
      ${subs.length ? `<p class="category-page__count">${subs.length} collections</p>` : items.length ? `<p class="category-page__count">${items.length} products</p>` : ""}
    </header>
    ${subs.length ? `<section class="wrap category-page__collections" aria-label="${esc(c.name)} collections">
      ${categoryTileGrid(subs)}
    </section>` : ""}
    ${items.length ? `<section class="wrap category-page__products">
      <div class="sec-head"><h2>${esc(c.name)} products</h2><span>${items.length} items</span></div>
      <div class="pgrid" style="--cols:2;--cols-sm:3;--cols-lg:4">${sortProducts(items, "position").map(p => card(p)).join("")}</div>
    </section>` : !subs.length ? `<div class="wrap"><div class="empty"><p>${esc(T("emptyCategory"))}</p></div></div>` : ""}
  </div>`;
}
function screenAllProducts() {
  const cats = PUB.categories.filter(c => c.published && !c.parentId);
  const all = PUB.products.filter(p => p.published);
  return `<div class="wrap bar"><a class="bar__back" href="#/">‹ Home</a></div>
    <div class="wrap"><h1>All Products</h1><p class="lead">${all.length} products</p></div>
    <div class="wrap">
      <div class="chips" role="tablist" aria-label="Filter by category">
        <a class="chip" href="#/products" aria-current="true">All</a>
        ${cats.map(c => `<a class="chip" href="#/c/${esc(c.slug)}">${esc(c.name)}</a>`).join("")}
      </div>
      <div class="toolbar">
        <label class="sr-only" for="apSearch">Search products</label>
        <input type="search" id="apSearch" placeholder="Search products…" autocomplete="off">
        <label class="sr-only" for="apSort">Sort</label>
        <select id="apSort">
          <option value="position">Sort: Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <div id="apResults">${gridHTML(all, "position")}</div>
    </div>`;
}
function gridHTML(list, sort) {
  if (!list.length) return `<div class="empty"><p>No products match.</p></div>`;
  return `<div class="pgrid" style="--cols:2;--cols-sm:3;--cols-lg:4">
    ${sortProducts(list, sort).map(p => card(p)).join("")}</div>`;
}
function screenAllCategories() {
  const roots = PUB.categories.filter(c => c.published && !c.parentId);
  const cats = roots.length === 1
    ? PUB.categories.filter(c => c.published && c.parentId === roots[0].id)
    : roots;
  return `<div class="wrap bar"><a class="bar__back" href="#/">‹ Home</a></div>
    <header class="wrap category-page__intro"><p class="eyebrow">${esc(PUB.settings.siteName)}</p><h1>Shop by category</h1>
      <p class="lead">Explore the collections and find what you’re looking for.</p></header>
    <section class="wrap category-page__collections" aria-label="Store categories">${categoryTileGrid(cats)}</section>`;
}
function categoryTileGrid(categories) {
  return `<div class="category-tiles">${categories.map(c => `<a class="category-tile" href="#/c/${esc(c.slug)}">
    <span class="category-tile__image" style="--category-hue:${Number(c.hue) || 220}">${c.media ? `<img src="${esc(c.media)}" alt="" loading="lazy">` : ""}</span>
    <span class="category-tile__name">${esc(c.name)}</span><span class="category-tile__arrow" aria-hidden="true">↗</span>
  </a>`).join("")}</div>`;
}
function screenProduct(slug) {
  const p = PUB.products.find(x => x.slug === slug && x.published);
  if (!p) return screenNotFound("Product not found");
  const cats = (p.categoryIds || []).map(catName).filter(Boolean).join(" · ");
  const colors = Array.isArray(p.colors) ? p.colors : [];
  const sizes = Array.isArray(p.sizes) ? p.sizes : [];
  const firstColor = colors[0];
  const hue = firstColor ? firstColor.hue : p.hue;
  const media = p.media
    ? `<img src="${esc(p.media)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover" data-pdp-media>`
    : `<div data-pdp-art>${art(hue, p.id, p.art && p.art.shape)}</div>`;
  const related = PUB.products.filter(x => x.published && x.id !== p.id &&

/* =========================================================================

const Motion = {
  stops: [],
  clear() { this.stops.forEach(f => { try { f(); } catch (e) {} }); this.stops = []; },
  mount(root) {
    $$("[data-car]", root).forEach(el => autoCarousel(el));
    $$("[data-diag]", root).forEach(el => diagonal(el));
    $$("[data-tabs]", root).forEach(el => bindTabs(el));
    $$("[data-news]", root).forEach(el => bindNewsletter(el));
    $$("[data-vctl]", root).forEach(b => b.addEventListener("click", () => {
      const sec = b.closest(".vhero"); const v = sec && sec.querySelector("video");
      if (!v) return;
      if (b.dataset.vctl === "play") { v.paused ? v.play() : v.pause(); }
      else { v.muted = !v.muted; b.textContent = v.muted ? "Unmute" : "Mute"; }
    }));
    $$(".announce button", root).forEach(b => b.addEventListener("click", () => b.closest(".announce").remove()));
  }
};

function bindTabs(el) {
  const btns = $$("[data-tab]", el);
  const panels = $$("[data-panel]", el);
  btns.forEach(b => b.addEventListener("click", () => {
    btns.forEach(x => x.setAttribute("aria-selected", String(x === b)));
    panels.forEach(p => p.hidden = p.dataset.panel !== b.dataset.tab);
  }));
}

function bindNewsletter(el) {
  el.addEventListener("submit", e => {
    e.preventDefault();
    const inp = el.querySelector("input[type=email]");
    const msg = el.parentElement.querySelector("[data-news-msg]");
    if (inp.value) {
      msg.textContent = "Thanks — you're on the list (demo).";
      inp.value = "";
    }
  });
}

function autoCarousel(el) {
  const track = el.querySelector(".car__track");
  if (!track) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const speed  = Number(el.dataset.speed) || 30;
  const dir    = el.dataset.dir === "right" ? 1 : -1;
  let offset = 0, half = 0, raf = null, last = 0, paused = el.dataset.autoplay !== "1";

  const measure = () => {
    half = track.scrollWidth / 2;
    if (dir === 1) offset = -half;
    apply();
  };
  const apply = () => { track.style.transform = `translate3d(${offset}px,0,0)`; };
  const step = ts => {
    raf = requestAnimationFrame(step);
    if (paused || reduce) { last = ts; return; }
    if (!last) last = ts;
    const dt = Math.min(64, ts - last); last = ts;
    offset += dir * (speed * dt / 1000);
    if (half > 0) {
      if (offset <= -half) offset += half;
      if (offset > 0)      offset -= half;
    }
    apply();
  };
  requestAnimationFrame(measure);
  if (!reduce) raf = requestAnimationFrame(step);
  const pauseBtn = el.closest(".wrap") && el.closest(".wrap").querySelector("[data-car-pause]");
  if (pauseBtn) pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "▶" : "❚❚";
  });
  if (el.dataset.pausehover === "1") {
    el.addEventListener("pointerenter", () => { paused = true; });
    el.addEventListener("pointerleave", () => { paused = false; });
  }
  const ro = new ResizeObserver(measure); ro.observe(track);
  Motion.stops.push(() => { cancelAnimationFrame(raf); ro.disconnect(); });
}

function diagonal(el) {
  const slides = $$(".diag__slide", el);
  if (!slides.length) return;
  const stage = el.querySelector("[data-diag-stage]");
  const counter = el.querySelector("[data-diag-count]");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const angle = parseFloat(el.dataset.angle) || -6;
  const slash = el.dataset.dir !== "backslash";
  let i = 0, timer = null, paused = false;

  function place() {
    slides.forEach((s, n) => {
      const d = n - i;
      const off = clamp(d, -3, 3);
      const sign = slash ? 1 : -1;
      const tx = off * 46 * sign;
      const ty = off * -34;
      const rot = off * angle * 0.55;
      const sc = d === 0 ? 1 : 0.86;
      s.style.transform = `translate3d(${tx}px, ${ty}px, 0) rotate(${rot}deg) scale(${sc})`;
      s.style.opacity = d === 0 ? "1" : (Math.abs(d) <= 2 ? String(0.32 - Math.abs(d) * 0.1) : "0");
      s.style.zIndex = String(10 - Math.abs(off));
      s.style.pointerEvents = d === 0 ? "auto" : "none";
      s.setAttribute("aria-hidden", d === 0 ? "false" : "true");
    });
    if (counter) counter.textContent = String(i + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
  }
  function go(n) {
    const loop = el.dataset.loop === "1";
    i = loop ? (n + slides.length) % slides.length : clamp(n, 0, slides.length - 1);
    place();
  }
  place();
  const next = () => go(i + 1), prev = () => go(i - 1);
  const nextBtn = el.querySelector("[data-diag-next]");
  const prevBtn = el.querySelector("[data-diag-prev]");
  const pauseBtn = el.querySelector("[data-diag-pause]");
  if (nextBtn) nextBtn.addEventListener("click", next);
  if (prevBtn) prevBtn.addEventListener("click", prev);
  if (pauseBtn) pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "▶" : "❚❚";
  });
  let sx = 0, sy = 0, dragging = false, locked = null;
  const onDown = e => { dragging = true; locked = null; sx = e.clientX; sy = e.clientY; };
  const onMove = e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (locked === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
  };
  const onUp = e => {
    if (!dragging) return; dragging = false;
    const dx = e.clientX - sx;
    if (locked === "x" && Math.abs(dx) > 40) (dx < 0 ? next() : prev());
    locked = null;
  };
  stage.addEventListener("pointerdown", onDown);
  stage.addEventListener("pointermove", onMove);
  stage.addEventListener("pointerup", onUp);
  stage.addEventListener("pointercancel", () => { dragging = false; });
  stage.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    if (e.key === "ArrowLeft")  { e.preventDefault(); prev(); }
  });
  if (el.dataset.autoplay === "1" && !reduce) {
    const ms = Number(el.dataset.speed) || 4200;
    timer = setInterval(() => { if (!paused && !document.hidden) next(); }, ms);
  }
  Motion.stops.push(() => {
    clearInterval(timer);
    stage.removeEventListener("pointerdown", onDown);
    stage.removeEventListener("pointermove", onMove);
    stage.removeEventListener("pointerup", onUp);
  });
}

function parseHash() { return (location.hash.replace(/^#/, "") || "/").split("/").filter(Boolean); }

function route() {
  const parts = parseHash();
  const main = $("#main");
  Motion.clear();
  let html = "", title = "Storefront";
  if (!parts.length)                        { html = screenHome();                title = "Home"; }
  else if (parts[0] === "products")         { html = screenAllProducts();         title = "All Products"; }
  else if (parts[0] === "categories")       { html = screenAllCategories();       title = "All Categories"; }
  else if (parts[0] === "c" && parts[1])    { html = screenCategory(parts[1]);    title = parts[1]; }
  else if (parts[0] === "p" && parts[1])    { html = screenProduct(parts[1]);     title = parts[1]; }
  else if (parts[0] === "page" && parts[1]) { html = screenPage(parts[1]);        title = parts[1]; }
  else { html = screenNotFound(); title = "Not found"; }
  main.innerHTML = html;
  const footer = $("#siteFooter");
  const wordmark = main.querySelector(".brand-wordmark");
  if (wordmark) {
    wordmark.remove();
    footer.innerHTML = renderFooter() + wordmark.outerHTML;
  } else {
    footer.innerHTML = renderFooter();
  }
  document.title = `${PUB.settings.siteName} — ${title}`;
  bindStorefront(main);
  Motion.mount(main);
  window.scrollTo({ top: 0, behavior: "auto" });
}

function bindStorefront(main) {
  const search = $("#apSearch", main), sort = $("#apSort", main);
  if (search && sort) {
    const list = PUB.products.filter(p => p.published);
    const apply = debounce(() => {
      const q = search.value.trim().toLowerCase();
      const filtered = q ? list.filter(p => (p.name + " " + (p.description || "")).toLowerCase().includes(q)) : list;
      $("#apResults").innerHTML = gridHTML(filtered, sort.value);
    }, 150);
    search.addEventListener("input", apply);
    sort.addEventListener("change", apply);
  }
  // bundle add
  $$("[data-add-bundle]", main).forEach(b => b.addEventListener("click", () => {
    const sec = b.closest(".sec");
    const cell = b.closest(".bundle");
    const items = cell.querySelectorAll(".bundle__item");
    // fallback: just toast
    toast("Bundle added (demo)");
  }));
  // PDP bindings
  bindPDP(main);
}

function bindPDP(main) {
  const wrap = main.querySelector(".pdp");
  if (!wrap) return;
  const parts = parseHash();
  const p = PUB.products.find(x => x.slug === parts[1]);
  if (!p) return;
  const colors = Array.isArray(p.colors) ? p.colors : [];
  const sizes = Array.isArray(p.sizes) ? p.sizes : [];
  let selColorI = 0, selSizeI = sizes.length ? 0 : -1;

  const colorBtns = $$("[data-color-i]", wrap);
  const sizeBtns  = $$("[data-size-i]", wrap);
  const colorLabel = wrap.querySelector("[data-color-label]");
  const artWrap = wrap.querySelector("[data-pdp-media-wrap]");

  const updateArt = () => {
    if (!artWrap) return;
    const hue = colors[selColorI] ? colors[selColorI].hue : p.hue;
    const img = artWrap.querySelector("img");
    if (img && p.media) return; // real media stays
    artWrap.innerHTML = art(hue, p.id + ":" + selColorI, p.art && p.art.shape);
  };

  colorBtns.forEach(b => b.addEventListener("click", () => {
    selColorI = Number(b.dataset.colorI);
    colorBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    if (colorLabel && colors[selColorI]) colorLabel.textContent = colors[selColorI].name;
    updateArt();
  }));
  sizeBtns.forEach(b => b.addEventListener("click", () => {
    selSizeI = Number(b.dataset.sizeI);
    sizeBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));

  const qtyIn = wrap.querySelector("[data-pdp-qty]");
  wrap.querySelector("[data-pdp-inc]").addEventListener("click", () => qtyIn.value = Number(qtyIn.value) + 1);
  wrap.querySelector("[data-pdp-dec]").addEventListener("click", () => qtyIn.value = Math.max(1, Number(qtyIn.value) - 1));

  wrap.querySelector("[data-pdp-add]").addEventListener("click", () => {
    const colorName = colors[selColorI] ? colors[selColorI].name : "";
    const sizeName  = sizes[selSizeI]  || "";
    const variantLabel = [colorName, sizeName].filter(Boolean).join(" · ");
    addToCart(p, {
      qty: Number(qtyIn.value) || 1,
      variant: { colorI: selColorI, sizeI: selSizeI, hue: colors[selColorI] ? colors[selColorI].hue : p.hue },
      variantLabel,
      price: p.salePrice ?? p.price
    });
    openCart();
  });
  wrap.querySelector("[data-pdp-wish]").addEventListener("click", () => {
    toast("Added to wishlist (demo)");
  });
}

function uploadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1400, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => reject(new Error("Couldn't read that image."));
    img.src = url;
  });
}

  sectionAction(act, id) {
    const list = DRAFT.sections.filter(s => s.pageId === "pg_home").sort((a, b) => a.position - b.position);
    const s = DRAFT.sections.find(x => x.id === id);
    if (!s) return;
    if (act === "up" || act === "down") {
      const i = list.indexOf(s), j = act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      list.forEach((x, n) => x.position = n);
    } else if (act === "vis")  { s.visible = s.visible ? 0 : 1; }
    else if (act === "dup")    {
      const c = clone(s); c.id = uid("s"); c.position = DRAFT.sections.length;
      DRAFT.sections.push(c); this.selectedSection = c.id;
    } else if (act === "del")  {
      if (!confirm("Delete this section?")) return;
      DRAFT.sections = DRAFT.sections.filter(x => x.id !== id);
    }
    DRAFT.sections.sort((a, b) => a.position - b.position).forEach((x, n) => x.position = n);
    dirty = true;
    this.render();
    this.autosave();
  },
