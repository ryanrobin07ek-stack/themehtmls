        '</div>';

      case 'notifications':
        return '<div class="card-panel">' +
          '<h2 class="panel-title">Notification preferences</h2>' +
          '<p class="panel-note">Preferences are not stored until a backend endpoint is connected.</p>' +
          '<div class="form-grid">' +
            '<div class="field field--full"><label><input type="checkbox"> Order updates</label></div>' +
            '<div class="field field--full"><label><input type="checkbox"> Newsletter</label></div>' +
            '<div class="field field--full"><label><input type="checkbox"> Product announcements</label></div>' +
          '</div>' +
          scaffoldForm('Notification preferences', '', 'Save preferences') +
        '</div>';

      case 'settings':
        return '<div class="card-panel">' +
          '<h2 class="panel-title">Account settings</h2>' +
          '<p class="panel-note">Connect CONFIG.authEndpoint to enable password and account changes.</p>' +
          scaffoldForm('Account settings',
            textField('ac-set-current', 'Current password', 'password', 'full') +
            textField('ac-set-new', 'New password', 'password', 'full'),
            'Update password') +
        '</div>';

      case 'wishlist':
        return '<div class="card-panel">' +
          '<h2 class="panel-title">Wishlist</h2>' +
          '<p class="panel-note">' + state.wishlist.length + ' saved product' + (state.wishlist.length === 1 ? '' : 's') + '.</p>' +
          '<a class="btn btn--outline" href="#/wishlist">Open wishlist</a>' +
        '</div>';

      default:
        return '<div class="card-panel">' + emptyState('Section not found', 'Choose a section from the menu.') + '</div>';
    }
  }

  function renderAccount(route) {
    const section = route.query.get('section') || 'signin';

    const nav = ACCOUNT_SECTIONS.map(function (entry) {
      const id = entry[0];
      const label = entry[1];
      return '<a href="#/account?section=' + id + '"' + (section === id ? ' class="is-active"' : '') + '>' + label + '</a>';
    }).join('');

    return '' +
      '<div class="container">' +
        '<header class="page-head">' +
          '<h1 class="page-title">Account</h1>' +
          '<p class="page-sub">Frontend scaffold — no authentication or profile storage exists yet.</p>' +
        '</header>' +
        '<div class="account-layout">' +
          '<nav class="account-nav" aria-label="Account sections">' + nav + '</nav>' +
          '<div>' + accountPanel(section) + '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------- MISC ---------- */
  function notFound(message) {
    return emptyState('Nothing here', message) +
      '<div class="section-foot"><a class="btn btn--outline" href="#/home">Back to home</a></div>';
  }

  function renderStudioPage(slug) {
    const pages = Array.isArray(STUDIO_DATA?.pages) ? STUDIO_DATA.pages : [];
    const page = pages.find(function (item) {
      return item.slug === slug && item.type === 'custom' && item.published !== 0;
    });
    if (!page) return '<div class="container">' + notFound('This page is not available.') + '</div>';
    const paragraphs = String(page.body || '').split(/\n{2,}/)
      .map(function (paragraph) { return '<p>' + esc(paragraph).replace(/\n/g, '<br>') + '</p>'; })
      .join('');
    return '<div class="container"><header class="page-head"><h1 class="page-title">' +
      esc(page.title || '') + '</h1></header><div class="prose">' + paragraphs + '</div></div>';
  }

  function updateStudioBrand() {
    const settings = STUDIO_DATA?.settings || {};
    const logo = document.querySelector('.logo-slot');
    const name = settings.siteName && settings.siteName !== 'Shop' ? settings.siteName : '';
    if (logo && (settings.logo || name)) {
      logo.classList.toggle('has-image', Boolean(settings.logo));
      logo.innerHTML = settings.logo
        ? '<img src="' + esc(settings.logo) + '" alt="' + esc(name || 'Store logo') + '">'
        : '<span class="logo-slot__wordmark">' + esc(name) + '</span>';
    }
    if (name) document.title = name;
  }

  function renderFooter() {
    const settings = STUDIO_DATA?.settings || {};
    const groups = Array.isArray(STUDIO_DATA?.footerGroups) ? STUDIO_DATA.footerGroups : [];
    if (groups.length) {
      const groupMarkup = groups.slice().sort(function (a, b) {
        return (Number(a.position) || 0) - (Number(b.position) || 0);
      }).map(function (group) {
        const links = (group.links || []).filter(function (link) { return link.visible !== 0; })
          .sort(function (a, b) { return (Number(a.position) || 0) - (Number(b.position) || 0); });
        const href = function (link) {
          if (link.type === 'page') return '#/page/' + encodeURIComponent(link.target || '');
          if (link.type === 'category') return '#/category/' + encodeURIComponent(link.target || '');
          if (link.type === 'screen') return '#/' + encodeURIComponent(link.target || 'home');
          return link.target || '#';
        };
        return '<div><h4>' + esc(group.title || '') + '</h4><ul class="footer-links">' +
          links.map(function (link) {
            return '<li><a href="' + esc(href(link)) + '">' + esc(link.label || '') + '</a></li>';
          }).join('') + '</ul></div>';
      }).join('');
      const socials = (Array.isArray(STUDIO_DATA.socialLinks) ? STUDIO_DATA.socialLinks : [])
        .filter(function (social) { return social.visible !== 0 && social.url; })
        .map(function (social) {
          return '<a href="' + esc(social.url) + '" target="_blank" rel="noopener">' +
            esc(social.label || social.url) + '</a>';
        }).join(' ');
      return '<footer class="site-footer"><div class="container">' + groupMarkup +
        (socials ? '<nav aria-label="Social links">' + socials + '</nav>' : '') +
        '<p class="small muted" style="margin-top:18px">' + esc(settings.copyright || '') + '</p>' +
        '</div></footer>';
    }
    const categories = topCategories();
    const links = categories.length
      ? '<ul class="footer-links">' + categories.map(function (category) {
          return '<li><a href="#/category/' + encodeURIComponent(category.id) + '">' + esc(category.name) + '</a></li>';
        }).join('') + '</ul>'
      : '<p class="muted small">Category navigation appears here once categories are added.</p>';

    return '' +
      '<footer class="site-footer">' +
        '<div class="container">' +
          '<nav aria-label="Categories">' + links + '</nav>' +
        '</div>' +
      '</footer>';
  }

  /* =========================================================
     8 · RENDER
     ========================================================= */
  function render() {
    const route = getRoute();
    const routeKey = route.segments.join('/') + '?' + route.query.toString();
    const routeChanged = routeKey !== lastRouteKey;
    if (routeChanged) {
      lastRouteKey = routeKey;
      listLimit = PAGE_SIZE;
    }

    const page = route.segments[0] || 'home';
    let html;

    switch (page) {
      case 'home':     html = renderHome(); break;
      case 'products': html = renderAllProducts(route); break;
      case 'category': html = renderCategoryPage(route.segments[1], route); break;
      case 'product':  html = renderProductDetail(route.segments[1]); break;
      case 'search':   html = renderSearch(route); break;
      case 'wishlist': html = renderWishlist(); break;
      case 'cart':     html = renderCart(); break;
      case 'checkout': html = renderCheckout(); break;
      case 'account':  html = renderAccount(route); break;
      case 'page':     html = renderStudioPage(route.segments[1]); break;
      default:         html = '<div class="container">' + notFound('Page not found.') + '</div>';
    }

    document.getElementById('app').innerHTML = html + renderFooter();
    updateStudioBrand();

    updateCartBadge();
    updateActiveNav(page);
    renderDrawer();

    if (routeChanged) window.scrollTo(0, 0);
  }

  function updateCartBadge() {
    const badge = document.getElementById('cart-badge');
    if (badge) badge.textContent = String(cartCount());
  }

  function updateActiveNav(page) {
    const map = {
      home: 'home',
      products: 'products',
      category: 'products',
      product: 'products',
      search: 'search',
      cart: 'cart',
      checkout: 'cart',
      account: 'account'
    };
    const active = map[page] || '';
    document.querySelectorAll('.nav-item').forEach(function (item) {
      item.classList.toggle('is-active', item.dataset.nav === active);
      if (item.dataset.nav === active) {
        item.setAttribute('aria-current', 'page');
      } else {
        item.removeAttribute('aria-current');
      }
    });
  }

  /* =========================================================
     9 · DRAWER
     ========================================================= */
  function renderDrawer() {
    const container = document.getElementById('drawer-categories');
    if (!container) return;

    const categories = topCategories();

    if (!categories.length) {
      container.innerHTML = '<p class="drawer-empty">No categories yet. Add records to DATA.categories to populate this menu.</p>';
      return;
    }

    container.innerHTML = categories.map(function (category) {
      const children = childCategories(category.id);
      return '' +
        '<div>' +
          '<a class="drawer-link" href="#/category/' + encodeURIComponent(category.id) + '">' + esc(category.name) + '</a>' +
          (children.length
            ? '<div class="drawer-sub">' + children.map(function (child) {
                return '<a href="#/category/' + encodeURIComponent(child.id) + '">' + esc(child.name) + '</a>';
              }).join('') + '</div>'
            : '') +
        '</div>';
    }).join('');
  }

  const drawer = document.getElementById('drawer');
  const backdrop = document.getElementById('drawer-backdrop');
  const menuBtn = document.getElementById('menu-btn');

  function openDrawer() {
    drawer.classList.add('is-open');
    backdrop.classList.add('is-open');
    drawer.setAttribute('aria-hidden', 'false');
    menuBtn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }

  function closeDrawer() {
    drawer.classList.remove('is-open');
    backdrop.classList.remove('is-open');
    drawer.setAttribute('aria-hidden', 'true');
    menuBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  menuBtn.addEventListener('click', function () {
    if (drawer.classList.contains('is-open')) closeDrawer();
    else openDrawer();
  });

  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && drawer.classList.contains('is-open')) closeDrawer();
  });

  /* =========================================================
     10 · CART / WISHLIST ACTIONS
     ========================================================= */
  function toggleWishlist(productId) {
    const index = state.wishlist.indexOf(productId);
    if (index === -1) {
      state.wishlist.push(productId);
      toast('Saved to wishlist');
    } else {
      state.wishlist.splice(index, 1);
      toast('Removed from wishlist');
    }
    save(STORAGE.wishlist, state.wishlist);
    render();
  }

  function addToCart(productId, quantity) {
    const product = getProduct(productId);
    if (!product) return;

    const qty = Math.max(1, Math.floor(Number(quantity) || 1));
    const existing = state.cart.find(function (item) { return String(item.productId) === String(productId); });

    if (existing) existing.qty += qty;
    else state.cart.push({ productId: productId, qty: qty });

    save(STORAGE.cart, state.cart);
    toast('Added to cart');
    render();
  }

  function changeQty(productId, delta) {
    const item = state.cart.find(function (entry) { return String(entry.productId) === String(productId); });
    if (!item) return;

    item.qty += delta;
    if (item.qty <= 0) {
      state.cart = state.cart.filter(function (entry) { return String(entry.productId) !== String(productId); });
    }
    save(STORAGE.cart, state.cart);
    render();
  }

  function removeFromCart(productId) {
    state.cart = state.cart.filter(function (entry) { return String(entry.productId) !== String(productId); });
    save(STORAGE.cart, state.cart);
    render();
  }

  /* =========================================================
     11 · PAYSTACK PAYMENT
     =========================================================
     The browser only ever holds the PUBLIC key. The amount is
     produced by the backend, and the order is only treated as
     paid after the backend verifies the reference.
     ========================================================= */
  function setStatus(element, type, message) {
    if (!element) return;
    element.className = 'form-msg is-' + type;
    element.textContent = message;
  }

  function loadPaystackScript() {
    return new Promise(function (resolve, reject) {
      if (window.PaystackPop) return resolve();
      const script = document.createElement('script');
      script.src = CONFIG.paystack.scriptUrl;
      script.onload = function () { resolve(); };
      script.onerror = function () { reject(new Error('Unable to load the Paystack library.')); };
      document.head.appendChild(script);
    });
  }

  async function startPayment(form) {
    const status = document.getElementById('pay-status');
    const items = validCartItems();

    if (!items.length) {
      setStatus(status, 'error', 'Your cart has no valid items.');
      return;
    }
    if (!form.reportValidity()) return;

    if (!CONFIG.paystack.publicKey || !CONFIG.paystack.initEndpoint) {
      setStatus(
        status,
        'error',
        'Payment is not configured. Add your Paystack public key and backend endpoints to CONFIG.paystack — see the source comments.'
      );
      return;
    }

    const customer = {
      name: form.querySelector('#co-name').value.trim(),
      email: form.querySelector('#co-email').value.trim(),
      phone: form.querySelector('#co-phone').value.trim(),
      address: form.querySelector('#co-address').value.trim(),
      city: form.querySelector('#co-city').value.trim(),
      region: form.querySelector('#co-region').value.trim(),
      postalCode: form.querySelector('#co-postal').value.trim()
    };

    setStatus(status, 'info', 'Preparing payment…');

    try {
      /* STEP 1 — The backend creates the order and recomputes the amount. */
      const response = await fetch(CONFIG.paystack.initEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: items.map(function (item) {
            return { productId: item.product.id, qty: item.qty };
          }),
          customer: customer
        })
      });

      if (!response.ok) throw new Error('Could not initialise the order.');

      const order = await response.json(); // { reference, email, amount }

      /* STEP 2 — Open the Paystack checkout with the server-issued values. */
      await loadPaystackScript();

      const handler = window.PaystackPop.setup({
        key: CONFIG.paystack.publicKey,
        email: order.email,
        amount: order.amount,          // smallest currency unit, computed by the backend
        currency: CONFIG.paystack.currency,
        ref: order.reference,
        callback: function (transaction) {
          verifyPayment(transaction.reference);
        },
        onClose: function () {
          setStatus(document.getElementById('pay-status'), 'info', 'Payment window closed.');
        }
      });

      handler.openIframe();
    } catch (error) {
      setStatus(status, 'error', error.message || 'Payment could not be started.');
    }
  }

  async function verifyPayment(reference) {
    try {
      const response = await fetch(
        CONFIG.paystack.verifyEndpoint + '?reference=' + encodeURIComponent(reference)
      );
      if (!response.ok) throw new Error('Verification request failed.');

      const result = await response.json();

      if (result.status === 'success' || result.paid === true) {
        state.cart = [];
        save(STORAGE.cart, state.cart);
        render();
        toast('Payment verified. Order confirmed.');
      } else {
        setStatus(document.getElementById('pay-status'), 'error', 'Payment could not be verified.');
      }
    } catch (error) {
      setStatus(
        document.getElementById('pay-status'),
        'error',
        'Verification failed. Do not fulfil this order until the payment is verified by the backend.'
      );
    }
  }

  /* =========================================================
     12 · NEWSLETTER
     ========================================================= */
  async function handleNewsletter(form) {
    const message = document.getElementById('newsletter-msg');
    const input = form.querySelector('input[type="email"]');
    const email = (input.value || '').trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    if (!valid) {
      setStatus(message, 'error', 'Enter a valid email address.');
      return;
    }

    if (!CONFIG.newsletterEndpoint) {
      setStatus(
        message,
        'error',
        'Newsletter endpoint not configured — set CONFIG.newsletterEndpoint in the source to enable subscriptions.'
      );
      return;
    }

    try {
      const response = await fetch(CONFIG.newsletterEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      if (!response.ok) throw new Error('Request failed.');
      setStatus(message, 'ok', 'Subscription received.');
      form.reset();
    } catch (error) {
      setStatus(message, 'error', 'Subscription could not be completed.');
    }
  }

  /* =========================================================
     13 · EVENT DELEGATION
     ========================================================= */
  document.addEventListener('click', function (event) {
    /* Drawer link closes the drawer */
    if (event.target.closest('#drawer a')) {
      closeDrawer();
      return;
    }

    const actionEl = event.target.closest('[data-action]');
    if (!actionEl) return;

    const action = actionEl.dataset.action;
    const id = actionEl.dataset.id;

    switch (action) {
      case 'toggle-wishlist':
        toggleWishlist(id);
        break;

      case 'add-to-cart': {
        const qtyInput = document.getElementById('pdp-qty');
        addToCart(id, qtyInput ? qtyInput.value : 1);
        break;
      }

      case 'qty-inc':
        changeQty(id, 1);
        break;

      case 'qty-dec':
        changeQty(id, -1);
        break;

      case 'remove-item':
        removeFromCart(id);
        break;

      case 'load-more':
        listLimit += PAGE_SIZE;
        render();
        break;

      default:
        break;
    }
  });

  document.addEventListener('submit', function (event) {
    /* Search */
    if (event.target.id === 'search-form') {
      event.preventDefault();
      const input = document.getElementById('search-input');
      const query = (input ? input.value : '').trim();
      location.hash = query ? '#/search?q=' + encodeURIComponent(query) : '#/search';
      return;
    }

    /* Newsletter */
    if (event.target.id === 'newsletter-form') {
      event.preventDefault();
      handleNewsletter(event.target);
      return;
    }

    /* Checkout */
    if (event.target.id === 'checkout-form') {
      event.preventDefault();
      startPayment(event.target);
      return;
    }

    /* Account scaffold forms */
    const scaffold = event.target.closest('[data-scaffold]');
    if (scaffold) {
      event.preventDefault();
      const message = scaffold.querySelector('.form-msg');
      setStatus(
        message,
        'info',
        scaffold.dataset.scaffold + ' is not connected. Add an endpoint in CONFIG (see the source comments).'
      );
    }
  });

  /* Sort / filter selects */
  document.addEventListener('change', function (event) {
    const element = event.target.closest('[data-param]');
    if (!element) return;

    const route = getRoute();
    const params = new URLSearchParams(route.query.toString());

    if (element.value) params.set(element.dataset.param, element.value);
    else params.delete(element.dataset.param);

    const base = '#/' + route.segments.join('/');
    const query = params.toString();
    location.hash = query ? base + '?' + query : base;
  });

  /* Live search results */
  let searchTimer = null;
  document.addEventListener('input', function (event) {
    if (event.target.id !== 'search-input') return;

    const value = event.target.value;
    clearTimeout(searchTimer);

    searchTimer = setTimeout(function () {
      const box = document.getElementById('search-results');
      if (!box) return;
      const query = value.trim();
      box.innerHTML = query
        ? searchResultsHtml(query, searchProducts(query))
        : emptyState('Search the catalogue', 'Enter a term to search product names, descriptions, brands and categories.');
    }, 180);
  });

  /* =========================================================
     14 · BOOT
     ========================================================= */
  window.addEventListener('hashchange', render);

  if (!location.hash) {
    history.replaceState(null, '', '#/home');
  }

  render();
})();
</script>
