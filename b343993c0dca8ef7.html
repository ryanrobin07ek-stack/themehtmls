<style>
/* ============================================================
   VOLTHAUS — DESIGN TOKENS
   ============================================================ */
:root{
  --bg:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-01);
  --bg-2:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-02);
  --bg-3:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-03);
  --card:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-04);
  --card-2:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-05);
  --card-3:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-06);
  --line:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-07);
  --line-2:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-08);
  --txt:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-09);
  --txt-2:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-10);
  --mut:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-11);
  --acc:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-09);
  --acc-d:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-12);
  --acc-2:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-13);
  --acc-3:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-14);
  --acc-4:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-14);
  --warn:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-15);
  --danger:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-16);
  --ok:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-17);
  --r-xs:8px;
  --r-sm:12px;
  --r:16px;
  --r-lg:22px;
  --r-xl:30px;
  --sh-1:0 1px 2px var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-18);
  --sh-2:0 8px 24px -8px var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-19);
  --sh-3:0 22px 60px -18px var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-20);
  --glow:0 0 0 1px var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-21);
  --hdr-h:56px;
  --nav-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --ff:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ff-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --maxw:1480px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--ff);
  background:var(--bg);
  color:var(--txt);
  line-height:1.5;
  font-size:15px;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding-bottom:calc(var(--nav-h) + var(--safe-b));
}
body.no-nav{padding-bottom:0}
img{max-width:100%;display:block;border:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,h5{margin:0;line-height:1.2;font-weight:800;letter-spacing:-.02em}
h1{font-size:clamp(1.6rem,6.2vw,3.2rem)}
h2{font-size:clamp(1.25rem,4.6vw,2.1rem)}
h3{font-size:clamp(1.05rem,3.6vw,1.5rem)}
p{margin:0 0 .8em}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-08);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:0;z-index:999;background:var(--acc);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-22);padding:12px 18px;border-radius:0 0 10px 0;font-weight:800}
.skip:focus{left:0}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 14px}
@media(min-width:768px){.wrap{padding:0 24px}}
@media(min-width:1200px){.wrap{padding:0 36px}}
.row{display:flex;align-items:center;gap:10px}
.row-b{display:flex;align-items:center;justify-content:space-between;gap:10px}
.col{display:flex;flex-direction:column}
.stack>*+*{margin-top:12px}
.hide{display:none !important}
.spacer{flex:1}
.mt{margin-top:14px}.mt-2{margin-top:26px}.mb{margin-bottom:14px}
.tc{text-align:center}
.mut{color:var(--mut)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.b{font-weight:800}
.sec{margin:34px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{margin:0}
.sec-head .link{color:var(--acc);font-weight:700;font-size:13.5px;white-space:nowrap}
.divider{height:1px;background:var(--line);margin:22px 0}

/* ============================================================
   HEADER
   ============================================================ */
.hdr{
  position:sticky;top:0;z-index:120;
  background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-23);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--line);
  padding-top:var(--safe-t);
}
.hdr-in{height:var(--hdr-h);display:flex;align-items:center;gap:8px;max-width:var(--maxw);margin:0 auto;padding:0 12px}
@media(min-width:768px){.hdr-in{padding:0 24px}}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:-.05em;flex-shrink:0}
.logo-mark{width:28px;height:28px;border-radius:9px;background:var(--acc);display:grid;place-items:center}
.logo-mark svg{width:16px;height:16px}
.logo span i{color:var(--mut);font-style:normal}
.icon-btn{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  color:var(--txt);position:relative;flex-shrink:0;
  border:1px solid transparent;transition:background .18s,border-color .18s,transform .12s;
}
.icon-btn:active{transform:scale(.93);background:var(--card-2)}
.icon-btn:hover{background:var(--card-2);border-color:var(--line)}
.icon-btn svg{width:21px;height:21px;stroke-width:1.9}
.badge{
  position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;
  background:var(--acc-2);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-24);border-radius:9px;font-size:10.5px;font-weight:900;
  display:grid;place-items:center;line-height:1;border:2px solid var(--bg);
}
.badge.acc{background:var(--acc);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-22)}
.store-chip{
  display:none;align-items:center;gap:7px;padding:7px 12px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;
  max-width:230px;color:var(--txt-2);
}
.store-chip:hover{border-color:var(--line-2)}
.store-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex-shrink:0;box-shadow:none}
.store-chip b{color:var(--txt);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:860px){.store-chip{display:flex}}
@media(min-width:1024px){.hdr-search-desktop{display:flex !important}}
.hdr-search-desktop{display:none;flex:1;max-width:520px;margin:0 6px}
.hdr-search-desktop input{
  width:100%;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  padding:0 14px 0 38px;font-size:14px;outline:none;color:var(--txt);
}
.hdr-search-desktop input:focus{border-color:var(--acc);background:var(--bg-3)}
.hdr-search-wrap{position:relative}
.hdr-search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mut)}
.mobile-search{margin:0 12px 10px;display:block}
@media(min-width:1024px){.mobile-search{display:none}}
.mobile-search button{
  width:100%;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;gap:9px;padding:0 13px;color:var(--mut);font-size:14px;text-align:left;
}
.mobile-search button svg{width:18px;height:18px}
.mobile-search button kbd{
  margin-left:auto;font-family:var(--ff-mono);font-size:10px;border:1px solid var(--line-2);
  padding:2px 6px;border-radius:5px;color:var(--mut)
}
@media(min-width:1024px){.mob-only{display:none !important}}

/* Top promo strip */
.promo-strip{
  background:var(--txt);
  color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-22);font-weight:700;font-size:12px;text-align:center;padding:7px 12px;
  letter-spacing:.01em;
}
.promo-strip a{text-decoration:underline;text-underline-offset:2px}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bnav{
  position:fixed;left:0;right:0;bottom:0;z-index:130;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-25);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
}
.bnav a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--mut);position:relative;transition:color .2s;
  min-height:48px;
}
.bnav a svg{width:22px;height:22px;stroke-width:1.85;transition:transform .2s}
.bnav a.on{color:var(--acc)}
.bnav a.on svg{transform:translateY(-1px) scale(1.06)}
.bnav a.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--acc)}
.bnav a:active svg{transform:scale(.9)}
.bnav .badge{top:6px;right:calc(50% - 20px)}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:13px;font-weight:800;font-size:14.5px;
  background:var(--card-2);color:var(--txt);border:1px solid var(--line);
  transition:transform .12s,background .18s,border-color .18s,box-shadow .18s;
  white-space:nowrap;text-align:center;
}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-p{background:var(--acc);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-22);border-color:transparent}
.btn-p:hover{background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-24)}
.btn-o{background:var(--acc-2);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-24);border-color:transparent}
.btn-ghost{background:transparent;border-color:var(--line-2)}
.btn-ghost:hover{background:var(--card-2)}
.btn-sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:11px}
.btn-xs{min-height:32px;padding:0 10px;font-size:12px;border-radius:9px;gap:5px}
.btn-xs svg{width:14px;height:14px}
.btn-lg{min-height:54px;font-size:16px;border-radius:15px}
.btn-block{width:100%}
.btn-danger{background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-26);border-color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-27);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-28)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============================================================
   CARDS / SURFACES
   ============================================================ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-p{padding:16px}
.panel{background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden}
.glass{background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-29);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-30)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;
  background:var(--card-2);border:1px solid var(--line);font-size:12.5px;font-weight:700;
  white-space:nowrap;color:var(--txt-2);transition:all .18s;min-height:36px;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--acc);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-22);border-color:transparent}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10.5px;font-weight:900;letter-spacing:.03em;text-transform:uppercase}
.tag-deal{background:var(--acc-2);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-24)}
.tag-new{background:var(--card-3);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line-2)}
.tag-best{background:var(--warn);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-31)}
.tag-out{background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-32);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-33)}
.tag-low{background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-34);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-35)}
.tag-ok{background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-36);color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-37)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:var(--card-2);border:1px solid var(--line);font-size:11.5px;font-weight:700}

/* ============================================================
   PRODUCT CARD
   ============================================================ */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
@media(min-width:560px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
@media(min-width:860px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1200px){.pgrid{grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}}
@media(min-width:1600px){.pgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.pgrid.list{grid-template-columns:1fr !important}
.pcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  contain:layout style paint;
}
.pcard:hover{border-color:var(--line-2);transform:translateY(-3px);box-shadow:var(--sh-2)}
.pcard:active{transform:scale(.985)}
.pcard-media{position:relative;aspect-ratio:1/1;background:linear-gradient(160deg,var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-38),var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-39));overflow:hidden}
.pcard-media img{width:100%;height:100%;object-fit:cover}
.pcard-tags{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;z-index:2}
.pcard-fav{
  position:absolute;top:8px;right:8px;z-index:3;width:34px;height:34px;border-radius:11px;
  background:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-40);backdrop-filter:blur(10px);display:grid;place-items:center;
  border:1px solid var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-41);transition:transform .15s,background .2s;
}
.pcard-fav:active{transform:scale(.88)}
.pcard-fav svg{width:17px;height:17px;color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-24)}
.pcard-fav.on svg{color:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-13);fill:var(--theme-volthaus-electronics-superstore-phones-laptops-tvs-gaming-more-color-13)}
.pcard-body{padding:10px 11px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard-brand{font-size:10.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.pcard-name{font-size:13.2px;font-weight:700;line-height:1.32;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pcard-rate{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mut)}
.pcard-rate svg{width:12px;height:12px;color:var(--warn);fill:var(--warn)}
.pcard-price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:5px}
.price-now{font-size:16.5px;font-weight:900;letter-spacing:-.03em}
.price-was{font-size:12px;color:var(--mut);text-decoration:line-through}
.price-off{font-size:11px;font-weight:900;color:var(--acc)}
.pcard-foot{margin-top:8px}
.pcard-foot .btn{width:100%;min-height:38px;font-size:13px;border-radius:11px}
.pgrid.list .pcard{flex-direction:row;border-radius:var(--r)}
.pgrid.list .pcard-media{width:120px;min-width:120px;aspect-ratio:auto}
.pgrid.list .pcard-body{padding:12px}
.pgrid.list .pcard-name{min-height:0;-webkit-line-clamp:3;font-size:14.5px}

/* ============================================================
   RAILS
   ============================================================ */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 14px 14px;margin:0 -14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start;flex:0 0 47%;max-width:220px}
@media(min-width:560px){.rail>*{flex:0 0 31%}}
@media(min-width:860px){.rail>*{flex:0 0 22%}}
@media(min-width:1200px){.rail>*{flex:0 0 17%}}
.rail-lg>*{flex:0 0 78%;max-width:340px}
@media(min-width:560px){.rail-lg>*{flex:0 0 46%}}
@media(min-width:860px){.rail-lg>*{flex:0 0 32%}}
@media(min-width:1200px){.rail-lg>*{flex:0 0 24%}}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;border-radius:var(--r-xl);overflow:hidden;margin-top:14px;
  background:var(--card);
  border:1px solid var(--line);
  padding:26px 20px 22px;
  min-height:400px;display:flex;flex-direction:column;justify-content:flex-end;
}
.hero::after{display:none}

/* ==========================================================================
   6. CATALOG BUILDER
   Expands model seeds × variants into a relational product catalogue.
   ========================================================================== */
function variantDelta(key, val){
  const n = parseInt(val,10) || 0;
  if(/^(Color|Finish|Edition|Panel|Connectivity|Compatibility|Material|Mount|Type|Switch|Kit|Layout)$/i.test(key)) return 0;
  if(/^(Storage|Capacity|Inks?)$/i.test(key)){
    if(/TB/i.test(val)) return 260 * n;
    if(/GB/i.test(val)) return Math.max(0,(n-128)) * 0.72;
    if(/litres|L$/i.test(val)) return (n-300) * 1.4;
    if(/mAh/i.test(val)) return (n-10000) * 0.004;
    if(/Bays/i.test(val)) return (n-2) * 90;
    if(/BTU/i.test(val)) return (n-9000) * 0.03;
    if(/Nodes|Pack|Cameras/i.test(val)) return (n-2) * 80;
    return 0;
  }
  if(/^(RAM|Memory)$/i.test(key)) return Math.max(0,(n-8)) * 14;
  if(/Size|Screen|Fits/i.test(key) && /"/.test(val)) return Math.max(0,(n-50)) * 24;
  if(/^(Refresh)$/i.test(key)) return (n-90) * 0.4;
  if(/^(Power|Ports|Bays)$/i.test(key)){
    if(/W$/.test(val)) return (n-45) * 0.9;
    if(/port/i.test(val)) return (n-5) * 22;
    return 0;
  }
  if(/^(Resolution)$/i.test(key)){
    if(/8K/.test(val)) return 900;
    if(/4K/.test(val)) return 300;
    if(/2K/.test(val)) return 120;
    return 0;
  }
  if(/^(Length)$/i.test(key)) return (n-1) * 5;
  if(/^(Months|Years)$/i.test(key)) return n * 6;
  return 0;
}

function cartesian(obj){
  const keys = Object.keys(obj||{});
  if(!keys.length) return [{}];
  let out = [{}];
  keys.forEach(k=>{
    const vals = obj[k];
    const next = [];
    out.forEach(base=>{ vals.forEach(v=>{ const c = Object.assign({}, base); c[k]=v; next.push(c); }); });
    out = next;
  });
  return out;
}

function buildSVG(cat, seed, variantIndex, label){
  const r = rndFrom(cat+'|'+seed+'|'+variantIndex);
  const hue = 30 + Math.floor(r()*14);
  const h2 = 12 + Math.floor(r()*8);
  const c1 = 'hsl('+hue+',10%,'+(66+Math.floor(r()*14))+'%)';
  const c2 = 'hsl('+h2+',66%,'+(54+Math.floor(r()*6))+'%)';
  const kind = CAT_SHAPE[cat] || 'default';
  const rot = (r()*8-4).toFixed(2);
  const off = (r()*24-12).toFixed(1);
  const svg = "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"\" width=\"1000\" height=\"1000\">"+
    '<defs>'+
      '<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0" stop-color="hsl('+hue+',6%,12%)"/>'+
        '<stop offset="1" stop-color="hsl('+hue+',6%,7%)"/>'+
      '</linearGradient>'+
      '<radialGradient id="glow" cx="0.5" cy="0.32" r="0.62">'+
        '<stop offset="0" stop-color="'+c2+'" stop-opacity="0.08"/>'+
        '<stop offset="1" stop-color="'+c2+'" stop-opacity="0"/>'+
      '</radialGradient>'+
      '<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">'+
        '<path d="M50 0H0V50" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1.4"/>'+
      '</pattern>'+
    '</defs>'+
    '<rect width="1000" height="1000" fill="url(#bg)"/>'+
    '<rect width="1000" height="1000" fill="url(#glow)"/>'+
    '<ellipse cx="500" cy="880" rx="290" ry="46" fill="rgba(0,0,0,0.42)"/>'+
    '<g transform="translate('+off+','+(variantIndex*6-9)+') rotate('+rot+' 500 500)">'+shapePaths(kind,c1,c2)+'</g>'+
    '<text x="500" y="945" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="rgba(255,255,255,0.42)" letter-spacing="1">'+esc(label).slice(0,34)+'</text>'+
  '</svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function productImage(product, idx){
  idx = idx || 0;
  const key = product.id+'|'+idx;
  if(IMG_CACHE.has(key)) return IMG_CACHE.get(key);
  const src = buildSVG(product.category, product.id, idx, product.brand);
  IMG_CACHE.set(key, src);
  return src;
}

/* ---- Build the catalogue ---- */
const PRODUCTS = [];
const PRODUCT_INDEX = new Map();
const VARIANTS = [];

function buildCatalog(){
  let pid = 0;
  MODELS.forEach(function(model){
    const brand = BRANDS.find(function(b){ return b.name === model.brand; }) || BRANDS[0];
    const cat = CATEGORIES.find(function(c){ return c.slug === model.cat; }) || CATEGORIES[0];
    const combos = cartesian(model.variants).slice(0, 6);
    combos.forEach(function(combo){
      pid++;
      const keys = Object.keys(combo);
      let delta = 0;
      keys.forEach(function(k){ delta += variantDelta(k, combo[k]); });
      const base = Math.round((model.price + delta) * 100) / 100;
      const r = rndFrom('prod'+pid+model.name);
      const rating = Math.round((3.6 + r()*1.35) * 10) / 10;
      const reviewCount = Math.floor(4 + r()*2380);
      const onDeal = r() > 0.62;
      const discountPct = onDeal ? Math.floor(6 + r()*24) : 0;
      const salePrice = onDeal ? Math.round(base * (1 - discountPct/100) * 100) / 100 : null;
      const variantLabel = keys.map(function(k){ return combo[k]; }).join(' · ');
      const id = 'p'+pid;
      const sku = (brand.slug.slice(0,3).toUpperCase()) + '-' + cat.slug.slice(0,3).toUpperCase() + '-' + pad(pid,5);
      const product = {
        id:id, sku:sku, slug: slugify(model.brand + ' ' + model.name + ' ' + variantLabel),
        name: model.brand + ' ' + model.name,
        shortName: model.name,
        brand: model.brand, brandSlug: brand.slug,
        category: model.cat, categoryName: cat.name,
        subcategory: model.sub,
        variantLabel: variantLabel,
        variants: combo,
        description: describe(model, cat, variantLabel, brand),
        longDescription: longDescribe(model, cat, brand, variantLabel),
        price: base,
        salePrice: salePrice,
        discount: discountPct,
        currency: CFG.currency,
        rating: rating,
        reviewCount: reviewCount,
        specs: Object.assign({}, model.specs),
        features: featuresFor(model, cat),
        inBox: inBoxFor(cat, model),
        warranty: '12 months manufacturer warranty included',
        seller: 'VoltHaus Retail',
        tags: model.tags.concat([cat.slug, model.sub.toLowerCase(), brand.slug]),
        featured: r() > 0.78,
        newProduct: r() > 0.82,
        bestSeller: reviewCount > 900,
        deal: onDeal,
        eco: /Mimir|Quartz|Vertex/.test(model.brand),
        weight: (0.2 + r()*6).toFixed(2)+' kg',
        dimensions: dimensionsFor(cat, r),
        releaseDate: new Date(2025, Math.floor(r()*12), 1 + Math.floor(r()*27)).toISOString().slice(0,10),
        relatedProducts: [],
        accessories: [],
        imageCount: 4
      };
      PRODUCTS.push(product);
      PRODUCT_INDEX.set(id, product);
      keys.forEach(function(k){
        VARIANTS.push({product_id:id, key:k, value:combo[k], price_delta: variantDelta(k,combo[k])});
      });
    });
  });
  // related / accessory relations (same category neighbours, plus accessories category)
  PRODUCTS.forEach(function(p){
    const sameCat = PRODUCTS.filter(function(q){ return q.category === p.category && q.id !== p.id; });
    const start = Math.abs(hashStr(p.id)) % Math.max(1, sameCat.length);
    p.relatedProducts = [];
    for(let i=0;i<6 && i<sameCat.length;i++){ p.relatedProducts.push(sameCat[(start+i)%sameCat.length].id); }
    const accs = PRODUCTS.filter(function(q){ return q.category === 'accessories' && q.brand === p.brand; });
    p.accessories = (accs.length?accs:PRODUCTS.filter(function(q){return q.category==='accessories';})).slice(0,4).map(function(q){return q.id;});
  });
}

function describe(model, cat, variantLabel, brand){
  const catName = cat.name.toLowerCase();
  return 'The '+brand.name+' '+model.name+' in '+variantLabel+' — a '+model.sub.toLowerCase()+' '+catName.replace(/s$/,'')+
    ' built for people who notice the details. '+
    'It leads with '+Object.keys(model.specs)[0].toLowerCase()+': '+Object.values(model.specs)[0]+', and backs it up with '+Object.values(model.specs)[1]+' and '+Object.values(model.specs)[2]+'.';
}
function longDescribe(model, cat, brand, variantLabel){
  const specs = model.specs;
  const specLines = Object.keys(specs).map(function(k){ return k+': '+specs[k]; }).join('. ');
  return 'The '+brand.name+' '+model.name+' ('+variantLabel+') sits in our '+model.sub+' '+cat.name.toLowerCase()+' range. '+
    brand.name+' was founded in '+brand.founded+' and is based in '+brand.origin+'. '+brand.tagline+'. '+
    'Full specification: '+specLines+'. '+
    'We stock this model across our store network, so you can check local availability, reserve for pickup or have it delivered the same day in eligible zones. '+
    'Every unit is sold with a 12-month manufacturer warranty and a 30-day returns window. '+
    'VoltHaus Protect extended coverage can be added at checkout for up to four years of accidental damage and priority repair.';
}
function featuresFor(model, cat){
  const out = [];

function reviewsFor(product, count){
  const r = rndFrom('rev'+product.id);
  const n = count || Math.min(6, 3 + Math.floor(r()*4));
  const out = [];
  for(let i=0;i<n;i++){
    const rating = clamp(Math.round(product.rating + (r()*1.6-0.8)), 1, 5);
    out.push({
      id: product.id+'-r'+i,
      product_id: product.id,
      author: REVIEWER_NAMES[Math.floor(r()*REVIEWER_NAMES.length)],
      rating: rating,
      date: daysFromNow(-Math.floor(r()*430)).toISOString(),
      title: REVIEW_TITLES[Math.floor(r()*REVIEW_TITLES.length)],
      body: REVIEW_BODIES[Math.floor(r()*REVIEW_BODIES.length)],
      verified: r() > 0.25,
      helpful: Math.floor(r()*164),
      variant: product.variantLabel
    });
  }
  return out.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
}
function qaFor(product){
  const r = rndFrom('qa'+product.id);
  const n = 3 + Math.floor(r()*3);
  const out = [];
  for(let i=0;i<n;i++){
    const q = QA_POOL[Math.floor(r()*QA_POOL.length)];
    out.push({q:q[0], a:q[1], by:'VoltHaus Product Team', date: daysFromNow(-Math.floor(r()*300)).toISOString()});
  }
  return out;
}
function ratingBreakdown(product){
  const r = rndFrom('rb'+product.id);
  const w = [0.62,0.22,0.09,0.04,0.03];
  return [5,4,3,2,1].map(function(star,i){
    const pct = Math.round((w[i] + (r()*0.06-0.03)) * 100);
    return {star:star, pct:clamp(pct,1,95), count: Math.round(product.reviewCount * clamp(pct,1,95)/100)};
  });
}

/* ==========================================================================
   8. INVENTORY MODEL
   ========================================================================== */
function stockAt(productId, storeId){
  const h = hashStr(productId+'|'+storeId) % 100;
  if(h < 11) return 0;
  if(h < 24) return 2 + (h % 3);
  return 6 + (h % 46);
}
function availability(product, storeId){
  const qty = stockAt(product.id, storeId);
  if(qty === 0) return {qty:0, label:'Out of stock', cls:'tag-out', pickup:false};
  if(qty < 6)  return {qty:qty, label:'Low stock', cls:'tag-low', pickup:true};
  return {qty:qty, label:'In stock', cls:'tag-ok', pickup:true};
}
function totalStock(product){
  let t = 0;
  STORES.forEach(function(s){ t += stockAt(product.id, s.id); });
  return t;
}
function deliveryEstimate(product, storeId, method){
  const r = rndFrom(product.id+method+(storeId||''));
  if(method === 'sameday'){
    const ok = r() > 0.42;
    return ok ? {available:true, text:'Arrives today between '+ (14+Math.floor(r()*3)) +':00 and '+(17+Math.floor(r()*3))+':00'}
              : {available:false, text:'Same-day not available for this postcode'};
  }
  if(method === 'express'){
    return {available:true, text:'Arrives tomorrow by 6pm'};
  }
  if(method === 'pickup'){
    const a = availability(product, storeId);
    return a.pickup ? {available:true, text:'Ready for pickup in about 2 hours'} : {available:false, text:'Not available for pickup at this store'};
  }
  const d = 3 + Math.floor(r()*3);
  return {available:true, text:'Arrives in '+d+'–'+(d+2)+' business days'};
}

/* ---- Cart operations ---- */
function cartKey(id, variant){ return id + '::' + (variant || 'default'); }
function addToCart(id, qty, silent){
  const p = PRODUCT_INDEX.get(id); if(!p) return;
  const key = cartKey(id);
  const existing = State.cart.find(function(i){ return i.key === key; });
  if(existing){ existing.qty += (qty||1); }
  else {
    State.cart.push({
      key:key, productId:id, qty:qty||1,
      variant:p.variantLabel,
      price: p.salePrice != null ? p.salePrice : p.price,
      addedAt: Date.now()
    });
  }
  persist(); updateBadges();
  if(!silent) toast('Added to cart · '+p.name, 'ok');
  document.dispatchEvent(new CustomEvent('cart:add'));
}
function removeFromCart(key){
  State.cart = State.cart.filter(function(i){ return i.key !== key; });
  persist(); updateBadges(); renderCartBadgeRefresh();
}
function setCartQty(key, qty){
  const item = State.cart.find(function(i){ return i.key === key; });
  if(!item) return;
  if(qty <= 0){ removeFromCart(key); return; }
  item.qty = qty; persist(); updateBadges(); renderCartBadgeRefresh();
}
function saveForLater(key){
  const item = State.cart.find(function(i){ return i.key === key; });
  if(!item) return;
  State.cart = State.cart.filter(function(i){ return i.key !== key; });
  State.saved.push(Object.assign({}, item, {savedAt: Date.now()}));
  persist(); updateBadges(); renderCartBadgeRefresh(); toast('Moved to saved items','info');
}
function moveToCart(key){
  const item = State.saved.find(function(i){ return i.key === key; });
  if(!item) return;
  State.saved = State.saved.filter(function(i){ return i.key !== key; });
  addToCart(item.productId, item.qty, true);
  persist(); renderCartBadgeRefresh();
}
function cartCount(){ return State.cart.reduce(function(a,i){ return a + i.qty; }, 0); }
function cartSubtotal(){ return State.cart.reduce(function(a,i){ return a + i.price * i.qty; }, 0); }
function cartSavings(){
  return State.cart.reduce(function(a,i){
    const p = PRODUCT_INDEX.get(i.productId);
    if(p && p.salePrice != null) return a + (p.price - p.salePrice) * i.qty;
    return a;
  },0);
}
function couponDiscount(subtotal){
  if(!State.coupon) return 0;
  const c = COUPONS.find(function(x){ return x.code === State.coupon; });
  if(!c) return 0;
  if(subtotal < c.min) return 0;
  if(c.type === 'percent') return Math.round(subtotal * c.value) / 100;
  if(c.type === 'fixed') return Math.min(c.value, subtotal);
  return 0;
}
function shippingFee(subtotal, method){
  const m = method || (State.checkout.delivery && State.checkout.delivery.method) || 'standard';
  if(m === 'pickup') return 0;
  if(m === 'standard') return subtotal >= CFG.freeShipThreshold ? 0 : 7.95;
  if(m === 'express') return CFG.expressFee;
  if(m === 'sameday') return CFG.sameDayFee;
  if(m === 'scheduled') return 9;
  return 0;
}
function cartTotals(){
  const sub = cartSubtotal();
  const disc = couponDiscount(sub);
  const ship = shippingFee(sub - disc);
  const taxable = Math.max(0, sub - disc);
  const tax = Math.round(taxable * CFG.taxRate * 100) / 100;
  return {subtotal:sub, discount:disc, shipping:ship, tax:tax, total: Math.round((taxable + ship + tax)*100)/100, savings: cartSavings()};
}

function setMeta(selector, attr, value){
  let node = document.head.querySelector(selector);
  if(!node){
    node = document.createElement(attr === 'rel' ? 'link' : 'meta');
    if(attr === 'rel'){ node.setAttribute('rel', selector.replace(/^link\[rel="|"\]$/g,'')); }
    else {
      const m = selector.match(/\[(name|property)="([^"]+)"\]/);
      if(m){ node.setAttribute(m[1], m[2]); }
    }
    document.head.appendChild(node);
  }
  node.setAttribute(attr === 'rel' ? 'href' : 'content', value);
}
let ldCounter = 0;
function setStructuredData(list){
  $$('script[data-ld="route"]').forEach(function(n){ n.remove(); });
  (list||[]).forEach(function(obj){
    if(!obj) return;
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.setAttribute('data-ld','route');
    s.textContent = JSON.stringify(obj);
    document.head.appendChild(s);
    ldCounter++;
  });
}

}

    aggregateRating: {'@type':'AggregateRating', ratingValue: p.rating.toFixed(1), reviewCount: p.reviewCount, bestRating: 5, worstRating: 1}

    });
  }
  return ld;
}

/* ==========================================================================
   12. QUERY / FILTER / SORT ENGINE
   ========================================================================== */
function searchProducts(query, opts){
  opts = opts || {};
  const q = (query||'').trim().toLowerCase();
  let list = PRODUCTS;
  if(q){
    const terms = q.split(/\s+/).filter(Boolean);
    list = list.filter(function(p){
      const hay = (p.name+' '+p.shortName+' '+p.brand+' '+p.categoryName+' '+p.subcategory+' '+p.variantLabel+' '+p.tags.join(' ')+' '+p.sku).toLowerCase();
      return terms.every(function(t){ return hay.indexOf(t) >= 0; });
    });
  }
  if(opts.category) list = list.filter(function(p){ return p.category === opts.category; });
  if(opts.subcategory) list = list.filter(function(p){ return p.subcategory === opts.subcategory; });
  if(opts.brand && opts.brand.length) list = list.filter(function(p){ return opts.brand.indexOf(p.brandSlug) >= 0; });
  if(opts.priceMin != null) list = list.filter(function(p){ return effectivePrice(p) >= opts.priceMin; });
  if(opts.priceMax != null) list = list.filter(function(p){ return effectivePrice(p) <= opts.priceMax; });
  if(opts.rating) list = list.filter(function(p){ return p.rating >= opts.rating; });
  if(opts.deals) list = list.filter(function(p){ return p.deal; });
  if(opts.newOnly) list = list.filter(function(p){ return p.newProduct; });
  if(opts.bestSellers) list = list.filter(function(p){ return p.bestSeller; });
  if(opts.inStock){ const st = State.selectedStore; list = list.filter(function(p){ return stockAt(p.id, st) > 0; }); }
  if(opts.pickup){ const st = State.selectedStore; list = list.filter(function(p){ return availability(p, st).pickup; }); }
  if(opts.attrs){
    Object.keys(opts.attrs).forEach(function(key){
      const vals = opts.attrs[key];
      if(!vals || !vals.length) return;
      list = list.filter(function(p){
        const v = p.variants[key] || p.specs[key] || '';
        return vals.some(function(x){ return String(v).toLowerCase().indexOf(String(x).toLowerCase()) >= 0; });
      });
    });
  }
  return sortList(list, opts.sort);
}
function effectivePrice(p){ return p.salePrice != null ? p.salePrice : p.price; }
function sortList(list, sort){
  const arr = list.slice();
  switch(sort){
    case 'price-asc': arr.sort(function(a,b){ return effectivePrice(a) - effectivePrice(b); }); break;
    case 'price-desc': arr.sort(function(a,b){ return effectivePrice(b) - effectivePrice(a); }); break;
    case 'rating': arr.sort(function(a,b){ return b.rating - a.rating || b.reviewCount - a.reviewCount; }); break;
    case 'reviews': arr.sort(function(a,b){ return b.reviewCount - a.reviewCount; }); break;
    case 'newest': arr.sort(function(a,b){ return new Date(b.releaseDate) - new Date(a.releaseDate); }); break;
    case 'discount': arr.sort(function(a,b){ return b.discount - a.discount; }); break;
    case 'bestselling': arr.sort(function(a,b){ return (b.bestSeller?1:0) - (a.bestSeller?1:0) || b.reviewCount - a.reviewCount; }); break;
    case 'name': arr.sort(function(a,b){ return a.name.localeCompare(b.name); }); break;
    default: arr.sort(function(a,b){ return (b.featured?1:0) - (a.featured?1:0) || b.rating - a.rating; });
  }
  return arr;
}

function starsHTML(rating, large){
  let out = '<span class="stars'+(large?' lg':'')+'" aria-label="'+rating+' out of 5 stars">';
  for(let i=1;i<=5;i++){
    out += "<svg viewBox=\"\" class=\""+(i<=Math.round(rating)?'':'off')+'"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>';
  }
  return out + '</span>';
}
function priceHTML(p, small){
  const now = effectivePrice(p);
  let html = '<div class="pcard-price">';
  html += '<span class="price-now"'+(small?' style="font-size:14.5px"':'')+'>'+money(now)+'</span>';
  if(p.salePrice != null){
    html += '<span class="price-was">'+money(p.price)+'</span>';
    html += '<span class="price-off">−'+p.discount+'%</span>';
  }
  html += '</div>';
  return html;
}
function stockTag(p){
  const a = availability(p, State.selectedStore);
  return '<span class="tag '+a.cls+'">'+a.label+'</span>';
}
function productCard(p, opts){
  opts = opts || {};
  const wish = State.wish.indexOf(p.id) >= 0;
  const tags = [];
  if(p.deal) tags.push('<span class="tag tag-deal">Save '+p.discount+'%</span>');
  if(p.newProduct) tags.push('<span class="tag tag-new">New</span>');
  if(!p.deal && !p.newProduct && p.bestSeller) tags.push('<span class="tag tag-best">Best seller</span>');
  return ''+
  '<article class="pcard" data-pid="'+p.id+'">'+
    '<a class="pcard-media" href="#/product/'+p.id+'" aria-label="'+esc(p.name+' '+p.variantLabel)+'">'+
      '<img src="'+productImage(p,0)+'" alt="'+esc(p.name+' — '+p.brand+' '+p.categoryName)+'" loading="lazy" decoding="async" width="400" height="400">'+
      (tags.length ? '<div class="pcard-tags">'+tags.join('')+'</div>' : '')+
    '</a>'+
    '<button class="pcard-fav'+(wish?' on':'')+'" data-act="wish" data-id="'+p.id+'" aria-label="'+(wish?'Remove from':'Add to')+' wishlist" aria-pressed="'+wish+'">'+
      "<svg viewBox=\"\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 .8z\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"+
    '</button>'+
    '<div class="pcard-body">'+
      '<div class="pcard-brand">'+esc(p.brand)+'</div>'+
      '<a class="pcard-name" href="#/product/'+p.id+'">'+esc(p.name)+'</a>'+
      '<div class="xs mut" style="margin-top:-2px">'+esc(p.variantLabel)+'</div>'+
      '<div class="pcard-rate">'+starsHTML(p.rating)+'<span>'+p.rating.toFixed(1)+' ('+num(p.reviewCount)+')</span></div>'+
      priceHTML(p)+
      '<div class="pcard-foot">'+
        '<button class="btn '+(availability(p,State.selectedStore).qty>0?'btn-p':'btn-ghost')+'" data-act="add" data-id="'+p.id+'"'+(availability(p,State.selectedStore).qty>0?'':' disabled')+'>'+
          (availability(p,State.selectedStore).qty>0 ? 'Add to cart' : 'Out of stock')+
        '</button>'+
      '</div>'+
    '</div>'+
  '</article>';
}
function productGrid(list, opts){
  opts = opts || {};
  if(!list.length) return emptyBlock('','No products match your filters','Try removing a filter or two, or browse a different category.',
    '<button class="btn btn-ghost" data-act="clear-filters">Clear all filters</button>');
  return '<div class="pgrid'+(opts.list?' list':'')+'" id="pgrid">'+list.map(function(p){ return productCard(p); }).join('')+'</div>';
}
function rail(title, products, href, accent){
  if(!products.length) return '';
  return '<section class="sec">'+
    '<div class="wrap"><div class="sec-head"><h2>'+esc(title)+'</h2>'+(href?'<a class="link" href="'+href+'">View all →</a>':'')+'</div></div>'+
    '<div class="wrap"><div class="rail" data-rail>'+
      products.map(function(p){ return productCard(p); }).join('')+
    '</div></div>'+
  '</section>';
}
function emptyBlock(icon, title, text, cta){
  return '<div class="empty"><div class="empty-ico">'+icon+'</div><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+(cta||'')+'</div>';

function crumbs(items){
  return '<nav class="crumbs" aria-label="Breadcrumb">'+items.map(function(it,i){
    const last = i === items.length-1;
    return (i? "<svg viewBox=\"\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m9 6 6 6-6 6\" stroke-linecap=\"round\"/></svg>" : '') +
      (last || !it.href ? '<span aria-current="page">'+esc(it.name)+'</span>' : '<a href="'+it.href+'">'+esc(it.name)+'</a>');
  }).join('')+'</nav>';

  return '<div class="sec-head"><h2>'+esc(title)+'</h2>'+(href?'<a class="link" href="'+href+'">'+esc(linkText||'View all')+' →</a>':'')+'</div>';

VIEWS.product.mount = function(params){
  const p = PRODUCT_INDEX.get(params.id);
  if(!p) return;
  /* gallery swipe tracking */
  const track = $('#galTrack');
  if(track){
    const count = $('#galCount'), dots = $$('#galDots i'), thumbs = $$('#thumbs button');
    const onScroll = throttle(function(){
      const i = Math.round(track.scrollLeft / track.clientWidth);
      if(count) count.textContent = (i+1) + ' / 4';
      dots.forEach(function(d,di){ d.className = di===i ? 'on' : ''; });
      thumbs.forEach(function(t,ti){ t.className = ti===i ? 'on' : ''; });
    }, 90);
    track.addEventListener('scroll', onScroll, {passive:true});
  }
  /* variant selector */
  const host = $('#variantHost');
  if(host){
    const keys = Object.keys(p.variants || {});
    if(keys.length){
      host.innerHTML = keys.map(function(k){
        const vals = [p.variants[k]];
        return '<div style="margin-bottom:14px"><div class="xs b mut" style="letter-spacing:.09em;text-transform:uppercase;margin-bottom:7px">'+esc(k)+'</div><div class="chip-row">'+
          vals.map(function(v){ return '<span class="chip on">'+esc(v)+'</span>'; }).join('')+
        '</div></div>';
      }).join('') +
      '<div class="xs mut" style="margin-bottom:16px">Looking for a different configuration? <button class="b" style="color:var(--acc)" data-act="variant-browse" data-id="'+p.id+'">See all '+PRODUCTS.filter(function(x){ return x.name===p.name; }).length+' variants</button></div>';
    }
  }
  /* sticky buy reveal */
  const sb = $('#stickyBuy');
  const anchor = $('#tab-overview');
  if(sb && anchor && 'IntersectionObserver' in window){
    const io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ sb.classList.toggle('on', !e.isIntersecting); });
    }, {rootMargin:'-120px 0px 0px 0px'});
    io.observe(anchor);
  }
};

      const n = PRODUCTS.filter(function(p){ return p.brandSlug === b.slug; }).length;
      return '<a class="card card-p" href="#/brand/'+b.slug+'" data-reveal style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px">'+
        '<div style="width:54px;height:54px;border-radius:16px;background:'+b.accent+'22;color:'+b.accent+';display:grid;place-items:center;font-weight:900;font-size:19px">'+esc(b.name.charAt(0))+'</div>'+
        '<div class="b" style="font-size:14px">'+esc(b.name)+'</div>'+
        '<div class="xs mut">'+n+' products</div>'+
        '<div class="xs" style="color:'+b.accent+'">'+esc(b.tagline)+'</div>'+
      '</a>';
    }).join('')+'</div>'+
    '<div style="height:40px"></div>'+
  '</div></div>';
};
VIEWS.brands.seo = function(){
  return {title:'All Brands — VoltHaus Electronics', description:'Browse '+BRANDS.length+' electronics brands at VoltHaus including Voltek, Nimbus, Korex, Cypher, Auralux, Lumen and more.', ld:[breadcrumbLD([{name:'Home',href:'#/home'},{name:'Brands',href:'#/brands'}]), itemListLD(BRANDS.map(function(b){ return {id:b.slug,name:b.name,variantLabel:''}; }),'Brands')]};
};

VIEWS.brand = function(params){
  const b = BRANDS.find(function(x){ return x.slug === params.slug; });
  if(!b) return VIEWS.notFound();
  const list = sortList(PRODUCTS.filter(function(p){ return p.brandSlug === b.slug; }), params.sort || 'featured');
  const cats = uniq(list.map(function(p){ return p.category; }));
  return '<div class="view"><div class="wrap">'+
    crumbs([{name:'Home',href:'#/home'},{name:'Brands',href:'#/brands'},{name:b.name}])+
    '<div class="panel" style="background:var(--card);margin-bottom:18px">'+
      '<div class="row" style="gap:15px;align-items:center">'+
        '<div style="width:64px;height:64px;border-radius:20px;background:'+b.accent+'26;color:'+b.accent+';display:grid;place-items:center;font-weight:900;font-size:24px;flex-shrink:0">'+esc(b.name.charAt(0))+'</div>'+
        '<div><h1 style="font-size:clamp(1.4rem,5vw,2rem)">'+esc(b.name)+'</h1>'+
        '<div class="sm mut">'+esc(b.tagline)+' · Founded '+b.founded+' · '+esc(b.origin)+'</div></div>'+
      '</div>'+
      '<p class="sm mut" style="margin:15px 0 0;max-width:68ch">'+esc(b.blurb)+'</p>'+
    '</div>'+
    '<div class="chip-row" style="margin-bottom:16px">'+
      '<a class="chip'+(params.category?'':' on')+'" href="#/brand/'+b.slug+'">All '+list.length+'</a>'+
      cats.map(function(c){
        const cat = CATEGORIES.find(function(x){ return x.slug === c; });
        const n = list.filter(function(p){ return p.category === c; }).length;
        return '<a class="chip'+(params.category===c?' on':'')+'" href="#/brand/'+b.slug+'?category='+c+'">'+esc(cat?cat.name:c)+' ('+n+')</a>';
      }).join('')+
    '</div>'+
    productGrid(params.category ? list.filter(function(p){ return p.category === params.category; }) : list)+
    '<div style="height:40px"></div>'+
  '</div></div>';
};
VIEWS.brand.seo = function(params){
  const b = BRANDS.find(function(x){ return x.slug === params.slug; });
  if(!b) return {title:'Brand not found'};
  const n = PRODUCTS.filter(function(p){ return p.brandSlug === b.slug; }).length;
  return {
    title: b.name+' — '+n+' Products | VoltHaus',
    description: 'Shop '+n+' '+b.name+' products at VoltHaus. '+b.blurb,
    ld:[
      breadcrumbLD([{name:'Home',href:'#/home'},{name:'Brands',href:'#/brands'},{name:b.name,href:'#/brand/'+b.slug}]),
      {'@context':'https://schema.org','@type':'Brand','name':b.name,'description':b.blurb,'url':CFG.baseUrl+'#/brand/'+b.slug},
      itemListLD(PRODUCTS.filter(function(p){ return p.brandSlug === b.slug; }), b.name)
    ]
  };
};

      '<a class="chip on" href="#/deals">All deals</a>'+
      "<a class=\"chip\" href=\"#/deals?filter=under200\">Under </a>"+
      '<a class="chip" href="#/deals?filter=audio">Audio</a>'+
      '<a class="chip" href="#/deals?filter=gaming">Gaming</a>'+
      '<a class="chip" href="#/deals?filter=clearance">Clearance</a>'+
      '<a class="chip" href="#/coupons">Coupons</a>'+
    '</div>'+
    sectionHead('Flash sale')+
    productGrid(flash)+
    sectionHead('Weekly deals')+

VIEWS.deals.seo = function(){
  const deals = PRODUCTS.filter(function(p){ return p.deal; });

/* ---------- COMPARE ---------- */
VIEWS.compare = function(){
  const items = State.compare.map(function(id){ return PRODUCT_INDEX.get(id); }).filter(Boolean);
  if(!items.length){
    return '<div class="view"><div class="wrap">'+crumbs([{name:'Home',href:'#/home'},{name:'Compare'}])+
      emptyBlock('','Nothing to compare yet','Add up to four products using the compare button on any product card or product page.',
        '<a class="btn btn-p" href="#/shop">Browse products</a>')+'</div></div>';
  }
  const allKeys = [];
  items.forEach(function(p){ Object.keys(p.specs).forEach(function(k){ if(allKeys.indexOf(k) < 0) allKeys.push(k); }); });
  const attrs = ['Price','Rating','Reviews','Variant','Weight','Dimensions','Warranty'];
  let rows = '';
  rows += '<tr><th>Price</th>'+items.map(function(p){
    return '<td><b style="font-size:16px">'+money(effectivePrice(p))+'</b>'+(p.salePrice!=null?'<div class="xs" style="color:var(--acc)">Save '+money(p.price-p.salePrice)+'</div>':'')+'</td>';
  }).join('')+'</tr>';
  rows += '<tr><th>Rating</th>'+items.map(function(p){ return '<td>'+starsHTML(p.rating)+' <span class="xs mut">'+p.rating.toFixed(1)+'</span></td>'; }).join('')+'</tr>';
  rows += '<tr><th>Reviews</th>'+items.map(function(p){ return '<td>'+num(p.reviewCount)+'</td>'; }).join('')+'</tr>';
  rows += '<tr><th>Availability</th>'+items.map(function(p){ const a=availability(p,State.selectedStore); return '<td><span class="tag '+a.cls+'">'+a.label+'</span></td>'; }).join('')+'</tr>';
  allKeys.forEach(function(k){
    rows += '<tr><th>'+esc(k)+'</th>'+items.map(function(p){ return '<td>'+esc(p.specs[k]||'—')+'</td>'; }).join('')+'</tr>';
  });
  rows += '<tr><th>Variant</th>'+items.map(function(p){ return '<td>'+esc(p.variantLabel)+'</td>'; }).join('')+'</tr>';
  rows += '<tr><th>Warranty</th>'+items.map(function(p){ return '<td>'+esc(p.warranty)+'</td>'; }).join('')+'</tr>';
  rows += '<tr><th>Add to cart</th>'+items.map(function(p){
    return '<td><button class="btn btn-p btn-sm" data-act="add" data-id="'+p.id+'">Add</button> <button class="btn btn-ghost btn-xs" data-act="compare" data-id="'+p.id+'" style="margin-top:6px">Remove</button></td>';
  }).join('')+'</tr>';

  return '<div class="view"><div class="wrap">'+
    crumbs([{name:'Home',href:'#/home'},{name:'Compare'}])+
    '<h1 style="margin-bottom:6px">Compare products</h1>'+
    '<p class="mut sm" style="margin-bottom:16px">'+items.length+' of 4 selected. Scroll horizontally to see every column.</p>'+
    '<div class="compare-scroll"><table class="compare-table">'+
      '<thead><tr><th>Product</th>'+items.map(function(p){
        return '<th><img class="compare-head-img" src="'+productImage(p,0)+'" alt="'+esc(p.name)+'" loading="lazy"><a href="#/product/'+p.id+'" style="font-size:13.5px;font-weight:800">'+esc(p.name)+'</a><div class="xs mut">'+esc(p.variantLabel)+'</div></th>';
      }).join('')+'</tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
    '</table></div>'+
    '<div class="mt-2 row" style="gap:10px;flex-wrap:wrap">'+
      '<button class="btn btn-p" data-act="add-all-compare">Add all to cart</button>'+
      '<button class="btn btn-ghost" data-act="clear-compare">Clear comparison</button>'+
      '<a class="btn btn-ghost" href="#/shop">Add more products</a>'+
    '</div>'+
    '<div style="height:40px"></div>'+
  '</div></div>';
};
VIEWS.compare.seo = function(){
  return {title:'Compare Products — VoltHaus', description:'Compare up to four electronics products side by side — specifications, prices, ratings and availability.', noindex:true, ld:[breadcrumbLD([{name:'Home',href:'#/home'},{name:'Compare',href:'#/compare'}])]};
};

/* ---------- CHECKOUT ---------- */
const CHECKOUT_STEPS = ["","","","","",""];
VIEWS.checkout = function(params){
  const step = params.step || 'cart';
  if(!State.cart.length){
    return '<div class="view"><div class="wrap">'+crumbs([{name:'Home',href:'#/home'},{name:'Checkout'}])+
      emptyBlock('','Your cart is empty','You need at least one item in the cart before checking out.','<a class="btn btn-p" href="#/shop">Browse products</a>')+'</div></div>';
  }
  const idx = CHECKOUT_STEPS.indexOf(step);
  const t = cartTotals();
  const store = getStore();
  const co = State.checkout;
  const stepsHTML = '<div class="steps">'+CHECKOUT_STEPS.map(function(s,i){
    return '<div class="step '+(i<idx?'done':i===idx?'on':'')+'">'+esc(s.charAt(0).toUpperCase()+s.slice(1))+'</div>';
  }).join('')+'</div>';

  let body = '';

  if(step === 'cart'){
    body = '<div class="card card-p">'+
      '<h3 style="font-size:1.05rem;margin-bottom:12px">Review your items</h3>'+
      State.cart.map(function(i){
        const p = PRODUCT_INDEX.get(i.productId); if(!p) return '';
        return '<div class="row" style="gap:12px;padding:11px 0;border-bottom:1px solid var(--line)">'+
          '<img src="'+productImage(p,0)+'" alt="" style="width:60px;height:60px;border-radius:11px;object-fit:cover;background:var(--bg-3)" loading="lazy">'+
          '<div style="flex:1;min-width:0"><div class="b sm">'+esc(p.name)+'</div><div class="xs mut">'+esc(i.variant)+' · Qty '+i.qty+'</div></div>'+
          '<div class="b sm">'+money(i.price*i.qty)+'</div>'+
        '</div>';
      }).join('')+
    '</div>'+
    '<div class="row" style="gap:10px;margin-top:16px"><a class="btn btn-ghost" href="#/cart">Back to cart</a><a class="btn btn-p" style="flex:1" href="#/checkout/contact">Continue</a></div>';
  }

  if(step === 'contact'){
    body = '<div class="card card-p">'+
      '<h3 style="font-size:1.05rem;margin-bottom:14px">Contact details</h3>'+
      '<div class="field"><label for="co-email">Email address</label><input class="inp" id="co-email" name="email" type="email" value="'+esc(co.contact.email||'')+"\" placeholder=\"\" required autocomplete=\"email\"><div class=\"hint\">Order confirmation and tracking updates go here.</div></div>"+
      '<div class="field"><label for="co-phone">Mobile number</label><input class="inp" id="co-phone" name="phone" type="tel" value="'+esc(co.contact.phone||'')+'" placeholder="+1 555 000 0000" required autocomplete="tel"><div class="hint">Used for delivery notifications only.</div></div>'+
      '<label class="check"><input type="checkbox" name="marketing" '+(co.contact.marketing?'checked':'')+'><span>Email me deals and restock alerts (optional)</span></label>'+
    '</div>'+
    '<div class="row" style="gap:10px;margin-top:16px"><a class="btn btn-ghost" href="#/checkout/cart">Back</a><button class="btn btn-p" style="flex:1" data-act="co-next" data-step="contact">Continue</button></div>';
  }

  if(step === 'address'){
    const a = co.address || {};
    body = '<div class="card card-p">'+
      '<h3 style="font-size:1.05rem;margin-bottom:14px">Delivery address</h3>'+
      '<div class="field"><label for="ad-name">Full name</label><input class="inp" id="ad-name" name="name" value="'+esc(a.name||'')+'" required autocomplete="name"></div>'+
      '<div class="field"><label for="ad-line1">Address line 1</label><input class="inp" id="ad-line1" name="line1" value="'+esc(a.line1||'')+'" required autocomplete="address-line1"></div>'+
      '<div class="field"><label for="ad-line2">Address line 2 <span class="mut">(optional)</span></label><input class="inp" id="ad-line2" name="line2" value="'+esc(a.line2||'')+'" autocomplete="address-line2"></div>'+
      '<div class="row" style="gap:10px">'+
        '<div class="field" style="flex:1"><label for="ad-city">City</label><input class="inp" id="ad-city" name="city" value="'+esc(a.city||'')+'" required autocomplete="address-level2"></div>'+
        '<div class="field" style="width:110px"><label for="ad-zip">ZIP</label><input class="inp" id="ad-zip" name="zip" value="'+esc(a.zip||'')+'" required autocomplete="postal-code" inputmode="numeric"></div>'+
      '</div>'+
      '<div class="field"><label for="ad-state">State</label><input class="inp" id="ad-state" name="state" value="'+esc(a.state||'CA')+'" required autocomplete="address-level1"></div>'+
      '<label class="check"><input type="checkbox" name="saveaddr" '+(a.saved?'checked':'')+'><span>Save this address to my account</span></label>'+
    '</div>'+
    '<div class="row" style="gap:10px;margin-top:16px"><a class="btn btn-ghost" href="#/checkout/contact">Back</a><button class="btn btn-p" style="flex:1" data-act="co-next" data-step="address">Continue</button></div>';
  }

  if(step === 'delivery'){
    const d = co.delivery || {method:'standard'};
    body = '<div class="card card-p" style="margin-bottom:14px">'+
      '<h3 style="font-size:1.05rem;margin-bottom:14px">Delivery method</h3>'+

/* ---------- ORDER CONFIRMATION / DETAILS / TRACKING ---------- */
function orderTimeline(order){
  const steps = ['Order placed','Confirmed','Processing','Packed','Dispatched','In transit','Out for delivery','Delivered'];
  const elapsed = Date.now() - new Date(order.placedAt).getTime();
  const hours = elapsed / 3600000;
  let current;
  if(hours < 0.05) current = 0;
  else if(hours < 1) current = 1;
  else if(hours < 6) current = 2;
  else if(hours < 18) current = 3;
  else if(hours < 30) current = 4;
  else if(hours < 48) current = 5;
  else if(hours < 60) current = 6;
  else current = 7;
  if(order.delivery && order.delivery.method === 'pickup' && current > 4) current = 4;
  return {steps:steps, current:current};
}

VIEWS.financing.mount = function(){
  const amount = $('#fin-amount'), deposit = $('#fin-deposit'), term = $('#fin-term'), apr = $('#fin-apr');
  if(!amount) return;
  function calc(){
    const a = Math.max(0, parseFloat(amount.value)||0);
    const d = Math.min(a, Math.max(0, parseFloat(deposit.value)||0));
    const principal = Math.max(0, a - d);
    const months = parseInt(term.value,10);
    const rate = parseFloat(apr.value)/100;
    $('#fin-termLabel').textContent = months + ' months';
    $('#fin-aprLabel').textContent = apr.value + '%';
    let monthly, interest;
    if(rate === 0){ monthly = principal/months; interest = 0; }
    else {
      const r = rate/12;
      monthly = principal * r / (1 - Math.pow(1+r, -months));
      interest = monthly*months - principal;
    }
    $('#fin-monthly').textContent = money(monthly);
    $('#fin-principal').textContent = money(principal);
    $('#fin-interest').textContent = money(interest);
    $('#fin-total').textContent = money(principal + interest);
  }
  [amount,deposit,term,apr].forEach(function(el){ el.addEventListener('input', calc); });
  calc();
};

const ROUTES = {
  'home':"", 'shop':"", 'search':"", 'category':"",
  'product':"", 'compare':"", 'deals':"", 'brands':"",
  'brand':"", 'stores':"", 'store':"", 'cart':"",

function parseHash(){
  let h = location.hash.replace(/^#/,'') || '/home';
  if(h.charAt(0) !== '/') h = '/' + h;
  const qi = h.indexOf('?');
  const path = qi >= 0 ? h.slice(0,qi) : h;
  const qs = qi >= 0 ? h.slice(qi+1) : '';
  const parts = path.split('/').filter(Boolean);
  const query = {};
  new URLSearchParams(qs).forEach(function(v,k){ query[k] = v; });
  return {path:path, parts:parts, query:query, raw:h};
}

let currentRoute = null;
let isRendering = false;

function render(){
  if(isRendering) return;
  isRendering = true;
  const r = parseHash();
  const key = r.parts[0] || 'home';
  const viewName = ROUTES[key] || 'notFound';
  const view = VIEWS[viewName] || VIEWS.notFound;
  const params = Object.assign({}, r.query, {slug: r.parts[1], id: r.parts[1], step: r.parts[1], doc: r.parts[1]});
  if(viewName === 'legal') params.doc = r.parts[0];

  const app = $('#app');
  let html;
  try {
    html = view(params) || VIEWS.notFound(params);
  } catch(err){
    console.error('[VoltHaus] render error', err);
    html = '<div class="view"><div class="wrap">'+emptyBlock('','Something went wrong','We could not render this page. Try going back or returning to the homepage.','<a class="btn btn-p" href="#/home">Go to homepage</a>')+'</div></div>';
  }
  app.innerHTML = html;
  currentRoute = {key:key, view:viewName, params:params};

  /* SEO */
  let seo;
  try { seo = view.seo ? view.seo(params) : {title:'VoltHaus'}; }
  catch(e){ seo = {title:'VoltHaus — Electronics Superstore'}; }
  setSEO(seo);

  /* mount */
  if(view.mount){ try { view.mount(params); } catch(e){ console.error(e); } }
  mountCommon();
  updateBadges();
  updateNavActive();

  /* animations */
  requestAnimationFrame(function(){
    pageEnter();
    refreshScrollTriggers();
    initReveals();
    initParallax();
  });

  window.scrollTo(0,0);
  isRendering = false;
}

function updateNavActive(){
  const key = (currentRoute && currentRoute.key) || 'home';
  $$('#bnav a').forEach(function(a){
    const target = a.getAttribute('data-nav');
    a.classList.toggle('on', target === key || (target === 'shop' && ['category','brand','brands','deals','bundles','compare'].indexOf(key) >= 0) || (target === 'orders' && ['order','track','orders'].indexOf(key) >= 0));
  });
  $$('#drawerBody a[data-nav]').forEach(function(a){
    a.classList.toggle('on', a.getAttribute('data-nav') === key);
  });
}

function mountCommon(){
  /* accessibility accordions */
  /* nothing needed here — handled by delegation */
}

/* ==========================================================================
   16. GLOBAL EVENT DELEGATION
   ========================================================================== */
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-act]');
  if(t){
    const act = t.getAttribute('data-act');
    handleAction(act, t, e);
    return;
  }
  /* accordion */
  const accQ = e.target.closest('.acc-q');
  if(accQ && !accQ.hasAttribute('data-act')){
    const item = accQ.closest('.acc-item');
    const open = item.classList.toggle('on');
    accQ.setAttribute('aria-expanded', open ? 'true' : 'false');
    return;
  }
  /* close on nav link click */
  if(e.target.closest('a[href^="#/"]')){
    closeAll();
  }
}, false);

function handleAction(act, el, e){
  const id = el.getAttribute('data-id');
  const key = el.getAttribute('data-key');

  switch(act){
    case 'menu-open': openMenu(); break;
    case 'close-all': closeAll(); break;
    case 'cart-open': openCart(); break;
    case 'search-open': openSearch(); break;
    case 'search-close': closeSearch(); break;
    case 'voice': toast('Voice search is not available in this demonstration','info'); break;

    case 'wish': {
      const on = toggleWish(id);
      el.classList.toggle('on', on);
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
      /* update all matching hearts on page */
      $$('[data-act="wish"][data-id="'+id+'"]').forEach(function(b){
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on ? 'true':'false');
      });
      if(currentRoute && currentRoute.view === 'wishlist') render();
      break;
    }
    case 'compare': {
      const on = toggleCompare(id);
      if(currentRoute && currentRoute.view === 'compare') render();
      else updateBadges();
      break;
    }
    case 'add': {
      const from = el.getAttribute('data-qty-from');
      let qty = 1;
      if(from === 'pdp'){
        const q = $('#pdpQtyVal');
        if(q) qty = parseInt(q.textContent,10) || 1;
      }
      addToCart(id, qty);
      break;
    }
    case 'buy-now': {
      addToCart(id, 1, true);
      location.hash = '#/checkout/cart';
      break;
    }
    case 'pdp-qty': {
      const val = $('#pdpQtyVal');
      if(!val) break;
      let n = parseInt(val.textContent,10) + parseInt(el.getAttribute('data-delta'),10);
      n = clamp(n, 1, 10);
      val.textContent = n;
      break;
    }
    case 'gal-go': {
      const track = $('#galTrack');
      const i = parseInt(el.getAttribute('data-i'),10);
      if(track) track.scrollTo({left: track.clientWidth * i, behavior:'smooth'});
      break;
    }
    case 'variant-browse': {
      const p = PRODUCT_INDEX.get(id);
      if(!p) break;
      const sibs = PRODUCTS.filter(function(x){ return x.name === p.name; });
      openSheet(p.name + ' — ' + sibs.length + ' variants',
        '<div class="stack">'+sibs.map(function(s){
          return '<a class="list-row" href="#/product/'+s.id+'" data-act="close-all" style="border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:9px">'+
            '<img src="'+productImage(s,0)+'" alt="" loading="lazy">'+
            '<div class="list-row-body"><div class="b sm">'+esc(s.variantLabel)+'</div><div class="b" style="margin-top:5px">'+money(effectivePrice(s))+'</div></div></a>';
        }).join('')+'</div>');
      break;
    }

    case 'cart-qty': {
      const delta = parseInt(el.getAttribute('data-delta'),10);
      const item = State.cart.find(function(i){ return i.key === key; });
      if(item) setCartQty(key, item.qty + delta);
      if(currentRoute && currentRoute.view === 'cart') render();
      break;
    }
    case 'cart-remove': removeFromCart(key); if(State.sheet==='Your cart') openCart(); if(currentRoute && currentRoute.view === 'cart') render(); toast('Removed from cart','info'); break;
    case 'cart-save': saveForLater(key); if(State.sheet==='Your cart') openCart(); if(currentRoute && currentRoute.view === 'cart') render(); break;
    case 'move-to-cart': moveToCart(key); if(currentRoute && (currentRoute.view === 'cart' || currentRoute.view === 'saved')) render(); break;
    case 'remove-saved': State.saved = State.saved.filter(function(i){ return i.key !== key; }); persist(); if(currentRoute && (currentRoute.view==='cart'||currentRoute.view==='saved')) render(); toast('Removed','info'); break;

    case 'store-sheet': openStoreSheet(); break;
    case 'set-store': {
      State.selectedStore = id;
      persist();
      const s = getStore();
      const hdr = $('#hdrStore'); if(hdr) hdr.textContent = s.name.replace('VoltHaus ','');
      toast('Store set to '+s.name,'ok');
      closeAll();
      render();
      break;
    }

    case 'filter-open': openFilterSheet(el.getAttribute('data-scope')||'shop'); break;
    case 'sort-open': openSortSheet(el.getAttribute('data-scope')||'shop'); break;
    case 'clear-filters': clearFilters(); break;

    case 'use-coupon': {
      const code = el.getAttribute('data-code');
      applyCoupon(code);
      if(currentRoute && (currentRoute.view === 'cart' || currentRoute.view === 'coupons')) render();
      break;
    }
    case 'co-slot': {
      State.checkout.delivery.slot = el.getAttribute('data-slot');
      persist(); render();
      break;
    }
    case 'co-next': {
      saveCheckoutStep(el.getAttribute('data-step'));
      break;
    }
    case 'co-summary': {
      const s = $('#coSummary');
      if(s){ const open = s.hasAttribute('hidden'); if(open) s.removeAttribute('hidden'); else s.setAttribute('hidden',''); el.textContent = open ? 'Hide' : 'Show'; }
      break;
    }
    case 'place-order': placeOrder(); break;
    case 'reorder': reorder(el.getAttribute('data-id')); break;
    case 'refresh-track': render(); toast('Status refreshed','ok'); break;

    case 'add-bundle': addBundle(el.getAttribute('data-bundle')); break;
    case 'add-all-compare': {
      State.compare.map(function(cid){ return PRODUCT_INDEX.get(cid); }).filter(Boolean).forEach(function(p){ addToCart(p.id,1,true); });
      toast('Added '+State.compare.length+' items to cart','ok');
      break;
    }
    case 'clear-compare': State.compare = []; persist(); updateBadges(); render(); toast('Comparison cleared','info'); break;

    case 'wish-all-cart': {
      State.wish.map(function(wid){ return PRODUCT_INDEX.get(wid); }).filter(Boolean).forEach(function(p){ addToCart(p.id,1,true); });
      toast('Added wishlist items to cart','ok');
      break;
    }
    case 'wish-clear': State.wish = []; persist(); updateBadges(); render(); toast('Wishlist cleared','info'); break;

    case 'gc-amount': {
      const v = el.getAttribute('data-v');
      const inp = $('#gc-custom');
      if(inp){ inp.value = v; inp.dispatchEvent(new Event('input',{bubbles:true})); }
      $$('[data-act="gc-amount"]').forEach(function(b){ b.classList.toggle('on', b === el); });
      break;
    }
    case 'subscribe': {
      const p = PRODUCT_INDEX.get(id);
      if(!p) break;
      State.subscriptions.push({id:'sub-'+Date.now(), productId:p.id, name:p.name, price: Math.round(effectivePrice(p)*0.9*100)/100, frequency: el.getAttribute('data-freq'), status:'Active', created: new Date().toISOString()});
      persist(); render(); toast('Subscribed — 10% off every shipment','ok');
      break;
    }
    case 'sub-toggle': {
      const s = State.subscriptions.find(function(x){ return x.id === id; });
      if(s){ s.status = s.status === 'Active' ? 'Paused' : 'Active'; persist(); render(); toast('Subscription '+s.status.toLowerCase(),'info'); }
      break;
    }
    case 'sub-cancel': {
      State.subscriptions = State.subscriptions.filter(function(x){ return x.id !== id; });
      persist(); render(); toast('Subscription cancelled','info');
      break;
    }

    case 'redeem-points': {
      if(State.loyalty.points < 1000){ toast('You need at least 1,000 points','err'); break; }
      State.loyalty.points -= 1000;
      State.loyalty.history.unshift({date:new Date().toISOString(), text:"Redeemed 1,000 points for  credit", points:-1000});
      persist(); render(); toast(" credit added to your account",'ok');
      break;
    }
    case 'join-tier': {
      const tier = el.getAttribute('data-tier');
      State.loyalty.tier = tier;
      persist(); render(); toast('You joined the '+tier+' tier','ok');
      break;
    }

    case 'helpful': {
      toast('Thanks — your feedback was recorded','ok');
      break;
    }
    case 'write-review': {
      openReviewForm(id);
      break;
    }
    case 'acc': {
      const item = el.closest('.acc-item');
      const open = item.classList.toggle('on');
      el.setAttribute('aria-expanded', open ? 'true':'false');
      break;
    }

    case 'signout': {
      State.account = null; persist(); render(); toast('Signed out','info');
      break;
    }
    case 'apply': {
      const job = CAREERS.find(function(j){ return j.id === id; });
      if(!job) break;
      openSheet('Apply — '+job.title,
        '<div class="field"><label for="ap-name">Full name</label><input class="inp" id="ap-name" required></div>'+
        '<div class="field"><label for="ap-email">Email</label><input class="inp" id="ap-email" type="email" required></div>'+
        '<div class="field"><label for="ap-phone">Phone</label><input class="inp" id="ap-phone" type="tel"></div>'+
        '<div class="field"><label for="ap-linkedin">Portfolio or LinkedIn <span class="mut">(optional)</span></label><input class="inp" id="ap-linkedin"></div>'+
        '<div class="field"><label for="ap-cover">Why this role?</label><textarea class="inp" id="ap-cover" placeholder="A short note is fine."></textarea></div>'+
        '<div class="xs mut">Submitting this form is a demonstration and does not send data anywhere.</div>',
        '<button class="btn btn-p" data-act="apply-submit" data-id="'+job.id+'">Submit application</button>','');
      break;
    }
    case 'apply-submit': {
      closeAll();
      toast('Application received — we will be in touch','ok');
      break;
    }

    case 'start-return': {
      openSheet('Return order '+id,
        '<div class="field"><label for="rt-reason">Reason for return</label><select class="inp" id="rt-reason"><option>Changed my mind</option><option>Item is faulty</option><option>Wrong item received</option><option>Item damaged in transit</option><option>Not as described</option></select></div>'+
        '<div class="field"><label for="rt-method">Return method</label><select class="inp" id="rt-method"><option>Drop off at a store (free)</option><option>Collection from my address ($9)</option></select></div>'+
        '<div class="field"><label for="rt-notes">Additional notes</label><textarea class="inp" id="rt-notes" placeholder="Optional"></textarea></div>',
        '<button class="btn btn-p" data-act="return-submit">Submit return request</button>','');
      break;
    }
    case 'return-submit': {
      closeAll();
      toast('Return request submitted — check your email','ok');
      break;
    }

    case 'repair-type': {
      const sel = $('#rp-type');
      if(sel){ sel.value = el.getAttribute('data-type'); }
      const form = sel && sel.closest('form');
      if(form) form.scrollIntoView({behavior:'smooth', block:'center'});
      break;
    }

    case 'newsletter-off': {
      State.newsletter = null; persist(); render(); toast('You have been unsubscribed','info');
      break;
    }

    case 'addr-primary': {
      const i = parseInt(el.getAttribute('data-i'),10);
      if(State.account && State.account.addresses){
        State.account.addresses.forEach(function(a,ai){ a.primary = ai === i; });
        persist(); render(); toast('Default address updated','ok');
      }
      break;
    }
    case 'addr-remove': {
      const i = parseInt(el.getAttribute('data-i'),10);
      if(State.account && State.account.addresses){
        State.account.addresses.splice(i,1);
        persist(); render(); toast('Address removed','info');
      }
      break;
    }
    case 'card-remove': {
      const i = parseInt(el.getAttribute('data-i'),10);
      if(State.account && State.account.cards){
        State.account.cards.splice(i,1);
        persist(); render(); toast('Card removed','info');
      }
      break;
    }

    case 'search-suggestion': {
      const q = el.getAttribute('data-q');
      closeSearch();
      location.hash = '#/search?q=' + encodeURIComponent(q);
      break;
    }
    default: break;
  }
}

      }).join('')+'</div></div>';

      }).join('')+'</div>';

    return;
  }
  const results = searchProducts(term, {sort:'featured'}).slice(0,10);
  const brandMatches = BRANDS.filter(function(b){ return b.name.toLowerCase().indexOf(term.toLowerCase()) >= 0; }).slice(0,3);
  const catMatches = CATEGORIES.filter(function(c){ return c.name.toLowerCase().indexOf(term.toLowerCase()) >= 0; }).slice(0,3);
  const guideMatches = ARTICLES.filter(function(a){ return (a.title+' '+a.excerpt).toLowerCase().indexOf(term.toLowerCase()) >= 0; }).slice(0,3);

  let html = '';
  if(brandMatches.length || catMatches.length || guideMatches.length){
    html += '<div class="sec" style="margin-top:16px">';
    catMatches.forEach(function(c){
      html += '<a class="srch-sug" href="#/category/'+c.slug+'" data-act-close><span class="srch-sug-ico">'+c.icon+'</span><span style="flex:1;font-weight:700">'+esc(c.name)+'</span><span class="xs mut">Category</span></a>';

}

const FILTER_STATE = {};
function openFilterSheet(scope){
  const r = parseHash();
  const catSlug = r.query.category || (r.parts[0]==='category' ? r.parts[1] : '');
  const pool = catSlug ? PRODUCTS.filter(function(p){ return p.category === catSlug; }) : PRODUCTS;
