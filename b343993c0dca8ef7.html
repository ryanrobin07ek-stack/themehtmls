  const subsIn = uniq(pool.map(function(p){ return p.subcategory; }));
  const priceMax = Math.ceil(Math.max.apply(null, pool.map(function(p){ return effectivePrice(p); })));

  const cur = {
    brands: (r.query.brands||'').split(',').filter(Boolean),
    subs: (r.query.subs||'').split(',').filter(Boolean),
    min: r.query.min || '', max: r.query.max || '',
    rating: r.query.rating || '',
    deals: r.query.deals === '1',
    newOnly: r.query.newOnly === '1',
    inStock: r.query.inStock === '1',
    pickup: r.query.pickup === '1'
  };

  function bodyHTML(){
    return '<div class="filter-group"><h4>Price range</h4>'+
        '<div class="range-row"><input class="inp" type="number" placeholder="Min" value="'+esc(cur.min)+'" data-f="min" inputmode="numeric"><span class="mut">–</span><input class="inp" type="number" placeholder="Max" value="'+esc(cur.max)+'" data-f="max" inputmode="numeric"></div>'+
        '<div class="chip-row" style="margin-top:10px;flex-wrap:wrap">'+
          [[0,200],[200,500],[500,1000],[1000,2500],[2500,priceMax]].map(function(rr){
            return '<button class="chip" data-act="f-range" data-min="'+rr[0]+'" data-max="'+rr[1]+'">'+money0(rr[0])+' – '+money0(rr[1])+'</button>';
          }).join('')+
        '</div>'+
      '</div>'+
      (subsIn.length > 1 ? '<div class="filter-group"><h4>Type</h4><div class="filter-opts">'+subsIn.map(function(s){
        return '<button class="chip'+(cur.subs.indexOf(s)>=0?' on':'')+'" data-act="f-sub" data-v="'+esc(s)+'">'+esc(s)+'</button>';
      }).join('')+'</div></div>' : '')+
      '<div class="filter-group"><h4>Brand</h4><div class="filter-opts vertical">'+brandsIn.map(function(bs){
        const b = BRANDS.find(function(x){ return x.slug === bs; });
        return '<label class="check"><input type="checkbox" data-f-brand value="'+bs+'" '+(cur.brands.indexOf(bs)>=0?'checked':'')+'><span>'+esc(b?b.name:bs)+'</span></label>';
      }).join('')+'</div></div>'+
      '<div class="filter-group"><h4>Customer rating</h4><div class="filter-opts">'+
        [4.5,4,3.5,3].map(function(rv){
          return '<button class="chip'+(String(cur.rating)===String(rv)?' on':'')+'" data-act="f-rating" data-v="'+rv+'">'+rv+'+ stars</button>';
        }).join('')+
      '</div></div>'+
      '<div class="filter-group"><h4>Availability &amp; offers</h4><div class="filter-opts vertical">'+
        '<label class="check"><input type="checkbox" data-f-flag="deals" '+(cur.deals?'checked':'')+'><span>On sale</span></label>'+
        '<label class="check"><input type="checkbox" data-f-flag="newOnly" '+(cur.newOnly?'checked':'')+'><span>New arrivals</span></label>'+
        '<label class="check"><input type="checkbox" data-f-flag="inStock" '+(cur.inStock?'checked':'')+'><span>In stock at '+esc(getStore().name)+'</span></label>'+
        '<label class="check"><input type="checkbox" data-f-flag="pickup" '+(cur.pickup?'checked':'')+'><span>Available for pickup</span></label>'+
      '</div></div>';
  }

  openSheet('Filters', bodyHTML(),
    '<button class="btn btn-ghost" data-act="f-reset">Reset</button>'+
    '<button class="btn btn-p" data-act="f-apply">Apply filters</button>');

  /* live wiring inside the sheet */
  setTimeout(function(){
    const sheetBody = $('#sheetBody');
    if(!sheetBody) return;
    sheetBody.addEventListener('input', function(ev){
      const t = ev.target;
      if(t.hasAttribute && t.hasAttribute('data-f')){ cur[t.getAttribute('data-f')] = t.value; }
      if(t.hasAttribute && t.hasAttribute('data-f-brand')){
        const v = t.value;
        if(t.checked){ if(cur.brands.indexOf(v)<0) cur.brands.push(v); }
        else { cur.brands = cur.brands.filter(function(x){ return x !== v; }); }
      }
      if(t.hasAttribute && t.hasAttribute('data-f-flag')){ cur[t.getAttribute('data-f-flag')] = t.checked; }
    });
    sheetBody.addEventListener('click', function(ev){
      const b = ev.target.closest('[data-act]');
      if(!b) return;
      const a = b.getAttribute('data-act');
      if(a === 'f-range'){
        cur.min = b.getAttribute('data-min');
        cur.max = b.getAttribute('data-max');
        $('#sheetBody').innerHTML = bodyHTML();
      }
      if(a === 'f-sub'){
        const v = b.getAttribute('data-v');
        if(cur.subs.indexOf(v) >= 0) cur.subs = cur.subs.filter(function(x){ return x !== v; });
        else cur.subs.push(v);
        $('#sheetBody').innerHTML = bodyHTML();
      }
      if(a === 'f-rating'){
        const v = b.getAttribute('data-v');
        cur.rating = String(cur.rating) === v ? '' : v;
        $('#sheetBody').innerHTML = bodyHTML();
      }
      if(a === 'f-reset'){
        cur.brands=[]; cur.subs=[]; cur.min=''; cur.max=''; cur.rating=''; cur.deals=false; cur.newOnly=false; cur.inStock=false; cur.pickup=false;
        $('#sheetBody').innerHTML = bodyHTML();
      }
      if(a === 'f-apply'){
        const q = {};
        if(cur.brands.length) q.brands = cur.brands.join(',');
        if(cur.subs.length) q.subs = cur.subs.join(',');
        if(cur.min) q.min = cur.min;
        if(cur.max) q.max = cur.max;
        if(cur.rating) q.rating = cur.rating;
        if(cur.deals) q.deals = '1';
        if(cur.newOnly) q.newOnly = '1';
        if(cur.inStock) q.inStock = '1';
        if(cur.pickup) q.pickup = '1';
        if(r.query.sort) q.sort = r.query.sort;
        closeAll();
        location.hash = r.path + qs(q);
        const n = Object.keys(q).length;
        toast(n ? 'Filters applied' : 'Filters cleared','ok');
      }
    });
  }, 60);
}

/* ---- Apply query filters to category/shop/search views ---- */
(function patchFilteredViews(){
  ['shop','category','search'].forEach(function(name){
    const orig = VIEWS[name];
    VIEWS[name] = function(params){
      const p = Object.assign({}, params);
      p.brands = (p.brands||'').split(',').filter(Boolean);
      p.subs = (p.subs||'').split(',').filter(Boolean);
      p.attrs = {};
      const html = orig(function(){ return p; }() && p);
      return html;
    };
  });
})();

/* Re-define searchProducts usage: views already call searchProducts with params.
   We inject filter handling into the view render path by rewriting the params
   object before the original function runs. */
function normaliseParams(params){
  const p = Object.assign({}, params);
  const brands = (p.brands||'').split(',').filter(Boolean);
  const subs = (p.subs||'').split(',').filter(Boolean);
  const out = {
    brand: brands,
    subcategory: subs.length === 1 ? subs[0] : undefined,
    priceMin: p.min ? parseFloat(p.min) : undefined,
    priceMax: p.max ? parseFloat(p.max) : undefined,
    rating: p.rating ? parseFloat(p.rating) : undefined,
    deals: p.deals === '1',
    newOnly: p.newOnly === '1',
    inStock: p.inStock === '1',
    pickup: p.pickup === '1',
    sort: p.sort || 'featured'
  };
  if(subs.length > 1){ out.subsList = subs; }
  return out;
}

document.addEventListener('submit', function(e){
  const form = e.target.closest('[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.getAttribute('data-form');
  const fd = new FormData(form);

  switch(kind){
    case 'newsletter': {
      const email = (fd.get('email')||'').toString().trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Please enter a valid email address','err'); return; }
      State.newsletter = {email:email, topics: fd.getAll('topics'), at: Date.now()};
      persist(); toast('Subscribed — welcome to VoltHaus','ok');
      if(currentRoute && currentRoute.view === 'newsletter') render();
      break;
    }
    case 'coupon': {
      const code = (fd.get('code')||'').toString().trim().toUpperCase();
      applyCoupon(code);
      if(currentRoute && (currentRoute.view === 'cart')) render();
      break;
    }
    case 'signin': {
      const email = (fd.get('email')||'').toString().trim();
      const name = (fd.get('name')||'').toString().trim();
      if(!email || !name){ toast('Name and email are required','err'); return; }
      State.account = {name:name, email:email, addresses:[], cards:[], created:new Date().toISOString()};
      persist(); toast('Welcome, '+name.split(' ')[0],'ok'); render();
      break;
    }
    case 'register': {
      const pid = fd.get('productId');
      const p = PRODUCT_INDEX.get(pid);
      if(!p){ toast('Please select a product','err'); return; }
      const store = STORES.find(function(s){ return s.id === fd.get('storeId'); }) || getStore();
      State.registrations.unshift({
        id:'REG-'+Math.floor(Math.random()*90000+10000),
        productId:pid, productName:p.name+' '+p.variantLabel,
        serial:(fd.get('serial')||'').toString().trim(),
        purchaseDate: fd.get('purchaseDate'),
        storeName: store.name,
        email: fd.get('email'),
        created: new Date().toISOString()
      });
      State.loyalty.points += 50;
      State.loyalty.history.unshift({date:new Date().toISOString(), text:'Product registration bonus', points:50});
      persist();
      toast('Product registered — 50 points earned','ok');
      location.hash = '#/warranty';
      break;
    }
    case 'claim': {
      State.tickets.unshift({
        id:'WC-'+Math.floor(Math.random()*90000+10000),
        department:'Warranty', subject:'Warranty claim: '+(fd.get('product')||''),
        message: fd.get('issue'), status:'Open', created:new Date().toISOString()
      });
      persist();
      toast('Claim submitted — reference sent by email','ok');
      location.hash = '#/warranty';
      break;
    }
    case 'repair': {
      const store = STORES.find(function(s){ return s.id === fd.get('store'); }) || getStore();

    }
    case 'tradein': {
      const condition = (fd.get('condition')||'good').toString();

      const base = {phones:520, laptops:640, tablets:340, gaming:290, cameras:480, wearables:180, drones:320}[fd.get('category')] || 300;
      const storageBoost = {'64GB':0.82,'128GB':0.9,'256GB':1,'512GB':1.12,'1TB':1.24,'2TB':1.34}[fd.get('storage')] || 1;

          '<div class="sm mut">'+esc(fd.get('brand'))+' '+esc(fd.get('model'))+' · '+esc(fd.get('storage'))+' · '+esc(condition)+' condition</div>'+
        '</div>'+
        '<div class="card card-p" style="margin-bottom:14px">'+
          '<div class="xs mut" style="line-height:1.6">This is an indicative estimate based on the details you provided. Final value is confirmed after physical inspection, which may adjust the amount. Devices must power on and have all activation locks removed.</div>'+
        '</div>'+
        '<div class="stack sm">'+
          '<div class="row-b"><span class="mut">Inspection</span><b>Free</b></div>'+
          '<div class="row-b"><span class="mut">Payment options</span><b>Instant credit, gift card or bank transfer</b></div>'+
          '<div class="row-b"><span class="mut">Valid for</span><b>14 days</b></div>'+
        '</div>',
        '<button class="btn btn-p" data-act="tradein-accept">Book an inspection</button>','');
      break;
    }
    case 'contact': {
      State.tickets.unshift({
        id:'SR-'+Math.floor(Math.random()*90000+10000),
        department: fd.get('department'),
        subject: fd.get('subject'),
        message: fd.get('message'),
        name: fd.get('name'),
        email: fd.get('email'),
        status:'Open', created:new Date().toISOString()
      });
      persist();
      toast('Message sent — we will reply within 4 hours','ok');
      form.reset();
      break;
    }
    case 'giftcard': {
      const amount = parseFloat(fd.get('amount')) || 100;
      const gc = {
        id:'GC-'+Math.floor(Math.random()*900000+100000),
        amount: amount,
        recipient: fd.get('recipient'),
        email: fd.get('email'),
        from: fd.get('from'),
        message: fd.get('message'),
        deliveryDate: fd.get('deliveryDate'),
        created: new Date().toISOString()
      };
      State.giftCards.push(gc);
      const giftProduct = PRODUCTS.find(function(p){ return p.id === 'p1'; }) || PRODUCTS[0];
      State.cart.push({
        key:'giftcard::'+gc.id, productId: giftProduct.id, qty:1,
        variant:'Gift card '+money(amount)+' for '+gc.recipient,
        price: amount, isGiftCard:true, giftId: gc.id, addedAt: Date.now()
      });
      persist(); updateBadges();
      toast('Gift card added to cart','ok');
      location.hash = '#/cart';
      break;

    case 'address': {
      if(!State.account){ toast('Please sign in first','err'); break; }
      State.account.addresses = State.account.addresses || [];
      const addr = {
        label: fd.get('label') || ('Address '+(State.account.addresses.length+1)),
        name: fd.get('name'), line1: fd.get('line1'), line2: fd.get('line2'),
        city: fd.get('city'), state: fd.get('state'), zip: fd.get('zip'),
        primary: !!fd.get('primary')
      };
      if(addr.primary) State.account.addresses.forEach(function(a){ a.primary = false; });
      State.account.addresses.push(addr);
      persist(); toast('Address saved','ok'); render();
      break;
    }
    case 'card': {
      if(!State.account){ toast('Please sign in first','err'); break; }
      State.account.cards = State.account.cards || [];
      const num = (fd.get('number')||'').toString().replace(/\s/g,'');
      State.account.cards.push({
        brand: num.charAt(0) === '4' ? 'Visa' : num.charAt(0) === '5' ? 'Mastercard' : 'Card',
        last4: num.slice(-4) || '0000',
        expiry: fd.get('expiry'), name: fd.get('cardname')
      });
      persist(); toast('Card saved','ok'); render();
      break;
    }
    default: break;
  }
}, false);

function applyCoupon(code){
  if(!code){ State.coupon = null; persist(); toast('Coupon removed','info'); return; }
  const c = COUPONS.find(function(x){ return x.code === code.toUpperCase(); });
  if(!c){ toast('“'+code+'” is not a valid code','err'); return; }
  const sub = cartSubtotal();
  if(sub < c.min){ toast('Minimum spend of '+money(c.min)+' required','err'); return; }
  State.coupon = c.code;
  persist();
  toast('Coupon applied — '+c.desc,'ok');
}

/* ---- Checkout step saving ---- */
function saveCheckoutStep(step){
  const co = State.checkout;
  if(step === 'contact'){
    const email = $('#co-email'), phone = $('#co-phone');
    const marketing = document.querySelector('input[name="marketing"]');
    if(!email.value || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)){ email.classList.add('err'); toast('Enter a valid email address','err'); return; }
    if(!phone.value){ phone.classList.add('err'); toast('Enter a mobile number','err'); return; }
    co.contact = {email:email.value.trim(), phone:phone.value.trim(), marketing: marketing ? marketing.checked : false};
    co.step = 'address'; persist(); location.hash = '#/checkout/address'; return;
  }
  if(step === 'address'){
    const f = {};
    ['name','line1','line2','city','zip','state'].forEach(function(k){
      const elx = document.getElementById('ad-'+k);
      f[k] = elx ? elx.value.trim() : '';
      if(!f[k] && k !== 'line2'){ if(elx) elx.classList.add('err'); }
    });
    if(!f.name || !f.line1 || !f.city || !f.zip){ toast('Please complete all required address fields','err'); return; }
    const saveEl = document.querySelector('input[name="saveaddr"]');
    f.saved = saveEl ? saveEl.checked : false;
    co.address = f;
    if(f.saved && State.account){
      State.account.addresses = State.account.addresses || [];
      State.account.addresses.push(Object.assign({}, f, {label:'Delivery address'}));
    }
    co.step = 'delivery'; persist(); location.hash = '#/checkout/delivery'; return;
  }
  if(step === 'delivery'){
    const sel = document.querySelector('input[name="delivery"]:checked');
    if(!sel){ toast('Choose a delivery method','err'); return; }
    co.delivery.method = sel.value;
    co.delivery.storeId = State.selectedStore;
    co.step = 'payment'; persist(); location.hash = '#/checkout/payment'; return;
  }
  if(step === 'payment'){
    const sel = document.querySelector('input[name="paymethod"]:checked');
    if(!sel){ toast('Choose a payment method','err'); return; }
    co.payment.method = sel.value;
    if(sel.value === 'card'){
      const num = ($('#pm-num')||{}).value || '';
      const exp = ($('#pm-exp')||{}).value || '';
      const cvc = ($('#pm-cvc')||{}).value || '';
      const nm = ($('#pm-name')||{}).value || '';
      const digits = num.replace(/\D/g,'');
      if(digits.length < 12){ toast('Enter a valid card number (this is a demo — any 12+ digits works)','err'); return; }
      if(!exp){ toast('Enter the card expiry','err'); return; }
      if(cvc.length < 3){ toast('Enter the CVC','err'); return; }
      co.payment = {method:'card', number:digits.slice(-4), expiry:exp, cardname:nm};
    }
    co.step = 'review'; persist(); location.hash = '#/checkout/review'; return;
  }
}

/* ---- Place order ---- */
function placeOrder(){
  const agree = $('#agreeTerms');
  if(agree && !agree.checked){ toast('Please accept the terms of sale','err'); return; }
  if(!State.cart.length){ toast('Your cart is empty','err'); return; }
  const t = cartTotals();
  const co = State.checkout;
  const store = getStore();
  const method = (DELIVERY_OPTIONS.find(function(o){ return o.id === (co.delivery.method||'standard'); }) || DELIVERY_OPTIONS[0]);
  const payLabels = {card:'Credit or debit card', paypal:'PayPal', applepay:'Apple Pay', googlepay:'Google Pay', finance:'Financing', giftcard:'Gift card'};

  const order = {
    id:'VH-'+Math.floor(Math.random()*900000+100000),
    placedAt: new Date().toISOString(),
    items: State.cart.map(function(i){
      const p = PRODUCT_INDEX.get(i.productId);
      return {productId:i.productId, name:p?p.name:'Item', variant:i.variant, qty:i.qty, price:i.price};
    }),
    totals: t,
    contact: co.contact,
    address: co.address,
    delivery: {method: co.delivery.method||'standard', methodName: method.name, slot: co.delivery.slot, storeId: store.id, storeName: store.name},
    paymentLabel: payLabels[(co.payment && co.payment.method) || 'card'],
    coupon: State.coupon,
    storeId: store.id,
    points: Math.round(t.total * CFG.loyaltyPointsPerDollar),
    status: 'Confirmed'
  };

  State.orders.unshift(order);
  State.loyalty.points += order.points;
  State.loyalty.history.unshift({date:order.placedAt, text:'Order '+order.id+' purchase', points: order.points});

  /* clear cart */
  State.cart = [];
  State.coupon = null;
  State.checkout = {step:'cart', contact:co.contact, address:co.address, delivery:{method:'standard', slot:null}, payment:{}, storeId:store.id};
  persist(); updateBadges();
  closeAll();
  location.hash = '#/order/' + order.id + '?placed=1';
}

function reorder(orderId){
  const o = State.orders.find(function(x){ return x.id === orderId; });
  if(!o) return;
  o.items.forEach(function(i){ addToCart(i.productId, i.qty, true); });
  toast('Items added to cart','ok');
  location.hash = '#/cart';
}

function addBundle(bundleId){
  const b = BUNDLES.find(function(x){ return x.id === bundleId; });
  if(!b) return;
  const items = PRODUCTS.filter(function(p){ return p.category === b.cat; }).slice(0,3);
  items.forEach(function(p){ addToCart(p.id, 1, true); });
  toast(b.name+' added — you saved '+money(b.save),'ok');
}

function openReviewForm(id){
  const p = PRODUCT_INDEX.get(id);
  if(!p) return;
  openSheet('Write a review',
    '<div class="field"><label>Your rating</label><div class="chip-row" id="rvStars">'+[1,2,3,4,5].map(function(i){
      return '<button class="chip" data-act="rv-star" data-v="'+i+'">'+i+(i===1?' star':' stars')+'</button>';
    }).join('')+'</div></div>'+
    '<div class="field"><label for="rv-title">Review title</label><input class="inp" id="rv-title" placeholder="Sum it up in a few words"></div>'+
    '<div class="field"><label for="rv-body">Your review</label><textarea class="inp" id="rv-body" placeholder="What did you like or dislike? How did you use it?"></textarea></div>'+
    '<div class="field"><label for="rv-name">Display name</label><input class="inp" id="rv-name" value="'+esc((State.account&&State.account.name)||'')+'"></div>'+
    '<div class="xs mut">Reviews are moderated. Verified purchase badges are applied automatically when we match your order history.</div>',
    '<button class="btn btn-p" data-act="rv-submit" data-id="'+id+'">Submit review</button>','');
}
document.addEventListener('click', function(e){
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const a = b.getAttribute('data-act');
  if(a === 'rv-star'){
    $$('#rvStars .chip').forEach(function(c){ c.classList.remove('on'); });
    b.classList.add('on');
  }
  if(a === 'rv-submit'){
    const rating = $$('#rvStars .chip.on').length || 5;
    State.loyalty.points += 50;
    State.loyalty.history.unshift({date:new Date().toISOString(), text:'Product review bonus', points:50});
    persist();
    closeAll();
    toast('Review submitted — 50 points earned','ok');
  }
  if(a === 'tradein-accept'){
    closeAll();
    toast('Inspection booked — confirmation sent by email','ok');
  }
}, false);

/* ==========================================================================
   18. ANIMATIONS
   ========================================================================== */
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let gsapReady = false;

function gsapLoad(){
  if(gsapReady) return true;
  if(window.gsap){ gsapReady = true; }
  return gsapReady;
}
function pageEnter(){
  if(REDUCED || !gsapLoad()) return;
  const view = document.querySelector('.view');
  if(!view) return;
  const kids = Array.prototype.slice.call(view.children).slice(0, 6);
  if(!kids.length) return;
  window.gsap.fromTo(kids,
    {opacity:0, y:16},
    {opacity:1, y:0, duration:.42, ease:'power2.out', stagger:.05, clearProps:'opacity,transform', overwrite:true}
  );
}
let revealTriggers = [];
function initReveals(){
  if(REDUCED || !gsapLoad() || !window.ScrollTrigger) return;
  const els = $$('[data-reveal]').filter(function(el){ return !el.__revealed; });
  if(!els.length) return;
  window.ScrollTrigger.batch(els, {
    start:'top 92%',
    onEnter: function(batch){
      batch.forEach(function(el){ el.__revealed = true; });
      window.gsap.to(batch, {opacity:1, y:0, duration:.55, ease:'power2.out', stagger:.07, clearProps:'opacity,transform'});
    }
  });
  els.forEach(function(el){ el.classList.add('reveal-init'); });
}
let parallaxTriggers = [];
function initParallax(){
  if(REDUCED || !gsapLoad() || !window.ScrollTrigger) return;
  const els = $$('[data-parallax]');
  els.forEach(function(el){
    const tw = window.gsap.to(el, {
      yPercent:-10, ease:'none',
      scrollTrigger:{trigger:el.parentElement||el, start:'top bottom', end:'bottom top', scrub:true}
    });
    parallaxTriggers.push(tw);
  });
}
function refreshScrollTriggers(){
  if(!gsapLoad() || !window.ScrollTrigger) return;
  try { window.ScrollTrigger.refresh(); } catch(e){}
}
function killScrollTriggers(){
  if(!window.ScrollTrigger) return;
  try {
    window.ScrollTrigger.getAll().forEach(function(t){ t.kill(); });
  } catch(e){}
  revealTriggers = [];
  parallaxTriggers = [];
}
/* re-init on script load (deferred) */
window.addEventListener('load', function(){
  if(gsapLoad() && window.ScrollTrigger){
    window.gsap.registerPlugin(window.ScrollTrigger);
    window.ScrollTrigger.config({ignoreMobileResize:true});
    initReveals();
    initParallax();
    refreshScrollTriggers();
  }
});

}
